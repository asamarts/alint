[package]
name = "xtask"
description = "Cargo-xtask helpers for alint (bench, release, etc.)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false
autotests = false

[[bin]]
name = "xtask"
path = "src/main.rs"

# All integration tests build into one binary: tests/main.rs declares each
# file as a module (docs/design/build-dev-loop.md, section 2).
[[test]]
name = "it"
path = "tests/main.rs"

[dependencies]
alint-bench.workspace = true
alint-core.workspace = true
alint-dsl.workspace = true
alint-rules.workspace = true
alint-testkit.workspace = true
anyhow.workspace = true
clap.workspace = true
regex.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
ayaml.workspace = true
tempfile.workspace = true

[dev-dependencies]
jsonschema.workspace = true

[lints]
workspace = true
