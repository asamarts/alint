[workspace]
resolver = "3"
members = [
    "crates/alint-core",
    "crates/alint-dsl",
    "crates/alint-rules",
    "crates/alint-output",
    "crates/alint-lsp",
    "crates/alint",
    "crates/alint-bench",
    "crates/alint-testkit",
    "crates/alint-witforge-consumer",
    "crates/alint-e2e",
    "xtask",
]
# `cargo run` without -p defaults to the CLI; xtask is explicit-only.
default-members = ["crates/alint"]

[workspace.package]
version = "0.23.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/asamarts/alint"
authors = ["alint contributors"]

[workspace.dependencies]
alint-core = { path = "crates/alint-core", version = "0.23.0" }
alint-dsl = { path = "crates/alint-dsl", version = "0.23.0" }
alint-rules = { path = "crates/alint-rules", version = "0.23.0" }
alint-output = { path = "crates/alint-output", version = "0.23.0" }
alint-lsp = { path = "crates/alint-lsp", version = "0.23.0" }
alint-bench = { path = "crates/alint-bench", version = "0.23.0" }
alint-testkit = { path = "crates/alint-testkit", version = "0.23.0" }

thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Casts between alint_core::yaml's types and the parser's, behind private
# functions (ADR-0038). Already in the graph through schemars.
ref-cast = "1.0.25"
ayaml = { version = "=0.2.3", features = ["libyaml-compat"] }
# The parser v0.22 read YAML with: the oracle of the differential YAML harness
# (#482), a dev-dependency of alint-core, and the reference backend behind
# alint-core's test-only `yaml-reference` feature (#530, ADR-0041).
yaml_serde = "=0.10.7"
globset = "0.4"
# 0.4.34: `walker::would_walk_skip` mirrors its linked-worktree exclude file.
ignore = "0.4.34"
regex = "1"
# Pattern parsing for the load-time anchor hints on content patterns
# (alint-core `pattern_hints`). Already in the tree via `regex`, so this
# promotes an existing transitive crate to a direct dep, adding none.
regex-syntax = "0.8"
# Multi-pattern linear string matcher for `EnvironmentRedactor`
# (alint-core `config_redaction`). Already in the tree via `regex`, so this
# promotes an existing transitive crate to a direct dep, adding none.
aho-corasick = "1"
rayon = "1"
parking_lot = "0.12"
clap = { version = "4", features = ["derive", "cargo", "env", "wrap_help"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
# CommonMark parser for `markdown_links_resolve`. Disable the CLI/HTML default
# features: the rule only needs the event stream, source spans, and reference
# definition table.
pulldown-cmark = { version = "0.13.6", default-features = false }
# Unicode category filtering for GitHub-compatible Markdown heading slugs.
unicode-general-category = "1.1"
# Offline SPDX License List identifiers and strict expression parser for
# `spdx_identifier_valid`; no optional detection/regex features and no network.
spdx = { version = "0.13.6", default-features = false }
anyhow = "1"
jsonschema = { version = "0.61", default-features = false }
schemars = "1"
criterion = "0.8"
rand = "0.10"
rand_chacha = "0.10"
tempfile = "3"
dir-test = "0.4"
proptest = "1"
# Test-only: the `plugin_api` import-boundary test parses the module and visits
# every path. proc-macro2 is already in the tree through the derive macros,
# which still use syn 2, so syn 3 is a second copy that only tests build.
syn = { version = "3", features = ["full", "visit"] }
proc-macro2 = "1"
# Test-only: a counting global allocator for alint-core's YAML memory test
# (ADR-0042), which cannot implement one itself under `unsafe_code = "forbid"`.
# MIT OR Apache-2.0, no dependencies. It counts a reallocation by the bytes it
# adds, as the allocator it wraps may grow a block in place.
cap = { version = "0.1.2", features = ["stats"] }
trycmd = "1"
ureq = { version = "3", default-features = false, features = ["rustls"] }
sha2 = "0.11"
anstyle = "1"
anstream = "1"
supports-hyperlinks = "3"
terminal_size = "0.4"
indicatif = "0.18"
portable-pty = "0.9"
serde_json_path = "0.7"
toml = "1.1"
# Round-trip TOML CST for the Phase-2 structured `set_value`/`remove_value`
# fixers (alint-core `structured_fix`). Same license as `toml` (MIT OR
# Apache-2.0) and already in the tree -- the `toml` crate is built on it -- so
# this promotes an existing transitive crate to a direct dep, adding none.
toml_edit = "0.25"
# SIMD byte search for the per-file content scanners (the lead-byte prefilter in
# `no_zero_width_chars` / `no_bidi_controls`, line splitting in
# `max_consecutive_blank_lines`). Already in the tree via `regex`, so this
# promotes an existing transitive crate to a direct dep, adding none.
memchr = "2"
# The effective user id (Unix) and `O_NONBLOCK` open flags (Unix) for
# ownership checks of config/Git discovery and TOCTOU-safe ignore-file opens.
# Already in the tree through tempfile and terminal_size, so this promotes an
# existing transitive crate to a direct dep, adding none.
rustix = { version = "1.1", default-features = false, features = ["std", "process", "fs"] }
# Lossless literal `.env` parsing, diagnostics, spans, and native verified edits
# for `Format::Dotenv` (alint-core `dotenv`, `structured_fix`). Extracted from
# alint into asamarts/adotenv; no runtime dependencies of its own.
adotenv = "1.6.0"
# Span-capable JSONC AST for the Phase-2 structured `set_value`/`remove_value`
# fixers (alint-core `structured_fix`): `parse_to_ast` yields node byte ranges, so
# JSON edits are span-splices (disjoint, one-pass) and JSONC comments / trailing
# commas survive. The check side parses JSON via serde_json (+ `strip_jsonc`); this
# is the fix side's spanned view.
jsonc-parser = { version = "0.34.0", features = ["cst"] }
# Test-only YAML 1.2 reference parsers (ADR-0036, ADR-0041): never compiled
# into default release builds (enforced by `ci/scripts/yaml-reference-gate.sh`).
# `saphyr` is enabled only under `alint-core`'s test-only `yaml-reference`
# feature (and `[dev-dependencies]`) for differential voting against `ayaml`
# and `yaml_serde`; `saphyr-parser` is in `[dev-dependencies]` for event-stream
# differential checks. MIT OR Apache-2.0 (same as the workspace).
# Pinned because `saphyr-parser`'s pre-1.0 `Marker.index` is a CHAR offset.
# `default-features = false` drops `encoding` (`load_from_read` only; we load `&str`).
saphyr = { version = "=0.3.3", default-features = false }
saphyr-parser = { version = "=0.3.4", default-features = false }
roxmltree = "0.21.2"
hcl = { package = "hcl-rs", version = "0.18" }
# Line-level unified diffs for `alint fix --diff`.
similar = "3"

# LSP server, slated for v0.11. Crate-choice rationale (`tower-lsp`
# over `lsp-server`) is in `docs/design/v0.11/lsp_server.md`.
# Dormant until `crates/alint-lsp/` lands — listed here so the
# version pin is reviewed with the rest of the workspace deps, but
# `cargo build` won't pull it (no crate depends on it yet).
#
# History (in case the doc paths look odd): the design pass landed
# in v0.9.7 under `docs/design/v0.10/`. When v0.10's scope was
# re-cut to case-study coverage, the LSP work moved to v0.11 and
# the design docs were relocated to `docs/design/v0.11/` (the
# move itself shipped in v0.9.22).
tower-lsp = "0.20"
# The `Service` trait, to wrap the tower-lsp service so `exit` stops the
# server promptly (already in the tree via tower-lsp).
tower-service = "0.3"
# Async runtime for the LSP server (tower-lsp is async). Only
# `crates/alint-lsp` pulls it in; the CLI enters the runtime via the
# `lsp` subcommand.
tokio = { version = "1", features = ["rt-multi-thread", "io-std", "macros", "sync"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unused_must_use = "deny"
# `cfg(kani)` is set by the Kani verifier (`cargo kani`), not cargo, so
# declare it known to silence `unexpected_cfgs` in normal builds. See the
# `#[cfg(kani)]` proof harnesses (docs/design/formal-methods.md).
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Bench profile: gungraun's deterministic (Valgrind) benches need symbols for the
# `--toggle-collect=<bench-fn>` collection toggle, and LTO must not inline the
# toggle target away. Release strips symbols + thin-LTOs, so override here. The
# absolute counts are bench-profile (not release-identical), which is fine for a
# RELATIVE gate (delta vs a same-profile baseline). The end-to-end `det_check`
# binary bench measures the real release `alint` binary, so it stays
# release-representative. See docs/design/deterministic-perf-gating.md.
[profile.bench]
strip = false
debug = "line-tables-only"
lto = false
codegen-units = 1
