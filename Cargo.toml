[workspace]
resolver = "3"
members = [
    "crates/alint-core",
    "crates/alint-dsl",
    "crates/alint-rules",
    "crates/alint-output",
    "crates/alint-lsp",
    "crates/alint",
    "crates/alint-bench",
    "crates/alint-testkit",
    "crates/alint-e2e",
    "xtask",
]
# `cargo run` without -p defaults to the CLI; xtask is explicit-only.
default-members = ["crates/alint"]

[workspace.package]
version = "0.15.2"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/asamarts/alint"
authors = ["alint contributors"]

[workspace.dependencies]
alint-core = { path = "crates/alint-core", version = "0.15.0" }
alint-dsl = { path = "crates/alint-dsl", version = "0.15.0" }
alint-rules = { path = "crates/alint-rules", version = "0.15.0" }
alint-output = { path = "crates/alint-output", version = "0.15.0" }
alint-lsp = { path = "crates/alint-lsp", version = "0.15.0" }
alint-bench = { path = "crates/alint-bench", version = "0.15.0" }
alint-testkit = { path = "crates/alint-testkit", version = "0.15.0" }

thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
globset = "0.4"
ignore = "0.4"
regex = "1"
rayon = "1"
parking_lot = "0.12"
clap = { version = "4", features = ["derive", "cargo", "env", "wrap_help"] }
miette = { version = "7", features = ["fancy"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
content_inspector = "0.2"
anyhow = "1"
jsonschema = { version = "0.50", default-features = false }
schemars = "1"
criterion = "0.8"
rand = "0.10"
rand_chacha = "0.10"
tempfile = "3"
dir-test = "0.4"
proptest = "1"
trycmd = "1"
ureq = { version = "3", default-features = false, features = ["rustls"] }
sha2 = "0.11"
directories = "6"
anstyle = "1"
anstream = "1"
supports-hyperlinks = "3"
terminal_size = "0.4"
indicatif = "0.18"
portable-pty = "0.9"
serde_json_path = "0.7"
toml = "1.1"
roxmltree = "0.20"
java-properties = "2"

# LSP server, slated for v0.11. Crate-choice rationale (`tower-lsp`
# over `lsp-server`) is in `docs/design/v0.11/lsp_server.md`.
# Dormant until `crates/alint-lsp/` lands — listed here so the
# version pin is reviewed with the rest of the workspace deps, but
# `cargo build` won't pull it (no crate depends on it yet).
#
# History (in case the doc paths look odd): the design pass landed
# in v0.9.7 under `docs/design/v0.10/`. When v0.10's scope was
# re-cut to case-study coverage, the LSP work moved to v0.11 and
# the design docs were relocated to `docs/design/v0.11/` (the
# move itself shipped in v0.9.22).
tower-lsp = "0.20"
# Async runtime for the LSP server (tower-lsp is async). Only
# `crates/alint-lsp` pulls it in; the CLI enters the runtime via the
# `lsp` subcommand.
tokio = { version = "1", features = ["rt-multi-thread", "io-std", "macros", "sync"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unused_must_use = "deny"
# `cfg(kani)` is set by the Kani verifier (`cargo kani`), not cargo, so
# declare it known to silence `unexpected_cfgs` in normal builds. See the
# `#[cfg(kani)]` proof harnesses (docs/design/formal-methods.md).
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Bench profile: gungraun's deterministic (Valgrind) benches need symbols for the
# `--toggle-collect=<bench-fn>` collection toggle, and LTO must not inline the
# toggle target away. Release strips symbols + thin-LTOs, so override here. The
# absolute counts are bench-profile (not release-identical), which is fine for a
# RELATIVE gate (delta vs a same-profile baseline). The end-to-end `det_check`
# binary bench measures the real release `alint` binary, so it stays
# release-representative. See docs/design/deterministic-perf-gating.md.
[profile.bench]
strip = false
debug = "line-tables-only"
lto = false
codegen-units = 1
