[package]
name = "alint-zed"
version = "0.13.0"
edition = "2021"
publish = false
license = "Apache-2.0 OR MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
# Pin to a zed_extension_api version Zed's registry builds against (Zed
# bumps the wasm ABI). The editors CI job compile-checks this pin via
# `cargo build --target wasm32-wasip1`; re-confirm it matches the
# registry's toolchain before publishing.
zed_extension_api = "0.6.0"

# Standalone workspace so the parent alint Cargo workspace doesn't try to
# absorb this wasm cdylib crate (different target, separate Cargo.lock).
[workspace]
