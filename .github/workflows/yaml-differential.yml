name: YAML differential

# The long run of the differential YAML harness (#482, docs/design/yaml-parser.md): ayaml
# against yaml_serde 0.10.7, the parser v0.22 used, over 300,000 generated inputs, the
# repository's YAML files and 20 mutations of each. A difference that
# crates/alint-core/src/yaml_differential/allowlist.rs does not document fails the job.
#
# Every pull request already makes the bounded run, an ordinary test in `cargo test`. This
# job runs the long one on a pull request that touches YAML parsing or the lockfile, with
# seed 1; weekly, with the run number as its seed, so each week reads new inputs; and on
# dispatch, with the seed and size given. The Markdown report goes to the job summary and an
# artifact; its title names the seed, which reproduces a failure locally (see the module
# documentation of crates/alint-core/src/yaml_differential.rs).
on:
  pull_request:
    paths:
      - "crates/alint-core/src/yaml*.rs"
      - "crates/alint-core/src/yaml_differential/**"
      - "crates/alint-core/src/structured_format/yaml_value.rs"
      - "Cargo.lock"
      - ".github/workflows/yaml-differential.yml"
  schedule:
    # Tuesdays 06:00 UTC.
    - cron: "0 6 * * 2"
  workflow_dispatch:
    inputs:
      seed:
        description: "Seed of the generated inputs and mutations"
        required: false
        default: "1"
      inputs:
        description: "Number of generated inputs"
        required: false
        default: "300000"

permissions:
  contents: read

concurrency:
  group: yaml-differential-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  long-run:
    name: Differential YAML long run
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: yaml-differential
      - name: the long run
        env:
          ALINT_YAML_DIFF_SEED: ${{ github.event_name == 'schedule' && github.run_number || inputs.seed || '1' }}
          ALINT_YAML_DIFF_INPUTS: ${{ inputs.inputs || '300000' }}
        run: |
          export ALINT_YAML_DIFF_REPORT="$RUNNER_TEMP/yaml-differential.md"
          cargo test --release --locked -p alint-core --lib \
            yaml_differential::tests::long_run -- --ignored --exact
      - name: the report
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/yaml-differential.md" ]; then
            cat "$RUNNER_TEMP/yaml-differential.md" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: upload the report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: yaml-differential-${{ github.run_id }}
          path: ${{ runner.temp }}/yaml-differential.md
          retention-days: 30
          if-no-files-found: ignore
