name: CI

on:
  push:
    branches: [main, master]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # These three are mirrored verbatim across ci.yml, coverage.yml,
  # release.yml, cross-platform.yml. GitHub Actions has no clean
  # cross-workflow env mechanism (a composite action can't set env
  # for sibling steps), so they're duplicated by necessity — keep
  # them identical when editing any one.
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUSTFLAGS: "-D warnings"

# ─────────────────────────────────────────────────────────────────────
jobs:

  # ── Change detection + runner routing ─────────────────────────────
  # SECURITY (audit H6): this entry job runs on ubuntu-latest, never the
  # self-hosted box — it's the first job a fork PR reaches and it checks out
  # (untrusted) PR code. It routes every downstream job's runner from the
  # IMMUTABLE `head.repo.fork` context: a fork PR → ephemeral ubuntu-latest;
  # anything trusted (push / tag / same-repo PR) → the warm self-hosted box.
  # The decision is taken from context, NOT from a checked-out script — see
  # docs/design/v0.14/ci-fork-pr-isolation.md.
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.detect.outputs.rust }}
      docs: ${{ steps.detect.outputs.docs }}
      bench: ${{ steps.detect.outputs.bench }}
      examples: ${{ steps.detect.outputs.examples }}
      editors: ${{ steps.detect.outputs.editors }}
      runner: ${{ steps.route.outputs.runner }}
      untrusted: ${{ steps.route.outputs.untrusted }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Routing runs FIRST and writes to its OWN step output, which the
      # (untrusted) detect step below cannot touch — so a fork's
      # detect-changes.sh can never force the downstream jobs onto the box.
      # Trust is decided by full_name equality and fails CLOSED: a non-PR
      # event (push/tag), or a PR whose head repo IS this repo (a collaborator
      # branch), is trusted → self-hosted. A fork — OR a null/absent head.repo
      # (a deleted/detached fork) — is untrusted → ephemeral ubuntu-latest.
      # (`== github.repository`, not the `fork` bit, so it also stays correct
      # were this repo itself a fork.)
      - id: route
        env:
          IS_TRUSTED: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          if [ "$IS_TRUSTED" = "true" ]; then
            echo 'runner=["self-hosted","linux","alint"]' >> "$GITHUB_OUTPUT"
            echo 'untrusted=false' >> "$GITHUB_OUTPUT"
          else
            echo 'runner=["ubuntu-latest"]' >> "$GITHUB_OUTPUT"
            echo 'untrusted=true' >> "$GITHUB_OUTPUT"
          fi
      - id: detect
        env:
          GH_EVENT: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: ci/scripts/detect-changes.sh

  # ── Rust pipeline ─────────────────────────────────────────────────
  fmt:
    name: Format
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ${{ fromJSON(needs.changes.outputs.runner) }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ci-fmt
      - run: ci/scripts/fmt.sh

  clippy:
    name: Clippy
    needs: [changes, fmt]
    if: >-
      !cancelled() && !failure()
      && needs.changes.outputs.rust == 'true'
    runs-on: ${{ fromJSON(needs.changes.outputs.runner) }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ci-clippy
      - run: ci/scripts/clippy.sh

  test:
    name: Test
    needs: [changes, fmt]
    if: >-
      !cancelled() && !failure()
      && needs.changes.outputs.rust == 'true'
    runs-on: ${{ fromJSON(needs.changes.outputs.runner) }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ci-test
      - run: ci/scripts/test.sh

  audit:
    name: Audit
    needs: [changes, fmt]
    if: >-
      !cancelled() && !failure()
      && needs.changes.outputs.rust == 'true'
    runs-on: ${{ fromJSON(needs.changes.outputs.runner) }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ci-audit
      - run: ci/scripts/audit.sh

  deny:
    name: Deny
    needs: [changes, fmt]
    if: >-
      !cancelled() && !failure()
      && needs.changes.outputs.rust == 'true'
    runs-on: ${{ fromJSON(needs.changes.outputs.runner) }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ci-deny
      - run: ci/scripts/deny.sh

  build:
    name: Build
    needs: [changes, clippy, test]
    if: >-
      !cancelled() && !failure()
      && needs.changes.outputs.rust == 'true'
    runs-on: ${{ fromJSON(needs.changes.outputs.runner) }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ci-build
      - run: ci/scripts/build.sh

  docs:
    name: Docs
    needs: [changes, fmt]
    # Runs on `docs` changes too, not just `rust`: docs.sh carries the
    # gen-{schema,facts,arch} --check and docs-export --check gates, and the
    # artifacts they guard (facts.json, docs/design/architecture/**, and the
    # docs bundle from docs/rules.md) live under `docs`/root paths that don't
    # flip `rust`. Without the `docs` clause, a PR hand-editing a generated
    # artifact would skip this job and merge stale (the gate bypass the
    # 2026-06-11 review found).
    if: >-
      !cancelled() && !failure()
      && (needs.changes.outputs.rust == 'true' || needs.changes.outputs.docs == 'true')
    runs-on: ${{ fromJSON(needs.changes.outputs.runner) }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ci-docs
      # Ephemeral fork-PR path only: the box's runner image already ships
      # Node 22, but a fresh ubuntu-latest needs it so docs.sh's
      # `likec4 validate` + `gen-mermaid --check` gates run (they fetch
      # likec4 via `npx -y likec4@<pin>`). Skipped on the box.
      - if: needs.changes.outputs.untrusted == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: "22"
      # Load-bearing for schema/parser/contract correctness; must catch drift
      # on a PR, not only post-merge.
      - run: ci/scripts/docs.sh

  dogfood:
    name: Dogfood
    needs: [changes, build]
    if: >-
      !cancelled() && !failure()
      && needs.changes.outputs.rust == 'true'
    runs-on: ${{ fromJSON(needs.changes.outputs.runner) }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ci-dogfood
      - run: ci/scripts/dogfood.sh
      # The README's demo GIF is generated from demo/alint.tape, so a rule or
      # fixer change can silently turn it into a lie on our main discovery
      # surface. dogfood.sh has already built target/release/alint, so replay
      # the tape's command sequence and pin what it actually does.
      - run: ci/scripts/demo-drift.sh

  # ── Bench smoke ───────────────────────────────────────────────────
  bench-smoke:
    name: Bench Smoke
    needs: [changes, build]
    # `untrusted != 'true'` keeps this box-only job off fork PRs (they route
    # to ubuntu-latest, where a bench job is meaningless).
    if: >-
      !cancelled() && !failure()
      && needs.changes.outputs.bench == 'true'
      && needs.changes.outputs.untrusted != 'true'
    runs-on: ${{ fromJSON(needs.changes.outputs.runner) }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ci-bench-smoke
      - run: ci/scripts/bench-smoke.sh

  # ── Deterministic perf gate ───────────────────────────────────────
  # Load-immune instruction / cache / branch counts (Valgrind) for the PR vs its
  # merge-base, built + benched in this same run. Unlike wall-clock bench-scale,
  # it is NOT affected by the shared runner's co-tenant load, so it can gate
  # every rust-touching PR deterministically. Advisory (DET_PERF_ADVISORY=1)
  # during rollout — flip to "0" to enforce. Design:
  # docs/design/deterministic-perf-gating.md.
  perf-gate:
    name: Perf Gate (deterministic)
    needs: [changes, build]
    # `untrusted != 'true'` keeps this box-only (Valgrind) job off fork PRs.
    if: >-
      !cancelled() && !failure()
      && github.event_name == 'pull_request'
      && needs.changes.outputs.rust == 'true'
      && needs.changes.outputs.untrusted != 'true'
    runs-on: ${{ fromJSON(needs.changes.outputs.runner) }}
    env:
      # Advisory: a perf regression annotates but does not fail the job. When
      # flipping this to "0" (enforcing), also add `perf-gate` to the `summary`
      # job's `needs:` so a failed gate is reflected in the aggregate Summary.
      DET_PERF_ADVISORY: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ci-perf-gate
      - env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: ci/scripts/det-perf-gate.sh

  # ── Examples validate ────────────────────────────────────────────
  # Run `alint validate-config` against every examples/*/.alint.yml.
  # Catches schema regressions in the 30 case-study configs (visible
  # at alint.org/examples/) that would otherwise only surface when a
  # contributor copy-pasted one as a starting point.
  examples:
    name: Examples
    needs: [changes, build]
    if: >-
      !cancelled() && !failure()
      && needs.changes.outputs.examples == 'true'
    runs-on: ${{ fromJSON(needs.changes.outputs.runner) }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ci-examples
      - run: ci/scripts/examples-validate.sh

  # ── Shell tests ───────────────────────────────────────────────────
  # Run shell-script test harnesses (test-*.sh under ci/scripts/) in
  # their own job. Split out from the Rust `Test` job so a homebrew-
  # formula golden drift doesn't blame the Rust test suite.
  shell-tests:
    name: Shell Tests
    needs: changes
    if: >-
      !cancelled() && !failure()
      && needs.changes.outputs.rust == 'true'
    runs-on: ${{ fromJSON(needs.changes.outputs.runner) }}
    steps:
      - uses: actions/checkout@v7
      - run: ci/scripts/shell-tests.sh

  # ── Editor extensions ─────────────────────────────────────────────
  # Build the packaged extensions that otherwise only build at release
  # time: typecheck + bundle the VS Code TS extension, wasm-build the Zed
  # extension, and build the JetBrains plugin (compiles against LSP4IJ +
  # the IntelliJ SDK). GitHub-hosted runner (needs Node + the wasm target
  # + a full JDK 17). setup-gradle caches the IntelliJ SDK between runs.
  editors:
    name: Editors (VS Code + Zed + JetBrains)
    needs: changes
    if: >-
      !cancelled() && !failure()
      && needs.changes.outputs.editors == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: VS Code — install, typecheck, bundle
        working-directory: editors/vscode
        run: |
          npm ci
          npm run check-types
          npm run build
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1
      - name: Zed — wasm build
        working-directory: editors/zed
        run: cargo build --release --target wasm32-wasip1
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
      - name: JetBrains — build + verify plugin
        working-directory: editors/jetbrains
        run: ./gradlew buildPlugin verifyPlugin --no-daemon

  # ── Summary report ───────────────────────────────────────────────
  summary:
    name: Summary
    if: always()
    needs:
      - changes
      - fmt
      - clippy
      - test
      - audit
      - deny
      - build
      - docs
      - dogfood
      - bench-smoke
      - examples
      - shell-tests
      - editors
    # Defensive default: `summary` is `if: always()`, so it evaluates runs-on
    # even when `changes` is cancelled before the route step (empty `runner`);
    # fall back to ubuntu-latest so a clean cancel can't fail on fromJSON('').
    runs-on: ${{ needs.changes.outputs.runner && fromJSON(needs.changes.outputs.runner) || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7
      - env:
          RUST_CHANGED: ${{ needs.changes.outputs.rust }}
          DOCS_CHANGED: ${{ needs.changes.outputs.docs }}
          BENCH_CHANGED: ${{ needs.changes.outputs.bench }}
          EXAMPLES_CHANGED: ${{ needs.changes.outputs.examples }}
          EDITORS_CHANGED: ${{ needs.changes.outputs.editors }}
          FMT_RESULT: ${{ needs.fmt.result }}
          CLIPPY_RESULT: ${{ needs.clippy.result }}
          TEST_RESULT: ${{ needs.test.result }}
          AUDIT_RESULT: ${{ needs.audit.result }}
          DENY_RESULT: ${{ needs.deny.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          DOCS_JOB_RESULT: ${{ needs.docs.result }}
          DOGFOOD_RESULT: ${{ needs.dogfood.result }}
          BENCH_SMOKE_RESULT: ${{ needs.bench-smoke.result }}
          EXAMPLES_RESULT: ${{ needs.examples.result }}
          SHELL_TESTS_RESULT: ${{ needs.shell-tests.result }}
          EDITORS_RESULT: ${{ needs.editors.result }}
        run: ci/scripts/summary.sh
