# Kani bounded-proof job (Phase 5 / WS4, docs/design/formal-methods.md).
#
# Runs every `#[kani::proof]` harness in alint-core: the path-confinement
# policy proof (pathsafe.rs) and the located-edit overlap-skip disjointness
# proof (located_fix.rs). Kept OFF the PR path and on a weekly schedule +
# manual dispatch, because model-checking time should never block a merge
# — the proptest properties on the PR path are the always-on behaviour
# spec; this is the deeper, slower guarantee.
name: Kani proofs

on:
  schedule:
    # Mondays 06:00 UTC.
    - cron: "0 6 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: kani-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kani:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Run Kani proofs
        # The official v1 wrapper parses the second word of `kani --version`.
        # Kani 0.68 prints `Kani Rust Verifier <version>`, so the wrapper rejects
        # the version it just installed. Keep the same official crates.io setup
        # path, but run it directly until the wrapper accepts current output.
        run: |
          cargo +stable install --locked --version 0.68.0 kani-verifier
          cargo-kani setup
          # Target alint-core, where every #[kani::proof] lives (alint-rules has
          # none, so the original "-p alint-rules" verified zero harnesses and
          # passed vacuously). No --harness filter: new proofs run automatically.
          cargo-kani -p alint-core
