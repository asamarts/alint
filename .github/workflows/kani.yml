# Kani bounded-proof job (Phase 5 / WS4, docs/design/formal-methods.md).
#
# Runs every `#[kani::proof]` harness in alint-core: the path-confinement
# policy proof (pathsafe.rs) and the located-edit overlap-skip disjointness
# proof (located_fix.rs). Kept OFF the PR path and on a weekly schedule +
# manual dispatch, because model-checking time should never block a merge
# — the proptest properties on the PR path are the always-on behaviour
# spec; this is the deeper, slower guarantee.
name: Kani proofs

on:
  schedule:
    # Mondays 06:00 UTC.
    - cron: "0 6 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: kani-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kani:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Run Kani proofs
        uses: model-checking/kani-github-action@2534b7aeb3c6b4b0a5ecc3981bb3e63d47b5b126 # v1
        with:
          # Target alint-core, where every #[kani::proof] lives (alint-rules has
          # none, so the original "-p alint-rules" verified ZERO harnesses and
          # passed vacuously — R-KANI). No --harness filter, so a newly added
          # proof runs here automatically. The anti-vacuous guard is now the
          # always-on `kani_proofs_present` test (crates/alint-core/tests/): it
          # reds normal PR CI if the proof set is ever emptied, so a vacuous
          # weekly run can't reach main unnoticed.
          args: "-p alint-core"
