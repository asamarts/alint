name: Docs bundle

on:
  push:
    # Two triggers, same job:
    # - **main**: rolling-latest. Every commit to main rebuilds
    #   the bundle so docs stay current with the working tree
    #   between releases.
    # - **tags `v*`**: release-time guarantee. Even if a tag is
    #   pushed at an older commit (or the prior main-push bundle
    #   build failed), the tag push re-runs the bundle so the
    #   release flow always ends with fresh docs on alint.org.
    #   Treats docs as a sixth distribution channel alongside
    #   crates.io / npm / Docker / Homebrew / GH Release.
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    # Lets the alint.org repo (or a maintainer) re-trigger a
    # rebuild without a code change — useful when only a brand-
    # new alint.org consumer is being onboarded.

permissions:
  contents: write   # required to push to the docs-bundle branch

concurrency:
  # Coalesce rapid main-branch pushes — only one bundle build at
  # a time per ref, and a newer push cancels an older still-
  # running one. The tag-push trigger uses a separate group so a
  # release-time bundle build can't get cancelled by an immediate
  # follow-up main push (or vice versa).
  group: docs-bundle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bundle:
    name: Build + push docs bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # Full history + tags: the bundle is built from the latest
          # *release* tag (next step), not the ref that triggered the
          # run, so the tags must be present.
          fetch-depth: 0

      - name: Check out the latest published release
        # The docs bundle — and therefore alint.org — documents the
        # latest *released* alint, not main. Between releases, main can
        # be ahead (new rule kinds, new bundled rulesets); those must
        # not surface on the site as if they had shipped. Building
        # docs-export from the release tag makes the manifest's version
        # AND its rule-kind / ruleset counts match what users can
        # actually install. `releases/latest` excludes drafts and
        # prereleases, matching alint.org's check-version-pins.sh.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          LATEST_TAG="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name)"
          echo "Building docs bundle from latest release: ${LATEST_TAG}"
          git checkout --detach "${LATEST_TAG}"
          echo "BUNDLE_SOURCE=${LATEST_TAG}" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: docs-bundle

      - name: Overlay main-tracked docs (reference + design)
        run: |
          set -euo pipefail
          # docs-export (next step) builds from the release TAG checked out
          # above, but docs/site/reference is hand-written reference for
          # already-released behaviour (e.g. the output formats). Overlaying it
          # from main lets reference-doc additions and fixes ship without
          # waiting for the next release. Keep reference pages to released
          # behaviour so this can't surface anything unreleased; all other
          # docs/site prose stays pinned to the tag, so count- or version-
          # sensitive pages can't drift ahead of the release.
          #
          # docs/design/ARCHITECTURE.md and ROADMAP.md are overlaid too: they
          # are living design documents for contributors (the
          # /docs/about/architecture/ and /docs/about/roadmap/ pages) that track
          # main rather than waiting for the next tag. roadmap.json (the
          # machine-readable phase contract gen-roadmap derives from ROADMAP.md,
          # which the alint.org /roadmap/ timeline renders) is overlaid with
          # them so the published plan tracks main; facts.json deliberately is
          # NOT overlaid, so the surface-area counts stay pinned to the release.
          git fetch --quiet origin main
          git checkout origin/main -- docs/site/reference docs/design/ARCHITECTURE.md docs/design/ROADMAP.md roadmap.json
          echo "Overlaid reference + design docs from origin/main ($(git rev-parse --short origin/main))."

      - name: Generate docs-bundle/
        run: cargo run -q -p xtask -- docs-export
        # Output lives at target/docs-bundle/.

      - name: Ensure roadmap.json is in the bundle (main-tracked)
        run: |
          set -euo pipefail
          # docs-export copies roadmap.json into the bundle, but the bundle is
          # built from the release TAG's xtask, which predates that copy step.
          # roadmap.json was overlaid from main above, so copy it in here to
          # bridge until the docs-export change ships in a release tag. Once it
          # does this is idempotent (identical, main-tracked content).
          cp roadmap.json target/docs-bundle/roadmap.json
          echo "roadmap.json ($(wc -c < roadmap.json) bytes) overlaid into the bundle."

      - name: Refresh cross-version trajectory from main's bench results
        run: |
          set -euo pipefail
          # The bundle's docs are built from the release TAG (above), but the
          # cross-version BENCH TRAJECTORY is cumulative — and each release's
          # macro results.json lands on main as a POST-RELEASE bench-record
          # follow-up, so it is ABSENT at the tag. Without this, /benchmarks/ on
          # alint.org is always a release behind. Overlay main's bench results +
          # renderer and regenerate just the trajectory JSON in the bundle.
          git fetch --quiet origin main
          git checkout origin/main -- docs/benchmarks xtask/scripts/render-history.py
          python3 xtask/scripts/render-history.py \
            --json-out "$(pwd)/target/docs-bundle/benchmarks-trajectory.json"
          echo "Trajectory refreshed from origin/main ($(git rev-parse --short origin/main))."

      - name: Push to docs-bundle branch
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          BUNDLE_DIR="$(pwd)/target/docs-bundle"
          if [[ ! -d "$BUNDLE_DIR" ]]; then
            echo "Expected bundle at $BUNDLE_DIR but it's missing."
            exit 1
          fi

          PUBLISH_DIR="$(mktemp -d)"
          REPO_URL="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          # Branch may or may not exist yet on first run. Two
          # paths: if it does, clone it directly so we have a
          # live working tree we can wipe + repopulate; if not,
          # init a fresh orphan branch from scratch.
          if git ls-remote --heads "$REPO_URL" docs-bundle | grep -q refs/heads/docs-bundle; then
            git clone --depth 1 --branch docs-bundle "$REPO_URL" "$PUBLISH_DIR"
            cd "$PUBLISH_DIR"
            # Wipe tracked files so removed pages don't linger
            # in the published bundle.
            git rm -rf . >/dev/null 2>&1 || true
          else
            mkdir -p "$PUBLISH_DIR"
            cd "$PUBLISH_DIR"
            git init -b docs-bundle
            git remote add origin "$REPO_URL"
          fi

          cp -r "${BUNDLE_DIR}/." .
          git add -A
          git -c user.name="alint docs bot" \
              -c user.email="asamarts@alint.org" \
              commit -m "Docs bundle from release ${BUNDLE_SOURCE} (run triggered by ${SOURCE_SHA})" || {
            echo "No bundle changes; skipping push."
            exit 0
          }
          git push origin docs-bundle --force

      - name: Trigger alint.org rebuild
        # Cloudflare Pages exposes a deploy-hook URL per project
        # (Settings → Builds & deployments → Deploy Hooks). Stored
        # as a repo secret on asamarts/alint so the docs-bundle
        # update propagates to alint.org within seconds. If the
        # secret isn't set yet, the step is a no-op.
        #
        # The body-capturing form (vs. the older
        # `curl -fsSL -X POST "$HOOK" -o /dev/null`) catches the
        # 2xx-with-error-body silent-failure mode hit during the
        # v0.10.2 cycle: Cloudflare returned an HTTP 200 carrying
        # a JSON error payload, curl exited 0, the workflow logged
        # "Pinged alint.org deploy hook." and the live site
        # silently kept serving the pre-fix build. The new form
        # logs the actual response body + HTTP status and treats
        # anything other than 2xx-with-`"id"` as a failed step.
        env:
          HOOK: ${{ secrets.ALINT_ORG_DEPLOY_HOOK }}
        run: |
          set -euo pipefail
          if [[ -z "${HOOK:-}" ]]; then
            echo "ALINT_ORG_DEPLOY_HOOK not set — skipping site rebuild trigger."
            exit 0
          fi
          tmp=$(mktemp)
          status=$(curl -sS -o "$tmp" -w '%{http_code}' -X POST "$HOOK")
          body=$(cat "$tmp"); rm -f "$tmp"
          echo "HTTP $status"
          echo "response body:"
          echo "$body"
          # CF's deploy-hook API returns a JSON object shaped like
          #   {"result":{"build_uuid":"...","status":"queued",
          #              "already_exists":false},
          #    "success":true,"errors":[],"messages":[]}
          # on a clean accept. `"success":true` is the canonical
          # success marker. Earlier-version drafts of this gate
          # looked for `"id"` and incorrectly rejected the genuine
          # success payload (CF returns `build_uuid`, not `id`).
          if [[ "$status" =~ ^2 ]] && grep -q '"success":true' <<<"$body"; then
            build_uuid=$(grep -oE '"build_uuid":"[^"]+"' <<<"$body" || true)
            echo "::notice::Cloudflare accepted the deploy hook; ${build_uuid:-build queued}."
          else
            echo "::error::Cloudflare did NOT accept the deploy hook cleanly."
            echo "::error::Check Workers & Pages → alint-org → Deployments."
            exit 1
          fi
