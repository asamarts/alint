name: Action self-test

# Exercise the official GitHub Action against a stable fixture.
# This covers the full install-from-release → invoke → annotate
# chain that external consumers follow, which our in-process
# tests don't cover. The fixture intentionally uses only the
# configuration contract shared by every binary version tested
# here: action.yml installs the latest released binary baked into
# the action, which can legitimately predate rule kinds added on
# the branch under test. Current-source dogfooding remains the
# responsibility of the normal CI jobs, which build HEAD first.
# Runs on ubuntu-latest (not self-hosted) so this job represents a
# typical external user's environment.
#
# `uses: ./` loads action.yml from the just-checked-out commit,
# pinning each invocation to the exact commit being tested
# rather than a floating `main` ref — so a PR's action.yml
# change is exercised by *its own* action.yml, not whatever
# happens to be on main when the job runs. Closes the
# supply-chain gap where the self-test couldn't actually fail
# safely on a bad action.yml. (`uses: asamarts/alint@<expr>`
# does NOT work — GitHub Actions does not support expressions
# in `uses:` for action references, only for reusable workflow
# calls; the workflow rejects at parse time with no per-job
# logs, which is why the `@${{ github.sha }}` form silently
# 0s-failed for ~24h before this fix.)

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  action-default:
    name: default (github annotations)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: alint check (annotations)
        uses: ./
        with:
          path: .github/fixtures/action-self-test
        # Default format is `github` — inline annotations on the PR if run
        # against a PR commit. The clean fixture makes this a success-path
        # assertion independent of unreleased root-config features.

  action-sarif:
    name: sarif output
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: alint check (sarif)
        id: alint
        uses: ./
        with:
          format: sarif
          path: .github/fixtures/action-self-test
        # Tolerate a non-zero exit: when the linted tree has violations the
        # check exits non-zero, but action.yml captures the exit code and still
        # sets `sarif-file`, and this job only asserts the SARIF file is
        # produced + valid JSON. Fixture cleanliness is asserted by the
        # `action-default` job, not here.
        continue-on-error: true
      - name: verify SARIF file exists and parses as JSON
        run: |
          set -euo pipefail
          test -f "${{ steps.alint.outputs.sarif-file }}"
          python3 -c 'import json,sys; json.load(open(sys.argv[1]))' \
            "${{ steps.alint.outputs.sarif-file }}"

  action-json:
    name: json output
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: alint check (json)
        uses: ./
        with:
          format: json
          path: .github/fixtures/action-self-test

  action-explicit-version:
    name: pinned version input
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: alint check with explicit version input
        uses: ./
        with:
          # Exercises install.sh's version-pinning path against a specific
          # older release tag. The stable fixture deliberately avoids newer
          # rule kinds so this remains a test of version selection rather
          # than an accidental test of backward-reading HEAD's root config.
          version: v0.14.0
          path: .github/fixtures/action-self-test

  action-config-single:
    name: config input (single path)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: alint check with an explicit config path
        uses: ./
        with:
          # The default job proves auto-discovery in this same fixture;
          # passing its config explicitly exercises the single-`--config`
          # path end to end without coupling a released binary to HEAD's
          # root config.
          path: .github/fixtures/action-self-test
          config: .github/fixtures/action-self-test/.alint.yml

  action-config-multi-rejected:
    name: config input (multiple paths rejected)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: alint rejects two config paths
        id: multi
        continue-on-error: true
        uses: ./
        with:
          # `--config` is single-valued; two paths must fail, not silently use
          # the first. Regression guard that the action honors the CLI's H4
          # contract (compose via `extends:`, not repeated `--config`).
          config: |
            .alint.yml
            .alint.yml
      - name: assert the action failed loudly
        run: |
          set -euo pipefail
          if [ "${{ steps.multi.outcome }}" != "failure" ]; then
            echo "::error::action accepted two config paths; expected a hard failure (exit 2)" >&2
            exit 1
          fi
