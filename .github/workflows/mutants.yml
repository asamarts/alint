name: Mutants

# Advisory mutation testing (owner decision in docs/design/v0.21/pre-release-audit.md,
# section 7, item 3). On a pull request that changes Rust, cargo-mutants tests the
# mutants in the lines the pull request changes and lists the ones no test caught in
# the job summary and as warnings on those lines. A missed mutant never fails the job,
# and the job is not in ci.yml's Summary, so it never blocks a merge.
#
# workflow_dispatch tests every mutant in one crate. alint-rules and alint-core have
# thousands, more than the job's budget; ci/scripts/mutants.sh stops at the budget with
# a partial report.
#
# This replaces a nightly rotation that targeted a self-hosted runner that is not
# registered, so it last ran on 2026-09-18.
on:
  pull_request:
    paths:
      - "**/*.rs"
      - ".github/workflows/mutants.yml"
      - "ci/scripts/mutants.sh"
  workflow_dispatch:
    inputs:
      crate:
        description: "Workspace crate to mutate in full (for example alint-output)"
        required: true

permissions:
  contents: read

concurrency:
  group: mutants-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  mutants:
    name: cargo-mutants (advisory)
    runs-on: ubuntu-latest
    # ci/scripts/mutants.sh stops cargo-mutants at 90 minutes; the rest is the
    # toolchain, the install, and the baseline build.
    timeout-minutes: 120
    steps:
      # The pull_request checkout is the merge commit, so HEAD^1 is the base.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: mutants
      - name: mutants in the changed lines
        if: github.event_name == 'pull_request'
        run: |
          git diff HEAD^1 HEAD -- '*.rs' > "$RUNNER_TEMP/pr.diff"
          ci/scripts/mutants.sh --in-diff "$RUNNER_TEMP/pr.diff"
      - name: mutants in one crate
        if: github.event_name == 'workflow_dispatch'
        env:
          CRATE: ${{ inputs.crate }}
        run: ci/scripts/mutants.sh --package "$CRATE"
      - name: upload the report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: mutants-${{ github.run_id }}
          path: target/mutants/
          retention-days: 30
          if-no-files-found: ignore
