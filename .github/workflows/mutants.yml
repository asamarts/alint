name: Mutants (nightly)

# Nightly cargo-mutants run rotating through one workspace crate
# per night. Surfaces unkilled mutants as actionable
# test-coverage gaps without paying the workspace-wide ~hours
# runtime each day.
#
# Manual rotation: trigger via workflow_dispatch with a `crate`
# input to target a specific crate ad-hoc.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      crate:
        description: "Crate to mutate (omit for daily rotation)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: mutants
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  mutants:
    name: cargo-mutants (rotated)
    runs-on: [self-hosted, linux, alint]
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          key: mutants

      - name: Pick crate (manual override or daily rotation)
        id: pick
        env:
          MANUAL: ${{ github.event.inputs.crate }}
        run: |
          set -euo pipefail
          CRATES=(alint-core alint-dsl alint-rules alint-output alint alint-lsp alint-bench alint-testkit alint-e2e)
          if [ -n "${MANUAL:-}" ]; then
            # Only an exact workspace crate name from the list above.
            ok=0
            for c in "${CRATES[@]}"; do [ "$c" = "$MANUAL" ] && ok=1; done
            if [ "$ok" -ne 1 ]; then
              echo "::error::unknown crate '${MANUAL}' (expected one of: ${CRATES[*]})" >&2
              exit 1
            fi
            TARGET="$MANUAL"
          else
            DOY=$(date +%j)
            IDX=$(( (10#$DOY - 1) % ${#CRATES[@]} ))
            TARGET="${CRATES[$IDX]}"
          fi
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"
          echo "==> Mutating $TARGET"

      - name: Install cargo-mutants
        run: |
          if ! command -v cargo-mutants >/dev/null 2>&1; then
            cargo install cargo-mutants --locked
          fi

      - name: Run cargo-mutants
        # cargo-mutants requires the parent of --output to exist
        # already. Continue past unkilled mutants (the artifact is
        # the signal we care about) but still surface infra
        # failures (compile error, baseline-test error, etc.).
        #
        # cargo-mutants exit codes (upstream src/exit_code.rs and
        # book/src/exit-codes.md):
        #   0 = all mutants caught (or none generated) — OK
        #   2 = some mutants escaped the test suite — OK, this
        #       IS the signal we want surfaced via the artifact
        #   1 = command-line / argument error — fail
        #   3 = one or more tests timed out (a mutant looped, or
        #       --timeout is too low) — fail
        #   4 = baseline tests already fail in the unmutated tree,
        #       so nothing was tested — fail (real infra)
        #   5/6 = --in-diff mismatch / invalid (unused here) — fail
        #   70 = internal cargo-mutants error — fail
        #
        # Treat 0 and 2 as success; anything else surfaces.
        env:
          TARGET: ${{ steps.pick.outputs.target }}
        run: |
          mkdir -p target/mutants
          set +e
          cargo mutants --package "$TARGET" \
                       --no-shuffle \
                       --output target/mutants \
                       --timeout 300
          rc=$?
          set -e
          case $rc in
            0|2)
              echo "cargo-mutants exited $rc — OK" ;;
            *)
              echo "cargo-mutants exited $rc — infra failure" >&2
              exit $rc ;;
          esac

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mutants-${{ steps.pick.outputs.target }}-${{ github.run_id }}
          path: target/mutants/
          retention-days: 30
