name: Coverage

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: true

env:
  # The first three are mirrored verbatim across ci.yml /
  # coverage.yml / release.yml / cross-platform.yml — keep
  # identical (see ci.yml for rationale).
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUSTFLAGS: "-D warnings"
  ALINT_COVERAGE_FLOOR: "85.0"

jobs:
  coverage:
    name: cargo-llvm-cov
    # SECURITY (audit H6): never run on the self-hosted box for a fork PR.
    # Coverage needs the box's pids-limit / CARGO_BUILD_JOBS tuning (a hosted
    # instrumented build OOMs/hangs) and its Codecov secret is withheld from
    # forks anyway. The ALINT_COVERAGE_FLOOR gate still runs on push-to-main
    # and on every same-repo (collaborator) PR. See
    # docs/design/v0.14/ci-fork-pr-isolation.md.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, alint]
    # Self-fail fast if the runner ever hangs again, instead of sitting at the
    # 360-min GitHub default and holding the single self-hosted runner. 90 min
    # comfortably covers a cold-cache, parallelism-capped instrumented build
    # (typical warm runs finish in minutes); well under bench's 360 / mutants'
    # 240. The pids-limit + CARGO_BUILD_JOBS fixes should keep hangs from
    # recurring — this is the belt-and-suspenders net.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          key: coverage

      - run: ci/scripts/coverage.sh

      - name: Upload LCOV artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage-lcov
          path: target/coverage/coverage.lcov
          retention-days: 30

      - name: Upload HTML artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage-html
          path: target/coverage/html/
          retention-days: 30

      # Codecov upload runs only when CODECOV_TOKEN is configured
      # in repo secrets — opt-in so this workflow is meaningful
      # even before the user wires the token. Map the secret into
      # an env first; `secrets.X` itself isn't usable in `if:`.
      - name: Check Codecov token presence
        id: codecov_token
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        run: |
          if [ -n "$CODECOV_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Upload to Codecov
        if: steps.codecov_token.outputs.present == 'true'
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: target/coverage/coverage.lcov
          fail_ci_if_error: false
