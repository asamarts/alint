name: Coverage

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: true

env:
  # The first three are mirrored verbatim across ci.yml /
  # coverage.yml / release.yml / cross-platform.yml — keep
  # identical (see ci.yml for rationale).
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUSTFLAGS: "-D warnings"
  ALINT_COVERAGE_FLOOR: "85.0"

jobs:
  coverage:
    name: cargo-llvm-cov
    # SECURITY (audit H6): all PR coverage is held while the fixed-label
    # listener is offline. Keep the full exact-ID predicate beside the explicit
    # false capacity switch so its future disposable route cannot silently
    # broaden admission. This is defence in depth, not scheduling authority.
    # See docs/design/v0.14/ci-fork-pr-isolation.md.
    # The persistent `alint` listener is intentionally offline pending the
    # disposable-runner cutover. Main/manual coverage remains useful and safe
    # on ephemeral hosted capacity; PR coverage stays skipped by this guard.
    if: >-
      ${{
        github.event_name != 'pull_request' ||
        (false &&
          format('{0}', github.event.repository.id) == '1214597864' &&
          format('{0}', github.event.pull_request.base.repo.id) == '1214597864' &&
          format('{0}', github.event.pull_request.head.repo.id) == '1214597864' &&
          contains(fromJSON('["11239806","12991611"]'), format('{0}', github.event.pull_request.user.id)) &&
          contains(fromJSON('["11239806","12991611"]'), format('{0}', github.event.sender.id)) &&
          contains(fromJSON('["11239806","12991611"]'), format('{0}', github.actor_id))
        )
      }}
    runs-on: ubuntu-latest
    # Self-fail fast if an instrumented build hangs. 90 minutes comfortably
    # covers a cold-cache, parallelism-capped run and is well under GitHub's
    # default job timeout.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          key: coverage

      - run: ci/scripts/coverage.sh

      - name: Upload LCOV artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage-lcov
          path: target/coverage/coverage.lcov
          retention-days: 30

      - name: Upload HTML artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage-html
          path: target/coverage/html/
          retention-days: 30

      # Codecov upload runs only when CODECOV_TOKEN is configured
      # in repo secrets — opt-in so this workflow is meaningful
      # even before the user wires the token. Map the secret into
      # an env first; `secrets.X` itself isn't usable in `if:`.
      - name: Check Codecov token presence
        id: codecov_token
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        run: |
          if [ -n "$CODECOV_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Upload to Codecov
        if: steps.codecov_token.outputs.present == 'true'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: target/coverage/coverage.lcov
          fail_ci_if_error: false
