name: bench-record

# Tag-triggered "publish-grade" bench run for the canonical baseline
# machine (self-hosted, AMD Ryzen 9 3900X — matches the fingerprint
# every published row in docs/benchmarks/HISTORY.md was captured on).
#
# Two layers per run:
# - macro: `xtask bench-scale --include-1m --warmup 3 --runs 10` over
#   the full S1-S14 × {1k,10k,100k,1m} × {full,changed} matrix.
# - micro: `cargo bench -p alint-bench --features fs-benches` over the
#   12 criterion benches EXPLICITLY (not a bare `-p alint-bench`, which
#   would also fire the gungraun det_engine/det_check benches), then
#   `xtask publish-benches` to land the trim'd criterion snapshot under
#   `docs/benchmarks/micro/results/<arch>/v<tag>/criterion/`.
#
# Output: a PR adding both directories plus a HISTORY.md update for
# every (scenario, mode, size) cell measured. The PR sits in review
# until a maintainer eyeballs the CV (anything > 10 % gets a re-run
# on a quieter system) and merges. No auto-merge — bench numbers
# enter the published corpus only after human review.
#
# Triggers:
# - tag push (v*): the canonical case. Bench runs on the released
#   binary built from the tagged commit.
# - workflow_dispatch with an explicit ref input: lets a maintainer
#   run an off-cycle bench (e.g. characterising main between releases
#   for an investigation; supplied label lands the dirs as
#   v<label>/ rather than overwriting a real release dir).
#
# Wall time: ~3.5 hours on the canonical baseline. Long-running, so
# this workflow is INTENTIONALLY off the release.yml dependency
# graph — release artefacts (binaries, npm, Docker, Homebrew) ship
# fast, bench data lands async via the PR this workflow opens.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to bench (default: current main)."
        required: false
        default: "main"
      label:
        description: "Output dir label (default: derived from ref). Use a v-prefixed label for tag-shaped outputs."
        required: false
        default: ""

permissions:
  contents: write       # commit the bench dirs + HISTORY.md update
  pull-requests: write  # open the review PR

# Hard serialisation: only one bench run at a time per ref. A second
# tag push while a bench is in flight queues rather than racing for
# the runner.
concurrency:
  group: bench-record-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bench:
    name: bench (linux-x86_64)
    # The canonical baseline runner — must match the fingerprint of
    # every previously published row. ubuntu-latest on github-hosted
    # would run a different CPU, kernel, and FS, voiding cross-version
    # comparability.
    runs-on: [self-hosted, linux, alint]
    timeout-minutes: 360   # 6h cap; ~3.5h expected at publish-grade flags
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: bench-record

      - name: install hyperfine (pinned, unconditional)
        run: |
          set -euo pipefail
          # Pin hyperfine for fingerprint reproducibility. The old
          # `if ! command -v hyperfine` skipped this whenever ANY
          # hyperfine was already on PATH — the self-hosted runner
          # has a stale 1.15.0, so the "pinned" 1.20.0 was never
          # actually used (every published results.json
          # fingerprints hyperfine 1.15.0). The runner has no sudo
          # (see the gh / python steps), so the old `sudo dpkg`
          # path was also dead. Install the prebuilt binary into
          # $HOME/.local/bin and front it on PATH — same pattern
          # as the gh / python steps — then assert the version so
          # a silent pin miss fails the run loudly.
          hf_ver="1.20.0"
          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o /tmp/hf.tar.gz \
            "https://github.com/sharkdp/hyperfine/releases/download/v${hf_ver}/hyperfine-v${hf_ver}-x86_64-unknown-linux-gnu.tar.gz"
          tar -xzf /tmp/hf.tar.gz -C /tmp
          cp "/tmp/hyperfine-v${hf_ver}-x86_64-unknown-linux-gnu/hyperfine" \
            "$HOME/.local/bin/hyperfine"
          chmod +x "$HOME/.local/bin/hyperfine"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          hyperfine --version
          case "$(hyperfine --version)" in
            *"$hf_ver"*) ;;
            *) echo "::error::hyperfine $hf_ver pin not applied (resolved: $(command -v hyperfine))"; exit 1 ;;
          esac

      - name: install gh CLI
        run: |
          set -euo pipefail
          if ! command -v gh >/dev/null 2>&1; then
            # Self-hosted runner has neither `gh` preinstalled nor
            # `sudo` available, so the apt path won't work. Install
            # the prebuilt binary into $HOME/.local/bin and add that
            # to GITHUB_PATH so subsequent steps see it. v0.9.11
            # bench-record runs failed with `gh: command not found`
            # at the PR step; v0.9.12 first attempted apt+sudo but
            # the runner has no sudo, so this falls back to the
            # tarball.
            gh_ver="2.62.0"
            mkdir -p "$HOME/.local/bin"
            curl -fsSL -o /tmp/gh.tar.gz \
              "https://github.com/cli/cli/releases/download/v${gh_ver}/gh_${gh_ver}_linux_amd64.tar.gz"
            tar -xzf /tmp/gh.tar.gz -C /tmp
            cp "/tmp/gh_${gh_ver}_linux_amd64/bin/gh" "$HOME/.local/bin/gh"
            chmod +x "$HOME/.local/bin/gh"
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.local/bin:$PATH"
          fi
          gh --version

      - name: install python3
        run: |
          set -euo pipefail
          # Self-hosted runner has neither `python3` preinstalled
          # nor `sudo` available. Install a standalone Python from
          # indygreg/python-build-standalone (no system package
          # manager, no sudo) into $HOME/.local/python/ and put
          # its bin/ on $GITHUB_PATH. Needed by the
          # `render HISTORY.md with new version row` step below
          # (v0.9.14 added that step; v0.9.14's first end-to-end
          # validation run failed with `python3: command not found`
          # until this install step landed).
          if ! command -v python3 >/dev/null 2>&1; then
            python_ver="3.12.7"
            release_tag="20241016"
            mkdir -p "$HOME/.local"
            curl -fsSL -o /tmp/python.tar.gz \
              "https://github.com/indygreg/python-build-standalone/releases/download/${release_tag}/cpython-${python_ver}+${release_tag}-x86_64-unknown-linux-gnu-install_only.tar.gz"
            tar -xzf /tmp/python.tar.gz -C "$HOME/.local/"
            echo "$HOME/.local/python/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.local/python/bin:$PATH"
          fi
          python3 --version

      - name: derive output label
        id: label
        run: |
          set -euo pipefail
          input_label='${{ github.event.inputs.label }}'
          if [[ -n "$input_label" ]]; then
            echo "label=$input_label" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            # Tag push: docs/benchmarks/.../v0.9.7/ shape.
            echo "label=${GITHUB_REF##refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            # Off-cycle dispatch with no explicit label: v0.9.7-rc-<sha>.
            workspace_ver=$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
            short_sha=$(git rev-parse --short HEAD)
            echo "label=v${workspace_ver}-rc-${short_sha}" >> "$GITHUB_OUTPUT"
          fi

      - name: build release binaries
        run: cargo build --release -p alint -p xtask

      # ── Macro: full publish-grade matrix ─────────────────────────
      # 14 scenarios × 4 sizes × 2 modes = 112 cells. The 1M cells
      # dominate — ~10 min each, so ~3h for the 28 1M cells alone.
      # S10 added in v0.9.9 (scope_filter outside per-file dispatch);
      # S11–S13 added in v0.10 (v0.10 cross-file / per-file /
      # single-shot dispatch classes — release-gating per audit D5);
      # S14 added in v0.12 (the comprehensive v0.12 net-new featureset:
      # file_graph / for_each_match / glob-union / markerless / gff-mutating).
      - name: macro bench-scale
        env:
          OUT_LABEL: ${{ steps.label.outputs.label }}
        run: |
          set -euo pipefail
          out_dir="docs/benchmarks/macro/results/linux-x86_64/${OUT_LABEL}"
          mkdir -p "$out_dir"
          ./target/release/xtask bench-scale \
            --include-1m \
            --sizes 1k,10k,100k,1m \
            --scenarios S1,S2,S3,S4,S5,S6,S7,S8,S9,S10,S11,S12,S13,S14 \
            --modes full,changed \
            --tools alint \
            --warmup 3 --runs 10 \
            --json-only \
            --out "$out_dir"
          ls -la "$out_dir"

      # ── Micro: criterion ─────────────────────────────────────────
      - name: micro cargo bench
        run: |
          set -euo pipefail
          # Criterion micro-benches ONLY (explicit list). A bare
          # `cargo bench -p alint-bench` would also fire the gungraun
          # det_engine/det_check benches, which run under Valgrind (slow) and
          # det_check needs a release binary + baseline. Those are the load-immune
          # deterministic gate (ci/scripts/det-perf-gate.sh, per-PR; det-100k at
          # release) and are NOT part of the criterion micro corpus.
          cargo bench -p alint-bench --features fs-benches \
            --bench glob_compile --bench glob_match --bench regex_content \
            --bench rule_engine --bench walker --bench single_file_rules \
            --bench cross_file_rules --bench output_formats --bench fix_throughput \
            --bench dsl_extends --bench structured_query --bench blame_cache

      - name: publish micro snapshot
        env:
          OUT_LABEL: ${{ steps.label.outputs.label }}
        run: |
          set -euo pipefail
          out_dir="docs/benchmarks/micro/results/linux-x86_64/${OUT_LABEL}/criterion"
          ./target/release/xtask publish-benches --to "$out_dir" --trim
          ls -la "$out_dir" | head -20

      # ── HISTORY.md update is intentionally manual ────────────────
      # Auto-rewriting markdown tables is fragile (positional cells,
      # version ordering, scenario sections). The PR body links to
      # the new results.json so the maintainer pastes the new row
      # into HISTORY.md as part of the merge. The new row fields
      # come from the per-cell JSON via:
      #
      #   jq -r '.rows[] | "\(.scenario) \(.size_label) \(.mode): mean=\(.mean_ms)ms ± \(.stddev_ms)"' \
      #     docs/benchmarks/macro/results/linux-x86_64/<tag>/results.json
      #
      # … which the PR body shells out for and inlines verbatim, so
      # the maintainer copy-pastes pre-formatted values.

      - name: open PR with bench results
        env:
          GH_TOKEN: ${{ github.token }}
          OUT_LABEL: ${{ steps.label.outputs.label }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          branch="bench-record/${OUT_LABEL}"

          git config user.name  "alint bench bot"
          git config user.email "asamarts@alint.org"

          # Stage bench artefacts to /tmp so we can rebase onto
          # main without losing them. Required because:
          # - Tag-triggered runs check out the tag's tree, which
          #   may have an older `bench-record.yml` than main.
          # - workflow_dispatch with `ref=<old-tag>` makes this
          #   even more divergent.
          # - Force-pushing the resulting bench-record/<label>
          #   branch triggers GitHub's "GITHUB_TOKEN cannot
          #   create or update workflow files" protection on
          #   any `.github/workflows/*` diff vs main. Even with
          #   `workflows: write` declared, GitHub Apps refuse.
          # By rebasing the bench artefacts onto current main,
          # the resulting commit only adds bench files and never
          # touches workflow YAML (because main has the latest
          # YAML already).
          stage_root=$(mktemp -d)
          mkdir -p "$stage_root/macro" "$stage_root/micro"
          cp -r "docs/benchmarks/macro/results/linux-x86_64/${OUT_LABEL}/" \
            "$stage_root/macro/" || true
          cp -r "docs/benchmarks/micro/results/linux-x86_64/${OUT_LABEL}/" \
            "$stage_root/micro/" || true

          # Hard-reset any local changes (the bench step writes
          # untracked files; the earlier `render HISTORY` step
          # was removed in v0.9.14 because the canonical render
          # happens after the rebase below) so `git checkout`
          # can switch refs without conflicts.
          git reset --hard HEAD
          git clean -fd docs/benchmarks/

          # Rebase onto current main so the workflow file in the
          # working tree matches origin/main exactly — no
          # workflow-file diff in the resulting push.
          git fetch origin main --depth=1
          git checkout -B "$branch" origin/main

          # Restore the bench artefacts on top of main.
          mkdir -p "docs/benchmarks/macro/results/linux-x86_64/"
          mkdir -p "docs/benchmarks/micro/results/linux-x86_64/"
          rm -rf "docs/benchmarks/macro/results/linux-x86_64/${OUT_LABEL}"
          rm -rf "docs/benchmarks/micro/results/linux-x86_64/${OUT_LABEL}"
          cp -r "$stage_root/macro/${OUT_LABEL}" \
            "docs/benchmarks/macro/results/linux-x86_64/${OUT_LABEL}"
          cp -r "$stage_root/micro/${OUT_LABEL}" \
            "docs/benchmarks/micro/results/linux-x86_64/${OUT_LABEL}"

          # Render HISTORY.md against the rebased tree (main's
          # render-history.py + main's CHANGELOG.md + the new
          # bench data we just restored). Sanity check: emit a
          # warning if the new version's row doesn't appear in
          # the output (CHANGELOG.md missing the entry).
          python3 xtask/scripts/render-history.py > docs/benchmarks/HISTORY.md
          if ! grep -q "^| \*\*${OUT_LABEL}\*\*" docs/benchmarks/HISTORY.md; then
            echo "::warning ::render-history.py did not produce a row for ${OUT_LABEL}; CHANGELOG.md may be missing the entry. HISTORY.md updated anyway."
          fi

          git add docs/benchmarks/macro/results/linux-x86_64/"${OUT_LABEL}"/
          git add docs/benchmarks/micro/results/linux-x86_64/"${OUT_LABEL}"/
          # v0.9.14: HISTORY.md is auto-refreshed in the previous
          # step; include it in the same commit so the PR is
          # one-merge-completes-everything.
          git add docs/benchmarks/HISTORY.md
          git commit -m "docs(bench): publish ${OUT_LABEL} matrix (S1-S14 at 1k/10k/100k/1m × full/changed) + HISTORY.md refresh"
          git push origin "$branch" --force

          # Render a per-cell summary the maintainer pastes into HISTORY.md.
          json=docs/benchmarks/macro/results/linux-x86_64/"${OUT_LABEL}"/results.json
          summary=$(jq -r '.rows[] | "- \(.scenario) \(.size_label) \(.mode): \(.mean_ms | tostring | .[0:6]) ms ± \(.stddev_ms | tostring | .[0:5])"' "$json")

          gh pr create \
            --title "docs(bench): ${OUT_LABEL} bench-scale results" \
            --body "$(cat <<EOF
          Auto-opened by \`bench-record.yml\` for source SHA \`${SOURCE_SHA}\`.

          ## What landed

          - \`docs/benchmarks/macro/results/linux-x86_64/${OUT_LABEL}/\` — full
            publish-grade hyperfine matrix (S1-S14 × {1k, 10k, 100k, 1m} × {full,
            changed}) at \`--warmup 3 --runs 10\`.
          - \`docs/benchmarks/micro/results/linux-x86_64/${OUT_LABEL}/criterion/\`
            — trimmed criterion snapshot from \`cargo bench -p alint-bench\`.
          - \`docs/benchmarks/HISTORY.md\` — auto-refreshed via
            \`xtask/scripts/render-history.py\` to surface the new
            \`${OUT_LABEL}\` row across the headline + per-scenario tables.
            Date + headline blurb come from CHANGELOG.md's
            \`## [X.Y.Z] — YYYY-MM-DD\` header + first sentence
            beneath it.

          ## Maintainer review checklist

          - [ ] Run \`xtask bench-gate\` against the previous release's
            \`results.json\` — non-zero exit blocks the merge. Replaces
            the v0.9.22-and-earlier "CV > 10 % eyeball" (which was
            never met by any shipped release and never enforced in
            code); see [\`RELEASING.md\`](../RELEASING.md) §"Bench-record review"
            for the canonical procedure.
            \`\`\`sh
            git fetch origin ${branch}
            git show origin/${branch}:docs/benchmarks/macro/results/linux-x86_64/${OUT_LABEL}/results.json > /tmp/new.json
            cargo run -q -p xtask -- bench-gate \\
              --results /tmp/new.json \\
              --baseline docs/benchmarks/macro/results/linux-x86_64/v<prev>/results.json
            \`\`\`
            Gating: per-cell within-run CV ≤ 10 % on 100k/1m cells
            (1k/10k advisory); \`min_ms\` regression ≤ +15 % vs the
            prior release on ≥10k cells. New cells with no baseline
            mate are skipped from the regression check.
          - [ ] Eyeball the HISTORY.md headline row for
            \`${OUT_LABEL}\` — if the auto-extracted first sentence
            from CHANGELOG.md isn't a good one-row blurb, edit
            CHANGELOG.md to make the first sentence punchier and
            re-render via
            \`python3 xtask/scripts/render-history.py > docs/benchmarks/HISTORY.md\`.
          - [ ] Verify the workspace version in the bench fingerprint matches
            the tag/label.

          ## Per-cell numbers

          \`\`\`
          ${summary}
          \`\`\`

          ## Notes

          - Hardware fingerprint and \`hyperfine\`/\`alint\` versions are captured
            inside \`results.json\` for cross-version diffing. Cross-machine
            comparisons require a like-for-like fingerprint — see
            [\`METHODOLOGY.md\`](../docs/benchmarks/METHODOLOGY.md).
          - Triggered by: \`${GITHUB_REF}\`.
          EOF
          )" \
            --head "$branch" \
            --base main \
            --label bench-record
