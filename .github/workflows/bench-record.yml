name: bench-record

# Tag-triggered "publish-grade" bench run for the canonical baseline
# machine: self-hosted `kbench` (Intel i7-6700HQ laptop, 16 GB), which
# replaced the 3900X dev box as the bench host on 2026-07-15 (quiet +
# dedicated + fixed fingerprint). Its 16 GB RAM needs the drop_caches
# fix (ALINT_BENCH_DROP_CACHES, set below); the trees live on /bench
# (ext4 NVMe) because kbench's /tmp is a 7.8 GB tmpfs that overflows at
# 1M. See project docs: the kbench canonical-host note + the
# 2026-07-1m-writeback-contention investigation.
#
# Two layers per run:
# - macro: `xtask bench-scale --include-1m --warmup 3 --runs 10` over
#   the consolidated S1-S4 × {1k,10k,100k,1m} × {full,changed} matrix,
#   plus the SFIX fix-mode scenario.
# - micro: `cargo bench -p alint-bench --features fs-benches` over the
#   12 criterion benches EXPLICITLY (not a bare `-p alint-bench`, which
#   would also fire the gungraun det_engine/det_check benches), then
#   `xtask publish-benches` to land the trim'd criterion snapshot under
#   `docs/benchmarks/micro/results/<arch>/v<tag>/criterion/`.
#
# Output: a PR adding both directories plus a HISTORY.md update for
# every (scenario, mode, size) cell measured. The PR sits in review
# until a maintainer eyeballs the CV (anything > 10 % gets a re-run
# on a quieter system) and merges. No auto-merge — bench numbers
# enter the published corpus only after human review.
#
# Triggers:
# - tag push (v*): the canonical case. Bench runs on the released
#   binary built from the tagged commit.
# - workflow_dispatch with an explicit ref input: lets a maintainer
#   run an off-cycle bench (e.g. characterising main between releases
#   for an investigation; supplied label lands the dirs as
#   v<label>/ rather than overwriting a real release dir).
#
# Wall time: ~3.5 hours on the canonical baseline. Long-running, so
# this workflow is INTENTIONALLY off the release.yml dependency
# graph — release artefacts (binaries, npm, Docker, Homebrew) ship
# fast, bench data lands async via the PR this workflow opens.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to bench (default: current main)."
        required: false
        default: "main"
      label:
        description: "Output dir label (default: derived from ref). Use a v-prefixed label for tag-shaped outputs."
        required: false
        default: ""

permissions: {}

# Hard serialisation: only one bench run at a time per ref. A second
# tag push while a bench is in flight queues rather than racing for
# the runner.
concurrency:
  group: bench-record-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Engine-unchanged guard. A tag whose binary is byte-identical to the previous
  # release -- no crates/**/*.rs changed, e.g. a supply-chain or CI-only patch
  # like v0.15.1/v0.15.2 -- can only record bench-host noise against the prior
  # baseline (spurious short-run swings while 100k/1m stay flat), so skip the
  # ~3.5h run and its review PR; the prior release's bench already represents the
  # identical binary. Keyed on .rs only, since Cargo.lock's workspace-version
  # entries churn on every release; a dependency-only perf change (rare in a
  # patch) would be missed here, so bench it via workflow_dispatch. A manual
  # workflow_dispatch always benches -- the maintainer asked for it explicitly.
  guard:
    name: engine-change guard
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      should_bench: ${{ steps.decide.outputs.should_bench }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - id: decide
        env:
          EVENT: ${{ github.event_name }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$EVENT" != "push" ]; then
            echo "should_bench=true" >> "$GITHUB_OUTPUT"
            echo "::notice::workflow_dispatch -- benching unconditionally."
            exit 0
          fi
          # The release immediately preceding this tag in version order (NOT merely
          # the highest other tag, so a re-pushed / non-latest tag still compares
          # against its true predecessor).
          prev="$(git tag --list 'v*.*.*' --sort=-v:refname | awk -v t="$TAG" '$0==t{f=1;next} f{print;exit}')"
          if [ -z "$prev" ]; then
            echo "should_bench=true" >> "$GITHUB_OUTPUT"
            echo "::notice::no prior release tag -- benching."
            exit 0
          fi
          # .rs only: Cargo.lock's workspace-version entries churn every release, so
          # they cannot distinguish a real engine change from the version bump.
          rs_changed="$(git diff --name-only "${prev}..${TAG}" -- crates/ | grep -c '\.rs$' || true)"
          if [ "${rs_changed:-0}" -gt 0 ]; then
            echo "should_bench=true" >> "$GITHUB_OUTPUT"
            echo "::notice::${rs_changed} crates/**/*.rs changed ${prev}..${TAG} -- benching."
          else
            echo "should_bench=false" >> "$GITHUB_OUTPUT"
            echo "::notice::no crates/**/*.rs changed ${prev}..${TAG} -- byte-identical binary; skipping bench (the ${prev} bench represents it)."
          fi

  bench:
    needs: guard
    if: needs.guard.outputs.should_bench == 'true'
    name: bench (linux-x86_64)
    # The canonical baseline runner is kbench (label `bench`), NOT the
    # `alint` CI runner (the 3900X dev box) — bench moved to a dedicated,
    # quiet, fixed-fingerprint host. ubuntu-latest on github-hosted would
    # run a different CPU, kernel, and FS, voiding cross-version
    # comparability.
    runs-on: [self-hosted, linux, bench]
    permissions:
      contents: write       # commit the bench dirs + HISTORY.md update
      pull-requests: write  # open the review PR
    timeout-minutes: 360   # 6h cap; ~3.5h expected at publish-grade flags
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
          fetch-depth: 0
      # PINNED, unlike CI's @stable: rustc is part of the bench fingerprint, so
      # the whole kbench corpus series must stay on one toolchain or numbers stop
      # being cross-version comparable. 1.97.0 matches the v0.10-v0.13 backfill
      # that re-based the series onto kbench. Bump deliberately (and re-baseline)
      # when the fleet moves, never implicitly via `stable` drift.
      - uses: dtolnay/rust-toolchain@35a842e360814583e976785eeda0bd0655cb8e83 # 1.97.0
        with:
          toolchain: 1.97.0
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          key: bench-record

      - name: install hyperfine (pinned, unconditional)
        run: |
          set -euo pipefail
          # Pin hyperfine for fingerprint reproducibility. The old
          # `if ! command -v hyperfine` skipped this whenever ANY
          # hyperfine was already on PATH — the self-hosted runner
          # has a stale 1.15.0, so the "pinned" 1.20.0 was never
          # actually used (every published results.json
          # fingerprints hyperfine 1.15.0). The runner has no sudo
          # (see the gh / python steps), so the old `sudo dpkg`
          # path was also dead. Install the prebuilt binary into
          # $HOME/.local/bin and front it on PATH — same pattern
          # as the gh / python steps — then assert the version so
          # a silent pin miss fails the run loudly.
          hf_ver="1.20.0"
          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o /tmp/hf.tar.gz \
            "https://github.com/sharkdp/hyperfine/releases/download/v${hf_ver}/hyperfine-v${hf_ver}-x86_64-unknown-linux-gnu.tar.gz"
          tar -xzf /tmp/hf.tar.gz -C /tmp
          cp "/tmp/hyperfine-v${hf_ver}-x86_64-unknown-linux-gnu/hyperfine" \
            "$HOME/.local/bin/hyperfine"
          chmod +x "$HOME/.local/bin/hyperfine"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          hyperfine --version
          case "$(hyperfine --version)" in
            *"$hf_ver"*) ;;
            *) echo "::error::hyperfine $hf_ver pin not applied (resolved: $(command -v hyperfine))"; exit 1 ;;
          esac

      - name: install gh CLI
        run: |
          set -euo pipefail
          if ! command -v gh >/dev/null 2>&1; then
            # Self-hosted runner has neither `gh` preinstalled nor
            # `sudo` available, so the apt path won't work. Install
            # the prebuilt binary into $HOME/.local/bin and add that
            # to GITHUB_PATH so subsequent steps see it. v0.9.11
            # bench-record runs failed with `gh: command not found`
            # at the PR step; v0.9.12 first attempted apt+sudo but
            # the runner has no sudo, so this falls back to the
            # tarball.
            gh_ver="2.62.0"
            mkdir -p "$HOME/.local/bin"
            curl -fsSL -o /tmp/gh.tar.gz \
              "https://github.com/cli/cli/releases/download/v${gh_ver}/gh_${gh_ver}_linux_amd64.tar.gz"
            tar -xzf /tmp/gh.tar.gz -C /tmp
            cp "/tmp/gh_${gh_ver}_linux_amd64/bin/gh" "$HOME/.local/bin/gh"
            chmod +x "$HOME/.local/bin/gh"
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.local/bin:$PATH"
          fi
          gh --version

      - name: install python3
        run: |
          set -euo pipefail
          # Self-hosted runner has neither `python3` preinstalled
          # nor `sudo` available. Install a standalone Python from
          # indygreg/python-build-standalone (no system package
          # manager, no sudo) into $HOME/.local/python/ and put
          # its bin/ on $GITHUB_PATH. Needed by the
          # `render HISTORY.md with new version row` step below
          # (v0.9.14 added that step; v0.9.14's first end-to-end
          # validation run failed with `python3: command not found`
          # until this install step landed).
          if ! command -v python3 >/dev/null 2>&1; then
            python_ver="3.12.7"
            release_tag="20241016"
            mkdir -p "$HOME/.local"
            curl -fsSL -o /tmp/python.tar.gz \
              "https://github.com/indygreg/python-build-standalone/releases/download/${release_tag}/cpython-${python_ver}+${release_tag}-x86_64-unknown-linux-gnu-install_only.tar.gz"
            tar -xzf /tmp/python.tar.gz -C "$HOME/.local/"
            echo "$HOME/.local/python/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.local/python/bin:$PATH"
          fi
          python3 --version

      - name: derive output label
        id: label
        env:
          # Via env, never `${{ }}` inside the script: a dispatch input expanded
          # into shell source is a script-injection vector.
          INPUT_LABEL: ${{ github.event.inputs.label }}
        run: |
          set -euo pipefail
          input_label="${INPUT_LABEL:-}"
          if [[ -n "$input_label" ]]; then
            # The label becomes a docs/benchmarks/ directory name and a branch
            # name; allow only a conservative path-segment alphabet.
            if [[ ! "$input_label" =~ ^[A-Za-z0-9._-]+$ || "$input_label" == .* ]]; then
              echo "::error::invalid label '${input_label}' (allowed: [A-Za-z0-9._-]+, no leading dot)" >&2
              exit 1
            fi
            echo "label=$input_label" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            # Tag push: docs/benchmarks/.../v0.9.7/ shape.
            echo "label=${GITHUB_REF##refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            # Off-cycle dispatch with no explicit label: v0.9.7-rc-<sha>.
            workspace_ver=$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
            short_sha=$(git rev-parse --short HEAD)
            echo "label=v${workspace_ver}-rc-${short_sha}" >> "$GITHUB_OUTPUT"
          fi

      - name: graft drop-caches harness onto pre-fix refs
        run: |
          set -euo pipefail
          # The ALINT_BENCH_DROP_CACHES quiescing (mandatory on kbench's 16 GB, or
          # S2/1m/full blows the CV gate — see
          # docs/benchmarks/investigations/2026-07-1m-writeback-contention/) was
          # added to the bench driver AFTER v0.13. Re-benching a pre-fix ref
          # (v0.10-v0.13, when re-baselining the series onto the runner) with its
          # OWN driver would reintroduce that artifact. If the checked-out ref's
          # run.rs lacks the quiescing, graft ONLY the bench driver from origin/main
          # so the ref's own alint binary is measured with the drop-caches harness.
          # The driver changes how the bench quiesces the cache between phases, not
          # what alint DOES — the same graft the manual v0.10-v0.13 backfill used.
          # Only the results dirs are committed to the PR, never this working-tree
          # graft (the PR step cp's the results, not the source tree).
          if grep -q maybe_quiesce_page_cache xtask/src/bench/run.rs; then
            echo "Ref already carries the drop-caches harness; no graft needed."
          else
            git fetch --quiet origin main
            git checkout origin/main -- xtask/src/bench/run.rs
            echo "Grafted drop-caches harness (run.rs) from origin/main ($(git rev-parse --short origin/main)) onto $(git rev-parse --short HEAD)."
          fi

      - name: build release binaries
        run: cargo build --release -p alint -p xtask

      # ── Macro: full publish-grade matrix ─────────────────────────
      # The consolidated set (5 scenarios): 4 check scenarios (S1 layout /
      # S2 content / S3 relational / S4 workspace) × 4 sizes × 2 modes
      # (full, changed) = 32 cells, plus the dedicated fix scenario (SFIX)
      # × 4 sizes × 1 mode (fix) = 4 cells → 36 cells total. The 1M cells
      # dominate — ~10 min each, so ~3h for the 1M row alone.
      # Old tags re-baselined via workflow_dispatch keep their own
      # scenario/mode set (see the file-guarded append below).
      - name: macro bench-scale
        env:
          OUT_LABEL: ${{ steps.label.outputs.label }}
          # kbench (16 GB) needs the page-cache-reclaim fix or S2/1m/full
          # spikes to 40-50% CV and fails bench-gate; and its trees must
          # live on the /bench ext4 NVMe, not the 7.8 GB /tmp tmpfs which
          # overflows at 1M. Both are no-ops/harmless on any large-RAM host.
          ALINT_BENCH_DROP_CACHES: "1"
          TMPDIR: /bench
        run: |
          set -euo pipefail
          # Reduce the runner's footprint on the measurement: give this step (and
          # the xtask/alint children it forks) top CPU + I/O priority so the runner
          # agent's concurrent bookkeeping can't inflate wall-clock. The v0.14.0
          # corpus (the first run through the GHA runner) came out ~6.5% slow vs the
          # hand-measured v0.10-v0.13 baselines from harness overhead alone — the
          # deterministic Ir was flat (see
          # docs/benchmarks/investigations/2026-07-v0.14-s2-harness-artifact/).
          # renice the step shell; forked children inherit. Best-effort so a
          # large-RAM host without passwordless sudo is unaffected.
          sudo -n renice -n -10 -p $$ >/dev/null 2>&1 || true
          sudo -n ionice -c2 -n0 -p $$ >/dev/null 2>&1 || true
          sync   # flush the release build's dirty pages before measuring
          out_dir="docs/benchmarks/macro/results/linux-x86_64/${OUT_LABEL}"
          mkdir -p "$out_dir"
          # Scenarios present in THIS ref, not a hardcoded list: the set has
          # changed shape across releases (S10 in v0.9.9, S11-S13 in v0.10, S14 in
          # v0.12, then the v0.17 consolidation to S1-S4 + the fix-only SFIX), so
          # re-benching an old tag (re-baselining onto the runner) must request only
          # the scenarios + modes its own xtask knows, or bench-scale errors on an
          # unknown scenario/mode — the same per-tag adaptation the manual backfill
          # made. The numbered check scenarios are derived from the definition
          # files; the fix-only sfix_all.yml is excluded by the s[0-9]*_ glob
          # (supports() runs it under fix mode only, not the full/changed the check
          # scenarios take) and appended explicitly as SFIX.
          scenarios=$(find xtask/src/bench/scenarios -maxdepth 1 -type f \
            -name 's[0-9]*_*.yml' -print \
            | sed -E 's#.*/s([0-9]+)_.*#\1#' | sort -n | sed 's/^/S/' | paste -sd,)
          if [ -z "$scenarios" ]; then
            echo "::error::no numbered benchmark scenarios found" >&2
            exit 1
          fi
          modes="full,changed"
          # Append the fix scenario + enable fix mode ONLY when this ref ships
          # sfix_all.yml, so an old-tag re-baseline whose xtask predates SFIX /
          # Mode::Fix still requests only what its own binary understands.
          if [ -f xtask/src/bench/scenarios/sfix_all.yml ]; then
            scenarios="${scenarios:+$scenarios,}SFIX"
            modes="full,changed,fix"
          fi
          echo "scenarios for this ref ($(git rev-parse --short HEAD)): $scenarios (modes: $modes)"
          ./target/release/xtask bench-scale \
            --include-1m \
            --sizes 1k,10k,100k,1m \
            --scenarios "$scenarios" \
            --modes "$modes" \
            --tools alint \
            --warmup 3 --runs 10 \
            --json-only \
            --out "$out_dir"
          ls -la "$out_dir"

      # ── Micro: criterion ─────────────────────────────────────────
      - name: micro cargo bench
        run: |
          set -euo pipefail
          # Same footprint reduction as the macro step (criterion measures ns/op,
          # so it is wall-clock sensitive too): renice + ionice this step so the
          # runner agent's concurrent work can't skew the samples.
          sudo -n renice -n -10 -p $$ >/dev/null 2>&1 || true
          sudo -n ionice -c2 -n0 -p $$ >/dev/null 2>&1 || true
          sync
          # Criterion micro-benches ONLY (explicit list). A bare
          # `cargo bench -p alint-bench` would also fire the gungraun
          # det_engine/det_check benches, which run under Valgrind (slow) and
          # det_check needs a release binary + baseline. Those are the load-immune
          # deterministic gate (ci/scripts/det-perf-gate.sh, per-PR; det-100k at
          # release) and are NOT part of the criterion micro corpus.
          # Criterion micro-benches present in THIS ref, EXCLUDING the gungraun
          # det_* Valgrind gate benches (slow, need a baseline; not part of the
          # criterion micro corpus). Derived rather than hardcoded so re-benching an
          # old tag (blame_cache / structured_query / etc. were added over time)
          # doesn't fail on a --bench its alint-bench crate doesn't define.
          mapfile -t mbenches < <(find crates/alint-bench/benches -maxdepth 1 -type f \
            -name '*.rs' -exec basename {} .rs \; | grep -vE '^det_' | sort)
          if [ "${#mbenches[@]}" -eq 0 ]; then
            echo "::error::no Criterion benchmark targets found" >&2
            exit 1
          fi
          bench_args=()
          for bench in "${mbenches[@]}"; do
            bench_args+=(--bench "$bench")
          done
          echo "micro benches for this ref: ${mbenches[*]}"
          cargo bench -p alint-bench --features fs-benches "${bench_args[@]}"

      - name: publish micro snapshot
        env:
          OUT_LABEL: ${{ steps.label.outputs.label }}
        run: |
          set -euo pipefail
          out_dir="docs/benchmarks/micro/results/linux-x86_64/${OUT_LABEL}/criterion"
          ./target/release/xtask publish-benches --to "$out_dir" --trim
          # This is a human-readable diagnostic listing, not filename parsing.
          # shellcheck disable=SC2012
          ls -la "$out_dir" | sed -n '1,20p'

      # ── HISTORY.md update is intentionally manual ────────────────
      # Auto-rewriting markdown tables is fragile (positional cells,
      # version ordering, scenario sections). The PR body links to
      # the new results.json so the maintainer pastes the new row
      # into HISTORY.md as part of the merge. The new row fields
      # come from the per-cell JSON via:
      #
      #   jq -r '.rows[] | "\(.scenario) \(.size_label) \(.mode): mean=\(.mean_ms)ms ± \(.stddev_ms)"' \
      #     docs/benchmarks/macro/results/linux-x86_64/<tag>/results.json
      #
      # … which the PR body shells out for and inlines verbatim, so
      # the maintainer copy-pastes pre-formatted values.

      - name: open PR with bench results
        env:
          GH_TOKEN: ${{ github.token }}
          OUT_LABEL: ${{ steps.label.outputs.label }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          branch="bench-record/${OUT_LABEL}"

          git config user.name  "alint bench bot"
          git config user.email "asamarts@alint.org"

          # Stage bench artefacts to /tmp so we can rebase onto
          # main without losing them. Required because:
          # - Tag-triggered runs check out the tag's tree, which
          #   may have an older `bench-record.yml` than main.
          # - workflow_dispatch with `ref=<old-tag>` makes this
          #   even more divergent.
          # - Force-pushing the resulting bench-record/<label>
          #   branch triggers GitHub's "GITHUB_TOKEN cannot
          #   create or update workflow files" protection on
          #   any `.github/workflows/*` diff vs main. Even with
          #   `workflows: write` declared, GitHub Apps refuse.
          # By rebasing the bench artefacts onto current main,
          # the resulting commit only adds bench files and never
          # touches workflow YAML (because main has the latest
          # YAML already).
          stage_root=$(mktemp -d)
          mkdir -p "$stage_root/macro" "$stage_root/micro"
          cp -r "docs/benchmarks/macro/results/linux-x86_64/${OUT_LABEL}/" \
            "$stage_root/macro/" || true
          cp -r "docs/benchmarks/micro/results/linux-x86_64/${OUT_LABEL}/" \
            "$stage_root/micro/" || true

          # Hard-reset any local changes (the bench step writes
          # untracked files; the earlier `render HISTORY` step
          # was removed in v0.9.14 because the canonical render
          # happens after the rebase below) so `git checkout`
          # can switch refs without conflicts.
          git reset --hard HEAD
          git clean -fd docs/benchmarks/

          # Rebase onto current main so the workflow file in the
          # working tree matches origin/main exactly — no
          # workflow-file diff in the resulting push.
          git fetch origin main --depth=1
          git checkout -B "$branch" origin/main

          # Restore the bench artefacts on top of main.
          mkdir -p "docs/benchmarks/macro/results/linux-x86_64/"
          mkdir -p "docs/benchmarks/micro/results/linux-x86_64/"
          rm -rf "docs/benchmarks/macro/results/linux-x86_64/${OUT_LABEL}"
          rm -rf "docs/benchmarks/micro/results/linux-x86_64/${OUT_LABEL}"
          cp -r "$stage_root/macro/${OUT_LABEL}" \
            "docs/benchmarks/macro/results/linux-x86_64/${OUT_LABEL}"
          cp -r "$stage_root/micro/${OUT_LABEL}" \
            "docs/benchmarks/micro/results/linux-x86_64/${OUT_LABEL}"

          # Render HISTORY.md against the rebased tree (main's
          # render-history.py + main's CHANGELOG.md + the new
          # bench data we just restored). Sanity check: emit a
          # warning if the new version's row doesn't appear in
          # the output (CHANGELOG.md missing the entry).
          # Write to a temp then mv, so a render-history failure (e.g. the
          # recurrence guard tripping on a new scenario id) never truncates
          # the committed HISTORY.md via the `>` redirect under set -e.
          python3 xtask/scripts/render-history.py > docs/benchmarks/HISTORY.md.tmp
          mv docs/benchmarks/HISTORY.md.tmp docs/benchmarks/HISTORY.md
          if ! grep -q "^| \*\*${OUT_LABEL}\*\*" docs/benchmarks/HISTORY.md; then
            echo "::warning ::render-history.py did not produce a row for ${OUT_LABEL}; CHANGELOG.md may be missing the entry. HISTORY.md updated anyway."
          fi

          git add docs/benchmarks/macro/results/linux-x86_64/"${OUT_LABEL}"/
          git add docs/benchmarks/micro/results/linux-x86_64/"${OUT_LABEL}"/
          # v0.9.14: HISTORY.md is auto-refreshed in the previous
          # step; include it in the same commit so the PR is
          # one-merge-completes-everything.
          git add docs/benchmarks/HISTORY.md
          git commit -m "docs(bench): publish ${OUT_LABEL} matrix (S1-S4 × {full,changed} + SFIX × fix, 1k/10k/100k/1m) + HISTORY.md refresh"
          git push origin "$branch" --force

          # Render a per-cell summary the maintainer pastes into HISTORY.md.
          json=docs/benchmarks/macro/results/linux-x86_64/"${OUT_LABEL}"/results.json
          summary=$(jq -r '.rows[] | "- \(.scenario) \(.size_label) \(.mode): \(.mean_ms | tostring | .[0:6]) ms ± \(.stddev_ms | tostring | .[0:5])"' "$json")

          gh pr create \
            --title "docs(bench): ${OUT_LABEL} bench-scale results" \
            --body "$(cat <<EOF
          Auto-opened by \`bench-record.yml\` for source SHA \`${SOURCE_SHA}\`.

          ## What landed

          - \`docs/benchmarks/macro/results/linux-x86_64/${OUT_LABEL}/\` — the
            consolidated publish-grade hyperfine matrix (S1-S4 × {1k, 10k, 100k,
            1m} × {full, changed}, plus SFIX × fix) at \`--warmup 3 --runs 10\`.
          - \`docs/benchmarks/micro/results/linux-x86_64/${OUT_LABEL}/criterion/\`
            — trimmed criterion snapshot from \`cargo bench -p alint-bench\`.
          - \`docs/benchmarks/HISTORY.md\` — auto-refreshed via
            \`xtask/scripts/render-history.py\` to surface the new
            \`${OUT_LABEL}\` row across the headline + per-scenario tables.
            Date + headline blurb come from CHANGELOG.md's
            \`## [X.Y.Z] — YYYY-MM-DD\` header + first sentence
            beneath it.

          ## Maintainer review checklist

          - [ ] Run \`xtask bench-gate\` against the previous release's
            \`results.json\` — non-zero exit blocks the merge. Replaces
            the v0.9.22-and-earlier "CV > 10 % eyeball" (which was
            never met by any shipped release and never enforced in
            code); see [\`RELEASING.md\`](../RELEASING.md) §"Bench-record review"
            for the canonical procedure.
            \`\`\`sh
            git fetch origin ${branch}
            git show origin/${branch}:docs/benchmarks/macro/results/linux-x86_64/${OUT_LABEL}/results.json > /tmp/new.json
            cargo run -q -p xtask -- bench-gate \\
              --results /tmp/new.json \\
              --baseline docs/benchmarks/macro/results/linux-x86_64/v<prev>/results.json
            \`\`\`
            Gating: per-cell within-run CV ≤ 10 % on 100k/1m cells
            (1k/10k advisory); \`min_ms\` regression ≤ +15 % vs the
            prior release on ≥10k cells. New cells with no baseline
            mate are skipped from the regression check.
          - [ ] Eyeball the HISTORY.md headline row for
            \`${OUT_LABEL}\` — if the auto-extracted first sentence
            from CHANGELOG.md isn't a good one-row blurb, edit
            CHANGELOG.md to make the first sentence punchier and
            re-render via
            \`python3 xtask/scripts/render-history.py > docs/benchmarks/HISTORY.md\`.
          - [ ] Verify the workspace version in the bench fingerprint matches
            the tag/label.

          ## Per-cell numbers

