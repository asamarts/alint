version: 2

# Weekly cadence is generous enough not to drown the queue but
# tight enough that an action stuck on a deprecated version
# surfaces within a release cycle.
#
# `cargo` updates honour the workspace `Cargo.lock` — Dependabot
# bumps lockfile entries; we review/merge.
#
# `github-actions` covers every `uses:` in `.github/workflows/`.
# This is the lane that actually rots: docker/setup-buildx
# minor-pinned to @v3 means bug fixes get picked up; @v4 majors
# arrive as PRs we evaluate.
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: America/New_York
    open-pull-requests-limit: 5
    groups:
      patch-and-minor:
        update-types:
          - patch
          - minor
    # roxmltree 0.21 regressed deep-nesting parsing: Document::parse
    # stack-overflows (SIGABRT) on deeply-nested XML instead of returning
    # a parse error, before alint's MAX_XML_DEPTH guard (post-parse
    # tree-walk) can fire. alint parses untrusted XML from linted repos,
    # so hold at 0.20 until a fixed release. Repro in closed PR #44.
    ignore:
      - dependency-name: "roxmltree"
        versions: ["0.21.x"]
    commit-message:
      prefix: "chore(deps)"
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: America/New_York
    open-pull-requests-limit: 5
    groups:
      actions-patch-and-minor:
        update-types:
          - patch
          - minor
    # dtolnay/rust-toolchain is now SHA-pinned with an explicit `toolchain:`
    # input (bench-record.yml uses `toolchain: 1.97.0`, the canonical bench
    # fingerprint the whole macro corpus is measured on). Holding it here keeps
    # both the action SHA and that pinned rustc stable: the rustc bump is done
    # MANUALLY in lock-step with a re-baseline, not by Dependabot (which once
    # bumped 1.97.0 -> 1.100.0 in #132, silently breaking fingerprint repro).
    ignore:
      - dependency-name: "dtolnay/rust-toolchain"
    commit-message:
      prefix: "chore(actions)"
      include: scope

  # ── Distribution + editor packaging ecosystems ─────────────────────
  # Same cadence, grouping and commit style as the two lanes above. Each
  # of these ships to users (the VS Code / Open VSX extension, the npm
  # shim's runtime `tar` dep, the Zed wasm extension, the JetBrains
  # plugin's Gradle build, the release image's base), so letting them
  # rot is a supply-chain risk, not just hygiene.
  - package-ecosystem: npm
    directory: /editors/vscode
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: America/New_York
    open-pull-requests-limit: 5
    groups:
      vscode-patch-and-minor:
        update-types:
          - patch
          - minor
    ignore:
      # @types/vscode must not exceed engines.vscode (^1.91.0) or vsce
      # refuses to package; bump it together with the engine floor, by hand.
      - dependency-name: "@types/vscode"
      # @types/node tracks the Node runtime VS Code's extension host ships.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "chore(deps)"
      include: scope

  - package-ecosystem: npm
    directory: /npm
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: America/New_York
    open-pull-requests-limit: 5
    groups:
      npm-shim-patch-and-minor:
        update-types:
          - patch
          - minor
    commit-message:
      prefix: "chore(deps)"
      include: scope

  - package-ecosystem: cargo
    directory: /editors/zed
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: America/New_York
    open-pull-requests-limit: 5
    groups:
      zed-patch-and-minor:
        update-types:
          - patch
          - minor
    commit-message:
      prefix: "chore(deps)"
      include: scope

  - package-ecosystem: gradle
    directory: /editors/jetbrains
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: America/New_York
    open-pull-requests-limit: 5
    groups:
      jetbrains-patch-and-minor:
        update-types:
          - patch
          - minor
    commit-message:
      prefix: "chore(deps)"
      include: scope

  # The release image (/Dockerfile). Its base is digest-pinned, so this is
  # the lane that moves the digest forward. bench/Dockerfile is deliberately
  # NOT covered: its toolchain + base are part of the bench fingerprint and
  # move only with a re-baseline.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: America/New_York
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(docker)"
      include: scope
