# yaml-language-server: $schema=https://raw.githubusercontent.com/asamarts/alint/main/schemas/v1/config.json
#
# alint v0.23 corpus-stratum config: thunderbird/thunderbird-android
# Pinned @ ac1f0e85f63c1b600ac443d1fb2d939bffff7de5 (stratum: i18n)
#
# Covers: Android lint's translation checks that alint can read (ExtraTranslation and
# Untranslatable as android-strings key_parity per module, LocaleFolder,
# InvalidResourceFolder, HardcodedText, StringEscaping, ByteOrderMark, EnforceUTF8),
# the cs/lt/sk plural review rule, the localeFilters / supported_languages sync, the
# version-catalog reference integrity Gradle needs, the JDK 21 floor of the daemon
# toolchain, the SHA-pin workflow gate, the feature-flag and changelog JSON schemas and
# the feature-flag override keys, detekt's and ktlint's file properties, the
# requirements.txt pin convention, ADR-0005 (versions only in the version catalog), the
# buildCliTools list and three load-bearing sync comments.
#
# Stage C (integration of the Stage B review) changed: the BOM pattern (mid-file only),
# EnforceUTF8 as a for_each_match (A), the requirements regex (hash-pinned form allowed),
# the SHA-pin gate as a line rule that mirrors scripts/ci/validate-github-actions-pinned.sh
# (pinned_references kept as value-add), the .gitignore and detekt scopes, the two
# key_parity modules whose other default values files hold translatable keys
# (cross_file superset over the union of default files), a strict-JSON companion for the
# feature-flag catalog, and added rules for StringEscaping (C), the feature-flag override
# keys (C), InvalidResourceFolder (C), catalog refs (C), the JDK floor (C), buildCliTools
# (A), detekt MaxLineLength (C) and ktlint no-trailing-spaces / no-consecutive-blank-lines
# (A).
#
# Shape: Android / Kotlin (KMP in places) white-label mail client (Thunderbird for
# Android + K-9 Mail), Gradle Kotlin DSL with an included `build-plugin` build, a
# `components` included build, gradle/libs.versions.toml version catalog, ~70 locales
# per module synced from Weblate into ~34 Android res modules plus Compose Multiplatform
# resources.
#
# WHERE THE ENFORCED VALIDATION LIVES
#   quality-checks.yml   spotlessCheck (ktlint, flexmark, .gitignore misc) / detekt /
#                        dependencyGuard / Konsist import tests            (mostly D)
#   build-android.yml    assemble x4, badging checks, testsOnCi, `./gradlew lint` with
#                        config/lint/lint.xml (abortOnError=true, warningsAsErrors=false,
#                        so only severity="error" issues gate)
#   validate-*.yml       SHA-pinned actions (scripts/ci/validate-github-actions-pinned.sh),
#                        Gradle wrapper validation, open milestones (GitHub API)
#   pr-sentinel.yml      PR title / linked issue / AI disclosure / commit subjects /
#                        no Co-authored-by / no merge commits (PR metadata + history)
#   build-scripts.yml    Python py_compile + changelog unittest
#   quality-markdown.yml spotlessFlexmarkCheck + `mdbook test docs` (create-missing=false)
#   root build.gradle.kts featureFlag plugin: schema + catalog validation on every build
#   shippable_builds.yml release-time: changelog JSON validated against schemas/*.json,
#                        release notes <= 500 chars, version-code ceiling
#   docs/contributing/*.md + load-bearing comments: language-list sync and ordering,
#                        cs/lt/sk plural forms, Weblate-only translations
#
# Not enforced at the pin (R5, so no rule): lint.xml MissingTranslation, ImpliedQuantity
# and UnusedResources are severity="warning" with warningsAsErrors=false (~38k missing
# translations at HEAD); the catalog header's "sorted alphabetically within their
# section" (38 inversions); "AGP and tools should be updated together" (AGP 9.5.1 vs
# androidTools 32.5.0); the wrapper task's catalog source (libs `gradle` 9.6.1 vs wrapper
# 9.7.0); requirements.txt "pinned by ... hash" (no hashes); docs "every page in
# SUMMARY.md" (security/incident-response-plan.md is not); the API/internal module
# boundary (legacy/* and the drawer dropdown depend on :impl modules); Kover thresholds
# (disabled unless CODE_COVERAGE_DISABLED=false); the KMP detekt step (continue-on-error).

version: 1

rules:
  # ══════════════════════════════════════════════════════════════════════
  # LOCALE family
  # ══════════════════════════════════════════════════════════════════════

  # thunderbird-android-01 / -02 (A): Android lint ExtraTranslation (severity error) and
  # Untranslatable (severity error), config/lint/lint.xml:6,11, run by
  # build-android.yml `./gradlew lint` with abortOnError=true
  # (build-plugin/src/main/kotlin/thunderbird.{app,library}.android.gradle.kts).
  # The android-strings dialect keys (element type, name) and skips translatable="false"
  # entries, so with direction: extra a peer key the default file lacks fires
  # (ExtraTranslation) and a translated translatable="false" string fires too
  # (Untranslatable). One rule per lint-checked res module: key_parity cannot be nested
  # under for_each_* (known defect), and lint compares each module's translations with
  # that module's default strings. Two directories with translations but no default
  # values/ are not Android source sets and are not linted (the deleted
  # core/ui/compose/designsystem module and the KMP feature/mail/message/reader/api
  # src/main/res), so they get no rule.
  # Reference scope (Stage B): lint compares a translation with EVERY default values/*.xml
  # of the module, key_parity takes one reference file. In 32 modules the other default
  # files hold no string resources, or only translatable="false" ones (constants.xml),
  # whose translation lint reports as Untranslatable anyway, so values/strings.xml is an
  # exact reference at the pin. app-k9mail (funding_strings.xml, 7 translatable strings)
  # and legacy/ui/legacy (arrays*.xml, translatable string-arrays) are different: a
  # translation of such a key in values-*/strings.xml passes lint but fired key_parity
  # (reproduced in scratch with theme_entries in legacy values-de). Those two modules use
  # cross_file superset over the union of their default files instead; it keys by name
  # only (not element type) and its source also holds non-string resource names, so a
  # translated string named like a style or color would not fire. Remaining limitation for
  # all 34: with checkDependencies=true lint also accepts a key defined in a dependency's
  # default values, which a per-module rule cannot see (no such key at the pin).
  - id: thunderbird-android-translations-no-extra-keys-app-common
    kind: key_parity
    format: android-strings
    reference: app-common/src/main/res/values/strings.xml
    peers: "app-common/src/main/res/values-*/strings.xml"
    direction: extra
    level: error
    message: >-
      A translation declares a string, string-array or plurals that app-common/src/main/res/values/strings.xml
      does not declare (lint ExtraTranslation), or translates a translatable="false" string
      (lint Untranslatable). Remove the stale key from the translation (it comes back from Weblate).
  # app-k9mail: default strings live in strings.xml and funding_strings.xml (translatable)
  # plus constants.xml (translatable="false"); the source is their union minus
  # translatable="false" entries. `..` handles one-element (object) and many-element
  # (array) cardinality alike.
  - id: thunderbird-android-translations-no-extra-keys-app-k9mail
    kind: cross_file
    relation: superset
    source:
      files: "app-k9mail/src/main/res/values/*.xml"
      extract: { xml: "$.resources..[?(@['@name'] && @['@translatable'] != 'false')]['@name']" }
    targets:
      files: "app-k9mail/src/main/res/values-*/strings.xml"
      extract: { xml: "$.resources..[?(@['@name'])]['@name']" }
    level: error
    message: >-
      A translation declares a resource name that no default app-k9mail/src/main/res/values/*.xml
      declares (lint ExtraTranslation), or translates a translatable="false" one
      (lint Untranslatable). Remove the stale key from the translation (it comes back from Weblate).
