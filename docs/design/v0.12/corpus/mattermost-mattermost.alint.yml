  # ════════════════════════════════════════════════════════════════
  # VALUE-ADD — not enforced by the repository; outside the ratio (R3/R5).
  # ════════════════════════════════════════════════════════════════

  # VA1 — server/AGENTS.md asks for every server/i18n/en.json entry to carry a
  #   description; one entry has an empty one at the pin, so the convention is
  #   not enforced (R5). EXPECTED FINDING at the pin (1, info):
  #   app.import.validate_reaction_import_data.emoji_name_invalid.error.
  - id: mattermost-va-server-en-descriptions
    kind: json_path_absent
    paths: ["server/i18n/en.json"]
    path: $[?!search(@.description, '\\S')]
    level: info
    message: "Value-add: every server en.json entry carries a non-empty description (server/AGENTS.md)."

  # VA2 — the Go toolchain pin: server/.go-version (what buildenv-tag.sh
  #   checks) and the go directive of server/go.mod and server/public/go.mod
  #   (what most CI jobs install, via go-version-file) agree. Not enforced.
  - id: mattermost-va-go-mod-matches-go-version
    kind: cross_file
    source:
      file: server/.go-version
      extract: { regex: '\A\s*([0-9]+\.[0-9]+\.[0-9]+)\s*\z' }
    targets:
      - file: server/go.mod
        extract: { regex: '(?m)^go ([0-9][0-9.]*)\s*$' }
      - file: server/public/go.mod
        extract: { regex: '(?m)^go ([0-9][0-9.]*)\s*$' }
    relation: equals
    level: info
    message: "Value-add: the server modules' go directive matches server/.go-version."

  # VA3 — policy declaration (R3): webapp/.npmrc keeps engine-strict=true
  #   (what makes engines.node / engines.npm binding) and save-exact=true.
  - id: mattermost-va-webapp-npmrc-policy
    kind: file_content_matches
    paths: ["webapp/.npmrc"]
    pattern: '(?m)^engine-strict\s*=\s*true\s*$'
    level: info
    message: "Value-add: webapp/.npmrc keeps engine-strict=true."

  # VA4 — former unit mattermost-15, REMOVED by Stage B as an R1 duplicate of
  #   mattermost-16 (B-adapter, needs order): check_icu.mjs:159-173 is one comparison,
  #   text !== JSON.stringify(sorted, null, 2) + '\n', so key order and
  #   duplicate keys are part of the canonical-form (formatting) unit, not a
  #   separately enforced behavior. Kept only as a value-add approximation of
  #   the order half of that check. LIMITATION: ordered_block reads keys with a
  #   line regex over the one-key-per-line layout (a regex read of JSON keys),
  #   and says nothing about indent or the trailing newline. Passes at the pin.
  - id: mattermost-webapp-i18n-keys-sorted
    kind: ordered_block
    paths:
      include: ["webapp/channels/src/i18n/*.json"]
      exclude: ["webapp/channels/src/i18n/en.json"]
    select: '^  "'
    comparator: lexical
    unique: true
    level: info
    message: "Value-add: webapp catalog keys stay in code-point order (part of check_icu.mjs canonical form)."
