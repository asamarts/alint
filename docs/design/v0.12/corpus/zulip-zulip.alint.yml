  - id: zulip-cc-prose-botserver
    kind: file_content_forbidden
    paths:
      include: ["**/*.{html,hbs,md}"]
      exclude: ["web/third/**", "**/*custom_check.py*", "docs/code-of-conduct.md", "docs/overview/readme.md", "docs/contributing/contributing.md", "docs/contributing/reporting-security-vulnerabilities.md", "templates/corporate/policies/index.md"]
    pattern: '[^\-_p]botserver(?:[^r]|r[^c]|r?\z)|bot server'
    level: error

  # ── html_rules (html, hbs) ──────────────────────────────────────────────
  # zulip-cc-56 (A) "`placeholder` value should be translatable." (double- and single-quoted)
  - id: zulip-cc-placeholder-translatable-dq
    kind: for_each_match
    paths:
      include: ["**/*.{html,hbs}"]
      exclude:
        - "web/third/**"
        - "**/*custom_check.py*"
        - "templates/corporate/**"
        - "templates/zerver/integrations/catalog.html"
        - "web/templates/settings/playground_settings_admin.hbs"
        - "templates/zerver/create_realm/realm_creation_subdomain_form_field.html"
        - "templates/zerver/slack_import.html"
    select: 'placeholder="[^{#].'
    require:
      matches: ['placeholder="[^{#].*\.com']
    level: error
  - id: zulip-cc-placeholder-translatable-dq-exempt
    kind: for_each_match
    paths: ["templates/zerver/create_realm/realm_creation_subdomain_form_field.html", "templates/zerver/slack_import.html"]
    select: 'placeholder="[^{#].'
    require:
      matches: ['placeholder="[^{#].*\.com|^\s*(?:placeholder="acme"|placeholder="xoxb-…")\s*$']
    level: error
  - id: zulip-cc-placeholder-translatable-sq
    kind: file_content_forbidden
    paths:
      include: ["**/*.{html,hbs}"]
      exclude: ["web/third/**", "**/*custom_check.py*", "templates/corporate/**"]
    pattern: 'placeholder=''[^{]'
    level: error

  # zulip-cc-57 (A) "Likely missing quoting in HTML attribute" (`={`, URL templates exempt)
  - id: zulip-cc-attr-quoting
    kind: for_each_match
    paths:
      include: ["**/*.{html,hbs}"]
      exclude: ["web/third/**", "**/*custom_check.py*", "templates/corporate/pricing_model.html"]
    select: '=\{'
    require:
      matches: ['=\{code\}|\?[a-z]+=\{|&[a-z]+=\{']
    level: error

  # zulip-cc-58 (A) "Likely misplaced quoting in translation tags"
  - id: zulip-cc-translation-tag-quoting
    kind: file_content_forbidden
    paths:
      include: ["**/*.{html,hbs}"]
      exclude: ["web/third/**", "**/*custom_check.py*"]
    pattern: ' ''\}\}'
    level: error

  # zulip-cc-59 (A) "`aria-label` value should be translatable."
  - id: zulip-cc-aria-label-translatable
    kind: file_content_forbidden
    paths:
      include: ["**/*.{html,hbs}"]
      exclude: ["web/third/**", "**/*custom_check.py*"]
    pattern: 'aria-label=[''"][^{]'
    level: error

  # zulip-cc-60 (A) "Don't directly load dependencies from CDNs."
  - id: zulip-cc-no-cdn-scripts
    kind: file_content_forbidden
    paths:
      include: ["**/*.{html,hbs}"]
      exclude: ["web/third/**", "**/*custom_check.py*"]
    pattern: '<script[^<>]*\ssrc=[''"]?(?:https?:|//)'
    level: error

  # zulip-cc-61 (A) "`title` value should be translatable."
  - id: zulip-cc-title-translatable-sq
    kind: file_content_forbidden
    paths:
      include: ["**/*.{html,hbs}"]
      exclude: ["web/third/**", "**/*custom_check.py*"]
    pattern: 'title=''[^{]'
    level: error
  - id: zulip-cc-title-translatable-dq
    kind: file_content_forbidden
    paths:
      include: ["**/*.{html,hbs}"]
      exclude:
        - "web/third/**"
        - "**/*custom_check.py*"
        - "templates/zerver/emails/**"
        - "templates/corporate/support/realm_details.html"
        - "templates/corporate/support/remote_server_support.html"
        - "templates/corporate/support/support.html"
        - "templates/corporate/support/remote_realm_details.html"
    pattern: 'title="[^{:]'
    level: error

  # zulip-cc-62 (A) "alt argument should be enclosed by _() or it should be an empty string."
  # (plus the companion "alt argument should be enclosed by _()." for `alt="{{ "`)
  - id: zulip-cc-alt-translatable
    kind: file_content_forbidden
    paths:
      include: ["**/*.{html,hbs}"]
      exclude: ["web/third/**", "**/*custom_check.py*", "web/templates/keyboard_shortcuts.hbs"]
    pattern: '\Walt=["''][^{"'']|\Walt=["'']\{\{ ?["'']'
    level: error
  - id: zulip-cc-alt-translatable-exempt
    kind: for_each_match
    paths: ["web/templates/keyboard_shortcuts.hbs"]
    select: '[^\w]alt=["''](?:[^{"'']|$)|[^\w]alt=["'']\{\{ ?["'']'
