  # zulip-cc-75 is B-adapter (not expressed): "Linkified Markdown URLs should use cleaner
  # <http://example.com> syntax." `\[(?P<url>[^\]]+)\]\((?P=url)\)` needs a backreference;
  # for_each_match's require.equal asserts equality, and there is no inequality operator.

  # zulip-cc-76 (A) "Use relative links (../foo/bar.html) to other documents in docs/"
  - id: zulip-cc-docs-relative-links
    kind: file_content_forbidden
    paths:
      include: ["**/*docs/**/*.md"]
      exclude:
        - "web/third/**"
        - "**/*custom_check.py*"
        - "docs/code-of-conduct.md"
        - "docs/overview/readme.md"
        - "docs/contributing/contributing.md"
        - "docs/contributing/reporting-security-vulnerabilities.md"
