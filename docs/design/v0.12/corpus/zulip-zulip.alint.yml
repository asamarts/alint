  # zulip-a01 and zulip-a02 (A), split out of zulip-82 by the audit, as tq-38/39,
  #     element-web-27/28 and immich-30/31 were - .github/workflows/zizmor.yml runs
  #     zizmorcore/zizmor-action with its defaults (SARIF upload) and no zizmor
  #     config file. The only inline ignores are ignore[cache-poisoning]; nothing
  #     ignores artipacked or unpinned-uses, and neither has a finding at the pin
  #     (all 7 actions/checkout steps set persist-credentials; every uses: is
  #     SHA-pinned). Rules copied from TanStack-query.alint.yml tq-38/tq-39.
  # zulip-a01 artipacked: every actions/checkout step sets persist-credentials explicitly.
  - id: zulip-gha-checkout-persist-credentials
    kind: yaml_path_absent
    paths: ".github/workflows/*.{yml,yaml}"
    path: "$..steps[?match(@.uses, 'actions/checkout@.*') && !@.with['persist-credentials']]"
    level: error
    message: "actions/checkout must set persist-credentials explicitly (zizmor artipacked)."
  # zulip-a02 unpinned-uses (default policy): third-party actions and reusable workflows are
  # pinned to a full 40-hex SHA; actions/*, github/* and dependabot/* may be
  # ref-pinned; local ./ actions are exempt.
  - id: zulip-gha-third-party-actions-hash-pinned
    kind: yaml_path_absent
    paths: ".github/workflows/*.{yml,yaml}"
    path: "$..[?@.uses && !match(@.uses, '[.]/.*') && !match(@.uses, '(actions|github|dependabot)/[^@]+@.+') && !match(@.uses, '[^@]+@[0-9a-f]{40}')]"
    level: error
    message: "Third-party actions and reusable workflows must be pinned to a full commit SHA (zizmor unpinned-uses)."

  # ══════════════════════════════════════════════════════════════════════
  # VALUE-ADD (outside the coverage ratio, R3/R5): assertions zulip does not
  # enforce today. Kept at info level.
  # ══════════════════════════════════════════════════════════════════════

  # VALUE-ADD (toolchain-pin): the uv pin in scripts/lib/install-uv (used by
  # provision) and the Read the Docs build (.readthedocs.yaml) agree. Nothing
  # checks this today; a bump of one leaves the other behind.
  - id: zulip-va-uv-version-sync
    kind: cross_file
    source:
      file: "scripts/lib/install-uv"
      extract: { regex: '(?m)^version=(\S+)$' }
    targets:
      - file: ".readthedocs.yaml"
        extract: { regex: 'asdf install uv (\S+)' }
      - file: ".readthedocs.yaml"
        extract: { regex: 'asdf global uv (\S+)' }
    level: info
    message: "uv version differs between scripts/lib/install-uv and .readthedocs.yaml."

  # VALUE-ADD (toolchain-pin): one Python floor across requires-python, the
  # black and ruff target-version, and the RTD build Python.
  - id: zulip-va-python-floor-sync
    kind: cross_file
    source:
      file: "pyproject.toml"
      extract: { regex: '(?m)^requires-python = ">=3\.(\d+)"' }
    targets:
      - file: "pyproject.toml"
        extract: { regex: '(?m)^target-version = \["py3(\d+)"\]' }
      - file: "pyproject.toml"
        extract: { regex: '(?m)^target-version = "py3(\d+)"' }
      - file: ".readthedocs.yaml"
        extract: { regex: '(?m)^\s*python: "3\.(\d+)"' }
    level: info
    message: "The Python 3 minor floor differs between requires-python, black/ruff target-version and .readthedocs.yaml."

  # VALUE-ADD (dep-version): the release-age supply-chain policy stays declared
  # for both resolvers (pnpm enforces minimumReleaseAge and uv exclude-newer at
  # resolution, but nothing guards against the declaration being dropped).
  - id: zulip-va-pnpm-minimum-release-age
    kind: yaml_path_equals
    paths: ["pnpm-workspace.yaml"]
    path: "$.minimumReleaseAge"
    equals: 1440
    level: info
    message: "pnpm-workspace.yaml should keep minimumReleaseAge: 1440 (one day)."
  - id: zulip-va-uv-exclude-newer
    kind: toml_path_equals
    paths: ["pyproject.toml"]
    path: "$.tool.uv['exclude-newer']"
    equals: "24 hours"
    level: info
    message: 'pyproject.toml should keep [tool.uv] exclude-newer = "24 hours".'
