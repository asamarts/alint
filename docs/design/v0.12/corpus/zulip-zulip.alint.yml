  # ── handlebars_rules (hbs) ──────────────────────────────────────────────
  # zulip-cc-65 (A) "Do not use inline <script> tags here; put JavaScript in web/src instead."
  - id: zulip-cc-hbs-no-script
    kind: file_content_forbidden
