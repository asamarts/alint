# yaml-language-server: $schema=https://raw.githubusercontent.com/asamarts/alint/main/schemas/v1/config.json
#
# alint v0.23 corpus-stratum config -- zulip/zulip
# Pinned @ 39bd5f2f40a647af06b1cc0267cddd34f88ed2e9  (stratum: i18n)
#
# Covers: the locale-catalog shape gates compilemessages enforces (every
# locale/<x>/LC_MESSAGES/django.po has a parseable translations.json and a
# Language-Team header), the tusd dependency pin kept in sync between Puppet and
# tools/setup, the zulint custom_check.py regex rule set (tools/lint
# custom_py/custom_nonpy), check-executables, the .mailmap sort, the
# docs/THIRDPARTY DEP-5 checks, check-openapi's structural OpenAPI rules,
# check-feature-level-updated, check-schemas' fixture order, test-js-with-node's
# EXEMPT_FILES list, test-migrations' auto-name ban, the release-tarball exclude
# list, tools/release's feature-level check, and five "keep in sync" value
# conventions (tusd, Cloud price, dropdown height, MAX_IDX, upload resize
# dimensions). Four VALUE-ADD rules (uv and Python-floor pins, release-age
# declarations) sit at the end, outside the ratio.
#
# Shape: Django + TypeScript monolith (uv + pnpm, one pnpm workspace member,
# starlight_help), Puppet deploy tree, GitHub Actions CI (zulip-ci.yml,
# production-suite.yml). Translations come from Weblate; locale/en (the source
# catalog) is generated by `manage.py makemessages` and gitignored.
#
# WHERE THE ENFORCED VALIDATION LIVES
#   zulip-ci.yml          tools/lint (zulint: ~20 external linters + ~100 regex
#                         rules in tools/linter_lib/custom_check.py), test-tools,
#                         check-schemas, makemessages + check-capitalization +
#                         check-frontend-i18n, test-migrations, check-executables,
#                         pnpm dedupe --check, uv lock --check, the test suites.
#   provision (CI setup)  pnpm install --frozen-lockfile, compilemessages over
#                         every locale (msgfmt --check-format).
#   api-docs-update-check check-feature-level-updated (no ZF- placeholders),
#                         on push to main only. Its notify job's
#                         github-changes-contain-file step only decides whether
#                         a post-merge notification is sent; it gates nothing,
#                         so no rule here models it.
#   production-suite.yml  release tarball build (release-tarball-exclude.txt
#                         entries must exist) + install/upgrade tests.
#   tools/release         maintainer release gate: API_FEATURE_LEVEL is
#                         documented in api_docs/changelog.md.
#   tools/i18n/sync-translations (maintainer gate): NFC normalization of
#                         locale/**/*.{po,json}, compilemessages.
#   docs + comments       commit-discipline.md / .gitlint (commit messages),
#                         "Keep in sync" load-bearing comments.
#
# Scope notes for the custom_check rules (zulint semantics, not reproducible by
# file globs alone):
#   * zulint lints extensionless scripts whose shebang names python as "py";
#     alint cannot select by shebang, so the 83 such non-symlink files at the
#     pin are listed explicitly in the &py anchor below (new ones would need
#     adding).
#   * zulint `exclude` entries are path prefixes -> `<prefix>/**` globs;
#     `include_only` entries are substrings -> `**/<x>/**` globs.
#   * zulint `exclude_pattern` (skip the line) -> for_each_match require.matches;
#     `exclude_line` (exact stripped line, per file) -> the main rule excludes
#     the exempt files, and a companion "-exempt" rule scoped to just those
#     files allows the exact lines (any listed line in any listed file: a
#     negligible relaxation).
#   * Matching model (inferred, zulint is not vendored): each pattern runs over
#     the whole file with ^/$ per line and \A/\Z at the file ends. Evidence:
#     the `\A#!` shebang rules pass CI although zerver/openapi/
#     markdown_extension.py:69 and :79 hold `#!` lines inside strings, and the
#     patterns add `\n` to negated classes themselves. Patterns are kept
#     verbatim where RE2 allows; lookaheads become select+require or are
#     unrolled.
#   * zulint lists files with `git ls-files` and drops symlinks (inferred:
#     docs/contributing/reporting-security-vulnerabilities.md -> SECURITY.md
#     holds readthedocs "latest" links under docs/ yet passes). The tracked
#     symlinks that a custom_check language would select (five .md files, three
#     webhook .json fixtures, the scripts/start-server python script) are
#     therefore left out of those rules; they stay visible to the THIRDPARTY and
#     custom_check path-existence rules, which resolve paths, not content.
#     zulint also skips any path containing "custom_check.py" (the rules file
#     itself), so every custom_check rule excludes it.
#   * zulint skips lines ending in "  # nolint"; at the pin the only such line is
#     already out of scope (zerver/views/development/).
#
# Rules marked VALUE-ADD are outside the coverage ratio (R3/R5).

version: 1

extends:
  # Inert at the pin: zulip has no .nvmrc / .node-version / .python-version /
  # .tool-versions root authority, so no ecosystem activates (R6 absence).
  - alint://bundled/toolchain-pins@v1

rules:
  # ══════════════════════════════════════════════════════════════════════
  # LOCALE family
  # ══════════════════════════════════════════════════════════════════════

  # zulip-03 (A) compilemessages (run by provision in every CI job) opens
  # locale/<x>/translations.json for every locale that has a tracked
  # LC_MESSAGES/django.po (get_translation_percentage); a missing file aborts.
  - id: zulip-locale-po-has-translations-json
    kind: pair
    primary: "locale/*/LC_MESSAGES/django.po"
    partner: "{dir}/../translations.json"
    level: error
    message: >-
      Every locale with LC_MESSAGES/django.po needs a sibling translations.json
      (zerver/management/commands/compilemessages.py reads both).

  # zulip-04 (A) compilemessages and zerver/lib/i18n.py orjson.loads() each
  # locale/<x>/translations.json; it must parse, and compilemessages.py:147-160
  # calls .values() on the result, so the root must be a JSON object. Two
  # rules: the JSONPath below is a probe that never matches, so its only
  # failure mode is a parse failure; the companion rule requires the first
  # non-whitespace byte to be `{`. A document that parses AND starts with `{`
  # has an object root, so a top-level array, string, number, boolean or null
  # fails. (JSONPath alone cannot do this: no selector tells `[]` from `{}` or
  # selects a scalar root, and the clone holds no JSON Schema to point
  # json_schema_passes at.) Residual gap: alint's JSON parse is JSONC-tolerant,
  # so `//` comments or trailing commas pass here but fail orjson.
  - id: zulip-locale-translations-json-parses
    kind: json_path_absent
    paths: ["locale/*/translations.json"]
    path: "$['__alint_parse_probe__']"
    level: error
    message: "locale/<x>/translations.json must be valid JSON (compilemessages loads it)."
  - id: zulip-locale-translations-json-object-root
    kind: file_content_matches
    paths: ["locale/*/translations.json"]
    pattern: '\A[ \t\r\n]*\{'
    level: error
    message: "locale/<x>/translations.json must hold a JSON object at the top level (compilemessages calls .values() on it)."

  # zulip-07 (C) compilemessages.get_name_from_po_file: for a locale code Django's
  # LANG_INFO does not know, the .po header's Language-Team must read
  # "Name <...>" or provision fails with "Unknown language". alint cannot see
  # LANG_INFO (external package data), so this asserts the header for every
  # locale: an over-approximation that holds at the pin.
  - id: zulip-locale-po-language-team
    kind: file_content_matches
    paths: ["locale/*/LC_MESSAGES/django.po"]
    pattern: '(?m)^"Language-Team: [^"<]+ <'
    level: error
    message: 'django.po needs a `Language-Team: Name <url>` header (compilemessages derives the language name from it).'

  # zulip-b01 (A) Django's compilemessages (subclassed by
  # zerver/management/commands/compilemessages.py:30-31, run by provision in
  # every CI job via tools/lib/provision_inner.py:374-375) refuses a .po file
  # that starts with a byte-order mark (its has_bom check raises CommandError);
  # msgfmt rejects one too. Separate from zulip-01's gettext-syntax delegate.
  - id: zulip-locale-po-no-bom
    kind: no_bom
    paths: ["locale/*/LC_MESSAGES/django.po"]
    level: error
    message: "locale/<x>/LC_MESSAGES/django.po must not start with a byte-order mark (Django compilemessages rejects it)."

  # ══════════════════════════════════════════════════════════════════════
  # DEP-VERSION family
  # ══════════════════════════════════════════════════════════════════════

  # zulip-13 (A) "Keep in sync with tools/setup/install-tusd" (common.pp) and
  # "This should be kept in sync with puppet/zulip/manifests/common.pp"
  # (install-tusd): one tusd release, same version and per-arch sha256 in both.
  - id: zulip-tusd-version-sync
    kind: cross_file
    source:
      file: "puppet/zulip/manifests/common.pp"
      extract: { regex: "(?s)'tusd' => \\{\\s*'version' => '([^']+)'" }
    targets:
      - file: "tools/setup/install-tusd"
        extract: { regex: '(?m)^version=(\S+)$' }
    level: error
    message: "tusd version must match between puppet/zulip/manifests/common.pp and tools/setup/install-tusd."

  - id: zulip-tusd-sha256-amd64-sync
    kind: cross_file
    source:
      file: "puppet/zulip/manifests/common.pp"
      extract: { regex: "(?s)'tusd' => \\{.*?'amd64'\\s*=> '([0-9a-f]{64})'" }
    targets:
      - file: "tools/setup/install-tusd"
        extract: { regex: '(?s)tarball="tusd_linux_amd64"\s*sha256=([0-9a-f]{64})' }
    level: error
    message: "tusd amd64 sha256 must match between common.pp and tools/setup/install-tusd."

  - id: zulip-tusd-sha256-arm64-sync
    kind: cross_file
    source:
      file: "puppet/zulip/manifests/common.pp"
      extract: { regex: "(?s)'tusd' => \\{.*?'aarch64'\\s*=> '([0-9a-f]{64})'" }
    targets:
      - file: "tools/setup/install-tusd"
        extract: { regex: '(?s)tarball="tusd_linux_arm64"\s*sha256=([0-9a-f]{64})' }
    level: error
    message: "tusd aarch64 sha256 must match between common.pp and tools/setup/install-tusd."

  # zulip-18 (A) scripts/lib/node_cache.py runs `corepack pnpm install`, so
  # package.json's packageManager must be a pnpm pin Corepack accepts: an
  # exact version with an optional integrity hash. Fetching that version is
  # environment state; the spec itself is file content.
  - id: zulip-package-manager-pnpm-pinned
    kind: json_path_matches
    paths: "package.json"
    path: "$.packageManager"
    matches: '^pnpm@[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?(?:\+sha(?:1|224|256|384|512)\.[0-9a-f]+)?$'
    level: error
    message: "package.json packageManager must pin pnpm@<x.y.z>[+sha512.<hash>]; node_cache.py runs corepack pnpm."

  # ══════════════════════════════════════════════════════════════════════
  # OTHER family: bespoke gates outside custom_check.py
  # ══════════════════════════════════════════════════════════════════════

  # zulip-20 (A) tools/ci/check-executables: every mode-100755 blob starts with #!.
  - id: zulip-executables-have-shebang
    kind: executable_has_shebang
    paths: ["**"]
    level: error
    message: "Non-scripts should not be marked executable (tools/ci/check-executables)."

  # zulip-21 (C) tools/lint `mailmap`: grep '^[^#]' .mailmap | LC_ALL=C.UTF-8 sort -cf
  # Awkward: `sort -f` folds to UPPERCASE while alint's lexical-ci folds to
  # lowercase, so the two orders disagree whenever one of [ \ ] ^ _ ` (which
  # sit between Z and a in byte order) is compared with a letter: 'aax' then
  # 'a_x' fires here but passes sort -cf, and the reverse order passes here but
  # fails sort -cf. Same verdict at the pin; not the same assertion.
  - id: zulip-mailmap-sorted
    kind: ordered_block
    paths: [".mailmap"]
    select: '^[^#]'
    comparator: lexical-ci
    level: error
    message: ".mailmap entries must stay sorted, case-folded (tools/lint mailmap)."

  # zulip-22 (A) tools/check-thirdparty: DEP-5 header must be the known format.
  - id: zulip-thirdparty-dep5-format
    kind: file_header
    paths: ["docs/THIRDPARTY"]
    lines: 1
    pattern: '^Format: https?://www\.debian\.org/doc/packaging-manuals/copyright-format/1\.0/?\n'
    level: error
    message: "docs/THIRDPARTY must start with the DEP-5 1.0 Format header (tools/check-thirdparty)."

  # zulip-23 (C) tools/check-thirdparty: every `Files:` glob must match a tracked
  # file. Awkward: a Files: field holds space-separated globs, so each token
  # position needs its own regex (three at the pin); DEP-5 `*` crosses `/`
  # while alint's does not; and the script injects a fake path for the
  # generated static/generated/emoji tree, which must be excluded here.
  - id: zulip-thirdparty-files-token1
    kind: registry_paths_resolve
    source: "docs/THIRDPARTY"
    base: lint_root
    # Token 1, skipping the one entry under the generated static/generated/
    # tree (check-thirdparty appends a fake path so that glob resolves). RE2 has
    # no lookahead, hence the spelled-out "not static/generated/" prefix.
    extract: { regex: '(?m)^Files:[ \t]+((?:[^s\s]|s(?:[^t\s]|t(?:[^a\s]|a(?:[^t\s]|t(?:[^i\s]|i(?:[^c\s]|c(?:[^/\s]|/(?:[^g\s]|g[^e\s]))))))))[^\s]*)' }
    entries_are_globs: true
    level: error
  - id: zulip-thirdparty-files-token2
    kind: registry_paths_resolve
    source: "docs/THIRDPARTY"
    base: lint_root
    extract: { regex: '(?m)^Files:[ \t]+[^\s]+[ \t]+([^\s]+)' }
    entries_are_globs: true
    level: error
  - id: zulip-thirdparty-files-token3
    kind: registry_paths_resolve
    source: "docs/THIRDPARTY"
    base: lint_root
    extract: { regex: '(?m)^Files:[ \t]+[^\s]+[ \t]+[^\s]+[ \t]+([^\s]+)' }
    entries_are_globs: true
    level: error

  # zulip-24 (A) tools/check-thirdparty: a one-line `License: X` (no inline
  # text) must name a standalone License paragraph that carries the text.
  - id: zulip-thirdparty-licenses-defined
    kind: cross_file
    relation: subset
    source:
      file: "docs/THIRDPARTY"
      extract: { regex: '(?m)^License: ([^\n]+)\n(?:[^ \n]|\n|\z)' }
    targets:
      - file: "docs/THIRDPARTY"
        extract: { regex: '(?:\A|\n\n)License: ([^\n]+)\n ' }
    level: error
    message: "Every short `License:` name in docs/THIRDPARTY needs a standalone License paragraph with its text."

  # zulip-26 (A) .github/workflows/api-docs-update-check.yml ->
  # tools/check-feature-level-updated: no unreplaced `ZF-` feature-level
  # placeholder in api_docs/*.md (non-recursive) or zerver/openapi/zulip.yaml.
  # This holds on main only: the workflow runs on push to main
  # (api-docs-update-check.yml:3-7), and in-flight PR branches legitimately
  # carry ZF-xxxxxx placeholders (docs/documentation/api.md:351-367) until
  # tools/merge-api-changelogs replaces them when the change is merged. Run as
  # a PR gate, this rule would false-positive.
  - id: zulip-api-docs-no-zf-placeholder
    kind: file_content_forbidden
    paths: ["api_docs/*.md", "zerver/openapi/zulip.yaml"]
    pattern: 'ZF-'
    level: error
    message: "Feature level placeholder (ZF-...) not replaced; run tools/merge-api-changelogs."

  # zulip-27 (A) docs/documentation/api.md + .claude/rules/api-changelog.md:
  # unmerged changelog fragments must not carry a **Feature level** heading
  # (the merge tooling emits it). Vacuous at the pin (no fragments).
  - id: zulip-unmerged-changelog-no-feature-level-heading
    kind: file_content_forbidden
    paths: ["api_docs/unmerged.d/*.md"]
    pattern: '\*\*Feature level'
    level: error
    message: "Don't add a **Feature level** heading to api_docs/unmerged.d fragments; merge-api-changelogs adds it."

  # zulip-b06 (A) tools/release:96-100 (maintainer release gate, major
  # releases): `grep -q -F -x "**Feature level $feature_level**"
  # api_docs/changelog.md`, with $feature_level = version.py's
  # API_FEATURE_LEVEL. Membership, not equality with the newest heading: the
  # level must appear as an exact "**Feature level N**" line somewhere in the
  # changelog. (The same line's other check, that the release commit changed
  # API_FEATURE_LEVEL, is git history and out of scope.)
  - id: zulip-feature-level-documented
    kind: cross_file
    relation: subset
    source:
      file: "version.py"
      extract: { regex: '(?m)^API_FEATURE_LEVEL = (\d+)$' }
    targets:
      - file: "api_docs/changelog.md"
        extract: { regex: '(?m)^\*\*Feature level (\d+)\*\*$' }
    level: error
    message: "API_FEATURE_LEVEL in version.py must be documented as an exact `**Feature level N**` line in api_docs/changelog.md (tools/release)."

  # zulip-28 (B-config unique-key) tools/check-openapi.ts (tools/lint
  # `openapi`, every *.yaml): the YAML must parse without errors. Probe query
  # never matches; failure mode = parse error. Partial: check-openapi.ts uses
  # the `yaml` Composer, whose doc.errors include duplicate mapping keys
  # (uniqueKeys defaults to true), but alint's YAML parse keeps the last
  # duplicate silently, so this probe does not detect duplicate keys. Only the
  # syntax-error half is expressed here.
  - id: zulip-yaml-parses
    kind: yaml_path_absent
    paths:
      include: ["**/*.yaml"]
      # check-openapi.ts returns early for multi-document YAML (docs.length !== 1);
      # pnpm-lock.yaml is multi-document, so it is outside the tool's check.
      exclude: ["web/third/**", "pnpm-lock.yaml"]
    path: "$['__alint_parse_probe__']"
    level: error
    message: "YAML must parse (tools/check-openapi.ts)."

  # zulip-29 (A) check-openapi.ts: "Siblings of $ref have no effect".
  - id: zulip-openapi-ref-no-siblings
    kind: yaml_path_absent
    paths: ["zerver/openapi/zulip.yaml", "zerver/openapi/testing.yaml"]
    path: "$..[?@['$ref'] && length(@) > 1]"
    level: error
    message: "Siblings of $ref have no effect (tools/check-openapi.ts)."

  # zulip-30 (A) check-openapi.ts: "nullable has no effect as a sibling of
  # allOf/anyOf/oneOf".
  - id: zulip-openapi-nullable-not-beside-combinator
    kind: yaml_path_absent
    paths: ["zerver/openapi/zulip.yaml", "zerver/openapi/testing.yaml"]
    path: "$..[?@.nullable && (@.allOf || @.anyOf || @.oneOf)]"
    level: error
    message: "nullable has no effect as a sibling of allOf/anyOf/oneOf (tools/check-openapi.ts)."

  # zulip-31 (A) check-openapi.ts: "Too many inline allOf subschemas" (at most
  # one allOf member may be an inline schema rather than a $ref).
  - id: zulip-openapi-allof-one-inline
    kind: yaml_path_absent
    paths: ["zerver/openapi/zulip.yaml", "zerver/openapi/testing.yaml"]
    path: "$..[?count(@.allOf[?!@['$ref']]) > 1]"
    level: error
    message: "Too many inline allOf subschemas (tools/check-openapi.ts)."

  # zulip-35 (A) tools/check-schemas verify_fixtures_are_sorted: the keys of
  # `exports.fixtures` in web/tests/lib/events.cjs must be in sorted order.
  - id: zulip-events-fixtures-sorted
    kind: ordered_block
    paths: ["web/tests/lib/events.cjs"]
    start: "exports.fixtures = {"
    end: "};"
    select: '^    [A-Za-z0-9_]+: \{$'
    comparator: lexical
    level: error
    message: "Keep the fixtures in web/tests/lib/events.cjs in sorted order (tools/check-schemas)."

  # zulip-38 (A) tools/test-js-with-node make_set(): EXEMPT_FILES must be sorted.
  - id: zulip-node-exempt-files-sorted
    kind: ordered_block
    paths: ["tools/test-js-with-node"]
    start: "EXEMPT_FILES = make_set("
    end: ")"
    select: '^        "'
    comparator: lexical
    level: error
    message: "Keep EXEMPT_FILES in tools/test-js-with-node sorted."

  # zulip-39 (A) tools/test-js-with-node enforce_proper_coverage():504-512
  # asserts EXEMPT_FILES - all_js_files is empty, where all_js_files is the
  # non-recursive globs web/src/*.js, web/src/*.ts, web/src/billing/*.js,
  # web/tests/*.cjs and web/tests/lib/*.cjs. So an entry must both exist and
  # match one of those globs. The extract regex narrows the scope: an entry of
  # one of those shapes (no `/` after the glob's directory, no leading `.`,
  # since Python's glob skips hidden names) is captured bare and must exist;
  # any other entry falls through to the second alternative, which captures
  # it WITH its closing quote, so it can never resolve and is reported (e.g.
  # `web/src/a/b.ts"` for a nested file that exists but is outside the globs).
  # Entry lines are the 8-space-indented quoted strings; at the pin all 285
  # sit inside the EXEMPT_FILES block (lines 47-334). No custom `message:`, so
  # the finding names the entry (`entry "web/src/a/b.ts\"" does not resolve`):
  # a trailing quote in the reported entry means "outside the globs".
  - id: zulip-node-exempt-files-exist
    kind: registry_paths_resolve
    source: "tools/test-js-with-node"
    base: lint_root
    extract: { regex: '(?m)^        "((?:web/src/[^/".*][^/"*]*\.(?:js|ts)|web/src/billing/[^/".*][^/"*]*\.js|web/tests/[^/".*][^/"*]*\.cjs|web/tests/lib/[^/".*][^/"*]*\.cjs)|[^"\n]*")"?,' }
    expect: file
    level: error

  # zulip-b05 (A) tools/build-release-tarball:47-49 runs
  # `rm -r --interactive=never "$OUTPUT_DIR/$prefix/$i"` for every line of
  # tools/release-tarball-exclude.txt under `set -eu`, so an entry that names
  # no path fails the build (tools/ci/production-build, production-suite.yml).
  # `read -r` strips surrounding whitespace and has no comment syntax, hence
  # `comment: ""` (every non-blank line is an entry). Not modelled: an entry
  # nested under an entry removed earlier would also fail; none at the pin.
  - id: zulip-release-tarball-exclude-paths-exist
    kind: registry_paths_resolve
    source: "tools/release-tarball-exclude.txt"
    base: lint_root
    extract: { lines: { comment: "" } }
    level: error
    message: "Every tools/release-tarball-exclude.txt entry must name an existing path (tools/build-release-tarball removes each with rm -r under set -e)."

  # zulip-43 (A) tools/test-migrations: no migration with a meaningless
  # NNNN_auto_ name, except the 2016/2017 ones and the allowlisted names.
  - id: zulip-migrations-no-auto-names
    kind: file_absent
    paths:
      include: ["**/migrations/[0-9][0-9][0-9][0-9]_auto_*.py"]
      exclude:
        - "**/migrations/[0-9][0-9][0-9][0-9]_auto_2016*"
        - "**/migrations/[0-9][0-9][0-9][0-9]_auto_2017*"
        - "**/migrations/0052_auto_fix_realmalias_realm_nullable.py"
        - "**/migrations/0003_auto_20150817_1733.py"
        - "**/migrations/0002_auto_20150110_0810.py"
        - "**/migrations/0002_auto_20190420_0723.py"
        - "**/migrations/0009_auto_20191118_0520.py"
        - "**/migrations/0007_auto_20201201_1019.py"
    level: error
    message: "New migrations need readable names, not NNNN_auto_* (tools/test-migrations)."

  # zulip-46b (A) the same test_paths_in_rules: an `include_only` entry with no
  # file extension must end with "/" (it is a substring match, so "zerver"
  # would also select "zerverx/"). Matches an extensionless last element of
  # an include_only set literal (entries may span lines).
  - id: zulip-custom-check-include-only-trailing-slash
    kind: file_content_forbidden
    paths: ["tools/linter_lib/custom_check.py"]
    pattern: '"include_only": \{(?:\s*"[^"]*",)*\s*"(?:[^"]*/)?[^"./]+"'
    level: error
    message: "custom_check.py include_only directory entries must end with '/' (tools/tests/test_zulint_custom_rules.py)."

  # zulip-46 (C) tools/test-tools -> tools/tests/test_zulint_custom_rules.py
  # test_paths_in_rules: every path named in a custom_check.py exclude /
  # exclude_line must exist. Awkward: the paths live in Python set/tuple
  # literals, so this regex harvests every quoted repo-rooted path string
  # (a superset that also catches include_only entries, which exist too).
  - id: zulip-custom-check-paths-exist
    kind: registry_paths_resolve
    source: "tools/linter_lib/custom_check.py"
    base: lint_root
    extract: { regex: '"((?:analytics|api_docs|confirmation|corporate|docs|puppet|scripts|starlight_help|templates|tools|web|zerver|zilencer|zproject)/[^"]*)"' }
    level: error
    message: "custom_check.py names a path that no longer exists (tools/tests/test_zulint_custom_rules.py)."

  # zulip-47 (A) "Keep this price in sync" (templates/corporate/pricing_model.html
  # <-> templates/corporate/slack-alternative.html): Cloud Standard annual price.
  - id: zulip-cloud-standard-price-sync
    kind: cross_file
    source:
      file: "templates/corporate/pricing_model.html"
      extract: { regex: '(?s)Keep this price in sync.*?<div class="price"><span class="currency-symbol">\$</span>([0-9.]+)</div>' }
    targets:
      - file: "templates/corporate/slack-alternative.html"
        extract: { regex: '(?s)Keep this price in sync.*?\$([0-9.]+)/user/month \(billed annually\)' }
    level: error
    message: "The Zulip Cloud Standard price must match between pricing_model.html and slack-alternative.html."

  # zulip-48 (A) "Sync with max-height set in zulip.css" (web/src/dropdown_widget.ts)
  # <-> "Sync with `max-height` in dropdown_widget." (web/styles/zulip.css).
  - id: zulip-dropdown-height-sync
    kind: cross_file
    source:
      file: "web/src/dropdown_widget.ts"
      extract: { regex: '(?m)^export const DEFAULT_DROPDOWN_HEIGHT = ([0-9]+);' }
    targets:
      - file: "web/styles/zulip.css"
        extract: { regex: '(?s)Sync with `max-height` in dropdown_widget\. \*/\s*max-height: ([0-9]+)px;' }
    level: error
    message: "DEFAULT_DROPDOWN_HEIGHT must equal the .dropdown-list-wrapper max-height in zulip.css."

  # zulip-b03 (A) "This should match MAX_IDX in our client widgets."
  # (zerver/lib/validator.py:482-483) <-> `const MAX_IDX = 1000;` in
  # web/src/poll_data.ts:78 and web/src/todo_data.ts:9.
  - id: zulip-max-idx-sync
    kind: cross_file
    source:
      file: "zerver/lib/validator.py"
      extract: { regex: '(?m)^MAX_IDX = (\d+)$' }
    targets:
      - file: "web/src/poll_data.ts"
        extract: { regex: '(?m)^const MAX_IDX = (\d+);$' }
      - file: "web/src/todo_data.ts"
        extract: { regex: '(?m)^const MAX_IDX = (\d+);$' }
    level: error
    message: "MAX_IDX must be equal in zerver/lib/validator.py, web/src/poll_data.ts and web/src/todo_data.ts."

  # zulip-b04 (A) "The resizing dimensions should be kept in sync with the
  # client-side resizing code" (zerver/lib/thumbnail.py:213-214, :234-235) <->
  # "kept in sync with the server-side resizing code in zerver/lib/thumbnail.py"
  # (web/src/upload_widget.ts:209-226). One unit, four literal pairs: the
  # user_avatar crop box is MEDIUM_AVATAR_SIZE square, the realm_icon box is
  # DEFAULT_AVATAR_SIZE square (resize_realm_icon uses resize_avatar's
  # default), and the logo box (the else branch) is MAX_REALM_LOGO_WIDTH x
  # MAX_REALM_LOGO_HEIGHT (thumbnail.py:20-21, :28-29). Each target regex stays
  # inside one `resizing_dimension_opts = { ... }` literal ([^}]), so key order
  # does not matter.
  - id: zulip-avatar-resize-sync
    kind: cross_file
    source:
      file: "zerver/lib/thumbnail.py"
      extract: { regex: '(?m)^MEDIUM_AVATAR_SIZE = (\d+)$' }
    targets:
      - file: "web/src/upload_widget.ts"
        extract: { regex: '(?s)property_name === "user_avatar"\) \{\s*resizing_dimension_opts = \{[^}]*?maxHeight: (\d+)' }
      - file: "web/src/upload_widget.ts"
        extract: { regex: '(?s)property_name === "user_avatar"\) \{\s*resizing_dimension_opts = \{[^}]*?maxWidth: (\d+)' }
    level: error
    message: "The user_avatar resize box in web/src/upload_widget.ts must equal MEDIUM_AVATAR_SIZE in zerver/lib/thumbnail.py."
  - id: zulip-realm-icon-resize-sync
    kind: cross_file
    source:
      file: "zerver/lib/thumbnail.py"
      extract: { regex: '(?m)^DEFAULT_AVATAR_SIZE = (\d+)$' }
    targets:
      - file: "web/src/upload_widget.ts"
        extract: { regex: '(?s)property_name === "realm_icon"\) \{\s*resizing_dimension_opts = \{[^}]*?maxHeight: (\d+)' }
      - file: "web/src/upload_widget.ts"
        extract: { regex: '(?s)property_name === "realm_icon"\) \{\s*resizing_dimension_opts = \{[^}]*?maxWidth: (\d+)' }
    level: error
    message: "The realm_icon resize box in web/src/upload_widget.ts must equal DEFAULT_AVATAR_SIZE in zerver/lib/thumbnail.py."
  - id: zulip-logo-resize-width-sync
    kind: cross_file
    source:
      file: "zerver/lib/thumbnail.py"
      extract: { regex: '(?m)^MAX_REALM_LOGO_WIDTH = (\d+)$' }
    targets:
      - file: "web/src/upload_widget.ts"
        extract: { regex: '(?s)\} else \{\s*resizing_dimension_opts = \{[^}]*?maxWidth: (\d+)' }
    level: error
    message: "The logo resize maxWidth in web/src/upload_widget.ts must equal MAX_REALM_LOGO_WIDTH in zerver/lib/thumbnail.py."
  - id: zulip-logo-resize-height-sync
    kind: cross_file
    source:
      file: "zerver/lib/thumbnail.py"
      extract: { regex: '(?m)^MAX_REALM_LOGO_HEIGHT = (\d+)$' }
    targets:
      - file: "web/src/upload_widget.ts"
        extract: { regex: '(?s)\} else \{\s*resizing_dimension_opts = \{[^}]*?maxHeight: (\d+)' }
    level: error
    message: "The logo resize maxHeight in web/src/upload_widget.ts must equal MAX_REALM_LOGO_HEIGHT in zerver/lib/thumbnail.py."

  # ══════════════════════════════════════════════════════════════════════
  # OTHER family: tools/lint custom_py / custom_nonpy
  # (tools/linter_lib/custom_check.py, run in CI by `./tools/lint --groups=...`)
  # One unit per distinct assertion; quote-style variants and the same
  # assertion repeated per language are one unit (R1). Rule ids carry the
  # unit id in the comment above them.
  # ══════════════════════════════════════════════════════════════════════

  # ── shebang_rules (py + bash) ──────────────────────────────────────────
  # zulip-cc-01 (A) "zerver library code shouldn't have a shebang line."
  - id: zulip-cc-zerver-no-shebang
    kind: file_content_forbidden
    paths:
      include: ["**/zerver/**/*.py", "**/zerver/**/*.bash"]
    pattern: '\A#!'
    level: error

  # zulip-cc-02 (A) "Use `#!/usr/bin/env foo` instead of `#!/path/foo` for
  # interpreters other than sh." (negative lookahead -> select + require)
  - id: zulip-cc-shebang-env
    kind: file_content_matches
    paths:
      include: &py
        - "**/*.py"
        - ".claude/skills/fetch-zulip-messages/fetch-zulip-web-public-messages"
        - ".claude/skills/fix-backend-coverage/analyze-coverage"
        - "puppet/kandra/files/memcached_exporter"
        - "puppet/kandra/files/mirror_to_czo"
        - "puppet/kandra/files/statuspage-pusher"
        - "puppet/kandra/files/weblate_exporter"
        - "puppet/zulip/files/nagios_plugins/zulip_app_frontend/check_cron_file"
        - "puppet/zulip/files/nagios_plugins/zulip_app_frontend/check_queue_worker_errors"
        - "puppet/zulip/files/nagios_plugins/zulip_app_frontend/check_send_receive_time"
        - "puppet/zulip/files/nagios_plugins/zulip_postgresql/check_postgresql_replication_lag"
        - "puppet/zulip/files/postgresql/pg_backup_and_purge"
        - "puppet/zulip/files/postgresql/process_fts_updates"
        - "puppet/zulip/files/postgresql/wal-g-exporter"
        - "scripts/get-django-setting"
        - "scripts/lib/check-database-compatibility"
        - "scripts/lib/create-production-venv"
        - "scripts/lib/unpack-zulip"
        - "scripts/lib/upgrade-zulip"
        - "scripts/lib/upgrade-zulip-from-git"
        - "scripts/lib/upgrade-zulip-stage-3"
        - "scripts/log-search"
        - "scripts/nagios/check-rabbitmq-consumers"
        - "scripts/nagios/check-rabbitmq-queue"
        - "scripts/purge-old-deployments"
        - "scripts/reload-clients"
        - "scripts/restart-server"
        - "scripts/setup/compare-settings-to-template"
        - "scripts/setup/flush-memcached"
        - "scripts/setup/reindex-textual-data"
        - "scripts/setup/restore-backup"
        - "scripts/stop-server"
        - "scripts/zulip-puppet-apply"
        - "tools/backport-all-prs"
        - "tools/build-demo-organization-wordlist"
        - "tools/build-docs"
        - "tools/build-help-center"
        - "tools/check-capitalization"
        - "tools/check-feature-level-updated"
        - "tools/check-frontend-i18n"
        - "tools/check-issue-labels"
        - "tools/check-provision"
        - "tools/check-schemas"
        - "tools/check-templates"
        - "tools/check-thirdparty"
        - "tools/ci/generate-failure-message"
        - "tools/closed-by-commits"
        - "tools/create-api-changelog"
        - "tools/diagnose"
        - "tools/fetch-contributor-data"
        - "tools/github-changes-contain-file"
        - "tools/i18n/update-for-legacy-translations"
        - "tools/lint"
        - "tools/merge-api-changelogs"
        - "tools/notify-if-api-docs-changed"
        - "tools/renumber-migrations"
        - "tools/review"
        - "tools/run-dev"
        - "tools/run-mypy"
        - "tools/screenshots/generate-integration-docs-screenshot"
        - "tools/screenshots/generate-user-messages-screenshot"
        - "tools/setup/build_pygments_data"
        - "tools/setup/build_timezone_values"
        - "tools/setup/emoji/build_emoji"
        - "tools/setup/emoji/generate_emoji_names"
        - "tools/setup/emoji/generate_emoji_names_table"
        - "tools/show-profile-results"
        - "tools/stop-run-dev"
        - "tools/tail-ses"
        - "tools/test-api"
        - "tools/test-backend"
        - "tools/test-documentation"
        - "tools/test-help-documentation"
        - "tools/test-js-with-node"
        - "tools/test-js-with-puppeteer"
        - "tools/test-queue-worker-reload"
        - "tools/test-run-dev"
        - "tools/test-tools"
        - "tools/total-contributions"
        - "tools/update-prod-static"
        - "tools/update-zuliprc-api-field"
        - "tools/upload-release"
        - "tools/webpack"
        - "tools/zulip-export/zulip-export"
      exclude: ["web/third/**", "**/*custom_check.py*"]
    # `\A#!(?! *(?:/usr/bin/env|/bin/sh)(?: |$))` as a positive start-of-file
    # alternation: no shebang, or an env / sh shebang.
    pattern: '\A(?:[^#]|#(?:[^!]|\z)|#! *(?:/usr/bin/env|/bin/sh)(?: |\n|\z)|\z)'
    level: error
  - id: zulip-cc-shebang-env-bash
    kind: file_content_matches
    paths: ["**/*.bash"]
    # `\A#!(?! *(?:/usr/bin/env|/bin/sh)(?: |$))` as a positive start-of-file
    # alternation: no shebang, or an env / sh shebang.
    pattern: '\A(?:[^#]|#(?:[^!]|\z)|#! *(?:/usr/bin/env|/bin/sh)(?: |\n|\z)|\z)'
    level: error

  # zulip-cc-03 (A) "Use `#!/usr/bin/env python3` instead of `#!/usr/bin/env python`."
  - id: zulip-cc-shebang-python3
    kind: file_content_forbidden
    paths:
      include: *py
      exclude: ["web/third/**", "**/*custom_check.py*"]
    pattern: '(?m)\A#!/usr/bin/env python$'
    level: error
  - id: zulip-cc-shebang-python3-bash
    kind: file_content_forbidden
    paths: ["**/*.bash"]
    pattern: '(?m)\A#!/usr/bin/env python$'
    level: error

  # zulip-cc-04 (A) bash_rules: "Fix shebang line with proper call to
  # /usr/bin/env for Bash path, change -x|-e switches to set -x|set -e"
  - id: zulip-cc-bash-shebang-flags
    kind: file_content_forbidden
    paths: ["**/*.bash"]
    pattern: '#!.*sh [-xe]'
    level: error

  # ── whitespace_rules / base_whitespace_rules ───────────────────────────
  # zulip-cc-05 (A) "Fix trailing whitespace" (all linted langs except md/mdx/svg;
  # md has its own variant below that allows a two-space Markdown line break).
  - id: zulip-cc-trailing-whitespace
    kind: no_trailing_whitespace
    paths:
      include: ["**/*.{hbs,html,css,cjs,js,ts,json,bash,txt,text,yaml,yml,pp}"]
      exclude: ["web/third/**", "**/*custom_check.py*", "zerver/webhooks/json/fixtures/json_github_push__1_commit.json", "zerver/webhooks/json/fixtures/json_pingdom_http_up_to_down.json", "zerver/webhooks/json/fixtures/json_sentry_event_for_exception_js.json", "tools/ci/success-http-headers.template.txt"]
    level: error
  - id: zulip-cc-trailing-whitespace-py
    kind: no_trailing_whitespace
    paths:
      include: *py
      exclude: ["web/third/**", "**/*custom_check.py*"]
    level: error
  - id: zulip-cc-trailing-whitespace-md
    kind: file_content_forbidden
    paths:
      include: ["**/*.md"]
      exclude: ["web/third/**", "**/*custom_check.py*", "docs/code-of-conduct.md", "docs/overview/readme.md", "docs/contributing/contributing.md", "docs/contributing/reporting-security-vulnerabilities.md", "templates/corporate/policies/index.md"]
    pattern: '(?m)(?:[^\t \n][\t ]$|[\t ]{3,}$|^[\t ]+$)'
    level: error

  # zulip-cc-06 (A) "Missing newline at end of file" (`[^\n]\Z`).
  - id: zulip-cc-final-newline
    kind: final_newline
    paths:
      include: ["**/*.{hbs,html,css,cjs,js,ts,json,md,bash,txt,text,yaml,yml,pp}"]
      exclude: ["web/third/**", "**/*custom_check.py*", "docs/code-of-conduct.md", "docs/overview/readme.md", "docs/contributing/contributing.md", "docs/contributing/reporting-security-vulnerabilities.md", "templates/corporate/policies/index.md", "zerver/webhooks/json/fixtures/json_github_push__1_commit.json", "zerver/webhooks/json/fixtures/json_pingdom_http_up_to_down.json", "zerver/webhooks/json/fixtures/json_sentry_event_for_exception_js.json"]
    level: error
  - id: zulip-cc-final-newline-py
    kind: final_newline
    paths:
      include: *py
      exclude: ["web/third/**", "**/*custom_check.py*"]
    level: error

  # zulip-cc-07 (A) "Use HTTPS when linking to ReadTheDocs" (whitespace_rules langs).
  - id: zulip-cc-rtd-https
    kind: file_content_forbidden
    paths:
      include: ["**/*.{hbs,html,css,cjs,js,ts,md,txt,text,yaml,yml,pp}"]
      exclude: ["web/third/**", "**/*custom_check.py*", "docs/code-of-conduct.md", "docs/overview/readme.md", "docs/contributing/contributing.md", "docs/contributing/reporting-security-vulnerabilities.md", "templates/corporate/policies/index.md"]
    pattern: 'http://zulip.readthedocs.io'
    level: error
  - id: zulip-cc-rtd-https-py
    kind: file_content_forbidden
    paths:
      include: *py
      exclude: ["web/third/**", "**/*custom_check.py*"]
    pattern: 'http://zulip.readthedocs.io'
    level: error

  # zulip-cc-08 (A) "Fix tab-based whitespace" (whitespace_rules langs, plus JSON
  # outside zerver/webhooks/ via json_rules' modified copy).
  - id: zulip-cc-no-tabs
    kind: file_content_forbidden
    paths:
      include: ["**/*.{hbs,html,css,cjs,js,ts,md,txt,text,yaml,yml,pp,json}"]
      exclude: ["web/third/**", "**/*custom_check.py*", "docs/code-of-conduct.md", "docs/overview/readme.md", "docs/contributing/contributing.md", "docs/contributing/reporting-security-vulnerabilities.md", "templates/corporate/policies/index.md", "zerver/webhooks/json/fixtures/json_github_push__1_commit.json", "zerver/webhooks/json/fixtures/json_pingdom_http_up_to_down.json", "zerver/webhooks/json/fixtures/json_sentry_event_for_exception_js.json", "zerver/webhooks/**/*.json"]
    pattern: '\t'
    level: error
  - id: zulip-cc-no-tabs-py
    kind: file_content_forbidden
    paths:
      include: *py
      exclude: ["web/third/**", "**/*custom_check.py*"]
    pattern: '\t'
    level: error

  # zulip-cc-09 (A) "Web app should be two words"
  - id: zulip-cc-web-app-two-words
    kind: file_content_forbidden
    paths:
      include: ["**/*.{hbs,html,css,cjs,js,ts,md,txt,text,yaml,yml,pp}"]
      exclude: ["web/third/**", "**/*custom_check.py*", "docs/code-of-conduct.md", "docs/overview/readme.md", "docs/contributing/contributing.md", "docs/contributing/reporting-security-vulnerabilities.md", "templates/corporate/policies/index.md"]
    pattern: '(?i:webapp)'
    level: error
  - id: zulip-cc-web-app-two-words-py
    kind: file_content_forbidden
    paths:
      include: *py
      exclude: ["web/third/**", "**/*custom_check.py*"]
    pattern: '(?i:webapp)'
    level: error

  # zulip-cc-10 (A) comma_whitespace_rule (html, hbs, md):
  # "Remove multiple whitespaces after ','"
  - id: zulip-cc-comma-whitespace
    kind: file_content_forbidden
    paths:
      include: ["**/*.{html,hbs,md}"]
      exclude: ["web/third/**", "**/*custom_check.py*", "docs/code-of-conduct.md", "docs/overview/readme.md", "docs/contributing/contributing.md", "docs/contributing/reporting-security-vulnerabilities.md", "templates/corporate/policies/index.md", "zerver/tests/**", "web/tests/**", "corporate/tests/**"]
    pattern: ', {2,}[^#/ ]'
    level: error

  # ── js_rules (cjs, js, ts) ──────────────────────────────────────────────
  # zulip-cc-11 (A) avoid "subject" (use topic): js, py, and templates.
  - id: zulip-cc-no-subject-js
    kind: for_each_match
    paths:
      include: ["**/*.{cjs,js,ts}"]
      exclude:
        - "web/third/**"
        - "**/*custom_check.py*"
        - "web/src/message_store.ts"
        - "web/src/server_event_types.ts"
        - "web/src/util.ts"
        - "web/src/message_events_util.ts"
        - "web/src/message_helper.ts"
        - "web/src/server_message.ts"
        - "web/src/state_data.ts"
        - "web/tests/**"
    select: 'subject|SUBJECT'
    require:
      matches: ['emails']
    level: error
  - id: zulip-cc-no-subject-py
    kind: for_each_match
    paths:
      include: ["**/zerver/data_import/**/*.py", "**/zerver/lib/**/*.py", "**/zerver/tests/**/*.py", "**/zerver/views/**/*.py"]
      exclude:
        # FILES_WITH_LEGACY_SUBJECT
        - "zerver/lib/topic.py"
        - "zerver/lib/event_types.py"
        - "zerver/tests/test_legacy_subject.py"
        - "zerver/lib/fix_unreads.py"
        - "zerver/tests/test_migrations.py"
        - "zerver/lib/email_mirror.py"
        - "zerver/lib/email_notifications.py"
        - "zerver/lib/send_email.py"
        - "zerver/lib/typed_endpoint.py"
        - "zerver/tests/test_new_users.py"
        - "zerver/tests/test_email_mirror.py"
        - "zerver/tests/test_message_notification_emails.py"
        - "zerver/tests/test_email_notifications.py"
        - "zerver/tests/test_auth_backends.py"
        - "zerver/openapi/python_examples.py"
        - "zerver/tests/test_openapi.py"
        - "zerver/tests/test_message_fetch.py"
        - "zerver/tests/test_message_topics.py"
        - "zerver/lib/email_mirror_server.py"
        # exclude_line files (handled by the -exempt companion)
        - "zerver/lib/message.py"
        - "zerver/lib/streams.py"
        - "zerver/views/streams.py"
        - "zerver/lib/message_cache.py"
        - "zerver/lib/push_notifications.py"
    select: 'subject|SUBJECT'
    require:
      matches: ['subject to the|email|outbox|account deactivation|is subject to']
    level: error
  - id: zulip-cc-no-subject-py-exempt
    kind: for_each_match
    paths: ["zerver/lib/message.py", "zerver/lib/streams.py", "zerver/views/streams.py", "zerver/lib/message_cache.py", "zerver/lib/push_notifications.py"]
    select: 'subject|SUBJECT'
    require:
      matches: ['subject to the|email|outbox|account deactivation|is subject to|^\s*message__subject__iexact=message\.topic_name\(\),\s*$|^\s*\.exclude\(subject=""\)\s*$|^\s*message__subject__iexact=topic_name,\s*$|^\s*and obj\["subject"\] == ""\s*$|^\s*obj\["subject"\] = Message\.EMPTY_TOPIC_FALLBACK_NAME\s*$|^\s*"subject",\s*$']
    level: error
  - id: zulip-cc-no-subject-templates
    kind: for_each_match
    paths:
      include: ["**/*.{html,hbs}"]
      exclude:
        - "web/third/**"
        - "**/*custom_check.py*"
        - "templates/zerver/email.html"
        - "zerver/tests/fixtures/email*"
        - "zerver/tests/fixtures/email*/**"
        - "templates/corporate/jobs.html"
        - "templates/corporate/zulip-cloud.html"
        - "templates/corporate/for/business.html"
        - "templates/corporate/slack-alternative.html"
        - "templates/corporate/support/support_request.html"
        - "templates/corporate/support/support_request_thanks.html"
        - "templates/zerver/emails/support_request.html"
    select: 'subject|SUBJECT'
    require:
