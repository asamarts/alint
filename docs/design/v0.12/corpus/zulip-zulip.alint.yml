    pattern: 'su zulip -c [^'']'
    level: error

  # zulip-cc-78 (A) "Use absolute links from docs served by GitHub" (README.md, CONTRIBUTING.md)
  - id: zulip-cc-github-docs-absolute-links
    kind: for_each_match
