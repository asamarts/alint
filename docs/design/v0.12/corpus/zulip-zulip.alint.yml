  # zulip-cc-67 (A) "Period should be part of the translatable string." (hbs and Jinja forms)
  - id: zulip-cc-period-inside-translation-hbs
    kind: file_content_forbidden
    paths:
      include: ["**/*.hbs"]
      exclude: ["web/third/**", "**/*custom_check.py*"]
    pattern: '\{\{t ''.*'' \}\}[.?!]|\{\{t ".*" \}\}[.?!]|\{\{/tr\}\}[.?!]'
