  # ══════════════════════════════════════════════════════════════════════════
  # other: Nx project graph
  # A [other] (Stage B fluentui-b16, PLAUSIBLE) Every implicitDependencies
  #   entry that is not a `tag:` or `!` pattern names an existing project
  #   (Nx builds the project graph on every nx command in pr.yml). Project
  #   names come from project.json $.name (all 267 projects have one). Not
  #   verified against the Nx 22 source (node_modules is absent): that Nx
  #   rejects an implicitDependencies name with no project is Stage B's
  #   belief. Three non-empty lists at the pin.
  # ══════════════════════════════════════════════════════════════════════════
  - id: microsoft-fluentui-nx-implicit-dependencies-resolve
    kind: cross_file
    relation: superset
    source:
      files: "**/project.json"
      extract:
        json: "$.name"
    targets:
      files: "**/project.json"
      extract:
        json: "$.implicitDependencies[?(!match(@, '(tag:|!).*'))]"
    allow_missing_target: true
    level: error
    message: "An Nx implicitDependencies entry names a project that does not exist."

  # ══════════════════════════════════════════════════════════════════════════
  # VALUE-ADD (not enforced by the repository; outside the coverage ratio)
  # ══════════════════════════════════════════════════════════════════════════

  # value-add [other] (fluentui-14, demoted by Stage C) The digest of the
  #   unstable API report, Stage A's form. It matches release-cycle.md:26's
  #   literal "cannot be changed in any way", but it is stricter than the rule
  #   src/unstable/index.ts:4-6 states: it also fires on the react-virtualizer
  #   additions that rule allows and on any cosmetic api-extractor change.
  #   Kept at level info as an alert; microsoft-fluentui-react-components-unstable-exports-frozen
  #   carries the unit.
  - id: microsoft-fluentui-va-react-components-unstable-api-report-digest
    kind: file_hash
    paths: "packages/react-components/react-components/etc/react-components.unstable.api.md"
    sha256: "168aed1d40fe3039f49182d2ed860ba93a1e9ce16a478a4320d55ab5bd4b987a"
    level: info
    message: "The @fluentui/react-components/unstable API report changed (release-cycle.md: the unstable API is frozen); check that only react-virtualizer exports were added."

  # value-add [toolchain-pin] Every GitHub Actions setup-node major is one
  #   the root engines.node range names (^22.0.0 || ^24.0.0). Nothing gates
  #   this; the unused composite action .github/actions/run-publish-vr-screenshot
  #   asks for Node 20 and is deliberately left out of the glob.
  - id: microsoft-fluentui-va-ci-node-within-engines
    kind: cross_file
    relation: subset
    source:
      files: ".github/workflows/*.yml"
      extract:
        yaml: "$.jobs.*.steps[*].with['node-version']"
    targets:
      - file: "package.json"
        extract:
          regex: '(?:"node":\s*"|\|\|\s*)\^(\d+)\.\d+\.\d+'
    normalize: semver-major
    level: info
    message: "A workflow's setup-node major is not one of the root engines.node majors."

  # value-add [toolchain-pin] The TypeScript floor both ts-minbar apps compile
  #   against (src/index.ts tsVersion) agrees between the two apps and with
  #   their READMEs ("compatible back to Typescript X.Y").
  - id: microsoft-fluentui-va-ts-minbar-floor-agrees
    kind: cross_file
    relation: equals
    source:
      file: "apps/ts-minbar-test-react-components/src/index.ts"
      extract:
        regex: "const tsVersion = '([0-9]+[.][0-9]+)';"
    targets:
      - file: "apps/ts-minbar-test-react/src/index.ts"
        extract:
          regex: "const tsVersion = '([0-9]+[.][0-9]+)';"
      - file: "apps/ts-minbar-test-react-components/README.md"
        extract:
          regex: 'compatible back to Typescript ([0-9]+[.][0-9]+)'
      - file: "apps/ts-minbar-test-react/README.md"
        extract:
          regex: 'compatible back to Typescript ([0-9]+[.][0-9]+)'
    level: info
    message: "The ts-minbar TypeScript floor disagrees between the two apps or their READMEs."
