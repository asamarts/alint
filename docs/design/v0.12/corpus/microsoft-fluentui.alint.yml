# yaml-language-server: $schema=https://raw.githubusercontent.com/asamarts/alint/main/schemas/v1/config.json
#
# alint v0.23 corpus-stratum config — microsoft/fluentui
# Pinned @ b4f5c3cca4e95ab5d271657cbf440cc8bf7427f6 (stratum: js-monorepo)
#
# Shape: Fluent UI, Microsoft's React (v8, v9), web-components and charting
# monorepo. Yarn 4.18 (node-modules linker, yarnPath checked in) + Nx 22 with a
# repo-local plugin (tools/workspace-plugin). 266 Yarn workspaces (apps/*,
# packages/**, packages/react-components/*/{library,stories}, charts, scripts/*,
# tools/*), 267 Nx projects, beachball-managed releases. Governance:
# single-vendor (Microsoft).
#
# WHERE THE ENFORCED VALIDATION LIVES
#   .github/workflows/pr.yml `main` job, "Workspace lint" step:
#     workspace-plugin:check-graph, `nx sync:check` (export-maps-sync,
#     bundle-size-fixtures-sync), tsconfig-base-all --verify,
#     normalize-package-dependencies --verify, verify-peer-dependencies
#     --tag=vNext; then tsc over just.config.ts, `satisfied` (installed deps),
#     `nx format:check`, `nx affected -t build test lint type-check test-ssr
#     test-integration verify-packaging verify-bundle-isolation attw`, and a
#     clean-tree check. Other pr.yml jobs: react-compiler-analyzer, React 17/18
#     integration (rit), Cypress/Playwright e2e.
#   .github/workflows/check-packages.yml: yarn dedupe --check (when yarn.lock
#     changes), `syncpack list-mismatches` (syncpack.config.js), `beachball
#     check` (beachball.config.js -> scripts/beachball/base.config.js), each
#     with a github-script guard that the tool is a root devDependency.
#   .github/workflows/check-tooling.yml (generator smoke tests), bundle-size
#     (monosize threshold), pr-vrt (visual regression).
#   azure-pipelines*.yml + .devops/templates/tools.yml: 1ES release pipelines
#     (build/test/lint per scope, beachball publish, Node via UseNode 22.x).
#   .husky/pre-commit -> nano-staged (prettier + eslint on staged files).
#   Conventions: AGENTS.md (= CLAUDE.md), docs/workflows/contributing.md,
#     docs/react-v9/contributing/{dev-env,release-cycle}.md,
#     .github/instructions/copilot.instructions.md, .gitattributes,
#     load-bearing comments in .yarnrc.yml and .devops/templates/tools.yml.
#
# This config expresses the toolchain pins (packageManager exact Yarn 4,
# yarnPath present and resolving, yarnPath agreeing with packageManager (C:
# regex read of packageManager), Azure UseNode `<major>.x` + checkLatest, no
# `corepack enable` in the Azure pipelines), the CI guards that
# syncpack/beachball are root devDependencies, the committed Yarn patch file
# (C: regex read of the patch: specifier), the documented tar-fs
# security resolution (C: range as a regex), beachball's change-file type
# validation (C: one superset rule per change type) and comment prefix, the
# verify-peer-dependencies semver-range validity check (C: a regex of
# node-semver's range grammar), the ESLint rule that asserts file text rather
# than code (@fluentui/no-tslint-comments), the documented conventions
# (preview packages stay 0.x, the frozen react-components/unstable exports
# (C: an anchored regex over src/unstable/index.ts), .yarnrc.yml comments
# kept, *.api.md LF), more load-bearing comments (AGENTS.md Nx markers, the
# copilot-setup-steps job name, dependabot's production allow entry), Jest
# assertions over committed files (react-icons-mdl2 file names, the v8
# migration guides, the beachball release scopes (C)) and Nx
# implicitDependencies resolving. Value-add rules (level info, outside the
# ratio) close the file, including the export-maps-sync entry fields (partial
# coverage of a B-adapter unit) and the unstable API report digest.
# Stage C (2026-11-12) integrated the Stage B review: rules marked
# "(Stage B fluentui-bNN)" are units Stage B found; see each rule's comment.
# Not expressed (B/D, see the stratum record): syncpack's one version per
# dependency and normalize-package-dependencies (B-adapter, entry values),
# orphaned peerDependenciesMeta and unique workspace / Nx project names
# (B-config), the tsconfig.base.all.json merge and the export map derivation
# (B-adapter), @fluentui/max-len and @typescript-eslint/ban-ts-comment
# (B-adapter: eslint-disable comments, which alint cannot read, exempt most of
# their matches), beachball's change-file requirement and one change file per
# package per PR (B-adapter, change relation), incompatible-peer-range
# (B-adapter: semver subset plus entry values), unique migration-guide routes
# (B-config) and the ComponentMapping links (B-adapter: slug normalize),
# installs, dedupe, `satisfied`, cypress verify, builds, type checks, TSX
# snippet parsing, lint, prettier, tests, packaging, bundle size, VRT.
# Nothing here spawns a process; no custom facts; no git-history kinds.

version: 1

rules:
  # ══════════════════════════════════════════════════════════════════════════
  # toolchain-pin
  # ══════════════════════════════════════════════════════════════════════════

  # A [toolchain-pin] dev-env.md + copilot.instructions.md: "The repo pins a
  #   specific Yarn 4.x release via the `packageManager` field in package.json
  #   (the exact version source of truth)"; `yarn -v` should report 4.x.
  - id: microsoft-fluentui-package-manager-yarn4-exact
    kind: json_path_matches
    paths: ["package.json"]
    path: "$.packageManager"
    matches: '^yarn@4\.\d+\.\d+(\+sha(1|224|256|512)\.[0-9a-f]+)?$'
    level: error
    message: "package.json packageManager must pin one exact Yarn 4 release (yarn@4.X.Y); it is the version source of truth (docs/react-v9/contributing/dev-env.md)."

  # A [toolchain-pin] .yarnrc.yml yarnPath names the checked-in release. Every
  #   CI job and the Azure tools template (which deliberately skips `corepack
  #   enable`) runs that file, so a dangling yarnPath fails every `yarn` call.
  - id: microsoft-fluentui-yarnpath-resolves
    kind: registry_paths_resolve
    source: ".yarnrc.yml"
    extract:
      yaml: "$.yarnPath"
    expect: file
    level: error
    message: ".yarnrc.yml yarnPath must name a committed Yarn release under .yarn/releases/."

  # A [toolchain-pin] (same unit, fluentui-02) Stage C: registry_paths_resolve
  #   is silent when the yarnPath key is absent (rules.md: path-resolve rules
  #   are silent on an absent field), so this rule requires the key and its
  #   .yarn/releases/*.cjs shape. Together the two rules express the unit.
  - id: microsoft-fluentui-yarnpath-present
    kind: yaml_path_matches
    paths: [".yarnrc.yml"]
    path: "$.yarnPath"
    matches: '^\.yarn/releases/yarn-[^/]+\.cjs$'
    level: error
    message: ".yarnrc.yml must set yarnPath to the checked-in release under .yarn/releases/ (CI and the Azure pipelines run Yarn only through it)."

  # A [toolchain-pin] (Stage B fluentui-b01) .devops/templates/tools.yml:44-45
  #   load-bearing comment: "Do NOT run `corepack enable` - it's not needed
  #   since yarn is checked into the repo, and it causes a network request
  #   attempting to download yarn, which is not allowed." Every
  #   azure-pipelines.release*.yml includes tools.yml@self. Only uncommented
  #   text counts, so the comment itself does not match.
  - id: microsoft-fluentui-azure-no-corepack-enable
    kind: file_content_forbidden
    paths: ["{.devops/**/*.yml,azure-pipelines*.yml}"]
    pattern: '(?m)^[^#\n]*\bcorepack\s+enable\b'
    level: error
    message: "The Azure pipelines must not run `corepack enable`: Yarn is checked in (yarnPath) and the 1ES pipeline forbids the network download corepack makes (.devops/templates/tools.yml)."

  # C [toolchain-pin] dev-env.md: packageManager is the exact version source of
  #   truth and ".yarnrc.yml configures the repository binary path", so the
  #   checked-in release yarnPath runs must be that same version. C (batch-2
  #   ruling): packageManager is read with a regex over package.json, because
  #   no normalize turns "yarn@4.18.0" and ".yarn/releases/yarn-4.18.0.cjs"
  #   into the same full version (semver-minor would drop the patch digit).
  - id: microsoft-fluentui-yarnpath-matches-package-manager
    kind: cross_file
    relation: equals
    source:
      file: "package.json"
      extract:
        regex: '"packageManager":\s*"yarn@(\d+\.\d+\.\d+)'
    targets:
      - file: ".yarnrc.yml"
        extract:
          regex: '(?m)^yarnPath:\s*\.yarn/releases/yarn-(\d+\.\d+\.\d+)\.cjs\s*$'
    level: error
    message: "The Yarn release in .yarnrc.yml yarnPath must be the version package.json packageManager pins."

  # A [toolchain-pin] .devops/templates/tools.yml load-bearing comment: the 1ES
  #   container only ships some Node versions, so UseNode must ask for
  #   `<major>.x`, and `checkLatest: true` is required (fast-build needs
  #   node >=22.18.0 while the container may ship an older 22.x).
  - id: microsoft-fluentui-azure-usenode-major-x
    kind: yaml_path_matches
    paths: [".devops/templates/tools.yml"]
    path: "$.steps[?(@.task == 'UseNode@1')].inputs.version"
    matches: '^\d+\.x$'
    level: error
    message: "Azure UseNode must request `<major>.x` (only container-shipped versions install; see the comment in .devops/templates/tools.yml)."

  - id: microsoft-fluentui-azure-usenode-check-latest
    kind: yaml_path_equals
    paths: [".devops/templates/tools.yml"]
    path: "$.steps[?(@.task == 'UseNode@1')].inputs.checkLatest"
    equals: true
    level: error
    message: "Azure UseNode needs `checkLatest: true` so the newest <major>.x installs (dependencies such as @microsoft/fast-build need node >=22.18.0)."

  # ══════════════════════════════════════════════════════════════════════════
  # dep-version
  # ══════════════════════════════════════════════════════════════════════════

  # A [dep-version] check-packages.yml github-script guards: the
  #   dependency-mismatches and change-files jobs read the tool version from
  #   the root devDependencies and core.setFailed() when it is not a string.
  #   Stage C: the pattern accepts any string (the guard's typeof === 'string'
  #   test); json_path_matches itself fires on a missing key or a non-string.
  - id: microsoft-fluentui-syncpack-is-root-devdependency
    kind: json_path_matches
    paths: ["package.json"]
    path: "$.devDependencies.syncpack"
    matches: '^(?s:.*)$'
    level: error
    message: "package.json must declare syncpack in devDependencies; check-packages.yml runs `npx syncpack@<that version> list-mismatches`."

  - id: microsoft-fluentui-beachball-is-root-devdependency
    kind: json_path_matches
    paths: ["package.json"]
    path: "$.devDependencies.beachball"
    matches: '^(?s:.*)$'
    level: error
    message: "package.json must declare beachball in devDependencies; check-packages.yml runs `npx beachball@<that version> check`."

  # C [dep-version] `yarn install --immutable` (every CI job) fails when a
  #   patch: descriptor names a ~/ patch file that is not committed (root
  #   devDependencies storywright -> .yarn/patches/*.patch). C (batch-2
  #   ruling): the path is pulled out of the specifier with a regex over the
  #   manifest text; a JSONPath extract returns the whole descriptor.
  - id: microsoft-fluentui-yarn-patches-resolve
    kind: registry_paths_resolve
    source: "{package.json,apps/*/package.json,packages/*/package.json,packages/react-components/*/package.json,packages/react-components/*/*/package.json,packages/charts/*/package.json,packages/charts/*/*/package.json,scripts/*/package.json,tools/*/package.json,typings/package.json,starter-templates/package.json}"
    extract:
      regex: '"patch:[^"#]*#~/([^":&]+)'
    base: lint_root
    expect: file
    level: error
    message: "A patch: descriptor names a ~/ patch file that does not exist (yarn install --immutable)."

  # C [dep-version] verify-peer-dependencies --tag=vNext, check
  #   invalid-peer-range (getManifestViolations,
  #   tools/workspace-plugin/src/generators/verify-peer-dependencies/index.ts:510-529):
  #   every peerDependencies range is a valid semver range (semver.validRange).
  #   alint has no semver operator, so this is a regex of node-semver's range
  #   grammar (range-set / hyphen / simple / partial / qualifier). Stage C:
  #   the query mirrors the generator's two skips: a private package (no peer
  #   contract; getSkipReason, index.ts:479-494) and a NON_SEMVER_RANGE
  #   protocol range (workspace:, portal:, link:, file:, npm:, patch:;
  #   index.ts:100, :522). It still covers every workspace manifest, because
  #   the --tag=vNext scope lives in project.json tags, which package.json
  #   cannot see (scope broadening, value-add). Tuning: a semver-range operator.
  - id: microsoft-fluentui-peer-ranges-valid-semver
    kind: json_path_matches
    paths: "{package.json,apps/*/package.json,packages/*/package.json,packages/react-components/*/package.json,packages/react-components/*/*/package.json,packages/charts/*/package.json,packages/charts/*/*/package.json,scripts/*/package.json,tools/*/package.json,typings/package.json,starter-templates/package.json}"
    path: "$.peerDependencies[?($.private != true && !match(@, '(workspace|portal|link|file|npm|patch):.*'))]"
    if_present: true
    matches: '^\s*(?:v?(?:[xX*]|0|[1-9][0-9]*)(?:\.(?:[xX*]|0|[1-9][0-9]*)(?:\.(?:[xX*]|0|[1-9][0-9]*)(?:-[-0-9A-Za-z]+(?:\.[-0-9A-Za-z]+)*)?(?:\+[-0-9A-Za-z]+(?:\.[-0-9A-Za-z]+)*)?)?)?\s+-\s+v?(?:[xX*]|0|[1-9][0-9]*)(?:\.(?:[xX*]|0|[1-9][0-9]*)(?:\.(?:[xX*]|0|[1-9][0-9]*)(?:-[-0-9A-Za-z]+(?:\.[-0-9A-Za-z]+)*)?(?:\+[-0-9A-Za-z]+(?:\.[-0-9A-Za-z]+)*)?)?)?|(?:(?:[<>]=?|=|~>?|\^)\s*)?v?(?:[xX*]|0|[1-9][0-9]*)(?:\.(?:[xX*]|0|[1-9][0-9]*)(?:\.(?:[xX*]|0|[1-9][0-9]*)(?:-[-0-9A-Za-z]+(?:\.[-0-9A-Za-z]+)*)?(?:\+[-0-9A-Za-z]+(?:\.[-0-9A-Za-z]+)*)?)?)?(?:\s+(?:(?:[<>]=?|=|~>?|\^)\s*)?v?(?:[xX*]|0|[1-9][0-9]*)(?:\.(?:[xX*]|0|[1-9][0-9]*)(?:\.(?:[xX*]|0|[1-9][0-9]*)(?:-[-0-9A-Za-z]+(?:\.[-0-9A-Za-z]+)*)?(?:\+[-0-9A-Za-z]+(?:\.[-0-9A-Za-z]+)*)?)?)?)*)?(?:\s*\|\|\s*(?:v?(?:[xX*]|0|[1-9][0-9]*)(?:\.(?:[xX*]|0|[1-9][0-9]*)(?:\.(?:[xX*]|0|[1-9][0-9]*)(?:-[-0-9A-Za-z]+(?:\.[-0-9A-Za-z]+)*)?(?:\+[-0-9A-Za-z]+(?:\.[-0-9A-Za-z]+)*)?)?)?\s+-\s+v?(?:[xX*]|0|[1-9][0-9]*)(?:\.(?:[xX*]|0|[1-9][0-9]*)(?:\.(?:[xX*]|0|[1-9][0-9]*)(?:-[-0-9A-Za-z]+(?:\.[-0-9A-Za-z]+)*)?(?:\+[-0-9A-Za-z]+(?:\.[-0-9A-Za-z]+)*)?)?)?|(?:(?:[<>]=?|=|~>?|\^)\s*)?v?(?:[xX*]|0|[1-9][0-9]*)(?:\.(?:[xX*]|0|[1-9][0-9]*)(?:\.(?:[xX*]|0|[1-9][0-9]*)(?:-[-0-9A-Za-z]+(?:\.[-0-9A-Za-z]+)*)?(?:\+[-0-9A-Za-z]+(?:\.[-0-9A-Za-z]+)*)?)?)?(?:\s+(?:(?:[<>]=?|=|~>?|\^)\s*)?v?(?:[xX*]|0|[1-9][0-9]*)(?:\.(?:[xX*]|0|[1-9][0-9]*)(?:\.(?:[xX*]|0|[1-9][0-9]*)(?:-[-0-9A-Za-z]+(?:\.[-0-9A-Za-z]+)*)?(?:\+[-0-9A-Za-z]+(?:\.[-0-9A-Za-z]+)*)?)?)?)*)?)*\s*$'
    level: error
    message: "A peerDependencies range is not a valid semver range (verify-peer-dependencies invalid-peer-range)."

  # C [dep-version] .github/instructions/dependabot-security-fixes.instructions.md:
  #   "The following resolutions are maintained for security purposes: tar-fs
  #   ^2.1.3". The root resolution (2.1.4 at the pin) must stay inside that
  #   range. alint has no semver operator, so the range is spelled as a regex.
  #   Known C limitation (Stage B reproduced): the regex accepts only exact,
  #   ^ and ~ forms, so an in-range spelling such as '>=2.1.3 <3.0.0' fires.
  - id: microsoft-fluentui-tar-fs-security-resolution
    kind: json_path_matches
    paths: ["package.json"]
    path: "$.resolutions['tar-fs']"
    matches: '^[\^~]?2\.(1\.([3-9]|[1-9][0-9]+)|([2-9]|[1-9][0-9]+)\.[0-9]+)$'
    level: error
    message: "The root tar-fs security resolution must stay within ^2.1.3 (dependabot-security-fixes.instructions.md)."

  # ══════════════════════════════════════════════════════════════════════════
  # other: beachball check (check-packages.yml change-files; also `yarn
  # check:change`). Change-file validation: `type` (and dependentChangeType,
  # when present) is a beachball change type, and the type is not disallowed
  # for the package. The repo default is disallowedChangeTypes ['major']
  # (scripts/beachball/base.config.js); a package's own
  # package.json#beachball.disallowedChangeTypes replaces it. C: one superset
  # rule per change type joins change/*.json packageName to the package
  # manifests whose list allows that type.
  # ══════════════════════════════════════════════════════════════════════════

  - id: microsoft-fluentui-change-file-type-valid
    kind: json_path_matches
    paths: ["change/*.json"]
    path: "$.type"
    matches: '^(none|prerelease|prepatch|patch|preminor|minor|premajor|major)$'
    level: error
    message: "A change file's type must be a beachball change type (beachball check)."

  - id: microsoft-fluentui-change-file-dependent-type-valid
    kind: json_path_matches
    paths: ["change/*.json"]
    path: "$.dependentChangeType"
    if_present: true
    matches: '^(none|prerelease|prepatch|patch|preminor|minor|premajor|major)$'
    level: error
    message: "A change file's dependentChangeType must be a beachball change type (beachball check)."

  # A [other] (Stage B fluentui-b02) docs/react-v9/contributing/dev-workflow.md:95:
  #   the change description "should follow the semantic commit message
  #   format, and be prepended by one of the following: `feat:`, `fix:`,
  #   `chore:`, `docs:`, or `refactor:`" (docs/workflows/contributing.md:41
  #   shows 'fix(react-button): description'). All 12 change files at the
  #   pin comply.
  - id: microsoft-fluentui-change-file-comment-prefix
    kind: json_path_matches
    paths: ["change/*.json"]
    path: "$.comment"
    matches: '^(feat|fix|chore|docs|refactor)(\([^)]*\))?!?: \S'
    level: error
    message: "A change file's comment must start with feat:, fix:, chore:, docs: or refactor: (optionally with a scope), in semantic commit format (dev-workflow.md)."

  - id: microsoft-fluentui-change-type-major-allowed
    kind: cross_file
    relation: superset
    source:
      files: "{package.json,apps/*/package.json,packages/*/package.json,packages/react-components/*/package.json,packages/react-components/*/*/package.json,packages/charts/*/package.json,packages/charts/*/*/package.json,scripts/*/package.json,tools/*/package.json,typings/package.json,starter-templates/package.json}"
      extract:
        json: "$[?(@ == $.name && $.beachball.disallowedChangeTypes && !$.beachball.disallowedChangeTypes[?(@ == 'major')])]"
    targets:
      files: "change/*.json"
      extract:
        json: "$[?(@ == $.packageName && $.type == 'major')]"
    allow_missing_target: true
    level: error
    message: "A `major` change file names a package that disallows major (repo default ['major'] or its own beachball.disallowedChangeTypes)."

  - id: microsoft-fluentui-change-type-premajor-allowed
    kind: cross_file
    relation: superset
    source:
      files: "{package.json,apps/*/package.json,packages/*/package.json,packages/react-components/*/package.json,packages/react-components/*/*/package.json,packages/charts/*/package.json,packages/charts/*/*/package.json,scripts/*/package.json,tools/*/package.json,typings/package.json,starter-templates/package.json}"
      extract:
        json: "$[?(@ == $.name && !$.beachball.disallowedChangeTypes[?(@ == 'premajor')])]"
    targets:
      files: "change/*.json"
      extract:
        json: "$[?(@ == $.packageName && $.type == 'premajor')]"
    allow_missing_target: true
    level: error
    message: "A `premajor` change file names a package whose beachball.disallowedChangeTypes forbids premajor."

  - id: microsoft-fluentui-change-type-minor-allowed
    kind: cross_file
    relation: superset
    source:
      files: "{package.json,apps/*/package.json,packages/*/package.json,packages/react-components/*/package.json,packages/react-components/*/*/package.json,packages/charts/*/package.json,packages/charts/*/*/package.json,scripts/*/package.json,tools/*/package.json,typings/package.json,starter-templates/package.json}"
      extract:
        json: "$[?(@ == $.name && !$.beachball.disallowedChangeTypes[?(@ == 'minor')])]"
    targets:
      files: "change/*.json"
      extract:
        json: "$[?(@ == $.packageName && $.type == 'minor')]"
    allow_missing_target: true
    level: error
    message: "A `minor` change file names a package whose beachball.disallowedChangeTypes forbids minor."

  - id: microsoft-fluentui-change-type-preminor-allowed
    kind: cross_file
    relation: superset
    source:
      files: "{package.json,apps/*/package.json,packages/*/package.json,packages/react-components/*/package.json,packages/react-components/*/*/package.json,packages/charts/*/package.json,packages/charts/*/*/package.json,scripts/*/package.json,tools/*/package.json,typings/package.json,starter-templates/package.json}"
      extract:
        json: "$[?(@ == $.name && !$.beachball.disallowedChangeTypes[?(@ == 'preminor')])]"
    targets:
      files: "change/*.json"
      extract:
        json: "$[?(@ == $.packageName && $.type == 'preminor')]"
    allow_missing_target: true
    level: error
    message: "A `preminor` change file names a package whose beachball.disallowedChangeTypes forbids preminor."

  - id: microsoft-fluentui-change-type-patch-allowed
    kind: cross_file
    relation: superset
    source:
      files: "{package.json,apps/*/package.json,packages/*/package.json,packages/react-components/*/package.json,packages/react-components/*/*/package.json,packages/charts/*/package.json,packages/charts/*/*/package.json,scripts/*/package.json,tools/*/package.json,typings/package.json,starter-templates/package.json}"
      extract:
        json: "$[?(@ == $.name && !$.beachball.disallowedChangeTypes[?(@ == 'patch')])]"
    targets:
      files: "change/*.json"
      extract:
        json: "$[?(@ == $.packageName && $.type == 'patch')]"
    allow_missing_target: true
    level: error
    message: "A `patch` change file names a package whose beachball.disallowedChangeTypes forbids patch."

  - id: microsoft-fluentui-change-type-prepatch-allowed
    kind: cross_file
    relation: superset
    source:
      files: "{package.json,apps/*/package.json,packages/*/package.json,packages/react-components/*/package.json,packages/react-components/*/*/package.json,packages/charts/*/package.json,packages/charts/*/*/package.json,scripts/*/package.json,tools/*/package.json,typings/package.json,starter-templates/package.json}"
      extract:
        json: "$[?(@ == $.name && !$.beachball.disallowedChangeTypes[?(@ == 'prepatch')])]"
    targets:
      files: "change/*.json"
      extract:
        json: "$[?(@ == $.packageName && $.type == 'prepatch')]"
    allow_missing_target: true
    level: error
    message: "A `prepatch` change file names a package whose beachball.disallowedChangeTypes forbids prepatch."

  - id: microsoft-fluentui-change-type-prerelease-allowed
    kind: cross_file
    relation: superset
    source:
      files: "{package.json,apps/*/package.json,packages/*/package.json,packages/react-components/*/package.json,packages/react-components/*/*/package.json,packages/charts/*/package.json,packages/charts/*/*/package.json,scripts/*/package.json,tools/*/package.json,typings/package.json,starter-templates/package.json}"
      extract:
        json: "$[?(@ == $.name && !$.beachball.disallowedChangeTypes[?(@ == 'prerelease')])]"
    targets:
      files: "change/*.json"
      extract:
        json: "$[?(@ == $.packageName && $.type == 'prerelease')]"
    allow_missing_target: true
    level: error
    message: "A `prerelease` change file names a package whose beachball.disallowedChangeTypes forbids prerelease."

  - id: microsoft-fluentui-change-type-none-allowed
    kind: cross_file
    relation: superset
