  # A [other] .yarnrc.yml load-bearing header: "Yarn will delete the comments
  #   on automatic file updates. Please bring them back!" Each setting keeps
  #   its explanatory comment.
  - id: microsoft-fluentui-yarnrc-comments-kept
    kind: file_content_matches
    paths: [".yarnrc.yml"]
    pattern: '(?s)\A# Yarn will delete the comments on automatic file updates\.\n# Please bring them back!\n.*#[^\n]*\nenableScripts:.*#[^\n]*\nnpmMinimalAgeGate:.*#[^\n]*\nnpmPreapprovedPackages:'
    level: error
    message: ".yarnrc.yml must keep its comments (Yarn strips them on automatic updates; the header asks to bring them back)."

  # A [other] .gitattributes: "API files should be checked in with
  #   Unix-style newlines" (`*.api.md text=auto`).
  #   Known limit (Stage B): .gitattributes:5 is `text=auto` without eol=lf,
  #   so Git normalizes only the committed blob, while alint reads the working
  #   tree. On a Linux clone (this pin) the two agree; on a Windows checkout
  #   with core.autocrlf=true the api.md files are CRLF in the working tree
  #   and this rule fires although the repository content is LF. alint has no
  #   index/blob read to close this; reported to the integrator.
  - id: microsoft-fluentui-api-reports-lf
    kind: line_endings
    paths: ["**/*.api.md"]
    target: lf
    level: error
    message: "API report files (*.api.md) are checked in with LF line endings (.gitattributes)."

  # ══════════════════════════════════════════════════════════════════════════
  # other: load-bearing comments (Stage B; same standard as fluentui-04/-15)
  # ══════════════════════════════════════════════════════════════════════════

  # A [other] (Stage B fluentui-b03) AGENTS.md:1-2 (CLAUDE.md is a symlink to
  #   it): "Leave the start & end comments to automatically receive updates."
  #   Nx rewrites the block between the two markers.
  - id: microsoft-fluentui-agents-md-nx-markers
    kind: file_content_matches
    paths: ["AGENTS.md"]
    pattern: '(?s)<!-- nx configuration start-->.*<!-- nx configuration end-->'
    level: error
    message: "AGENTS.md must keep its `<!-- nx configuration start-->` / `<!-- nx configuration end-->` markers so Nx can keep updating the block between them."

  # A [other] (Stage B fluentui-b04) .github/workflows/copilot-setup-steps.yml:8:
  #   "The job MUST be called `copilot-setup-steps` or it will not be picked
  #   up by Copilot." The rule fires when no job has that key (any content).
  - id: microsoft-fluentui-copilot-setup-steps-job-name
    kind: yaml_path_absent
    paths: [".github/workflows/copilot-setup-steps.yml"]
    path: "$[?(!$.jobs['copilot-setup-steps'])]"
    level: error
    message: "The Copilot setup workflow's job must be named exactly `copilot-setup-steps`, or Copilot ignores it (comment in the workflow)."

  # A [other] (Stage B fluentui-b05) .github/dependabot.yml:35-41: "Production
  #   dependencies must stay in `allow` so security updates still apply"
  #   (also .github/instructions/dependabot-security-fixes.instructions.md).
  - id: microsoft-fluentui-dependabot-npm-allows-production
    kind: yaml_path_matches
    paths: [".github/dependabot.yml"]
    path: "$.updates[?(@['package-ecosystem'] == 'npm')].allow[?(@['dependency-type'] == 'production')]['dependency-type']"
    matches: '^production$'
    level: error
    message: "The npm entry in .github/dependabot.yml must keep `dependency-type: production` in `allow`, so security updates still apply to production dependencies."

  # ══════════════════════════════════════════════════════════════════════════
  # other: Jest assertions over committed files (R7: classified by their
  # logic, carved out of fluentui-38). Each runs in pr.yml:78
  # (`nx affected -t test`) when its project is affected.
  # ══════════════════════════════════════════════════════════════════════════

