  # ══════════════════════════════════════════════════════════════════════════
  # other: nx sync:check -> export-maps-sync (pr.yml "Workspace lint").
  # VALUE-ADD (level info, outside the ratio). Stage B removed fluentui-11 as
  #   an R1 duplicate of fluentui-20 (B-adapter): export-maps-sync checks the
  #   entry fields and the exports map in one syncProject call
  #   (export-maps-sync/index.ts:64-70, one outOfSync message). This rule is
  #   kept only as PARTIAL coverage of fluentui-20: it checks the
  #   main/module/typings half (buildEntryPointFields,
  #   export-maps-sync/lib/export-map.ts) and not the exports map derived from
  #   metadata.exportMap globs over the package's files. The real scope is
  #   non-private library projects tagged vNext + platform:web in project.json,
  #   which package.json cannot see, so the rule scopes by content
  #   (`"type": "module"`, not private) minus the two web-components packages
  #   and, since Stage C, react-jsx-runtime (tagged platform:any, so the
  #   generator skips it); that is exactly the 81 in-scope manifests at the
  #   pin. The CommonJS branch (main lib-commonjs/index.js) has no in-scope
  #   package at the pin and is not expressed.
  # ══════════════════════════════════════════════════════════════════════════
  - id: microsoft-fluentui-export-maps-entry-fields
    kind: json_path_absent
    paths:
      include: ["{packages/*/package.json,packages/react-components/*/package.json,packages/react-components/*/*/package.json,packages/charts/*/package.json,packages/charts/*/*/package.json}"]
      exclude: ["packages/web-components/package.json", "packages/charts/chart-web-components/package.json", "packages/react-components/react-jsx-runtime/package.json"]
    path: "$[?($.type == 'module' && $.private != true && ($.main != 'lib-commonjs/index.cjs' || $.module != 'lib/index.js' || $.typings != './dist/index.d.ts'))]"
    level: info
    message: "An ESM-first v9 package must keep main lib-commonjs/index.cjs, module lib/index.js and typings ./dist/index.d.ts (nx sync:check, export-maps-sync; partial coverage of the entry-point sync)."

  # ══════════════════════════════════════════════════════════════════════════
  # other: ESLint rule that asserts file text, not code (batch-2 ruling).
  # A [other] @fluentui/no-tslint-comments (packages/eslint-plugin core config,
  #   on in every flat config): no `tslint:disable` / `tslint:enable`
  #   comment in linted sources (`eslint src` per project). The rule's own
  #   tests quote the directive, so packages/eslint-plugin is excluded.
  #   Stage C: the rule matches comment.value against /^\s*tslint ?: ?(disable|enable)/
  #   (packages/eslint-plugin/src/rules/no-tslint-comments.js), so a `///` or
  #   `/**` comment, whose value starts with `/` or `*`, does not count; the
  #   pattern now requires the `//` or `/*` not to be preceded by `/`, and a
  #   line comment's whitespace to stay on its line. Known limit: the regex
  #   is not token-aware, so the directive inside a string literal would still
  #   fire (none at the pin outside packages/eslint-plugin).
  # ══════════════════════════════════════════════════════════════════════════
  - id: microsoft-fluentui-no-tslint-comments
    kind: file_content_forbidden
    paths:
      include: ["**/src/**/*.{ts,tsx,js,jsx,mjs,cjs,mts,cts}"]
      exclude: ["packages/eslint-plugin/**"]
    pattern: '(?:\A|[^/])(?://[^\S\n]*|/\*\s*)tslint ?: ?(?:disable|enable)'
    level: error
    message: "tslint:disable/enable comments are unnecessary with ESLint (@fluentui/no-tslint-comments)."

  # ══════════════════════════════════════════════════════════════════════════
  # other: documented conventions (R5)
  # ══════════════════════════════════════════════════════════════════════════

  # A [other] docs/react-v9/contributing/release-cycle.md: "unstable/preview
  #   packages follow strict semantic versioning via `0.major.(minor|patch)`".
  - id: microsoft-fluentui-preview-packages-zero-major
    kind: json_path_absent
    paths: "{package.json,apps/*/package.json,packages/*/package.json,packages/react-components/*/package.json,packages/react-components/*/*/package.json,packages/charts/*/package.json,packages/charts/*/*/package.json,scripts/*/package.json,tools/*/package.json,typings/package.json,starter-templates/package.json}"
    path: "$[?(match($.name, '.*-preview') && !match($.version, '0[.].*'))]"
    level: error
    message: "A *-preview package stays on 0.x (0.major.(minor|patch)) until it is released as stable (release-cycle.md)."

  # C [other] (fluentui-14; Stage B reclassified A -> C) The
  #   react-components/unstable API is frozen. release-cycle.md:26 says "this
  #   api cannot be changed in any way"; the entry point states the precise
  #   rule (packages/react-components/react-components/src/unstable/index.ts:4-6):
  #   adding new API exports is FORBIDDEN except react-virtualizer, and
  #   modifying any existing export is FORBIDDEN. A digest of the API report
  #   (Stage A) forbids the allowed react-virtualizer additions, so the C form
  #   is one anchored regex over index.ts, generated from the file at the pin:
  #   - the alert, infobutton, tree and drawer export blocks are pinned name
  #     by name, in order (no addition, removal or rename);
  #   - the two react-virtualizer blocks keep every existing name in order but
  #     may gain names anywhere inside them;
  #   - between blocks only comments and further react-virtualizer export
  #     statements may appear, and nothing else may be exported.
  #   Awkward (C): the frozen list lives in the regex, and a reorder or a
  #   comment inside a frozen block also fires.
