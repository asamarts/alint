    level: error
    message: "A frontend package must not depend on a backend-role package (verify-local-dependencies.js role rule 1)."

  # backstage-09 (C) — role rule 2: backend-plugin / node-library /
  # backend-plugin-module packages have no runtime dependency on a
  # frontend-plugin / web-library package (58 names hand-listed).
  - id: backstage-role-backend-no-frontend-deps
    kind: json_path_absent
    paths: ["{packages,plugins}/*/package.json"]
    path: "$[?(($.backstage.role == 'backend-plugin' || $.backstage.role == 'node-library' || $.backstage.role == 'backend-plugin-module') && $.dependencies['@backstage/app-defaults','@backstage/core-app-api','@backstage/core-compat-api','@backstage/core-components','@backstage/core-plugin-api','@backstage/dev-utils','@backstage/frontend-adapter-react-router-v6','@backstage/frontend-adapter-react-router-v7','@backstage/frontend-adapter-tanstack-router','@backstage/frontend-app-api','@backstage/frontend-defaults','@backstage/frontend-dev-utils','@backstage/frontend-dynamic-feature-loader','@backstage/frontend-plugin-api','@backstage/frontend-test-utils','@backstage/integration-react','@backstage/plugin-api-docs','@backstage/plugin-app','@backstage/plugin-app-react','@backstage/plugin-app-visualizer','@backstage/plugin-auth','@backstage/plugin-auth-react','@backstage/plugin-catalog','@backstage/plugin-catalog-graph','@backstage/plugin-catalog-import','@backstage/plugin-catalog-react','@backstage/plugin-catalog-unprocessed-entities','@backstage/plugin-config-schema','@backstage/plugin-devtools','@backstage/plugin-devtools-react','@backstage/plugin-home','@backstage/plugin-home-react','@backstage/plugin-kubernetes','@backstage/plugin-kubernetes-cluster','@backstage/plugin-kubernetes-react','@backstage/plugin-mui-to-bui','@backstage/plugin-notifications','@backstage/plugin-org','@backstage/plugin-org-react','@backstage/plugin-permission-react','@backstage/plugin-scaffolder','@backstage/plugin-scaffolder-react','@backstage/plugin-search','@backstage/plugin-search-react','@backstage/plugin-signals','@backstage/plugin-signals-react','@backstage/plugin-techdocs','@backstage/plugin-techdocs-addons-test-utils','@backstage/plugin-techdocs-react','@backstage/plugin-user-settings','@backstage/test-utils','@backstage/theme','@backstage/ui','@backstage/version-bridge','@internal/frontend','@internal/plugin-todo-list','@internal/scaffolder','app-example-plugin'])]"
    level: error
