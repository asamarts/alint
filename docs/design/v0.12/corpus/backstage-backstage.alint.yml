# yaml-language-server: $schema=https://raw.githubusercontent.com/asamarts/alint/main/schemas/v1/config.json
#
# alint v0.23 corpus-stratum config — backstage/backstage
# Pinned @ bc73976a6de26df49b2bc2eefe689ee5b3ed0af1 (stratum: js-monorepo)
#
# Shape: Yarn 4 (Berry) workspace, 239 workspace packages under packages/*
# and plugins/*, each carrying a `backstage.role` (12 roles) that the repo's
# own scripts use to police dependency direction, peer ranges and catalog
# metadata. Changesets for releases; a Docusaurus microsite plus mkdocs.
#
# WHERE THE ENFORCED VALIDATION LIVES
#   ci.yml "verify" job      — repo scripts and CLI checks over files alint
#                              reads: verify-local-dependencies.js (workspace:^
#                              ranges + 6 role rules), `lint:peer-deps`
#                              (repo-tools peer-deps), `fix --check`
#                              (cli-module-maintenance repo fix --publish),
#                              generate-catalog-info --ci, verify-changesets.js,
#                              verify-plugin-directory.js, verify-skills.js,
#                              verify-links.js, `pm verify-patches`, openapi
#                              lint (Spectral + one custom rule) / validate;
#                              plus tool runs (D): dedupe check, tsc,
#                              api-reports, type-deps, builds, config:check.
#   ci.yml "typos"/"test"    — typos, prettier, ESLint (incl. the notice
#                              copyright header), tests, verify-release.js.
#   verify_*.yml             — e2e (create-app's Node prerequisite check),
#                              accessibility, chromatic, docs quality (Vale),
#                              microsite build, codeql/fossa/scorecard.
#   .husky + lint-staged     — eslint/prettier, check-docs-quality,
#                              generate-catalog-info, sort-package-json.
#   load-bearing comments    — createApp.ts "Keep in sync with engines.node",
#                              renovate.json5 "@types/node ... pinned to match
#                              the Node versions we support", the six
#                              "*-noop.yml" NOTE comments.
#   docs                     — CONTRIBUTING.md (changesets, DCO),
#                              REVIEWING.md (0.x bump table), beps/README.md,
#                              docs/architecture-decisions/index.md.
#
# This config expresses the A and C units of the Stage A record and the
# Stage B missed units b01-b04 and b06, plus clearly marked VALUE-ADD rules
# (level info). Units with no rule here: B-adapter 20 (typesVersions from
# exports), 30 (catalog name slug), 32 (CODEOWNERS owner), 35 (0.x no major
# bump), 50 (doc-ID routes), 54 (links to directories), 70 (package.json
# key order), 74 (CI Node satisfies the engines floor), b05 (Docusaurus
# sidebar doc ids) and b07 (issue-form common fields); B-config 25
# (pluginPackages group), 26 (pluginPackage reference) and 69 (unique
# workspace names); C 36 (changeset coverage) and 71 (DCO), git kinds left
# out because the clone is depth 1; and the D units (tool runs, builds,
# tests, lockfile semantics, external services).
#
# The hand-listed package-name sets for role rules 1-4 were generated from
# the workspace manifests at the pin, and they drift when a package is
# added. That tuning is why those units are C. Nothing here spawns a
# process; there are no custom facts and no git-history kinds.
#
# Stage C applied Stage B's review:
#   - Relabelled A -> C: 15, 46, 49, 53, 55 (rules kept, limits noted).
#   - Demoted to info: the backstage-52 rule (an R1 duplicate of 45).
#   - Fixed scope: 14, 17, 48, 65.
#   - Promoted the openapi-router value-add rule to b01.
#   - Added b02, b03, b04 and b06 (b06 is a partial rule).

version: 1

rules:
  # ════════════════════════════════════════════════════════════════
  # dep-version
  # ════════════════════════════════════════════════════════════════

  # backstage-01 (A) — repo-tools peer-deps: a non-standalone package (role
  # not cli/frontend/backend) that references react, react-dom or
  # @types/react in any dependency field declares all three as
  # peerDependencies (they form one peer group).
  - id: backstage-react-peer-group-declared
    kind: json_path_absent
    paths: ["{packages,plugins}/*/package.json"]
    path: "$[?(!($.backstage.role == 'cli' || $.backstage.role == 'frontend' || $.backstage.role == 'backend') && $['dependencies','devDependencies','peerDependencies']['react','react-dom','@types/react'] && !($.peerDependencies.react && $.peerDependencies['react-dom'] && $.peerDependencies['@types/react']))]"
    level: error
    message: "A package that uses react, react-dom or @types/react must declare all three as peerDependencies (yarn lint:peer-deps)."

  # backstage-02 (A) — peer-deps: @types/react is marked optional in
  # peerDependenciesMeta; react and react-dom are not.
  - id: backstage-react-peer-optional-marking
    kind: json_path_absent
    paths: ["{packages,plugins}/*/package.json"]
    path: "$[?(!($.backstage.role == 'cli' || $.backstage.role == 'frontend' || $.backstage.role == 'backend') && (($.peerDependencies['@types/react'] && $.peerDependenciesMeta['@types/react'].optional != true) || ($.peerDependencies.react && $.peerDependenciesMeta.react.optional == true) || ($.peerDependencies['react-dom'] && $.peerDependenciesMeta['react-dom'].optional == true)))]"
    level: error
    message: "peerDependenciesMeta must mark @types/react (only) as optional (yarn lint:peer-deps)."

  # backstage-03 (A) — peer-deps: each React peer is also a devDependency.
  - id: backstage-react-peer-also-dev
    kind: json_path_absent
    paths: ["{packages,plugins}/*/package.json"]
    path: "$[?(!($.backstage.role == 'cli' || $.backstage.role == 'frontend' || $.backstage.role == 'backend') && (($.peerDependencies.react && !$.devDependencies.react) || ($.peerDependencies['react-dom'] && !$.devDependencies['react-dom']) || ($.peerDependencies['@types/react'] && !$.devDependencies['@types/react'])))]"
    level: error
    message: "A React peer dependency must also be listed in devDependencies (yarn lint:peer-deps)."

  # backstage-04 (A) — peer-deps: a React peer is never also a runtime
  # dependency.
  - id: backstage-react-peer-not-runtime
    kind: json_path_absent
    paths: ["{packages,plugins}/*/package.json"]
    path: "$[?(!($.backstage.role == 'cli' || $.backstage.role == 'frontend' || $.backstage.role == 'backend') && (($.peerDependencies.react && $.dependencies.react) || ($.peerDependencies['react-dom'] && $.dependencies['react-dom']) || ($.peerDependencies['@types/react'] && $.dependencies['@types/react'])))]"
    level: error
    message: "A React peer dependency must not also be a runtime dependency (yarn lint:peer-deps)."

  # backstage-05 (A) — peer-deps: the local devDependency ranges are the
  # desired ones (react/react-dom ^18.0.2, @types/react ^18.0.0).
  - id: backstage-react-dev-ranges
    kind: json_path_absent
    paths: ["{packages,plugins}/*/package.json"]
    path: "$[?(!($.backstage.role == 'cli' || $.backstage.role == 'frontend' || $.backstage.role == 'backend') && (($.peerDependencies.react && $.devDependencies.react != '^18.0.2') || ($.peerDependencies['react-dom'] && $.devDependencies['react-dom'] != '^18.0.2') || ($.peerDependencies['@types/react'] && $.devDependencies['@types/react'] != '^18.0.0')))]"
    level: error
    message: "devDependencies must pin react/react-dom to ^18.0.2 and @types/react to ^18.0.0 (yarn lint:peer-deps)."

  # backstage-06 (A) — peer-deps: the peer ranges are '^17.0.0 || ^18.0.0',
  # or '^18.0.0' for the three React-18-only packages.
  - id: backstage-react-peer-ranges
    kind: json_path_absent
    paths: ["{packages,plugins}/*/package.json"]
    path: "$[?(!($.backstage.role == 'cli' || $.backstage.role == 'frontend' || $.backstage.role == 'backend') && ((!($.name == '@backstage/frontend-adapter-react-router-v7' || $.name == '@backstage/frontend-adapter-tanstack-router' || $.name == '@backstage/ui') && (($.peerDependencies.react && $.peerDependencies.react != '^17.0.0 || ^18.0.0') || ($.peerDependencies['react-dom'] && $.peerDependencies['react-dom'] != '^17.0.0 || ^18.0.0') || ($.peerDependencies['@types/react'] && $.peerDependencies['@types/react'] != '^17.0.0 || ^18.0.0'))) || (($.name == '@backstage/frontend-adapter-react-router-v7' || $.name == '@backstage/frontend-adapter-tanstack-router' || $.name == '@backstage/ui') && (($.peerDependencies.react && $.peerDependencies.react != '^18.0.0') || ($.peerDependencies['react-dom'] && $.peerDependencies['react-dom'] != '^18.0.0') || ($.peerDependencies['@types/react'] && $.peerDependencies['@types/react'] != '^18.0.0')))))]"
    level: error
    message: "React peer ranges must be '^17.0.0 || ^18.0.0' ('^18.0.0' for the React-18-only packages) (yarn lint:peer-deps)."

  # backstage-07 (C) — verify-local-dependencies.js: every dependency on a
  # workspace package (all four dependency fields) uses `workspace:^`
  # ('' and link: are skipped). JSONPath cannot read object keys, so the
  # workspace names are a hand-kept regex alternation over the raw JSON.
  - id: backstage-local-deps-workspace-caret
    kind: file_content_forbidden
    paths: ["{packages,plugins}/*/package.json"]
    pattern: '"(?:@backstage/[^"]+|@internal/[^"]+|@techdocs/cli|example-app|example-app-legacy|example-backend|e2e-test|app-example-plugin|techdocs-cli-embedded-app|yarn-plugin-backstage)":\s*"(?:[^wl"]|l[^i]|w[^o]|workspace:(?:[^^]|\^[^"]))'
    level: error
    message: "Local workspace dependencies must use the 'workspace:^' range (scripts/verify-local-dependencies.js)."

  # backstage-08 (C) — role rule 1: a frontend-plugin / web-library package
  # has no runtime dependency on a backend-plugin / node-library /
  # backend-plugin-module package. Target names hand-listed (128) from the
  # manifests at the pin.
  - id: backstage-role-frontend-no-backend-deps
    kind: json_path_absent
    paths: ["{packages,plugins}/*/package.json"]
    path: "$[?(($.backstage.role == 'frontend-plugin' || $.backstage.role == 'web-library') && $.dependencies['@backstage/backend-app-api','@backstage/backend-defaults','@backstage/backend-dev-utils','@backstage/backend-dynamic-feature-service','@backstage/backend-openapi-utils','@backstage/backend-plugin-api','@backstage/backend-test-utils','@backstage/cli-common','@backstage/cli-node','@backstage/config-loader','@backstage/connections-node','@backstage/e2e-test-utils','@backstage/integration-aws-node','@backstage/plugin-app-backend','@backstage/plugin-app-node','@backstage/plugin-auth-backend','@backstage/plugin-auth-backend-module-atlassian-provider','@backstage/plugin-auth-backend-module-auth0-provider','@backstage/plugin-auth-backend-module-aws-alb-provider','@backstage/plugin-auth-backend-module-azure-easyauth-provider','@backstage/plugin-auth-backend-module-bitbucket-provider','@backstage/plugin-auth-backend-module-bitbucket-server-provider','@backstage/plugin-auth-backend-module-cloudflare-access-provider','@backstage/plugin-auth-backend-module-gcp-iap-provider','@backstage/plugin-auth-backend-module-github-provider','@backstage/plugin-auth-backend-module-gitlab-provider','@backstage/plugin-auth-backend-module-google-provider','@backstage/plugin-auth-backend-module-guest-provider','@backstage/plugin-auth-backend-module-microsoft-provider','@backstage/plugin-auth-backend-module-oauth2-provider','@backstage/plugin-auth-backend-module-oauth2-proxy-provider','@backstage/plugin-auth-backend-module-oidc-provider','@backstage/plugin-auth-backend-module-okta-provider','@backstage/plugin-auth-backend-module-onelogin-provider','@backstage/plugin-auth-backend-module-openshift-provider','@backstage/plugin-auth-backend-module-pinniped-provider','@backstage/plugin-auth-backend-module-vmware-cloud-provider','@backstage/plugin-auth-node','@backstage/plugin-catalog-backend','@backstage/plugin-catalog-backend-module-ai-model','@backstage/plugin-catalog-backend-module-aws','@b