  # C [other] .gitignore: "Those folders are meant to contain the prepack build
  #   artifacts; we don't commit them", "the artifacts must not be checked-in",
  #   "never kept" (pack tarballs, release artifacts), "local-only" bundles.
  #   git skips them on add; the rule catches a force-added artifact. C: the
  #   walk-based kinds (file_absent, dir_absent) never see a tracked-but-ignored
  #   file, and git_no_denied_paths globs let `*` cross `/` (so
  #   `packages/*/lib/**` would hit packages/docusaurus/src/lib and the fixture
  #   trees), so the workspace directories are enumerated by hand. A NEW
  #   package directory is not in the list, so its artifacts go uncovered (the
  #   list goes stale as a silent false negative, nothing fires).
  - id: yarnpkg-berry-no-committed-build-artifacts
    kind: git_no_denied_paths
    denied:
      - "packages/{acceptance-tests,berry-cli,docusaurus,esbuild-plugin-pnp,eslint-config,make-fetch-smaller,plugin-catalog,plugin-compat,plugin-constraints,plugin-dlx,plugin-essentials,plugin-exec,plugin-file,plugin-git,plugin-github,plugin-http,plugin-init,plugin-interactive-tools,plugin-jsr,plugin-link,plugin-nm,plugin-npm-cli,plugin-npm,plugin-pack,plugin-patch,plugin-pnp,plugin-pnpm,plugin-stage,plugin-typescript,plugin-version,plugin-workspace-tools,vscode-zipfs,yarnpkg-builder,yarnpkg-cli,yarnpkg-core,yarnpkg-doctor,yarnpkg-extensions,yarnpkg-fslib,yarnpkg-libui,yarnpkg-libzip,yarnpkg-nm,yarnpkg-parsers,yarnpkg-pnp,yarnpkg-pnpify,yarnpkg-sdks,yarnpkg-shell,yarnpkg-types}/lib/**"
      - "packages/{acceptance-tests,berry-cli,docusaurus,esbuild-plugin-pnp,eslint-config,make-fetch-smaller,plugin-catalog,plugin-compat,plugin-constraints,plugin-dlx,plugin-essentials,plugin-exec,plugin-file,plugin-git,plugin-github,plugin-http,plugin-init,plugin-interactive-tools,plugin-jsr,plugin-link,plugin-nm,plugin-npm-cli,plugin-npm,plugin-pack,plugin-patch,plugin-pnp,plugin-pnpm,plugin-stage,plugin-typescript,plugin-version,plugin-workspace-tools,vscode-zipfs,yarnpkg-builder,yarnpkg-cli,yarnpkg-core,yarnpkg-doctor,yarnpkg-extensions,yarnpkg-fslib,yarnpkg-libui,yarnpkg-libzip,yarnpkg-nm,yarnpkg-parsers,yarnpkg-pnp,yarnpkg-pnpify,yarnpkg-sdks,yarnpkg-shell,yarnpkg-types}/bundles/**"
      - "packages/yarnpkg-libui/sources/**/*.js"
      - "packages/yarnpkg-libui/sources/**/*.d.ts"
      - "packages/yarnpkg-pnp/sources/hook.raw.js"
      - "artifacts/**"
      - "dist/**"
      - "package.tgz"
      - "merge-conflict-resolution.patch"
    level: error
    message: "Build and release artifacts are gitignored and must not be committed (.gitignore)."

  # ══════════════════════════════════════════════════════════════════════════
  # VALUE-ADD (not counted; R3/R5). Both dynamicRequire.ts copies say "This
  # file is copied from miscUtils.ts - make sure your changes are synced
  # there". The miscUtils.ts original has drifted textually (realRequire,
  # dynamicRequireNode), so the enforced convention is semantic (D); alint can
  # still hold the two copies byte-identical, which they are today.
  # ══════════════════════════════════════════════════════════════════════════
  - id: yarnpkg-berry-valueadd-dynamic-require-copies-identical
    kind: cross_file
    relation: identical
    source:
      file: "packages/yarnpkg-pnpify/sources/dynamicRequire.ts"
    targets:
      - file: "packages/yarnpkg-sdks/sources/dynamicRequire.ts"
    level: info
    message: "The two dynamicRequire.ts copies (pnpify, sdks) should stay identical."
