# yaml-language-server: $schema=https://raw.githubusercontent.com/asamarts/alint/main/schemas/v1/config.json
#
# ============================================================================
# alint config for rust-lang/rust
# ============================================================================
# Re-analysis of src/tools/tidy/src/*.rs (the in-tree `./x test tidy` lint),
# plus the CI extra-checks (rustfmt/typos/ruff/shellcheck/eslint) and the
# Cargo workspace dependency policy.
#
# RECONCILIATION WITH TIDY:
#   * exact scalar checks (edition and Cargo.lock sources) stay declarative;
#   * tidy's logical-item alphabetical blocks, per-line ignore directives,
#     compiler-aware sets, and `--bless` generators stay on tidy because the
#     generic rule kinds cannot model them without false findings;
#   * triagebot path keys are extracted from section headers in source text;
#   * rustfmt remains one workspace-wide `command_idempotent` invocation;
#   * broad source checks are PR-scoped through `scope_filter.changed_since`.
#
# Adopt: save as .alint.yml at repo root, `alint check`. Most rules are
# PR-scoped via scope_filter so a CI run only lints the diff (tidy itself
# has a --modified-files mode; this mirrors it). Drop the scope_filter
# blocks for a full-tree sweep.
# ============================================================================

version: 1

extends:
  - alint://bundled/oss-baseline@v1
  - alint://bundled/rust@v1
  - alint://bundled/monorepo/cargo-workspace@v1
  - alint://bundled/ci/github-actions@v1
  - alint://bundled/hygiene/no-tracked-artifacts@v1

rules:
  # rust-analyzer and rustfmt test inputs intentionally preserve malformed
  # files; the UI corpus also contains explicit ignore-tidy trailing-newline
  # fixtures. Narrow the bundled rule so those fixtures are not findings.
  - id: rust-sources-final-newline
    when: facts.has_rust
    kind: final_newline
    paths:
      include: ["**/*.rs"]
      exclude:
        - "src/tools/{rust-analyzer,rustfmt}/**"
        - "tests/ui/**"
    scope_filter:
      has_ancestor: Cargo.toml
    level: warning
    fix:
      file_append_final_newline: {}

  # ==========================================================================
  # tidy::style  — the whitespace / line-length / forbidden-token sweep
  # (src/tools/tidy/src/style.rs). Rust files are excluded from most of these
  # because rustfmt owns them; tidy only runs them on non-.rs files.
  # ==========================================================================

  # --- line length: 100 cols default, 120 on .goml, 80 on error-code md ---
  - id: rust-tidy-line-120-goml
    kind: line_max_width
    paths: "tests/rustdoc-gui/**/*.goml"
    max_width: 120
    level: warning

  - id: rust-tidy-line-80-error-codes
    kind: line_max_width
    paths: "compiler/rustc_error_codes/src/error_codes/*.md"
    max_width: 80
    level: warning

  # tidy's remaining style checks honor directory filters and per-line
  # `ignore-tidy-*` directives that the corresponding generic rule kinds
  # cannot model. They remain on `./x test tidy` rather than emitting noisy
  # approximations here.

  # ==========================================================================
  # tidy::edition — every Cargo.toml is edition 2021 or 2024
  # ==========================================================================
  - id: rust-tidy-cargo-edition
    kind: toml_path_matches
    paths:
      include:
        - "compiler/**/Cargo.toml"
        - "library/**/Cargo.toml"
        - "src/**/Cargo.toml"
      exclude:
        - "library/Cargo.toml"
        - "compiler/rustc_codegen_{cranelift,gcc}/**"
        - "library/{backtrace,compiler-builtins,portable-simd,stdarch}/**"
        - "src/{gcc,llvm-project}/**"
        - "src/doc/{book,edition-guide,embedded-book,nomicon,reference,rust-by-example,rustc-dev-guide}/**"
        - "src/tools/{cargo,clippy,enzyme,libcxx-version,miri,rust-analyzer,rustc-perf,rustfmt}/**"
    path: "$.package.edition"
    matches: '^(2021|2024)$'
    level: error

  # ==========================================================================
  # tidy::extdeps — Cargo.lock `source =` allowlist
  # The exact tidy list is only TWO allowed sources (crates.io index + one
  # pinned rust-lang/team git rev). Now expressed precisely.
  # ==========================================================================
  - id: rust-tidy-cargo-lock-source-allowlist
    kind: toml_path_matches
    paths: "Cargo.lock"
    path: "$['package'][*].source"
    matches: '^(registry\+https://github\.com/rust-lang/crates\.io-index|git\+https://github\.com/rust-lang/team#a5260e76d3aa894c64c56e6ddc8545b9a98043ec)$'
    level: error
    message: "Only crates.io and the one pinned rust-lang/team git source are vendorable (tidy::extdeps)."

  # ==========================================================================
  # tidy::deps — the proc-macro dependency BLESSED list.
  # ==========================================================================
  # There is no stdout-producing generator for this file: the real operation
  # is `./x test tidy --bless`. Keep freshness on tidy instead of invoking a
  # nonexistent placeholder script from `generated_file_fresh`.

  # ==========================================================================
  # tidy::gcc_submodule — src/gcc submodule SHA must equal the version pin in
  # compiler/rustc_codegen_gcc/libgccjit.version.
  # cross_file can compare the pin file to a generated SHA file IF
  # one exists. The real check shells out to `git submodule status`, so this is
  # only PARTIALLY replaceable; left commented as the closest declarative form.
  # ==========================================================================
  # - id: rust-tidy-gcc-submodule-pin
  #   kind: cross_file
  #   source:
  #     file: "compiler/rustc_codegen_gcc/libgccjit.version"
  #     extract: {regex: '^([0-9a-f]{40})'}
  #   targets:
  #     - file: ".gitmodules.sha"   # would need a materialized submodule-SHA file
  #       extract: {regex: '^([0-9a-f]{40})'}
  #   level: error

  # ==========================================================================
  # tidy::features <-> tidy::unstable_book sync.
  # Every unstable lang/lib feature must have a doc page under
  # doc/unstable-book/src/{language,library}-features/<feature>.md and vice
  # versa. This is a SET-EQUALITY between feature attrs (parsed from #[unstable]
  # across the tree) and a directory listing — cross_file does
  # scalar value equality, not set membership, so this is NOT replaceable today.
  # Listed as a NEW-rule-kind candidate (`cross_file_set_equals`).
  # ==========================================================================

  # ==========================================================================
  # tidy::known_bug — tests/crashes/*.rs must declare //@ known-bug:
  # ==========================================================================
  - id: rust-tidy-crashes-known-bug
    kind: file_content_matches
    paths:
      include: ["tests/crashes/**/*.rs"]
      exclude: ["tests/crashes/auxiliary/**"]
    pattern: '(?m)^//@ known-bug:'
    level: error

  # ==========================================================================
  # tidy::rustdoc_gui_tests — .goml starts with a description comment
  # ==========================================================================
  - id: rust-tidy-rustdoc-gui-description
    kind: file_starts_with
    paths: "tests/rustdoc-gui/**/*.goml"
    prefix: "// "
    level: warning

  # ==========================================================================
  # tidy::filenames — no chars Windows can't represent / control chars
  # ==========================================================================
  - id: rust-tidy-no-windows-illegal-names
    kind: no_illegal_windows_names
    paths: "**/*"
    level: error

  # ==========================================================================
  # tidy::tests_placement — src/test/ must not be recreated
  # ==========================================================================
  - id: rust-tidy-no-src-test-dir
    kind: dir_absent
    paths: "src/test"
    level: error

  # ==========================================================================
  # tidy::unit_tests — no #[test]/#[bench] directly in core/alloc/std
  # ==========================================================================
  - id: rust-tidy-no-test-in-stdlib
    kind: file_content_forbidden
    paths:
      include: ["library/**/*.rs"]
      exclude:
        - "library/{backtrace,compiler-builtins,portable-simd,stdarch}/**"
        - "library/{std,std_detect,test}/**"
        - "library/*tests/**"
        - "library/alloc/src/collections/btree/{borrow,map,node,set}/tests.rs"
        - "library/alloc/src/collections/{linked_list,vec_deque}/tests.rs"
        - "library/alloc/src/{raw_vec,wtf8}/tests.rs"
    pattern: '(?m)^\s*#\[(test|bench)\]'
    level: error
    message: "Inline tests in the checked stdlib sources belong in the exempt test modules or sibling test crates."

  # ==========================================================================
  # tidy::bins — no binaries checked into the source tree.
  # Covered by the extends: hygiene/no-tracked-artifacts@v1 bundle; left here
  # for documentation. tidy actually probes by reading file bytes (ELF/Mach-O
  # magic); the bundle uses extension + gitattributes heuristics.
  # ==========================================================================

  # ==========================================================================
  # tidy::alphabetical — marked, logical-item sorted regions.
  # ==========================================================================
  # tidy joins indented continuation lines before comparing marked regions.
  # `ordered_block` compares physical lines, so tidy remains authoritative
  # until the rule kind can model logical multi-line items.

  # ==========================================================================
  # tidy::triagebot — paths referenced in triagebot.toml [mentions.*] exist.
  # registry_paths_resolve extracts the [mentions.*] keys (path filters) and
  # verifies each resolves on disk. tidy treats missing literal paths as
  # globs; entries_are_globs handles that.
  # ==========================================================================
  - id: rust-tidy-triagebot-paths-resolve
    kind: registry_paths_resolve
    source: "triagebot.toml"
    # Section names are the path filters. Ignore content-mention keys such as
    # "miri" by requiring a slash or dot in the captured key.
    extract:
      regex: '(?m)^\[mentions\."([^"]*[/.][^"]*)"\]\s*$'
    base: "."
    entries_are_globs: true
    level: warning
    message: "A path filter in triagebot.toml [mentions.*] does not exist on disk."

  # keep a structural sanity check too
  - id: rust-triagebot-relabel-section
    kind: file_content_matches
    paths: "triagebot.toml"
    pattern: '(?m)^\[relabel\]\s*$'
    level: warning

  # ==========================================================================
  # tidy::error_codes — error code defn <-> long-form doc <-> UI test.
  # Stage 2 (every Exxxx has compiler/rustc_error_codes/src/error_codes/Exxxx.md)
  # could be a registry_paths_resolve from the lib.rs code list to the docs dir,
  # but the code list is a Rust macro invocation (not a parseable list) and the
  # doctest/emit checks need a compiler. Left as a NEW-rule-kind candidate.
  # ==========================================================================

  # ==========================================================================
  # EXTRA-CHECKS (CI tools tidy shells out to). Now expressed as the v0.10
  # command_idempotent kind where the tool has a --check mode, so a single
  # invocation lints the whole tree (was per-file `command` before).
  # ==========================================================================

  # --- rustfmt: `./x fmt --check` over the workspace ---           NEW kind
  - id: rust-rustfmt-check
    kind: command_idempotent
    command: ["cargo", "fmt", "--all", "--check"]
    files_from: stdout
    files_pattern: 'Diff in (\S+) at'
    timeout: 600
    level: warning
    message: "Run `./x fmt` to format (rustfmt is canonical for .rs line length/whitespace)."

  # --- typos spellcheck (allowlist in typos.toml) ---
  - id: rust-tidy-spellcheck
    kind: command
    paths: "typos.toml"
    command: ["typos"]
    timeout: 120
    level: warning

  # --- ruff format + lint (config under src/tools/tidy/config) ---
  - id: rust-tidy-ruff-format
    kind: command
    paths: "**/*.py"
    command: ["ruff", "format", "--check", "--config", "src/tools/tidy/config/ruff.toml", "{path}"]
    timeout: 30
    level: warning

  - id: rust-tidy-ruff-lint
    kind: command
    paths: "**/*.py"
    command: ["ruff", "check", "--config", "src/tools/tidy/config/ruff.toml", "{path}"]
    timeout: 30
    level: warning

  # --- shellcheck on CI shell scripts ---
  - id: rust-tidy-shellcheck
    kind: command
    paths:
      include: ["src/ci/scripts/**/*.sh", "src/ci/*.sh"]
      exclude: ["src/llvm-project/**", "src/gcc/**"]
    command: ["shellcheck", "-x", "{path}"]
    timeout: 30
    level: warning

# ============================================================================
# GENUINE NON-REPLACEABLES — these stay on `./x test tidy` / the test suite.
# WHY each one needs machinery alint deliberately does not have:
#
#  - The compiler bootstrap (x.py / src/bootstrap) — builds rustc; not a lint.
#  - tidy::deps LICENSE (SPDX) allowlist + per-tier PERMITTED_*_DEPENDENCIES
#    name lists + EXCEPTIONS — requires a full `cargo metadata` dependency-graph
#    walk per workspace tier (rustc / stdlib / cranelift / gcc / bootstrap /
#    cargo / rust-analyzer / rustbook / rustc-perf). alint reads files, not the
#    resolved crate graph. The Cargo.lock `source` allowlist (above) is the only
#    declarative slice.
#  - tidy::features <-> unstable_book SET equality, and tidy::error_codes
#    (code list <-> docs dir <-> UI tests <-> compiler emits) — need SET-membership
#    cross-file logic and Rust-macro/AST parsing + a compiler run.
#  - tidy::pal — platform-abstraction-layer #[cfg] scope analysis (Rust AST).
#  - tidy::target_policy — target-tier sanity (assembly-test target coverage).
#  - tidy::unknown_revision / tests_revision_unpaired_stdout_stderr /
#    mir_opt_tests / ui_tests / debug_artifacts / target_specific_tests —
#    compiletest header semantics + test-directory invariants (revisions,
#    paired .stderr/.stdout, LLVM-component prerequisites). Test-framework-aware.
#  - tidy::rustdoc_css_themes — light/dark CSS theme block SYNCHRONIZATION
#    (two files must contain equivalent rule sets). Needs structural CSS diff.
#  - tidy::rustdoc_templates — Tera `{# #}` whitespace-strip presence (template AST).
#  - tidy::rustdoc_json FORMAT_VERSION bump-on-change — needs git-diff "if X changed
#    then Y must change" logic (pair-change, not pair-hash).
#  - tidy::gcc_submodule / tidy::x_version — git submodule SHA / installed cargo
#    version probing (shell out to git/cargo at runtime, no on-disk artifact).
#  - tidy::codegen `// @!has` rustdoc-test annotation checks; the full ~2000
#    permutation "problematic consts" set (generated at runtime).
#  - tidy::extra_checks js:lint/es-check/typecheck (eslint/tsc on rustdoc JS),
#    cpp:fmt (clang-format) — run as command kinds if desired, but the bless/
#    autofix flow stays in tidy.
#
# NEW-RULE-KIND CANDIDATES this study surfaces (v0.12+):
#  1. cross_file_set_equals  — set membership/equality between an extracted set
#     and a directory listing (features<->unstable_book, error-code<->docs).
#  2. registry of regex-extracted IDs -> "<id>.md exists in DIR" (error_codes
#     stage 2; registry_paths_resolve almost does this but needs a per-entry
#     filename template).
#  3. pair_changed_together — "if file A's content changed in this diff, file B
#     (or a const in it) must also change" (rustdoc_json FORMAT_VERSION).
#  4. file_pair_in_sync / structured_block_equals — two files must contain the
#     same logical block (rustdoc_css_themes).
# ============================================================================
