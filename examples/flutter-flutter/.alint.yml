# yaml-language-server: $schema=https://raw.githubusercontent.com/asamarts/alint/main/schemas/v1/config.json
#
# Proposed alint config for flutter/flutter — re-analysis exploiting alint
# v0.10 + v0.11 capabilities (baseline was the v0.9.17-era example config).
#
# Repo state: shallow clone of flutter/flutter @ HEAD (2026-05-25).
# Note the monorepo absorbed the old flutter/engine: the engine now lives
# under engine/src/flutter/ in-tree, so its CI scripts (ci/analyze.sh,
# ci/format.sh, ci/clang_tidy.sh, ci/pylint.sh, ci/licenses_cpp.sh,
# ci/ban_generated_plugin_registrant_java.sh, ci/check_build_configs.sh)
# are now visible and shellable from this single repo.
#
# Validation surface catalogued (see report): dev/bots/analyze.dart (39
# Validation() entries — license headers, trailing whitespace, flow-control
# spacing, deprecation-format, bad-imports, golden tags, taboo words, etc.),
# dev/bots/custom_rules/ (6 Dart-AST custom lints), dev/bots/test.dart
# orchestrator, engine/src/flutter/ci/*.sh (7 scripts), .ci.yaml (7226 lines,
# 464 shard targets), analysis_options.yaml chain, dart format, dartdoc,
# bin/internal/engine.version pin coherence, .gitattributes EOL discipline.
#
# WHAT STAYS BESPOKE (genuine non-replaceables — keep the tools):
#   - dart analyze / flutter analyze  : semantic + type-flow analysis (no
#                                        text rule replaces a type system)
#   - dart format                     : AST-based reformat
#   - clang-tidy / clang-format       : C++ AST lints (engine)
#   - the 6 dev/bots/custom_rules/    : Dart-AST custom lints (no_double_clamp,
#                                        avoid_future_catcherror, etc.) —
#                                        require the analyzer AST, not regex
#   - dev/bots/test.dart shards       : test EXECUTION
#   - golden-file image comparison    : pixel diff, not text
#   These are wrapped as `command:`/`command_idempotent:` rules below so a
#   single `alint check` drives the whole pipeline, but alint does not
#   reimplement them.

version: 1

extends:
  - alint://bundled/oss-baseline@v1            # README/LICENSE, no merge markers, final newline, no bidi
  - alint://bundled/ci/github-actions@v1       # workflow permissions + action SHA pinning (16 workflows)
  - alint://bundled/monorepo@v1                # multi-workspace topology hygiene
  - alint://bundled/hygiene/no-tracked-artifacts@v1
  # NOTE: tooling/editorconfig@v1 deliberately NOT extended — flutter ships
  # NO .editorconfig; its whitespace discipline lives in analyze.dart instead
  # (replaced directly below).

# Grandfather the giant existing tree: new structural text-rules fire only on
# files a PR actually touches. The 4857 Dart / 3227 C++ files predate alint;
# `changed_since` (v0.11) keeps the gate green on legacy files while enforcing
# on every new/modified one.

rules:
  # ════════════════════════════════════════════════════════════════════
  # THE PRIZE: replacing dev/bots/analyze.dart's text-level checks.
  # These are the bespoke regex/line checks that DON'T need the Dart AST.
  # ════════════════════════════════════════════════════════════════════

  # --- 1. License header (verifyNoMissingLicense) ---------------------
  # analyze.dart enforces the LITERAL string "Copyright 2014 The Flutter
  # Authors. All rights reserved." (framework) — note: not a YYYY range,
  # the year is hardcoded 2014. Engine files use "Copyright 2013".
  # Comment-leader varies by language: // for dart/java/h/m/cc/cpp/swift/
  # gradle, # for gn/sh/ps1, REM for bat, <!-- for html/xml, // after a
  # #version line for .frag shaders.
  #
  # // / # leader languages (the bulk):
  - id: flutter-license-header-slashes
    scope_filter:
      changed_since: "{{env.ALINT_BASE_REF | default('origin/master')}}"
    kind: file_header
    paths:
      include:
        ["**/*.dart","**/*.java","**/*.h","**/*.m","**/*.mm","**/*.cc",
         "**/*.cpp","**/*.swift","**/*.gradle","**/*.kt","**/*.kts"]
      exclude:
        ["**/third_party/**","engine/src/flutter/third_party/**",
         "engine/src/build/**","**/.dart_tool/**","**/build/**",
         "**/*.g.dart","**/*.g.cc","**/generated/**",
         "packages/flutter_localizations/lib/src/l10n/**",
         "packages/flutter_tools/templates/**",
         "**/fix_data/**","packages/flutter/test_fixes/**"]
    lines: 4
    # Matches both the 2013 (engine) and 2014 (framework) variants.
    pattern: 'Copyright 201[34] The Flutter Authors\. All rights reserved\.'
    level: warning
    message: >-
      Replaces dev/bots/analyze.dart verifyNoMissingLicense for // and #-leader
      source. Every framework file carries "Copyright 2014 The Flutter Authors";
      engine files (engine/src/flutter/) carry "Copyright 2013".
    policy_url: "https://github.com/flutter/flutter/blob/master/LICENSE"

  - id: flutter-license-header-hash
    scope_filter:
      changed_since: "{{env.ALINT_BASE_REF | default('origin/master')}}"
    kind: file_header
    paths:
      include: ["**/*.gn","**/*.gni","**/*.sh","**/*.ps1","**/*.py"]
      exclude:
        ["**/third_party/**","engine/src/flutter/third_party/**",
         "engine/src/build/**","**/build/**"]
    lines: 6     # sh/ps1 may carry a shebang line before the header
    pattern: 'Copyright 201[34] The Flutter Authors\. All rights reserved\.'
    level: warning
    message: Replaces verifyNoMissingLicense for #-comment build scripts (gn/gni/sh/ps1/py).

  # --- 2. Trailing whitespace + trailing blank line (verifyNoTrailingSpaces)
  # analyze.dart flags any line ending in U+0020 or U+0009, and a trailing
  # blank final line, across ALL text files.
  - id: flutter-no-trailing-whitespace
    scope_filter:
      changed_since: "{{env.ALINT_BASE_REF | default('origin/master')}}"
    kind: file_content_forbidden
    paths:
      include: ["**/*"]
      exclude:
        ["**/*.png","**/*.jpg","**/*.ico","**/*.jar","**/*.snapshot",
         "**/*.ttf","**/*.swp","**/third_party/**","**/*.enc"]
    # The check is a NEGATIVE: no line may end in space/tab. file_content_matches
    # asserts presence, so use `forbid` semantics via the absence form.
    pattern: '[ \t]+$'
    level: warning
    message: >-
      Replaces verifyNoTrailingSpaces: no line may end in U+0020 space or
      U+0009 tab. (Trailing-blank-final-line is covered by oss-baseline's
      final-newline rule.)

  # --- 3. Space after flow-control keywords (verifySpacesAfterFlowControlStatements)
  # For .java/.js/.kt/.swift/.c/.cc/.cpp/.h/.m only (Dart excluded — dart
  # format guarantees it). Forbid `if(` `for(` etc. without a space.
  - id: flutter-space-after-flow-control
    scope_filter:
      changed_since: "{{env.ALINT_BASE_REF | default('origin/master')}}"
    kind: file_content_forbidden
    paths:
      include: ["**/*.java","**/*.js","**/*.kt","**/*.c","**/*.cc","**/*.cpp",
                "**/*.h","**/*.m","**/*.swift"]
      exclude: ["**/third_party/**","engine/src/flutter/third_party/**"]
    pattern: '(^|[ \t])(if|switch|for|do|while|catch)\('
    level: warning
    message: >-
      Replaces verifySpacesAfterFlowControlStatements: native-language files
      (NOT Dart) must put a space after if/switch/for/do/while/catch. Mirrors
      analyze.dart's _flowControlStatementWithoutSpace regex exactly.

  # --- 4. flutter_tools must not self-import (verifyNoBadImportsInFlutterTools)
  # NEW (v0.10 import_gate). analyze.dart fails if any file under
  # packages/flutter_tools/lib imports `package:flutter_tools/`.
  - id: flutter-tools-no-self-import
    kind: import_gate
    language: generic
    paths:
      include: ["packages/flutter_tools/lib/**/*.dart"]
    import_pattern: "^\\s*import\\s+'([^']+)'"
    forbid: 'package:flutter_tools/.*'
    level: error
    message: >-
      Replaces verifyNoBadImportsInFlutterTools: files under
      packages/flutter_tools/lib must use relative imports, never
      `package:flutter_tools/…` self-imports.

  # --- 5. Test files must not be imported by non-test code (verifyNoTestImports)
  # NEW (v0.10 import_gate). analyze.dart forbids importing any `*_test.dart`.
  - id: flutter-no-test-imports
    kind: import_gate
    language: generic
    paths:
      include: ["packages/**/lib/**/*.dart"]
    import_pattern: "^\\s*import\\s+['\"]([^'\"]+)['\"]"
    forbid: '.*_test\\.dart'
    level: error
    message: >-
      Replaces verifyNoTestImports: production library code must never import a
      *_test.dart file.


  # ════════════════════════════════════════════════════════════════════
  # .ci.yaml SHARD REGISTRY RESOLUTION + ORDERING — v0.10 kinds.
  # Each .ci.yaml target carries a `shard:` value that MUST resolve to a
  # switch-case in dev/bots/test.dart. registry_paths_resolve cannot reach
  # into Dart source, so this stays a documented v0.11 candidate. But the
  # alphabetisation convention IS expressible:
  # ════════════════════════════════════════════════════════════════════
  # (ordered_block requires keep-sorted markers in .ci.yaml; flutter does
  #  not yet use them, so this is left as a documented opportunity, not a
  #  live rule — adding `# keep-sorted start`/`end` around each OS group's
  #  target list would let ordered_block enforce the name: alphabetisation.)

  # ════════════════════════════════════════════════════════════════════
  # STRUCTURAL PRESENCE / PARITY — carried over from baseline (still good).
  # These opt OUT of changed_since: they must always hold regardless of diff.
  # ════════════════════════════════════════════════════════════════════
  - id: flutter-create-templates-platform-coverage
    kind: dir_exists
    paths:
      - packages/flutter_tools/templates/app/android.tmpl
      - packages/flutter_tools/templates/app/ios.tmpl
      - packages/flutter_tools/templates/app/linux.tmpl
      - packages/flutter_tools/templates/app/macos.tmpl
      - packages/flutter_tools/templates/app/windows.tmpl
    level: error
    message: Every `flutter create` per-platform template must exist (platform parity).

  - id: flutter-engine-platform-has-build-gn
    kind: for_each_dir
    select: "engine/src/flutter/shell/platform/{android,linux,windows,fuchsia,glfw,embedder,common}"
    require:
      - kind: file_exists
        paths: "{path}/BUILD.gn"
    level: error
    message: Every native-platform engine subdir must declare BUILD.gn (engine GN parity).

  - id: flutter-governance-files-present
    kind: file_exists
    root_only: true
    paths:
      - PATENT_GRANT     # Google patent grant — unique to flutter among BSD repos
      - AUTHORS
      - CODEOWNERS
      - TESTOWNERS       # per-shard ownership manifest, flutter-specific
      - .ci.yaml
      - analysis_options.yaml
      - dartdoc_options.yaml
      - .gitattributes
    level: error
    message: Root governance/compliance/CI manifests required (LICENSE+PATENT_GRANT+AUTHORS triad, .ci.yaml, analyzer chain).

  - id: flutter-test-orchestrator-present
    kind: file_exists
    paths: dev/bots/test.dart
    level: error
    message: dev/bots/test.dart is the canonical CI orchestrator every .ci.yaml shard targets.

  # --- per-package pubspec discipline ---------------------------------
  - id: flutter-package-resolution-workspace
    kind: file_content_matches
    paths:
      include: ["packages/*/pubspec.yaml"]
      exclude: ["packages/flutter_goldens/pubspec.yaml","packages/flutter_tools/pubspec.yaml"]
    pattern: '(?m)^resolution:\s*workspace'
    level: warning
    message: "Per-package pubspec must declare `resolution: workspace` (root workspace coherence)."

  - id: flutter-internal-package-publish-to-none
    kind: file_content_matches
    paths: "packages/{integration_test,fuchsia_remote_debug_protocol}/pubspec.yaml"
    pattern: "(?m)^publish_to:\\s*(none|'none')"
    level: error
    message: "Internal packages must declare `publish_to: none` to prevent accidental pub.dev publish."

  - id: flutter-published-package-has-homepage
    kind: file_content_matches
    paths: "packages/{flutter,flutter_driver,flutter_localizations,flutter_test,flutter_web_plugins,flutter_tools}/pubspec.yaml"
    pattern: '(?m)^homepage:\s*https://flutter\.dev'
    level: warning
    message: "pub.dev-published packages must declare `homepage: https://flutter.dev`."

  # --- analyzer-chain soundness gates (root analysis_options.yaml) -----
  - id: flutter-analysis-options-strict-casts
    kind: file_content_matches
    paths: analysis_options.yaml
    pattern: '(?m)^\s*strict-casts:\s*true'
    level: error
    message: "Root analyzer config must keep `strict-casts: true` (Dart soundness gate)."

  - id: flutter-analysis-options-strict-inference
    kind: file_content_matches
    paths: analysis_options.yaml
    pattern: '(?m)^\s*strict-inference:\s*true'
    level: error
    message: "Root analyzer config must keep `strict-inference: true`."

  - id: flutter-analysis-options-strict-raw-types
    kind: file_content_matches
    paths: analysis_options.yaml
    pattern: '(?m)^\s*strict-raw-types:\s*true'
    level: error
    message: "Root analyzer config must keep `strict-raw-types: true`."

  # --- .gitattributes EOL discipline ----------------------------------
  - id: flutter-gitattributes-windows-crlf-pin
    kind: file_content_matches
    paths: .gitattributes
    pattern: '(?m)^\*\.bat\s+text\s+eol=crlf'
    level: warning
    message: .gitattributes must pin *.bat to CRLF (Windows build correctness).

  # ════════════════════════════════════════════════════════════════════
  # TOOL WRAPPERS — drive the non-replaceable bespoke tools from one run.
  # command_idempotent (NEW v0.10): runs a checker in --check mode and, with
  # files_from: stdout + files_pattern, COLLAPSES per-file offenders into
  # per-file alint violations — the big win across flutter's 1000s of files.
  # ════════════════════════════════════════════════════════════════════

  # dart format --set-exit-if-changed prints each unformatted path; parse them.
  - id: flutter-dart-format-check
    kind: command_idempotent
    paths: analysis_options.yaml
    command: ["dart","format","--output=none","--set-exit-if-changed","."]
    files_from: stdout
    files_pattern: 'Changed (.+)'
    timeout: 600
    level: warning
    message: NEW per-file collapse — dart format offenders become one violation each.

  # The Dart-AST passes that alint CANNOT reimplement; wrapped to fire in one run:
  - id: flutter-dart-analyze
    kind: command
    paths: analysis_options.yaml
    command: ["dart","analyze"]
    timeout: 900
    level: error

  - id: flutter-bots-analyze-dart   # the 6 custom_rules + AST checks that stay bespoke
    kind: command
    paths: dev/bots/analyze.dart
    command: ["dart","--enable-asserts","dev/bots/analyze.dart"]
    timeout: 1200
    level: error
    message: Wraps the AST-dependent remainder of analyze.dart (custom_rules, deprecation pairing, golden tags).

  - id: flutter-engine-format-sh
    kind: command
    paths: engine/src/flutter/ci/format.sh
    command: ["bash","engine/src/flutter/ci/format.sh"]
    timeout: 600
    level: warning

  - id: flutter-engine-clang-tidy
    kind: command
    paths: engine/src/flutter/ci/clang_tidy.sh
    command: ["bash","engine/src/flutter/ci/clang_tidy.sh"]
    timeout: 1800
    level: warning

  - id: flutter-engine-pylint
    kind: command
    paths: engine/src/flutter/ci/pylint.sh
    command: ["bash","engine/src/flutter/ci/pylint.sh"]
    timeout: 300
    level: warning

  - id: flutter-engine-licenses-cpp
    kind: command
    paths: engine/src/flutter/ci/licenses_cpp.sh
    command: ["bash","engine/src/flutter/ci/licenses_cpp.sh"]
    timeout: 600
    level: warning
