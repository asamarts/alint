# yaml-language-server: $schema=https://raw.githubusercontent.com/asamarts/alint/main/schemas/v1/config.json
#
# Proposed alint config for astral-sh/uv — v0.10/v0.11 re-analysis.
#
# Supersedes examples/astral-sh-uv/.alint.yml (written v0.9.17-era, which
# parked codegen-freshness, cross-lockfile equality, and crate layering as
# "alint-future"). All four of those have since shipped. This config moves
# them from prose-in-the-README to live rules:
#
#   NEWLY UNLOCKED since v0.10/v0.11:
#     - generated_file_fresh  -> check-generated-files.yml (cargo dev generate-*)
#     - cross_file_value_equals -> check-trampoline-version-consistency.py
#     - import_gate           -> clippy.toml disallowed-methods (std::fs firewall)
#     - command_idempotent    -> ruff --fix / cargo fmt run-then-diff semantics
#     - registry_paths_resolve-> ruff.toml exclude[] paths actually exist
#     - {{env.X}} interpolation -> tool-version pins shared with CI
#     - git_* (v0.11)         -> contributor commit hygiene
#
# Adopt by saving as .alint.yml at the repo root and running `alint check`.

version: 1

extends:
  - alint://bundled/oss-baseline@v1
  - alint://bundled/rust@v1
  - alint://bundled/python@v1
  - alint://bundled/monorepo@v1
  - alint://bundled/monorepo/cargo-workspace@v1
  - alint://bundled/ci/github-actions@v1
  - alint://bundled/hygiene/no-tracked-artifacts@v1
  - alint://bundled/tooling/editorconfig@v1

rules:
  # ════════════════════════════════════════════════════════════════════
  # NEW (v0.10): codegen freshness — replaces check-generated-files.yml
  # ════════════════════════════════════════════════════════════════════
  # check-generated-files.yml runs `cargo dev generate-all --mode dry-run`
  # plus per-target `--mode check`. Each generator writes a tracked file
  # under docs/reference/ or uv.schema.json at root. generated_file_fresh
  # runs the *real* generator (non-mutating: captures stdout) and diffs it
  # against the committed file — exactly the dry-run contract, but as one
  # declarative rule per artifact instead of a bespoke `--mode` plumbing
  # threaded through five Rust generator modules.
  #
  # These four generators each support `--mode dry-run` writing to stdout.
  # generated_file_fresh shells out, so it lives in SPAWNING_RULE_KINDS and
  # is only trusted from a first-party config (not an untrusted extends:).
  - id: uv-codegen-json-schema-fresh
    kind: generated_file_fresh
    file: uv.schema.json
    command: ["cargo", "dev", "generate-json-schema", "--mode", "dry-run"]
    workdir: "."
    timeout: 300
    level: error
    message: "{{ctx.file}} is stale — run `cargo dev generate-json-schema` and commit."

  - id: uv-codegen-cli-reference-fresh
    kind: generated_file_fresh
    file: docs/reference/cli.md
    command: ["cargo", "dev", "generate-cli-reference", "--mode", "dry-run"]
    workdir: "."
    timeout: 300
    level: error
    message: "{{ctx.file}} is stale — run `cargo dev generate-all` and commit."

  - id: uv-codegen-settings-reference-fresh
    kind: generated_file_fresh
    file: docs/reference/settings.md
    command: ["cargo", "dev", "generate-options-reference", "--mode", "dry-run"]
    workdir: "."
    timeout: 300
    level: error
    message: "{{ctx.file}} is stale — run `cargo dev generate-all` and commit."

  - id: uv-codegen-env-vars-reference-fresh
    kind: generated_file_fresh
    file: docs/reference/environment.md
    command: ["cargo", "dev", "generate-env-vars-reference", "--mode", "dry-run"]
    workdir: "."
    timeout: 300
    level: error
    message: "{{ctx.file}} is stale — run `cargo dev generate-all` and commit."

  # ════════════════════════════════════════════════════════════════════
  # NEW (v0.10): cross-file equality — replaces
  # scripts/check-trampoline-version-consistency.py
  # ════════════════════════════════════════════════════════════════════
  # uv-trampoline is excluded from the main workspace (needs nightly) and
  # carries its own Cargo.lock. The `windows` crate version must match
  # between the two lockfiles. The bespoke 50-line Python script parsed
  # both TOMLs and compared the `windows` package's `version`. cross_file_-
  # value_equals does this declaratively: pull the value at `path` from
  # `source` and every `targets`, assert all equal.
  #
  # Lockfile shape: [[package]] array; we want the entry where name ==
  # "windows". TOML JSONPath supports a filter on the array. If the engine's
  # filter support is too narrow for `?(@.name=='windows')`, this is the one
  # rule that may still need the Python script — noted in the gap section.
  - id: uv-trampoline-windows-version-consistent
    kind: cross_file
    source:
      file: Cargo.lock
      extract: { toml: "$.package[?(@.name=='windows')].version" }
    targets:
      - file: crates/uv-trampoline/Cargo.lock
        extract: { toml: "$.package[?(@.name=='windows')].version" }
    normalize: trim
    level: error
    message: |
      The `windows` crate version must match between the workspace
      `Cargo.lock` and `crates/uv-trampoline/Cargo.lock` (uv-trampoline is
      workspace-excluded). Re-lock both so they agree.

  # ════════════════════════════════════════════════════════════════════
  # NEW (v0.10): crate-layering firewall — encodes clippy.toml
  # disallowed-methods as an import-level rule
  # ════════════════════════════════════════════════════════════════════
  # clippy.toml bans direct std::fs / tokio::fs use (uv funnels all IO
  # through fs-err for better error messages). clippy enforces this at the
  # call site; import_gate enforces it one layer earlier at the `use`
  # statement, giving a faster, compile-free signal and catching the
  # `use std::fs;` form before it becomes a banned call. The `rust` preset
  # extracts the import target from `use ...;`; forbid matches that target.
  # uv-fs and uv-dev legitimately wrap std::fs, so they are excluded.
  - id: uv-no-direct-std-fs-imports
    kind: import_gate
    paths: "crates/uv-*/src/**/*.rs"
    language: rust
    forbid: '^(std|tokio)::fs(::|$)'        # matched on the extracted use-target
    allow:
      - 'crates/uv-fs/**'
      - 'crates/uv-dev/**'
      - 'crates/uv-trampoline/**'
    level: warning
    message: |
      Don't import `std::fs` / `tokio::fs` directly — route filesystem
      access through the `fs-err` wrappers (see clippy.toml
      disallowed-methods). This is the import-level mirror of the clippy
      gate; uv-fs is the sanctioned wrapper crate.

  # ════════════════════════════════════════════════════════════════════
  # NEW (v0.10): registry_paths_resolve — ruff.toml exclude[] are real
  # ════════════════════════════════════════════════════════════════════
  # ruff.toml lists exclude paths (vendored Python, test trees). Stale
  # entries silently widen the lint surface as files are moved/renamed.
  # registry_paths_resolve reads the list and asserts each path exists.
  - id: uv-ruff-exclude-paths-resolve
    kind: registry_paths_resolve
    source: ruff.toml
    extract:
      toml: "$.exclude[*]"
    expect: file
    level: warning
    message: |
      A path in `ruff.toml`'s `exclude` list no longer exists. Drop the
      stale entry or fix the path so the lint-exclusion set stays honest.

  # ════════════════════════════════════════════════════════════════════
  # Per-crate Cargo.toml conventions (carried forward, unchanged shape)
  # ════════════════════════════════════════════════════════════════════
  - id: uv-crate-inherits-workspace-lints
    kind: for_each_dir
    select: "crates/uv-*"
    when_iter: 'iter.has_file("Cargo.toml")'
    require:
      - kind: file_content_matches
        paths: "{path}/Cargo.toml"
        pattern: '(?m)^\[lints\]\s+workspace\s*=\s*true'
    level: warning
    message: |
      Every crate in `crates/uv-*` should opt into `[workspace.lints]`
      with `[lints]` + `workspace = true`. uv-trampoline and
      uv-performance-memory-allocator are documented exceptions.

  - id: uv-crate-edition-from-workspace
    kind: for_each_dir
    select: "crates/uv-*"
    when_iter: 'iter.has_file("Cargo.toml")'
    require:
      - kind: file_content_matches
        paths: "{path}/Cargo.toml"
        pattern: '(?m)^edition(\.workspace\s*=\s*true|\s*=\s*\{\s*workspace\s*=\s*true\s*\})'
    level: warning
    message: |
      Workspace members should inherit `edition` from the workspace.

  - id: uv-crate-license-from-workspace
    kind: for_each_dir
    select: "crates/uv-*"
    when_iter: 'iter.has_file("Cargo.toml")'
    require:
      - kind: file_content_matches
        paths: "{path}/Cargo.toml"
        pattern: '(?m)^license(\.workspace\s*=\s*true|\s*=\s*\{\s*workspace\s*=\s*true\s*\})'
    level: warning
    message: |
      Workspace members should inherit `license` from the workspace.
      uv-pep440/uv-pep508 (Apache-2.0 OR BSD-2-Clause) are exceptions.

  - id: uv-crate-has-readme
    kind: for_each_dir
    select: "crates/uv-*"
    when_iter: 'iter.has_file("Cargo.toml")'
    require:
      - kind: file_exists
        paths: "{path}/README.md"
    level: warning
    message: |
      Every crate under `crates/uv-*` should ship a README.md
      (auto-generated by scripts/generate-crate-readmes.py).

  # ════════════════════════════════════════════════════════════════════
  # Workspace + root manifest shape (structured queries — carried forward)
  # ════════════════════════════════════════════════════════════════════
  - id: uv-workspace-resolver-declared
    kind: toml_path_matches
    paths: Cargo.toml
    path: "$.workspace.resolver"
    matches: '^[23]$'
    level: error
    message: 'Workspace must declare `resolver = "2"` (or "3").'

  - id: uv-workspace-package-edition
    kind: toml_path_matches
    paths: Cargo.toml
    path: "$.workspace.package.edition"
    matches: '^(2021|2024)$'
    level: error
    message: '`[workspace.package] edition` must be 2021 or 2024.'

  - id: uv-workspace-rust-version-pinned
    kind: toml_path_matches
    paths: Cargo.toml
    path: "$.workspace.package['rust-version']"
    matches: '^[0-9]+\.[0-9]+(\.[0-9]+)?$'
    level: warning
    message: 'Pin `[workspace.package] rust-version` to a specific MSRV.'

  # rustfmt.toml pins edition = "2024"; keep it aligned with the workspace.
  - id: uv-rustfmt-edition-2024
    kind: toml_path_equals
    paths: rustfmt.toml
    path: "$.edition"
    equals: "2024"
    level: warning
    message: '`rustfmt.toml` should pin `edition = "2024"` to match the workspace.'

  - id: uv-rust-toolchain-pinned
    kind: toml_path_matches
    paths: rust-toolchain.toml
    path: "$.toolchain.channel"
    matches: '^[0-9]+\.[0-9]+(\.[0-9]+)?$'
    level: warning
    message: '`rust-toolchain.toml` should pin `channel` to a specific version.'

  # ════════════════════════════════════════════════════════════════════
  # pyproject.toml shape (maturin) — carried forward
  # ════════════════════════════════════════════════════════════════════
  - id: uv-pyproject-build-backend-maturin
    kind: toml_path_equals
    paths: pyproject.toml
    path: "$['build-system']['build-backend']"
    equals: maturin
    level: error
    message: '`pyproject.toml` must declare `build-backend = "maturin"`.'

  - id: uv-pyproject-license-files-listed
    kind: toml_path_matches
    paths: pyproject.toml
    path: "$.project['license-files'][*]"
    matches: '^LICENSE-(APACHE|MIT)$'
    level: warning
    message: 'List both LICENSE-APACHE and LICENSE-MIT in `license-files`.'

  # ruff.toml target-version must agree with the maturin/py floor.
  - id: uv-ruff-target-version-pinned
    kind: toml_path_matches
    paths: ruff.toml
    path: "$['target-version']"
    matches: '^py3[0-9]+$'
    level: info
    message: '`ruff.toml` should pin a concrete `target-version` (e.g. py312).'

  # ════════════════════════════════════════════════════════════════════
  # Dual license at root (stricter than oss-baseline's "either")
  # ════════════════════════════════════════════════════════════════════
  - id: uv-license-apache-exists
    kind: file_exists
    paths: LICENSE-APACHE
    root_only: true
    level: error
    message: 'uv is dual-licensed; LICENSE-APACHE must exist at the root.'

  - id: uv-license-mit-exists
    kind: file_exists
    paths: LICENSE-MIT
    root_only: true
    level: error
    message: 'uv is dual-licensed; LICENSE-MIT must exist at the root.'

  # ════════════════════════════════════════════════════════════════════
  # NEW (v0.11): {{env.X}} interpolation — pin the shellout tool versions
  # to the same value CI installs, so local + CI agree on the linter.
  # Export e.g. UV_RUFF_VERSION before `alint check`, or let CI inject it.
  # (default('latest') filter keeps it valid when the env var is unset.)
  # ════════════════════════════════════════════════════════════════════

  # ── ruff: check + format via command_idempotent (NEW v0.10) ───────────
  # The existing config used `command:` with `ruff format --check`. The
  # pre-commit hook actually runs `ruff --fix` and `ruff-format` (mutating).
  # command_idempotent expresses the real contract: run the tool in its
  # check/--diff mode and report any file it *would* change as a per-file
  # violation (via files_from parsing the offender list), rather than a
  # single opaque pass/fail. This matches `ruff check` / `ruff format
  # --diff` far more faithfully than a plain command shellout.
  - id: uv-ruff-check
    kind: command_idempotent
    paths: "ruff.toml"                          # one repo-wide invocation
    command: ["uvx", "ruff@{{env.UV_RUFF_VERSION | default('latest')}}", "check", "."]
    files_from: stdout
    files_pattern: '^([^\s:]+):\d+:\d+'         # ruff's `path:line:col` offender form
    timeout: 120
    level: warning
    message: |
      `ruff check` flags this file. Run `uvx ruff check --fix .` and commit.
      Pin UV_RUFF_VERSION to CI's ruff-pre-commit rev.

  - id: uv-ruff-format
    kind: command_idempotent
    paths: "ruff.toml"
    command: ["uvx", "ruff@{{env.UV_RUFF_VERSION | default('latest')}}", "format", "--check", "."]
    files_from: stdout
    files_pattern: '^Would reformat: (.+)$'     # ruff's offender form
    timeout: 120
    level: warning
    message: '`ruff format` would reformat this file. Run `uvx ruff format .`.'

  # ── cargo fmt via command_idempotent (NEW v0.10) ──────────────────────
  - id: uv-cargo-fmt
    kind: command_idempotent
    paths: "Cargo.toml"
    command: ["cargo", "fmt", "--all", "--", "--check"]
    files_from: stdout
    files_pattern: "Diff in (.+) at"            # rustfmt's offender form
    timeout: 120
    level: warning
    message: '`cargo fmt --all` would reformat this file. Run it and commit.'

  # ── prettier (yaml/json5) via command_idempotent (NEW v0.10) ──────────
  - id: uv-prettier-check
    kind: command_idempotent
    paths: "Cargo.toml"
    command: ["npx", "prettier", "--check", "."]
    files_from: stderr
    files_pattern: '^\[warn\] (.+)$'            # prettier's `[warn] <path>` offender form
    timeout: 120
    level: warning
    message: '`prettier --check` reports formatting drift. Run `prettier --write .`.'

  # ── typos / cargo-shear / clippy: classic per-tree command shellouts ──
  - id: uv-typos
    kind: command
    paths: _typos.toml
    command: ["typos"]
    timeout: 120
    level: warning

  - id: uv-cargo-shear
    kind: command
    paths: Cargo.toml
    command: ["cargo", "shear", "--deny-warnings"]
    timeout: 120
    level: warning

  - id: uv-shellcheck
    kind: command
    paths: "**/*.sh"
    command: ["shellcheck", "--shell", "bash", "--severity", "style", "{path}"]
    timeout: 30
    level: warning

  - id: uv-cargo-clippy
    kind: command
    paths: Cargo.toml
    command:
      - "cargo"
      - "clippy"
      - "--workspace"
      - "--all-targets"
      - "--all-features"
      - "--locked"
      - "--"
      - "-D"
      - "warnings"
    timeout: 600
    level: warning

  # ── validate-pyproject (PEP 621 schema) via command shellout ──────────
  # Was "alint-future" pending python/pep-621-shape@v1. Until that bundled
  # ruleset ships, orchestrate the canonical tool (matches CI exactly).
  - id: uv-validate-pyproject
    kind: command
    paths: pyproject.toml
    command:
      - "uvx"
      - "--from"
      - "validate-pyproject[all,store]"
      - "validate-pyproject"
      - "{path}"
    timeout: 60
    level: warning

  # ════════════════════════════════════════════════════════════════════
  # NEW (v0.11): contributor commit hygiene — gates only changed history.
  # scope_filter.changed_since keeps these fast on big PRs and silent on
  # the existing history.
  # ════════════════════════════════════════════════════════════════════
  - id: uv-no-fixup-commits
    kind: git_commit_no_fixup
    scope_filter:
      changed_since: origin/main
    level: error
    message: |
      Squash `fixup!` / `squash!` commits before merge.

  - id: uv-commits-gpg-signed
    kind: git_commit_gpg_signed
    scope_filter:
      changed_since: origin/main
    level: warning
    message: |
      New commits should be GPG-signed (matches astral-sh's signed-commit
      policy). Configure `git config commit.gpgsign true`.
