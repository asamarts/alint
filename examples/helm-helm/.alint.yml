# yaml-language-server: $schema=https://raw.githubusercontent.com/asamarts/alint/main/schemas/v1/config.json
#
# alint config for helm/helm — re-authored against alint v0.11.
#
# helm is a single-production-module Go monorepo (module helm.sh/helm/v4,
# go 1.26; 535 non-testdata .go files). A second go.mod under
# internal/plugin/testdata/src/extismv1-test is a FIXTURE, not a build target.
#
# helm is a CNCF project: it REQUIRES DCO sign-off on every commit (the
# "automated DCO check" in CONTRIBUTING.md). It is Apache-2.0 licensed and
# enforces a four-line Apache header on every .go/.sh via
# scripts/validate-license.sh.
#
# WHAT'S NEW vs the v0.9.17 baseline (examples/helm-helm/.alint.yml):
#   + git_commit_signed_off          — DCO check (was NOT representable at all)
#   + command_idempotent             — gofmt + golangci-lint + go-mod-tidy
#                                       collapse into checker-in-check-mode rules
#                                       that parse offenders into per-file
#                                       violations (was crude `command` shellouts)
#   + import_gate (preset go)        — depguard/gomodguard import firewall
#                                       (was a documented GAP, left to golangci)
#   + cross_file_value_equals        — .github/env GO version vs go.mod (was two
#                                       hardcoded regexes with no real cross-ref)
#   + ordered_block                  — .golangci.yml "Keep sorted alphabetically"
#                                       linter/settings lists (was unenforceable)
#
# Adopt: save as .alint.yml at the repo root, run `alint check`.

version: 1

extends:
  - alint://bundled/oss-baseline@v1
  - alint://bundled/go@v1
  - alint://bundled/ci/github-actions@v1
  - alint://bundled/hygiene/no-tracked-artifacts@v1
  # NOTE on compliance/apache-2@v1: helm IS Apache-2.0, BUT the bundle's
  # RAT-style per-file source-header check uses the canonical ASF header
  # ("Licensed under the Apache License ... obtain a copy ... distributed on
  # an AS IS BASIS"). helm uses a SHORTER, helm-branded variant
  # ("Copyright The Helm Authors." + only the first "Licensed under..." line is
  # what scripts/validate-license.sh actually greps for) and tolerates three
  # comment shapes (/* */, no-blank, // line-style). The apache-2 bundle would
  # OVER-FIRE on the ~535 helm files that use the abbreviated header and on
  # line-comment-style files. We therefore do NOT extend apache-2@v1 and keep
  # the bespoke header rules below (mirroring validate-license.sh exactly). The
  # LICENSE/NOTICE-existence half of apache-2@v1 IS satisfied by oss-baseline.

rules:
  # ═══════════════════════════════════════════════════════════════════
  # DCO sign-off — CONTRIBUTING.md / "automated DCO check"  [NEW v0.11]
  # ═══════════════════════════════════════════════════════════════════
  # helm rejects any PR whose commits lack a `Signed-off-by:` trailer whose
  # name/email match the Author. This is the single biggest NEW win: in the
  # v0.9.17 era there was no way to express it at all — it lived only in the
  # GitHub DCO app. git_commit_signed_off reproduces it locally/in CI.
  - id: helm-dco-signoff
    kind: git_commit_signed_off
    # Only check commits unique to this branch, not all of history.
    scope_filter:
      changed_since: "{{env.ALINT_BASE_REF | default('origin/main')}}"
    level: error
    message: >-
      Every commit must carry a `Signed-off-by:` trailer matching the author
      (DCO). Use `git commit -s`. See CONTRIBUTING.md; helm's automated DCO
      check rejects PRs without it.

  # ═══════════════════════════════════════════════════════════════════
  # scripts/validate-license.sh — Apache header sweep
  # ═══════════════════════════════════════════════════════════════════
  # The script greps every *.go / *.sh (excluding testdata + third_party) for
  # two literals separately: 'Copyright The Helm Authors.' and
  # 'Licensed under the Apache License, Version 2.0 (the "License")'.
  # file_header with a tolerant (?s) span reproduces all three comment shapes.
  - id: helm-go-license-header
    kind: file_header
    paths:
      include: ["**/*.go"]
      exclude:
        - "**/testdata/**"
        - "internal/third_party/**"
    scope_filter:
      has_ancestor: go.mod
    pattern: '(?s)\A.{0,400}?Copyright The Helm Authors\..{0,400}?Licensed under the Apache License, Version 2\.0 \(the "License"\);'
    level: error
    message: >-
      Every Go source file must start with the Helm Apache-2.0 header
      (see scripts/validate-license.sh).

  - id: helm-shell-license-header
    kind: file_header
    paths:
      include: ["**/*.sh"]
      exclude:
        - "**/testdata/**"
        - "internal/third_party/**"
    pattern: |-
      ^#!/usr/bin/env bash

      # Copyright The Helm Authors\.
      #
      # Licensed under the Apache License, Version 2\.0 \(the "License"\);
    level: error
    message: >-
      Every shell script must start with the Helm Apache-2.0 header
      (after the shebang). See scripts/validate-license.sh.

  # ═══════════════════════════════════════════════════════════════════
  # gofmt clean — Makefile `format` / .golangci.yml gofmt formatter
  # ═══════════════════════════════════════════════════════════════════
  # [UPGRADE] Was a `command: [gofmt, -l, {path}]` per-file shellout. Now one
  # single-shot command_idempotent: gofmt -l lists offenders on stdout; the
  # files_from/files_pattern parser turns each offender path into a per-file
  # violation. One process for the whole module instead of 535 spawns.
  - id: helm-gofmt-clean
    kind: command_idempotent
    command: ["gofmt", "-l", "."]
    files_from: stdout
    files_pattern: '^(?P<file>.+\.go)$'
    timeout: 60
    level: error
    message: >-
      File is not gofmt-clean. Run `gofmt -w` (or `make format`).

  # ═══════════════════════════════════════════════════════════════════
  # golangci-lint — Makefile `test-style` / golangci-lint.yml
  # ═══════════════════════════════════════════════════════════════════
  # [UPGRADE] Was for_each_dir -> command. Now command_idempotent so the
  # offender list golangci-lint prints maps onto per-file violations. The
  # DEEP semantic Go checks (revive, staticcheck, govet, modernize, etc.)
  # are NOT replaceable — this rule just RUNS golangci-lint and surfaces it
  # through alint; it does not reimplement those linters.
  - id: helm-golangci-lint
    kind: command_idempotent
    command: ["golangci-lint", "run", "--out-format=line-number", "./..."]
    files_from: stdout
    files_pattern: '^(?P<file>[^:]+\.go):'
    timeout: 600
    level: error
    message: >-
      golangci-lint reported issues. Run `make test-style` / fix the linter
      findings.

  # ═══════════════════════════════════════════════════════════════════
  # depguard + gomodguard import firewall — .golangci.yml  [NEW v0.10]
  # ═══════════════════════════════════════════════════════════════════
  # Was a documented GAP in the v0.9.17 config ("needs import_gate"). The
  # `go` preset extracts the import path; forbid/allow match it. This makes
  # the two banned-import rules first-class alint rules instead of buried
  # golangci settings — they now fire even on a docs-only golangci skip.
  - id: helm-import-firewall
    kind: import_gate
    language: go
    paths:
      include: ["**/*.go"]
      exclude:
        - "**/testdata/**"
        - "internal/third_party/**"
    # depguard: use stdlib errors; gomodguard: json-patch v1 banned (v5 ok)
    forbid: '^(github\.com/hashicorp/go-multierror|github\.com/pkg/errors|github\.com/evanphx/json-patch)$'
    level: error
    message: >-
      Forbidden import. Use the standard `errors` package instead of
      go-multierror/pkg-errors, and json-patch/v5 instead of json-patch v1.
      (Mirrors .golangci.yml depguard + gomodguard.)

  # ═══════════════════════════════════════════════════════════════════
  # go.mod / go.sum tidy — build-test.yml `go mod tidy -diff`
  # ═══════════════════════════════════════════════════════════════════
  # [UPGRADE] command_idempotent in --check mode (tidy -diff is read-only and
  # exits non-zero on drift). No per-file parsing; whole-module gate.
  - id: helm-go-mod-tidy
    kind: command_idempotent
    command: ["go", "mod", "tidy", "-diff"]
    timeout: 120
    level: error
    message: >-
      go.mod / go.sum are out of sync. Run `make tidy` and commit the diff.

  # ═══════════════════════════════════════════════════════════════════
  # govulncheck — govulncheck.yml
  # ═══════════════════════════════════════════════════════════════════
  - id: helm-govulncheck
    kind: command_idempotent
    command: ["govulncheck", "./..."]
    timeout: 300
    level: warning
    message: >-
      govulncheck reports a known Go vulnerability. See https://go.dev/security/vuln/.

  # ═══════════════════════════════════════════════════════════════════
  # .github/env GO version  ==  go.mod `go` directive  [NEW v0.10]
  # ═══════════════════════════════════════════════════════════════════
  # Was two unconnected hardcoded regexes. cross_file_value_equals makes it a
  # real cross-file invariant: the GOLANG_VERSION major.minor in .github/env
  # must be a prefix-equal to go.mod's `go 1.26.0`. helm pins go.mod at the
  # patch level (1.26.0) and .github/env at minor (1.26); we compare the
  # minor-level slice to avoid a false drift.
  - id: helm-go-version-sync
    kind: cross_file
    source:
      file: ".github/env"
      extract:
        regex: '(?m)^GOLANG_VERSION=(?P<value>\d+\.\d+)'
    targets:
      - file: "go.mod"
        extract:
          regex: '(?m)^go (?P<value>\d+\.\d+)'
    level: warning
    message: >-
      .github/env GOLANG_VERSION must match go.mod's `go` directive (major.minor).
      The CI workflows source .github/env via `cat .github/env >> $GITHUB_ENV`.

  - id: helm-github-env-pins-golangci-lint-version
    kind: file_content_matches
    paths: ".github/env"
    pattern: '(?m)^GOLANGCI_LINT_VERSION=v\d+\.\d+\.\d+'
    level: warning
    message: >-
      .github/env must pin GOLANGCI_LINT_VERSION=v<x.y.z>; `make test-style`
      diff-checks the locally installed golangci-lint against it.

  # ═══════════════════════════════════════════════════════════════════
  # .golangci.yml "Keep sorted alphabetically" lists  [NEW v0.10]
  # ═══════════════════════════════════════════════════════════════════
  # The config has explicit "# Keep sorted alphabetically" comments above
  # linters.enable and linters.settings. ordered_block enforces that the
  # enumerated linter names stay sorted — previously unrepresentable.
  - id: helm-golangci-linters-sorted
    kind: ordered_block
    paths: ".golangci.yml"
    # `ordered_block` markers are literal lines, not regular expressions.
    start: "enable:"
    end: "exclusions:"
    level: warning
    message: >-
      The .golangci.yml linters.enable list must stay sorted alphabetically
      (the file says so). Re-sort the entries.

  # .golangci.yml formatters block shape — keep goimports local-prefixes pinned
  - id: helm-golangci-config-has-local-prefix
    kind: yaml_path_equals
    paths: ".golangci.yml"
    path: "$.formatters.settings.goimports['local-prefixes'][0]"
    equals: "helm.sh/helm/v4"
    level: warning
    message: >-
      .golangci.yml must pin formatters.settings.goimports.local-prefixes[0] to
      "helm.sh/helm/v4" so internal imports group separately.

  # ═══════════════════════════════════════════════════════════════════
  # OWNERS (CNCF / Kubernetes convention)
  # ═══════════════════════════════════════════════════════════════════
  - id: helm-owners-file-exists
    kind: file_exists
    paths: "OWNERS"
    root_only: true
    level: warning
    message: "Top-level OWNERS file is required for the CNCF maintainer-routing convention."

  - id: helm-owners-has-maintainers
    kind: yaml_path_matches
    paths: "OWNERS"
    path: "$.maintainers[0]"
    matches: '^[A-Za-z0-9_-]+$'
    level: error
    message: >-
      OWNERS.maintainers must be a non-empty list of GitHub usernames.

  # ═══════════════════════════════════════════════════════════════════
  # .goreleaser.yaml structural shape — release.yml `make build-cross`
  # ═══════════════════════════════════════════════════════════════════
  - id: helm-goreleaser-cgo-disabled
    kind: yaml_path_matches
    paths: ".goreleaser.yaml"
    path: "$.builds[0].env[*]"
    matches: '^CGO_ENABLED=0$'
    level: error
    message: >-
      .goreleaser.yaml must set CGO_ENABLED=0 — helm release binaries are static.

  - id: helm-goreleaser-dist-underscored
    kind: yaml_path_equals
    paths: ".goreleaser.yaml"
    path: "$.dist"
    equals: "_dist"
    level: warning
    message: >-
      .goreleaser.yaml `dist:` should remain `_dist` so .gitignore catches
      build artefacts.

  # ═══════════════════════════════════════════════════════════════════
  # Top-level project assets
  # ═══════════════════════════════════════════════════════════════════
  - id: helm-adopters-exists
    kind: file_exists
    paths: "ADOPTERS.md"
    root_only: true
    level: info
    message: "ADOPTERS.md is the canonical user list; keep it at the root."

  - id: helm-agents-md-exists
    kind: file_exists
    paths: "AGENTS.md"
    root_only: true
    level: info
    message: "AGENTS.md gives AI agents the codebase tour; keep it at the root."

  - id: helm-keys-file-exists
    kind: file_exists
    paths: "KEYS"
    root_only: true
    level: info
    message: >-
      KEYS is the GPG keyring users verify signed releases against
      (Makefile `sign` target). Keep it at the root.

  - id: helm-code-of-conduct-points-to-cncf
    kind: file_content_matches
    paths: "code-of-conduct.md"
    # FIX vs baseline: helm now points to cncf/foundation, NOT kubernetes/community.
    pattern: 'cncf/foundation.*code-of-conduct'
    level: info
    message: >-
      code-of-conduct.md should redirect to the upstream CNCF Code of Conduct.

  # ═══════════════════════════════════════════════════════════════════
  # Hygiene: no committed release artefacts (.gitignore: _dist, _dist_versions)
  # ═══════════════════════════════════════════════════════════════════
  - id: helm-no-tracked-dist
    kind: dir_absent
    paths: ["_dist", "_dist_versions"]
    level: error
    message: >-
      _dist/ and _dist_versions/ are release artefacts and must not be committed.

  # ═══════════════════════════════════════════════════════════════════
  # Per-package test convention
  # ═══════════════════════════════════════════════════════════════════
  - id: helm-package-has-tests
    kind: for_each_dir
    select: "pkg/*/"
    when_iter: 'iter.has_file("*.go") and iter.is_dir'
    require:
      - kind: file_exists
        paths: "{path}/*_test.go"
    level: warning
    message: >-
      Every pkg/*/ package should carry at least one *_test.go file.

  # ───────────────────────────────────────────────────────────────────
  # NON-REPLACEABLE — kept on `make`, documented here for completeness:
  #
  #  * go vet / staticcheck / revive / modernize / testifylint / sloglint /
  #    perfsprint / usestdlibvars / usetesting / nakedret / thelper / dupl /
  #    exhaustive / ineffassign / unused / nolintlint  — Go-AST semantic
  #    analysis; alint runs golangci-lint (above) but does NOT reimplement them.
  #  * `make test-unit` / `test-coverage` (go test -race)  — test execution,
  #    out of scope for a structural linter.
  #  * `make gen-test-golden` freshness (go test -update writes golden files)
  #    — this is MUTATING (it overwrites testdata golden files in place), so it
  #    does NOT fit generated_file_fresh (which is stdout-diff / non-mutating
  #    only). A clean fit would need a "regen-and-diff-working-tree" primitive
  #    — see NEW-RULE-KIND candidate below.
  #  * goimports auto-fix (`make format`)  — mutating; gofmt -l above is the
  #    read-only proxy. goimports local-prefix grouping isn't separately
  #    surfaceable as offenders without running goimports -l (covered via
  #    golangci goimports formatter).
  #  * CodeQL / Scorecards / azure-blob upload / GPG release signing  — external
  #    services & secrets; not repo-structural.
  #
  # NEW-RULE-KIND candidates surfaced by this repo:
  #  1. `generated_file_fresh` variant that diffs the WORKING TREE after running
  #     a mutating generator (helm's `go test -update` golden files) — current
  #     kind is stdout-only.
  #  2. `*_path_contains` (set-membership) so .golangci.yml formatters.enable
  #     [gofmt, goimports] membership is one rule each instead of yaml_path_equals
  #     awkwardness on an array.
  #  3. `git_pr_template_present` / issue-template shape check (.github/ has a
  #     PR template + ISSUE_TEMPLATE dir helm relies on).
