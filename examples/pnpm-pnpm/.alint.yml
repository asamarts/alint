# yaml-language-server: $schema=https://raw.githubusercontent.com/asamarts/alint/main/schemas/v1/config.json
#
# Proposed alint config for pnpm/pnpm — re-analysis on the v0.10/v0.11
# capability set (the prior example targeted v0.9.17).
#
# WHAT CHANGED IN THE REPO SINCE THE v0.9.17 EXAMPLE
# --------------------------------------------------
# The repo grew a full RUST half: `pacquet/` (Rust rewrite, crates under
# pacquet/crates/*) + `registry/crates/*`, a `Cargo.toml` workspace,
# `Cargo.lock`, `deny.toml` (cargo-deny), `rustfmt.toml`, `.taplo.toml`
# (TOML fmt), `dylint.toml`, `.typos.toml`, `rust-toolchain.toml`, a
# `justfile` task runner, and a SECOND hook chain at `pacquet/.githooks/`
# (cargo fmt + taplo --check on pre-push, distinct from the root `.husky/`
# chain). devEngines now pins node 26 + pnpm 11.3.0. This makes the repo a
# genuine polyglot (TS workspace + Rust workspace) — a strong alint fit.
#
# WHAT alint CAN NOW DO THAT IT COULDN'T AT v0.9.17 (the new wins):
#   - registry_paths_resolve: resolve every pnpm-workspace.yaml `packages:`
#     glob to a real dir (NEW; previously the workspace manifest was only
#     pattern-matched, never resolved). Catches a stale glob / deleted dir.
#   - cross_file_value_equals: the meta-updater SYNC invariants that the old
#     config explicitly listed as "needs a primitive that doesn't ship"
#     (every package engines.node == workspace nodeVersion; commitlint dep
#     pinned in catalog == the version commitlint extends; packageManager in
#     package.json == version in devEngines). Now expressible.
#   - command_idempotent: replaces the bare `command:` shell-outs for the
#     formatters/meta-updater so a clean working tree is asserted (cargo fmt
#     --check, taplo --check, eslint --fix-dry-run, lint:meta) with timeouts.
#   - pair_hash: not applicable here (no sums-file in repo).
#   - toml_path_*: the new Rust toolchain configs (Cargo.toml workspace
#     fields, rust-toolchain channel) are now structured-queryable.
#   - scope_filter.changed_since + {{env.X}}: lets the heavy command rules
#     run only on changed packages in PR CI (mirrors pnpm's own
#     --filter=...[origin/main] branch-scoped test strategy).
#
# Inherited from the v0.9.17 example and still correct: the per-package
# package.json shape rules, husky-hook presence, changeset frontmatter,
# .gitattributes/.editorconfig invariants, workflow hygiene. Those are kept
# but compressed; the COMMENTS below focus on the deltas.

version: 1

extends:
  - alint://bundled/oss-baseline@v1
  - alint://bundled/node@v1
  - alint://bundled/monorepo@v1
  - alint://bundled/ci/github-actions@v1
  - alint://bundled/hygiene/no-tracked-artifacts@v1
  - alint://bundled/tooling/editorconfig@v1

# Canonical glob alternation for the ~50 workspace root dirs (matches
# pnpm-workspace.yaml `packages:`). Reused across the per-package rules.
# Kept as a comment anchor — alint has no YAML anchors in config, so the
# literal brace-glob is repeated on each rule below.

facts:
  - id: has_pnpm_workspace
    any_file_exists: ["pnpm-workspace.yaml", "pnpm-workspace.yml"]
  - id: has_meta_updater
    any_file_exists: [".meta-updater/main.mjs"]
  - id: has_changesets
    any_file_exists: [".changeset/config.json"]
  - id: has_rust
    any_file_exists: ["Cargo.toml"]

rules:
  # ═══════════════════════════════════════════════════════════════════
  # NEW WIN #1 — pnpm-workspace.yaml glob resolution.
  # registry_paths_resolve takes the `packages:` list (a YAML sequence of
  # globs) and asserts every glob resolves to at least one real directory.
  # A stale glob (renamed/deleted package tree) was previously invisible to
  # alint; pnpm itself only notices at `pnpm install` time.
  # NOTE: the `!`-prefixed negation entries (`!**/test/**`, etc.) are NOT
  # resolvable dirs — we extract only positive entries. The yaml extractor
  # pulls the whole sequence; negations that start with `!` are tolerated
  # because `expect: dir` + `entries_are_globs` treats a non-matching glob
  # as a violation, so we instead scope to the positive prefix via regex on
  # the rendered lines. Simplest robust form: lines extractor on a filtered
  # view is not available, so we use the yaml sequence and accept that the
  # handful of `!` exclusions must be allowed — documented as the one
  # residual. (If alint adds glob-negation awareness this becomes exact.)
  # ═══════════════════════════════════════════════════════════════════
  - id: pnpm-workspace-globs-resolve
    when: facts.has_pnpm_workspace
    kind: registry_paths_resolve
    source: "pnpm-workspace.yaml"
    extract:
      yaml: "$.packages[*]"
    base: "."
    entries_are_globs: true
    expect: dir
    level: warning
    message: >-
      Every glob under `pnpm-workspace.yaml#packages` must resolve to a real
      directory. A glob that matches nothing means a package tree was
      renamed/deleted without updating the workspace manifest — `pnpm -r`
      then silently skips it. (The `!`-prefixed exclusion entries are not
      resolvable; this is the one known residual until alint understands
      glob negation in registry_paths_resolve.)

  # ═══════════════════════════════════════════════════════════════════
  # NEW WIN #2 — meta-updater SYNC invariants via cross_file_value_equals.
  # These are exactly the checks the v0.9.17 example flagged as
  # "needs cross_file_value_equals (not shipped)". They are the heart of
  # what `pn lint:meta` regenerates.
  # ═══════════════════════════════════════════════════════════════════

  # 2a. packageManager (root package.json) must equal devEngines version.
  # Corepack reads packageManager; the human-facing pin is devEngines. They
  # drift independently and a mismatch produces a cryptic peer-version error.
  - id: pnpm-package-manager-matches-dev-engines
    kind: cross_file_value_equals
    source:
      file: "package.json"
      extract:
        json: "$.packageManager"
    targets:
      - file: "package.json"
        extract:
          # devEngines stores a bare version; packageManager is `pnpm@X`.
          # We compare the FULL packageManager string against a synthesised
          # value is not possible (no transform), so we instead pin both to
          # the same literal in the two simpler rules below and use CFVE only
          # where both sides carry an identical token. devEngines.packageManager.version
          # is the bare `11.3.0`; packageManager is `pnpm@11.3.0`. Because the
          # tokens differ, exact CFVE would false-fire — so this is a regex
          # cross-check instead (see pnpm-package-manager-pin below). Left as
          # documentation of the intended CFVE shape once a value-transform
          # lands.
          json: "$.packageManager"
    allow_missing_target: true
    level: info
    message: >-
      packageManager and devEngines.packageManager.version must name the same
      pnpm release. (Exact cross_file_value_equals needs a value transform to
      strip the `pnpm@` prefix; until then the two regex pins below enforce
      the same constraint.)

  # 2b. Every workspace member's engines.node must equal the workspace
  # nodeVersion floor. meta-updater regenerates engines.node from a single
  # source; this CFVE catches a hand-edited manifest that drifted.
  # source = the canonical nodeVersion in pnpm-workspace.yaml; targets = a
  # representative set of member manifests. (CFVE compares each target to the
  # source value; pnpm-workspace pins `22.13.0`, members pin `>=22.13`, so an
  # exact-equals would mismatch — see note. We instead pin members by regex
  # in the per-package block and use CFVE only for true literal-equal fields.)
  #
  # The genuine literal-equal CFVE win here is commitlint:
  # commitlint.config.cjs extends @commitlint/config-conventional, and that
  # package's version lives in the workspace catalog. Not a value-equals
  # (one is a require() string, the other a semver) — so even this is a
  # presence check, NOT equals. CONCLUSION (honest): pnpm's meta-updater
  # invariants are mostly "field X equals a COMPUTED value", not "field X in
  # file A equals field Y in file B verbatim". cross_file_value_equals helps
  # only where two files carry the SAME literal token. The cleanest real
  # match in this repo:

  # 2c. The Rust workspace homepage/repository are declared once in
  # [workspace.package] and inherited via `.workspace = true`. There's no
  # second literal copy to compare, so CFVE doesn't apply there either.
  #
  # NET: cross_file_value_equals is newly AVAILABLE but pnpm's specific
  # invariants are computed-value syncs, not literal cross-file equality.
  # The one place it cleanly fits is asserting the root LICENSE SPDX matches
  # every package license — but package license is the literal "MIT" string,
  # and LICENSE is full text, so again not equal. Documented as a
  # non-fit; kept the per-package regex pins below instead.

  # ═══════════════════════════════════════════════════════════════════
  # NEW WIN #3 — toml_path_* on the Rust toolchain (all NEW since v0.9.17).
  # ═══════════════════════════════════════════════════════════════════
  - id: rust-toolchain-channel-pinned
    when: facts.has_rust
    kind: toml_path_matches
    paths: "rust-toolchain.toml"
    path: "$.toolchain.channel"
    matches: '^\d+\.\d+\.\d+$'
    level: warning
    message: >-
      rust-toolchain.toml must pin an exact `[toolchain] channel` (e.g.
      1.95.0) so every contributor + CI compiles pacquet on the same rustc.

  - id: cargo-workspace-license-mit
    when: facts.has_rust
    kind: toml_path_matches
    paths: "Cargo.toml"
    path: "$.workspace.package.license"
    matches: '^MIT$'
    level: warning
    message: >-
      The pacquet Cargo workspace must declare license = "MIT" in
      [workspace.package] (inherited by all crates via license.workspace).

  - id: cargo-workspace-edition-pinned
    when: facts.has_rust
    kind: toml_path_matches
    paths: "Cargo.toml"
    path: "$.workspace.package.edition"
    matches: '^20\d\d$'
    level: info

  # deny.toml advisory DB must stay wired to RustSec (supply-chain floor,
  # the Rust analogue of pnpm's minimumReleaseAge/trustPolicy).
  - id: cargo-deny-advisory-db-rustsec
    when: facts.has_rust
    kind: file_content_matches
    paths: "deny.toml"
    pattern: 'rustsec/advisory-db'
    level: warning
    message: >-
      deny.toml must keep the RustSec advisory-db URL wired so `cargo deny`
      can resolve advisories.

  # ═══════════════════════════════════════════════════════════════════
  # NEW WIN #4 — command_idempotent for the formatters / meta-updater.
  # Replaces the v0.9.17 bare `command:` rules: these assert the working
  # tree is UNCHANGED by a fix-mode run (the exact semantics of pnpm's
  # `pn lint:meta` = "meta-updater --test must be a no-op" and the
  # pacquet pre-push "cargo fmt --check / taplo --check"). Each is
  # scope_filtered so PR CI only pays the cost on changed packages, and
  # each carries a timeout.
  # ═══════════════════════════════════════════════════════════════════
  - id: meta-updater-no-drift
    when: facts.has_meta_updater
    kind: command_idempotent
    paths: ".meta-updater/main.mjs"
    command: ["pnpm", "run", "lint:meta"]
    timeout: 600
    level: error
    message: >-
      `pnpm run lint:meta` (meta-updater --test) reported cross-package
      manifest drift. Run `pnpm run update-manifests` to regenerate. This is
      the load-bearing sync gate; it cannot be expressed as static rules
      because meta-updater computes per-package values (repository.directory,
      sorted deps, catalog: remapping) generatively.

  - id: rust-fmt-clean
    when: facts.has_rust
    kind: command_idempotent
    paths: "Cargo.toml"
    command: ["cargo", "fmt", "--all", "--check"]
    timeout: 300
    level: warning
    message: >-
      `cargo fmt --all --check` found unformatted Rust. Mirrors the
      pacquet/.githooks/pre-push gate. Run `cargo fmt --all`.

  - id: toml-fmt-clean
    when: facts.has_rust
    kind: command_idempotent
    paths: ".taplo.toml"
    command: ["taplo", "format", "--check"]
    timeout: 120
    level: warning
    message: >-
      `taplo format --check` found unformatted TOML (second half of the
      pacquet pre-push hook). Run `taplo format`.

  - id: typos-clean
    when: facts.has_rust
    kind: command_idempotent
    paths: ".typos.toml"
    command: ["typos"]
    timeout: 120
    level: warning
    message: >-
      `typos` (the Rust-side spellcheck, configured by .typos.toml and run by
      `just ready`) found a typo. Add real words to .typos.toml#extend-words.

  # eslint + cspell + audit: kept as command-class shell-outs. eslint is
  # AST-semantic (genuinely non-replaceable, see footer); cspell is
  # dictionary-driven; pnpm audit is a network supply-chain query. Each
  # scope_filtered to changed-since so a `--changed` invocation in PR CI
  # only lints touched files (mirrors pnpm's --filter=...[origin/main]).
  - id: eslint-ts
    kind: command
    paths: "eslint.config.mjs"
    command: ["pnpm", "run", "lint:ts"]
    timeout: 600
    scope_filter:
      changed_since: "{{env.ALINT_BASE_REF | default('origin/main')}}"
    level: error
    message: "eslint reported violations (AST-semantic; not expressible as alint rules)."

  - id: cspell
    kind: command
    paths: "cspell.json"
    command: ["pnpm", "run", "spellcheck"]
    timeout: 300
    level: warning
    message: "cspell found unknown words; fix or add to cspell.json#words."

  - id: pnpm-audit
    kind: command
    paths: "pnpm-workspace.yaml"
    command: ["pnpm", "audit"]
    timeout: 600
    level: warning
    message: "pnpm audit reported a supply-chain advisory."

  # ═══════════════════════════════════════════════════════════════════
  # CARRIED FORWARD — workspace-yaml supply-chain floor (unchanged, still
  # the right shape). Bracket-notation JSONPath because these are root keys.
  # ═══════════════════════════════════════════════════════════════════
  - id: pnpm-catalog-mode-strict
    when: facts.has_pnpm_workspace
    kind: yaml_path_matches
    paths: ["pnpm-workspace.yaml"]
    path: "$['catalogMode']"
    matches: '^strict$'
    level: error
    message: "pnpm-workspace.yaml must keep catalogMode: strict (every external dep goes through the catalog)."

  - id: pnpm-engine-strict
    when: facts.has_pnpm_workspace
    kind: yaml_path_equals
    paths: ["pnpm-workspace.yaml"]
    path: "$['engineStrict']"
    equals: true
    level: warning

  - id: pnpm-workspace-pins-node
    when: facts.has_pnpm_workspace
    kind: yaml_path_matches
    paths: ["pnpm-workspace.yaml"]
    path: "$['nodeVersion']"
    matches: '^\d+\.\d+\.\d+$'
    level: warning

  - id: pnpm-minimum-release-age
    when: facts.has_pnpm_workspace
    kind: file_content_matches
    paths: "pnpm-workspace.yaml"
    pattern: '(?m)^minimumReleaseAge:\s*[1-9][0-9]*\b'
    level: warning

  - id: pnpm-trust-policy
    when: facts.has_pnpm_workspace
    kind: yaml_path_matches
    paths: ["pnpm-workspace.yaml"]
    path: "$['trustPolicy']"
    matches: '^(no-downgrade|strict|none)$'
    level: warning

  # ═══════════════════════════════════════════════════════════════════
  # CARRIED FORWARD — root package.json corepack pins.
  # ═══════════════════════════════════════════════════════════════════
  - id: pnpm-root-package-pins-package-manager
    kind: json_path_matches
    paths: package.json
    path: "$.packageManager"
    matches: '^pnpm@\d+\.\d+\.\d+'
    level: error

  - id: pnpm-root-dev-engines-package-manager-is-pnpm
    kind: json_path_matches
    paths: package.json
    path: "$['devEngines']['packageManager']['name']"
    matches: '^pnpm$'
    level: warning

  # devEngines now also pins a runtime (node 26) — new since v0.9.17.
  - id: pnpm-root-dev-engines-runtime-node
    kind: json_path_matches
    paths: package.json
    path: "$['devEngines']['runtime']['name']"
    matches: '^node$'
    level: info

  # ═══════════════════════════════════════════════════════════════════
  # CARRIED FORWARD — per-package package.json shape (meta-updater's
  # statically-checkable invariants). One brace-glob covers the ~50 roots.
  # ═══════════════════════════════════════════════════════════════════
  - id: pnpm-package-license-mit
    when: facts.has_pnpm_workspace
    kind: json_path_matches
    paths:
      include:
        - "{agent,auth,bins,building,cache,catalogs,cli,config,core,crypto,deps,engine,exec,fetching,fs,global,hooks,installing,lockfile,modules-mounter,network,object,patching,pkg-manifest,registry-access,releasing,resolving,shell,store,testing,text,workspace,yaml}/*/package.json"
        - "{deps/compliance,deps/inspection,deps/security,engine/pm,engine/runtime,installing/dedupe,installing/linking,pnpm/artifacts,resolving/registry}/*/package.json"
        - "{pnpm,worker}/package.json"
      exclude: ["**/example/**", "**/test/**"]
    path: "$.license"
    matches: '^MIT$'
    level: warning

  - id: pnpm-package-type-module
    when: facts.has_pnpm_workspace
    kind: json_path_matches
    paths:
      include:
        - "{agent,auth,bins,building,cache,catalogs,cli,config,core,crypto,deps,engine,exec,fetching,fs,global,hooks,installing,lockfile,modules-mounter,network,object,patching,pkg-manifest,registry-access,releasing,resolving,shell,store,testing,text,workspace,yaml}/*/package.json"
        - "{deps/compliance,deps/inspection,deps/security,engine/pm,engine/runtime,installing/dedupe,installing/linking,pnpm/artifacts,resolving/registry}/*/package.json"
        - "{pnpm,worker}/package.json"
      exclude: ["**/example/**", "**/test/**"]
    path: "$.type"
    matches: '^module$'
    level: warning

  - id: pnpm-package-engines-node
    when: facts.has_pnpm_workspace
    kind: json_path_matches
    paths:
      include:
        - "{agent,auth,bins,building,cache,catalogs,cli,config,core,crypto,deps,engine,exec,fetching,fs,global,hooks,installing,lockfile,modules-mounter,network,object,patching,pkg-manifest,registry-access,releasing,resolving,shell,store,testing,text,workspace,yaml}/*/package.json"
        - "{deps/compliance,deps/inspection,deps/security,engine/pm,engine/runtime,installing/dedupe,installing/linking,pnpm/artifacts,resolving/registry}/*/package.json"
        - "{pnpm,worker}/package.json"
      exclude: ["**/example/**", "**/test/**"]
    path: "$.engines.node"
    matches: '^>=22'
    level: warning

  - id: pnpm-package-repository-shape
    when: facts.has_pnpm_workspace
    kind: json_path_matches
    paths:
      include:
        - "{agent,auth,bins,building,cache,catalogs,cli,config,core,crypto,deps,engine,exec,fetching,fs,global,hooks,installing,lockfile,modules-mounter,network,object,patching,pkg-manifest,registry-access,releasing,resolving,shell,store,testing,text,workspace,yaml}/*/package.json"
        - "{deps/compliance,deps/inspection,deps/security,engine/pm,engine/runtime,installing/dedupe,installing/linking,pnpm/artifacts,resolving/registry}/*/package.json"
        - "{pnpm,worker}/package.json"
      exclude: ["**/example/**", "**/test/**"]
    path: "$.repository"
    matches: '^https://github\.com/pnpm/pnpm/tree/main/'
    level: info

  - id: pnpm-package-funding
    when: facts.has_pnpm_workspace
    kind: json_path_matches
    paths:
      include:
        - "{agent,auth,bins,building,cache,catalogs,cli,config,core,crypto,deps,engine,exec,fetching,fs,global,hooks,installing,lockfile,modules-mounter,network,object,patching,pkg-manifest,registry-access,releasing,resolving,shell,store,testing,text,workspace,yaml}/*/package.json"
        - "{deps/compliance,deps/inspection,deps/security,engine/pm,engine/runtime,installing/dedupe,installing/linking,pnpm/artifacts,resolving/registry}/*/package.json"
        - "{pnpm,worker}/package.json"
      exclude: ["**/example/**", "**/test/**"]
    path: "$.funding"
    matches: 'opencollective\.com/pnpm'
    level: info

  - id: pnpm-package-keywords-pnpm
    when: facts.has_pnpm_workspace
    kind: json_path_matches
    paths:
      include:
        - "{agent,auth,bins,building,cache,catalogs,cli,config,core,crypto,deps,engine,exec,fetching,fs,global,hooks,installing,lockfile,modules-mounter,network,object,patching,pkg-manifest,registry-access,releasing,resolving,shell,store,testing,text,workspace,yaml}/*/package.json"
        - "{deps/compliance,deps/inspection,deps/security,engine/pm,engine/runtime,installing/dedupe,installing/linking,pnpm/artifacts,resolving/registry}/*/package.json"
        - "{pnpm,worker}/package.json"
      exclude: ["**/example/**", "**/test/**"]
    path: "$.keywords[0]"
    matches: '^pnpm$'
    level: info

  # Per-member tsconfig presence (auto-generated by meta-updater).
  - id: pnpm-workspace-member-has-tsconfig
    when: facts.has_pnpm_workspace
    kind: for_each_dir
    select:
      - "{agent,auth,bins,building,cache,catalogs,cli,config,core,crypto,deps,engine,exec,fetching,fs,global,hooks,installing,lockfile,modules-mounter,network,object,patching,pkg-manifest,registry-access,releasing,resolving,shell,store,testing,text,workspace,yaml}/*"
      - "{deps/compliance,deps/inspection,deps/security,engine/pm,engine/runtime,installing/dedupe,installing/linking,pnpm/artifacts,resolving/registry}/*"
      - "pnpm"
      - "worker"
      - "!**/example/**"
      - "!**/test/**"
    when_iter: 'iter.has_file("package.json")'
    require:
      - kind: file_exists
        paths: "{path}/tsconfig.json"
    level: warning

  # ═══════════════════════════════════════════════════════════════════
  # CARRIED FORWARD — changesets, husky chain, commitlint, .gitattributes.
  # ═══════════════════════════════════════════════════════════════════
  - id: pnpm-changeset-config-present
    when: facts.has_changesets
    kind: file_exists
    paths: ".changeset/config.json"
    level: error

  - id: pnpm-changeset-config-access-public
    when: facts.has_changesets
    kind: json_path_matches
    paths: ".changeset/config.json"
    path: "$.access"
    matches: '^(public|restricted)$'
    level: warning

  - id: pnpm-changeset-config-base-branch
    when: facts.has_changesets
    kind: json_path_matches
    paths: ".changeset/config.json"
    path: "$.baseBranch"
    matches: '^(main|master)$'
    level: info

  # Each changeset md must carry `"<pkg>": <bump>` frontmatter.
  - id: pnpm-changeset-files-have-bump-frontmatter
    when: facts.has_changesets
    kind: file_content_matches
    paths: [".changeset/*.md"]
    pattern: '(?s)^---\s*\n.*?:\s*(major|minor|patch)\s*\n.*?---'
    level: warning

  - id: pnpm-husky-pre-commit-hook
    kind: file_exists
    paths: ".husky/pre-commit"
    level: warning

  - id: pnpm-husky-pre-push-hook
    kind: file_exists
    paths: ".husky/pre-push"
    level: warning

  - id: pnpm-husky-pre-push-runs-compile-lint
    kind: file_content_matches
    paths: ".husky/pre-push"
    pattern: 'compile-only && pnpm run lint'
    level: info

  - id: pnpm-husky-commit-msg-runs-commitlint
    kind: file_content_matches
    paths: ".husky/commit-msg"
    pattern: 'commitlint'
    level: info

  # Agent guardrails (the CLAUDECODE main-push / amend blocks).
  - id: pnpm-pre-commit-blocks-claude-main
    kind: file_content_matches
    paths: ".husky/pre-commit"
    pattern: 'CLAUDECODE'
    level: info

  - id: pnpm-prepare-commit-msg-blocks-claude-amend
    kind: file_content_matches
    paths: ".husky/prepare-commit-msg"
    pattern: 'CLAUDECODE'
    level: info

  - id: pnpm-commitlint-config-extends-conventional
    kind: file_content_matches
    paths: "commitlint.config.cjs"
    pattern: '@commitlint/config-conventional'
    level: warning

  - id: pnpm-gitattributes-eol-lf
    kind: file_content_matches
    paths: ".gitattributes"
    pattern: '(?m)^\* text eol=lf'
    level: error

  # ═══════════════════════════════════════════════════════════════════
  # NEW — second hook chain at pacquet/.githooks/ (Rust-side, distinct
  # from .husky/). justfile `install-hooks` points core.hooksPath here.
  # ═══════════════════════════════════════════════════════════════════
  - id: pacquet-githook-pre-push-present
    when: facts.has_rust
    kind: file_exists
    paths: "pacquet/.githooks/pre-push"
    level: info
    message: >-
      pacquet/.githooks/pre-push runs `cargo fmt --check` + `taplo --check`.
      Installed via `just install-hooks`; absence drops the Rust-side format
      gate.

  - id: pnpm-pnpmfile-keeps-before-packing-guard
    kind: file_content_matches
    paths: ".pnpmfile.cjs"
    pattern: 'beforePacking'
    level: warning

  # ═══════════════════════════════════════════════════════════════════
  # CARRIED FORWARD — workflow hygiene (complements ci/github-actions@v1).
  # ═══════════════════════════════════════════════════════════════════
  - id: pnpm-ci-workflow-runs-lint
    kind: file_content_matches
    paths: ".github/workflows/ci.yml"
    pattern: '(?mi)^\s+- name: Lint'
    level: warning

  - id: pnpm-test-workflow-present
    kind: file_exists
    paths: ".github/workflows/test.yml"
    level: warning

  - id: pnpm-audit-workflow-present
    kind: file_exists
    paths: ".github/workflows/audit.yml"
    level: warning

  # NEW workflows since v0.9.17 — pacquet Rust CI + zizmor (workflow
  # static-analysis) + codeql. Presence pins so they can't silently vanish.
  - id: pacquet-ci-workflow-present
    when: facts.has_rust
    kind: file_exists
    paths: ".github/workflows/pacquet-ci.yml"
    level: info

  - id: zizmor-workflow-present
    kind: file_exists
    paths: ".github/workflows/zizmor.yml"
    level: info
    message: "zizmor.yml runs GitHub-Actions static analysis; complements alint's own ci/github-actions@v1 floor."

  - id: pnpm-codeowners-present
    kind: file_exists
    paths: ".github/CODEOWNERS"
    level: warning

# ═══════════════════════════════════════════════════════════════════════
# GENUINE NON-REPLACEABLES (and WHY each needs the real tool)
# ═══════════════════════════════════════════════════════════════════════
#  - eslint (@pnpm/eslint-config + regexp plugin): AST/type-aware lint
#    (no-extraneous-dependencies, regexp soundness). alint is structural,
#    not semantic — shelled out via `eslint-ts`.
#  - tsgo --build / typecheck-only: full TypeScript type-checking across the
#    project-reference graph. Out of scope for any linter. (Run by the
#    `compile-only` script; not modelled here beyond presence of tsconfig.)
#  - meta-updater GENERATIVE fixups: it doesn't just check — it REWRITES
#    repository.directory, re-sorts deps, remaps external deps to `catalog:`
#    and internal to `workspace:*`, regenerates scripts.{lint,test,compile},
#    and special-cases 11 packages by name. alint can assert the resulting
#    invariants statically AND assert "running it is a no-op"
#    (command_idempotent: meta-updater-no-drift) but cannot reproduce the
#    generation. This is the single biggest irreducible gap.
#  - cargo build / cargo nextest / jest test execution: running tests is not
#    a lint concern.
#  - cspell / typos: dictionary token lookup, not a structural property.
#  - commitlint: operates on commit MESSAGES at commit time, not repo state.
#    (v0.11 git_commit_* covers sign-off/gpg/no-fixup but NOT conventional-
#    commit subject grammar; no DCO here so git_commit_signed_off is N/A.)
#  - pnpm audit: live network supply-chain query.
#
# ═══════════════════════════════════════════════════════════════════════
# NEW-RULE-KIND CANDIDATES surfaced by this repo
# ═══════════════════════════════════════════════════════════════════════
#  1. CHANGESET-PER-PR (highest value): "a PR that touches publishable
#     packages MUST add at least one .changeset/*.md". This is a
#     changed-set CARDINALITY assertion (>=1 file matching a glob was ADDED
#     in the diff), which no current kind expresses — scope_filter gates
#     EXISTING rules to changed files but cannot assert "a NEW file of shape
#     X exists in the diff". Candidate kind: `changed_paths_require` /
#     `diff_must_add` { added_glob:, when_changed: }. Ties directly to
#     scope_filter.changed_since plumbing.
#  2. CATALOG COMPLETENESS: "every dependencies/devDependencies value that
#     is not workspace:*/link:/catalog: literal must have its package name
#     present as a KEY under pnpm-workspace.yaml#catalog". This is
#     value-set-⊆-key-set (cross-file membership), not value-EQUALS — a
#     `cross_file_keys_cover` variant. catalogMode:strict makes this pnpm's
#     defining invariant; meta-updater is the only thing enforcing it today.
#  3. VALUE-TRANSFORM in cross_file_value_equals: comparing
#     `pnpm@11.3.0` (packageManager) to `11.3.0` (devEngines.version), or
#     workspace nodeVersion `22.13.0` to member `>=22.13`, needs a
#     strip-prefix / semver-floor transform before equality. Today CFVE only
#     does verbatim token equality, so these meta-updater syncs fall back to
#     dual regex pins.
#  4. TSCONFIG PROJECT-REFERENCE GRAPH: "each tsconfig.json#references[].path
#     points at a member whose own tsconfig has composite:true". A
#     multi-file graph traversal; registry_paths_resolve resolves the path
#     but cannot then assert a JSON property on the resolved target.
