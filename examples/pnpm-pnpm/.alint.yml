# Starter alint config for pnpm/pnpm.
#
# pnpm IS the canonical pnpm-workspace monorepo — its own
# `pnpm-workspace.yaml` shapes 169 packages spread across ~50
# functional root directories (`cache/`, `cli/`, `store/`,
# `engine/pm/`, `installing/dedupe/`, etc.) rather than the
# usual `packages/*` flat layout. Whatever convention pnpm
# enforces on itself becomes the reference shape for the
# hundreds of downstream TS/JS monorepos that copy it.
#
# Structural-validation tooling pnpm uses on itself:
#   1. `.meta-updater` (a custom @pnpm/meta-updater plugin) — the
#      load-bearing one. ~470 lines of TS that enforces cross-
#      package field sync: every non-CLI package gets the same
#      `license`, `funding`, `bugs`, `engines.node`, `type`,
#      `homepage` shape, has its `repository` rewritten to point
#      at its own subdir, has its `jest.preset` set, has
#      `dependencies` sorted, has external deps remapped to
#      `catalog:`, has internal deps remapped to `workspace:*`,
#      has its `scripts.lint`/`scripts.test`/`scripts.compile`
#      regenerated, etc. Run via `pn lint:meta` (= `pn meta-updater
#      --test`); CI fails if `pn update-manifests` would change
#      anything.
#   2. `eslint.config.mjs` — TS/JS lint (AST; out of scope).
#   3. `cspell.json` — spellcheck on `**/*.ts` + `**/README.md` +
#      `.changeset/*.md` (out of scope: dictionary-driven token
#      lookup, not a structural property).
#   4. `commitlint.config.cjs` + `.husky/commit-msg` — Conventional
#      Commits on commit messages (out of scope: PR/commit-time
#      check, not repo-state).
#   5. `.husky/pre-commit` (compile + lint), `pre-push` (lint),
#      `prepare-commit-msg` (Claude-Code amend guard),
#      `commit-msg` (commitlint).
#   6. `.changeset/config.json` + `.changeset/*.md` — changeset-
#      driven release notes; the changeset shape is the structural
#      gate (changeset entries must list a real package name +
#      bump kind).
#   7. `.github/workflows/{ci,test,audit,release,...}.yml` — 9
#      workflows; `ci.yml` orchestrates the lint+compile gate,
#      `audit.yml` runs `pn audit`.
#   8. `.editorconfig` — `end_of_line=lf`, final newline,
#      no-trailing-whitespace, indent_style=space, indent_size=2
#      for `*.{ts,js,cjs,json}`.
#   9. `.gitattributes` — `* text eol=lf` + `*.tgz binary`.
#  10. `pnpm-workspace.yaml` — the canonical workspace manifest.
#      Adopts `catalogMode: strict` (every external dep MUST be in
#      catalog), `engineStrict: true`, `minimumReleaseAge: 1440`,
#      `trustPolicy: no-downgrade` — supply-chain-strict defaults.
#  11. `verdaccio.yaml` — local registry config for E2E tests.
#  12. `.pnpmfile.cjs` — install-time hooks (per-package adjustments,
#      `beforePacking` guard for the `pnpm` package).
#
# What this config replaces:
#   - The `meta-updater` cross-package field sync — we can't
#     replicate the rewrite logic, but every *invariant* it
#     enforces (license=MIT, type=module, engines.node=>=22.13,
#     funding URL, bugs URL, files=[lib], `keywords` includes
#     `pnpm`/`pnpm11`) becomes a per-package alint rule. Catches
#     drift the moment a new package lands without going through
#     `pn update-manifests`, vs `lint:meta` only catching it after
#     `pn meta-updater --test` runs.
#   - `.editorconfig` invariants restated as alint rules so
#     violations surface even when contributors haven't installed
#     an .editorconfig-aware editor.
#   - `.gitattributes` lock-down so the `* text eol=lf` line
#     stays put (this was a recurring cross-platform diff churn
#     source before it was added).
#   - Per-package layout: every workspace member has README +
#     package.json + tsconfig.json + tsconfig.lint.json (the last
#     is auto-generated by meta-updater; missing one = drift).
#   - Per-package `repository` field shape (must point at the
#     package's own subdir under github.com/pnpm/pnpm/tree/main/).
#   - Per-package `homepage` field shape (must follow the same
#     scheme with `#readme` suffix).
#   - Catalog-protocol enforcement: pnpm uses `catalogMode: strict`
#     so every external dep must appear in the catalog. We can't
#     verify "every dep is in the catalog" cross-file (no
#     `cross_file_value_equals` rule yet) but we CAN verify "every
#     `dependencies`/`devDependencies` value is either `catalog:`,
#     `workspace:*`, or `link:`" — the three permitted forms.
#   - Workspace pinning: `pnpm-workspace.yaml` declares
#     `packageManager: pnpm@<version>` in package.json; rule
#     verifies the two stay in sync (same shape).
#   - Husky hook presence (commit-msg, pre-commit, pre-push,
#     prepare-commit-msg) — if any disappears the corresponding
#     gate silently stops firing.
#   - Changeset config presence + each `.changeset/*.md` carries
#     a YAML frontmatter with at least one `<package>: <bump>`
#     entry.
#   - Workflow hygiene: every action pinned by SHA, every workflow
#     has `permissions:` declared (already enforced via the
#     bundled `ci/github-actions@v1` ruleset).
#   - Shell out to `pnpm lint`, `cspell`, `pn lint:meta`, and
#     `pn audit` via `command:` rules so a single `alint check`
#     covers the structural floor + the existing toolchain.
#
# Known limitations versus the existing pipeline (each requires
# an alint primitive that doesn't ship today — see this directory's
# README.md for the full gap catalogue):
#   - `meta-updater`'s deeper per-name cases (the `switch (manifest.name)`
#     in `.meta-updater/src/index.ts` carves out 11 special-case
#     packages with custom `scripts.test` shapes; alint can verify
#     the *common* shape but not the 11 carve-outs).
#   - The cross-package field-sync invariants (every package's
#     `engines.node` MUST equal whatever the workspace root declares;
#     every package's `keywords[0]` MUST equal `pnpm`; every
#     package's `funding` MUST equal `https://opencollective.com/pnpm`).
#     The `cross_file_value_equals` candidate (already on the v0.10+
#     list — surfaced first by airflow) covers this.
#   - The catalog-protocol completeness check (every `dependencies`
#     entry that's NOT `workspace:*`/`link:` MUST appear as a key
#     in `pnpm-workspace.yaml#$.catalog`). Same `cross_file_value_equals`
#     shape — value at point X in file A must equal a key under point
#     Y in file B. NEW shape variant: registry-key-presence check.
#   - Per-package `tsconfig.json#references` consistency: each ref
#     must point at a workspace member that itself has
#     `composite: true` set in its tsconfig. This is a multi-file
#     graph traversal (registry-paths-resolve candidate, already on
#     the v0.10+ list).
#   - Changeset bump-kind validity: the bump must be one of
#     `major`/`minor`/`patch`. Alint can pattern-match that with
#     `file_content_matches` but can't easily verify the package
#     name on the LHS exists in the workspace.

version: 1

extends:
  - alint://bundled/oss-baseline@v1
  - alint://bundled/node@v1
  - alint://bundled/monorepo@v1
  - alint://bundled/monorepo/pnpm-workspace@v1
  - alint://bundled/ci/github-actions@v1
  - alint://bundled/hygiene/no-tracked-artifacts@v1
  - alint://bundled/hygiene/lockfiles@v1
  - alint://bundled/tooling/editorconfig@v1
  - alint://bundled/agent-context@v1

facts:
  - id: has_pnpm_workspace
    any_file_exists: ["pnpm-workspace.yaml", "pnpm-workspace.yml"]
  - id: has_meta_updater
    any_file_exists: [".meta-updater/main.mjs", ".meta-updater/package.json"]
  - id: has_changesets
    any_file_exists: [".changeset/config.json"]

rules:
  # ─────────────────────────────────────────────────────────────────
  # Catalog protocol — pnpm's defining workspace feature.
  # `pnpm-workspace.yaml` declares `catalogMode: strict`, meaning
  # every external dep MUST be in the catalog. We can't verify the
  # *exhaustive* sync (would need cross_file_value_equals against
  # the catalog map's key set), but we CAN verify the workspace
  # YAML keeps the strict-mode flag — if it ever drifts to
  # `manual` or gets removed, the entire catalog discipline silently
  # erodes.
  # ─────────────────────────────────────────────────────────────────
  - id: pnpm-catalog-mode-strict
    when: facts.has_pnpm_workspace
    kind: yaml_path_matches
    paths: ["pnpm-workspace.yaml", "pnpm-workspace.yml"]
    path: "$['catalogMode']"
    matches: '^strict$'
    level: error
    message: >-
      `pnpm-workspace.yaml` must declare `catalogMode: strict`.
      Without it, contributors can add direct external dep
      versions to per-package package.json instead of going
      through the workspace catalog, defeating the whole point of
      having one. The bracket-notation in the JSONPath is required
      because `catalogMode` is read by alint as a key on the YAML
      root mapping; same applies to every workspace-yaml field
      below.

  # ── Workspace declares `engineStrict: true` so installs fail
  # fast on a wrong Node version (the workspace `nodeVersion:
  # 22.13.0` pin is enforced).
  - id: pnpm-engine-strict
    when: facts.has_pnpm_workspace
    # *_path_equals (not *_matches) for bool fields — see
    # CONFIG-AUTHORING.md pitfall #16.
    kind: yaml_path_equals
    paths: ["pnpm-workspace.yaml", "pnpm-workspace.yml"]
    path: "$['engineStrict']"
    equals: true
    level: warning
    message: >-
      `pnpm-workspace.yaml` should keep `engineStrict: true`.
      Without it, an install on Node < 22.13 silently succeeds and
      then crashes at runtime with cryptic native-binding errors.

  # ── Workspace pins a specific nodeVersion (so all contributors
  # land on the same Node major).
  - id: pnpm-workspace-pins-node
    when: facts.has_pnpm_workspace
    kind: yaml_path_matches
    paths: ["pnpm-workspace.yaml", "pnpm-workspace.yml"]
    path: "$['nodeVersion']"
    matches: '^\d+\.\d+\.\d+$'
    level: warning
    message: >-
      `pnpm-workspace.yaml` should pin `nodeVersion:
      <major>.<minor>.<patch>` so `pnpm runtime` resolves to the
      same Node binary on every contributor machine.

  # ── Supply-chain strictness: `minimumReleaseAge` non-zero (the
  # repo currently uses 1440 minutes = 1 day) and `trustPolicy:
  # no-downgrade`. Together these are pnpm's two principal
  # supply-chain mitigations.
  - id: pnpm-minimum-release-age
    when: facts.has_pnpm_workspace
    kind: yaml_path_matches
    paths: ["pnpm-workspace.yaml", "pnpm-workspace.yml"]
    path: "$['minimumReleaseAge']"
    matches: '^[1-9]\d*$'
    level: warning
    message: >-
      `pnpm-workspace.yaml` should declare a non-zero
      `minimumReleaseAge` (in minutes). pnpm's defence against
      malicious packages published in the last few hours; 1440
      (1 day) is the canonical value.

  - id: pnpm-trust-policy
    when: facts.has_pnpm_workspace
    kind: yaml_path_matches
    paths: ["pnpm-workspace.yaml", "pnpm-workspace.yml"]
    path: "$['trustPolicy']"
    matches: '^(no-downgrade|strict|none)$'
    level: warning
    message: >-
      `pnpm-workspace.yaml` should declare an explicit
      `trustPolicy`. `no-downgrade` is pnpm's recommended default;
      `strict` is more aggressive; `none` opts out entirely (and
      should only appear with a comment explaining why).

  # ─────────────────────────────────────────────────────────────────
  # `packageManager:` field in root package.json must be present
  # and pinned (corepack uses this; mismatched local pnpm crashes
  # `pn install` with a cryptic peer-version error).
  # ─────────────────────────────────────────────────────────────────
  - id: pnpm-root-package-pins-package-manager
    kind: json_path_matches
    paths: package.json
    path: "$.packageManager"
    matches: '^pnpm@\d+\.\d+\.\d+'
    level: error
    message: >-
      Root `package.json` must declare `packageManager:
      pnpm@<version>`. Corepack reads this on every command;
      contributors with a mismatched local pnpm get cryptic
      "peer pnpm version" errors otherwise.

  # ── `devEngines.packageManager.name` must equal `pnpm` (the
  # workspace explicitly checks for this in CI; corepack uses it
  # to decide whether to download pnpm on first run).
  - id: pnpm-root-dev-engines-package-manager-is-pnpm
    kind: json_path_matches
    paths: package.json
    path: "$['devEngines']['packageManager']['name']"
    matches: '^pnpm$'
    level: warning
    message: >-
      Root `package.json` should declare
      `devEngines.packageManager.name: pnpm`. The `onFail:
      download` setting under it lets corepack auto-install the
      right pnpm version on a clean clone.

  # ─────────────────────────────────────────────────────────────────
  # meta-updater: presence + invocation gate.
  # The `.meta-updater/` package is the load-bearing structural-
  # validation tool. If it disappears from `pnpm-workspace.yaml`
  # (or its compiled output goes missing), `pn lint:meta` silently
  # passes with zero work.
  # ─────────────────────────────────────────────────────────────────
  - id: pnpm-meta-updater-package-present
    when: facts.has_meta_updater
    kind: file_exists
    paths: ".meta-updater/main.mjs"
    level: error
    message: >-
      `.meta-updater/main.mjs` is the entrypoint pnpm's meta-updater
      reads. Removing it (e.g. accidentally `git rm`ing the directory)
      causes `pn lint:meta` to silently pass with zero work, allowing
      cross-package drift to land unchecked.

  - id: pnpm-meta-updater-source-present
    when: facts.has_meta_updater
    kind: file_exists
    paths: ".meta-updater/src/index.ts"
    level: error
    message: >-
      `.meta-updater/src/index.ts` is the canonical meta-updater
      logic — without it, `pn meta-updater` silently no-ops.

  - id: pnpm-meta-updater-in-workspace
    when: facts.has_pnpm_workspace
    kind: file_content_matches
    paths: ["pnpm-workspace.yaml", "pnpm-workspace.yml"]
    pattern: '(?m)^\s+- \.meta-updater\b'
    level: warning
    message: >-
      The `.meta-updater` directory must be listed under
      `packages:` in pnpm-workspace.yaml so `pn install` builds
      it. Otherwise `pn meta-updater` invocations fail with
      "package not found".

  - id: pnpm-root-has-lint-meta-script
    kind: json_path_matches
    paths: package.json
    path: "$.scripts['lint:meta']"
    matches: 'meta-updater'
    level: warning
    message: >-
      Root `package.json#scripts['lint:meta']` should invoke the
      meta-updater in `--test` mode (`pn meta-updater --test`).
      The CI lint job is `pn lint`, which chains
      `pn lint:meta` — if `lint:meta` is renamed, the cross-package
      sync check silently drops out of CI.

  # ─────────────────────────────────────────────────────────────────
  # Changesets: every PR that changes user-visible behaviour adds
  # a `.changeset/*.md`. The shape is YAML frontmatter listing
  # one or more `<package-name>: <major|minor|patch>` lines, then
  # a freeform body.
  # ─────────────────────────────────────────────────────────────────
  - id: pnpm-changeset-config-present
    when: facts.has_changesets
    kind: file_exists
    paths: ".changeset/config.json"
    level: error
    message: >-
      `.changeset/config.json` must exist for `pn changeset` to
      work. Without it, every release-prep run errors out with
      "no config found".

  - id: pnpm-changeset-config-shape
    when: facts.has_changesets
    kind: json_path_matches
    paths: ".changeset/config.json"
    path: "$.access"
    matches: '^(public|restricted)$'
    level: warning
    message: >-
      `.changeset/config.json` must declare `access: public` (or
      `restricted` for private workspaces). Default omitted is
      `restricted`, which would block npm publishes of public
      packages.

  - id: pnpm-changeset-config-base-branch
    when: facts.has_changesets
    kind: json_path_matches
    paths: ".changeset/config.json"
    path: "$.baseBranch"
    matches: '^(main|master)$'
    level: info

  # ── Each changeset markdown file must have YAML frontmatter
  # listing at least one package + bump kind. Pattern matches
  # the conventional shape: `---\n"<pkg>": <bump>\n---`.
  - id: pnpm-changeset-files-have-bump-frontmatter
    when: facts.has_changesets
    kind: file_content_matches
    paths: [".changeset/*.md"]
    # `(?s)` lets `.` match newlines; we look for the opening
    # `---`, then at least one `"<pkg>": <bump>` line, then the
    # closing `---`. Only fires on .md files in .changeset/, so
    # README.md / config.json don't match.
    pattern: '(?s)^---\s*\n.*?:\s*(major|minor|patch)\s*\n.*?---'
    level: warning
    message: >-
      Each `.changeset/*.md` (excluding README) must declare
      `"<package>": <major|minor|patch>` frontmatter. Empty or
      malformed frontmatter is silently dropped by `pn changeset
      version` — the changelog entry never appears in the next
      release.

  # ─────────────────────────────────────────────────────────────────
  # Husky hooks — every gate the .husky/ directory installs.
  # The Claude-Code amend-block hooks are pnpm-specific (added
  # to prevent agent-driven main-branch direct pushes), but the
  # commit-msg / pre-commit / pre-push hooks are the canonical
  # husky chain.
  # ─────────────────────────────────────────────────────────────────
  - id: pnpm-husky-pre-commit-hook
    kind: file_exists
    paths: ".husky/pre-commit"
    level: warning
    message: >-
      `.husky/pre-commit` should run `pn compile-only && pn lint`
      before each commit. Without it, the first feedback on a
      typo or lint regression is at CI time, not commit time.

  - id: pnpm-husky-pre-commit-runs-compile-and-lint
    kind: file_content_matches
    paths: ".husky/pre-commit"
    pattern: 'pnpm run compile-only && pnpm run lint'
    level: info

  - id: pnpm-husky-pre-push-hook
    kind: file_exists
    paths: ".husky/pre-push"
    level: warning

  - id: pnpm-husky-commit-msg-hook
    kind: file_exists
    paths: ".husky/commit-msg"
    level: warning
    message: >-
      `.husky/commit-msg` should invoke `pn commitlint` so
      Conventional-Commit-shaped messages are enforced before
      they land on a branch.

  - id: pnpm-husky-commit-msg-runs-commitlint
    kind: file_content_matches
    paths: ".husky/commit-msg"
    pattern: 'commitlint'
    level: info

  # ── Claude-Code agent guardrails. The repo uses these to block
  # AI agents from committing directly to main and from amending
  # commits. If they disappear, the project loses its agent-safety
  # rail.
  - id: pnpm-prepare-commit-msg-hook
    kind: file_exists
    paths: ".husky/prepare-commit-msg"
    level: info

  - id: pnpm-prepare-commit-msg-blocks-claude-amend
    kind: file_content_matches
    paths: ".husky/prepare-commit-msg"
    pattern: 'CLAUDECODE'
    level: info
    message: >-
      `.husky/prepare-commit-msg` should keep the `CLAUDECODE`
      env-var check that blocks Claude Code from amending commits.
      Removing the check re-opens the agent-amend footgun.

  # ─────────────────────────────────────────────────────────────────
  # commitlint config presence + Conventional-Commits extension.
  # ─────────────────────────────────────────────────────────────────
  - id: pnpm-commitlint-config-present
    kind: file_exists
    paths: "commitlint.config.cjs"
    level: warning
    message: >-
      `commitlint.config.cjs` is the policy file the husky
      commit-msg hook reads. Removing it makes the hook silently
      pass every message through.

  - id: pnpm-commitlint-config-extends-conventional
    kind: file_content_matches
    paths: "commitlint.config.cjs"
    pattern: '@commitlint/config-conventional'
    level: warning
    message: >-
      `commitlint.config.cjs` should extend
      `@commitlint/config-conventional` so Conventional Commits
      remain enforced. Custom extensions are fine on top.

  # ─────────────────────────────────────────────────────────────────
  # cspell config presence + Markdown/TS coverage. The spellcheck
  # is a load-bearing CI gate (`pn lint` chains `pn spellcheck`);
  # if cspell.json is removed or the dictionary loses its words
  # array, the CI lint job silently passes.
  # ─────────────────────────────────────────────────────────────────
  - id: pnpm-cspell-config-present
    kind: file_exists
    paths: "cspell.json"
    level: warning

  - id: pnpm-cspell-words-non-empty
    kind: json_path_matches
    paths: "cspell.json"
    path: "$.words[*]"
    matches: '.+'
    level: warning
    message: >-
      `cspell.json#$.words[]` must be a non-empty list. The
      project relies on the dictionary to carry domain-specific
      terms (`tarball`, `cafs`, `nodejs`, etc.); an empty
      dictionary makes spellcheck either explode with
      false-positives or silently pass everything.

  # ─────────────────────────────────────────────────────────────────
  # `.gitattributes` lock: `* text eol=lf` keeps cross-platform
  # diffs stable. If this disappears, every Windows contributor
  # re-introduces CRLF churn on the next commit.
  # ─────────────────────────────────────────────────────────────────
  - id: pnpm-gitattributes-eol-lf
    kind: file_content_matches
    paths: ".gitattributes"
    pattern: '(?m)^\* text eol=lf'
    level: error
    message: >-
      `.gitattributes` must keep `* text eol=lf`. Without it,
      Windows contributors re-introduce CRLF endings on every
      commit, forcing platform-specific dprint reformats.

  # ─────────────────────────────────────────────────────────────────
  # .editorconfig invariants restated as alint rules so violations
  # surface at `alint check` time, even when contributors haven't
  # installed an .editorconfig-aware editor. These overlap with the
  # bundled `tooling/editorconfig@v1` ruleset (which checks the
  # config file's presence + shape); these rules apply the
  # *content* of the config to actual source files.
  # ─────────────────────────────────────────────────────────────────
  - id: pnpm-source-final-newline
    kind: final_newline
    paths:
      include:
        - "**/src/**/*.ts"
        - "**/test/**/*.ts"
      exclude:
        - "**/node_modules/**"
        - "**/lib/**"
        - "**/dist/**"
        - "**/__fixtures__/**"
        - "**/fixtures/**"
    scope_filter:
      has_ancestor: package.json
    level: info
    fix:
      file_append_final_newline: {}

  - id: pnpm-source-no-trailing-whitespace
    kind: no_trailing_whitespace
    paths:
      include:
        - "**/src/**/*.ts"
        - "**/test/**/*.ts"
      exclude:
        - "**/node_modules/**"
        - "**/lib/**"
        - "**/dist/**"
        - "**/__fixtures__/**"
        - "**/fixtures/**"
    scope_filter:
      has_ancestor: package.json
    level: info
    fix:
      file_trim_trailing_whitespace: {}

  - id: pnpm-source-line-endings-lf
    # .editorconfig says `end_of_line = lf` for `*.{ts,js,cjs,json}`.
    # The .gitattributes rule above guards the long-term invariant;
    # this rule catches files that snuck through with CRLF on a
    # contributor's first commit before git's filter normalised
    # them.
    kind: line_endings
    paths:
      include:
        - "**/src/**/*.{ts,js,cjs}"
        - "**/test/**/*.{ts,js,cjs}"
      exclude:
        - "**/node_modules/**"
        - "**/lib/**"
        - "**/dist/**"
        - "**/__fixtures__/**"
        - "**/fixtures/**"
    target: lf
    level: warning

  # ─────────────────────────────────────────────────────────────────
  # Per-package layout: every workspace member needs README,
  # package.json, tsconfig.json, tsconfig.lint.json (the last
  # is auto-regenerated by meta-updater — its absence is the
  # smoking-gun signal that `pn update-manifests` was skipped).
  #
  # pnpm doesn't use `packages/*` — its members live across ~50
  # functional root directories. Rather than enumerate every one,
  # we use multiple `for_each_dir` rules with `when_iter:
  # iter.has_file("package.json")` to gate on actual workspace
  # member shape, then iterate over the union of all those dirs.
  # ─────────────────────────────────────────────────────────────────
  - id: pnpm-workspace-member-has-tsconfig
    when: facts.has_pnpm_workspace
    kind: for_each_dir
    select: "{cache,cli,config,core,crypto,deps,engine,exec,fetching,fs,global,hooks,lockfile,network,object,patching,pkg-manager,pkg-manifest,registry-access,releasing,resolving,shell,store,testing,text,workspace,yaml,bins,building,catalogs,modules-mounter,worker,auth,agent}/*"
    when_iter: 'iter.has_file("package.json")'
    require:
      - kind: file_exists
        paths: "{path}/tsconfig.json"
    level: warning
    message: >-
      Every pnpm workspace member must ship its own tsconfig.json.
      The bundled `tsgo --build` reads it; missing tsconfig means
      the package is silently excluded from the type-check graph.

  # ── tsconfig.lint.json is generated by meta-updater on every
  # `pn update-manifests` run. Its absence is a strong signal the
  # package was added without going through the canonical workflow.
  - id: pnpm-workspace-member-has-tsconfig-lint
    when: facts.has_pnpm_workspace
    kind: for_each_dir
    select: "{cache,cli,config,core,crypto,deps,engine,exec,fetching,fs,global,hooks,lockfile,network,object,patching,pkg-manager,pkg-manifest,registry-access,releasing,resolving,shell,store,testing,text,workspace,yaml,bins,building,catalogs,modules-mounter,worker,auth,agent}/*"
    when_iter: 'iter.has_file("package.json")'
    require:
      - kind: file_exists
        paths: "{path}/tsconfig.lint.json"
    level: info
    message: >-
      Each workspace member should have a tsconfig.lint.json (auto-
      generated by `pn meta-updater`). Missing means
      `pn update-manifests` was skipped on the package's PR.

  # ── Each workspace member's tsconfig.json must extend the
  # shared `@pnpm/tsconfig` (in `__utils__/tsconfig/`). Drift
  # means a package using a totally different TypeScript config
  # without a comment.
  - id: pnpm-workspace-member-tsconfig-extends-shared
    when: facts.has_pnpm_workspace
    kind: json_path_matches
    paths:
      include:
        - "{cache,cli,config,core,crypto,deps,engine,exec,fetching,fs,global,hooks,lockfile,network,object,patching,pkg-manager,pkg-manifest,registry-access,releasing,resolving,shell,store,testing,text,workspace,yaml,bins,building,catalogs,modules-mounter,worker,auth,agent}/*/tsconfig.json"
      exclude:
        # __utils__/tsconfig is the package the shared config lives in
        # — it must NOT extend itself. We don't list it in the include
        # because the include doesn't cover __utils__, but listed for
        # documentation.
        - "__utils__/tsconfig/tsconfig.json"
    path: "$.extends"
    matches: '@pnpm/tsconfig'
    level: warning
    message: >-
      Each workspace member's tsconfig.json should extend
      `@pnpm/tsconfig`. Drift indicates a package with a custom
      TypeScript config; if intentional, add a comment in the
      tsconfig and exclude this rule.

  # ─────────────────────────────────────────────────────────────────
  # Per-package package.json shape (the meta-updater invariants
  # we CAN check without cross_file_value_equals):
  # - license: "MIT"
  # - type: "module"
  # - funding: "https://opencollective.com/pnpm"
  # - bugs.url: "https://github.com/pnpm/pnpm/issues"
  # - engines.node: ">=22.13"
  # - files: list including "lib"
  # ─────────────────────────────────────────────────────────────────
  - id: pnpm-package-license-mit
    when: facts.has_pnpm_workspace
    kind: json_path_matches
    paths: "{cache,cli,config,core,crypto,deps,engine,exec,fetching,fs,global,hooks,lockfile,network,object,patching,pkg-manager,pkg-manifest,registry-access,releasing,resolving,shell,store,testing,text,workspace,yaml,bins,building,catalogs,modules-mounter,worker,auth,agent}/*/package.json"
    path: "$.license"
    matches: '^MIT$'
    level: warning
    message: >-
      Every published pnpm workspace member should declare
      `"license": "MIT"`. The repo-root LICENSE is MIT; per-package
      drift is meta-updater's job to fix on the next
      `pn update-manifests`.

  - id: pnpm-package-type-module
    when: facts.has_pnpm_workspace
    kind: json_path_matches
    paths: "{cache,cli,config,core,crypto,deps,engine,exec,fetching,fs,global,hooks,lockfile,network,object,patching,pkg-manager,pkg-manifest,registry-access,releasing,resolving,shell,store,testing,text,workspace,yaml,bins,building,catalogs,modules-mounter,worker,auth,agent}/*/package.json"
    path: "$.type"
    matches: '^module$'
    level: warning
    message: >-
      Every workspace member should declare `"type": "module"`.
      The whole repo is ESM; CJS members break the import graph.

  - id: pnpm-package-funding
    when: facts.has_pnpm_workspace
    kind: json_path_matches
    paths: "{cache,cli,config,core,crypto,deps,engine,exec,fetching,fs,global,hooks,lockfile,network,object,patching,pkg-manager,pkg-manifest,registry-access,releasing,resolving,shell,store,testing,text,workspace,yaml,bins,building,catalogs,modules-mounter,worker,auth,agent}/*/package.json"
    path: "$.funding"
    matches: 'opencollective\.com/pnpm'
    level: info
    message: >-
      Every published workspace member should carry the
      OpenCollective funding URL. meta-updater regenerates this on
      every install; drift means the package was edited without
      running `pn update-manifests`.

  - id: pnpm-package-bugs-url
    when: facts.has_pnpm_workspace
    kind: json_path_matches
    paths: "{cache,cli,config,core,crypto,deps,engine,exec,fetching,fs,global,hooks,lockfile,network,object,patching,pkg-manager,pkg-manifest,registry-access,releasing,resolving,shell,store,testing,text,workspace,yaml,bins,building,catalogs,modules-mounter,worker,auth,agent}/*/package.json"
    path: "$.bugs.url"
    matches: '^https://github\.com/pnpm/pnpm/issues$'
    level: info
    message: >-
      Every workspace member should declare
      `"bugs": { "url": "https://github.com/pnpm/pnpm/issues" }`
      so npm-ecosystem `npm bugs <pkg>` deep-links to the right
      issue tracker.

  - id: pnpm-package-engines-node
    when: facts.has_pnpm_workspace
    kind: json_path_matches
    paths: "{cache,cli,config,core,crypto,deps,engine,exec,fetching,fs,global,hooks,lockfile,network,object,patching,pkg-manager,pkg-manifest,registry-access,releasing,resolving,shell,store,testing,text,workspace,yaml,bins,building,catalogs,modules-mounter,worker,auth,agent}/*/package.json"
    path: "$.engines.node"
    matches: '^>=22'
    level: warning
    message: >-
      Every workspace member should declare `engines.node:
      ">=22.x"`. The workspace standardised on Node 22 LTS; older
      Node versions are unsupported. meta-updater regenerates
      this — drift means the manifest was edited by hand.

  # ─────────────────────────────────────────────────────────────────
  # Per-package keywords[] convention: every published pnpm member
  # carries `pnpm` and `pnpm<major>` as the first two keywords
  # (meta-updater rewrites this on every install — see the
  # `manifest.keywords = ['pnpm', pnpmMajorKeyword, ...]` line in
  # `.meta-updater/src/index.ts`).
  # ─────────────────────────────────────────────────────────────────
  - id: pnpm-package-keywords-pnpm
    when: facts.has_pnpm_workspace
    kind: json_path_matches
    paths: "{cache,cli,config,core,crypto,deps,engine,exec,fetching,fs,global,hooks,lockfile,network,object,patching,pkg-manager,pkg-manifest,registry-access,releasing,resolving,shell,store,testing,text,workspace,yaml,bins,building,catalogs,modules-mounter,worker,auth,agent}/*/package.json"
    path: "$.keywords[0]"
    matches: '^pnpm$'
    level: info
    message: >-
      Every workspace member's `keywords[0]` should be the literal
      string `pnpm`. meta-updater rewrites this on every install
      (`manifest.keywords = ['pnpm', pnpmMajorKeyword, ...]`) — if
      this rule fires, the manifest was hand-edited and not
      regenerated.

  # ─────────────────────────────────────────────────────────────────
  # Per-package `repository:` field shape — must be the GitHub
  # tree URL pointing at the package's own subdir. meta-updater
  # rewrites this on every install (`manifest.repository =
  # https://github.com/pnpm/pnpm/tree/main/${relative}`).
  #
  # We can't verify the exact path matches `${dir}` without a
  # cross_file_value_equals rule, but we can verify the URL
  # *shape* is right.
  # ─────────────────────────────────────────────────────────────────
  - id: pnpm-package-repository-shape
    when: facts.has_pnpm_workspace
    kind: json_path_matches
    paths: "{cache,cli,config,core,crypto,deps,engine,exec,fetching,fs,global,hooks,lockfile,network,object,patching,pkg-manager,pkg-manifest,registry-access,releasing,resolving,shell,store,testing,text,workspace,yaml,bins,building,catalogs,modules-mounter,worker,auth,agent}/*/package.json"
    path: "$.repository"
    matches: '^https://github\.com/pnpm/pnpm/tree/main/'
    level: info
    message: >-
      Every workspace member's `repository` should be the GitHub
      tree URL pointing at its own subdir
      (`https://github.com/pnpm/pnpm/tree/main/<dir>`). meta-updater
      regenerates this — drift means the manifest was edited
      without running `pn update-manifests`.

  # ─────────────────────────────────────────────────────────────────
  # Per-package `homepage:` field shape — should be the GitHub
  # tree URL with `#readme` suffix for non-CLI packages. The CLI
  # package (`pnpm/`) has homepage = `https://pnpm.io` — special
  # case meta-updater handles. We only check the prevailing shape.
  # ─────────────────────────────────────────────────────────────────
  - id: pnpm-package-homepage-shape
    when: facts.has_pnpm_workspace
    kind: json_path_matches
    paths: "{cache,cli,config,core,crypto,deps,engine,exec,fetching,fs,global,hooks,lockfile,network,object,patching,pkg-manager,pkg-manifest,registry-access,releasing,resolving,shell,store,testing,text,workspace,yaml,bins,building,catalogs,modules-mounter,worker,auth,agent}/*/package.json"
    path: "$.homepage"
    matches: '^(https://github\.com/pnpm/pnpm/tree/main/|https://pnpm\.io)'
    level: info

  # ─────────────────────────────────────────────────────────────────
  # AGENTS.md presence + symlink shape (CLAUDE.md → AGENTS.md).
  # The repo uses AGENTS.md as the canonical doc and links
  # CLAUDE.md to it. The `agent-context@v1` bundled ruleset
  # already covers the AGENTS.md presence + stub-bloat checks;
  # this rule asserts the symlink stays in place.
  # ─────────────────────────────────────────────────────────────────
  - id: pnpm-claude-md-symlink-to-agents
    kind: file_exists
    paths: "CLAUDE.md"
    level: info
    message: >-
      `CLAUDE.md` should exist at the repo root (the pnpm convention
      is to symlink it to `AGENTS.md`). Without it, Claude Code's
      auto-discovery falls back to project memory rather than the
      curated agent guide.

  # ─────────────────────────────────────────────────────────────────
  # `.pnpmfile.cjs` — install-time hooks. The repo uses two:
  # `readPackage` (per-package adjustments) and `beforePacking`
  # (the load-bearing guard for the `pnpm` package — refuses to
  # publish if `peerDependencies`/`optionalDependencies` are non-
  # empty, since those don't bundle into the esbuild output).
  # ─────────────────────────────────────────────────────────────────
  - id: pnpm-pnpmfile-present
    kind: file_exists
    paths: ".pnpmfile.cjs"
    level: info

  - id: pnpm-pnpmfile-keeps-before-packing-guard
    kind: file_content_matches
    paths: ".pnpmfile.cjs"
    pattern: 'beforePacking'
    level: warning
    message: >-
      `.pnpmfile.cjs` should keep the `beforePacking` hook that
      rejects `pnpm` publishes when peerDependencies or
      optionalDependencies are non-empty. Without it, a stray
      addition silently breaks the bundled-publish flow at npm
      install time, not at publish time.

  # ─────────────────────────────────────────────────────────────────
  # FUNDING.json (project funding metadata in the GitHub-hosted
  # canonical location, distinct from .github/FUNDING.yml).
  # ─────────────────────────────────────────────────────────────────
  - id: pnpm-root-funding-json
    kind: file_exists
    paths: "FUNDING.json"
    level: info

  # ─────────────────────────────────────────────────────────────────
  # Workflow hygiene — these complement the `ci/github-actions@v1`
  # bundled overlay. The bundled rules cover the structural shape;
  # these rules verify the specific gates pnpm depends on stay in
  # place.
  # ─────────────────────────────────────────────────────────────────
  - id: pnpm-ci-workflow-runs-lint
    kind: file_content_matches
    paths: ".github/workflows/ci.yml"
    pattern: '(?m)^\s+- name: Lint'
    level: warning
    message: >-
      `.github/workflows/ci.yml` should keep the `Lint` step. The
      lint job chains compile + spellcheck + meta-updater + eslint;
      removing it drops the entire static-analysis stack from CI.

  - id: pnpm-ci-workflow-runs-compile
    kind: file_content_matches
    paths: ".github/workflows/ci.yml"
    pattern: '(?m)^\s+- name: Compile TypeScript'
    level: warning

  - id: pnpm-test-workflow-present
    kind: file_exists
    paths: ".github/workflows/test.yml"
    level: warning
    message: >-
      `.github/workflows/test.yml` is the reusable test workflow
      called from ci.yml. Without it, the matrix test job has
      nothing to invoke.

  - id: pnpm-audit-workflow-present
    kind: file_exists
    paths: ".github/workflows/audit.yml"
    level: warning
    message: >-
      `.github/workflows/audit.yml` runs `pn audit` on every push.
      Removing it lets transient supply-chain advisories slip in
      unnoticed.

  # ─────────────────────────────────────────────────────────────────
  # CODEOWNERS — pnpm uses GitHub CODEOWNERS to scope reviews
  # (general repo to @zkochan, sub-tree owners for license
  # scanning, hooks, etc.). If the file disappears, every PR
  # silently auto-routes to the default reviewer set.
  # ─────────────────────────────────────────────────────────────────
  - id: pnpm-codeowners-present
    kind: file_exists
    paths: ".github/CODEOWNERS"
    level: warning
    message: >-
      `.github/CODEOWNERS` should be present so PRs auto-request
      review from the right sub-tree owner. Without it, every PR
      goes to the org default and review SLAs slip.

  # ─────────────────────────────────────────────────────────────────
  # Shell out to the existing tools so a single `alint check` is
  # a drop-in replacement for `pn lint && pn lint:meta && pn audit`.
  # ─────────────────────────────────────────────────────────────────
  - id: pnpm-lint
    kind: command
    paths: "package.json"
    command: ["pnpm", "run", "lint"]
    timeout: 600
    level: error
    message: >-
      `pnpm run lint` failed (chains spellcheck + lint:meta +
      lint:ts via eslint). See README.md and `Herebyfile.mjs`
      analogue tasks in the root package.json.

  - id: pnpm-lint-meta
    kind: command
    paths: ".meta-updater/main.mjs"
    command: ["pnpm", "run", "lint:meta"]
    timeout: 600
    level: error
    message: >-
      `pnpm run lint:meta` failed — meta-updater detected
      cross-package field drift. Run `pnpm run update-manifests`
      to regenerate.

  - id: pnpm-spellcheck
    kind: command
    paths: "cspell.json"
    command: ["pnpm", "exec", "cspell", "**/*.ts", "**/README.md", ".changeset/*.md", "--no-progress"]
    timeout: 300
    level: warning
    message: >-
      `cspell` reported unknown words. Either fix the typo or add
      the term to `cspell.json#$.words`.

  - id: pnpm-audit
    kind: command
    paths: "pnpm-workspace.yaml"
    command: ["pnpm", "audit"]
    timeout: 600
    level: warning
    message: >-
      `pnpm audit` reported a supply-chain advisory. Either patch
      via `pnpm-workspace.yaml#overrides`, ignore via
      `auditConfig.ignoreGhsas`, or upgrade the affected dep.
