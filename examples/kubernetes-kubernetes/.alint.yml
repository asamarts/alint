# yaml-language-server: $schema=https://raw.githubusercontent.com/asamarts/alint/main/schemas/v1/config.json
#
# Proposed alint config for kubernetes/kubernetes — v0.11 capabilities.
# Re-analysis of the v0.9.17-era examples/kubernetes-kubernetes/.alint.yml.
#
# k8s validates almost entirely through hack/verify-*.sh (51 scripts) driven by
# Prow CI (NOT GitHub Actions — there is no .github/workflows/). Contribution is
# gated by EasyCLA (Linux Foundation), NOT DCO; PRs are NOT required to carry a
# Signed-off-by trailer, so git_commit_signed_off is intentionally OMITTED.
#
# What v0.11 newly unlocks over the v0.9.17 baseline (which listed 7 hard gaps):
#   - import_gate  -> the 66 .import-restrictions firewall + prometheus-imports
#                     + testing-import + staging publishing import-restrictions
#   - command_idempotent -> codegen / docs / openapi / vendor freshness (these
#                     MUTATE files, so --check/verify mode, not generated_file_fresh)
#   - scope_filter.changed_since -> PR-scope this 30k-file tree so per-PR runs
#                     only lint touched files (k8s's own scripts do the same).
#
# NOTE on the Apache-2 bundle: compliance/apache-2@v1 OVER-FIRES here. k8s uses
# a YEAR-substituted "Copyright YYYY The Kubernetes Authors." header (and, post
# 2025, a year-LESS form) — branded, not the canonical ASF appendix text — and
# has thousands of generated files that legitimately carry a generated-code
# header. There is also no top-level NOTICE in the ASF sense. We therefore do
# NOT extend apache-2@v1 and use bespoke file_header rules below.
#
# NOTE on ci/github-actions@v1: the v0.9.17 baseline extended it. k8s has NO
# .github/workflows/ (it runs on Prow). That bundle would no-op at best and
# mislead at worst — DROPPED.

version: 1

extends:
  - alint://bundled/oss-baseline@v1   # README/LICENSE/.gitignore hygiene
  - alint://bundled/go@v1             # go.mod/go.sum sanity, go hygiene
  - alint://bundled/hygiene/no-tracked-artifacts@v1
  # DROPPED vs baseline: ci/github-actions@v1 (no .github/workflows/),
  #                      compliance/apache-2@v1 (branded header over-fires).

rules:
  # ════════════════════════════════════════════════════════════════════
  # BOILERPLATE — verify-boilerplate.sh + hack/boilerplate/*.txt
  # Per-language Apache-2 headers. The k8s template substitutes YEAR; real
  # files carry "Copyright 2015 The Kubernetes Authors." Post-2025, NEW files
  # carry the year-LESS form, so the year group is OPTIONAL: ([0-9]{4} )?
  # ════════════════════════════════════════════════════════════════════
  - id: k8s-go-license-header                 # boilerplate.go.txt + generatego.txt
    kind: file_header
    paths: "**/*.go"
    scope_filter:
      changed_since: "{{env.ALINT_BASE_REF | default('origin/master')}}"
    # |- strips the trailing newline (baseline pitfall #22): real headers
    # continue with ` (the "License");` on the same line.
    pattern: |-
      ^/\*
      Copyright ([0-9]{4} )?The Kubernetes Authors\.

      Licensed under the Apache License, Version 2\.0
    level: error

  - id: k8s-shell-license-header              # boilerplate.sh.txt
    kind: file_header
    paths: "**/*.sh"
    pattern: |-
      (?m)^# Copyright ([0-9]{4} )?The Kubernetes Authors\.
      #
      # Licensed under the Apache License, Version 2\.0
    level: error

  - id: k8s-python-license-header             # boilerplate.py.txt
    kind: file_header
    paths: "**/*.py"
    pattern: |-
      (?m)^# Copyright ([0-9]{4} )?The Kubernetes Authors\.
      #
      # Licensed under the Apache License, Version 2\.0
    level: error

  - id: k8s-dockerfile-license-header         # boilerplate.Dockerfile.txt
    kind: file_header
    paths: "**/Dockerfile"
    pattern: |-
      (?m)^# Copyright ([0-9]{4} )?The Kubernetes Authors\.
      #
      # Licensed under the Apache License, Version 2\.0
    level: error

  # Guard: the literal token "YEAR" must never survive into a real file
  # (verify-boilerplate.sh checks this — the template placeholder leaked in).
  - id: k8s-no-literal-year-token
    kind: file_content_forbidden
    paths:
      include: ["**/*.go", "**/*.sh", "**/*.py"]
      exclude: ["hack/boilerplate/**", "vendor/**", "**/testdata/**"]
    pattern: 'Copyright YEAR The Kubernetes Authors'
    level: error

  # ════════════════════════════════════════════════════════════════════
  # IMPORT FIREWALL — the HEADLINE win. v0.11 import_gate replaces all of:
  #   verify-imports.sh / verify-import-boss.sh   (66 .import-restrictions files)
  #   verify-prometheus-imports.sh
  #   verify-testing-import.sh
  #   staging/publishing/import-restrictions.yaml (verify-publishing-bot.sh arm)
  #
  # import_gate uses preset language: go (parses Go import blocks). forbid: is a
  # SINGLE anchored regex; allow: is a list of regexes. The k8s .import-restrictions
  # files are per-package allow/forbid prefix lists — each maps to one import_gate
  # rule scoped via paths:. Below are the structurally important ones; a full
  # port would generate one rule per .import-restrictions file (a registry-driven
  # form — see NEW-RULE-KIND CANDIDATES in the report — would be far cleaner than
  # 66 hand-written rules).
  # ════════════════════════════════════════════════════════════════════

  # pkg/.import-restrictions: pkg/ must not depend on cmd/, ghodss/yaml, sctp,
  # or kubectl/pkg/scheme.
  - id: k8s-pkg-import-firewall
    kind: import_gate
    language: go
    paths:
      include: ["pkg/**/*.go"]
      exclude: ["pkg/kubemark/**"]   # pkg/kubemark overrides (allows cmd/kubelet/app)
    forbid: '^(k8s\.io/kubernetes/cmd|github\.com/ghodss/yaml|github\.com/ishidawataru/sctp|k8s\.io/kubectl/pkg/scheme)(/.*)?$'
    level: error

  # pkg/printers/.import-restrictions: discourage pkg/api & pkg/apis/.
  - id: k8s-printers-import-firewall
    kind: import_gate
    language: go
    paths: "pkg/printers/**/*.go"
    forbid: '^k8s\.io/kubernetes/pkg/(api$|apis/.*)$'
    level: warning

  # test/integration/.import-restrictions: integration tests must not import e2e
  # (with a handful of allowed helper packages).
  - id: k8s-integration-no-e2e-import
    kind: import_gate
    language: go
    paths: "test/integration/**/*.go"
    forbid: '^k8s\.io/kubernetes/test/e2e(/.*)?$'
    allow:
      - '^k8s\.io/kubernetes/test/e2e/framework/(pod|daemonset)(/.*)?$'
      - '^k8s\.io/kubernetes/test/e2e/dra/utils$'
      - '^k8s\.io/kubernetes/test/e2e/invariants/metrics$'
    level: error

  # verify-testing-import.sh: production (non-_test.go) code must not import
  # the stdlib testing package. import_gate's paths excludes the test files.
  - id: k8s-no-testing-import-in-prod
    kind: import_gate
    language: go
    paths:
      include: ["**/*.go"]
      exclude: ["**/*_test.go", "vendor/**", "**/testing/**", "**/test/**"]
    forbid: '^testing$'
    level: error

  # verify-prometheus-imports.sh: only an allowlisted set may import prometheus
  # client_golang directly (everything else must go via component-base/metrics).
  - id: k8s-prometheus-import-firewall
    kind: import_gate
    language: go
    paths:
      include: ["pkg/**/*.go", "cmd/**/*.go"]
      exclude: ["**/*_test.go", "staging/**"]
    forbid: '^github\.com/prometheus/client_golang(/.*)?$'
    level: warning   # advisory: full allowlist lives in the script; tune paths

  # ════════════════════════════════════════════════════════════════════
  # CODEGEN / GENERATED-FILE FRESHNESS — these generators MUTATE the tree,
  # so command_idempotent in verify/--check mode (NOT generated_file_fresh,
  # which only diffs stdout). Each shells out to the existing update-*.sh in a
  # mode that exits non-zero if files would change. PR-scoped & costly -> high
  # timeouts. These remain shell wrappers; alint just orchestrates + gates them.
  # ════════════════════════════════════════════════════════════════════
  - id: k8s-codegen-fresh                     # verify-codegen.sh
    kind: command_idempotent
    command: ["hack/verify-codegen.sh"]
    timeout: 1800
    level: error

  - id: k8s-generated-docs-fresh              # verify-generated-docs.sh
    kind: command_idempotent
    command: ["hack/verify-generated-docs.sh"]
    timeout: 600
    level: error

  - id: k8s-openapi-spec-fresh                # verify-openapi-spec.sh
    kind: command_idempotent
    command: ["hack/verify-openapi-spec.sh"]
    timeout: 600
    level: error

  - id: k8s-vendor-fresh                      # verify-vendor.sh (diffs go.mod/sum)
    kind: command_idempotent
    command: ["hack/verify-vendor.sh"]
    timeout: 900
    level: error

  - id: k8s-generated-stable-metrics-fresh    # verify-generated-stable-metrics.sh
    kind: command_idempotent
    command: ["hack/verify-generated-stable-metrics.sh"]
    timeout: 600
    level: error

  # ════════════════════════════════════════════════════════════════════
  # gofmt / govet / per-tool fan-out — command_idempotent (gofmt -l prints the
  # offenders; files_from parses them into per-file violations).
  # ════════════════════════════════════════════════════════════════════
  - id: k8s-gofmt                             # verify-gofmt.sh
    kind: command_idempotent
    command: ["hack/verify-gofmt.sh"]
    files_from: stdout
    files_pattern: '^(.+\.go)$'
    timeout: 300
    level: error

  - id: k8s-golangci-lint                     # verify-golangci-lint.sh
    kind: command_idempotent
    command: ["hack/verify-golangci-lint.sh"]
    timeout: 1800
    level: error

  - id: k8s-shellcheck                        # verify-shellcheck.sh
    kind: command_idempotent
    command: ["hack/verify-shellcheck.sh"]
    timeout: 300
    level: error

  - id: k8s-spelling                          # verify-spelling.sh
    kind: command_idempotent
    command: ["hack/verify-spelling.sh"]
    timeout: 300
    level: warning

  - id: k8s-owners-fmt                         # verify-owners-fmt.sh
    kind: command_idempotent
    command: ["hack/verify-owners-fmt.sh"]
    timeout: 120
    level: error

  # ════════════════════════════════════════════════════════════════════
  # STRUCTURED CONFIG CHECKS
  # ════════════════════════════════════════════════════════════════════
  # verify-golangci-lint-config.sh — hack/golangci.yaml is well-formed and has
  # a run: section. (.golangci.yml is NOT at repo root in k8s; it lives in hack/.)
  - id: k8s-golangci-config-shape
    kind: yaml_path_matches
    paths: "hack/golangci.yaml"
    path: "$.run"
    matches: ".+"
    level: error

  # ════════════════════════════════════════════════════════════════════
  # STAGING REPO STRUCTURE — verify-staging-meta-files.sh
  # Every staging package carries the meta files the publishing-bot needs.
  # ════════════════════════════════════════════════════════════════════
  - id: k8s-staging-meta-files
    kind: for_each_dir
    select: "staging/src/k8s.io/*"
    require:
      - kind: file_exists
        paths: "{path}/OWNERS"
      - kind: file_exists
        paths: "{path}/README.md"
      - kind: file_exists
        paths: "{path}/LICENSE"
      - kind: file_exists
        paths: "{path}/SECURITY_CONTACTS"
      - kind: file_exists
        paths: "{path}/code-of-conduct.md"
      - kind: file_exists
        paths: "{path}/.github/PULL_REQUEST_TEMPLATE.md"
    level: error

  # verify-pkg-names.sh — Go package names lowercase, no underscores.
  - id: k8s-go-package-names
    kind: file_content_matches
    paths: "**/*.go"
    scope_filter:
      changed_since: "{{env.ALINT_BASE_REF | default('origin/master')}}"
    pattern: '(?m)^package [a-z][a-z0-9]*$'
    level: error

  # verify-file-sizes.sh — files > 1MiB need allowlisting.
  - id: k8s-file-max-1mb
    kind: file_max_size
    paths:
      include: ["**/*"]
      exclude: ["vendor/**", "**/testdata/**", "docs/**/*.png"]
    max_bytes: 1048576
    level: warning

  # verify-mocks.sh (partial) — mock files pair with their source.
  - id: k8s-mock-source-pair
    kind: pair
    primary: "**/mocks/mock_*.go"
    partner: "{dir}/../{stem}.go"
    level: warning

# ══════════════════════════════════════════════════════════════════════
# GENUINE NON-REPLACEABLES (stay on hack/verify-*.sh; alint can ORCHESTRATE
# some via command_idempotent but cannot REPLACE the semantic engine):
#   - verify-govet / verify-typecheck    : full Go type/semantic analysis.
#   - verify-import-aliases.sh           : per-import PREFERRED-ALIAS map
#       (hack/.import-aliases). import_gate gates WHICH imports are allowed,
#       not what local NAME they're bound to — out of scope. NEW-KIND candidate.
#   - verify-internal-modules.sh         : Go `internal/` visibility semantics.
#   - verify-no-vendor-cycles.sh         : import-graph cycle detection.
#   - verify-deadcode-elimination.sh     : linker/binary analysis.
#   - verify-conformance-* / verify-test-*: test EXECUTION + AST inspection.
#   - verify-metrics-naming.sh           : AST-aware metric-name extraction.
#   - verify-readonly-packages.sh        : vendor entry hash vs pin (pair_hash
#       could approximate go.sum-style sums-line checks, but the real check is
#       go-module-graph aware — left on the script).
#   - verify-publishing-bot.sh           : staging->published repo CONTENT sync
#       (the actual git-subtree mirror; only the import-restriction arm ports).
#   - The staging-repo content sync + all test execution are fundamentally
#     out of a linter's remit.
#
# CONTRIBUTION GATING: EasyCLA (Linux Foundation), not DCO. k8s does NOT require
# Signed-off-by, so git_commit_signed_off is deliberately unused. EasyCLA status
# is a GitHub status check from an external bot — alint cannot replicate it.
# ══════════════════════════════════════════════════════════════════════
