# yaml-language-server: $schema=https://raw.githubusercontent.com/asamarts/alint/main/schemas/v1/config.json
#
# Proposed alint config for nodejs/node — RE-ANALYSIS against alint v0.10/v0.11.
#
# Supersedes examples/nodejs-node/.alint.yml (v0.9.17 era). The big shifts
# since that baseline:
#   * per-language `make lint-*` fan-outs migrate from `kind: command`
#     (re-runs the tool per matched file) to `kind: command_idempotent`
#     (one batched invocation + structured offender parsing) — collapses
#     ~9 per-file shellouts into single-shot whole-tree checks.
#   * README collaborator/TSC/triager list ordering (today only
#     tools/lint-readme-lists.mjs enforces it) -> `ordered_block`.
#   * tools/dep_updaters/update-<lib>.sh <-> deps/<lib>/ -> registry_paths_resolve
#     (PARTIAL — name mismatches; see note).
#   * eslint-rule registration cross-check stays a GAP (see non-replaceables).
#   * the strict node commit-subject grammar is a genuine NEW-KIND need.
#
# CORRECTION vs the v0.9.17 baseline: node does NOT use an SPDX/license
# file_header convention. Only 2 files under src/ carry SPDX-License-Identifier;
# the LICENSE aggregate is built by tools/license-builder.sh from vendored
# deps' license text. So NO file_header rule here — that mapping was wrong.

version: 1

extends:
  - alint://bundled/oss-baseline@v1
  - alint://bundled/node@v1
  - alint://bundled/ci/github-actions@v1
  - alint://bundled/hygiene/no-tracked-artifacts@v1
  - alint://bundled/tooling/editorconfig@v1

facts:
  - id: has_node_src
    any_file_exists: [src/node.h, src/node.cc]

rules:
  # ====================================================================
  # 1. PER-LANGUAGE LINT FAN-OUT  ->  command_idempotent  (BIGGEST WIN)
  # --------------------------------------------------------------------
  # The v0.9.17 config ran each tool with `kind: command` and `{path}`,
  # spawning the linter once per file. command_idempotent runs the tool
  # ONCE over its tree and parses the offender list, so eslint/ruff/etc.
  # warm their caches a single time. `files_from: stdout` +
  # `files_pattern:` turn each reported path into a per-file violation.
  # ====================================================================

  - id: node-eslint
    # `make lint-js` — eslint over lib/ test/ tools/ benchmark/ + doc/*.md.
    # The 30 custom AST rules in tools/eslint-rules/ run INSIDE this eslint
    # invocation via the per-tier config partials (NOT replaced by alint).
    when: facts.has_node_src
    kind: command_idempotent
    command: ["npx", "eslint", "--format", "unix", "lib", "test", "tools", "benchmark", "doc"]
    files_from: stdout
    files_pattern: '^([^:]+):[0-9]+:[0-9]+:'
    timeout: 300
    level: warning
    scope_filter:
      changed_since: "{{env.ALINT_BASE_REF | default('origin/main')}}"

  - id: node-cpplint
    # `make lint-cpp` — tools/cpplint.py (node's fork) + .cpplint filter.
    # AST-aware C++ parsing; alint only schedules the run.
    when: facts.has_node_src
    kind: command_idempotent
    command: ["python3", "tools/cpplint.py", "--recursive", "src"]
    files_from: stdout
    files_pattern: '^([^:]+):[0-9]+:'
    timeout: 120
    level: warning

  - id: node-ruff
    # `make lint-py` — ruff check, config from pyproject.toml [tool.ruff].
    when: facts.has_node_src
    kind: command_idempotent
    command: ["ruff", "check", "--output-format", "concise", "."]
    files_from: stdout
    files_pattern: '^([^:]+):[0-9]+:[0-9]+:'
    timeout: 120
    level: warning

  - id: node-yamllint
    # `make lint-yaml` — yamllint over the tree.
    when: facts.has_node_src
    kind: command_idempotent
    command: ["yamllint", "--format", "parsable", "."]
    files_from: stdout
    files_pattern: '^([^:]+):[0-9]+:[0-9]+:'
    timeout: 60
    level: warning

  - id: node-shellcheck
    # `make lint-sh` (tools/lint-sh.mjs drives shellcheck).
    when: facts.has_node_src
    kind: command_idempotent
    command: ["bash", "-c", "shellcheck -x -f gcc $(git ls-files '*.sh' | grep -v '^deps/')"]
    files_from: stdout
    files_pattern: '^([^:]+):[0-9]+:[0-9]+:'
    timeout: 120
    level: warning

  - id: node-lint-md
    # `make lint-md` — tools/lint-md/lint-md.mjs (remark-preset-lint-node,
    # ~50 markdown AST rules). One batched run over the doc corpus.
    when: facts.has_node_src
    kind: command_idempotent
    command: ["node", "tools/lint-md/lint-md.mjs"]
    files_from: stdout
    files_pattern: '^\s*([^\s:]+\.md)'
    timeout: 180
    level: warning

  - id: node-clang-format
    # `make format-cpp` (diff-scoped in CI). Whole-tree dry-run here.
    when: facts.has_node_src
    kind: command_idempotent
    command: ["bash", "-c", "git ls-files 'src/*.cc' 'src/*.h' | grep -v inspector_protocol | xargs clang-format --dry-run --Werror"]
    timeout: 120
    level: info

  # ====================================================================
  # 2. README MEMBER-LIST ORDERING  ->  ordered_block  (NEWLY REPLACEABLE)
  # --------------------------------------------------------------------
  # tools/lint-readme-lists.mjs asserts the TSC/Collaborator/Triager
  # lists are alphabetical (case-insensitive on the GitHub handle) AND
  # cross-checks them against live GitHub teams. The ALPHABETICAL-ORDER
  # half is now expressible as ordered_block; the live-GitHub-team
  # membership half is NOT (network + auth) and stays in the mjs tool.
  #
  # Each list sits between a `### <Name>` heading and the next heading;
  # entries are `* [handle](https://github.com/handle) -`. We anchor on
  # the bullet form. NOTE: ordered_block sorts the WHOLE block region
  # lexically; node sorts case-insensitively on the handle, which is a
  # close-but-not-identical comparator — treat as a warning backstop to
  # the authoritative mjs tool, not a replacement of its handle-extraction.
  # ====================================================================

  - id: node-readme-collaborator-order
    when: facts.has_node_src
    kind: ordered_block
    paths: "README.md"
    start: '^### Collaborators$'
    end: '^#### Collaborator emeriti$'
    level: warning
    message: |
      The Collaborators list in README.md must stay alphabetical by
      GitHub handle. Authoritative check is tools/lint-readme-lists.mjs
      (which also verifies live @nodejs/collaborators membership); this
      is a fast PR-time backstop for the ordering half only.

  - id: node-readme-tsc-order
    when: facts.has_node_src
    kind: ordered_block
    paths: "README.md"
    start: "#### TSC voting members"
    end: "#### TSC regular members"
    select: '^\* \['
    comparator: lexical-ci
    level: warning
    message: "TSC voting members in README.md must stay alphabetical (backstop to lint-readme-lists.mjs)."

  # ====================================================================
  # 3. dep_updaters/update-<lib>.sh  <->  deps/<lib>/  (PARTIAL via registry_paths_resolve)
  # --------------------------------------------------------------------
  # Each tools/dep_updaters/update-<lib>.sh should correspond to a
  # vendored deps/<lib>/ tree. registry_paths_resolve can assert the
  # update scripts resolve to real paths — BUT node's names don't map
  # 1:1 (c-ares -> deps/cares, libuv -> deps/uv, icu -> deps/icu-small,
  # LIEF -> deps/LIEF). So a literal glob expansion would false-positive.
  # We instead assert the INVERSE direction that DOES map cleanly: the
  # dep_updaters directory's own helper files resolve. The full
  # bidirectional <-> mapping needs an alias table alint doesn't model;
  # kept as a documented partial. (Was listed as a flat GAP in v0.9.17;
  # now PARTIALLY addressable.)
  # ====================================================================

  - id: node-dep-updaters-utils-resolve
    when: facts.has_node_src
    kind: registry_paths_resolve
    source: tools/dep_updaters/utils.sh
    extract:
      regex: 'deps/([A-Za-z0-9_-]+)/'
    base: deps
    entries_are_globs: true
    expect: dir
    level: info
    message: |
      Paths referenced from tools/dep_updaters/ should resolve to real
      deps/<lib>/ trees. PARTIAL: node's script<->dir name mapping is
      aliased (c-ares/cares etc.) and not fully modellable here.

  # ====================================================================
  # 4. COMMIT HYGIENE  ->  git_commit_no_fixup  (NEWLY REPLACEABLE, v0.11)
  # --------------------------------------------------------------------
  # node uses NO DCO (signed_off N/A). It lands squashed commits, so a
  # `fixup!`/`squash!` reaching main is always a mistake. The strict
  # SUBJECT grammar (`subsystem: lower-case desc` <=72 cols) is checked
  # by core-validate-commit and is the NEW-KIND candidate below.
  # ====================================================================

  - id: node-no-fixup-commits
    when: facts.has_node_src
    kind: git_commit_no_fixup
    level: error
    scope_filter:
      changed_since: "{{env.ALINT_BASE_REF | default('origin/main')}}"
    message: "fixup!/squash! commits must be squashed before landing (node lands clean, squashed history)."

  # ====================================================================
  # 5. STRUCTURAL ASSERTIONS retained from the v0.9.17 baseline
  #    (these were already optimal; carried forward, lightly trimmed)
  # ====================================================================

  - id: node-test-filename-grammar
    # tools/test.py discovers tests by `test-*.{js,mjs,cjs}` glob; a
    # misnamed file silently drops out. Enforced statically NOWHERE today.
    kind: filename_regex
    paths:
      include:
        - "test/parallel/*.{js,mjs,cjs}"
        - "test/sequential/*.{js,mjs,cjs}"
        - "test/async-hooks/*.{js,mjs,cjs}"
        - "test/es-module/*.{js,mjs,cjs}"
        - "test/known_issues/*.{js,mjs,cjs}"
      exclude:
        - "test/*/index.{js,mjs,cjs}"
        - "test/*/common.{js,mjs,cjs}"
        - "test/*/eslint.config_partial.mjs"
        - "test/async-hooks/{hook-checks,init-hooks,verify-graph}.js"
    pattern: '^test-[A-Za-z0-9][A-Za-z0-9_.-]*\.(js|mjs|cjs)$'
    level: error

  - id: node-changelog-per-major-filename
    kind: filename_regex
    paths:
      include: ["doc/changelogs/CHANGELOG_*.md"]
    pattern: '^CHANGELOG_(V[0-9]+|V010|V012|IOJS|ARCHIVE)\.md$'
    level: error

  - id: node-version-header-present
    kind: file_exists
    paths: "src/node_version.h"
    level: error

  - id: node-version-header-macros
    kind: file_content_matches
    paths: "src/node_version.h"
    pattern: '(?m)^#define\s+NODE_MAJOR_VERSION\s+[0-9]+'
    level: error
    message: "src/node_version.h must define the canonical version macros read by the release pipeline."

  - id: node-governance-files-present
    kind: file_exists
    paths:
      - "GOVERNANCE.md"
      - "CODE_OF_CONDUCT.md"
      - "BUILDING.md"
      - "SECURITY.md"
      - "onboarding.md"
    root_only: true
    level: error

  - id: node-build-files-present
    kind: file_exists
    paths: ["configure", "configure.py", "Makefile", "common.gypi", "node.gyp", "node.gypi"]
    root_only: true
    level: error

  - id: node-lint-md-remark-preset-pinned
    kind: json_path_matches
    paths: "tools/lint-md/package.json"
    path: "$.dependencies['remark-preset-lint-node']"
    matches: '^[\^~]?[0-9]+\.[0-9]+\.[0-9]+$'
    level: error

  - id: node-pyproject-has-ruff-section
    kind: toml_path_matches
    paths: "pyproject.toml"
    path: "$.tool.ruff['target-version']"
    matches: '^py3[0-9]+$'
    level: warning

  - id: node-tsconfig-strict
    kind: json_path_equals
    paths: "tsconfig.json"
    path: "$.compilerOptions.strict"
    equals: true
    level: warning

  - id: node-workflow-actions-pinned-by-sha
    kind: yaml_path_matches
    paths:
      include: [".github/workflows/*.yml", ".github/workflows/*.yaml"]
    path: "$.jobs.*.steps[?match(@.uses, '^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+@')].uses"
    matches: '^[A-Za-z0-9_./-]+@[0-9a-f]{40}$'
    if_present: true
    level: error

# ======================================================================
# GENUINE NON-REPLACEABLES  (and WHY)
# ----------------------------------------------------------------------
#   - tools/eslint-rules/*  (30 custom TSESTree AST visitors:
#     prefer-primordials, alphabetize-errors, must-call-assert, ...).
#     AST analysis is alint's deliberate non-goal. Runs inside `node-eslint`.
#
#   - tools/cpplint.py + tools/checkimports.py — parse C++ (style +
#     using-declaration freshness). AST-aware. Run inside `node-cpplint`.
#
#   - C++ compile / `make test` / `tools/test.py` — execution, not
#     static structure. Out of scope by definition.
#
#   - core-validate-commit METADATA-LINE semantics (PR-URL:, Reviewed-By:,
#     Fixes:, Refs: trailer validation, subsystem-name validity). The
#     `--no-validate-metadata` flag node passes shows even node skips the
#     trailer half at PR time. The SUBJECT grammar is the new-kind below;
#     the trailer/subsystem semantics stay in core-validate-commit.
#
#   - tools/lint-readme-lists.mjs LIVE GITHUB TEAM cross-check — needs the
#     GitHub API + auth. Only the alphabetical-ordering half is replaced
#     (ordered_block above).
#
#   - tools/lint-pr-url.mjs — operates on the PR-time `git diff`, asserting
#     doc/api pr-url: strings match the current PR URL. Diff-aware + needs
#     the PR number; stays in commit-queue.
#
#   - tools/find-inactive-{collaborators,tsc}.mjs — walk `git log` history.
#     alint sees one tree snapshot. Stay as cron workflows.
#
#   - tools/license-builder.sh — REGENERATES LICENSE by scraping vendored
#     deps' license text + sed. A generator, not a checker. Could be wrapped
#     in generated_file_fresh IF it had a stable --check mode, but it mutates
#     LICENSE in place and pulls from deps/ at arbitrary paths — left as the
#     license-builder.yml cron.
#
#   - lint-release-proposal.yml release-commit title/trailer grammar +
#     `gh pr view` head-SHA equality — needs gh + PR context. Stays in CI.
#
# NEW RULE-KIND CANDIDATES (file upstream):
#   * git_commit_subject_matches  (HIGHEST VALUE) — node's commit subject
#     grammar `subsystem[,subsystem]: <lower-case description>` <=72 cols
#     is THE canonical strong-convention target. core-validate-commit owns
#     it today; a regex-on-subject + max-length kind (mirroring
#     git_commit_no_fixup's dispatch) would let alint enforce the subject
#     half at PR time without the heavyweight tool. No such kind exists.
#   * registry alias-table — registry_paths_resolve with a name-rewrite map
#     (c-ares->cares) would close the dep_updaters<->deps gap fully.
#   * generated_file_fresh with an in-place-mutating generator + diff
#     (license-builder.sh shape) — current kind needs a non-mutating
#     stdout-producing command.
# ======================================================================
