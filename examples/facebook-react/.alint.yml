# yaml-language-server: $schema=https://raw.githubusercontent.com/asamarts/alint/main/schemas/v1/config.json
#
# Proposed alint config for facebook/react — v0.11-era rewrite of the
# v0.9.17-era example at examples/facebook-react/.alint.yml.
#
# react is a Yarn classic v1 multi-package monorepo (39 packages under
# packages/*; 22 publish to npm) plus a self-contained compiler/ workspace.
# The structural-validation surface lives in:
#
#   CI workflows (.github/workflows/, 23 files):
#     - shared_lint.yml: 4 jobs
#         prettier            -> yarn prettier-check
#         eslint              -> node ./scripts/tasks/eslint
#         check_license       -> ./scripts/ci/check_license.sh (git grep PATENTS)
#         test_print_warnings -> ./scripts/ci/test_print_warnings.sh
#     - compiler_typescript.yml: lint/jest/test of compiler/ workspaces
#     - runtime_*, devtools_*, shared_* : build/test/release/label/stale jobs
#     - convention: file-name + name: category prefix (Runtime/Compiler/DevTools/Shared)
#     - convention: every workflow declares `permissions: {}` at top scope
#   package.json scripts: lint, linc, prettier(-all/-check), flow, flow-ci,
#     version-check, extract-errors, lint-build, test*, flags
#   scripts/eslint-rules/ : the in-tree eslint-plugin-react-internal (5 AST rules)
#   scripts/error-codes/codes.json : ~600-entry append-only numeric registry
#   scripts/git/pre-commit : eslint on staged *.js
#   dangerfile.js : PR-diff bundle-size report (Danger JS)
#   configs: .eslintrc.js, .eslintignore, .prettierrc.js, .prettierignore,
#     .nvmrc, .gitattributes, .editorconfig, ReactVersions.js,
#     packages/shared/ReactVersion.js, MAINTAINERS
#
# This config replaces the STRUCTURAL gates and shells out to the tool-driven
# ones (eslint/prettier/flow) via spawn-class rules so one `alint check` is a
# drop-in for `yarn lint && yarn prettier-check && yarn flow-ci` plus a
# structural floor. The genuine semantic analysers (the 5 AST eslint rules,
# flow, jest, print-warnings, dangerfile) remain in their own tools — see the
# NON-REPLACEABLE section at the bottom for why.

version: 1

extends:
  - alint://bundled/oss-baseline@v1
  - alint://bundled/node@v1
  - alint://bundled/monorepo@v1
  - alint://bundled/ci/github-actions@v1
  - alint://bundled/hygiene/no-tracked-artifacts@v1
  - alint://bundled/tooling/editorconfig@v1

facts:
  # Two-fact gate: most rules below assume react's shape (Yarn classic v1
  # workspace publishing the `react` family). Outside that shape the rules
  # silently no-op so a fork that strips the workspace block isn't flooded.
  - id: is_yarn_v1
    file_content_matches:
      paths: package.json
      pattern: '"packageManager"\s*:\s*"yarn@1\.'
  - id: has_react_package
    file_content_matches:
      paths: packages/react/package.json
      pattern: '"name"\s*:\s*"react"'

rules:
  # ===================================================================
  # NEW IN v0.10: cross_file_value_equals  — REPLACES version-check.js
  # -------------------------------------------------------------------
  # scripts/tasks/version-check.js asserts the ReactVersion source string
  # (export default '<semver>') equals the `version` field in three
  # package.jsons. This is the canonical cross-source-of-truth equality the
  # v0.9.17 example explicitly listed as a non-replaceable (it shelled out to
  # `yarn version-check`). v0.10's cross_file_value_equals expresses it
  # natively: pull the version from ReactVersion.js via a capture-group regex
  # and require the three manifests' $.version to match it.
  # ===================================================================
  - id: react-version-cross-file-equal
    when: facts.is_yarn_v1 and facts.has_react_package
    kind: cross_file
    source:
      file: packages/shared/ReactVersion.js
      # ReactVersion.js is JS, not structured; extract the semver with the
      # same regex version-check.js uses (`export default '([^']+)';`).
      extract:
        regex: "export default '([^']+)';"
    targets:
      - file: packages/react/package.json
        extract: { json: "$.version" }
      - file: packages/react-dom/package.json
        extract: { json: "$.version" }
      - file: packages/react-test-renderer/package.json
        extract: { json: "$.version" }
    level: error
    message: >-
      The version exported by packages/shared/ReactVersion.js must equal the
      `version` field in react, react-dom, and react-test-renderer
      package.json. This is exactly what `yarn version-check` enforces; now
      a static cross-file equality instead of a node shell-out.

  # ===================================================================
  # NEW IN v0.10: cross_file_value_equals — ReactVersions.js consistency
  # -------------------------------------------------------------------
  # ReactVersions.js sets `const ReactVersion = '<semver>'` and then assigns
  # several stablePackages entries to that same constant. The constant must
  # equal packages/shared/ReactVersion.js's export (they are conceptually one
  # source of truth, split across two files for build vs publish). No bespoke
  # check enforces this today — only human review of a release PR.
  # ===================================================================
  - id: react-versions-file-matches-source
    when: facts.is_yarn_v1 and facts.has_react_package
    kind: cross_file
    source:
      file: ReactVersions.js
      extract:
        regex: "const ReactVersion = '([^']+)';"
    targets:
      - file: packages/shared/ReactVersion.js
        extract:
          regex: "export default '([^']+)';"
    level: error
    message: >-
      ReactVersions.js `const ReactVersion` must equal
      packages/shared/ReactVersion.js's exported default. The release
      pipeline (ReactVersions.js) and the runtime version (ReactVersion.js)
      drift apart silently otherwise.

  # codes.json shape — flat { "<digits>": "<msg>" } map. Unchanged from the
  # v0.9.17 baseline; the AST `prod-error-codes` rule + transform-error-messages
  # babel pass both depend on this shape.
  - id: react-error-codes-json-keys-numeric
    when: facts.is_yarn_v1 and facts.has_react_package
    kind: json_path_matches
    paths: scripts/error-codes/codes.json
    path: "$.*"
    matches: '.+'
    level: error
    message: >-
      codes.json must be a flat object mapping numeric IDs to message
      templates. prod-error-codes (eslint) and transform-error-messages
      (babel) depend on this shape.

  - id: react-error-codes-json-no-comments
    when: facts.is_yarn_v1 and facts.has_react_package
    kind: file_content_forbidden
    paths: scripts/error-codes/codes.json
    pattern: '(?m)^\s*//'
    level: error
    message: >-
      codes.json is plain JSON (JSON.parse'd by prod-error-codes.js);
      JSONC-style comments throw at lint time.

  # ===================================================================
  # NEW IN v0.11: git_commit_signed_off / no_fixup — REPLACES the
  # commit-hygiene side of the pre-commit hook + maintainer review.
  # -------------------------------------------------------------------
  # react squash-merges; stray `fixup!`/`squash!` commits should never land on
  # main. git_commit_no_fixup catches them declaratively. (Sign-off / DCO is
  # NOT enforced by react today, so we don't add git_commit_signed_off.)
  # scope_filter.changed_since grandfathers history: only fire on the PR range.
  # ===================================================================
  - id: react-no-fixup-commits
    when: facts.is_yarn_v1 and facts.has_react_package
    kind: git_commit_no_fixup
    scope_filter:
      changed_since: "{{env.GITHUB_BASE_REF | default('origin/main')}}"
    level: error
    message: >-
      No `fixup!`/`squash!` commits in the PR range — squash them before
      review. Replaces the implicit "clean history" maintainer expectation.

  # ===================================================================
  # PATENTS guard — REPLACES scripts/ci/check_license.sh AND scripts/git/
  # pre-commit's PATENTS half. The 2017 Meta relicense removed PATENTS; the
  # shell script greps that ONLY check_license.sh mentions it. Stated
  # declaratively (script + lockfile + changelog excluded).
  # ===================================================================
  - id: react-no-patents-references
    when: facts.is_yarn_v1 and facts.has_react_package
    kind: file_content_forbidden
    paths:
      include:
        - "**/*.md"
        - "**/*.txt"
        - "**/*.js"
        - "**/*.json"
        - "**/*.ts"
        - "**/*.tsx"
        - "**/*.yml"
        - "**/*.yaml"
      exclude:
        - "scripts/ci/check_license.sh"
        - "yarn.lock"
        - "compiler/yarn.lock"
        - "**/node_modules/**"
        - "CHANGELOG.md"
        - "compiler/CHANGELOG.md"
    pattern: 'PATENTS'
    level: error
    message: >-
      No file other than scripts/ci/check_license.sh should reference PATENTS
      (removed in the 2017 Facebook->Meta relicense). This is exactly the
      invariant check_license.sh greps for.

  # ===================================================================
  # Meta copyright + MIT header on hand-edited sources. Unchanged from the
  # v0.9.17 baseline (file_header is pre-v0.10). Verified the exact 6-line
  # block on ReactVersion.js / version-check.js this snapshot.
  # ===================================================================
  - id: react-copyright-header-src
    when: facts.is_yarn_v1 and facts.has_react_package
    kind: file_header
    paths:
      include:
        - "packages/*/src/**/*.js"
      exclude:
        - "packages/*/src/**/__tests__/**/__snapshots__/**"
        - "packages/*/src/**/*.snap"
        - "packages/react-devtools-shared/src/hooks/__tests__/__source__/**"
    pattern: |-
      ^/\*\*
       \* Copyright \(c\) Meta Platforms, Inc\. and affiliates\.
       \*
       \* This source code is licensed under the MIT license found in the
    level: warning
    message: >-
      Every hand-edited JS source under packages/*/src/ should open with the
      standard Meta copyright + MIT license block (the same block
      scripts/rollup/wrappers.js prepends to every published bundle).

  - id: react-copyright-header-scripts
    when: facts.is_yarn_v1 and facts.has_react_package
    kind: file_header
    paths:
      include:
        - "scripts/**/*.js"
      exclude:
        - "scripts/bench/benchmarks/**"
        - "scripts/bench/remote-repo/**"
        - "scripts/release/**"
        - "scripts/rollup/shims/**"
    pattern: |-
      ^/\*\*
       \* Copyright \(c\) Meta Platforms, Inc\. and affiliates\.
       \*
       \* This source code is licensed under the MIT license found in the
    level: info
    message: >-
      Build/dev scripts under scripts/ should also carry the standard Meta
      copyright header. Advisory; promote after a one-time backfill.

  # ===================================================================
  # Per-published-package layout (for_each_dir; pre-v0.10 but kept).
  # ===================================================================
  - id: react-package-repository-directory-matches
    when: facts.is_yarn_v1 and facts.has_react_package
    kind: for_each_dir
    select: "packages/*"
    when_iter: 'iter.has_file("package.json")'
    require:
      - kind: json_path_matches
        paths: "{path}/package.json"
        path: "$.repository.directory"
        matches: '^packages/{basename}$'
        if_present: true
    level: warning
    message: >-
      package.json#repository.directory must point to this package's own
      subdir. As of the snapshot, packages/react-refresh wrongly points to
      packages/react (copy-paste regression).

  - id: react-package-homepage-canonical
    when: facts.is_yarn_v1 and facts.has_react_package
    kind: for_each_dir
    select: "packages/*"
    when_iter: 'iter.has_file("package.json")'
    require:
      - kind: json_path_matches
        paths: "{path}/package.json"
        path: "$.homepage"
        matches: '^https://react\.dev/?$'
        if_present: true
    level: info
    message: >-
      Package homepage should point to https://react.dev/ (canonical docs).

  - id: react-package-version-is-semver
    when: facts.is_yarn_v1 and facts.has_react_package
    kind: for_each_dir
    select: "packages/*"
    when_iter: 'iter.has_file("package.json")'
    require:
      - kind: json_path_matches
        paths: "{path}/package.json"
        path: "$.version"
        matches: '^\d+\.\d+\.\d+(-[a-z0-9.-]+)?$'
    level: error
    message: >-
      Per-package version must be a plain semver string; ranges break
      version-check.js and the publish pipeline.

  # ===================================================================
  # ReactVersion.js / ReactVersions.js shape (pre-v0.10; kept).
  # ===================================================================
  - id: react-version-source-shape
    when: facts.is_yarn_v1 and facts.has_react_package
    kind: file_content_matches
    paths: packages/shared/ReactVersion.js
    pattern: "(?m)^export default '\\d+\\.\\d+\\.\\d+(-[a-z0-9.-]+)?';$"
    level: error
    message: >-
      packages/shared/ReactVersion.js must export a single semver via
      `export default '<version>';` — version-check.js parses exactly this.

  - id: react-versions-file-declares-stable-packages
    when: facts.is_yarn_v1 and facts.has_react_package
    kind: file_content_matches
    paths: ReactVersions.js
    pattern: 'const stablePackages = \{'
    level: error
    message: >-
      ReactVersions.js must declare `const stablePackages = { ... }`; the
      release pipeline reads it to know which packages publish to @latest.

  # ===================================================================
  # Config-file discipline (pre-v0.10; kept). .nvmrc / .gitattributes /
  # eslintrc / prettier / eslintignore.
  # ===================================================================
  - id: react-nvmrc-version-pinned
    when: facts.is_yarn_v1 and facts.has_react_package
    kind: file_content_matches
    paths: .nvmrc
    pattern: '^v\d+\.\d+\.\d+\s*$'
    level: error
    message: >-
      .nvmrc must contain a single vMAJOR.MINOR.PATCH line; setup-node reads
      it via node-version-file.

  - id: react-gitattributes-text-auto
    when: facts.is_yarn_v1 and facts.has_react_package
    kind: file_content_matches
    paths: .gitattributes
    pattern: '^\* text=auto'
    level: warning
    message: >-
      .gitattributes should declare `* text=auto` for cross-platform
      line-ending normalisation.

  - id: react-eslintrc-loads-react-internal-plugin
    when: facts.is_yarn_v1 and facts.has_react_package
    kind: file_content_matches
    paths: .eslintrc.js
    pattern: "'react-internal'"
    level: error
    message: >-
      .eslintrc.js must register the react-internal plugin or the 5 in-tree
      custom rules silently stop running.

  - id: react-eslintrc-uses-hermes-parser
    when: facts.is_yarn_v1 and facts.has_react_package
    kind: file_content_matches
    paths: .eslintrc.js
    pattern: "parser:\\s*'hermes-eslint'"
    level: error
    message: >-
      .eslintrc.js must declare parser: 'hermes-eslint' (react's Flow types
      break under the default espree parser).

  - id: react-package-json-links-eslint-rules
    when: facts.is_yarn_v1 and facts.has_react_package
    kind: file_content_matches
    paths: package.json
    pattern: '"eslint-plugin-react-internal"\s*:\s*"link:\./scripts/eslint-rules"'
    level: error
    message: >-
      Root package.json must keep the
      "eslint-plugin-react-internal": "link:./scripts/eslint-rules" entry.

  - id: react-prettierrc-exists
    when: facts.is_yarn_v1 and facts.has_react_package
    kind: file_exists
    paths: .prettierrc.js
    root_only: true
    level: error
    message: ".prettierrc.js must exist at the repo root."

  - id: react-prettierignore-exists
    when: facts.is_yarn_v1 and facts.has_react_package
    kind: file_exists
    paths: .prettierignore
    root_only: true
    level: warning
    message: ".prettierignore should exist so prettier skips build/ and compiler/."

  - id: react-eslintignore-skips-node-modules
    when: facts.is_yarn_v1 and facts.has_react_package
    kind: file_content_matches
    paths: .eslintignore
    pattern: '\*\*/node_modules'
    level: error
    message: ".eslintignore must list **/node_modules."

  - id: react-eslintignore-skips-build-output
    when: facts.is_yarn_v1 and facts.has_react_package
    kind: file_content_matches
    paths: .eslintignore
    pattern: '(?m)^build/'
    level: error
    message: ".eslintignore must list build/ (lint-build covers the bundles separately)."

  # ===================================================================
  # Canonical script-name guards — workflows reference these by name; a
  # rename silently passes CI. (pre-v0.10; kept.)
  # ===================================================================
  - id: react-package-json-has-lint-script
    when: facts.is_yarn_v1 and facts.has_react_package
    kind: json_path_matches
    paths: package.json
    path: "$.scripts.lint"
    matches: 'eslint'
    level: error
    message: "package.json#scripts.lint must invoke the eslint task runner."

  - id: react-package-json-has-prettier-check-script
    when: facts.is_yarn_v1 and facts.has_react_package
    kind: json_path_matches
    paths: package.json
    path: "$.scripts['prettier-check']"
    matches: 'prettier'
    level: error
    message: "package.json#scripts.prettier-check must invoke prettier."

  - id: react-package-json-has-flow-ci-script
    when: facts.is_yarn_v1 and facts.has_react_package
    kind: json_path_matches
    paths: package.json
    path: "$.scripts['flow-ci']"
    matches: 'flow'
    level: error
    message: "package.json#scripts.flow-ci must invoke flow."

  - id: react-package-json-has-version-check-script
    when: facts.is_yarn_v1 and facts.has_react_package
    kind: json_path_matches
    paths: package.json
    path: "$.scripts['version-check']"
    matches: 'version-check'
    level: error
    message: "package.json#scripts.version-check must invoke version-check.js."

  # ===================================================================
  # Workflow conventions (pre-v0.10; kept). Now covers Compiler too.
  # ===================================================================
  - id: react-workflow-name-has-category-prefix
    when: facts.is_yarn_v1 and facts.has_react_package
    kind: yaml_path_matches
    paths: ".github/workflows/*.{yml,yaml}"
    path: "$.name"
    matches: '^\((Runtime|Compiler|DevTools|Shared)\) '
    level: warning
    message: >-
      Each workflow name: should open with a (Runtime)/(Compiler)/(DevTools)/
      (Shared) category prefix; the file name should match.

  - id: react-workflow-permissions-default-empty
    when: facts.is_yarn_v1 and facts.has_react_package
    kind: file_content_matches
    paths: ".github/workflows/*.yml"
    pattern: '(?m)^permissions:\s*(\{\s*\}|read-all|\n)'
    level: warning
    message: >-
      Each workflow should declare `permissions: {}` (or read-all) at top
      scope as a defence-in-depth default (verified present on every workflow
      this snapshot).

  # ===================================================================
  # MAINTAINERS file (pre-v0.10; kept). shared_check_maintainer.yml reads it.
  # ===================================================================
  - id: react-maintainers-file-present
    when: facts.is_yarn_v1 and facts.has_react_package
    kind: file_exists
    paths: MAINTAINERS
    root_only: true
    level: error
    message: >-
      MAINTAINERS must exist; shared_check_maintainer.yml reads it to decide
      core-team membership.

  - id: react-maintainers-file-non-empty
    when: facts.is_yarn_v1 and facts.has_react_package
    kind: file_min_lines
    paths: MAINTAINERS
    min_lines: 1
    level: error
    message: "MAINTAINERS must contain at least one entry."

  - id: react-package-manager-yarn-classic
    when: facts.is_yarn_v1 and facts.has_react_package
    kind: json_path_matches
    paths: package.json
    path: "$.packageManager"
    matches: '^yarn@1\.'
    level: warning
    message: >-
      packageManager should pin Yarn classic v1; CI uses
      `yarn install --frozen-lockfile` and `yarn workspace`.

  - id: react-no-tracked-build-output
    when: facts.is_yarn_v1 and facts.has_react_package
    kind: dir_absent
    paths:
      - "build"
      - "coverage"
      - "packages/*/build"
      - "compiler/packages/*/dist"
    level: error
    message: >-
      build/, coverage/, per-package build/ and compiler dist/ must not be
      tracked; every CI workflow `rm -rf build` before install.

  # ===================================================================
  # Tool shell-outs (command rule; pre-v0.10). The semantic analysis stays in
  # the tools; alint just runs them so one `alint check` ~= the lint CI jobs.
  # version-check is now native (above) so it is NOT shelled out anymore.
  # ===================================================================
  - id: react-eslint
    when: facts.is_yarn_v1 and facts.has_react_package
    kind: command
    paths: package.json
    command: ["yarn", "lint"]
    timeout: 600
    level: error
    message: "`yarn lint` failed."

  - id: react-prettier-check
    when: facts.is_yarn_v1 and facts.has_react_package
    kind: command
    paths: .prettierrc.js
    command: ["yarn", "prettier-check"]
    timeout: 300
    level: error
    message: "`yarn prettier-check` failed. Run `yarn prettier-all`."

  - id: react-flow-check
    when: facts.is_yarn_v1 and facts.has_react_package
    kind: command
    paths: package.json
    command: ["yarn", "flow-ci"]
    timeout: 600
    level: error
    message: "`yarn flow-ci` failed."

  - id: react-print-warnings
    # REPLACES scripts/ci/test_print_warnings.sh (asserts print-warnings emits
    # >=1 warning). A bare command spawn; the AST walk stays in node.
    when: facts.is_yarn_v1 and facts.has_react_package
    kind: command
    paths: scripts/print-warnings/print-warnings.js
    command: ["bash", "scripts/ci/test_print_warnings.sh"]
    timeout: 120
    level: error
    message: "test_print_warnings.sh failed (print-warnings emitted no warnings)."

# =====================================================================
# GENUINE NON-REPLACEABLES (keep the existing tool) and WHY:
#
#   - The 5 in-tree eslint rules (scripts/eslint-rules/): no-primitive-
#     constructors, no-production-logging, prod-error-codes, safe-string-
#     coercion, warning-args. TSESTree AST visitors — out of alint's no-AST
#     scope. (prod-error-codes' "every new Error(<literal>) is a key in
#     codes.json" is a cross-file value membership; alint's
#     cross_file_value_equals does equality of a SINGLE extracted value, not
#     set-membership of many AST-extracted literals — see gap below.)
#   - flow / flow-ci: a runtime type checker. Shelled out via `command`, but
#     the analysis itself is out of scope.
#   - jest test* targets: test execution, not a repo-state property.
#   - print-warnings.js: hermes-parser AST walk; shelled out only.
#   - dangerfile.js: operates on the PR DIFF + built bundle byte sizes
#     (build vs base-build), not the working tree. PR-diff + size-regression
#     is fundamentally not a static repo-state check.
#   - lint-build (scripts/rollup/validate/): a SECOND eslint pass over BUILT
#     bundles with per-channel eslintrcs; the bundles don't exist pre-build.
#   - extract-errors freshness: mutating generator over build artefacts;
#     declared as generated_file_fresh (advisory) but only meaningful post-build.
#
# NEW-RULE-KIND CANDIDATES (gaps alint still cannot express):
#   1. registry_append_only — assert a JSON object's keys are a strict
#      superset of the previous git revision's keys with no reassignment.
#      This is exactly codes.json's documented "append-only" invariant, which
#      today is only human `git diff` review.
#   2. value_set_membership / cross_file_value_contains — every value in set A
#      (e.g. every Error literal in packages/**) must appear as a value/key in
#      file B (codes.json). cross_file_value_equals does 1:1 equality, not
#      N-in-1 membership; this would let alint replace the codes.json half of
#      prod-error-codes without an AST.
#   3. built_artefact_property — assert a generated bundle's property matches a
#      source-side spec (the lint-build per-channel re-lint shape).
# =====================================================================
