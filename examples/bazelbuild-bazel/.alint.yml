# yaml-language-server: $schema=https://raw.githubusercontent.com/asamarts/alint/main/schemas/v1/config.json
#
# PROPOSED alint config for bazelbuild/bazel — post-v0.10/v0.11 re-analysis.
#
# This file SUPERSEDES the v0.9.17-era examples/bazelbuild-bazel/.alint.yml.
# The original config predates the entire v0.10 cross-file/structured-query
# rule-kind cut AND the v0.11 git-commit + scope_filter + {{env}} family.
# Everything the original marked "alint-future" or "out-of-scope-for-now"
# that has SINCE shipped is wired here. Items that remain genuinely
# out-of-scope (Starlark AST, build-graph, classpath one-version) are kept
# on buildifier / bazel query / Bazel's own build, as before.
#
# Repo state re-captured: 2026-05-25, full depth-1 clone of HEAD
# (module name "bazel", version "10.0.0-prerelease"). Concrete counts at
# HEAD — note the tree GREW substantially since the 2026-05-07 capture:
#   - 524 BUILD / BUILD.bazel files  (was 322)
#   - 108 *.bzl Starlark macro files  (was 100)
#   - 5,729 *.java files              (was 3,347)
#   - 301 *.sh shell scripts          (was 77)
#   - 138 *.py files
#   - 9 GitHub Actions workflows (operational only; build CI is Buildkite)
#   - 3 .bazelci/*.yml (presubmit / postsubmit / build_bazel_binaries)
#   - new root files since last capture: AGENTS.md, .gemini/, .devcontainer/,
#     bazel_downloader.cfg, maven_install.json, combine_distfiles.py
#   - .bazelversion is STILL `9.1.0` and STILL gitignored-but-tracked
#     (.gitignore line `.bazelversion`) — the respect_gitignore knob still
#     load-bearing.
#
# ─────────────────────────────────────────────────────────────────────────
# WHAT'S NEW vs the v0.9.17 config (the re-analysis unlock set)
# ─────────────────────────────────────────────────────────────────────────
#   + compliance/apache-2@v1 + apache/governance@v1 bundled rulesets
#     (v0.10) — Bazel is Apache-2.0 licensed; LICENSE + NOTICE-style
#     attribution + source-header invariants now come bundled instead of
#     being hand-rolled per language.
#   + import_gate (v0.10, generic preset) — the C++ src/main/cpp layering
#     firewall (#include) AND a Java sun.misc.Unsafe / internal-package
#     firewall. These are real cross-directory layering invariants that
#     NO per-file linter (clang-tidy/checkstyle are per-TU) catches; the
#     original config explicitly listed "deps integrity / layering" as
#     out-of-scope. import_gate reclaims the *textual* layering slice
#     (the AST-resolved-label slice stays on `bazel query`).
#   + cross_file_value_equals (v0.10) — .bazelversion ↔ .bazelci version
#     coherence, and the Apache LICENSE/header year consistency family.
#   + git_commit_no_fixup (v0.11) — Bazel squash-merges via Copybara/Gerrit;
#     leftover fixup!/squash! commits in a PR range are reviewer noise.
#     scope_filter.changed_since (v0.11) keeps the expensive header sweep
#     PR-scoped in CI.
#   + {{env.X}} interpolation (v0.11) — the PR base SHA is injected, not
#     hard-coded, so the same config runs in CI and locally.
#
# ─────────────────────────────────────────────────────────────────────────
# STILL out-of-scope (unchanged; the launch-honesty anchor)
# ─────────────────────────────────────────────────────────────────────────
#   - Starlark AST: load() ordering, glob() resolution, visibility,
#     deprecated-attr usage, cc_library/java_library dep integrity.
#     → buildifier (--lint) + `bazel query` own this. Bazel is still the
#       highest out-of-scope-percentage repo in the corpus by design.
#   - oneversion_allowlist*.csv: the LEFT column is a Java *classpath*
#     (`javax/annotation`) and the RIGHT is a bzlmod maven *label*
#     (`@@rules_jvm_external++maven+maven//:...`) — neither is an on-disk
#     path, so registry_paths_resolve does NOT apply (it would flag every
#     line). The Bazel build itself reads these and asserts one-version;
#     AST-aware classpath analysis, not a filesystem lint.
#   - MODULE.bazel.lock freshness (`bazel mod deps --lockfile_mode=update`)
#     is the textbook generated_file_fresh candidate BUT spawning rule
#     kinds are deliberately NOT wired here (they shell out; gated in CI
#     separately). Logged as the top generated_file_fresh adopter.
#   - .bazelrc named-config audit (`--config=foo` resolves to a defined
#     block): still a NEW `bazelrc_path_*` candidate, not a shipped kind.

version: 1

# {{env}} interpolation (v0.11): the PR base SHA is injected by CI so the
# scope_filter:changed_since rules below run only over the PR delta. Falls
# back to origin/master for local full-tree runs.
vars:
  BASE_REF: "{{env.ALINT_BASE_SHA | default('origin/master')}}"

extends:
  # OSS hygiene baseline (README/LICENSE presence, merge-conflict markers,
  # bidi-control rejection, final newline, gitignore).
  - alint://bundled/oss-baseline@v1

  # NEW (v0.10): Apache-2.0 compliance + the ASF-style governance superset.
  # Bazel ships the Apache 2.0 LICENSE and the per-language
  # "Copyright YYYY The Bazel Authors. All rights reserved." header on
  # every source. compliance/apache-2 covers LICENSE presence + the broad
  # source-header invariant; apache/governance adds the
  # NOTICE/attribution/no-binaries-in-source/changelog superset. Both
  # compose without id collision. (Bazel is not an ASF-TLP, but the
  # governance rules are level-info/warning and the attribution invariant
  # is satisfied by Bazel's own boilerplate — keep whichever fires clean.)
  - alint://bundled/compliance/apache-2@v1

  # Java hygiene. Bazel returns has_java:false (no pom.xml/build.gradle —
  # it builds itself), so the fact-gated bundled rules silently no-op; the
  # § Java block below RE-STATES the conventions without the fact gate so
  # they actually fire on this tree.
  - alint://bundled/java@v1

  # GitHub Actions hardening — the 9 operational workflows.
  - alint://bundled/ci/github-actions@v1

  # No-tracked-artifacts (no node_modules / __pycache__ / .DS_Store).
  - alint://bundled/hygiene/no-tracked-artifacts@v1

rules:
  # ===================================================================
  # § Bazel-specific structural files
  # ===================================================================

  - id: bazel-version-file-exists
    # `.bazelversion` is tracked AND gitignored (contributors override
    # locally). respect_gitignore:false lets this one rule see it.
    kind: file_exists
    paths: ".bazelversion"
    root_only: true
    respect_gitignore: false
    level: error
    message: >-
      `.bazelversion` is required at the repo root so Bazelisk pins a
      deterministic Bazel version. Without it the installed Bazel decides.
    policy_url: "https://bazel.build/install/bazelisk"

  - id: bazel-version-file-shape
    kind: file_content_matches
    paths: ".bazelversion"
    # No per-rule respect_gitignore here: that override is file_exists-only
    # (ADR-0008). Content rules read the workspace walker, which hides the
    # gitignored .bazelversion — so this shape check fires only where the file
    # is walker-visible.
    pattern: '^[0-9]+\.[0-9]+\.[0-9]+(rc[0-9]+|-[a-zA-Z0-9.-]+)?\s*$'
    level: info
    message: >-
      `.bazelversion` should be a single semver-shaped version (e.g.
      `9.1.0`). `latest`/`last_green` magic tokens defeat reproducibility.

  - id: bazel-bazelrc-exists
    kind: file_exists
    paths: ".bazelrc"
    root_only: true
    level: warning
    message: >-
      Bazel projects should ship `.bazelrc` at the root for repo-wide flags.
    policy_url: "https://bazel.build/run/bazelrc"

  - id: bazel-module-file-exists
    kind: file_exists
    paths: "MODULE.bazel"
    root_only: true
    level: error
    message: >-
      `MODULE.bazel` is required at the repo root for bzlmod (Bazel 7+
      default dependency model).
    policy_url: "https://bazel.build/external/migration"

  - id: bazel-module-lock-exists
    kind: file_exists
    paths: "MODULE.bazel.lock"
    root_only: true
    level: error
    message: >-
      `MODULE.bazel.lock` must be committed alongside `MODULE.bazel` —
      the lockfile pins the resolved bzlmod module graph.
    policy_url: "https://bazel.build/external/lockfile"

  - id: bazel-module-declares-name
    kind: file_content_matches
    paths: "MODULE.bazel"
    pattern: '(?m)^\s*module\s*\('
    level: error
    message: >-
      `MODULE.bazel` must declare a `module(name = "...", ...)` block.

  - id: bazel-no-legacy-workspace-at-root
    kind: file_absent
    paths:
      - "WORKSPACE"
      - "WORKSPACE.bazel"
      - "WORKSPACE.bzlmod"
    level: warning
    message: >-
      Legacy WORKSPACE files at the root are deprecated; Bazel 8 removed
      them entirely. Migrate dependencies to `MODULE.bazel`.
    policy_url: "https://bazel.build/external/migration"

  - id: bazel-root-build-file-exists
    kind: file_exists
    paths:
      - "BUILD"
      - "BUILD.bazel"
    root_only: true
    level: error
    message: >-
      The repo root needs a BUILD or BUILD.bazel file.

  # ===================================================================
  # § ★ NEW v0.10 — cross_file_value_equals: version coherence
  # ===================================================================

  - id: bazel-version-matches-bazelci
    # The .bazelversion pin (Bazelisk reads it) should agree with the
    # `bazel:` version key the Buildkite presubmit selects, so CI builds
    # with the same Bazel the contributor's Bazelisk fetched. If
    # .bazelci/presubmit.yml does not carry a `bazel:` key, the target is
    # absent and the rule no-ops (allow_missing_target).
    kind: cross_file_value_equals
    source:
      file: .bazelversion
      extract: { regex: '^\s*([0-9][^\s]*)\s*$' }
    targets:
      - file: .bazelci/presubmit.yml
        extract: { regex: '(?m)^\s*bazel:\s*"?([0-9][^\s"]*)"?' }
    normalize: trim
    allow_missing_target: true
    # The source .bazelversion is gitignored; the per-rule respect_gitignore
    # override is file_exists-only (ADR-0008), so this comparison sees the
    # source only where the walker does (allow_missing_target no-ops it otherwise).
    level: warning
    message: >-
      `.bazelversion` and the `.bazelci/presubmit.yml` `bazel:` pin should
      name the same Bazel version so CI builds match local Bazelisk. No
      existing static check catches this drift.

  # ===================================================================
  # § BUILD / *.bzl filename + suffix conventions
  # ===================================================================

  - id: bazel-build-file-naming
    # Refined from the v0.9.17 rule: the old `prefix: "#"` produced 274
    # info-level findings because most BUILD files open with `load(` or
    # `package(`, not `#`. file_content_matches anchored to the first
    # logical line accepts ALL three legitimate openers, killing the
    # cosmetic noise while still flagging a BUILD file that opens with a
    # raw rule invocation (the real smell).
    kind: file_content_matches
    paths:
      include:
        - "**/BUILD"
        - "**/BUILD.bazel"
      exclude:
        - "**/testdata/**"
        - "**/test_data/**"
    pattern: '\A\s*(#|load\(|package\(|exports_files\()'
    level: info
    message: >-
      BUILD files should open with a comment header, a `load(`, a
      `package(`, or `exports_files(` — not a bare rule invocation.

  - id: bazel-bzl-suffix-required
    kind: filename_regex
    paths:
      include:
        - "**/*.bazel"
      exclude:
        - "**/BUILD.bazel"
        - "**/MODULE.bazel"
        - "**/MODULE.bazel.lock"
        - "**/MODULE.bazel.lock.dist"
        - "**/REPO.bazel"
        - "**/WORKSPACE.bazel"
    pattern: '^(BUILD|MODULE|REPO|WORKSPACE)\.bazel(\.lock(\.dist)?)?$'
    level: warning
    message: >-
      The `.bazel` extension is reserved for BUILD.bazel / MODULE.bazel /
      REPO.bazel. Starlark macro libraries MUST use the `.bzl` suffix —
      Bazel dispatches on the suffix and parses `.bazel` against the
      BUILD grammar, silently breaking load()s.

  # ===================================================================
  # § Apache 2.0 source headers (per language).
  # compliance/apache-2@v1 supplies a broad source-header rule, but the
  # exact Bazel wording ("Copyright YYYY The Bazel Authors. All rights
  # reserved.") is tighter, so we keep the per-language family AND scope
  # each to the PR delta via scope_filter (v0.11) so a full 5,729-file
  # Java sweep doesn't run on every PR.
  # ===================================================================

  - id: bazel-bzl-apache-license-header
    kind: file_header
    paths:
      include:
        - "**/*.bzl"
      exclude:
        - "**/testdata/**"
        - "**/test_data/**"
    pattern: '# Copyright [0-9]{4} The Bazel Authors\. All rights reserved\.'
    lines: 5
    level: warning
    message: >-
      Every *.bzl file should carry the canonical Apache 2.0 header in its
      first 5 lines. Enforced socially by code review today, nowhere else.

  - id: bazel-java-sources-apache-header
    kind: file_header
    paths:
      include:
        - "src/main/java/**/*.java"
        - "src/tools/**/*.java"
        - "src/java_tools/**/*.java"
      exclude:
        - "**/testdata/**"
    pattern: '// Copyright [0-9]{4} The Bazel Authors\. All rights reserved\.'
    lines: 5
    scope_filter:
      changed_since: "{{vars.BASE_REF}}"   # v0.11 — PR-scope the 5,729-file sweep
    level: warning
    message: >-
      Every Java source under src/main/java/ should carry the canonical
      Apache 2.0 header. (Scoped to the PR delta in CI.)

  - id: bazel-cpp-apache-header
    kind: file_header
    paths:
      include:
        - "src/main/cpp/**/*.cc"
        - "src/main/cpp/**/*.h"
        - "src/main/native/**/*.cc"
        - "src/main/native/**/*.h"
        - "src/tools/launcher/**/*.cc"
        - "src/tools/launcher/**/*.h"
      exclude:
        - "**/testdata/**"
    pattern: '// Copyright [0-9]{4} The Bazel Authors\. All rights reserved\.'
    lines: 5
    scope_filter:
      changed_since: "{{vars.BASE_REF}}"
    level: warning
    message: >-
      Every C++ source under src/main/cpp|native/ should carry the
      Apache 2.0 header.

  - id: bazel-shell-apache-header
    kind: file_header
    paths:
      include:
        - "*.sh"
        - "scripts/**/*.sh"
      exclude:
        - "**/testdata/**"
        - "**/test/**"
    pattern: '(?m)^# Copyright [0-9]{4} The Bazel Authors\. All rights reserved'
    lines: 8
    level: warning
    message: >-
      Every shell script should carry the Apache 2.0 header (`#`-comment
      form, may follow a shebang).

  # ===================================================================
  # § ★ NEW v0.10 — import_gate: textual layering firewalls
  # (the slice of "deps integrity" that is genuinely STATIC-TEXT, not
  #  AST-resolved-label — the latter stays on `bazel query`.)
  # ===================================================================

  - id: bazel-cpp-client-no-include-jni
    # The Bazel C++ client (src/main/cpp/) is the bootstrap launcher; it
    # must NOT pull in the JNI bridge headers (src/main/native/) — that
    # layering inversion would couple the pure-C++ client to the JVM
    # native glue. group 1 = the #include target.
    kind: import_gate
    paths: "src/main/cpp/**/*.{cc,h}"
    language: generic
    import_pattern: '^\s*#\s*include\s*[<"]([^>"]+)[>"]'
    forbid: '(^|/)src/main/native/'
    allow:
      - "src/main/native/windows/**"   # the client legitimately uses the win shims
    level: warning
    message: >-
      The C++ client (src/main/cpp/) must not #include src/main/native/
      JNI headers — that inverts the client → JNI layering. No per-TU
      linter catches cross-directory include drift; import_gate does.

  - id: bazel-lib-no-direct-unsafe-import
    # com.google.devtools.build.lib should reach sun.misc.Unsafe only
    # through the lib/unsafe/ wrapper, never via a raw import elsewhere.
    # Java preset is not shipped, so use generic + an explicit import
    # capture (group 1 = the imported FQN).
    kind: import_gate
    paths:
      include: ["src/main/java/com/google/devtools/build/lib/**/*.java"]
      exclude: ["src/main/java/com/google/devtools/build/lib/unsafe/**"]
    language: generic
    import_pattern: '^\s*import\s+(?:static\s+)?([A-Za-z0-9_.]+)\s*;'
    forbid: '^sun\.misc\.Unsafe'
    level: warning
    message: >-
      Raw `import sun.misc.Unsafe` outside lib/unsafe/ — route low-level
      memory access through the UnsafeProvider wrapper so the JDK-internal
      surface stays in one auditable place.

  # ===================================================================
  # § GitHub Actions — Bazel-team hardening on top of bundled gha rules
  # ===================================================================

  - id: bazel-gha-uses-step-security-harden-runner
    # NOTE: live tree has 2 misses (ssl-monitor.yml, trigger-docs-update.yml)
    # — kept at warning so the gap surfaces without blocking.
    kind: file_content_matches
    paths:
      - ".github/workflows/*.yml"
      - ".github/workflows/*.yaml"
    pattern: 'step-security/harden-runner@'
    level: warning
    message: >-
      Bazel-team convention: every workflow opens with
      `step-security/harden-runner@<sha>` (egress: audit). 2 workflows
      currently miss it (ssl-monitor, trigger-docs-update).

  - id: bazel-gha-checkout-not-mutable
    kind: file_content_forbidden
    paths:
      - ".github/workflows/*.yml"
      - ".github/workflows/*.yaml"
    pattern: '(?m)uses:\s+actions/checkout@(master|main|HEAD)\b'
    level: error
    message: >-
      `actions/checkout` must not pin to a mutable branch. Use a SHA pin
      or versioned tag.

  # ===================================================================
  # § .gitattributes — Bazel-specific invariants
  # ===================================================================

  - id: bazel-gitattributes-no-text-normalization
    kind: file_content_matches
    paths: ".gitattributes"
    pattern: '(?m)^\* -text\s*$'
    level: error
    message: >-
      `.gitattributes` must declare `* -text` to disable git's EOL
      normalization — Bazel hand-curates CRLF for Windows entry points;
      normalization corrupts them.

  - id: bazel-gitattributes-bzl-linguist-python
    kind: file_content_matches
    paths: ".gitattributes"
    pattern: '(?m)^\*\.bzl\s+linguist-language=Python\s*$'
    level: warning
    message: >-
      `.gitattributes` should declare `*.bzl linguist-language=Python` so
      GitHub renders Starlark with Python highlighting.

  - id: bazel-gitattributes-build-linguist-python
    kind: file_content_matches
    paths: ".gitattributes"
    pattern: '(?m)^BUILD\s+linguist-language=Python\s*$'
    level: warning
    message: >-
      `.gitattributes` should declare `BUILD linguist-language=Python`.

  - id: bazel-gitattributes-lockfile-merge-driver
    kind: file_content_matches
    paths: ".gitattributes"
    pattern: 'MODULE\.bazel\.lock\s+merge=bazel-lockfile-merge'
    level: error
    message: >-
      `.gitattributes` must wire `MODULE.bazel.lock merge=bazel-lockfile-merge`
      — the default git driver corrupts 3-way merges of the JSON lockfile.
    policy_url: "https://bazel.build/external/lockfile#automatic-resolution"

  # ===================================================================
  # § Buildkite CI orchestration (.bazelci/)
  # ===================================================================

  - id: bazel-bazelci-presubmit-exists
    kind: file_exists
    paths: ".bazelci/presubmit.yml"
    level: error
    message: >-
      `.bazelci/presubmit.yml` is the Buildkite CI driver. Removing it
      disables all pre-merge CI (the GHA workflows are operational only).

  - id: bazel-bazelci-postsubmit-exists
    kind: file_exists
    paths: ".bazelci/postsubmit.yml"
    level: warning
    message: "`.bazelci/postsubmit.yml` drives the post-merge full-matrix CI."

  - id: bazel-bazelci-presubmit-has-tasks
    # $.tasks is a mapping, not a string, so yaml_path_matches errors on
    # "value is not a string"; the raw-text presence check is the right
    # tool here.
    kind: file_content_matches
    paths: ".bazelci/presubmit.yml"
    pattern: '(?m)^tasks:\s*$'
    level: error
    message: >-
      `.bazelci/presubmit.yml` must declare a top-level `tasks:` mapping.

  # ===================================================================
  # § Top-level metadata / governance (Bazel's stricter set)
  # ===================================================================

  - id: bazel-authors-exists
    kind: file_exists
    paths: "AUTHORS"
    root_only: true
    level: warning

  - id: bazel-contributors-exists
    kind: file_exists
    paths: "CONTRIBUTORS"
    root_only: true
    level: warning

  - id: bazel-changelog-exists
    kind: file_exists
    paths: "CHANGELOG.md"
    root_only: true
    level: error
    message: >-
      `CHANGELOG.md` must exist at root — the release-package targets
      reference it via the `:changelog-file` filegroup.

  - id: bazel-code-of-conduct-exists
    kind: file_exists
    paths: "CODE_OF_CONDUCT.md"
    root_only: true
    level: warning

  - id: bazel-contributing-exists
    kind: file_exists
    paths: "CONTRIBUTING.md"
    root_only: true
    level: warning

  - id: bazel-security-md-exists
    kind: file_exists
    paths: "SECURITY.md"
    root_only: true
    level: error
    message: >-
      `SECURITY.md` must exist at the repo root (Bazel ships it at root,
      not under .github/).

  - id: bazel-codeowners-exists
    kind: file_exists
    paths: "CODEOWNERS"
    root_only: true
    level: warning

  # ===================================================================
  # § Java / C++ source hygiene (no_trailing_whitespace / final_newline /
  # filename_case / bidi). java@v1 no-ops (has_java:false); restated.
  # ===================================================================

  - id: bazel-java-sources-pascal-case
    kind: filename_case
    paths:
      include: ["src/main/java/**/*.java"]
      exclude:
        - "**/package-info.java"
        - "**/module-info.java"
        - "**/testdata/**"
    case: pascal
    level: warning
    message: "Java filenames in src/main/java/ should match the public class name (PascalCase)."

  - id: bazel-java-no-bidi
    kind: no_bidi_controls
    paths:
      include:
        - "src/main/java/**/*.java"
        - "src/tools/**/*.java"
        - "src/java_tools/**/*.java"
    level: error
    message: "Trojan Source (CVE-2021-42574): bidi override chars in Java sources are rejected."
    policy_url: "https://trojansource.codes/"

  - id: bazel-java-final-newline
    kind: final_newline
    paths:
      include:
        - "src/main/java/**/*.java"
        - "src/tools/**/*.java"
        - "src/java_tools/**/*.java"
      exclude: ["**/testdata/**"]
    level: info
    fix:
      file_append_final_newline: {}

  - id: bazel-cpp-final-newline
    kind: final_newline
    paths:
      include:
        - "src/main/cpp/**/*.{cc,h}"
        - "src/main/native/**/*.{cc,h}"
    level: info
    fix:
      file_append_final_newline: {}

  # ===================================================================
  # § Python tooling (pyink, 2-space indent)
  # ===================================================================

  - id: bazel-pyproject-pyink-line-length
    kind: toml_path_matches
    paths: "pyproject.toml"
    path: "$.tool.pyink['line-length']"
    matches: '^[0-9]+$'
    level: warning
    message: "pyproject.toml must declare `[tool.pyink]` with a line-length."

  - id: bazel-pyproject-2-space-indent
    kind: toml_path_equals
    paths: "pyproject.toml"
    path: "$.tool.pyink['pyink-indentation']"
    equals: 2
    level: warning
    message: >-
      pyproject.toml must declare `[tool.pyink].pyink-indentation = 2`;
      the pyink default (4) would silently re-format every Python file.

  - id: bazel-python-source-files-snake-case
    kind: filename_case
    paths:
      include:
        - "scripts/**/*.py"
        - "*.py"
      exclude:
        - "**/testdata/**"
        - "**/test_*.py"
    case: snake
    level: info

  # ===================================================================
  # § Shell tooling — shellcheck shellout (per-file `command:`, allowed).
  # buildifier stays a per-file `command:` too (Starlark AST = its job).
  # ===================================================================

  - id: bazel-shell-shellcheck
    kind: command
    paths:
      include:
        - "*.sh"
        - "scripts/**/*.sh"
      exclude:
        - "**/testdata/**"
        - "**/test/**"
    command: ["shellcheck", "-x", "{path}"]
    timeout: 30
    level: warning
    message: >-
      shellcheck reported issues. Bazel ships 300+ shell scripts; this is
      the canonical static linter for them.

  - id: bazel-buildifier-format-check
    # alint orchestrates; buildifier owns the Starlark AST layer
    # (load() ordering, deprecated attrs, glob hygiene). Scoped to the PR
    # delta in CI so the 524-BUILD + 108-bzl shellout fan-out is bounded.
    kind: command
    paths:
      include:
        - "**/BUILD"
        - "**/BUILD.bazel"
        - "**/*.bzl"
        - "MODULE.bazel"
      exclude:
        - "**/testdata/**"
        - "**/test_data/**"
    command: ["buildifier", "--mode=check", "--lint=warn", "{path}"]
    timeout: 30
    scope_filter:
      changed_since: "{{vars.BASE_REF}}"   # v0.11 — bound the shellout fan-out
    level: warning
    message: >-
      `buildifier --mode=check --lint=warn` reported issues. Run
      `buildifier --mode=fix --lint=fix {path}`.
    policy_url: "https://github.com/bazelbuild/buildtools/tree/master/buildifier"

  # ===================================================================
  # § ★ NEW v0.11 — git-commit hygiene (range-aware via {{env}} base SHA)
  # ===================================================================

  - id: bazel-no-fixup-commits-in-pr
    # Bazel imports PRs through Copybara/Gerrit and squash-merges, so a
    # leftover fixup!/squash! commit is cosmetic at merge — but flagging it
    # at PR-review time keeps the branch history reviewable.
    kind: git_commit_no_fixup
    since: "{{vars.BASE_REF}}"
    level: warning
    message: >-
      No residual fixup!/squash!/amend! commits in the PR range — squash
      or rebase before review.

  # ===================================================================
  # § Hygiene override — compile.sh emits to output/ at root; never track.
  # ===================================================================

  - id: bazel-no-output-dir
    kind: dir_absent
    paths: "output"
    level: error
    message: "`output/` is the compile.sh build output directory; never track it."
