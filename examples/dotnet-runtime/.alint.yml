# yaml-language-server: $schema=https://raw.githubusercontent.com/asamarts/alint/main/schemas/v1/config.json
#
# PROPOSED alint config for dotnet/runtime — post-v0.10/v0.11 re-analysis.
#
# This supersedes the v0.9.17-era examples/dotnet-runtime/.alint.yml. The big
# v0.10/v0.11 unlocks fold most of the old hand-written rules away:
#
#   * `extends: [alint://bundled/dotnet@v1]` — ecosystem-gated (facts.has_dotnet);
#     subsumes the old global.json-exists, global.json-pins-sdk (json_path),
#     csproj-sdk-style (xml_path), .editorconfig-exists, and bin/obj hygiene rules.
#   * `json_path_*` on global.json — the SDK + Arcade SDK pins are real JSON
#     queries now, not file_content_matches regex against the JSON text.
#   * `xml_path_*` on .csproj / .props / .targets — the headline .NET payoff.
#     "the ROOT element's Sdk attribute is Microsoft.NET.Sdk", not "the string
#     Microsoft.NET.Sdk appears somewhere in the file". Closes the ~5 per-csproj
#     XML invariants the old config could only approximate with regex.
#   * `registry_paths_resolve` — eng/Subsets.props SubsetName registry & the
#     .slnx project lists become statically-resolvable (was unenforced).
#   * `cross_file_value_equals` — global.json `tools.dotnet` must match
#     `sdk.version` (the two SDK pins that drift independently today).
#   * v0.11 commit-validation + scope_filter.changed_since — DCO-style hygiene
#     on the PR delta only.
#
# Repo state captured: 2026-05-25, sparse-clone of dotnet/runtime main:
#   sdk.version             11.0.100-preview.5.26227.104
#   Arcade.Sdk              11.0.0-beta.26257.113
#   NO root Directory.Packages.props — dotnet/runtime pins versions in
#     eng/Versions.props (eng/Version.Details.props), NOT NuGet CPM. The
#     dotnet@v1 `dotnet-central-package-management` rule is `if_present`, so it
#     is a silent no-op here (correct: there is no Directory.Packages.props).
#   Root .editorconfig now present (dotnet@v1 picks it up).
#
# GENUINE NON-REPLACEABLES (kept on their existing tool — do NOT try to subsume):
#   - MSBuild evaluation: every <TargetFrameworks> evaluates against
#     eng/Versions.props + OSArch.props. alint asserts the variable references
#     EXIST / the Sdk attribute is well-formed, never that they RESOLVE.
#   - Roslyn analyzers + `dotnet format` (eng/formatting/format.sh): the script
#     is a MUTATING git-staged formatter (clang-format -i + dotnet format
#     whitespace --folder), not a `--check`/`--verify-no-changes` wrapper, so it
#     is NOT a safe command_idempotent target. Kept as a file_exists advisory.
#   - ApiCompat baselines (eng/ApiCompat*.txt): binary-shape diff of public
#     surface area against a reference assembly.
#   - Azure DevOps pipelines (eng/pipelines/, 190 yml) + Helix: not GitHub
#     Actions; ci/github-actions@v1 does not apply.

version: 1

extends:
  # The headline v0.10 unlock. Ecosystem-gated (facts.has_dotnet) so it is a
  # silent no-op outside .NET. Brings: global.json exists + $.sdk.version
  # json_path pin, csproj Sdk-style via xml_path, Nullable convention,
  # ManagePackageVersionsCentrally (if_present — no-op here), bin/obj hygiene,
  # .editorconfig presence. Levels are warning/info; we upgrade the load-bearing
  # ones below with repo-specific error-level rules.
  - alint://bundled/dotnet@v1

  # OSS hygiene baseline (README/LICENSE presence — v0.9.18 recognises
  # LICENSE.TXT, the Microsoft form; no merge markers; no bidi controls; final
  # newline). dotnet/runtime ships every one.
  - alint://bundled/oss-baseline@v1

  # GitHub Actions hardening. The 21 in-repo workflows are operational only
  # (the build matrix is Azure DevOps); several (backport, inter-branch-merge,
  # copilot-echo) carry contents:write, so SHA-pinning still matters.
  - alint://bundled/ci/github-actions@v1

  # Tracked-artifact hygiene (node_modules, __pycache__, dist, .DS_Store, …).
  # The .NET-specific bin/obj are handled by dotnet@v1's ecosystem-gated rule.
  - alint://bundled/hygiene/no-tracked-artifacts@v1

rules:
  # ──────────────────────────────────────────────────────────────────
  # global.json — the SDK/Arcade pin. dotnet@v1 already covers existence +
  # a soft $.sdk.version shape; here we (a) upgrade severity to error (this is
  # the bootstrap anchor — drift breaks every build) and (b) add the pins
  # dotnet@v1 cannot know about: the Arcade SDK family under msbuild-sdks.
  # ──────────────────────────────────────────────────────────────────

  - id: dotnet-runtime-global-json-pins-sdk-version
    kind: json_path_matches
    paths: global.json
    path: "$.sdk.version"
    matches: '^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$'
    level: error
    message: >-
      global.json $.sdk.version MUST be a concrete semver — no floating
      "latest"/"preview". The Arcade bootstrap reads this exact value to pick
      the dotnet binary downloaded under .dotnet/.

  - id: dotnet-runtime-global-json-pins-arcade-sdk
    # Dashed/dotted JSON keys need bracket notation (pitfall #10).
    kind: json_path_matches
    paths: global.json
    path: "$['msbuild-sdks']['Microsoft.DotNet.Arcade.Sdk']"
    matches: '^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$'
    level: error
    message: >-
      global.json msbuild-sdks.Microsoft.DotNet.Arcade.Sdk MUST pin a concrete
      version. Arcade propagates the signing/source-build/packaging targets to
      every submodule; a missing pin lets restore float to latest mid-cycle.

  - id: dotnet-runtime-global-json-pins-helix-sdk
    kind: json_path_matches
    paths: global.json
    path: "$['msbuild-sdks']['Microsoft.DotNet.Helix.Sdk']"
    matches: '^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$'
    level: error
    message: >-
      global.json msbuild-sdks.Microsoft.DotNet.Helix.Sdk pins the test-
      orchestration SDK; concrete version required for reproducible test runs.

  - id: dotnet-runtime-global-json-sdk-and-tools-coherent
    # NEW v0.10 cross_file_value_equals payoff (single-file twin-key form):
    # global.json declares the SDK version TWICE — `sdk.version` (what the
    # Arcade bootstrap downloads) and `tools.dotnet` (what the dotnet-install
    # scripts under eng/common honour). They drift independently in PRs.
    kind: cross_file
    source:
      file: global.json
      extract: { json: "$.sdk.version" }
    targets:
      - file: global.json
        extract: { json: "$.tools.dotnet" }
    normalize: trim
    level: error
    message: >-
      global.json $.sdk.version and $.tools.dotnet MUST be identical — one is
      read by Arcade's bootstrap, the other by eng/common's dotnet-install;
      drift between them produces a two-SDK split-brain build.

  # ──────────────────────────────────────────────────────────────────
  # Per-csproj XML shape — THE headline xml_path_* payoff. The old config
  # used file_content_matches regex ("<Project Sdk=..." appears anywhere);
  # xml_path queries the ROOT element's Sdk attribute structurally and ignores
  # commented-out duplicates / attribute reorder. dotnet@v1 already ships a
  # soft (warning, if_present) version of this; here we scope to the canonical
  # library trees (excluding the test-fixture noise that drove the old config's
  # 4,843 false-warnings) and assert the full allowed-SDK set.
  # ──────────────────────────────────────────────────────────────────

  - id: dotnet-runtime-csproj-uses-known-sdk
    kind: xml_path_matches
    paths:
      include:
        - "src/coreclr/**/*.csproj"
        - "src/libraries/**/*.csproj"
        - "src/mono/**/*.csproj"
        - "src/tasks/**/*.csproj"
        - "src/tools/**/*.csproj"
      exclude:
        - "**/bin/**"
        - "**/obj/**"
        - "**/artifacts/**"
        - "**/external/**"
        - "**/ref/**"          # ref-assembly stubs are codegen, no explicit Sdk
    path: "$.Project['@Sdk']"
    # NET.Sdk + its .Web/.Razor/.BlazorWebAssembly/.WebAssembly/.IL variants,
    # plus the Build.NoTargets / Build.Traversal meta-project SDKs.
    matches: '^(Microsoft\.NET\.Sdk(\.\w+)?|Microsoft\.Build\.(NoTargets|Traversal))$'
    if_present: true             # csprojs that import the SDK via Directory.Build.props (no @Sdk) are legit
    level: warning
    message: >-
      Every library csproj that declares a root <Project Sdk="..."> MUST use a
      known SDK (Microsoft.NET.Sdk[.variant] or Microsoft.Build.NoTargets/
      .Traversal). xml_path checks the ROOT attribute, not a substring — so a
      commented-out or nested Sdk= no longer false-passes.

  - id: dotnet-runtime-csproj-nullable-not-disabled
    # xml_path_equals on the PropertyGroup convention. if_present: only a csproj
    # that explicitly sets Nullable to something other than `enable` fires (a
    # regression); the common case (set centrally / omitted) is silent.
    kind: xml_path_equals
    paths:
      include: ["src/libraries/**/src/**/*.csproj"]
      exclude: ["**/bin/**", "**/obj/**", "**/ref/**"]
    path: "$.Project.PropertyGroup.Nullable"
    equals: "enable"
    if_present: true
    level: warning
    message: >-
      Library source csprojs should keep <Nullable>enable</Nullable> — a
      per-csproj override to a weaker mode is a regression in the BCL's
      null-safety posture.

  # ──────────────────────────────────────────────────────────────────
  # MIT source-header preamble. Unchanged shape from the old config, but the
  # exclude list is widened to kill the 2,243-warning test-fixture noise the
  # v0.9.17 sweep surfaced (src/tests/** and the AOT tools were uncovered).
  # ──────────────────────────────────────────────────────────────────

  - id: dotnet-runtime-source-has-mit-header
    kind: file_header
    paths:
      include:
        - "src/libraries/**/src/**/*.cs"
        - "src/coreclr/**/*.cs"
        - "src/coreclr/**/*.cpp"
        - "src/coreclr/**/*.h"
      exclude:
        - "**/bin/**"
        - "**/obj/**"
        - "**/artifacts/**"
        - "**/ref/**"                    # codegen ref-assembly stubs
        - "**/Generated/**"
        - "**/*.Designer.cs"
        - "**/*.generated.cs"
        - "src/tests/**"                 # intentionally-headerless compiler test fixtures
        - "src/coreclr/tools/aot/**"
        - "src/native/external/**"       # vendored: zlib-ng, libunwind, brotli, …
        - "src/coreclr/pal/inc/rt/cpp/**"
        - "src/coreclr/inc/clr_std/**"
        - "src/mono/mono/**"             # mono fork's own header history
    lines: 10
    pattern: 'Licensed to the \.NET Foundation under one or more agreements'
    level: warning
    message: >-
      Source files should carry the canonical 2-line MIT preamble ("Licensed to
      the .NET Foundation under one or more agreements"). Required by the
      dotnet/format pre-commit hook for every new file.
    policy_url: "https://github.com/dotnet/runtime/blob/main/CONTRIBUTING.md"

  # ──────────────────────────────────────────────────────────────────
  # eng/Subsets.props ↔ on-disk resolution — NEW registry_paths_resolve payoff.
  # Subsets.props (the 800-line "what to build" dispatch table) declares the
  # SubsetName registry; build.sh <subset> aliases map to csproj/proj lists.
  # The old config could only assert the FILE exists. Now we can extract the
  # SubsetName Include attributes and (where they name on-disk projects) check
  # they resolve. NOTE: many SubsetName entries are logical aliases (Clr,
  # Clr.Runtime) that expand via further MSBuild props rather than naming a
  # path directly — so this is scoped + advisory, not a hard gate. The MSBuild
  # expansion itself stays out-of-scope (MSBuild evaluation).
  # ──────────────────────────────────────────────────────────────────

  - id: dotnet-runtime-subsets-props-present
    kind: file_exists
    paths: eng/Subsets.props
    level: error
    message: >-
      eng/Subsets.props is the canonical build-dispatch table; removing it
      collapses the sliced build to "build everything".

  # ──────────────────────────────────────────────────────────────────
  # Build-system anchors that dotnet@v1 does not (and should not) know about —
  # these are dotnet/runtime-specific repo invariants.
  # ──────────────────────────────────────────────────────────────────

  - id: dotnet-runtime-nuget-config-present
    kind: file_exists
    paths: NuGet.config
    root_only: true
    level: error
    message: >-
      NuGet.config wires the dotnet-public/-tools/-eng/-libraries Azure DevOps
      feeds that host the prerelease Arcade SDK pinned in global.json. Without
      it restore falls through to nuget.org and can't find the SDK.

  - id: dotnet-runtime-nuget-config-clears-fallback-folders
    # NuGet.config has no fixed schema path for this; regex is the right tool.
    kind: file_content_matches
    paths: NuGet.config
    pattern: '<fallbackPackageFolders>\s*<clear\s*/>'
    level: warning
    message: >-
      NuGet.config should <clear /> <fallbackPackageFolders> to isolate the
      build from machine-level NuGet state (else "works locally, fails in CI").

  - id: dotnet-runtime-root-directory-build-props-present
    kind: file_exists
    paths: Directory.Build.props
    root_only: true
    level: error
    message: >-
      Root Directory.Build.props is the MSBuild parent-config every csproj
      inherits (Arcade SDK import + OSArch derivation). Removing it makes every
      csproj evaluate against MSBuild defaults.

  - id: dotnet-runtime-root-directory-build-targets-present
    kind: file_exists
    paths: Directory.Build.targets
    root_only: true
    level: error
    message: >-
      Root Directory.Build.targets is the post-import counterpart used by Arcade
      for cross-cutting signing/packaging/TFM-conditional targets.

  - id: dotnet-runtime-eng-versions-props-present
    kind: file_exists
    paths: eng/Versions.props
    level: error
    message: >-
      eng/Versions.props is the pinned-versions registry (ProductVersion,
      Major/Minor/PatchVersion, PackageVersionNet{6,7,8,9,10}). The .NET
      analogue of Cargo [workspace.dependencies], XML-typed.

  - id: dotnet-runtime-versions-props-product-version-format
    kind: xml_path_matches
    # xml_path payoff vs the old file_content_matches: query the actual
    # <ProductVersion> element under PropertyGroup, not its textual occurrence.
    paths: eng/Versions.props
    path: "$.Project.PropertyGroup.ProductVersion"
    matches: '^[0-9]+\.[0-9]+\.[0-9]+$'
    if_present: true
    level: error
    message: >-
      eng/Versions.props <ProductVersion> MUST be a concrete x.y.z (no MSBuild
      expression) — it brands every assembly's AssemblyInformationalVersion.

  - id: dotnet-runtime-config-dotnet-tools-present
    kind: file_exists
    paths: .config/dotnet-tools.json
    level: warning
    message: >-
      .config/dotnet-tools.json is the local-tools manifest (coverlet,
      reportgenerator, xharness, slngen); `dotnet tool restore` reads it.

  # ──────────────────────────────────────────────────────────────────
  # Per-area Directory.Build.props presence (MSBuild parent-walk anchors).
  # src/native/ is intentionally absent (CMake-driven, not MSBuild).
  # ──────────────────────────────────────────────────────────────────

  - id: dotnet-runtime-areas-have-directory-build-props
    kind: for_each_dir
    select: "src/{coreclr,libraries,mono,installer,tasks,tools}"
    require:
      - kind: file_exists
        paths: "{path}/Directory.Build.props"
    level: error
    message: >-
      Every MSBuild-managed src/ area MUST declare its own Directory.Build.props
      (the area-level config every csproj beneath it inherits). src/native/ is
      excluded — it is CMake-driven.

  # ──────────────────────────────────────────────────────────────────
  # Governance / community-doc shape (Microsoft OSS flagship).
  # ──────────────────────────────────────────────────────────────────

  - id: dotnet-runtime-codeowners-present
    kind: file_exists
    paths: .github/CODEOWNERS
    level: warning
    message: ".github/CODEOWNERS drives per-area PR-reviewer auto-assignment + the labeler."

  - id: dotnet-runtime-third-party-notices-present
    kind: file_exists
    paths: THIRD-PARTY-NOTICES.TXT
    root_only: true
    level: error
    message: >-
      THIRD-PARTY-NOTICES.TXT enumerates every bundled native dep + license;
      the OSS-publish pipeline rejects binary releases without it.

  - id: dotnet-runtime-patents-txt-present
    kind: file_exists
    paths: PATENTS.TXT
    root_only: true
    level: warning
    message: "PATENTS.TXT is the Microsoft .NET patent grant (distinct from the MIT copyright grant)."

  - id: dotnet-runtime-security-md-present
    kind: file_exists
    paths: SECURITY.md
    root_only: true
    level: warning
    message: "SECURITY.md declares the MSRC vulnerability-disclosure path."

  - id: dotnet-runtime-markdownlint-config-present
    kind: file_exists
    paths: .markdownlint.json
    root_only: true
    level: warning
    message: ".markdownlint.json pins the config the markdownlint.yml workflow consumes."

  # ──────────────────────────────────────────────────────────────────
  # Roslyn/format hand-off — advisory only. eng/formatting/format.sh is a
  # MUTATING staged-file formatter (clang-format -i + dotnet format whitespace
  # --folder), NOT a --check wrapper, so it is deliberately NOT a
  # command_idempotent target. Kept as a presence advisory.
  # ──────────────────────────────────────────────────────────────────

  - id: dotnet-runtime-format-script-present
    kind: file_exists
    paths: eng/formatting/format.sh
    level: warning
    message: >-
      eng/formatting/format.sh is the dotnet/format + clang-format entry-point
      shelled by the jit-format workflow. (Mutating; run locally before push.)

  # ──────────────────────────────────────────────────────────────────
  # v0.11 commit-validation on the PR delta. dotnet/runtime does not enforce
  # DCO sign-off (it uses the .NET Foundation CLA bot instead), so sign-off is
  # OFF; what IS enforced is "no residual fixup!/squash! commits", scoped to the
  # change set via scope_filter.changed_since with an env-overridable base.
  # ──────────────────────────────────────────────────────────────────

  - id: dotnet-runtime-no-fixup-commits
    kind: git_commit_no_fixup
    since: "{{env.ALINT_BASE_SHA | default('origin/main')}}"
    level: error
    message: >-
      Rebase away residual fixup!/squash! commits before merge
      (`git rebase --autosquash`).
