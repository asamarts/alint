# yaml-language-server: $schema=https://raw.githubusercontent.com/asamarts/alint/main/schemas/v1/config.json
#
# Proposed v0.11 alint config for apache/airflow.
# =================================================
#
# This is the v0.11 RE-ANALYSIS of examples/apache-airflow/.alint.yml.
# Since the original case study (alint v0.9.20) the following primitives
# shipped and CLOSE coverage gaps that were previously "alint-future":
#
#   v0.10:
#     - cross_file_value_equals   -> the 11 "value in A must equal value in B" hooks
#     - import_gate               -> precise import-firewall (extracted target + allow globs)
#     - ordered_block             -> keep-sorted marker regions
#     - generated_file_fresh      -> run a declared generator, diff stdout (non-mutating)
#     - command_idempotent        -> run a tool in --check mode; offender-list -> per-file
#     - apache/governance@v1      -> the Apache-TLP governance superset bundled ruleset
#     - xml_path_equals|matches   -> structured query over .xml/.csproj/etc.
#
#   v0.11:
#     - git_commit_signed_off / _no_fixup / _author_allowlist / _gpg_signed
#       -> commit-validation family (DCO sign-off, no residual fixup!, author domain)
#
# Adopt by saving as .alint.yml at the repo root and running `alint check`.
# Tune the `paths:`/`scope_filter:`/`exclude:` lists to your fork's layout.
#
# STILL out of scope (genuine non-replaceables — see findings.md §3):
#   - check-template-fields-valid             (Python AST: BaseOperator.templated_fields)
#   - check-metrics-synced-with-registry      (Python AST + cross-YAML semantic walk)
#   - check-no-new-airflow-exceptions         (delta vs. golden file; AST class scan)
#   - check-revision-heads-map                (Alembic migration-graph diff)
#   - check-docstring-param-types / -lazy-logging / -migration-patterns (AST visitors)
#   - mypy-* / ruff type-aware lint / unit + helm + k8s + e2e tests (runtime/typecheck)
#   - the 22 update-*/generate-* codegen hooks that REGENERATE files
#     (alint never mutates the tree; generated_file_fresh covers only the
#      stdout-diffable, deterministic subset — see §3)

version: 1

extends:
  - alint://bundled/oss-baseline@v1                  # license/readme/security/CoC + hygiene
  - alint://bundled/python@v1                        # pyproject + py source hygiene (has_ancestor pyproject.toml)
  - alint://bundled/ci/github-actions@v1             # workflow permissions + SHA-pin + name (all 44 workflows)
  - alint://bundled/apache/governance@v1             # NEW (v0.10): ASF-TLP governance superset (LICENSE/NOTICE/
                                                     #   ASF-attribution/source-header/no-binaries-in-source/README/changelog).
                                                     #   Supersedes the standalone compliance/apache-2@v1 in the old config;
                                                     #   apache-gov-* ids compose with it without collision.
  - alint://bundled/hygiene/no-tracked-artifacts@v1  # __pycache__, dist/, build/, *.egg-info, etc.
  - alint://bundled/hygiene/lockfiles@v1             # lockfile presence + no-nested
  - alint://bundled/tooling/editorconfig@v1          # NEW overlay: airflow ships a .editorconfig

rules:
  # ════════════════════════════════════════════════════════════════════
  # 1. Provider-package conventions — the alint sweet spot (unchanged
  #    shape from v0.9 config; 101 distributions under providers/).
  # ════════════════════════════════════════════════════════════════════

  - id: airflow-provider-required-meta-files
    kind: for_each_file
    select: "providers/**/provider.yaml"
    require:
      - { kind: file_exists, paths: "{dir}/pyproject.toml" }
      - { kind: file_exists, paths: "{dir}/README.rst" }
      - { kind: file_exists, paths: "{dir}/LICENSE" }
      - { kind: file_exists, paths: "{dir}/NOTICE" }
      - { kind: dir_exists,  paths: "{dir}/src" }
      - { kind: dir_exists,  paths: "{dir}/tests" }
      - { kind: dir_exists,  paths: "{dir}/docs" }
    level: error
    message: >-
      Every provider distribution (a directory containing provider.yaml)
      must ship pyproject.toml, README.rst, LICENSE, NOTICE, and
      src/, tests/, docs/ subdirectories.

  - id: airflow-provider-yaml-package-name
    kind: yaml_path_matches
    paths: "providers/**/provider.yaml"
    path: "$['package-name']"           # bracket notation for the dashed key
    matches: '^apache-airflow-providers-[a-z][a-z0-9-]*$'
    level: error
    message: "provider.yaml `package-name` must match apache-airflow-providers-<name>."

  - id: airflow-provider-yaml-state
    kind: yaml_path_matches
    paths: "providers/**/provider.yaml"
    path: "$.state"
    matches: '^(ready|not-ready|suspended|removed)$'
    level: error
    message: "provider.yaml `state` must be one of: ready, not-ready, suspended, removed."

  - id: airflow-provider-pyproject-name-matches
    kind: toml_path_matches
    paths: "providers/**/pyproject.toml"
    path: "$.project.name"
    matches: '^apache-airflow-providers-[a-z][a-z0-9-]*$'
    level: error

  - id: airflow-distribution-gitignore-iml
    # check-distribution-gitignore: every dir with a pyproject.toml needs a
    # .gitignore containing `*.iml` (keep IntelliJ module files out of git).
    kind: for_each_file
    select: "**/pyproject.toml"
    when_iter: 'iter.parent_name != ""'
    require:
      - { kind: file_exists, paths: "{dir}/.gitignore" }
      - { kind: file_content_matches, paths: "{dir}/.gitignore", pattern: '^\*\.iml\s*$' }
    level: error
    message: "Every distribution (dir with pyproject.toml) needs a .gitignore containing `*.iml`."

  # ════════════════════════════════════════════════════════════════════
  # 2. ★ v0.10 import_gate — the import firewall (was Python-AST-only).
  #    Replaces the pygrep `check-base-operator-usage`, the
  #    `check-provide-create-sessions-imports` hook, AND the dominant
  #    static case of `check-airflow-imports-in-shared` /
  #    `check-test-only-imports-in-src` (layer firewalls). import_gate
  #    tests the EXTRACTED import target, not the raw line, so a comment
  #    or docstring mentioning the path no longer false-positives the way
  #    the old file_content_forbidden rules did.
  # ════════════════════════════════════════════════════════════════════

  - id: airflow-import-baseoperator-from-models
    # check-base-operator-usage (variant 1): import BaseOperator from
    # airflow.models.baseoperator, never the airflow.models package root
    # (avoids circular imports in core). 14 real offenders at last capture.
    kind: import_gate
    paths: "**/*.py"
    language: python
    forbid: '^airflow\.models$'           # matched on the extracted module target
    level: error
    message: >-
      Import BaseOperator from `airflow.models.baseoperator`, not the
      `airflow.models` package root (circular-import guard).

  - id: airflow-import-baseoperatorlink-from-models
    # check-base-operator-usage (variant 2)
    kind: import_gate
    paths: "**/*.py"
    language: python
    forbid: '^airflow\.models\.baseoperatorlink$'
    level: error

  - id: airflow-import-session-helpers-from-db
    # check-provide-create-sessions-imports: session helpers must come from
    # airflow.utils.session, not airflow.utils.db (import-cycle guard).
    kind: import_gate
    paths: "**/*.py"
    language: python
    forbid: '^airflow\.utils\.db$'        # NEW_SESSION/provide_session/create_session live in utils.session
    allow:
      - "airflow-core/src/airflow/utils/db.py"      # the module itself defines them
      - "airflow-core/src/airflow/utils/db_*.py"
    level: warning
    message: >-
      Import session helpers from `airflow.utils.session`, not
      `airflow.utils.db` (avoids import cycles). NOTE: import_gate keys on
      the module target; if a stricter symbol-level check is required keep
      check-provide-create-sessions-imports on prek.

  - id: airflow-shared-no-airflow-imports
    # ★ check-airflow-imports-in-shared (was a Python-AST gate; the
    # dominant static case is now expressible). The shared/ distributions
    # must not import the airflow.* runtime — they are stand-alone libs.
    kind: import_gate
    paths: "shared/**/src/**/*.py"
    language: python
    forbid: '^airflow($|\.)'
    allow:
      - "shared/**/tests/**"              # tests may import airflow
    level: error
    message: >-
      shared/ distributions are stand-alone libraries and must not import
      the `airflow.*` runtime (they're depended on by airflow, not the
      reverse). Full AST coverage stays on check-airflow-imports-in-shared.

  # ════════════════════════════════════════════════════════════════════
  # 3. File-content forbidden patterns (pygrep hooks that are genuinely
  #    line-level, not import-target shaped — these stay file_content_*).
  # ════════════════════════════════════════════════════════════════════

  - id: airflow-no-pydevd-settrace
    kind: file_content_forbidden          # check-pydevd-left-in-code
    paths: "**/*.py"
    pattern: 'pydevd.*settrace\('
    level: error
    message: "pydevd debug statement left in code; remove before committing."

  - id: airflow-no-jinja-safe-filter
    kind: file_content_forbidden          # check-safe-filter-usage-in-html
    paths: "**/*.html"
    pattern: '\|\s*safe'
    level: error
    message: "The Jinja `|safe` filter is error-prone; use `Markup()` in Python instead."

  - id: airflow-no-urlparse
    kind: file_content_forbidden          # check-urlparse-usage-in-code
    paths: "**/*.py"
    pattern: '^\s*from urllib\.parse import .*urlparse'
    level: warning
    message: "`urlparse` is not recommended; use `urlsplit()` instead."

  - id: airflow-no-deprecation-warning-categories-in-core
    kind: file_content_forbidden          # check-core-deprecation-classes
    paths: "airflow-core/src/**/*.py"
    pattern: 'category=(Pending)?DeprecationWarning'
    level: error
    message: >-
      Use Airflow's deprecation classes (AirflowProviderDeprecationWarning,
      RemovedInAirflow3Warning), not the built-in DeprecationWarning categories.

  - id: airflow-no-bare-loggingmixin
    kind: file_content_forbidden          # check-incorrect-use-of-LoggingMixin
    paths: "**/*.py"
    pattern: 'LoggingMixin\(\)'
    level: error
    message: "`LoggingMixin` is a mixin; subclass it, don't instantiate it standalone."

  - id: airflow-no-log-warn
    kind: file_content_forbidden          # python-no-log-warn (pygrep-hooks)
    paths: "**/*.py"
    pattern: '\.warn\('
    level: warning
    message: "Use logger.warning(), not the deprecated logger.warn()."

  - id: airflow-no-start-date-in-default-args
    kind: file_content_forbidden          # check-start-date-not-used-in-defaults
    paths: "**/example_dags/**/*.py"
    pattern: '(default_args\s*=\s*\{\s*[''"]start_date[''"]|[''"]start_date[''"]:\s*)'
    level: warning
    message: "Don't put `start_date` in default_args; set it on the DAG directly."

  - id: airflow-inclusive-language
    kind: file_content_forbidden          # check-for-inclusive-language
    paths:
      include: ["**/*.py", "**/*.rst", "**/*.md"]
      exclude:
        - "providers/*/docs/changelog.rst"
        - "**/CHANGELOG.rst"
        - "**/changelog.rst"
        - "INTHEWILD.md"
        - "RELEASE_NOTES.rst"
        - "airflow-core/newsfragments/**"
    pattern: '(?i)\b(blacklist|whitelist|master|slave|sanity|dummy)\b'
    level: warning
    message: "Use inclusive terminology (allowlist/denylist, primary/replica, smoke-test, placeholder)."

  # ════════════════════════════════════════════════════════════════════
  # 4. ★ v0.10 ordered_block — keep-sorted marker regions.
  #    Airflow's whole-file sorted lists (spelling_wordlist.txt,
  #    INTHEWILD.md, prod_image_installed_providers.txt) are sorted by
  #    the update-*-to-be-sorted CODEGEN hooks (which mutate the file) —
  #    ordered_block is the *detection* half. It governs MARKER-delimited
  #    regions; for whole-file sorted lists, wrap the list in
  #    `# keep-sorted start/end` markers (a one-time upstream edit) to make
  #    it enforceable here. The genuine marker regions already in the tree
  #    (configuration.py, providers_manager.py, etc.) are covered directly.
  # ════════════════════════════════════════════════════════════════════

  - id: airflow-keep-sorted-blocks
    kind: ordered_block                   # update-*-to-be-sorted (detection half) + in-tree keep-sorted regions
    paths:
      include: ["**/*.py", "**/*.txt", "**/*.toml", "**/*.cfg"]
      exclude: ["**/node_modules/**", "**/dist/**"]
    start: "# keep-sorted start"
    end: "# keep-sorted end"
    comparator: lexical-ci
    unique: true                          # also catches check-changelog-has-no-duplicates-style dup entries in marked regions
    level: warning
    message: >-
      Lines inside a `# keep-sorted` region must stay sorted and unique.
      Re-sort the block (or run the upstream sort_*.py codegen hook).

  # ════════════════════════════════════════════════════════════════════
  # 5. ★ v0.10 cross_file_value_equals — the densest single gap (11 hooks
  #    in the old analysis). "A value in file A must equal a value in B."
  # ════════════════════════════════════════════════════════════════════

  - id: airflow-version-consistency
    # ★ check-version-consistency: the canonical airflow version in the
    # core pyproject.toml must match the value restated elsewhere. Tune the
    # source/target paths to your fork's exact version-carrying files.
    kind: cross_file
    source:
      file: airflow-core/pyproject.toml
      extract: { toml: "$.project.version" }
    targets:
      - file: airflow-core/src/airflow/__init__.py
        extract: { regex: '__version__\s*=\s*"([^"]+)"' }
    normalize: trim
    allow_missing_target: true            # the __version__ line may be templated in some checkouts
    level: error
    message: "{{ctx.target}} version != the canonical airflow-core/pyproject.toml version."

  - id: airflow-uv-min-version-coherent
    # ★ sync-uv-min-version-markers (the static subset): the uv
    # required-version pin in the root pyproject must match the value
    # restated in the devel pyproject. The marker-rewrite half stays on
    # the codegen hook; this catches drift.
    kind: cross_file
    source:
      file: pyproject.toml
      extract: { toml: "$.tool.uv.required-version" }
    targets:
      files: "devel-common/pyproject.toml"
      extract: { toml: "$.tool.uv.required-version" }
    normalize: trim
    allow_missing_target: true
    level: warning
    message: "uv required-version pin drifted from the root pyproject.toml."

  # ════════════════════════════════════════════════════════════════════
  # 6. Apache governance extras not covered by apache/governance@v1.
  # ════════════════════════════════════════════════════════════════════

  - id: airflow-asf-notice-current-year
    # check-notice-files: NOTICE must declare the current copyright year.
    # apache/governance@v1 enforces the invariant ASF attribution substring;
    # the year-range is airflow-specific. Bump the year each January.
    kind: file_content_matches
    paths: ["NOTICE", "**/NOTICE"]
    pattern: 'Copyright 2016-2026 The Apache Software Foundation'
    level: error
    message: "NOTICE files must include `Copyright 2016-<current_year> The Apache Software Foundation`."

  - id: airflow-no-zip-files
    kind: file_absent                     # check-zip-file-is-not-committed
    paths: "**/*.zip"
    level: error
    message: "Zip files are not allowed in the repo (hard to track + security risk)."

  # ════════════════════════════════════════════════════════════════════
  # 7. JSON-Schema validation — lint-json-schema (local-schema variant).
  # ════════════════════════════════════════════════════════════════════

  - id: airflow-json-schema-files-are-draft7
    # lint-json-schema variant 1 (local draft-07 meta-schema). The two
    # remote --spec-url variants (NodePort, docker-compose) need their
    # schemas vendored locally first; otherwise keep those on prek.
    kind: json_schema_passes
    paths: "**/*.schema.json"
    schema_path: "scripts/ci/prek/draft7_schema.json"
    level: error

  - id: airflow-provider-yaml-schema
    # run_provider_yaml_files_check.py (structural subset): provider.yaml
    # files validate against the published JSON Schema. Replaces the
    # 1085-line container-spawn-and-import pass for the schema-shaped checks.
    kind: json_schema_passes
    paths: "providers/**/provider.yaml"
    schema_path: "airflow-core/src/airflow/provider.yaml.schema.json"
    level: error

  # ════════════════════════════════════════════════════════════════════
  # 8. ★ v0.11 commit-validation family. Apache projects require DCO
  #    sign-off; these run in PR CI scoped to the PR commit range. Set
  #    ALINT_BASE_SHA in the workflow (e.g. ${{ github.event.pull_request.base.sha }}).
  # ════════════════════════════════════════════════════════════════════

  - id: airflow-dco-signed-off
    kind: git_commit_signed_off           # DCO sign-off (default kernel-DCO pattern)
    since: "{{env.ALINT_BASE_SHA | default('origin/main')}}"
    level: error
    message: "Every commit must carry a DCO `Signed-off-by:` trailer (use `git commit -s`)."

  - id: airflow-no-fixup-commits
    kind: git_commit_no_fixup             # no residual fixup!/squash!/amend! commits in a PR
    since: "{{env.ALINT_BASE_SHA | default('origin/main')}}"
    level: error
    message: "Rebase away residual fixup!/squash! commits before merge (`git rebase --autosquash`)."

  # ════════════════════════════════════════════════════════════════════
  # 9. ★ v0.10 command_idempotent — run a checker ONCE per repo in
  #    --check mode; parse its offender list into per-file violations.
  #    This is the headline perf upgrade over the old per-file `command`
  #    fan-out (which spawned ruff/codespell once per matching file —
  #    ~9k spawns for codespell alone). One spawn, offender list parsed.
  # ════════════════════════════════════════════════════════════════════

  - id: airflow-ruff-check
    kind: command_idempotent              # ruff (lint) — one invocation, per-file attribution
    command: ["ruff", "check", "--output-format", "concise", "."]
    files_from: stdout
    files_pattern: '^([^:]+):\d+:\d+:'    # ruff concise: path:line:col: CODE message
    level: error
    message: "ruff lint findings — run `ruff check --fix`."

  - id: airflow-ruff-format
    kind: command_idempotent              # ruff-format --check — one invocation
    command: ["ruff", "format", "--check", "."]
    files_from: stdout
    files_pattern: 'Would reformat:\s*(.+)$'
    level: error
    message: "Code is not ruff-format-clean — run `ruff format`."

  - id: airflow-yamllint
    kind: command_idempotent              # yamllint — one invocation, parseable: path:line:col
    command: ["yamllint", "-c", "yamllint-config.yml", "--strict", "-f", "parsable", "."]
    files_from: stdout
    files_pattern: '^([^:]+):\d+:\d+:'
    level: error

  - id: airflow-codespell
    kind: command_idempotent              # codespell — one invocation (was ~9k per-file spawns)
    command:
      - "codespell"
      - "--ignore-words=docs/spelling_wordlist.txt"
      - "--exclude-file=.codespellignorelines"
      - "."
    files_from: stdout
    files_pattern: '^([^:]+):\d+:'        # codespell default: path:line: word ==> suggestion
    level: warning

  - id: airflow-shellcheck
    kind: command_idempotent              # shellcheck (GCC format) — one invocation
    command: ["sh", "-c", "shellcheck -f gcc -x $(git ls-files '*.sh' '*.bash')"]
    files_from: stdout
    files_pattern: '^([^:]+):\d+:\d+:'
    level: error

  # ════════════════════════════════════════════════════════════════════
  # 10. Tool wrappers that have no clean check-mode offender list — keep
  #     the per-file `command` rule (alint still parallelises the fan-out).
  # ════════════════════════════════════════════════════════════════════

  - id: airflow-hadolint
    kind: command                         # lint-dockerfile
    paths:
      include: ["Dockerfile", "Dockerfile.*"]
    command: ["hadolint", "--config", ".hadolint.yaml", "{path}"]
    timeout: 30
    level: error

  - id: airflow-zizmor
    kind: command                         # GitHub-workflow security linter
    paths:
      include:
        - ".github/workflows/*.yml"
        - ".github/workflows/*.yaml"
        - ".github/actions/**/*.yml"
        - ".github/actions/**/*.yaml"
    command: ["zizmor", "{path}"]
    timeout: 60
    level: warning

  - id: airflow-bandit
    kind: command                         # security linter, scoped to core src
    paths:
      include: ["airflow-core/src/airflow/**/*.py"]
      exclude: ["**/example_dags/**"]
    command: ["bandit", "--skip", "B101,B301,B324,B403,B404,B603", "--severity-level", "high", "{path}"]
    timeout: 60
    level: warning

  - id: airflow-markdownlint
    kind: command                         # lint-markdown
    paths: "**/*.md"
    command: ["markdownlint", "{path}"]
    timeout: 30
    level: warning
