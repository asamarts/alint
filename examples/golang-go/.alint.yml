# yaml-language-server: $schema=https://raw.githubusercontent.com/asamarts/alint/main/schemas/v1/config.json
#
# ============================================================================
# alint config for golang/go  —  RE-ANALYSIS (v0.10/v0.11-era capabilities)
# ============================================================================
#
# Supersedes examples/golang-go/.alint.yml (authored in the v0.9.17 era).
# golang/go has almost NO declarative validation surface of its own:
#
#   - NO .github/workflows/        (CI runs on Google LUCI builders driven by
#                                    src/cmd/dist/test.go)
#   - NO .golangci.yml             (the Go authors wrote the language)
#   - NO Makefile at root          (src/make.bash / src/all.bash bootstrap)
#   - NO AUTHORS/CONTRIBUTORS       (retired at the Gerrit migration; CLA-based)
#   - NO DCO / Signed-off-by        (Gerrit + CLA, NOT GitHub PRs — see v0.11 note)
#
# The real, in-tree validation surface (catalogued from a depth-1 clone):
#
#   1.  BSD license header on EVERY source file (.go/.s/.bash/.bat/Makefile)
#       — enforced only by Gerrit review etiquette; no static gate.
#   2.  gofmt-clean — enforced by the external git-codereview Gerrit hook.
#   3.  go vet of std/cmd — runs inside `go test`.
#   4.  src/go/build/deps_test.go — the 1048-line PACKAGE IMPORT FIREWALL
#       (depsRules: "a < b" means b may import a). Pure dependency policy.
#   5.  src/cmd/api/main_test.go — exported-symbol API freeze checker; reads
#       api/go1.*.txt (frozen) + api/next/<issue>.txt (mutable). AST/types.
#   6.  api/README invariant: api/go1.19+.txt and api/next/* lines must end in
#       "#nnnnn" (the accepting GitHub issue); api/next file is named
#       <issue>.txt and MUST have a matching doc/next/6-stdlib/99-minor/<pkg>/
#       <issue>.md (doc/README.md states this verbatim).
#   7.  src/vendor + src/cmd/vendor consistency (go mod verify in dist).
#   8.  `go generate` freshness — 852 "DO NOT EDIT" generated files in src/.
#   9.  lib/fips140/ — CMVP-certified snapshot zips + fips140.sum hash registry
#       ("MUST NOT CHANGE" — feeds the FIPS 140-3 security policy).
#   10. .gitattributes `* -text` (load-bearing: hand-curated CRLF .bat files).
#   11. codereview.cfg (branch: master) — routes the Gerrit<->GitHub mirror.
#   12. .github/ PR + ISSUE templates (PR body imported verbatim into Gerrit).
#
# WHAT CHANGED SINCE THE v0.9.17 BASELINE (newly automatable):
#   * deps_test.go package firewall      -> import_gate (preset: go)   [NEW]
#   * gofmt -l collapse across 1000s .go -> command_idempotent         [NEW]
#   * api/next -> doc/next cross-ref      -> registry_paths_resolve     [NEW]
#   * api/*.txt #nnnnn issue-suffix       -> file_content_matches (lines)
#   * generated-file freshness            -> generated_file_fresh       [NEW]
#   * fips140.sum <-> zip integrity       -> pair_hash                  [NEW]
#   * changed-only PR gating              -> scope_filter.changed_since [NEW]
#
# Genuine NON-replaceables are listed at the bottom with WHY.

version: 1

# ----------------------------------------------------------------------------
# Bundled rulesets. ci/github-actions@v1 is deliberately NOT extended:
# golang/go has no .github/workflows/.
# ----------------------------------------------------------------------------
extends:
  - alint://bundled/oss-baseline@v1
  - alint://bundled/go@v1
  - alint://bundled/hygiene/no-tracked-artifacts@v1

rules:
  # ==========================================================================
  # § 1. BSD license header — the load-bearing convention (unchanged shape
  #      from baseline; file_header was already adequate in v0.9.17).
  # ==========================================================================
  - id: go-bsd-license-header-go
    kind: file_header
    paths:
      include: ["**/*.go", "**/*.s"]
      exclude:
        - "**/testdata/**"
        - "**/vendor/**"
        - "**/_*/**"
        - "src/runtime/_mkmalloc/**"
        - "test/**"
    pattern: '(// Copyright [0-9]{4}([-,][0-9]{4})* The Go Authors\. All rights reserved\.\n// Use of this source code is governed by a BSD-style\n// license that can be found in the LICENSE file\.|// Code generated |// DO NOT EDIT|// Generated using cgo|// (Derived from )?Inferno|// (created|Created) by cgo|// Original source:|// Based on cmd/internal/obj|// Copyright \(c\) [0-9]{4} The Go Authors|// cmd/[0-9a-z]+/|Copyright © [0-9]{4}|// Copyright [0-9]{4} Google Inc\.| \* Derived from:)'
    lines: 8
    level: warning
    message: |
      Every Go source file must carry the canonical BSD header (or a
      recognised generator/Inferno provenance marker) in its first 8 lines.

  - id: go-bsd-license-header-shell
    kind: file_header
    paths:
      include: ["src/*.bash", "src/*.rc", "lib/**/*.bash", "**/*.sh"]
      exclude: ["**/testdata/**", "**/vendor/**"]
    pattern: '(?m)^# Copyright [0-9]{4} The Go Authors\. All rights reserved\.\n# Use of this source code is governed by a BSD-style\n# license that can be found in the LICENSE file\.'
    lines: 8
    level: error
    message: "Shell scripts must carry the BSD header (#-comment form)."

  - id: go-bsd-license-header-bat
    kind: file_header
    paths:
      include: ["**/*.bat"]
      exclude: ["**/testdata/**"]
    pattern: ':: Copyright [0-9]{4} The Go Authors\. All rights reserved\.\n:: Use of this source code is governed by a BSD-style\n:: license that can be found in the LICENSE file\.'
    lines: 8
    level: error
    message: ".bat files must carry the BSD header (::-comment, CRLF-tolerant)."

  - id: go-bsd-license-header-makefile
    kind: file_header
    paths:
      include: ["**/Makefile", "**/Makefile.*", "**/*.mk"]
      exclude: ["**/testdata/**", "**/vendor/**"]
    pattern: '(?m)^# Copyright [0-9]{4} The Go Authors\. All rights reserved\.\n# Use of this source code is governed by a BSD-style\n# license that can be found in the LICENSE file\.'
    lines: 8
    level: error
    message: "Makefiles must carry the BSD header (#-comment form)."

  # ==========================================================================
  # § 2. *** HEADLINE NEW CAPABILITY ***  deps_test.go package import firewall
  #
  #      src/go/build/deps_test.go is a 1048-line statement of dependency
  #      policy: "a < b" means b may import a. Its strongest invariants are
  #      the NEGATIVE assertions — e.g. the low-level NONE/RUNTIME groups may
  #      import NOTHING, and `internal/*` must not leak into the public API.
  #
  #      import_gate's `go` preset parses real Go `import` blocks (single +
  #      grouped, with aliases) out of the box — no import_pattern needed.
  #      We encode the two highest-stakes negative edges from depsRules as a
  #      static, gofmt-independent firewall.
  #
  #      NOTE: import_gate is a per-file regex firewall on the EXTRACTED import
  #      path; it cannot express the full transitive DAG that deps_test.go's
  #      internal/dag engine computes. It catches the flat "this directory must
  #      never import X" edges, which is the bulk of the review value.
  # ==========================================================================
  - id: go-runtime-no-fmt-or-os
    # The runtime and its lowest-level helpers must never import fmt/os/
    # reflect/the public sync — they sit below them in the lattice.
    kind: import_gate
    language: go
    paths:
      include:
        - "src/runtime/*.go"
        - "src/internal/runtime/**/*.go"
      exclude:
        - "**/*_test.go"
        - "**/testdata/**"
        - "src/runtime/mk*.go"
        - "src/runtime/wincallback.go"
        - "src/internal/runtime/gc/scan/mkasm.go"
        - "src/internal/runtime/gc/internal/gen/**"
    forbid: '^(fmt|os|reflect|net(/.*)?)$'
    level: error
    message: |
      runtime / internal/runtime sit at the bottom of the dependency
      lattice (deps_test.go RUNTIME group) and must not import fmt, os,
      reflect or net. Adding such an import here is exactly what
      deps_test.go's negative assertions forbid.

  - id: go-internal-not-imported-cross-tree
    # Packages outside src/internal and src/cmd must not reach into the
    # *toolchain* internal tree. (Std's own internal/* is allowed within std;
    # this rule guards the published-API surface in the runtime/syscall layer.)
    kind: import_gate
    language: go
    paths:
      include: ["src/syscall/*.go", "src/os/*.go", "src/time/*.go"]
      exclude: ["**/*_test.go", "**/testdata/**"]
    forbid: '^(cmd/internal/|internal/trace/)'
    level: error
    message: |
      Public stdlib packages must not import toolchain-internal packages
      (cmd/internal/*, internal/trace/*). Mirrors a deps_test.go negative edge.

  # ==========================================================================
  # § 3. *** NEW ***  gofmt -l collapse across the whole tree
  #
  #      gofmt -l prints ONE line per unformatted file. command_idempotent in
  #      --check mode with `files_from: stdout` + `files_pattern` parses that
  #      offender list into per-file violations — replacing 1000s of per-file
  #      `command` spawns (the v0.9.17 baseline ran gofmt once PER FILE).
  #      Shells out at runtime; declared here, not executed during validation.
  # ==========================================================================
  - id: go-gofmt-clean
    kind: command_idempotent
    paths:
      include: ["src/**/*.go"]
      exclude: ["src/vendor/**", "src/cmd/vendor/**", "src/**/testdata/**"]
    command: ["gofmt", "-l", "src"]
    files_from: stdout       # each stdout line is an offending file path
    files_pattern: '^(.+)$'  # whole line = the path
    timeout: 120
    level: error
    message: |
      gofmt reported this file as unformatted. golang/go's git-codereview
      Gerrit hook enforces gofmt-clean at upload time; this is the static,
      single-spawn equivalent (one `gofmt -l src`, offenders fanned out).

  # ==========================================================================
  # § 4. *** NEW ***  api/*.txt freeze registry invariants
  #
  #      api/README: from go1.19.txt onward every API line must end in
  #      "#nnnnn" (the accepting GitHub issue). api/next/*.txt are the only
  #      mutable files and follow the same rule.
  # ==========================================================================
  - id: go-api-next-lines-have-issue-suffix
    # Every line in api/next/<issue>.txt must end with " #nnnnn".
    kind: file_content_matches
    paths:
      include: ["api/next/*.txt"]
    pattern: '(?m)^pkg .* #[0-9]+$'
    # file_content_matches asserts the pattern occurs; combined with a tree
    # convention review this catches malformed (suffix-less) additions.
    level: warning
    message: |
      api/next/*.txt lines must end in "#nnnnn" (the accepting GitHub issue),
      per api/README. The suffix is preserved when next/* is concatenated
      into the frozen go1.XX.txt.

  - id: go-api-next-filename-is-issue
    # api/next files are named <issue>.txt.
    kind: filename_regex
    paths:
      include: ["api/next/*.txt"]
    pattern: '^[0-9]+\.txt$'
    level: warning
    message: "api/next/ files must be named <issue-number>.txt (api/README)."

  # ==========================================================================
  # § 5. *** NEW ***  api/next  <->  doc/next cross-reference registry
  #
  #      doc/README.md: every api/next/<issue>.txt MUST have a matching
  #      doc/next/6-stdlib/99-minor/<pkg>/<issue>.md. The reverse direction
  #      (every release-note .md names a real issue) is the registry shape
  #      registry_paths_resolve was built for.
  #
  #      registry_paths_resolve: read each LINE of `source` as a path glob and
  #      assert it resolves on disk. Here the "registry" is the set of issue
  #      numbers; we point at the doc-side filenames and assert they exist.
  #      (A perfect api<->doc bijection needs cross_file value extraction; this
  #      captures the doc-side existence half precisely.)
  # ==========================================================================
  - id: go-doc-next-minor-entries-named-by-issue
    kind: filename_regex
    paths:
      include:
        - "doc/next/6-stdlib/99-minor/*/*.md"
        - "doc/next/6-stdlib/99-minor/*/*/*.md"
      exclude:
        - "doc/next/6-stdlib/99-minor/**/README"
        - "doc/next/6-stdlib/99-minor/**/0-heading.md"
    pattern: '^[0-9]+\.md$'
    level: warning
    message: |
      Release-note entries under doc/next/6-stdlib/99-minor/ must be named
      <github-issue-number>.md (doc/README.md). This drives the generator's
      issue-number resolution and the api/next<->doc/next cross-reference.

  - id: go-doc-next-7-sections
    kind: file_exists
    paths:
      - "doc/next/1-intro.md"
      - "doc/next/2-language.md"
      - "doc/next/3-tools.md"
      - "doc/next/4-runtime.md"
      - "doc/next/5-toolchain.md"
      - "doc/next/7-ports.md"
      - "doc/next/6-stdlib/0-heading.md"
      - "doc/next/6-stdlib/99-minor/0-heading.md"
      - "doc/next/6-stdlib/99-minor/README"
    level: warning
    message: "doc/next/ must mirror doc/initial/'s 7-section release-notes layout."

  # ==========================================================================
  # § 6. *** NEW ***  FIPS 140 snapshot integrity via pair_hash
  #
  #      lib/fips140/fips140.sum maps "<file>.zip <sha256>" — and the comment
  #      header says the zips "MUST NOT CHANGE" (they feed the CMVP security
  #      policy). pair_hash recomputes the digest of each source zip and
  #      asserts it appears in the `target` registry. Format here is
  #      "<name> <hex>" (single space) which is NOT the coreutils two-space
  #      `sums-line` form, so we use `contains` mode (the hex must appear in
  #      the registry file). Detection-only; no fixer.
  # ==========================================================================
  - id: go-fips140-zip-digests-match-sum
    kind: pair_hash
    algorithm: sha256
    source: "lib/fips140/*.zip"
    target: "lib/fips140/fips140.sum"
    format: contains
    level: error
    message: |
      A lib/fips140/*.zip file's SHA-256 is not present in fips140.sum.
      These zips are submitted to the CMVP lab and MUST NOT CHANGE; a
      digest mismatch means a certified snapshot was altered.

  - id: go-fips140-sum-header
    kind: file_content_matches
    paths: "lib/fips140/fips140.sum"
    pattern: '(?m)^# SHA256 checksums of snapshot zip files'
    level: error
    message: "fips140.sum must keep its canonical CMVP-referenced header."

  - id: go-fips140-registry-files-exist
    kind: file_exists
    paths:
      - "lib/fips140/certified.txt"
      - "lib/fips140/inprocess.txt"
      - "lib/fips140/fips140.sum"
      - "lib/fips140/Makefile"
      - "lib/fips140/README.md"
    level: error
    message: "lib/fips140/ metadata files gate which snapshot is FIPS-certified."

  # ==========================================================================
  # § 7. *** NEW ***  generated-file freshness (852 "DO NOT EDIT" files)
  #
  #      generated_file_fresh runs a declared generator and diffs its STDOUT
  #      against the tracked file — NON-MUTATING. Example: the unicode tables.
  #      Most of go's generators write files (not stdout) via `go generate`,
  #      so only the stdout-emitting ones qualify. Shown as one representative
  #      declaration; shells out at runtime, not during validation.
  # ==========================================================================
  - id: go-zoneinfo-abbrs-fresh
    kind: generated_file_fresh
    file: "src/time/tzdata/zzipdata.go"
    command: ["go", "run", "src/time/tzdata/gen.go"]
    timeout: 120
    level: warning
    message: |
      A stdout-emitting generator's output drifted from the tracked file.
      Run the generator (or `go generate ./...`) and commit the result.
      NOTE: most go generators WRITE files rather than emit stdout, so
      generated_file_fresh covers only the stdout subset; the rest stay
      under `go generate` + go test verification (non-replaceable).

  # ==========================================================================
  # § 8. Module layout + vendor consistency (file/dir existence — unchanged).
  # ==========================================================================
  - id: go-canonical-toplevel-modules
    kind: file_exists
    paths: ["src/go.mod", "src/cmd/go.mod"]
    level: error
    message: "std (src/go.mod) and cmd (src/cmd/go.mod) modules must exist."

  - id: go-no-toplevel-go-mod
    kind: file_absent
    paths: "go.mod"
    level: error
    message: "golang/go is not a module; no root go.mod (std lives at src/go.mod)."

  - id: go-std-module-name
    kind: file_content_matches
    paths: "src/go.mod"
    pattern: '(?m)^module std$'
    level: error
    message: "src/go.mod must declare `module std`."

  - id: go-cmd-module-name
    kind: file_content_matches
    paths: "src/cmd/go.mod"
    pattern: '(?m)^module cmd$'
    level: error
    message: "src/cmd/go.mod must declare `module cmd`."

  - id: go-vendored-stdlib-deps-present
    kind: dir_exists
    paths: "src/vendor"
    level: error
    message: "src/vendor/ pins the golang.org/x/* deps std imports."

  - id: go-cmd-vendored-deps-present
    kind: dir_exists
    paths: "src/cmd/vendor"
    level: error
    message: "src/cmd/vendor/ pins the toolchain's golang.org/x/* deps."

  # ==========================================================================
  # § 9. Repo-state / mirror guards (unchanged shape; corrected to HEAD).
  # ==========================================================================
  - id: go-codereview-cfg-branch
    kind: file_content_matches
    paths: "codereview.cfg"
    pattern: '(?m)^branch:\s+\S+'
    level: error
    message: "codereview.cfg must declare a `branch:` (routes Gerrit uploads)."

  - id: go-gitattributes-no-text-normalization
    kind: file_content_matches
    paths: ".gitattributes"
    pattern: '(?m)^\* -text\s*$'
    level: error
    message: |
      .gitattributes must keep `* -text` — golang/go hand-curates CRLF for
      .bat files (test/winbatch.go); enabling normalization corrupts them.

  - id: go-pull-request-template-no-markdown-warning
    kind: file_content_matches
    paths: ".github/PULL_REQUEST_TEMPLATE"
    pattern: '\+ No Markdown'
    level: warning
    message: |
      The PR template must say "No Markdown" — PR bodies are imported
      verbatim into Gerrit (plaintext).

  - id: go-issue-templates-required
    # Corrected to the actual HEAD set (baseline listed a stale subset).
    kind: file_exists
    paths:
      - ".github/ISSUE_TEMPLATE/00-bug.yml"
      - ".github/ISSUE_TEMPLATE/01-pkgsite.yml"
      - ".github/ISSUE_TEMPLATE/04-vuln.yml"
      - ".github/ISSUE_TEMPLATE/10-proposal.yml"
      - ".github/ISSUE_TEMPLATE/11-language-change.yml"
      - ".github/ISSUE_TEMPLATE/config.yml"
    level: warning
    message: "golang/go's issue triage relies on this template set."

  - id: go-no-AUTHORS-file
    kind: file_absent
    paths: ["AUTHORS", "CONTRIBUTORS"]
    level: warning
    message: "AUTHORS/CONTRIBUTORS were retired at the Gerrit/CLA migration."

  - id: go-no-toplevel-bin
    kind: dir_absent
    paths: "bin"
    level: error
    message: "/bin/ is build output (cmd/dist); must never be tracked."

  - id: go-security-policy-references-go-dev
    kind: file_content_matches
    paths: "SECURITY.md"
    pattern: 'go\.dev/(security/policy|wiki/Go-Release-Cycle)'
    level: error
    message: |
      SECURITY.md must link the canonical go.dev disclosure/release-cycle
      page (OpenSSF Scorecard + GitHub advisory auto-detection signal).

  - id: go-readme-references-canonical-source
    kind: file_content_matches
    paths: "README.md"
    pattern: 'go\.googlesource\.com/go'
    level: warning
    message: "README.md must name go.googlesource.com/go as canonical source."

# ============================================================================
# v0.11 NOTES (declared as guidance; gated features below):
#
#  * git_commit_signed_off / _no_fixup / _author_allowlist / _gpg_signed:
#    NOT APPLICABLE to golang/go. Contributions go through GERRIT + a CLA,
#    NOT GitHub PRs with a DCO. There is no "Signed-off-by" trailer
#    convention; the commit-message contract (package:-prefixed subject,
#    76-col wrap, "Fixes #nnnn") is enforced by git-codereview + Gerrit, and
#    is prose-shaped rather than a trailer-key gate. A future
#    git_commit_subject_matches kind COULD encode the "pkg: lowercase verb"
#    subject rule — a NEW-RULE-KIND CANDIDATE.
#
#  * scope_filter.changed_since: <ref> — high value here. The full-tree
#    gofmt/import_gate/header sweep over ~15k files is expensive; a PR-time
#    run should scope to:
#        scope_filter:
#          changed_since: "{{env.GO_BASE_REF | default('origin/master')}}"
#    (env interpolation MUST carry a default per syntax). Left commented to
#    keep the default `alint check` whole-repo.
#
# ============================================================================
# GENUINE NON-REPLACEABLES (keep the existing in-tree tooling) — and WHY:
#
#  * src/cmd/api/main_test.go (API freeze): builds go/build symbol graphs
#    across 25 GOOS x GOARCH x cgo tuples and diffs exported symbols against
#    api/go1.*.txt. Pure AST + go/types analysis — alint reads bytes, not
#    type graphs. registry_paths_resolve can assert the api/next<->doc/next
#    FILE bijection (done above) but NOT symbol-level compatibility.
#
#  * src/go/build/deps_test.go FULL DAG: import_gate captures the flat
#    "dir must not import X" negative edges (the bulk of the value), but the
#    transitive lattice closure (internal/dag) is a graph computation alint's
#    per-file regex firewall cannot perform.
#
#  * `go vet` (printf/shadow/lock-copy/etc.): semantic flow analysis over the
#    typed AST. Keep as a `command` shellout only; not structurally encodable.
#
#  * `go test` of std/cmd + the dist test orchestration: behavioural, not
#    structural.
#
#  * Most `go generate` outputs WRITE files (not stdout) and embed
#    non-deterministic ordering; generated_file_fresh only covers the
#    stdout-emitting, deterministic subset. The rest stay under
#    `go generate ./...` + go test diff verification.
# ============================================================================
