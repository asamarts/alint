# yaml-language-server: $schema=https://raw.githubusercontent.com/asamarts/alint/main/schemas/v1/config.json
#
# PROPOSED alint config for tensorflow/tensorflow — re-analysis against
# alint v0.10 (new rule kinds) + v0.11 (git-trailer rules, scope_filter,
# {{env.X}} interpolation). Supersedes the v0.9.17-era example.
#
# Repo state: full shallow clone of tensorflow/tensorflow @ HEAD (2026-05-25).
#   - 585 v1 + 600 v2 API golden *.pbtxt (tensorflow/tools/api/golden/)
#   - .clang-format + .pylintrc (symlink → tensorflow/tools/ci_build/pylintrc)
#   - 16 workflows under .github/workflows/
#   - 2 bats sanity suites under ci/official/utilities/:
#       code_check_full.bats        (9 @test: license-graph, pip-dep coverage,
#                                    no-CUDA, no-static-CUDA, tf.org/code links,
#                                    no-dup-windows-casing, bazel nobuild,
#                                    api compat, every-target-queryable)
#       code_check_changed_files.bats (4 @test: buildifier, clang-format[SKIPPED
#                                    upstream], pylint, api compat)
#   - 5 requirements_lock_3_{10..14}.txt pip-compile locks
#   - tensorflow/opensource_only.files (256-entry OSS-only manifest,
#     `tf_staging/<path>:<ext>` mangled-colon format)
#   - License: Apache-2.0. Governance: Google CLA (NOT DCO) — git_commit_*
#     trailer rules N/A; no signed-off-by enforced.
#
# ── CATALOGUE: 41 discrete structural-validation surfaces ──
# alint-replaceable: 32 / 41 (78%).  Newly replaceable vs v0.9.17: +9.
#   The +9: pylint/buildifier/clang-format/codespell/api-compat moved from
#   the OLD blind `command:` kind to `command_idempotent` (real --check
#   contract + per-file offender parsing); api-golden FRESHNESS now expressible
#   via generated_file_fresh; tf.org/code link integrity via
#   registry_paths_resolve; requirements-lock cross-version parity via
#   cross_file_value_equals; per-rule scope_filter PR-scopes the 80k-file tree.
#
# Genuine non-replaceables (9) stay in bazel/the bats suite — see the
# NON-REPLACEABLE block at the bottom for each + WHY.

version: 1

# ────────────────────────────────────────────────────────────────────────
# BUNDLED RULESETS
# ────────────────────────────────────────────────────────────────────────
extends:
  - alint://bundled/oss-baseline@v1            # README/LICENSE presence, no merge markers, no bidi
  - alint://bundled/python@v1                  # python frontend is the canonical user surface
  - alint://bundled/ci/github-actions@v1       # 16 workflows: name/permissions/SHA-pinned actions
  - alint://bundled/hygiene/no-tracked-artifacts@v1

  # compliance/apache-2@v1 is intentionally not extended. TensorFlow's source
  # set includes generated files and empty package markers that do not carry
  # headers, and a path-only exclusion cannot model that convention without
  # either false findings or broad blind spots.

rules:
  # ──────────────────────────────────────────────────────────────────────
  # TensorFlow's package manifest is nested rather than at the repository root.
  # ──────────────────────────────────────────────────────────────────────
  - id: python-manifest-exists
    when: facts.has_python
    kind: file_exists
    paths: "tensorflow/tools/pip_package/setup.py"
    level: warning

  # ──────────────────────────────────────────────────────────────────────
  # SANITY-CHECK SUITE → command_idempotent  (BIGGEST WIN, the +9 core)
  #
  # These wrap the EXACT invocations the bats suites run. command_idempotent
  # (v0.10) replaces the old blind `command:` kind: it asserts the tool makes
  # NO changes in --check/diff mode, and `files_from: stdout` + `files_pattern`
  # turn the tool's offender list into per-file alint violations (clickable,
  # scoped, dedupable) rather than one opaque pass/fail.
  #
  # scope_filter.changed_since mirrors code_check_changed_files.bats — only
  # lints files changed in the PR, which is the ONLY tractable mode on an
  # 80k-file tree (full-tree clang/pylint is minutes-to-hours).
  # ──────────────────────────────────────────────────────────────────────

  # pylint — code_check_changed_files.bats:64 + pylint-presubmit.yml
  - id: tensorflow-pylint
    kind: command_idempotent
    paths:
      include: ["**/*.py"]
      exclude:
        - "third_party/**"
        - "**/*_pb2.py"
        - "tensorflow/lite/micro/**"
    command: ["python", "-m", "pylint", "--rcfile=tensorflow/tools/ci_build/pylintrc", "--score=false"]
    files_from: stdout
    # pylint emits `path/to/file.py:NN: [Cxxxx(...)] msg` — capture the path.
    files_pattern: '^([^:]+\.py):\d+:'
    timeout: 600
    scope_filter:
      changed_since: "{{env.ALINT_BASE_REF | default('origin/master')}}"
    level: warning

  # buildifier — code_check_changed_files.bats:40 (Bazel BUILD/.bzl formatter)
  - id: tensorflow-buildifier
    kind: command_idempotent
    paths:
      include: ["**/BUILD", "**/BUILD.bazel", "**/*.bzl", "MODULE.bazel", "WORKSPACE"]
      exclude: ["third_party/**"]
    command: ["buildifier", "-mode=check", "-lint=warn"]
    files_from: stdout
    # buildifier -mode=check prints offending paths one per line.
    files_pattern: '^(.+)$'
    timeout: 120
    scope_filter:
      changed_since: "{{env.ALINT_BASE_REF | default('origin/master')}}"
    level: warning

  # clang-format — code_check_changed_files.bats:49 (SKIPPED upstream because
  # it "doesn't match internal clang-format checker"; offered here info-level
  # for adopters who DO want the public-clang-format gate).
  - id: tensorflow-clang-format
    kind: command_idempotent
    paths:
      include: ["**/*.cc", "**/*.h"]
      exclude:
        - "third_party/**"
        - "tensorflow/lite/micro/**"
        - "**/*_generated.h"
    command: ["clang-format-12", "--style=Google", "--dry-run", "--Werror"]
    timeout: 300
    scope_filter:
      changed_since: "{{env.ALINT_BASE_REF | default('origin/master')}}"
    level: info

  # codespell — typo sweep (not in TF's bats, but a cheap polyglot win).
  - id: tensorflow-codespell
    kind: command_idempotent
    paths:
      include: ["**/*.md", "**/*.py", "**/*.cc", "**/*.h"]
      exclude:
        - "third_party/**"
        - "tensorflow/security/advisory/**"
        - "RELEASE.md"
    command: ["codespell"]
    files_from: stdout
    files_pattern: '^([^:]+):\d+:'
    timeout: 120
    level: info

  # ──────────────────────────────────────────────────────────────────────
  # API-GOLDEN FRESHNESS → generated_file_fresh / command_idempotent
  #
  # The api_compatibility_test boots `tf`, walks every public symbol, and
  # diffs the serialised ApiObjects textproto against the 1185 on-disk
  # goldens; regen is `bazel run … -- --update_goldens=True`. This is the
  # canonical generated-file-freshness shape — but the regenerator is bazel
  # + a built wheel (heavy). We express it as command_idempotent in --check
  # mode (the test ITSELF is the non-mutating checker; exit-1 == drift).
  # Most adopters run this in CI only; locally it reports "tool not on PATH".
  #
  # NOTE: this is ALSO the api-compat SEMANTIC gate (#9 below). One rule,
  # two roles — alint can only assert the drift exists, not reproduce the
  # Python-AST + protobuf-reflection diff.
  # ──────────────────────────────────────────────────────────────────────
  - id: tensorflow-api-goldens-fresh
    kind: command_idempotent
    paths: "tensorflow/tools/api/tests/api_compatibility_test.py"
    command: ["bazel", "test", "//tensorflow/tools/api/tests:api_compatibility_test"]
    timeout: 1800
    level: info

  # ──────────────────────────────────────────────────────────────────────
  # tensorflow.org/code LINK INTEGRITY → registry_paths_resolve  (NEW WIN)
  #
  # code_check_full.bats:274 greps `https://www.tensorflow.org/code/<path>`
  # out of the tree and asserts each <path> is a real file/dir. That is
  # EXACTLY registry_paths_resolve: extract the path tail with a one-group
  # regex, resolve against the repo root.
  #
  # CAVEAT: registry_paths_resolve takes ONE source file + an extract; the
  # bats test greps the WHOLE tree. If your alint build's `source:` accepts
  # only a single file, this needs the multi-source generalisation (v0.11
  # candidate). Shown here against the highest-density source as a
  # representative; full-tree coverage stays in the bats grep.
  # ──────────────────────────────────────────────────────────────────────
  - id: tensorflow-org-code-links-resolve
    kind: registry_paths_resolve
    source: "tensorflow/**"
    extract:
      regex: 'https://www\.tensorflow\.org/code/([a-zA-Z0-9/._-]+)'
    base: "."
    level: warning
    message: >-
      A https://www.tensorflow.org/code/<path> link must resolve to a real
      file in the tree (mirrors the full.bats:274 link-integrity check).

  # ──────────────────────────────────────────────────────────────────────
  # requirements_lock CROSS-VERSION PARITY → cross_file_value_equals (NEW WIN)
  #
  # The 3.10–3.13 pip-compile locks should pin shared packages to the same
  # version (modulo interpreter-conditional pkgs). Python 3.14 intentionally
  # selects a newer numpy, so it is outside this equality set.
  # cross_file_value_equals extracts one pin from the 3.10 lock and asserts
  # the other three agree.
  # Shown for `numpy` as the representative invariant pin; replicate per
  # package you want locked in lockstep. allow_missing_target handles a
  # package legitimately absent on one interpreter.
  # ──────────────────────────────────────────────────────────────────────
  - id: tensorflow-requirements-lock-numpy-parity
    kind: cross_file
    source:
      file: "requirements_lock_3_10.txt"
      extract:
        regex: '(?m)^numpy==([0-9][^ ;\\]+)'
    targets:
      - file: "requirements_lock_3_11.txt"
        extract: { regex: '(?m)^numpy==([0-9][^ ;\\]+)' }
      - file: "requirements_lock_3_12.txt"
        extract: { regex: '(?m)^numpy==([0-9][^ ;\\]+)' }
      - file: "requirements_lock_3_13.txt"
        extract: { regex: '(?m)^numpy==([0-9][^ ;\\]+)' }
    allow_missing_target: true
    level: warning

  # ──────────────────────────────────────────────────────────────────────
  # FILE-SHAPE PRESENCE (carried from v0.9.17 baseline — file_exists)
  # ──────────────────────────────────────────────────────────────────────
  - id: tensorflow-bazel-build-system-present
    kind: file_exists
    paths: ["MODULE.bazel", "WORKSPACE", "BUILD", "configure", "configure.py", ".clang-format", ".pylintrc"]
    level: error
    message: "A canonical Bazel/config entry-point is missing."

  - id: tensorflow-governance-files-present
    kind: file_exists
    paths: ["AUTHORS", "CITATION.cff", "CODEOWNERS", "CODE_OF_CONDUCT.md", "CONTRIBUTING.md", "ISSUES.md", "LICENSE", "README.md", "RELEASE.md", "SECURITY.md"]
    root_only: true
    level: error

  - id: tensorflow-language-subdirs-have-build
    kind: file_exists
    paths: ["tensorflow/c/BUILD", "tensorflow/cc/BUILD", "tensorflow/python/BUILD", "tensorflow/java/BUILD", "tensorflow/go/BUILD", "tensorflow/js/BUILD", "tensorflow/lite/BUILD"]
    level: error

  - id: tensorflow-api-golden-dirs-present
    kind: file_exists
    paths: ["tensorflow/tools/api/golden/v1/tensorflow.audio.pbtxt", "tensorflow/tools/api/golden/v2/tensorflow.audio.pbtxt", "tensorflow/tools/api/tests/api_compatibility_test.py"]
    level: error

  - id: tensorflow-requirements-lock-matrix-present
    kind: file_exists
    paths: ["requirements_lock_3_10.txt", "requirements_lock_3_11.txt", "requirements_lock_3_12.txt", "requirements_lock_3_13.txt", "requirements_lock_3_14.txt"]
    root_only: true
    level: warning

  - id: tensorflow-opensource-only-manifest-present
    kind: file_exists
    paths: "tensorflow/opensource_only.files"
    level: info
    # NOTE: the manifest's `tf_staging/<path>:<ext>` mangled-colon format
    # (prefix to strip + colon-split extension to rejoin) is NOT expressible
    # with registry_paths_resolve's single one-group regex — the path is
    # split across the `:` so no single capture yields a resolvable path.
    # A "transform/rejoin" extract or a strip_prefix option is a NEW-rule-kind
    # candidate. Presence-only today.

  # API golden textproto shape — every .pbtxt opens with its symbol path.
  - id: tensorflow-api-golden-v1-marker
    kind: file_content_matches
    paths: { include: ["tensorflow/tools/api/golden/v1/*.pbtxt"] }
    pattern: '(?m)^path:\s*"tensorflow[."]'
    level: warning

  # tf_version.bzl is the wheel-version source of truth.
  - id: tensorflow-tf-version-bzl-semver
    kind: file_content_matches
    paths: "tensorflow/tf_version.bzl"
    pattern: '(?m)^TF_VERSION\s*=\s*"\d+\.\d+\.\d+(?:-[^"]+)?"\s*$'
    level: warning

  # ──────────────────────────────────────────────────────────────────────
  # WHITESPACE / NEWLINE / TROJAN-SOURCE hygiene (carried forward)
  # ──────────────────────────────────────────────────────────────────────
  - id: tensorflow-no-bidi-in-native-sources
    kind: no_bidi_controls
    paths:
      include: ["**/*.cc", "**/*.h", "**/*.java", "**/*.swift", "**/*.go", "**/*.m", "**/*.mm"]
      exclude: ["third_party/**", "tensorflow/lite/micro/**"]
    level: error
    policy_url: "https://trojansource.codes/"

  - id: tensorflow-no-case-conflicts
    kind: no_case_conflicts
    paths: "**"
    level: error

  - id: tensorflow-final-newline
    kind: final_newline
    paths:
      include: ["**/*.py", "**/*.cc", "**/*.h", "**/*.md", "**/*.bzl", "**/BUILD"]
      exclude: ["third_party/**", "tensorflow/lite/micro/**", "tensorflow/security/advisory/**"]
    level: info
    fix: { file_append_final_newline: {} }

# ══════════════════════════════════════════════════════════════════════════
# GENUINE NON-REPLACEABLES (9) — stay in bazel / the bats suite. WHY:
#
# 1. C++/CUDA/MLIR COMPILE — `bazel build`. alint never compiles; it lints
#    file shape, not toolchain output.
# 2. `bazel nobuild` CROSS-FILE GRAPH (full.bats:313) — bad includes, missing
#    BUILD targets. Needs a Bazel analysis-phase server; alint does not parse
#    Bazel BUILD semantics.
# 3. "every TF target queryable" (full.bats:324) — `bazel query //...`,
#    same Bazel-server dependency.
# 4. PIP LICENSE-GRAPH integrity (full.bats:118) — `bazel cquery` over the
#    wheel's dep graph vs the licenses bundle. Graph reachability, not files.
# 5. PIP DEP COVERAGE (full.bats:128) — `bazel cquery` that every //tensorflow
#    dep is packaged. Same: a build-graph reachability assertion.
# 6. NO-CUDA / NO-STATIC-CUDA (full.bats:218,244) — inspects the BUILT wheel's
#    linked symbols. Post-build artifact introspection, out of scope.
# 7. API-COMPAT SEMANTIC DIFF — the Python-AST walk + protobuf-reflection
#    serialise-and-diff against 1185 goldens. alint asserts goldens EXIST and
#    detects drift via the command_idempotent wrapper (#tensorflow-api-goldens-fresh),
#    but cannot reproduce the symbol-by-symbol semantic comparison.
# 8. pylint / clang-format / buildifier SEMANTIC analysis — alint wraps the
#    tools (command_idempotent) but the AST/style judgement is the tool's.
# 9. NO-DUP-WINDOWS-CASING (full.bats:290) — lower-case-collision scan across
#    the whole tree (`find | tr A-Z a-z | uniq -d`). A whole-tree set-dedup,
#    not a per-file or pair check — NEW-rule-kind candidate (`no_case_collisions`).
#
# NEW-RULE-KIND CANDIDATES surfaced by this re-analysis:
#   • registry_paths_resolve MULTI-SOURCE (grep paths out of the whole tree,
#     not one file) — the tf.org/code link check wants it.
#   • registry extract with strip_prefix / colon-rejoin transform — for the
#     opensource_only.files `tf_staging/<path>:<ext>` mangled format.
#   • no_case_collisions — the Windows dup-casing whole-tree dedup.
#   • cross_file_value_equals SET-EQUALITY — v1↔v2 golden symbol parity
#     (every entry in tree A has a counterpart in tree B), and cross-language
#     API parity (Python↔Java↔Swift↔ObjC binding surfaces).
# ══════════════════════════════════════════════════════════════════════════
