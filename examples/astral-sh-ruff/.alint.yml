# yaml-language-server: $schema=https://raw.githubusercontent.com/asamarts/alint/main/schemas/v1/config.json
#
# alint config for astral-sh/ruff — v0.11 re-analysis (2026-05-25).
#
# IMPROVES on examples/astral-sh-ruff/.alint.yml by absorbing the
# rule kinds that did NOT exist when that config was written (it was
# authored against v0.9.17–v0.9.20). What is NEWLY expressible:
#
#   v0.10 kinds (the prior config listed these as out-of-scope gaps):
#     - generated_file_fresh   → `cargo dev generate-all --mode check`
#                                 codegen drift: ruff.schema.json,
#                                 ty.schema.json, docs/configuration.md,
#                                 docs/rules, CLI help (the §1.3 gap)
#     - command_idempotent     → the fixer-in-check-mode pattern
#                                 (ruff-format, mdformat, markdownlint,
#                                 prettier, rustfmt) — was the prior
#                                 README's "command_idempotent v0.10
#                                 candidate" gap, now shipped
#     - import_gate            → crate-layering firewall for the
#                                 ruff_* / ty_* split (ruff crates must
#                                 not depend up into ty internals)
#     - ordered_block          → keep-sorted enforcement
#
#   v0.11 kinds/features:
#     - git_commit_no_fixup    → reject residual fixup!/squash! in a PR
#     - git_commit_signed_off  → DCO (PROPOSAL only — ruff has no DCO
#                                 today; ships disabled, info-level)
#     - scope_filter.changed_since: → grandfather pre-existing findings,
#                                 fire new hygiene rules only on PR diff
#     - {{env.X}} interpolation     → wire base SHA from CI env
#     - --show-notes                → surfaces silently-skipped entries
#
# The 13 `command:` shellouts from the prior config (typos, shellcheck,
# zizmor, actionlint, cargo fmt/clippy/shear/doc, ruff self-lint/format,
# mdformat, markdownlint, prettier) are RETAINED below where a native
# kind does not fully subsume them — but the formatter-class ones are
# upgraded from `command:` (--check) to `command_idempotent` so a
# violation reports WHICH files drifted, not just a nonzero exit.

version: 1

extends:
  - alint://bundled/oss-baseline@v1
  - alint://bundled/rust@v1
  - alint://bundled/python@v1
  - alint://bundled/monorepo/cargo-workspace@v1
  - alint://bundled/ci/github-actions@v1
  - alint://bundled/agent-context@v1
  - alint://bundled/hygiene/no-tracked-artifacts@v1

vars:
  # Resolved once at config load from the CI env; falls back to
  # origin/main for a local `alint check`. (v0.11 {{env.X}} interp.)
  base_sha: "{{env.ALINT_BASE_SHA | default('origin/main')}}"

rules:
  # ═══════════════════════════════════════════════════════════════
  # NEW IN v0.10 — codegen freshness  (the headline unlock)
  # ═══════════════════════════════════════════════════════════════
  # ruff's single biggest bespoke gate is `cargo dev generate-all`,
  # which (re)generates ruff.schema.json + ty.schema.json +
  # docs/configuration.md + docs/rules/ + CLI help from the Rust
  # source. CI fails if a committed generated file is stale. The
  # prior config marked this "codegen out of scope". v0.10's
  # generated_file_fresh runs the generator and diffs its output
  # against the committed file — exactly this check, declaratively.
  #
  # generate-all's own `--mode check` already exits nonzero on drift
  # and lists nothing per-file, so command_idempotent is the precise
  # fit for the COMPOSITE check (one invocation, repo-wide):
  - id: ruff-codegen-fresh
    kind: command_idempotent
    paths: "Cargo.toml"                       # one repo-wide invocation
    command: ["cargo", "dev", "generate-all", "--mode", "check"]
    files_from: stderr
    timeout: 600
    level: error
    message: |
      Generated assets are stale (ruff.schema.json / ty.schema.json /
      docs/configuration.md / docs/rules). Run `cargo dev generate-all`
      and commit the result.

  # The schema files are the highest-stakes generated artefacts and
  # are regenerated by a dedicated generator, so gate them on their
  # own with generated_file_fresh — this reports the exact file and
  # is independent of whether the docs also drifted.
  - id: ruff-schema-json-fresh
    kind: generated_file_fresh
    file: ruff.schema.json
    command: ["cargo", "dev", "generate-json-schema", "--mode", "dry-run"]
    workdir: "."
    normalize: final-newline
    timeout: 300
    level: error
    message: "{{ctx.file}} is stale — run `cargo dev generate-json-schema` and commit."

  - id: ty-schema-json-fresh
    kind: generated_file_fresh
    file: ty.schema.json
    command: ["cargo", "dev", "generate-ty-schema", "--mode", "dry-run"]
    workdir: "."
    normalize: final-newline
    timeout: 300
    level: error
    message: "{{ctx.file}} is stale — run `cargo dev generate-ty-schema` and commit."

  # ═══════════════════════════════════════════════════════════════
  # NEW IN v0.10 — fixer-in-check-mode  (command_idempotent)
  # ═══════════════════════════════════════════════════════════════
  # The prior config wrapped each formatter as a plain `command:` in
  # --check mode (one spawn per file, only an exit code). v0.10's
  # command_idempotent runs the check-mode argv ONCE and parses the
  # tool's own offender list into per-file violations via
  # files_pattern. This is the §6.1 "command_idempotent v0.10
  # candidate" gap, now closed. Far fewer spawns, precise output.

  - id: ruff-rustfmt-clean
    kind: command_idempotent
    paths: "Cargo.toml"
    command: ["cargo", "fmt", "--all", "--", "--check"]
    files_from: stdout
    files_pattern: "Diff in (.+) at"          # rustfmt's offender format
    timeout: 300
    level: warning

  - id: ruff-self-format-clean
    # ruff dogfooding ruff: one invocation over the tree, parse the
    # "Would reformat: <path>" list rather than spawning per .py file.
    kind: command_idempotent
    paths: "Cargo.toml"
    command: ["ruff", "format", "--check", "."]
    files_from: stderr
    files_pattern: "Would reformat: (.+)"
    timeout: 120
    level: warning

  - id: ruff-self-lint-clean
    kind: command_idempotent
    paths: "Cargo.toml"
    command: ["ruff", "check", "."]
    timeout: 120
    level: warning

  # ═══════════════════════════════════════════════════════════════
  # NEW IN v0.10 — crate-layering firewall  (import_gate)
  # ═══════════════════════════════════════════════════════════════
  # ruff is a 50-crate workspace split into the ruff_* (linter/
  # formatter/parser) and ty_* (type-checker) families. A layering
  # invariant the project holds socially but does NOT enforce: the
  # ruff_* linter crates must not reach up into ty_* internals
  # (ty depends on ruff_* foundations, not vice-versa). import_gate
  # tests the `use` target regex per .rs file — a cheap structural
  # proxy for the dependency direction the clippy config can't see.
  - id: ruff-no-upward-ty-imports
    kind: import_gate
    paths:
      include: ["crates/ruff_linter/**/*.rs", "crates/ruff_python_formatter/**/*.rs"]
      exclude: ["crates/**/tests/**", "crates/**/resources/**"]
    language: rust
    forbid: "^ty_"                            # no `use ty_*` from a ruff_ linter crate
    level: warning
    message: |
      A ruff_* linter/formatter crate imports a ty_* type-checker
      crate. The dependency direction is ty_* → ruff_*, never the
      reverse; promote the shared code to a ruff_* foundation crate.

  # ═══════════════════════════════════════════════════════════════
  # NEW IN v0.11 — commit-validation on the PR range
  # ═══════════════════════════════════════════════════════════════
  # ruff squash-merges PRs; leftover `fixup!`/`squash!` commits in a
  # branch are noise a reviewer must catch by eye today. v0.11's
  # git_commit_no_fixup fails the PR range. since: is wired from the
  # CI base SHA via the {{env.X}} interpolation (vars.base_sha above).
  - id: ruff-no-fixup-commits
    kind: git_commit_no_fixup
    since: "{{vars.base_sha}}"
    level: error
    message: |
      Branch contains leftover fixup!/squash! commits. Rebase with
      `git rebase --autosquash` before requesting review.

  # DCO sign-off — ruff does NOT require DCO today (no Signed-off-by
  # policy in CONTRIBUTING.md). Shipped DISABLED as a proposal: flip
  # to error if ruff adopts DCO. Demonstrates v0.11 git_commit_signed_off.
  # - id: ruff-dco-signoff
  #   kind: git_commit_signed_off
  #   since: "{{vars.base_sha}}"
  #   level: info

  # ═══════════════════════════════════════════════════════════════
  # NEW IN v0.11 — diff-scoped hygiene  (scope_filter.changed_since)
  # ═══════════════════════════════════════════════════════════════
  # ruff has 1,597 deliberately-malformed .py fixtures + thousands of
  # .snap files where pre-existing trailing whitespace / final-newline
  # state is intentional or simply not worth a tree-wide cleanup PR.
  # changed_since grandfathers the existing tree and fires the rule
  # only on files a PR actually touches — so a contributor is told
  # about whitespace THEY introduced, not 6 pre-existing offenders.
  - id: ruff-new-rust-no-trailing-ws
    kind: no_trailing_whitespace
    paths:
      include: ["crates/**/*.rs"]
      exclude: ["crates/ty_vendored/vendor/**", "crates/**/snapshots/**", "crates/**/resources/**"]
    scope_filter:
      changed_since: "{{vars.base_sha}}"
    level: error

  # ═══════════════════════════════════════════════════════════════
  # CARRIED FORWARD from the prior config (still best-fit today)
  # ═══════════════════════════════════════════════════════════════
  - id: ruff-no-merge-markers-in-crates
    kind: no_merge_conflict_markers
    paths:
      include: ["crates/**/*.rs", "crates/**/*.toml", "crates/**/*.md"]
      exclude: ["crates/ty_vendored/vendor/**", "crates/**/resources/**", "crates/**/snapshots/**"]
    level: error

  - id: ruff-toml-final-newline
    kind: final_newline
    paths: "**/*.toml"
    level: warning
    fix:
      file_append_final_newline: {}

  # validate-pyproject (shallow): the load-bearing PEP 621 fields.
  - id: ruff-pyproject-name
    kind: toml_path_matches
    paths: "pyproject.toml"
    path: "$.project.name"
    matches: '^ruff$'
    level: error

  - id: ruff-pyproject-license
    kind: toml_path_matches
    paths: "pyproject.toml"
    path: "$.project.license"
    matches: '^MIT$'
    level: error

  - id: ruff-pyproject-requires-python
    kind: toml_path_matches
    paths: "pyproject.toml"
    path: "$.project['requires-python']"      # bracket notation: dashed key
    matches: '^>=3\.[0-9]+$'
    level: warning

  # Internal crates must declare publish = false (still the only
  # programmatic enforcement of this convention; toml_path_equals for
  # the bool field per the *_equals-not-*_matches pitfall).
  - id: ruff-internal-crates-unpublished
    kind: toml_path_equals
    paths:
      include: ["crates/*/Cargo.toml"]
      exclude:
        - "crates/ruff/Cargo.toml"
        - "crates/ruff_linter/Cargo.toml"
        - "crates/ruff_wasm/Cargo.toml"
    path: "$.package.publish"
    equals: false
    level: warning

  # Shellouts with no native equivalent — retained as command: rules.
  - id: ruff-typos
    kind: command
    paths: "_typos.toml"
    command: ["typos"]
    timeout: 120
    level: warning

  - id: ruff-shellcheck
    kind: command
    paths:
      include: ["scripts/**/*.sh", ".github/**/*.sh"]
    command: ["shellcheck", "-x", "{path}"]
    timeout: 30
    level: warning

  - id: ruff-zizmor
    kind: command
    paths: ".github/workflows"
    command: ["zizmor", "--config", ".github/zizmor.yml", ".github/workflows"]
    timeout: 60
    level: warning

  - id: ruff-actionlint
    kind: command
    paths: ".github/workflows"
    command: ["actionlint", "-config-file", ".github/actionlint.yaml"]
    timeout: 60
    level: warning

  - id: ruff-cargo-clippy
    kind: command
    paths: "Cargo.toml"
    command: ["cargo", "clippy", "--workspace", "--all-targets", "--all-features", "--locked", "--", "-D", "warnings"]
    timeout: 600
    level: warning

  - id: ruff-cargo-shear
    kind: command
    paths: "Cargo.toml"
    command: ["cargo", "shear", "--deny-warnings"]
    timeout: 120
    level: warning

  - id: ruff-cargo-doc
    kind: command
    paths: "Cargo.toml"
    command: ["cargo", "doc", "--all", "--no-deps"]
    timeout: 600
    level: warning

  # mdformat / markdownlint / prettier — upgraded to command_idempotent
  # so a violation lists the drifting file. (Prior config used plain
  # command: --check, one spawn per file.)
  - id: ruff-mdformat-clean
    kind: command_idempotent
    paths: "Cargo.toml"
    command: ["mdformat", "--check", "."]
    timeout: 60
    level: info

  - id: ruff-prettier-yaml-clean
    kind: command_idempotent
    paths: "Cargo.toml"
    command: ["prettier", "--check", "**/*.{yaml,yml}"]
    timeout: 60
    level: info

  - id: ruff-codeowners-exists
    kind: file_exists
    paths: ".github/CODEOWNERS"
    level: warning

  - id: ruff-readme-mentions-license-badge
    kind: file_content_matches
    paths: "README.md"
    pattern: 'shields\.io/pypi/l/ruff'
    level: info

  # ── still genuinely out of scope (documented in findings.md) ──
  #  - cargo insta test --unreferenced reject   (snapshot↔source
  #      inverse pairing; pair_inverse still a design candidate,
  #      NOT shipped in v0.10/v0.11)
  #  - clippy.toml disallowed-methods           (Rust AST scope)
  #  - ecosystem regression vs baseline binary  (build-aware diff)
  #  - mkdocs build --strict / docs snippet fmt (build + ruff AST)
  #  - check-formatter-instability              (formatter dogfood)
