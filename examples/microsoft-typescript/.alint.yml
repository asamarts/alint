# yaml-language-server: $schema=https://raw.githubusercontent.com/asamarts/alint/main/schemas/v1/config.json
# ============================================================================
# Proposed alint config for microsoft/TypeScript — re-analysis @ alint v0.11
# ============================================================================
# Supersedes examples/microsoft-typescript/.alint.yml (authored @ v0.9.17).
# This pass folds in every v0.10/v0.11 capability the baseline could not use:
#   - command_idempotent  : dprint check / eslint / knip as REPEATABLE gates
#                            (replaces the old `command` kind — same shell-out
#                            but with timeout + check semantics).
#   - registry_paths_resolve : src/lib/libs.json -> src/lib/<lib>.d.ts sources
#                            (the lib generator's input manifest must resolve).
#   - cross_file_value_equals : the dprint TypeScript plugin version is pinned
#                            in TWO files that must agree (.dprint.jsonc URL +
#                            package.json devDependency).
#   - import_gate (js)     : approximation of the custom `no-direct-import`
#                            eslint rule (cross-project relative imports).
#   - scope_filter.changed_since : make the heavy command_idempotent gates run
#                            only on PR diffs in CI ({{env.ALINT_BASE_REF}}).
# Everything the baseline already covered (headers, editorconfig invariants,
# baseline hygiene, tsconfig shape, workflow SHA pinning, AGENTS.md) is kept.
# ============================================================================

version: 1

extends:
  - alint://bundled/oss-baseline@v1
  - alint://bundled/node@v1
  - alint://bundled/ci/github-actions@v1
  - alint://bundled/hygiene/no-tracked-artifacts@v1
  - alint://bundled/tooling/editorconfig@v1
  - alint://bundled/agent-context@v1

facts:
  - id: has_dprint_config
    any_file_exists: [.dprint.jsonc, .dprint.json]
  - id: has_libs_manifest
    any_file_exists: [src/lib/libs.json]

rules:
  # ───────────────────────── copyright header ─────────────────────────
  - id: ts-copyright-header-src
    kind: file_header
    paths: "src/**/*.ts"
    pattern: |-
      ^/\*! \*+
      Copyright \(c\) Microsoft Corporation\. All rights reserved\.
      Licensed under the Apache License, Version 2\.0
    level: info
    message: >-
      Every src/**/*.ts should start with the scripts/CopyrightNotice.txt
      block (Hereby `generateLibs` prepends it to bundled output).

  - id: ts-copyright-header-scripts
    kind: file_header
    paths: ["scripts/**/*.mjs", "scripts/**/*.cjs", "scripts/**/*.mts"]
    pattern: |-
      ^// Copyright \(c\) Microsoft Corporation
    level: info

  # ───────────────── .editorconfig invariants (src/, scripts/) ─────────
  - id: ts-src-line-endings-crlf
    when: facts.has_dprint_config
    kind: line_endings
    paths:
      include: ["src/**/*.ts", "src/**/*.json", "src/**/*.js", "scripts/**/*.ts", "scripts/**/*.json", "scripts/**/*.js"]
      exclude: ["src/lib/*.generated.d.ts", "**/*.generated.*"]
    target: crlf
    level: warning

  - id: ts-src-final-newline
    kind: final_newline
    paths:
      include: ["src/**/*.ts", "scripts/**/*.ts", "scripts/**/*.mjs", "scripts/**/*.cjs"]
      exclude: ["**/*.generated.*", "src/lib/*.generated.d.ts"]
    level: warning
    fix:
      file_append_final_newline: {}

  - id: ts-src-no-trailing-whitespace
    kind: no_trailing_whitespace
    paths:
      include: ["src/**/*.ts", "scripts/**/*.ts", "scripts/**/*.mjs", "scripts/**/*.cjs"]
      exclude: ["**/*.generated.*", "src/lib/*.generated.d.ts"]
    level: warning
    fix:
      file_trim_trailing_whitespace: {}

  - id: ts-src-no-bom
    kind: no_bom
    paths:
      include:
        - "src/**/*.ts"
        - "src/**/*.json"
        - "scripts/**/*.{ts,mjs,cjs,json}"
        - "**/tsconfig*.json"
        - "package.json"
        - ".dprint.jsonc"
      exclude: ["**/*.generated.*"]
    level: error

  # ───────────────────── baseline-directory hygiene ───────────────────
  - id: ts-baseline-file-max-size
    kind: file_max_size
    paths:
      include: ["tests/baselines/reference/**/*"]
      exclude:
        - "tests/baselines/reference/projectOutput/**"
        - "tests/baselines/reference/api/**"
    max_bytes: 262144
    level: warning

  - id: ts-gitattributes-keeps-binary-default
    kind: file_content_matches
    paths: .gitattributes
    pattern: '(?m)^\* -text$'
    level: error

  # ───────────────────────── tsconfig shape ───────────────────────────
  - id: ts-tsconfig-strict-mode
    kind: json_path_equals
    paths:
      include: ["tsconfig*.json", "src/**/tsconfig*.json", "scripts/tsconfig.json"]
      exclude: ["tests/**/tsconfig*.json"]
    path: "$.compilerOptions.strict"
    equals: true
    level: warning

  - id: ts-scripts-tsconfig-checkjs
    kind: json_path_equals
    paths: "scripts/tsconfig.json"
    path: "$.compilerOptions.checkJs"
    equals: true
    level: warning

  # ─────────────────── .dprint.jsonc plugin presence ──────────────────
  - id: ts-dprint-typescript-plugin-pinned
    when: facts.has_dprint_config
    kind: file_content_matches
    paths: .dprint.jsonc
    pattern: 'plugins\.dprint\.dev/typescript-'
    level: warning

  - id: ts-dprint-json-plugin-pinned
    when: facts.has_dprint_config
    kind: file_content_matches
    paths: .dprint.jsonc
    pattern: 'plugins\.dprint\.dev/json-'
    level: warning

  - id: ts-dprint-yaml-plugin-pinned
    when: facts.has_dprint_config
    kind: file_content_matches
    paths: .dprint.jsonc
    pattern: 'plugins\.dprint\.dev/g-plane/pretty_yaml'
    level: warning

  # ───── NEW @ v0.10: dprint TS plugin version pin agrees across files ─
  # .dprint.jsonc embeds `typescript-0.93.4.wasm` in the plugin URL; the
  # `@dprint/typescript` devDependency in package.json is the exact same
  # version (the in-repo comment "if updating typescript, update the one
  # in package.json" is the manual ritual this rule mechanises). If they
  # drift, the formatter used by `dprint fmt` differs from the one tests
  # link against. cross_file_value_equals locks them together.
  - id: ts-dprint-ts-plugin-version-agrees
    when: facts.has_dprint_config
    kind: cross_file
    source:
      file: package.json
      extract:
        json: "$.devDependencies['@dprint/typescript']"
    targets:
      - file: .dprint.jsonc
        extract:
          regex: 'plugins\.dprint\.dev/typescript-([0-9]+\.[0-9]+\.[0-9]+)\.wasm'
    level: warning
    message: >-
      The dprint TypeScript plugin version in .dprint.jsonc must equal the
      `@dprint/typescript` devDependency in package.json. The repo comment
      "if updating typescript, update the one in package.json" is the manual
      step this rule enforces.

  # ───── NEW @ v0.10: import firewall (approximates no-direct-import) ──
  # The custom eslint rule `no-direct-import` forbids one src project from
  # relatively importing into ANOTHER project's files (you must go through
  # the generated _namespaces barrel). This is a coarse static approximation:
  # forbid `../` relative imports that climb out of the current top-level
  # src/<project> dir is not expressible as a single regex, so we forbid the
  # most common offender — a relative import reaching into a sibling
  # project's source by name. The precise AST rule stays in eslint (below);
  # this catches the obvious cases at alint time.
  - id: ts-no-cross-project-deep-import
    kind: import_gate
    language: js
    paths:
      include: ["src/**/*.ts"]
      exclude: ["src/**/_namespaces/**", "**/*.generated.*"]
    forbid: '^(?:\.\./){2,}'
    allow:
      - "./*"
      - "../*"
    level: info
    message: >-
      Imports that climb two or more directories up usually reach into
      another src project directly; prefer the generated _namespaces barrel.
      (Coarse approximation of the AST `no-direct-import` eslint rule, which
      remains authoritative — see ts-eslint below.)

  # ───────────────────────── package.json scripts ─────────────────────
  - id: ts-package-json-has-lint-script
    kind: json_path_matches
    paths: package.json
    path: "$.scripts.lint"
    matches: '^hereby lint$'
    level: error

  - id: ts-package-json-has-format-script
    kind: json_path_matches
    paths: package.json
    path: "$.scripts.format"
    matches: 'dprint fmt'
    level: error

  - id: ts-package-json-has-knip-script
    kind: json_path_matches
    paths: package.json
    path: "$.scripts.knip"
    matches: '^hereby knip$'
    level: error

  # ───────────────────────── workflow hygiene ─────────────────────────
  - id: ts-workflow-actions-pinned-by-sha
    kind: yaml_path_matches
    paths: ".github/workflows/*.{yml,yaml}"
    path: "$.jobs.*.steps[?match(@.uses, '^[^./]')].uses"
    matches: '^[a-z0-9_.-]+/[a-z0-9_.-]+@[0-9a-f]{40}'
    level: warning

  # ───────────────────────── AGENTS.md / OSS files ────────────────────
  - id: ts-agents-md-present
    kind: file_exists
    paths: AGENTS.md
    root_only: true
    level: error

  - id: ts-agents-md-maintenance-marker
    kind: file_content_matches
    paths: AGENTS.md
    pattern: 'CRITICAL: This Repository Is in Maintenance Mode'
    level: error

  - id: ts-third-party-notice-present
    kind: file_exists
    paths: ThirdPartyNoticeText.txt
    root_only: true
    level: warning

  # ════════════════════════════════════════════════════════════════════
  # Shell-outs — now command_idempotent (was `command` @ v0.9.17).
  # These tools are MUTATING in fmt/fix mode; we run their --check arm,
  # which is by definition idempotent (asserts the tree is already clean).
  # scope_filter.changed_since keeps the heavy passes to the PR diff in CI;
  # `alint check` over a whole-tree clone still runs them globally.
  # ════════════════════════════════════════════════════════════════════
  - id: ts-dprint-check
    when: facts.has_dprint_config
    kind: command_idempotent
    command: ["npx", "dprint", "check"]
    timeout: 300
    paths: .dprint.jsonc
    level: error
    message: >-
      `npx dprint check` failed. Run `npm run format` and commit the diff.

  - id: ts-eslint
    kind: command_idempotent
    command: ["npm", "run", "lint"]
    timeout: 600
    paths: package.json
    scope_filter:
      changed_since: "{{env.ALINT_BASE_REF | default('origin/main')}}"
    level: error
    message: >-
      `npm run lint` failed (eslint --max-warnings 0). The 9 custom AST
      rules under scripts/eslint/rules/ are enforced here, not by alint.

  - id: ts-knip
    kind: command_idempotent
    command: ["npm", "run", "knip"]
    timeout: 600
    paths: knip.jsonc
    scope_filter:
      changed_since: "{{env.ALINT_BASE_REF | default('origin/main')}}"
    level: warning
    message: >-
      `npm run knip` reported unused exports/dependencies (module-graph
      analysis — out of alint's static scope).

# ============================================================================
# GENUINE NON-REPLACEABLES (each requires a TS-AST analyser or a diff-time
# check alint deliberately is not):
#   - The 9 custom eslint rules (argument-trivia, debug-assert, jsdoc-format,
#     js-extensions, no-array-mutating-method-expressions, no-direct-import,
#     no-in-operator, no-keywords, only-arrow-functions) — TSESTree visitors.
#     ts-no-cross-project-deep-import above is only a coarse stand-in for one.
#   - run-eslint-rules-tests (mocha tests of those rules) — a test suite.
#   - runtests / runtests-parallel + the tests/baselines/reference accept loop
#     — `git diff` of regenerated baselines after a compiler test pass.
#   - scripts/errorCheck.mjs — pairs each diagnosticMessages.json key against
#     its appearance count across *.errors.txt baselines. A "pair_count"
#     (assert >=1 partner per registry key, BY CONTENT not filename) primitive
#     would express it; pair_hash/registry_paths_resolve match files, not
#     regex-counted occurrences. → NEW-RULE-KIND CANDIDATE: registry_value_used.
#   - scripts/find-unused-diganostic-messages.mjs — same shape, reverse dir.
#   - scripts/checkPackageSize.mjs + checkModuleFormat.mjs — npm-pack diff /
#     runtime dynamic-import probe (cross-ref + runtime, out of scope).
#   - localization .lcl/.lcg pipeline — Azure-DevOps-fed transform, not a
#     repo-state property.
#   - generated lib.*.d.ts / diagnosticInformationMap.generated.ts FRESHNESS
#     (content matches what the generator would emit) — these generators
#     MUTATE working files, so generated_file_fresh (non-mutating stdout diff)
#     does NOT fit; the freshness arm lives in the build/test pass.
# ============================================================================
