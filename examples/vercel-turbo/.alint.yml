# yaml-language-server: $schema=https://raw.githubusercontent.com/asamarts/alint/main/schemas/v1/config.json
#
# alint config for vercel/turborepo — re-analysed at snapshot 2.9.15-canary.8
# against alint v0.11 capabilities (was v0.9.17 in the prior example dir).
#
# Turborepo is a DUAL-language monorepo:
#   * Rust workspace: 61 crates under crates/* + packages/turbo-repository/rust
#     (resolver=3, edition=2024 inherited, channel nightly-2026-02-27).
#   * pnpm workspace: 17 first-party packages/* + 31 examples/* + apps/docs.
# Per-language toolchains (NOT replaced by alint, shelled out below):
#   Rust  -> cargo fmt / cargo lint (clippy alias) / cargo deny / cargo check
#   TS/JS -> oxlint --deny-warnings / oxfmt --check / ultracite check
#   TOML  -> taplo format --check
# Orchestrated by `turbo run quality` (//#lint + //#format + //#check:toml + docs#lint)
# and a husky pre-push hook.
#
# IMPORTANT corrections vs the task brief / old example:
#   * License is MIT (LICENSE: "Copyright (c) 2026 Vercel, Inc"; deny.toml allows
#     MIT/Apache/MPL/BSD), NOT MPL-2.0. Rust files carry no SPDX header, so no
#     file_header rule applies; the repository's Cargo and Clippy gates own its
#     crate-level lint policy.
#   * Cross-half version coherence is NOT Cargo<->npm. The Cargo crate `turbo`
#     is pinned at 0.1.0 (decoupled). `version.txt` advances to the next canary
#     after stable releases while package versions remain on the release, and
#     private packages may stay at 0.0.0, so static equality would be false.

version: 1

extends:
  - alint://bundled/oss-baseline@v1
  - alint://bundled/rust@v1
  - alint://bundled/node@v1
  - alint://bundled/monorepo@v1
  - alint://bundled/monorepo/cargo-workspace@v1
  - alint://bundled/ci/github-actions@v1
  - alint://bundled/hygiene/no-tracked-artifacts@v1
  - alint://bundled/tooling/editorconfig@v1

rules:
  # ════════════════════════════════════════════════════════════════════
  # NEW IN v0.10/v0.11 — the capabilities that weren't available at v0.9.17
  # ════════════════════════════════════════════════════════════════════

  # ── [registry_paths_resolve] The Cargo workspace `members` globs must
  # resolve to real crate dirs. Catches a deleted crate left dangling in
  # the members list (which fails `cargo metadata` only at build time).
  # NEW: no path-resolution primitive existed at v0.9.17.
  - id: turbo-workspace-members-resolve
    kind: registry_paths_resolve
    source: Cargo.toml
    extract:
      toml: "$.workspace.members[*]"
    base: "."
    entries_are_globs: true
    expect: dir
    level: error
    message: >-
      Every glob in [workspace].members must resolve to at least one crate
      directory. A dangling members entry (deleted crate) breaks the build.

  # ── [command_idempotent] DUAL-HALF LINT COLLAPSE. Replaces the four
  # separate `kind: command` shell-outs from the old config with the
  # idempotent runner (same as `turbo run quality`). These re-run the
  # real tools — alint cannot replicate clippy/oxlint/biome-AST semantics —
  # but command_idempotent gives a timeout + offender parsing the old
  # `kind: command` lacked.
  - id: turbo-cargo-fmt
    kind: command_idempotent
    paths: "Cargo.toml"
    command: ["cargo", "fmt", "--check"]
    timeout: 300
    level: error
  - id: turbo-cargo-clippy
    kind: command_idempotent
    paths: "Cargo.toml"
    command: ["cargo", "lint"]   # .cargo/config.toml alias: clippy --workspace ... -D warnings
    timeout: 900
    level: error
  - id: turbo-cargo-check
    kind: command_idempotent
    paths: "Cargo.toml"
    command: ["cargo", "check", "--workspace"]
    timeout: 900
    level: error
  - id: turbo-cargo-deny-licenses
    kind: command_idempotent
    paths: "deny.toml"
    command: ["cargo", "deny", "check", "licenses"]
    timeout: 300
    level: error
  - id: turbo-oxlint
    kind: command_idempotent
    paths: "package.json"
    command: ["pnpm", "exec", "oxlint", "--deny-warnings", "."]
    timeout: 300
    level: error
  - id: turbo-oxfmt-check
    kind: command_idempotent
    paths: "package.json"
    command: ["oxfmt", "--check"]
    timeout: 300
    level: error
  - id: turbo-taplo-check
    kind: command_idempotent
    paths: ".taplo.toml"
    command: ["pnpm", "exec", "taplo", "format", "--check"]
    timeout: 180
    level: error
  - id: turbo-ultracite-check
    kind: command_idempotent
    paths: "package.json"
    command: ["pnpm", "exec", "ultracite", "check"]
    timeout: 300
    level: warning

  # ── [scope_filter] On large PRs, run the expensive cargo gates only when
  # Rust actually changed. PER-RULE only; {{env}} needs a default.
  - id: turbo-cargo-clippy-changed
    kind: command_idempotent
    paths: "crates/**/*.rs"
    command: ["cargo", "lint"]
    timeout: 900
    level: error
    scope_filter:
      changed_since: "{{env.ALINT_BASE_REF | default('origin/main')}}"

  # ── [import_gate] Forbid std DefaultHasher / VecDeque::new in crate
  # source — mirrors clippy.toml's disallowed-types/methods so the ban is
  # visible at lint time even if clippy.toml is removed. language: rust
  # operates on the extracted use-path; forbid is ONE anchored alternation.
  - id: turbo-forbid-default-hasher-and-vecdeque-new
    kind: import_gate
    language: rust
    paths: { include: ["crates/**/*.rs"], exclude: ["**/tests/**", "**/*_test.rs"] }
    forbid: '^(std::collections::hash_map::DefaultHasher|std::collections::VecDeque)$'
    level: warning
    message: >-
      Mirrors clippy.toml bans: use turbo_tasks_hash hashers instead of
      std DefaultHasher, and VecDeque::with_capacity instead of ::new.

  # ════════════════════════════════════════════════════════════════════
  # STRUCTURAL GATES (carried from the v0.9.17 example, still valid)
  # ════════════════════════════════════════════════════════════════════

  # ── Per-crate README.
  - id: turbo-crate-has-readme
    kind: for_each_dir
    select: "crates/*"
    when_iter: 'iter.has_file("Cargo.toml")'
    require:
      - kind: file_exists
        paths: "{path}/README.md"
    level: warning

  # ── Per-package LICENSE + README (npm pack does not inherit repo-root copies).
  - id: turbo-package-has-license
    kind: for_each_dir
    select: "packages/*"
    when_iter: 'iter.has_file("package.json")'
    require:
      - kind: file_exists
        paths: "{path}/LICENSE"
    level: warning
  - id: turbo-package-has-readme
    kind: for_each_dir
    select: "packages/*"
    when_iter: 'iter.has_file("package.json")'
    require:
      - kind: file_exists
        paths: "{path}/README.md"
    level: warning

  # ── Examples hygiene: meta.json + its shape, turbo.json, .gitignore.
  - id: turbo-example-has-meta-json
    kind: for_each_dir
    select: "examples/*"
    when_iter: 'iter.has_file("package.json")'
    require:
      - kind: file_exists
        paths: "{path}/meta.json"
    level: error
  - id: turbo-example-meta-name
    kind: json_path_matches
    paths: "examples/*/meta.json"
    path: "$.name"
    matches: ".+"
    level: error
  - id: turbo-example-meta-description
    kind: json_path_matches
    paths: "examples/*/meta.json"
    path: "$.description"
    matches: ".+"
    level: error
  - id: turbo-example-meta-maintenance-flag
    # json_path_matches can't match a bool; assert via JSON text regex.
    kind: file_content_matches
    paths: "examples/*/meta.json"
    pattern: '"maintainedByCoreTeam"\s*:\s*(true|false)\b'
    level: error
  - id: turbo-example-has-turbo-json
    kind: for_each_dir
    select: "examples/*"
    when_iter: 'iter.has_file("package.json")'
    require:
      - kind: file_exists
        paths: "{path}/turbo.json"
    level: error
  - id: turbo-example-has-gitignore
    kind: for_each_dir
    select: "examples/*"
    when_iter: 'iter.has_file("package.json")'
    require:
      - kind: file_exists
        paths: "{path}/.gitignore"
    level: warning

  # ── turbo.json shape: schema pin + a tui/stream UI value.
  - id: turbo-root-turbo-json-schema-pinned
    kind: json_path_matches
    paths: "turbo.json"
    path: "$['$schema']"
    matches: 'turborepo\.(dev|com)/schema\.json'
    level: warning
    message: >-
      Root turbo.json must pin the published $schema URL so editors validate it.

  # ── deny.toml license allow-list present.
  - id: turbo-cargo-deny-config-present
    kind: file_exists
    paths: deny.toml
    level: error
  - id: turbo-cargo-deny-licenses-section
    kind: toml_path_matches
    paths: deny.toml
    path: "$.licenses.allow[*]"
    matches: ".+"
    level: error

  # ── clippy.toml present (carries the disallowed-types/methods bans).
  - id: turbo-clippy-toml-present
    kind: file_exists
    paths: clippy.toml
    level: warning

  # ── rust-toolchain pinned to a dated nightly (floating nightly = non-repro).
  - id: turbo-rust-toolchain-pinned
    kind: toml_path_matches
    paths: rust-toolchain.toml
    path: "$.toolchain.channel"
    matches: '^(stable|beta|nightly-\d{4}-\d{2}-\d{2}|\d+\.\d+(\.\d+)?)$'
    level: error
    message: >-
      Pin a dated nightly (nightly-YYYY-MM-DD). Bare `nightly` breaks repro builds.

  # ── version.txt shape: two lines <semver>\n<dist-tag>.
  - id: turbo-version-file-shape
    kind: file_content_matches
    paths: version.txt
    pattern: '^\d+\.\d+\.\d+(-(canary|alpha|beta|rc)(\.\d+)?)?\n(latest|canary|alpha|beta|rc)\n'
    level: error

  # ── husky pre-push present and runs the canonical gates.
  - id: turbo-prepush-hook-present
    kind: file_exists
    paths: .husky/pre-push
    level: warning
  - id: turbo-prepush-runs-cargo-fmt
    kind: file_content_matches
    paths: .husky/pre-push
    pattern: 'cargo fmt --check'
    level: warning
  - id: turbo-prepush-runs-cargo-lint
    kind: file_content_matches
    paths: .husky/pre-push
    pattern: 'cargo (lint|clippy)'
    level: warning

# ════════════════════════════════════════════════════════════════════
# GENUINE NON-REPLACEABLES (keep the existing tool / CI step) — and WHY:
#
#  * oxlint --deny-warnings / ultracite check  : semantic JS/TS lint over a
#       parsed AST; alint shells out (command_idempotent) but cannot replicate.
#  * oxfmt --check / taplo --check / cargo fmt  : formatter diff vs a pretty-
#       printed AST; not a regex/structural check — shell-out only.
#  * cargo clippy (cargo lint) / cargo check    : type-aware + borrow-checked
#       analysis; requires the Rust compiler. import_gate mirrors the literal
#       clippy.toml bans only, not real type resolution.
#  * cargo deny check licenses                  : resolves the full dependency
#       graph from Cargo.lock; alint asserts deny.toml SHAPE, not graph licences.
#  * examples/check-examples.ts                 : sandbox-installs & live-runs
#       every example against pnpm/npm/yarn — alint never executes example code.
#  * test-js-packages.yml release-PR guard      : a CI-time `gh api` diff that
#       restricts release PRs to version.txt/package.json/Cargo.*/lockfiles/
#       CHANGELOG/skills — a diff-against-base check, not a repo-state check.
#  * lint-pr-title.yml (semantic-pull-request)  : validates the live PR TITLE
#       (Conventional-Commit + uppercase subject). No commit/title exists in
#       the working tree, so it cannot be a repo-state rule.
#  * turbo run check-types / check-links / build / test  : build-aware tasks.
#
# NEW-RULE-KIND CANDIDATES (would close remaining gaps):
#  1. dir_name_equals_field — assert crate dir == [package].name and pkg dir
#     == package.json .name (turborepo-paths<->turbopath, kebab dir<->@turbo/scoped
#     divergences). Today neither for_each_dir nor json_path can compare the
#     iterated dir name to a field value.
#  2. json_schema_passes against a REMOTE $schema URL — validate every
#     turbo.json against turborepo.dev/schema.json (we have json_path_* probes
#     but not whole-document schema validation against a fetched schema).
#  3. changed_files_allowlist — a repo-state expression of the release-PR
#     content guard (restrict a labelled change-set to an allow-glob), to
#     finally pull that gh-api CI check into config.
