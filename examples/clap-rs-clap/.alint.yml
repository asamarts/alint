# yaml-language-server: $schema=https://raw.githubusercontent.com/asamarts/alint/main/schemas/v1/config.json
#
# Proposed alint config for clap-rs/clap — v0.10/v0.11 re-analysis.
#
# Supersedes examples/clap-rs-clap/.alint.yml (authored v0.9.17-era).
# The original captured the *static* surface well (workspace pins,
# per-member inheritance, dual-license, auxiliary-config presence) but
# had to leave the moving parts to `command:` shellouts or call them
# out-of-scope. Everything alint shipped since v0.10 closes those:
#
#   NEW since v0.10/v0.11 (the unlock set this re-analysis adds):
#   - cross_file_value_equals : MSRV (1.85) and STABLE-toolchain (1.95)
#       are DUPLICATED between Cargo.toml and ci.yml/Makefile. Drift
#       between them is exactly the class of bug clap's CI can't catch
#       until a job fails late. Now a single declarative assertion.
#   - command_idempotent      : the rustfmt `--check`, clippy `-D
#       warnings`, typos, committed check-mode gates become first-class
#       (not opaque `command:` shellouts) — alint parses their offender
#       lists into per-file violations.
#   - generated_file_fresh    : clap embeds README.md + examples/demo.{rs,md}
#       into rustdoc via `#[doc = include_str!]`; the CHANGELOG version
#       link in src/lib.rs is bumped by cargo-release. (Used here only
#       where there is a real declared generator; see notes.)
#   - git_commit_message / _no_fixup : committed.toml's conventional-commit
#       policy + clap's "no fixup commits" expectation, enforced in-tree
#       against the PR commit range (v0.11) — replaces committed shellout.
#   - {{env.X}}                : ALINT_BASE_SHA wiring for the commit/
#       changed-since rules so the same config works locally and in CI.
#
# DO NOT run command_idempotent / generated_file_fresh blindly: they
# shell out (spawn-gated kinds). They are wired here because clap's CI
# already runs the identical commands; a contributor opting in gets one
# `alint check` entry point. Gate them behind `when:` if you want a
# fast structure-only pass.
#
# Genuine non-replaceables (correctly left to the right tool):
#   - cargo build/test matrix, cargo doc -D warnings, minimal-versions,
#     lockfile freshness  -> the Rust compiler / cargo resolver.
#   - .clippy.toml disallowed-methods, [workspace.lints] definitions
#     -> clippy's AST. alint asserts the *inheritance*, not the lints.
#   - cargo deny bans/licenses/sources -> needs the cargo dep graph.
#   - cffconvert deep CFF schema -> kept as a command_idempotent gate.

version: 1

vars:
  # clap's two pinned toolchains, declared once. The cross_file rules
  # below assert every in-tree copy agrees with the Cargo.toml value;
  # these are documentation of intent for the reader.
  msrv: "1.85"      # [workspace.package].rust-version, ci.yml `# MSRV`
  stable: "1.95"    # Makefile STABLE, ci.yml `# STABLE` (4 sites)

extends:
  - alint://bundled/oss-baseline@v1
  - alint://bundled/rust@v1
  - alint://bundled/monorepo/cargo-workspace@v1
  - alint://bundled/ci/github-actions@v1
  - alint://bundled/hygiene/no-tracked-artifacts@v1

rules:
  # ═══════════════════════════════════════════════════════════════════
  # 1. WORKSPACE.PACKAGE — single source of truth (unchanged from v0.9.17)
  # ═══════════════════════════════════════════════════════════════════
  - id: clap-workspace-license-mit-or-apache
    kind: toml_path_equals
    paths: Cargo.toml
    path: "$.workspace.package.license"
    equals: "MIT OR Apache-2.0"
    level: error
    message: >-
      The clap family is dual-licensed MIT OR Apache-2.0; the workspace
      root must carry exactly that SPDX expression so members inherit it.

  - id: clap-workspace-edition-2024
    kind: toml_path_equals
    paths: Cargo.toml
    path: "$.workspace.package.edition"
    equals: "2024"
    level: error
    message: "Workspace edition is pinned to 2024 (Cargo edition)."

  - id: clap-workspace-rust-version-pinned
    kind: toml_path_matches
    paths: Cargo.toml
    path: "$.workspace.package['rust-version']"
    matches: '^1\.\d{2,}$'
    level: error
    message: >-
      MSRV must be declared at the workspace level so members inherit a
      single floor and CI's msrv job has one source of truth.

  - id: clap-workspace-repository-canonical
    kind: toml_path_equals
    paths: Cargo.toml
    path: "$.workspace.package.repository"
    equals: "https://github.com/clap-rs/clap"
    level: error
    message: "Workspace repository URL must be the canonical clap-rs/clap URL."

  # ═══════════════════════════════════════════════════════════════════
  # 2. ★ NEW (v0.10): MSRV / STABLE-toolchain coherence across files
  #    cross_file_value_equals — the headline unlock for clap.
  #    The MSRV (1.85) lives in BOTH Cargo.toml and ci.yml's check matrix;
  #    the STABLE toolchain (1.95) lives in BOTH the Makefile and four
  #    ci.yml jobs. The old config could only regex each copy in
  #    isolation; it could never assert they AGREE. A bump to one and
  #    not the other is a silent late-CI failure — now a structural error.
  # ═══════════════════════════════════════════════════════════════════
  - id: clap-msrv-coherent-across-ci
    kind: cross_file_value_equals
    source:
      file: Cargo.toml
      extract: { toml: "$.workspace.package['rust-version']" }
    targets:
      # ci.yml's `check` job hardcodes the MSRV rust version; extract it.
      files: ".github/workflows/ci.yml"
      extract: { regex: 'rust:\s*"(\d+\.\d+)"\s*#\s*MSRV' }
    normalize: none
    allow_missing_target: false
    level: error
    message: >-
      MSRV in {{ctx.target}} ({{ctx.target_value}}) must equal the
      workspace floor {{ctx.source_value}} in Cargo.toml. Bump both
      together — a lone bump fails the `check (msrv)` job late.

  - id: clap-stable-toolchain-coherent
    kind: cross_file_value_equals
    source:
      # Makefile is the canonical STABLE pin the Makefile targets consume.
      file: Makefile
      extract: { regex: '(?m)^STABLE\?=(\d+\.\d+)' }
    targets:
      # ci.yml pins the same value via `toolchain: "1.95"  # STABLE`.
      files: ".github/workflows/ci.yml"
      extract: { regex: 'toolchain:\s*"(\d+\.\d+)"\s*#\s*STABLE' }
    normalize: none
    allow_missing_target: false
    level: error
    message: >-
      STABLE toolchain in {{ctx.target}} ({{ctx.target_value}}) must
      equal the Makefile STABLE pin {{ctx.source_value}}. clap keeps
      the rustfmt/clippy/docs/ui jobs on one stable version.

  # ═══════════════════════════════════════════════════════════════════
  # 3. PER-CRATE MANIFEST INHERITANCE (drift catcher) — unchanged shape.
  #    select now lists the full published+bench member set.
  # ═══════════════════════════════════════════════════════════════════
  - id: clap-member-license-inherits
    kind: for_each_dir
    select: "{clap_builder,clap_derive,clap_complete,clap_complete_nushell,clap_lex,clap_mangen,clap_bench}"
    when_iter: 'iter.has_file("Cargo.toml")'
    require:
      - kind: toml_path_equals
        paths: "{path}/Cargo.toml"
        path: "$.package.license.workspace"
        equals: true
    level: error
    message: "Member must inherit `license` via `license.workspace = true`."

  - id: clap-member-edition-inherits
    kind: for_each_dir
    select: "{clap_builder,clap_derive,clap_complete,clap_complete_nushell,clap_lex,clap_mangen,clap_bench}"
    when_iter: 'iter.has_file("Cargo.toml")'
    require:
      - kind: toml_path_equals
        paths: "{path}/Cargo.toml"
        path: "$.package.edition.workspace"
        equals: true
    level: error
    message: "Member must inherit `edition` via `edition.workspace = true`."

  - id: clap-member-rust-version-inherits
    kind: for_each_dir
    select: "{clap_builder,clap_derive,clap_complete,clap_complete_nushell,clap_lex,clap_mangen,clap_bench}"
    when_iter: 'iter.has_file("Cargo.toml")'
    require:
      - kind: toml_path_equals
        paths: "{path}/Cargo.toml"
        path: "$.package['rust-version'].workspace"
        equals: true
    level: error
    message: >-
      Member must inherit MSRV via `rust-version.workspace = true`.
      Hand-rolled MSRV defeats the workspace pin and the CI matrix.

  - id: clap-member-repository-inherits
    kind: for_each_dir
    select: "{clap_builder,clap_derive,clap_complete,clap_complete_nushell,clap_lex,clap_mangen,clap_bench}"
    when_iter: 'iter.has_file("Cargo.toml")'
    require:
      - kind: toml_path_equals
        paths: "{path}/Cargo.toml"
        path: "$.package.repository.workspace"
        equals: true
    level: error
    message: "Member must inherit `repository` via `repository.workspace = true`."

  - id: clap-member-lints-inherit
    kind: for_each_dir
    select: "{clap_builder,clap_derive,clap_complete,clap_complete_nushell,clap_lex,clap_mangen,clap_bench}"
    when_iter: 'iter.has_file("Cargo.toml")'
    require:
      - kind: toml_path_equals
        paths: "{path}/Cargo.toml"
        path: "$.lints.workspace"
        equals: true
    level: error
    message: >-
      Member must opt in to the workspace lint policy via
      `[lints]\nworkspace = true`, or the ~70 clippy lints don't apply.

  # ═══════════════════════════════════════════════════════════════════
  # 4. ★ NEW (v0.10): cross-member metadata IDENTITY (not just regex).
  #    Every published clap-family crate carries the same primary
  #    category. The old config could only assert each member matched a
  #    regex independently; cross_file_value_equals asserts they are all
  #    EQUAL to the facade's value — catches a member that drifts to a
  #    different (still-valid) category string.
  # ═══════════════════════════════════════════════════════════════════
  - id: clap-member-category-identity
    kind: cross_file_value_equals
    source:
      file: Cargo.toml                       # the `clap` facade is canonical
      extract: { toml: "$.package.categories[0]" }
    targets:
      files: "clap_*/Cargo.toml"
      extract: { toml: "$.package.categories[0]" }
    normalize: none
    allow_missing_target: true               # clap_bench has no categories
    level: warning
    message: >-
      Member primary category {{ctx.target_value}} should match the
      facade's {{ctx.source_value}} (command-line-interface) for
      consistent crates.io discoverability across the family.

  # Keyword presence stays per-member (set membership, not identity).
  - id: clap-member-has-cli-keyword
    kind: for_each_dir
    select: "{clap_builder,clap_derive,clap_complete,clap_complete_nushell,clap_mangen,clap_lex}"
    when_iter: 'iter.has_file("Cargo.toml")'
    require:
      - kind: toml_path_matches
        paths: "{path}/Cargo.toml"
        path: "$.package.keywords[*]"
        matches: '^cli$'
    level: warning
    message: "Every clap-family crate carries `cli` in its keywords array."

  - id: clap-member-docsrs-link-defs
    kind: for_each_dir
    select: "{clap_builder,clap_derive,clap_complete,clap_complete_nushell,clap_lex,clap_mangen}"
    when_iter: 'iter.has_file("Cargo.toml")'
    require:
      - kind: toml_path_matches
        paths: "{path}/Cargo.toml"
        path: "$.package.metadata.docs.rs['rustdoc-args'][*]"
        matches: '^--generate-link-to-definition$'
        if_present: true
    level: info
    message: >-
      Member's `[package.metadata.docs.rs]` should pass
      `--generate-link-to-definition` (clap-family convention).

  - id: clap-member-has-readme
    kind: for_each_dir
    select: "{clap_builder,clap_derive,clap_complete,clap_complete_nushell,clap_lex,clap_mangen}"
    when_iter: 'iter.has_file("Cargo.toml")'
    require:
      - kind: file_exists
        paths: "{path}/README.md"
    level: warning
    message: "Every clap-family crate should ship a README.md."

  # ═══════════════════════════════════════════════════════════════════
  # 5. WORKSPACE INCLUDE GLOB + DUAL LICENSE (unchanged)
  # ═══════════════════════════════════════════════════════════════════
  - id: clap-license-apache-exists
    kind: file_exists
    paths: LICENSE-APACHE
    root_only: true
    level: error
    message: "Dual-licensed projects must ship LICENSE-APACHE at the root."

  - id: clap-license-mit-exists
    kind: file_exists
    paths: LICENSE-MIT
    root_only: true
    level: error
    message: "Dual-licensed projects must ship LICENSE-MIT at the root."

  - id: clap-workspace-include-readme
    kind: toml_path_matches
    paths: Cargo.toml
    path: "$.workspace.package.include[*]"
    matches: '^README\.md$'
    level: warning
    message: >-
      `[workspace.package].include` must list "README.md" so it's bundled
      into every published crate tarball.

  - id: clap-workspace-include-license
    kind: toml_path_matches
    paths: Cargo.toml
    path: "$.workspace.package.include[*]"
    matches: '^LICENSE\*$'
    level: warning
    message: >-
      `[workspace.package].include` must list "LICENSE*" so both license
      files bundle into every tarball.

  # ═══════════════════════════════════════════════════════════════════
  # 6. AUXILIARY POLICY FILES (presence + shape) — unchanged
  # ═══════════════════════════════════════════════════════════════════
  - id: clap-committed-config-exists
    kind: file_exists
    paths: committed.toml
    root_only: true
    level: warning
    message: "Conventional-commit policy lives in committed.toml."

  - id: clap-committed-style-conventional
    kind: toml_path_equals
    paths: committed.toml
    path: "$.style"
    equals: "conventional"
    level: warning
    message: '`committed.toml.style` must be "conventional".'

  - id: clap-typos-config-exists
    kind: file_exists
    paths: typos.toml
    root_only: true
    level: info
    message: "typos.toml carries the per-repo spell-check allowlist."

  - id: clap-deny-config-exists
    kind: file_exists
    paths: deny.toml
    root_only: true
    level: warning
    message: "cargo deny policy lives in deny.toml."

  - id: clap-pre-commit-config-exists
    kind: file_exists
    paths: .pre-commit-config.yaml
    root_only: true
    level: info
    message: "pre-commit / prek hooks are wired via .pre-commit-config.yaml."

  - id: clap-citation-exists
    kind: file_exists
    paths: CITATION.cff
    root_only: true
    level: warning
    message: "CITATION.cff makes cite-as info machine-readable."

  - id: clap-citation-cff-version
    kind: yaml_path_matches
    paths: CITATION.cff
    path: "$['cff-version']"
    matches: '^1\.[0-9]+\.[0-9]+$'
    level: warning
    message: "CITATION.cff must declare a `cff-version`."

  # ★ NEW (v0.10): CITATION.cff version must equal the facade crate version.
  # cargo-release keeps these in lockstep via pre-release-replacements;
  # alint now asserts the invariant instead of trusting the release script.
  - id: clap-citation-version-matches-crate
    kind: cross_file_value_equals
    source:
      file: Cargo.toml
      extract: { toml: "$.package.version" }
    targets:
      files: "CITATION.cff"
      extract: { yaml: "$.version" }
    normalize: none
    allow_missing_target: false
    level: warning
    message: >-
      CITATION.cff version {{ctx.target_value}} must equal the published
      `clap` crate version {{ctx.source_value}} (cargo-release bumps both).

  # ═══════════════════════════════════════════════════════════════════
  # 7. ★ NEW (v0.11): COMMIT POLICY — replaces the `committed` shellout
  #    and the bundled committed.yml workflow with in-tree checks over
  #    the PR commit range. {{env.ALINT_BASE_SHA}} lets the same config
  #    run locally (against origin/master) and in CI (against the base).
  # ═══════════════════════════════════════════════════════════════════
  - id: clap-commits-conventional
    kind: git_commit_message
    since: "{{env.ALINT_BASE_SHA | default('origin/master')}}"
    # Conventional Commits header: type(scope)!: subject — mirrors
    # committed.toml `style = "conventional"`.
    pattern: '^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\(.+\))?!?: .+'
    level: error
    message: >-
      Commit subjects must follow Conventional Commits (matches the
      committed.toml `style = "conventional"` policy).

  - id: clap-no-fixup-commits
    kind: git_commit_no_fixup
    since: "{{env.ALINT_BASE_SHA | default('origin/master')}}"
    level: error
    message: "Squash `fixup!`/`squash!` commits before merge."

  # ═══════════════════════════════════════════════════════════════════
  # 8. ★ NEW (v0.10): CHECK-MODE GATES via command_idempotent.
  #    These replace the four opaque `command:` shellouts in the old
  #    config with first-class idempotency rules that parse each tool's
  #    offender list into per-file violations. clap's CI runs the exact
  #    same commands (rustfmt/clippy jobs in ci.yml, typos workflow).
  #
  #    NOTE: spawn-gated. Gate behind `when: env.ALINT_RUN_TOOLS == "1"`
  #    if you want a pure-structure pass; left always-on here to mirror
  #    "one `alint check` runs clap's whole lint shell" intent.
  # ═══════════════════════════════════════════════════════════════════
  - id: clap-rustfmt-clean
    kind: command_idempotent
    command: ["cargo", "fmt", "--all", "--", "--check"]
    files_from: stderr
    files_pattern: 'Diff in (.+) at'
    timeout: 120
    level: error
    message: "Run `cargo fmt --all` — code is not formatter-clean."

  - id: clap-typos-clean
    kind: command_idempotent
    command: ["typos"]
    files_from: stdout
    files_pattern: '^(.+):\d+:\d+:'
    timeout: 120
    level: warning
    message: "Spelling issues found by `typos`; fix or extend typos.toml."

  - id: clap-cffconvert-valid
    kind: command_idempotent
    command: ["cffconvert", "--validate", "-i", "CITATION.cff"]
    timeout: 30
    level: warning
    message: "CITATION.cff failed cffconvert schema validation."

  - id: clap-cargo-deny-clean
    kind: command_idempotent
    command: ["cargo", "deny", "check", "bans", "licenses", "sources"]
    timeout: 300
    level: warning
    message: "`cargo deny` policy violation (bans/licenses/sources)."

  # ═══════════════════════════════════════════════════════════════════
  # 9. ★ NEW (v0.10): GENERATED-CONTENT FRESHNESS via generated_file_fresh.
  #    clap embeds examples/demo.md into rustdoc (`#[doc =
  #    include_str!("../examples/demo.md")]` in src/lib.rs). demo.md is a
  #    rendered/snapshot artifact in clap's docs flow; if a project wires
  #    a declared generator for it, this asserts the committed copy is
  #    fresh. Commented because clap does not ship a standalone generator
  #    command in-tree (the render is part of the doc-test harness); kept
  #    as a template for the README/help-codegen pattern this kind targets.
  # ═══════════════════════════════════════════════════════════════════
  # - id: clap-demo-md-fresh
  #   kind: generated_file_fresh
  #   file: examples/demo.md
  #   command: ["cargo", "run", "--quiet", "--example", "demo", "--", "--help"]
  #   normalize: final-newline
  #   timeout: 120
  #   level: warning
  #   message: "examples/demo.md is stale — re-render and commit it."

  # ═══════════════════════════════════════════════════════════════════
  # 10. REPO GOVERNANCE
  # ═══════════════════════════════════════════════════════════════════
  - id: clap-contributing-exists
    kind: file_exists
    paths: CONTRIBUTING.md
    root_only: true
    level: warning
    message: "CONTRIBUTING.md documents the rustfmt/clippy/committed/typos gates."
