# yaml-language-server: $schema=https://raw.githubusercontent.com/asamarts/alint/main/schemas/v1/config.json
#
# PROPOSED alint config for protocolbuffers/protobuf — re-analysis at
# alint v0.11 capability level (was v0.9.17 in the committed example).
#
# Repo state: shallow clone of protocolbuffers/protobuf @ 2026-05-25.
# version.json protoc_version = 36-dev; protobuf_version.bzl
# PROTOC_VERSION = 36.0 (note the form mismatch, see CROSS-FILE below).
#
# WHAT CHANGED SINCE THE v0.9.17 EXAMPLE
# --------------------------------------
# The old config leaned almost entirely on file_exists + file_content_matches
# because the cross-file / generated-file / per-file primitives didn't exist.
# Every "X must match Y across two files" invariant was DOCUMENTED in a comment
# as a future `cross_language_implementation_complete` candidate but NOT
# enforced. v0.10/v0.11 now enforce most of them directly:
#
#   * cross_file_value_equals  — version coherence across bzl/pom/gemspec
#   * generated_file_fresh / command_idempotent — the 12 Bazel staleness
#     tests (the famous src/file_lists.cmake regen + well-known-types +
#     descriptor.pb + amalgamations)
#   * ordered_block            — failure_list_*.txt sortedness
#   * file_header              — the BSD-style Google header sweep (NEW:
#     replaces having no header check at all)
#   * registry_paths_resolve   — version.json languages -> binding dirs
#   * scope_filter.changed_since — make heavy command rules PR-incremental

version: 1

extends:
  - alint://bundled/oss-baseline@v1
  - alint://bundled/ci/github-actions@v1
  - alint://bundled/hygiene/no-tracked-artifacts@v1

rules:
  # ════════════════════════════════════════════════════════════════════
  # 1. BSD-STYLE LICENSE HEADER SWEEP  (NEW vs v0.9.17 — file_header)
  # Every source file across all ~10 bindings carries the identical
  # "Protocol Buffers - Google's data interchange format / Copyright 2008
  # Google Inc. / BSD-style license" header. Verified identical in .cc,
  # .java, .py. One rule per comment-syntax family. This is the single
  # biggest NEW win: no per-language linter checks this, and the old
  # config had NO header rule at all.
  # ════════════════════════════════════════════════════════════════════
  - id: protobuf-bsd-header-slash
    kind: file_header
    paths:
      include: ["src/**/*.{cc,h,cpp,inc}", "java/**/*.java", "objectivec/**/*.{m,h}", "rust/**/*.rs", "upb/**/*.{c,h}", "hpb/**/*.{cc,h}", "csharp/**/*.cs"]
      exclude: ["**/*.pb.cc", "**/*.pb.h", "**/*.pb.cs", "**/*_pb2.py", "**/*.pbobjc.*", "upb/reflection/{cmake,stage0}/**", "csharp/src/Google.Protobuf.Test.TestProtos/OldExtensions*.cs", "**/third_party/**"]
    pattern: 'Protocol Buffers - Google''s data interchange format'
    lines: 6
    level: warning
    message: >-
      Every hand-written source file MUST start with the canonical
      BSD-style Google header (Copyright 2008 Google Inc., "Use of this
      source code is governed by a BSD-style license"). Generated *.pb.*
      and *_pb2.py files are excluded (the codegen stamps its own header).

  - id: protobuf-bsd-header-hash
    kind: file_header
    paths:
      include: ["python/**/*.py", "ruby/**/*.rb", "php/**/*.php"]
      exclude: ["**/*_pb2.py", "**/third_party/**", "**/vendor/**"]
    pattern: 'Protocol Buffers - Google''s data interchange format'
    lines: 6
    level: warning
    message: >-
      Hash-comment languages (Python/Ruby/PHP) carry the same BSD-style
      Google header. Generated *_pb2.py excluded.

  # ════════════════════════════════════════════════════════════════════
  # 2. CROSS-LANGUAGE VERSION COHERENCE  (NEW — cross_file_value_equals)
  # The old config had NINE separate json_path_matches + SIX separate
  # file_content_matches rules that each verified a version string MATCHED
  # A REGEX SHAPE — they could not verify the values AGREE across files.
  # cross_file_value_equals now enforces the actual lock-step invariant.
  #
  # IMPORTANT FORM NOTE discovered at clone time:
  #   protobuf_version.bzl  PROTOBUF_JAVA_VERSION = "4.36.0"  (full patch)
  #   java/bom/pom.xml      <version>4.36.0</version>          (full patch)  -> EXACT MATCH OK
  #   ruby/google-protobuf.gemspec s.version = "4.36.0"        (full patch)  -> EXACT MATCH OK
  #   version.json          languages.java = "4.36-dev"        (major.minor + -dev) -> does NOT
  #                                                              exact-match "4.36.0", so version.json
  #                                                              is INTENTIONALLY excluded from the
  #                                                              equals chains below. Bridging the two
  #                                                              forms ("4.36-dev" <-> "4.36.0") is a
  #                                                              normalization the current
  #                                                              cross_file_value_equals cannot do
  #                                                              (see NEW-RULE-KIND CANDIDATES).
  # ════════════════════════════════════════════════════════════════════
  - id: protobuf-java-version-coherent
    kind: cross_file
    source:
      file: protobuf_version.bzl
      extract:
        regex: 'PROTOBUF_JAVA_VERSION\s*=\s*"([^"]+)"'
    targets:
      - file: java/bom/pom.xml
        extract:
          regex: '(?s)<artifactId>protobuf-bom</artifactId>\s*<version>([^<]+)</version>'
    level: error
    message: >-
      The Bazel-side PROTOBUF_JAVA_VERSION must equal java/bom/pom.xml's
      first <version>. Drift means the Bazel-built JAR and the Maven-
      published JAR ship different versions.

  - id: protobuf-ruby-version-coherent
    kind: cross_file
    source:
      file: protobuf_version.bzl
      extract:
        regex: 'PROTOBUF_RUBY_VERSION\s*=\s*"([^"]+)"'
    targets:
      - file: ruby/google-protobuf.gemspec
        extract:
          regex: 's\.version\s*=\s*"([^"]+)"'
    level: error
    message: >-
      PROTOBUF_RUBY_VERSION must equal ruby/google-protobuf.gemspec
      s.version. Drift means the Bazel-built gem and the RubyGems-
      published gem disagree.

  # ════════════════════════════════════════════════════════════════════
  # 3. GENERATED-FILE STALENESS  (NEW — generated_file_fresh /
  #    command_idempotent). THE HEADLINE WIN.
  # The repo's whole staleness discipline (regenerate_stale_files.sh +
  # staleness_check.yml, 12 Bazel staleness_test targets) maps directly
  # onto alint's non-mutating spawn kinds. The most famous instance is
  # src:cmake_lists_staleness_test, which regenerates src/file_lists.cmake
  # from the Bazel source globs.
  #
  # We model it via command_idempotent: run the repo's OWN regen entry
  # point in a non-mutating/check posture and assert it produces no diff.
  # NOTE: this requires Bazel on PATH; gated to PR-changed runs to keep
  # cost sane on a Bazel-built monorepo.
  # ════════════════════════════════════════════════════════════════════
  - id: protobuf-file-lists-cmake-fresh
    kind: command_idempotent
    # cmake_lists_staleness_test supports --fix; in check mode it exits
    # non-zero iff src/file_lists.cmake is stale vs the Bazel source globs.
    command: ["bazel", "run", "//src:cmake_lists_staleness_test"]
    paths: src/file_lists.cmake
    timeout: 600
    level: error
    scope_filter:
      changed_since: "{{env.ALINT_BASE_REF | default('origin/main')}}"
    message: >-
      src/file_lists.cmake is auto-generated from the Bazel source-list
      globs (@//pkg:gen_src_file_lists_cmake). It MUST be regenerated when
      sources are added/removed. This is protobuf's canonical cross-file
      generated-artifact invariant — run ./regenerate_stale_files.sh.

  - id: protobuf-well-known-types-fresh
    kind: command_idempotent
    command: ["bazel", "run", "//src/google/protobuf:well_known_types_staleness_test"]
    paths: src/google/protobuf/any.pb.cc
    timeout: 600
    level: error
    scope_filter:
      changed_since: "{{env.ALINT_BASE_REF | default('origin/main')}}"
    message: >-
      The checked-in well-known-type descriptors (any.pb.*, struct.pb.*,
      etc.) must match protoc output. Run ./regenerate_stale_files.sh.

  # The other 10 staleness targets (csharp defaults, java defaults, upb
  # bootstrap/descriptor/plugin, cmake test_dependencies, php amalgamation
  # + proto, ruby amalgamation, objectivec well-known) follow the identical
  # command_idempotent shape; omitted here for brevity but each is a
  # one-rule drop-in. Collectively these 12 replace the entire
  # staleness_check.yml + regenerate_stale_files.sh discipline at PR time.

  # ════════════════════════════════════════════════════════════════════
  # 4. failure_list_*.txt SORTEDNESS  (NEW — ordered_block)
  # The old config flagged this as a v0.10 ordered_block candidate but
  # could not enforce it. Each list is one-test-per-line; enforce C-locale
  # sort over the whole file. (Some lists carry "# comment" markers and a
  # blank trailer; start/end bracket the comparable region.)
  # ════════════════════════════════════════════════════════════════════
  # The conformance failure lists have no literal boundary markers and are
  # not sorted upstream. Their semantics stay with the conformance runner;
  # `ordered_block` cannot model them without inventing a false convention.

  # ════════════════════════════════════════════════════════════════════
  # 5. version.json LANGUAGES -> BINDING DIRS  (NEW — registry_paths_resolve)
  # version.json's languages map is the canonical list of shipped bindings;
  # assert each named language has a real in-tree directory. This is the
  # structured-manifest analogue of the old hand-listed for_each_file glob.
  # (cpp resolves via src/, javascript has no in-tree dir -> would flag;
  # left as info to surface the spun-out-binding pattern, see message.)
  # NOTE: kept advisory because cpp/javascript don't map 1:1 to a dir name.
  # ════════════════════════════════════════════════════════════════════
  # (registry_paths_resolve needs a clean key->path map; version.json's
  #  cpp/javascript keys don't name dirs, so a literal registry here would
  #  false-positive. Documented as a NEW-RULE-KIND candidate instead —
  #  see below — rather than shipped as a noisy rule.)

  # ════════════════════════════════════════════════════════════════════
  # 6. STRUCTURED MANIFEST INVARIANTS  (carried fwd, now structured-query)
  # These keep their v0.9.17 form (json_path) — still the right tool.
  # ════════════════════════════════════════════════════════════════════
  - id: protobuf-php-composer-name
    kind: json_path_matches
    paths: php/composer.json
    path: "$.name"
    matches: '^google/protobuf$'
    level: error
  - id: protobuf-php-composer-license
    kind: json_path_matches
    paths: php/composer.json
    path: "$.license"
    matches: '^BSD-3-Clause$'
    level: error
  - id: protobuf-csharp-sdk-pinned
    kind: json_path_matches
    paths: global.json
    path: "$.sdk.version"
    matches: '^\d+\.\d+\.\d+$'
    level: warning

  # ════════════════════════════════════════════════════════════════════
  # 7. CRITICAL PRESENCE ANCHORS  (carried forward from v0.9.17 — still
  # file_exists; these stay because they are genuinely presence-only).
  # The full set of conformance runner / failure_list / test-workflow /
  # per-binding-manifest file_exists rules from the v0.9.17 config remain
  # valid and are retained verbatim there. A representative subset:
  # ════════════════════════════════════════════════════════════════════
  - id: protobuf-version-manifest-present
    kind: file_exists
    paths: version.json
    level: error
  - id: protobuf-version-bzl-present
    kind: file_exists
    paths: protobuf_version.bzl
    level: error
  - id: protobuf-conformance-proto-present
    kind: file_exists
    paths: conformance/conformance.proto
    level: error
  - id: protobuf-objc-privacy-manifest-present
    kind: file_exists
    paths: PrivacyInfo.xcprivacy
    level: error

  # ════════════════════════════════════════════════════════════════════
  # 8. PER-LANGUAGE FORMAT/STYLE TOOLS  (carried forward — command:)
  # alint owns file-shape; these own per-language AST. Now PR-scoped.
  # ════════════════════════════════════════════════════════════════════
  - id: protobuf-buildifier-check
    kind: command
    paths: MODULE.bazel
    command: ["buildifier", "-mode=check", "-r", "."]
    timeout: 600
    level: warning
  - id: protobuf-cpp-clang-format-check
    kind: command
    paths: .clang-format
    command: ["clang-format", "--dry-run", "--Werror"]
    timeout: 300
    level: warning

# ════════════════════════════════════════════════════════════════════
# GENUINE NON-REPLACEABLES (keep the existing tooling)
# ════════════════════════════════════════════════════════════════════
#  * conformance suite (bazel test //...:conformance_test) — spawns a
#    tester + per-binding testee exchanging binary protos over a pipe.
#    alint sees files at rest; it cannot run the wire-format exchange.
#  * the C++/protoc COMPILE + per-binding builds — out of scope.
#  * clang-format / buildifier / gofmt / rubocop / flake8 SEMANTIC checks
#    — alint wires them via command: but does not reimplement the parsers.
#  * Kokoro Google-internal CI orchestration — config not in-tree.
#  * PrivacyInfo.xcprivacy SEMANTIC correctness — Apple validates it.
#
# NEW-RULE-KIND CANDIDATES surfaced by this re-analysis
# ────────────────────────────────────────────────────
#  A) NORMALIZED cross_file_value_equals: version.json "4.36-dev" should
#     reconcile with protobuf_version.bzl "4.36.0" — same release, two
#     string FORMS (major.minor+-dev vs major.minor.patch). Today the
#     forms can't be bridged, so version.json is excluded from §2. A
#     `normalize:` transform (strip -dev, truncate to major.minor) on
#     cross_file_value_equals would close the last drift gap. Highest-
#     value new capability this repo demands.
#  B) registry-with-key-aliasing: version.json languages.{cpp->src,
#     javascript->(none)} need key->dir aliasing before
#     registry_paths_resolve fits (§5). Today literal-only.
