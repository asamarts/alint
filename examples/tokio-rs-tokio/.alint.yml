# yaml-language-server: $schema=https://raw.githubusercontent.com/asamarts/alint/main/schemas/v1/config.json
#
# Re-analysis of tokio-rs/tokio for alint (post-v0.10/v0.11 capabilities).
#
# tokio is a 10-member Cargo workspace with members at the repo ROOT
# (no crates/ prefix): the 5 published crates
#   tokio, tokio-macros, tokio-test, tokio-stream, tokio-util
# plus 5 internal (publish=false) crates
#   benches, examples, stress-test, tests-build, tests-integration.
#
# ALL structural validation lives in .github/workflows/ — there is no
# ci/ dir or hack/verify-*.sh pipeline. ci.yml is ~1390 lines of
# matrix-driven cargo invocations. The repo-STATE checks (things you can
# answer by reading the working tree, not by compiling) are:
#
#   fmt job ............ rustfmt --check --edition 2021 $(git ls-files '*.rs')
#   clippy job ......... cargo clippy --workspace ... (2 feature passes)
#   docs job ........... cargo doc --lib --no-deps -Dwarnings
#   semver job ......... cargo-semver-checks (published crates)
#   check-readme ....... diff README.md tokio/README.md
#                        grep tokio Cargo.toml version IN README.md
#   check-spelling ..... spellcheck.dic header-is-int + count==lines + sorted-unique
#                        cargo spellcheck --code 1
#                        grep -rne '\s$'   (trailing whitespace)
#   audit.yml/pr-audit.yml .. cargo deny check (deny.toml)
#   ci.yml env block ... rust_min: '1.71' is hand-synced to README/CONTRIBUTING
#                        + tokio/tokio-util/tokio-test/tokio-stream Cargo.toml
#                        (see the explicit "When updating this, also update:"
#                        comment at ci.yml lines 23-31)
#
# This config replaces the structural-state subset declaratively and
# shells out for the language-aware tools. The big wins vs the
# v0.9.17-era example (examples/tokio-rs-tokio/.alint.yml) are flagged
# [NEW v0.10] / [NEW v0.11] — they retire gaps that the old config could
# only assert existence for.

version: 1

extends:
  - alint://bundled/oss-baseline@v1
  - alint://bundled/rust@v1
  - alint://bundled/monorepo/cargo-workspace@v1
  - alint://bundled/ci/github-actions@v1
  - alint://bundled/hygiene/no-tracked-artifacts@v1

rules:
  # ════════════════════════════════════════════════════════════════
  # SHELL-OUTS: language-aware tools (command / command_idempotent)
  # ════════════════════════════════════════════════════════════════

  # ── fmt job ──────────────────────────────────────────────────────
  # rustfmt --check is the canonical idempotent formatter. command_idempotent
  # [NEW v0.10] models "run the tool in check-mode; clean tree = pass" and,
  # via files_from/files_pattern, can attribute each diff to a file.
  - id: tokio-rustfmt-check
    kind: command_idempotent
    paths: "Cargo.toml"            # anchor: fire once at the workspace root
    command: ["cargo", "fmt", "--check"]
    timeout: 120
    level: error

  # ── clippy job (stable feature pass) ─────────────────────────────
  # The unstable pass (RUSTFLAGS=--cfg tokio_unstable, --all-features) and
  # the [patch.crates-io]-stripped second pass are CI feature-orchestration,
  # NOT static state — left in CI. clippy's lints are semantic (require a
  # full type-checking compile), so this stays a shell-out, not a rule kind.
  - id: tokio-clippy-workspace
    kind: command
    paths: "Cargo.toml"
    command: ["cargo", "clippy", "--workspace", "--tests", "--no-deps",
              "--features", "full,test-util"]
    timeout: 600
    level: error

  # ── docs job ─────────────────────────────────────────────────────
  # cargo doc is a build; intrinsically a shell-out. -Dwarnings posture only.
  - id: tokio-cargo-doc
    kind: command
    paths: "Cargo.toml"
    command: ["cargo", "doc", "--workspace", "--no-deps"]
    timeout: 600
    level: warning

  # ── audit.yml / pr-audit.yml ─────────────────────────────────────
  - id: tokio-cargo-deny
    kind: command
    paths: "deny.toml"
    command: ["cargo", "deny", "check"]
    timeout: 120
    level: error

  # ── semver job ───────────────────────────────────────────────────
  # cargo-semver-checks needs a built rustdoc JSON — shell-out, per crate.
  - id: tokio-semver-checks
    kind: for_each_dir
    select: "{tokio,tokio-macros,tokio-test,tokio-stream,tokio-util}"
    when_iter: 'iter.has_file("Cargo.toml")'
    require:
      - kind: command
        paths: "{path}"
        command: ["cargo", "semver-checks", "--manifest-path", "{path}/Cargo.toml"]
        timeout: 300
    level: warning

  # ── check-spelling job: cargo-spellcheck ─────────────────────────
  - id: tokio-cargo-spellcheck
    kind: command
    paths: "spellcheck.toml"
    command: ["cargo", "spellcheck", "--code", "1"]
    timeout: 300
    level: warning

  # ════════════════════════════════════════════════════════════════
  # README mirror equality remains with CI.
  # check-readme job: `diff README.md tokio/README.md`.
  # ════════════════════════════════════════════════════════════════
  # Full-file byte equality is not a `pair_hash format: contains` operation.
  # Keep the repository's existing `diff README.md tokio/README.md` CI check
  # as the authority until alint has a byte-equality rule kind.

  # ════════════════════════════════════════════════════════════════
  # BIG WIN #2 — tokio version is current in README
  #              [NEW v0.10: cross_file_value_equals]
  # check-readme job: grep the `version = ` line from tokio/Cargo.toml
  # and require it to appear in README.md. The v0.9.17 config flagged
  # this as an outright gap ("needs cross_file_value_equals"). Now:
  # extract version from tokio/Cargo.toml, require the literal
  # `version = "X"` snippet in README.md.
  # ════════════════════════════════════════════════════════════════
  - id: tokio-readme-version-current
    kind: cross_file
    source:
      file: "tokio/Cargo.toml"
      extract: { toml: "$.package.version" }
    targets:
      - file: "README.md"
        extract: { regex: 'tokio = \{ version = "([0-9]+\.[0-9]+\.[0-9]+)"' }
    level: error
    message: |
      The `tokio = { version = "X.Y.Z", ... }` snippet in README.md must
      match tokio/Cargo.toml's [package] version. (CI: the `grep -q` in
      the check-readme job.)

  # ════════════════════════════════════════════════════════════════
  # BIG WIN #3 — MSRV (rust-version) coherence across the workspace
  #              [NEW v0.10: cross_file_value_equals]
  # ci.yml pins `rust_min: '1.71'` and a comment (lines 23-31) lists the
  # FIVE files that must be hand-synced. This is the classic drift bug
  # cross_file_value_equals exists for: take tokio/Cargo.toml's
  # rust-version as the source of truth, require every sibling published
  # crate AND ci.yml's rust_min to match. The v0.9.17 config had NO MSRV
  # check at all.
  # ════════════════════════════════════════════════════════════════
  - id: tokio-msrv-coherence
    kind: cross_file
    source:
      file: "tokio/Cargo.toml"
      extract: { toml: "$.package['rust-version']" }
    targets:
      - file: "tokio-util/Cargo.toml"
        extract: { toml: "$.package['rust-version']" }
      - file: "tokio-test/Cargo.toml"
        extract: { toml: "$.package['rust-version']" }
      - file: "tokio-stream/Cargo.toml"
        extract: { toml: "$.package['rust-version']" }
      - file: "tokio-macros/Cargo.toml"
        extract: { toml: "$.package['rust-version']" }
      - file: ".github/workflows/ci.yml"
        extract: { regex: "rust_min:\\s*'([0-9]+\\.[0-9]+)'" }
    level: error
    message: |
      All published tokio-* crates' [package] rust-version, plus ci.yml's
      `rust_min`, must agree. ci.yml's own comment (lines 23-31) lists
      these as hand-synced — exactly the drift cross_file_value_equals
      prevents. (README/CONTRIBUTING also restate it as prose; not
      machine-extractable, left as docs.)

  # ════════════════════════════════════════════════════════════════
  # Inter-crate dependency requirements remain with Cargo and review.
  # ════════════════════════════════════════════════════════════════
  # Cargo's TOML structure, rather than an unscoped regex that also matches
  # dependency versions, must identify the package version. The published
  # crates intentionally use compatible 1.x requirements, so this stays CI-
  # and Cargo-owned instead of asserting a convention the repository lacks.

  # ════════════════════════════════════════════════════════════════
  # spellcheck.dic sorting and count parity remain with CI.
  # check-spelling job runs `sed '1d' | LC_ALL=en_US.UTF8 sort -uc`.
  # ════════════════════════════════════════════════════════════════
  # spellcheck.dic has no literal end marker, so `ordered_block` cannot model
  # the words after its numeric header. The repository's `sort -uc` check
  # remains authoritative for sorting and uniqueness.

  - id: tokio-spellcheck-dic-header-is-int
    kind: file_content_matches
    paths: "spellcheck.dic"
    pattern: '\A\d+\n'
    level: warning
    message: |
      spellcheck.dic must begin with an integer line count. (The
      header-equals-actual-count assertion is not yet expressible — see
      the line_count_header NEW-rule-kind candidate.)

  # ── check-spelling job: trailing whitespace ──────────────────────
  # `grep -rne '\s$'` repo-wide. Scoped to text files (binary fixtures
  # would false-positive a naive repo-wide grep).
  - id: tokio-no-trailing-whitespace
    kind: no_trailing_whitespace
    paths:
      include: ["**/*.rs", "**/*.md", "**/*.toml", "**/*.yml", "**/*.yaml", "**/*.sh"]
      exclude: ["target/**", ".git/**"]
    level: warning
    fix:
      file_trim_trailing_whitespace: {}

  # ════════════════════════════════════════════════════════════════
  # WORKSPACE STRUCTURE / MANIFEST INVARIANTS (toml_path_*, structured)
  # ════════════════════════════════════════════════════════════════

  # deny.toml has a non-empty license allowlist (else cargo deny no-ops/denies all)
  - id: tokio-deny-licenses-allowlist
    kind: toml_path_matches
    paths: "deny.toml"
    path: "$.licenses.allow[*]"
    matches: ".+"
    level: error

  # deny.toml bans wildcard version requirements
  - id: tokio-deny-bans-wildcards
    kind: toml_path_equals
    paths: "deny.toml"
    path: "$.bans.wildcards"
    equals: "deny"
    level: warning

  # Every published crate declares license = MIT (matches root LICENSE).
  - id: tokio-published-crate-license
    kind: toml_path_equals
    paths:
      include:
        - "tokio/Cargo.toml"
        - "tokio-macros/Cargo.toml"
        - "tokio-test/Cargo.toml"
        - "tokio-stream/Cargo.toml"
        - "tokio-util/Cargo.toml"
    path: "$.package.license"
    equals: "MIT"
    level: error

  # Every member is edition 2021 (or 2024 once bumped).
  - id: tokio-cargo-edition
    kind: toml_path_matches
    paths:
      include:
        - "tokio/Cargo.toml"
        - "tokio-macros/Cargo.toml"
        - "tokio-test/Cargo.toml"
        - "tokio-stream/Cargo.toml"
        - "tokio-util/Cargo.toml"
        - "benches/Cargo.toml"
        - "examples/Cargo.toml"
        - "stress-test/Cargo.toml"
        - "tests-build/Cargo.toml"
        - "tests-integration/Cargo.toml"
    path: "$.package.edition"
    matches: '^(2021|2024)$'
    level: error

  # Internal crates are publish=false (bool → *_equals, not *_matches).
  - id: tokio-internal-crate-not-publishable
    kind: toml_path_equals
    paths:
      include:
        - "benches/Cargo.toml"
        - "examples/Cargo.toml"
        - "stress-test/Cargo.toml"
        - "tests-build/Cargo.toml"
        - "tests-integration/Cargo.toml"
    path: "$.package.publish"
    equals: false
    level: warning

  # Every member inherits [lints] workspace = true so the workspace
  # unexpected_cfgs allowlist applies (else -Dwarnings flakes per-crate).
  # toml_path_equals on the bool is cleaner than the v0.9.17 regex.
  - id: tokio-crate-inherits-workspace-lints
    kind: toml_path_equals
    paths:
      include:
        - "tokio/Cargo.toml"
        - "tokio-macros/Cargo.toml"
        - "tokio-test/Cargo.toml"
        - "tokio-stream/Cargo.toml"
        - "tokio-util/Cargo.toml"
        - "stress-test/Cargo.toml"
        - "tests-build/Cargo.toml"
        - "tests-integration/Cargo.toml"
    path: "$.lints.workspace"
    equals: true
    level: warning

  # Workspace [patch.crates-io] tokio → local path (else fresh clone
  # resolves siblings against crates.io and cross-crate dev breaks).
  - id: tokio-workspace-patch-block-present
    kind: toml_path_equals
    paths: "Cargo.toml"
    path: "$.patch['crates-io'].tokio.path"
    equals: "tokio"
    level: error

  # Per-crate CHANGELOG.md presence for every PUBLISHED crate.
  - id: tokio-published-crate-has-changelog
    kind: for_each_dir
    select: "{tokio,tokio-macros,tokio-test,tokio-stream,tokio-util}"
    when_iter: 'iter.has_file("Cargo.toml")'
    require:
      - kind: file_exists
        paths: "{path}/CHANGELOG.md"
    level: warning

  # Per-published-crate README (root-level members; bundled cargo-workspace
  # ruleset assumes crates/* prefix which tokio does NOT use).
  - id: tokio-workspace-member-has-readme
    kind: for_each_dir
    select: "{tokio,tokio-macros,tokio-test,tokio-stream,tokio-util,tests-build,tests-integration}"
    when_iter: 'iter.has_file("Cargo.toml")'
    require:
      - kind: file_exists
        paths: "{path}/README.md"
    level: warning

  # tests-integration [[bin]] entries have matching src files (valgrind job
  # compiles test-mem / test-process-signal).
  - id: tokio-tests-integration-bin-cat
    kind: file_exists
    paths: "tests-integration/src/bin/test-cat.rs"
    level: warning
  - id: tokio-tests-integration-bin-mem
    kind: file_exists
    paths: "tests-integration/src/bin/test-mem.rs"
    level: warning
  - id: tokio-tests-integration-bin-process-signal
    kind: file_exists
    paths: "tests-integration/src/bin/test-process-signal.rs"
    level: warning

  # Workflow / config files exist.
  - id: tokio-ci-workflow-exists
    kind: file_exists
    paths: ".github/workflows/ci.yml"
    level: error
  - id: tokio-audit-workflow-exists
    kind: file_exists
    paths: ".github/workflows/audit.yml"
    level: error
  - id: tokio-pr-audit-workflow-exists
    kind: file_exists
    paths: ".github/workflows/pr-audit.yml"
    level: error
  - id: tokio-deny-config-exists
    kind: file_exists
    paths: "deny.toml"
    level: error
  - id: tokio-spellcheck-toml-exists
    kind: file_exists
    paths: "spellcheck.toml"
    level: error
  - id: tokio-spellcheck-dic-exists
    kind: file_exists
    paths: "spellcheck.dic"
    level: error

# ══════════════════════════════════════════════════════════════════
# scope_filter (per-rule, [NEW v0.11]) — for PR speed you could add
#   scope_filter:
#     changed_since: "{{env.ALINT_BASE_REF | default('origin/master')}}"
# to the no_trailing_whitespace / spellcheck rules so only changed files
# are scanned. Omitted from the canonical config (full-tree on push) but
# documented here as the recommended PR-mode overlay.
#
# ══════════════════════════════════════════════════════════════════
# GENUINE NON-REPLACEABLES (stay in CI — out of alint's no-build scope)
# ══════════════════════════════════════════════════════════════════
#   - clippy LINT SEMANTICS: requires full type-checking compile. The
#     shell-out above runs it; alint cannot reimplement the lints.
#   - The matrix TEST/CHECK runs: test-tokio-full, test-workspace-*,
#     cross-test/cross-check, miri-{lib,test,doc}, asan, valgrind,
#     wasm32-{unknown,wasip1,wasip2}, sgx/redox/freebsd/illumos,
#     no-atomic-u64, test-hyper/test-quinn, check-external-types,
#     check-fuzzing — these COMPILE+EXECUTE code (and miri/asan/valgrind
#     are runtime instrumentation). Out of scope by design.
#   - feature-powerset (cargo hack --feature-powerset --depth 2) &
#     minimal-versions & --each-feature: combinatorial COMPILE matrices /
#     dependency-resolution probes — CI orchestration, not repo state.
#   - The --cfg tokio_unstable / docsrs / loom feature dispatch: CI knob
#     wiring, not a static file invariant.
#   - loom.yml R-loom-* PR-label gates & uring-kernel-version-test.yml
#     (downloads+builds a kernel): dynamic CI behaviour.
#   - cargo doc / cargo-semver-checks / cargo-spellcheck: shelled out
#     above (they build/parse), but the underlying analysis is the tool's.
#   - No DCO / sign-off in tokio → git_commit_signed_off N/A.
#
# ══════════════════════════════════════════════════════════════════
# NEW-RULE-KIND CANDIDATES (would close the remaining gaps)
# ══════════════════════════════════════════════════════════════════
#   1. line_count_header — assert a file's first line is an integer equal
#      to the count of the remaining lines (spellcheck.dic header). Today
#      only the "is an int" half is expressible. Generic to any
#      "N\n<N lines>" manifest format.
#   2. file_byte_equals — compare two complete files and report a useful diff
#      on mismatch, covering the README mirror without misusing pair_hash.
#   3. toml_member_set_equals — assert [workspace] members ⊇/== the
#      [patch.crates-io] keys (currently only the single tokio path key is
#      checked). A "two TOML arrays/key-sets must agree" primitive.
