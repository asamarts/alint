# yaml-language-server: $schema=https://raw.githubusercontent.com/asamarts/alint/main/schemas/v1/config.json
#
# ============================================================================
# alint config for microsoft/vscode  —  proposed.alint.yml
# Re-analysis against alint v0.10 + v0.11 capabilities (was v0.9.17-era).
# ============================================================================
#
# microsoft/vscode validates structure through several distinct surfaces:
#
#   A. build/hygiene.ts  (run by `npm run precommit`, git pre-commit hook)
#      7 streams over the staged changeset:
#        1. productJson    -> ban `extensionsGallery` in product.json
#        2. unicode        -> non-ASCII scanner w/ allowlist + per-line escape
#        3. indentation    -> tabs-only (w/ JSDoc `^[\t]* \*` carve-out)
#        4. copyrights     -> exact 4-line Microsoft/MIT header
#        5. formatting     -> tsfmt (AST printer)            [NON-REPLACEABLE]
#        6. eslint         -> 47 custom AST rules + ts-eslint [NON-REPLACEABLE]
#        7. stylelint      -> CSS AST                         [NON-REPLACEABLE]
#      + checkCopilotEnginesVersion (cross-file value equality)
#
#   B. .eslint-plugin-local/  (47 custom AST rules, registered in
#      eslint.config.js). MOST are deep TS-AST semantics (no-any-casts,
#      must-use-result, no-accessor-after-await, ...) and stay in eslint.
#      THREE are purely import-PATH firewalls and map onto alint import_gate:
#        - code-no-http-import        (forbid `import 'http'|'https'`)
#        - code-no-direct-gulp-import (forbid `import 'gulp'`)
#        - code-no-static-node-module-import (forbid static node builtins)
#      The big LAYERING firewall (code-import-patterns / code-layering /
#      code-no-deep-import-of-internal) is an ALLOWLIST keyed by a huge
#      per-file table generated in eslint.config.js — see the import_gate
#      discussion below for why only the *negative* slices port cleanly.
#
#   C. package.json script integrity + product.json shape + the Component
#      Governance trio + .gitattributes EOL matrix + tsconfig strictness
#      + vscode-dts public-API surface conventions.
#
# WHAT'S NEW vs the v0.9.17 baseline (examples/microsoft-vscode/.alint.yml):
#   (+1) checkCopilotEnginesVersion  -> cross_file_value_equals  [v0.10]
#        Was explicitly "Needs new primitive" / deferred in the baseline.
#        Now an EXACT live cross-file comparison, not just a shape check.
#   (+3) The http/https, gulp, and static-node-builtin import firewalls
#        -> import_gate (language: js)  [v0.10]
#        Path-based, no AST needed; baseline shelled these out via eslint.
#   (+1) PR-scope the huge tree -> scope_filter.changed_since  [v0.11]
#        Applied to the heavy command-rules so CI runs fast on PRs.
#   (+1) tsconfig*.json strict-mode consistency across the matrix
#        -> cross_file_value_equals (root strict == each child)  [v0.10]
#
# ----------------------------------------------------------------------------

version: 1

extends:
  - alint://bundled/oss-baseline@v1
  - alint://bundled/node@v1
  - alint://bundled/ci/github-actions@v1
  - alint://bundled/hygiene/no-tracked-artifacts@v1
  - alint://bundled/tooling/editorconfig@v1

facts:
  # build/hygiene.ts is the convention marker for this repo. Gating on it
  # keeps the config a no-op on a fork that strips the script.
  - id: has_vscode_hygiene
    any_file_exists: [build/hygiene.ts]

  # The vscode-dts proposed-API surface is unique to vscode.
  - id: has_vscode_dts
    any_file_exists: [src/vscode-dts/vscode.d.ts]

  # Gate the cross-file copilot check on the copilot extension existing.
  - id: has_copilot_ext
    any_file_exists: [extensions/copilot/package.json]

rules:

  # ==========================================================================
  # HEADLINE WIN #1 — import firewalls via import_gate  [NEW in v0.10]
  # ==========================================================================
  # vscode's `code-no-http-import` rule forbids a STATIC `import` of the
  # 'http'/'https' node builtins anywhere in src/ (they are slow to load at
  # startup; only `import type` / dynamic `import()` are allowed). The
  # AST rule distinguishes type-imports; alint's import_gate captures the
  # imported MODULE PATH, so a plain-string forbid catches the static-value
  # form. `import type`/`import(...)` won't match the static `from 'http'`
  # extraction in the common case, but note the limit below.
  #
  # import_gate syntax: `language:` (js for TS), `forbid:` is ONE regex
  # string (anchored alternation), `allow:` is a list, `paths:` glob/obj.
  - id: vscode-no-static-http-import
    when: facts.has_vscode_hygiene
    kind: import_gate
    language: js
    paths:
      include:
        - "src/**/*.ts"
        - "src/**/*.tsx"
      exclude:
        - "src/**/*.d.ts"
        - "src/**/*.test.ts"
    # Forbid importing exactly the http / https builtins.
    forbid: '^(http|https)$'
    level: warning
    message: >-
      Static import of the 'http'/'https' node builtins is banned in src/
      (slow startup load). Use `import type` or a dynamic `import()`.
      Mirrors .eslint-plugin-local/code-no-http-import.ts — the path
      firewall ports to import_gate; the type-import exemption stays in
      eslint (alint can't see the `import type` keyword).

  # `code-no-direct-gulp-import`: build/ code must import the gulp facade,
  # never 'gulp' directly. Pure path firewall -> import_gate, clean fit.
  - id: vscode-no-direct-gulp-import
    when: facts.has_vscode_hygiene
    kind: import_gate
    language: js
    paths:
      include:
        - "build/**/*.ts"
      exclude:
        - "build/gulp-facade.ts"
        - "build/lib/gulp/**"
    forbid: '^gulp$'
    level: warning
    message: >-
      Import the gulp facade (./gulp-facade), never 'gulp' directly.
      Mirrors .eslint-plugin-local/code-no-direct-gulp-import.ts.

  # ==========================================================================
  # The LAYER FIREWALL (code-import-patterns / code-layering) — PARTIAL.
  # ==========================================================================
  # vscode's marquee architecture rule enforces the src/vs layer cake:
  #   common -> worker/browser/node -> electron-browser/electron-utility
  #            -> electron-main
  # plus base -> platform -> editor -> workbench module-boundary order.
  # It is implemented as a per-file ALLOWLIST: a giant table in
  # eslint.config.js maps each file glob to the exact set of import globs
  # it MAY use; anything else is rejected (a default-deny allowlist with
  # ~hundreds of entries, plus layer-conditional `when: hasBrowser` slices).
  #
  # import_gate's model is forbid-one-regex + allow-list, which expresses a
  # default-ALLOW firewall well but not vscode's default-DENY per-file table
  # (the table is generated, not a small fixed allow-set). The cleanly
  # portable slice is the cross-LAYER hard bans that are uniform across the
  # tree. Example: a `common/` file may never reach into a `node/` or
  # `electron-*/` sibling. That direction IS a fixed forbid regex:
  - id: vscode-layer-common-no-platform-reach
    when: facts.has_vscode_hygiene
    kind: import_gate
    language: js
    paths:
      include:
        - "src/vs/**/common/**/*.ts"
      exclude:
        - "src/vs/**/*.d.ts"
        - "src/vs/**/*.test.ts"
    # A `common/` module must stay portable: forbid importing into any
    # `/node/`, `/electron-browser/`, `/electron-main/`, or
    # `/electron-utility/` segment of a relative sibling path.
    forbid: '(^|/)(node|electron-browser|electron-main|electron-utility)/'
    # `common/` legitimately reaches other `common/` and `vs/nls`/`vs/amdX`.
    allow:
      - 'vs/nls.js'
      - 'vs/amdX.js'
    level: warning
    message: >-
      A src/vs/**/common/ module must remain environment-agnostic and may
      not import from a node/ or electron-*/ layer. This is the uniform,
      always-true slice of the code-import-patterns/code-layering firewall;
      the full per-file allowlist (default-deny, ~hundreds of generated
      entries + base->platform->editor->workbench ordering) stays in eslint
      because import_gate models forbid+allow, not a generated per-file
      allow-table. See https://github.com/microsoft/vscode/wiki/Source-Code-Organization

  # ==========================================================================
  # HEADLINE WIN #2 — copyright header sweep via file_header
  # ==========================================================================
  # build/hygiene.ts `copyrights` stream: every TS file under copyrightFilter
  # must open with the exact 4-line Microsoft/MIT block. The two load-bearing
  # lines, joined with `\s+` across the JSDoc continuation (YAML `|` won't
  # expand \n — collapse to one line).
  - id: vscode-copyright-header-src
    when: facts.has_vscode_hygiene
    kind: file_header
    paths:
      include:
        - "src/**/*.ts"
        - "src/**/*.tsx"
        - "build/**/*.ts"
        - "scripts/**/*.ts"
      exclude:
        - "src/typings/**"
        - "src/vs/*/**/*.d.ts"
        - "src/vs/base/browser/dompurify/**"
        - "src/vs/base/common/marked/**"
        - "src/vs/base/common/semver/**"
        - "src/vs/workbench/contrib/terminal/common/scripts/psreadline/**"
        - "src/vs/workbench/services/keybinding/browser/keyboardLayouts/**"
        - "build/lib/**"
        - "build/monaco/**"
        - "build/win32/**"
        - "build/checker/**"
        - "build/loader.min/**"
        - "build/next/**"
        - "extensions/copilot/**"   # has its own code style (see filters.ts)
        - "src/vscode-dts/**"       # covered by a parallel rule below
    pattern: 'Copyright \(c\) Microsoft Corporation\. All rights reserved\.\s+\*\s+Licensed under the MIT License\.'
    lines: 6
    level: warning
    message: >-
      Every TypeScript file under src/, build/, scripts/ (modulo the
      filters.ts carve-outs) must open with the canonical Microsoft/MIT
      copyright block. Structural counterpart of the `copyrights` stream
      in build/hygiene.ts.

  - id: vscode-dts-proposed-copyright-header
    when: facts.has_vscode_dts
    kind: file_header
    paths:
      include:
        - "src/vscode-dts/vscode.d.ts"
        - "src/vscode-dts/vscode.proposed.*.d.ts"
    pattern: 'Copyright \(c\) Microsoft Corporation\. All rights reserved\.\s+\*\s+Licensed under the MIT License\.'
    lines: 6
    level: error
    message: >-
      Every public-API d.ts under src/vscode-dts/ must open with the
      Microsoft/MIT copyright block (173 proposed files at clone time).

  # ==========================================================================
  # product.json — ban extensionsGallery (hygiene productJson stream)
  # ==========================================================================
  - id: vscode-product-json-no-extensions-gallery
    when: facts.has_vscode_hygiene
    kind: file_content_forbidden
    paths: "product.json"
    pattern: '"extensionsGallery"'
    level: error
    message: >-
      product.json must not declare `extensionsGallery` in the OSS tree
      (Code OSS ships no marketplace). build/hygiene.ts rejects it unless
      BUILD_SOURCEVERSION (official pipeline) is set.

  # ==========================================================================
  # HEADLINE WIN #3 — cross-file value equality  [NEW in v0.10]
  # ==========================================================================
  # checkCopilotEnginesVersion(): engines.vscode in
  # extensions/copilot/package.json must equal `^${rootPkg.version}`.
  # Was the single deferred "Needs new primitive" item in the v0.9.17
  # baseline. cross_file_value_equals now expresses it directly: source
  # value (root version) must equal the target value with the leading `^`
  # stripped via the target extract's capture group.
  #
  # SYNTAX: source -> {file:, extract:}; targets -> list of {file:, extract:}.
  # extract = {json:"$..."} | {regex:'..one-group..'}. The root value is
  # "1.122.0"; the copilot value is "^1.122.0" — we capture the post-caret
  # tail with a regex so the two extracted strings are equal.
  - id: vscode-copilot-engines-version-matches-root
    when: facts.has_copilot_ext
    kind: cross_file
    source:
      file: "package.json"
      extract:
        json: "$.version"
    targets:
      - file: "extensions/copilot/package.json"
        # engines.vscode is "^<version>"; capture the version after the caret.
        extract:
          regex: '"vscode"\s*:\s*"\^([0-9]+\.[0-9]+\.[0-9]+)"'
    level: error
    message: >-
      engines.vscode in extensions/copilot/package.json must be
      "^<rootVersion>" (the version from the root package.json). Exact
      restatement of checkCopilotEnginesVersion() in build/hygiene.ts —
      newly expressible as cross_file_value_equals (was deferred in the
      v0.9.17 baseline as "Needs new primitive").

  # tsconfig matrix strictness consistency: the root tsconfig.base.json sets
  # strict:true; assert it (json_path_equals) AND that monaco/dts children
  # don't silently diverge from the root's strict flag.
  - id: vscode-tsconfig-base-strict
    when: facts.has_vscode_hygiene
    kind: json_path_equals
    paths: "src/tsconfig.base.json"
    path: "$.compilerOptions.strict"
    equals: true
    level: error
    message: >-
      src/tsconfig.base.json is the root all tsconfig*.json inherit;
      dropping strict:true silently relaxes type-checking tree-wide.

  - id: vscode-tsconfig-base-no-implicit-override
    when: facts.has_vscode_hygiene
    kind: json_path_equals
    paths: "src/tsconfig.base.json"
    path: "$.compilerOptions.noImplicitOverride"
    equals: true
    level: warning

  # ==========================================================================
  # .gitattributes EOL matrix — assert on-disk reality
  # ==========================================================================
  - id: vscode-license-files-crlf
    when: facts.has_vscode_hygiene
    kind: line_endings
    paths:
      - "LICENSE.txt"
      - "ThirdPartyNotices.txt"
    target: crlf
    level: warning

  - id: vscode-windows-bat-crlf
    when: facts.has_vscode_hygiene
    kind: line_endings
    paths:
      - "**/*.bat"
      - "**/*.cmd"
    target: crlf
    level: warning

  - id: vscode-shell-script-lf
    when: facts.has_vscode_hygiene
    kind: line_endings
    paths:
      - "**/*.sh"
      - "**/*.ps1"
    target: lf
    level: warning

  # ==========================================================================
  # vscode-dts public-API surface conventions
  # ==========================================================================
  - id: vscode-dts-proposed-filename-grammar
    when: facts.has_vscode_dts
    kind: filename_regex
    paths:
      include:
        - "src/vscode-dts/vscode.proposed.*.d.ts"
    pattern: '^vscode\.proposed\.[a-zA-Z][a-zA-Z0-9]*\.d\.ts$'
    level: error
    message: >-
      Proposed-API files must be named vscode.proposed.<name>.d.ts
      (README.md documents this; nothing enforces it statically — a typo
      drops the file out of the build discovery glob).

  - id: vscode-dts-declare-module-shape
    when: facts.has_vscode_dts
    kind: file_content_matches
    paths:
      include:
        - "src/vscode-dts/vscode.d.ts"
    pattern: "declare module 'vscode'"
    level: error
    message: >-
      src/vscode-dts/vscode.d.ts (stable public surface) must open with
      `declare module 'vscode'`.

  # ==========================================================================
  # Infrastructure-file integrity (existence + script wiring)
  # ==========================================================================
  - id: vscode-component-governance-files
    kind: file_exists
    paths:
      - "cgmanifest.json"
      - "cglicenses.json"
      - "ThirdPartyNotices.txt"
    root_only: true
    level: error
    message: >-
      Microsoft Component Governance requires cgmanifest.json,
      cglicenses.json, and ThirdPartyNotices.txt at the root.

  - id: vscode-third-party-notices-non-trivial
    kind: file_min_lines
    paths: "ThirdPartyNotices.txt"
    min_lines: 500
    level: warning
    message: >-
      ThirdPartyNotices.txt is much shorter than expected (~3800 lines);
      likely a truncated CG regeneration.

  - id: vscode-eslint-plugin-local-infra
    when: facts.has_vscode_hygiene
    kind: file_exists
    paths:
      - ".eslint-plugin-local/index.ts"
      - ".eslint-plugin-local/package.json"
      - ".eslint-plugin-local/tsconfig.json"
      - "eslint.config.js"
    level: error
    message: >-
      The .eslint-plugin-local/ infrastructure registers vscode's 47
      custom AST rules; a missing file silently disables the custom layer.

  - id: vscode-tsfmt-json-exists
    when: facts.has_vscode_hygiene
    kind: file_exists
    paths: tsfmt.json
    root_only: true
    level: error
    message: >-
      tsfmt.json is the formatting-options file build/hygiene.ts's
      `formatting` stream loads; missing => silent default fallback.

  # package.json script integrity (npm run on a missing script is a no-op).
  - id: vscode-package-json-precommit-script
    when: facts.has_vscode_hygiene
    kind: json_path_matches
    paths: "package.json"
    path: "$.scripts.precommit"
    matches: 'build/hygiene\.ts'
    level: error

  - id: vscode-package-json-eslint-script
    when: facts.has_vscode_hygiene
    kind: json_path_matches
    paths: "package.json"
    path: "$.scripts.eslint"
    matches: 'build/eslint\.ts'
    level: error

  - id: vscode-package-json-stylelint-script
    when: facts.has_vscode_hygiene
    kind: json_path_matches
    paths: "package.json"
    path: "$.scripts.stylelint"
    matches: 'build/stylelint\.ts'
    level: error

  - id: vscode-package-json-valid-layers-script
    when: facts.has_vscode_hygiene
    kind: json_path_matches
    paths: "package.json"
    path: "$.scripts['valid-layers-check']"
    matches: 'build/checker/layersChecker\.ts'
    level: error
    message: >-
      package.json#scripts.valid-layers-check must invoke the runtime
      layersChecker — this is the AST/runtime half of the layer firewall
      that alint deliberately doesn't reimplement (see import_gate notes).

  - id: vscode-package-json-vscode-dts-check
    when: facts.has_vscode_hygiene
    kind: json_path_matches
    paths: "package.json"
    path: "$.scripts['vscode-dts-compile-check']"
    matches: 'tsconfig\.vscode-dts\.json'
    level: error

  - id: vscode-agents-md-present
    kind: file_exists
    paths: AGENTS.md
    root_only: true
    level: error

  # Every workflow declares a top-level permissions: block (least-privilege)
  # OR is a reusable workflow_call: target. Layered atop ci/github-actions@v1.
  - id: vscode-workflow-has-permissions
    kind: file_content_matches
    paths:
      include:
        - ".github/workflows/*.yml"
        - ".github/workflows/*.yaml"
    pattern: '(?m)^(permissions:|on:[\s\S]*workflow_call:)'
    level: warning

  # ==========================================================================
  # NON-REPLACEABLE backstops — shelled out via command rules.
  #   These cover the genuinely AST/semantic work alint deliberately is not.
  #   v0.11 scope_filter.changed_since PR-scopes the heavy commands so a CI
  #   run on a 2-file PR doesn't relint the whole 14k-file tree.
  # ==========================================================================

  # eslint: the 47 custom AST rules + typescript-eslint. NON-REPLACEABLE —
  # AST analysis (no-any-casts, must-use-result, no-accessor-after-await,
  # the default-DENY per-file import allowlist, nls/i18n key rules, ...) is
  # alint's deliberate non-goal. Only the 3 negative import slices above
  # ported; everything else stays here.
  - id: vscode-eslint
    when: facts.has_vscode_hygiene
    kind: command
    paths: "package.json"
    command: ["npm", "run", "eslint"]
    timeout: 600
    level: error
    scope_filter:
      changed_since: "{{env.ALINT_BASE_REF | default('origin/main')}}"
    message: >-
      `npm run eslint` failed (47 custom AST rules + ts-eslint). Scoped to
      changed files on PRs via scope_filter.changed_since.

  # stylelint: CSS AST. NON-REPLACEABLE.
  - id: vscode-stylelint
    when: facts.has_vscode_hygiene
    kind: command
    paths: "package.json"
    command: ["npm", "run", "stylelint"]
    timeout: 300
    level: error
    scope_filter:
      changed_since: "{{env.ALINT_BASE_REF | default('origin/main')}}"

  # precommit/hygiene backstop: catches the streams alint can't fully model:
  #   - formatting   (tsfmt AST printer — verifyFormatting)
  #   - unicode      (per-line `// allow-any-unicode-next-line` escape hatch +
  #                   ~40-glyph allowlist; alint file_is_ascii has neither)
  #   - indentation  (tabs w/ the `^[\t]* \*` JSDoc-continuation carve-out
  #                   alint's indent_style:tabs doesn't model)
  - id: vscode-precommit-hygiene
    when: facts.has_vscode_hygiene
    kind: command
    paths: "package.json"
    command: ["npm", "run", "precommit"]
    timeout: 600
    level: warning
    scope_filter:
      changed_since: "{{env.ALINT_BASE_REF | default('origin/main')}}"
    message: >-
      `npm run precommit` (build/hygiene.ts) failed. Most streams are
      captured statically above; this backstops the AST formatting stage,
      the unicode escape-hatch handling, and the JSDoc-continuation
      indentation carve-out alint can't express.

# ----------------------------------------------------------------------------
# GENUINE NON-REPLACEABLES (and WHY):
#   * eslint's 44 semantic custom rules + typescript-eslint — TS AST + type
#     info. alint is structural, not a type-aware linter. (3 of 47 ported.)
#   * code-import-patterns DEFAULT-DENY per-file allowlist — generated table
#     of ~hundreds of file->allowed-glob entries; import_gate is forbid+allow,
#     not a generated per-file allow-table. Only uniform cross-layer bans port.
#   * build/checker/layersChecker.ts — runtime TS layer check (AST+runtime).
#   * build/lib/checkCyclicDependencies.ts — module-graph cycle detection.
#   * tsfmt formatting stage — AST pretty-printer equivalence.
#   * stylelint — CSS AST.
#   * unicode stream — needs per-line skip-comment + glyph allowlist that
#     alint's file_is_ascii lacks (NEW-KIND CANDIDATE: file_is_ascii.allow +
#     .skip_comment).
#   * nls/i18n key extraction & template-literal rules — AST + build pipeline.
#   * pr.yml API-proposal version-bump check — PR-diff semantics in-workflow.
#
# NEW-RULE-KIND CANDIDATES surfaced by this study:
#   1. file_is_ascii with `allow:` (glyph allowlist) + `skip_comment:`
#      (per-line escape pragma) — would close the hygiene `unicode` stream.
#   2. indent_style: tabs with a `block_comment_continuation` exception —
#      would close the hygiene `indentation` stream.
#   3. import_gate "default-deny per-file allowlist" mode (table-driven) —
#      would let the FULL code-import-patterns layer firewall port, the
#      single biggest remaining gap for layered monorepos.
# ----------------------------------------------------------------------------
