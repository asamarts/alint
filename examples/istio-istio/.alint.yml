# yaml-language-server: $schema=https://raw.githubusercontent.com/asamarts/alint/main/schemas/v1/config.json
#
# Proposed alint config for istio/istio — re-authored against alint
# v0.10/v0.11 capabilities (the original example targeted v0.9.17).
#
# istio is a CNCF Apache-2.0 service mesh: single-module Go monorepo
# (one root go.mod), Helm-chart packaging (9 Chart.yaml under
# manifests/charts/), 29 Dockerfiles, ~1,700 release-note YAMLs. CI
# runs in Prow (out-of-tree) so .github/workflows/ is empty and the
# ci/github-actions@v1 bundle no-ops. DCO sign-off is required (CNCF).
#
# WHAT'S NEW vs the v0.9.17 baseline (the four "needs vX" gaps it
# listed are now CLOSED):
#   - depguard import firewall (16+ denied pkgs)  -> import_gate (go)
#   - DenyOperatorAndIstioctl directory boundary  -> import_gate
#   - make gen-check codegen freshness            -> command_idempotent
#   - cross-chart hub/tag pin equality            -> cross_file_value_equals
#   - go.mod tidy / copyright / gofmt collapse to  command_idempotent
#     with files_from: stdout + scope_filter.changed_since for PR-only
#   - DCO sign-off                                -> git_commit_signed_off
#
# Save as .alint.yml at the repo root and run `alint check`.

version: 1

extends:
  - alint://bundled/oss-baseline@v1
  - alint://bundled/go@v1
  - alint://bundled/ci/github-actions@v1            # no-op: istio uses Prow
  - alint://bundled/hygiene/no-tracked-artifacts@v1
  # NOTE: compliance/apache-2@v1 is intentionally NOT extended here.
  # istio carries Apache-2.0-licensed code with the Istio Authors
  # banner, BUT the bundle's RAT-style source-header check (the
  # apache-2 v0.9.18-broadened pattern) and LICENSE/NOTICE invariants
  # OVER-FIRE on istio: (a) ~1,700 generated *.gen.go / *.pb.go and
  # *_pb2.py files legitimately carry NO header (istio's own
  # lint_copyright_banner.sh excludes them); (b) some files carry the
  # "The Kubernetes Authors" header instead of "Istio Authors"; (c)
  # istio has no top-level NOTICE file (its attribution lives under
  # licenses/ via license-lint --mirror). The bespoke
  # istio-*-license-header rules below encode istio's ACTUAL tolerance
  # set, so the apache-2 bundle would add only false positives.

rules:
  # ════════════════════════════════════════════════════════════════
  # DCO sign-off  (v0.11 git_commit_signed_off) — istio is CNCF and
  # requires a `Signed-off-by:` trailer on every commit. This is the
  # PRIME new fit: previously un-encodable, now one rule. Scope to the
  # PR range so it doesn't re-flag historical commits.
  # ════════════════════════════════════════════════════════════════
  - id: istio-dco-signoff
    kind: git_commit_signed_off
    since: "origin/master"
    level: error
    message: >-
      Every commit must carry a `Signed-off-by:` trailer (DCO).
      Re-commit with `git commit -s` or `git rebase --signoff`.

  - id: istio-no-fixup-commits
    kind: git_commit_no_fixup
    since: "origin/master"
    level: error
    message: >-
      Squash `fixup!`/`squash!` commits before merge (`git rebase -i
      --autosquash`).

  # ════════════════════════════════════════════════════════════════
  # make gen-check :: codegen freshness  — THE headline win.
  #
  # `make gen` (Makefile.core.mk:314) MUTATES the tree: go generate,
  # mirror-licenses, gofmt, update-crds, proto, copy-templates,
  # gen-addons, update-golden. `gen-check` then runs
  # check_clean_repo.sh which fails on any `git status --porcelain`.
  #
  # Because `make gen` MUTATES files, this is NOT generated_file_fresh
  # (that kind runs a generator and diffs STDOUT — non-mutating only).
  # It is command_idempotent: run the project's own check in its
  # native --check shape and treat a dirty tree as the violation. We
  # invoke `make gen-check` directly; the istio script already does
  # the git-status diff and exits non-zero. (Won't run during alint
  # config validation; declared only.)
  # ════════════════════════════════════════════════════════════════
  - id: istio-gen-check-clean
    kind: command_idempotent
    paths: "Makefile.core.mk"
    command: ["make", "gen-check"]
    timeout: 1800
    level: error
    message: >-
      Generated files are stale. Run `make gen` and commit the diff
      (protobuf, CRDs, golden files, chart templates, mirrored
      licenses). This replaces the bespoke check_clean_repo.sh gate.

  # ════════════════════════════════════════════════════════════════
  # depguard import firewall  (v0.10 import_gate, preset `go`) —
  # .golangci.yml depguard.AllGoFiles + DenyGogoProtobuf +
  # DenyProtobufV1. Forbid the deprecated/banned packages outright.
  # The `go` preset extracts the import path from Go import blocks; we
  # match `forbid:` against the captured path. (golangci still runs
  # the SEMANTIC linters; this rule lifts the pure path-blocklist out
  # so it fires per-file with a precise message.)
  # ════════════════════════════════════════════════════════════════
  - id: istio-import-firewall
    kind: import_gate
    language: go
    paths:
      include: ["**/*.go"]
      exclude:
        - "**/*.gen.go"
        - "**/*.pb.go"
        - "**/testdata/**"
        - "vendor/**"
        - "common/**"
    forbid: '^(github\.com/gogo/protobuf|golang\.org/x/net/http2/h2c|github\.com/golang/protobuf/jsonpb|github\.com/golang/protobuf/ptypes|google\.golang\.org/protobuf/encoding/protojson|gomodules\.xyz/jsonpatch/v3|k8s\.io/apimachinery/pkg/util/sets|k8s\.io/utils/set|k8s\.io/utils/env|k8s\.io/utils/strings/slices|k8s\.io/utils/pointer|go\.opencensus\.io|golang\.org/x/exp/maps|golang\.org/x/exp/slices|gopkg\.in/yaml\.v2|gopkg\.in/yaml\.v3|github\.com/ghodss/yaml)(/.*)?$'
    level: error
    message: >-
      Forbidden import (see .golangci.yml depguard). Use the
      istio.io/istio/pkg/* equivalent: sets->pkg/util/sets,
      slices->pkg/slices, maps->pkg/maps, ptr->pkg/ptr,
      env->pkg/env, yaml->sigs.k8s.io/yaml, protojson/jsonpb->
      util/protomarshal.

  # depguard.DenyOperatorAndIstioctl — operator/ and istioctl/ may not
  # be imported except by a small allowlist of trees. import_gate's
  # forbid+allow combo encodes the directory boundary: forbid the two
  # internal packages everywhere EXCEPT the allowlisted paths
  # (excluded from `paths` since they may import themselves).
  - id: istio-deny-operator-istioctl-import
    kind: import_gate
    language: go
    paths:
      include: ["**/*.go"]
      exclude:
        - "**/*_test.go"            # !$test in golangci
        - "operator/**"
        - "istioctl/**"
        - "tools/bug-report/**"
        - "pkg/kube/**"
        - "pkg/url/**"
        - "pkg/test/framework/**"
        - "tests/fuzz/**"
        - "**/*.gen.go"
        - "**/*.pb.go"
        - "vendor/**"
    forbid: '^(istio\.io/istio/operator|istio\.io/istio/istioctl)(/.*)?$'
    level: error
    message: >-
      operator/ and istioctl/ are leaf packages and must not be
      imported from core code (see .golangci.yml
      depguard.DenyOperatorAndIstioctl).

  # ════════════════════════════════════════════════════════════════
  # Copyright banner  (lint_copyright_banner.sh) — collapsed onto
  # command_idempotent with files_from: stdout. The istio script
  # prints `Missing license: <path>` / `Missing copyright: <path>`
  # for each offender; files_pattern parses those into per-file
  # violations. scope_filter.changed_since fires only on PR-touched
  # files (v0.11) — the script itself walks the whole tree, but PR CI
  # only cares about new drift.
  #
  # (The v0.9.17 baseline used two static file_header regex rules;
  # delegating to the project's own script is exact — no regex-shape
  # drift, and `make fix-copyright-banner` stays the canonical fix.)
  # ════════════════════════════════════════════════════════════════
  - id: istio-copyright-banner
    kind: command_idempotent
    paths:
      include:
        - "**/*.go"
        - "**/*.cc"
        - "**/*.h"
        - "**/*.proto"
        - "**/*.py"
        - "**/*.sh"
        - "**/*.rs"
      exclude:
        - "**/*.gen.go"
        - "**/*.pb.go"
        - "**/*_pb2.py"
        - "vendor/**"
        - "common/**"
    scope_filter:
      changed_since: "origin/master"
    command: ["common/scripts/lint_copyright_banner.sh", "{path}"]
    files_from: stdout
    files_pattern: '^Missing (?:license|copyright): (?P<file>.+)$'
    level: error
    message: >-
      Missing Apache-2.0 header / Copyright line. Run
      `make fix-copyright-banner`.

  # ════════════════════════════════════════════════════════════════
  # gofmt / goimports / gofumpt / gci  (format-go ->
  # common/scripts/format_go.sh; .golangci.yml formatters). gofmt -l
  # prints unformatted paths to stdout. command_idempotent +
  # files_from: stdout parses them into per-file violations. PR-scoped.
  # ════════════════════════════════════════════════════════════════
  - id: istio-gofmt-clean
    kind: command_idempotent
    paths:
      include: ["**/*.go"]
      exclude:
        - "**/*.gen.go"
        - "**/*.pb.go"
        - "**/testdata/**"
        - "vendor/**"
        - "common/**"
    scope_filter:
      changed_since: "origin/master"
    command: ["gofmt", "-l", "{path}"]
    files_from: stdout
    files_pattern: '^(?P<file>.+\.go)$'
    level: error
    message: "File is not gofmt-clean. Run `make format`."

  # ════════════════════════════════════════════════════════════════
  # go mod tidy  (tidy-go) — single root go.mod. `go mod tidy -diff`
  # is the native --check form: non-empty diff = violation.
  # ════════════════════════════════════════════════════════════════
  - id: istio-go-mod-tidy
    kind: command_idempotent
    paths: "go.mod"
    command: ["go", "mod", "tidy", "-diff"]
    timeout: 120
    level: error
    message: "go.mod/go.sum out of sync. Run `make tidy`."

  # ════════════════════════════════════════════════════════════════
  # golangci-lint semantic pass  (lint-go) — NOT replaceable. The
  # depguard path-blocklist moved to import_gate above, but errcheck /
  # gocritic / gosec / govet / revive / staticcheck / unparam / unused
  # are Go-AST type-aware analyses outside alint's scope. Keep as a
  # plain command shellout (one root module).
  # ════════════════════════════════════════════════════════════════
  - id: istio-golangci-lint
    kind: command
    paths: "go.mod"
    command: ["golangci-lint", "run", "-c", "./common/config/.golangci.yml"]
    timeout: 600
    level: error

  # ════════════════════════════════════════════════════════════════
  # External shellout linters — kept verbatim (each wraps a tool with
  # semantics alint doesn't model). FINDFILES in the Makefile prunes
  # common-protos/.git/out/.github/licenses/vendor — mirrored below.
  # ════════════════════════════════════════════════════════════════
  - id: istio-hadolint
    kind: command
    paths:
      include: ["**/Dockerfile", "**/Dockerfile.*"]
      exclude: ["common/**", "out/**"]
    command: ["hadolint", "-c", "./common/config/.hadolint.yml", "{path}"]
    timeout: 30
    level: error

  - id: istio-shellcheck
    kind: command
    paths:
      include: ["**/*.sh"]
      exclude: ["common/**", "vendor/**", "out/**"]
    command: ["shellcheck", "{path}"]
    timeout: 30
    level: error

  - id: istio-yamllint
    kind: command
    paths:
      include: ["**/*.yaml", "**/*.yml"]
      exclude:
        - "manifests/charts/**/templates/**"   # contain Helm {{ }}
        - "manifests/charts/**/files/profile-*.yaml"
        - "manifests/addons/**"
        - "common/**"
        - "vendor/**"
        - "**/*.gen.yaml"
        - "samples/**"
    command: ["yamllint", "-c", "./common/config/.yamllint.yml", "{path}"]
    timeout: 30
    level: warning

  - id: istio-license-lint
    kind: command
    paths: "common/config/license-lint.yml"
    command: ["license-lint", "--config", "./common/config/license-lint.yml"]
    timeout: 120
    level: warning

  # helm lint per chart (lint-helm-global; non-strict, as istio runs it)
  - id: istio-helm-lint
    kind: for_each_dir
    select: "manifests/charts/**/Chart.yaml"
    require:
      - kind: command
        paths: "{dir}"
        command: ["helm", "lint", "{dir}"]
        timeout: 60
    level: error

  # ════════════════════════════════════════════════════════════════
  # Cross-chart image-pin equality  (v0.10 cross_file_value_equals) —
  # replaces the v0.9.17 baseline's 5 hard-coded file_content_matches
  # rules. Every chart's dev-build `hub:` MUST resolve to the same
  # literal across charts. cross_file_value_equals reads the value at
  # `source.path` and asserts every `targets` file matches it.
  # (The path differs per chart — some nest under .global — so we pin
  # against istio-discovery as the source of truth and compare peers.)
  # ════════════════════════════════════════════════════════════════
  - id: istio-chart-hub-consistent
    kind: cross_file_value_equals
    source:
      file: "manifests/charts/istio-control/istio-discovery/values.yaml"
      extract: { yaml: "$._internal_defaults_do_not_set.global.hub" }
    targets:
      - file: "manifests/charts/ztunnel/values.yaml"
        extract: { yaml: "$._internal_defaults_do_not_set.hub" }
      - file: "manifests/charts/istio-cni/values.yaml"
        extract: { yaml: "$._internal_defaults_do_not_set.global.hub" }
      - file: "manifests/charts/gateways/istio-ingress/values.yaml"
        extract: { yaml: "$._internal_defaults_do_not_set.global.hub" }
    level: warning
    message: >-
      Every chart's dev-build `global.hub` must match
      istio-discovery's (registry.istio.io/testing). A divergent pin
      ships a personal/stale registry.

  # ════════════════════════════════════════════════════════════════
  # Per-chart structural invariants (yaml_path_equals; carried from
  # the v0.9.17 baseline — still the right kind). release-builder
  # substitutes 1.0.0 at build time.
  # ════════════════════════════════════════════════════════════════
  - id: istio-chart-version-templated
    kind: yaml_path_equals
    paths: "manifests/charts/**/Chart.yaml"
    path: "$.version"
    equals: "1.0.0"
    level: error
    message: 'Chart.yaml version: must stay "1.0.0" (release-builder substitutes it).'

  - id: istio-chart-appversion-templated
    kind: yaml_path_equals
    paths: "manifests/charts/**/Chart.yaml"
    path: "$.appVersion"
    equals: "1.0.0"
    level: error
    message: 'Chart.yaml appVersion: must stay "1.0.0".'

  - id: istio-chart-apiversion-v2
    kind: yaml_path_equals
    paths: "manifests/charts/**/Chart.yaml"
    path: "$.apiVersion"
    equals: "v2"
    level: error
    message: 'Chart.yaml apiVersion must be "v2" (Helm 3+).'

  - id: istio-chart-internal-defaults-wrapper
    kind: file_content_matches
    paths:
      include:
        - "manifests/charts/*/values.yaml"
        - "manifests/charts/*/*/values.yaml"
      exclude:
        - "manifests/charts/base/values.yaml"
        - "manifests/charts/default/values.yaml"
        - "manifests/charts/gateway/values.yaml"
    pattern: '(?m)^_internal_defaults_do_not_set:'
    level: error
    message: >-
      values.yaml must wrap defaults under
      `_internal_defaults_do_not_set:` (Helm-3 --set ergonomics).

  - id: istio-base-crds-present
    kind: file_exists
    paths: "manifests/charts/base/files/crd-all.gen.yaml"
    level: error
    message: "base chart requires crd-all.gen.yaml (run `make gen`)."

  # ════════════════════════════════════════════════════════════════
  # istio.deps cross-repo SHA pins (json_path_matches — carried over).
  # ════════════════════════════════════════════════════════════════
  - id: istio-deps-has-proxy-sha
    kind: json_path_matches
    paths: "istio.deps"
    path: "$[0].lastStableSHA"
    matches: '^[a-f0-9]{40}$|^v\d+\.\d+\.\d+$'
    level: error
    message: "istio.deps[0] (PROXY) needs a 40-char SHA or semver in lastStableSHA."

  - id: istio-deps-has-ztunnel-sha
    kind: json_path_matches
    paths: "istio.deps"
    path: "$[1].lastStableSHA"
    matches: '^[a-f0-9]{40}$|^v\d+\.\d+\.\d+$'
    level: error
    message: "istio.deps[1] (ZTUNNEL) needs a 40-char SHA or semver in lastStableSHA."

  # ════════════════════════════════════════════════════════════════
  # Release-notes schema (yaml_path_*). NOTE vs the v0.9.17 baseline:
  # its `kind` enum was '^(bug-fix|security-fix|feature|test|
  # promotion)$' — but real notes also use `bug` and `enhancement`
  # (and trailing-space variants). Widened here so the rule doesn't
  # false-positive on the ~1,700 existing notes; tighten once they're
  # normalized. apiVersion is the safe hard pin.
  # ════════════════════════════════════════════════════════════════
  - id: istio-releasenotes-apiversion
    kind: yaml_path_equals
    paths:
      include: ["releasenotes/notes/*.yaml"]
      exclude: ["releasenotes/notes/50328.yaml"]
    path: "$.apiVersion"
    equals: "release-notes/v2"
    level: error
    message: "releasenotes/notes/<id>.yaml must declare apiVersion: release-notes/v2."

  - id: istio-releasenotes-kind
    kind: yaml_path_matches
    paths: "releasenotes/notes/*.yaml"
    path: "$.kind"
    matches: '^(bug-fix|bug|security-fix|feature|enhancement|test|promotion)\s*$'
    if_present: true
    level: warning
    message: "release-note kind must be one of the documented values."

  # ════════════════════════════════════════════════════════════════
  # Top-level repo invariants (file_exists / file_content_matches).
  # ════════════════════════════════════════════════════════════════
  - id: istio-version-file-shape
    kind: file_content_matches
    paths: "VERSION"
    pattern: '^\d+\.\d+(\.\d+)?(-\w+)?\s*$'
    level: error
    message: "VERSION must be a single semver line (e.g. 1.31 or 1.31.0-dev)."

  - id: istio-istiodeps-file-exists
    kind: file_exists
    paths: "istio.deps"
    root_only: true
    level: error
    message: "istio.deps (cross-repo SHA pins) is required for release builds."

  - id: istio-codeowners-has-fallback
    kind: file_content_matches
    paths: "CODEOWNERS"
    pattern: '(?m)^\*\s+@\S+'
    level: warning
    message: "CODEOWNERS must declare a `* @owner` fallback on the first entry."

  # Vendored common-files do-not-edit marker (informational).
  - id: istio-common-files-marker
    kind: file_content_matches
    paths:
      include: ["common/**/*.mk", "common/**/*.sh", "common/**/*.yml"]
      exclude: ["common/.commonfiles.sha"]
    pattern: 'DO NOT EDIT.*PROBABLY A COPY'
    level: info
    message: >-
      common/ is vendored from istio/common-files (`make
      update-common`). Edit upstream, not here.

# ══════════════════════════════════════════════════════════════════
# GENUINE NON-REPLACEABLES (stay on `make lint` / Prow):
#   - golangci-lint SEMANTIC linters (errcheck/gocritic/gosec/govet/
#     revive/staticcheck/unparam/unused) — Go-AST, type-aware.
#   - testlinter / envvarlinter (istio custom Go-AST tools invoked by
#     `make lint`) — bespoke source analyzers, out of alint's scope.
#   - bin/check_samples.sh (`istioctl validate -x` on samples) —
#     Kubernetes-object-aware admission validation.
#   - lint-python (autopep8 -d), lint-markdown (mdl), lint-sass,
#     lint-typescript — wrapped as `command` if desired, semantics
#     belong to those tools (not modelled here to avoid noise).
#   - kube/envoy integration & golden-file tests (refresh-goldens) —
#     runtime behavior, not static lint.
#
# NEW-RULE-KIND CANDIDATES surfaced by istio:
#   - A "make-target health" kind: assert a named Makefile target
#     exists + has a `## help` comment (istio leans on `target: ##`).
#   - `command_idempotent` `files_from: stdout` works, but a built-in
#     "git-status-after-generator" sugar (wrapping check_clean_repo's
#     porcelain diff) would make the gen-check pattern one-liner.
#   - ordered_block had NO natural target here (istio uses no
#     keep-sorted regions) — confirms it's not universal.
# ══════════════════════════════════════════════════════════════════
