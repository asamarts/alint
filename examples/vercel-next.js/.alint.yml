# yaml-language-server: $schema=https://raw.githubusercontent.com/asamarts/alint/main/schemas/v1/config.json
# ============================================================================
# alint config for vercel/next.js  — re-analysis @ shallow HEAD, 2026-05-25
# Targets alint v0.10 + v0.11 (was authored for v0.9.17).
#
# next.js is a hybrid monorepo:
#   - pnpm workspace: apps/*, packages/*, bench/*, crates/*/js,
#     turbopack/crates/*/js, turbopack/packages/* (19 npm packages)
#   - Cargo workspace: crates/* + turbopack/crates/* (literal per-crate
#     edition/license — NO [workspace.package] inheritance; the root
#     Cargo.toml only carries [workspace.lints], members keep their own
#     [package] block) — that's why we assert VALUE uniformity, not the
#     `workspace = true` inheritance form.
#   - 37 GitHub Actions workflows
#   - bespoke check scripts: check-error-codes.js,
#     validate-externals-doc.js, check-unused-turbo-tasks.mjs,
#     check-examples.sh, check-pre-compiled.sh, check-is-release.js,
#     check-backport-canary-release.js
#   - tool configs: prettier, 2x eslint (IDE + CLI), ast-grep (sgconfig.yml),
#     alex, typos, lint-staged, rustfmt, rust-toolchain
#   - husky pre-commit (lint-staged) + pre-push (canary push protection)
#   - Lerna (exact-version lockstep) + turbo orchestration
#
# pnpm lint = run-p test-types lint-typescript prettier-check
#             "lint-eslint ." lint-ast-grep lint-language
#             check-unused-turbo-tasks
#
# NEW SINCE v0.9.17 (the headline of this re-analysis):
#   1. errors.json code registry — `pair_hash`/`generated_file_fresh`
#      freshness of the consolidated code->message map (check-error-codes.js
#      regenerates from .errors/ and fails if dirty).
#   2. `command:` wrappers upgraded to `command_idempotent` where the command
#      is an actual repository gate and has check/idempotence semantics.
#   3. server-external-packages.jsonc <-> external-bundling.mdx remains with
#      the repository's validator because the Markdown side is free-form.
#   4. PR-scoping the 29k-file tree via per-rule `scope_filter.changed_since`.
# ============================================================================

version: 1

extends:
  - alint://bundled/oss-baseline@v1
  - alint://bundled/node@v1
  - alint://bundled/rust@v1
  - alint://bundled/monorepo@v1
  - alint://bundled/monorepo/cargo-workspace@v1
  - alint://bundled/ci/github-actions@v1
  - alint://bundled/hygiene/no-tracked-artifacts@v1
  - alint://bundled/tooling/editorconfig@v1

rules:
  # errors.json code-registry freshness. check-error-codes.js consolidates
  # any staged-but-unmerged .errors/*.json into errors.json and EXITS 1 if
  # it had to add anything (i.e. the committed errors.json is stale). That
  # is exactly a generated-file-freshness check: run the generator, the
  # tracked file must already match.
  #   NOTE: the script mutates errors.json + rm's .errors/. generated_file_fresh
  #   is documented as NON-mutating (runs generator, diffs stdout). The
  #   check-error-codes.js writer is NOT stdout-based, so we wrap the
  #   freshness via command_idempotent (its --check twin): a clean tree must
  #   leave errors.json byte-identical. If next.js exposed a `--check`/stdout
  #   mode this would become generated_file_fresh.
  - id: nextjs-error-codes-consolidated
    kind: command_idempotent
    command: ["node", "packages/next/check-error-codes.js"]
    timeout: 120
    level: error
    message: >-
      All new error codes must be consolidated into packages/next/errors.json
      and committed. check-error-codes.js fails when a staged .errors/ entry
      hasn't been merged into errors.json (forces human review of new codes).

  # ════════════════════════════════════════════════════════════════════
  # 2. CROSS-FILE VALUE SYNC  (was a v0.9.17 documented gap)
  # ════════════════════════════════════════════════════════════════════

  # validate-externals-doc.js keeps server-external-packages.jsonc in lockstep
  # with the docs table. The source is JSONC (comment-stripped JSON array);
  # the doc table embeds each pkg in backticks. cross_file_value_equals can
  # express the membership when the doc is parseable, but the doc side is a
  # free-form markdown table sliced on "opt-ed out:" / "| Version" markers —
  # not a clean extractable shape. We KEEP the script as the authority and
  # only assert the source file exists + is valid JSON-ish here; full table
  # alignment stays a command wrapper (see section 5).
  - id: nextjs-server-externals-source-present
    kind: file_exists
    paths: packages/next/src/lib/server-external-packages.jsonc
    level: error
    message: >-
      server-external-packages.jsonc is the source of truth for the
      bundling opt-out list (validate-externals-doc.js syncs it to docs).

  # ════════════════════════════════════════════════════════════════════
  # 3. pnpm-workspace.yaml shape
  # ════════════════════════════════════════════════════════════════════

  - id: nextjs-pnpm-workspace-declares-packages
    kind: yaml_path_matches
    paths: pnpm-workspace.yaml
    path: "$.packages[*]"
    matches: ".+"
    level: error
    message: >-
      pnpm-workspace.yaml must declare packages: [...] — the authoritative
      member list (apps/*, packages/*, bench/*, crates/*/js,
      turbopack/crates/*/js, turbopack/packages/*).

  - id: nextjs-pnpm-workspace-includes-packages-glob
    kind: file_content_matches
    paths: pnpm-workspace.yaml
    pattern: "(?m)^\\s*-\\s*'packages/\\*'"
    level: warning
    message: "pnpm-workspace.yaml should include 'packages/*'."

  - id: nextjs-pnpm-workspace-includes-turbopack-packages
    kind: file_content_matches
    paths: pnpm-workspace.yaml
    pattern: "(?m)^\\s*-\\s*'turbopack/packages/\\*'"
    level: warning
    message: "pnpm-workspace.yaml should include 'turbopack/packages/*'."

  # ════════════════════════════════════════════════════════════════════
  # 4. PER-PACKAGE conventions (for_each_dir + json_path_*)
  # ════════════════════════════════════════════════════════════════════

  - id: nextjs-package-has-license-field
    kind: for_each_dir
    select: "packages/*"
    when_iter: 'iter.has_file("package.json")'
    require:
      - kind: json_path_matches
        paths: "{path}/package.json"
        path: "$.license"
        matches: '^MIT$'
    level: warning
    message: "Every packages/* package.json should declare license: MIT."

  - id: nextjs-package-has-version-field
    kind: for_each_dir
    select: "packages/*"
    when_iter: 'iter.has_file("package.json")'
    require:
      - kind: json_path_matches
        paths: "{path}/package.json"
        path: "$.version"
        matches: '^\d+\.\d+\.\d+(-(canary|alpha|beta|rc)\.\d+)?$'
    level: error
    message: >-
      Every packages/* package.json must declare a semver version
      (Lerna exact-version lockstep — lerna.json command.version.exact=true).

  - id: nextjs-package-version-pinned-to-major
    kind: for_each_dir
    select: "packages/*"
    when_iter: 'iter.has_file("package.json")'
    require:
      - kind: json_path_matches
        paths: "{path}/package.json"
        path: "$.version"
        matches: '^16\.\d+\.\d+(-(canary|alpha|beta|rc)\.\d+)?$'
    level: warning
    message: >-
      Every package must share the 16.x major (Lerna exact-version mode).
      Current monorepo version is 16.3.0-canary.28 (lerna.json).

  - id: nextjs-package-declares-name
    kind: for_each_dir
    select: "packages/*"
    when_iter: 'iter.has_file("package.json")'
    require:
      - kind: json_path_matches
        paths: "{path}/package.json"
        path: "$.name"
        matches: '^(@next/[a-z0-9-]+|next|next-[a-z-]+|create-next-app|eslint-config-next)$'
    level: warning
    message: "packages/* names follow @next/<n>, next, next-*, or the known unscoped variants."

  # ════════════════════════════════════════════════════════════════════
  # 5. PER-CRATE conventions (toml_path_* — value uniformity, no inheritance)
  # ════════════════════════════════════════════════════════════════════

  - id: nextjs-crate-edition-2024
    kind: toml_path_matches
    paths: ["crates/*/Cargo.toml", "turbopack/crates/*/Cargo.toml"]
    path: "$.package.edition"
    matches: '^2024$'
    level: warning
    message: >-
      Every Cargo member should pin edition = "2024" (matches .rustfmt.toml
      edition + rust-toolchain). Per-crate drift => rustfmt output differs.

  - id: nextjs-crate-license-set
    kind: toml_path_matches
    paths: ["crates/*/Cargo.toml", "turbopack/crates/*/Cargo.toml"]
    path: "$.package.license"
    matches: '^(MIT|MPL-2\.0|Apache-2\.0)$'
    level: info
    message: "Cargo members should declare a license (MIT / MPL-2.0 / Apache-2.0)."

  # ════════════════════════════════════════════════════════════════════
  # 6. WORKSPACE-ROOT single-source-of-truth
  # ════════════════════════════════════════════════════════════════════

  - id: nextjs-rust-toolchain-pinned
    kind: toml_path_matches
    paths: rust-toolchain.toml
    path: "$.toolchain.channel"
    matches: '^(stable|beta|nightly|nightly-\d{4}-\d{2}-\d{2}|\d+\.\d+(\.\d+)?)$'
    level: error
    message: >-
      rust-toolchain.toml must pin a dated channel (currently
      nightly-2026-05-15). Floating `nightly` breaks reproducible builds +
      the .devcontainer/rust lockstep.

  - id: nextjs-rust-toolchain-components
    kind: toml_path_matches
    paths: rust-toolchain.toml
    path: "$.toolchain.components[*]"
    matches: '^(rustfmt|clippy|rust-analyzer)$'
    level: warning
    message: "rust-toolchain components must include rustfmt + clippy (lint-staged + rust-check CI need them)."

  - id: nextjs-rustfmt-edition-2024
    kind: toml_path_matches
    paths: .rustfmt.toml
    path: "$.edition"
    matches: '^2024$'
    level: error
    message: >-
      .rustfmt.toml edition must match Cargo package.edition (2024), else
      lint-staged `rustfmt --edition 2024` and CI `cargo fmt --check` diverge.

  # ════════════════════════════════════════════════════════════════════
  # 7. ROOT package.json / tsconfig / lerna / turbo
  # ════════════════════════════════════════════════════════════════════

  # JSONPath rules can't regex a bool, so raw-text match for "private": true.
  - id: nextjs-package-json-private
    kind: file_content_matches
    paths: package.json
    pattern: '"private":\s*true'
    level: error
    message: 'Root package.json must declare "private": true so root never publishes.'

  - id: nextjs-lerna-uses-pnpm
    kind: json_path_matches
    paths: lerna.json
    path: "$.npmClient"
    matches: '^pnpm$'
    level: error
    message: "lerna.json npmClient must be pnpm (matches pnpm-workspace layout)."

  - id: nextjs-lerna-exact-version
    kind: file_content_matches
    paths: lerna.json
    pattern: '"exact":\s*true'
    level: warning
    message: "lerna.json command.version.exact must be true (monorepo version lockstep)."

  - id: nextjs-lerna-publish-allow-canary
    kind: json_path_matches
    paths: lerna.json
    path: "$.command.publish.allowBranch[*]"
    matches: '^canary$'
    level: warning
    message: "lerna.json publish.allowBranch should pin canary (the release branch)."

  - id: nextjs-turbo-json-present
    kind: file_exists
    paths: turbo.json
    level: error
    message: "turbo.json is required — pnpm build/dev/lint-typescript all dispatch through turbo run."

  # ════════════════════════════════════════════════════════════════════
  # 8. TOOL-CONFIG presence
  # ════════════════════════════════════════════════════════════════════

  - id: nextjs-prettierrc-present
    kind: file_exists
    paths: ".prettierrc.json"
    level: error
    message: ".prettierrc.json is required (prettier-check / lint-staged read it)."

  - id: nextjs-prettierignore-present
    kind: file_exists
    paths: ".prettierignore"
    level: warning
    message: ".prettierignore keeps prettier off build artifacts + generated files."

  - id: nextjs-eslint-config-present
    kind: file_exists
    paths: "eslint.config.mjs"
    level: error
    message: "eslint.config.mjs (IDE config) is required."

  - id: nextjs-eslint-cli-config-present
    kind: file_exists
    paths: "eslint.cli.config.mjs"
    level: error
    message: "eslint.cli.config.mjs (CI type-checked config) is required — lint-eslint invokes it."

  - id: nextjs-ast-grep-config-present
    kind: file_exists
    paths: "sgconfig.yml"
    level: warning
    message: "sgconfig.yml is the ast-grep config (lint-ast-grep)."

  - id: nextjs-typos-config-present
    kind: file_exists
    paths: ".typos.toml"
    level: warning
    message: ".typos.toml is the spell-check config."

  - id: nextjs-alex-config-present
    kind: file_exists
    paths: ".alexrc"
    level: info
    message: ".alexrc is the alex insensitive-language config (lint-language)."

  - id: nextjs-lint-staged-config-present
    kind: file_exists
    paths: "lint-staged.config.js"
    level: warning
    message: "lint-staged.config.js drives .husky/pre-commit's per-extension pipeline."

  # ════════════════════════════════════════════════════════════════════
  # 9. HUSKY hook integrity
  # ════════════════════════════════════════════════════════════════════

  - id: nextjs-husky-pre-commit-present
    kind: file_exists
    paths: .husky/pre-commit
    level: error
    message: ".husky/pre-commit should run `pnpm lint-staged` (first feedback before CI)."

  - id: nextjs-husky-pre-commit-runs-lint-staged
    kind: file_content_matches
    paths: .husky/pre-commit
    pattern: 'pnpm lint-staged'
    level: warning
    message: ".husky/pre-commit must invoke `pnpm lint-staged`."

  - id: nextjs-husky-pre-push-canary-guard
    kind: file_content_matches
    paths: .husky/pre-push
    pattern: "protected_branch='canary'"
    level: warning
    message: ".husky/pre-push implements canary-branch push protection (guards direct pushes to vercel/next.js:canary)."

  # ════════════════════════════════════════════════════════════════════
  # 10. REPO METADATA / AI-context
  # ════════════════════════════════════════════════════════════════════

  - id: nextjs-agents-md-present
    kind: file_exists
    paths: "AGENTS.md"
    level: warning
    message: "AGENTS.md is the canonical agent contributor contract."

  - id: nextjs-claude-md-present
    kind: file_exists
    paths: "CLAUDE.md"
    level: info
    message: "CLAUDE.md is a symlink to AGENTS.md."

  - id: nextjs-contributing-present
    kind: file_exists
    paths: ["contributing.md", "CONTRIBUTING.md"]
    level: warning
    message: "contributing.md should exist (referenced from AGENTS.md)."

  - id: nextjs-code-of-conduct-present
    kind: file_exists
    paths: "CODE_OF_CONDUCT.md"
    level: warning
    message: "CODE_OF_CONDUCT.md is required (OpenSSF Scorecard checks for it)."

  # ════════════════════════════════════════════════════════════════════
  # 11. .npmrc / .node-version / .gitattributes / socket.yaml
  # ════════════════════════════════════════════════════════════════════

  - id: nextjs-npmrc-auto-install-peers
    kind: file_content_matches
    paths: .npmrc
    pattern: '(?m)^auto-install-peers\s*=\s*true'
    level: warning
    message: ".npmrc should declare auto-install-peers = true (React peer-dep tree)."

  - id: nextjs-npmrc-strict-peer-deps-off
    kind: file_content_matches
    paths: .npmrc
    pattern: '(?m)^strict-peer-dependencies\s*=\s*false'
    level: warning
    message: ".npmrc declares strict-peer-dependencies = false (React 19/18 split)."

  - id: nextjs-node-version-pinned
    kind: file_exists
    paths: ".node-version"
    level: warning
    message: ".node-version pins the Node major (currently v20); CI + devcontainer read it."

  - id: nextjs-gitattributes-eol-lf
    kind: file_content_matches
    paths: .gitattributes
    pattern: '(?m)^\*\s+text=auto\s+eol=lf'
    level: error
    message: ".gitattributes must declare `* text=auto eol=lf` (CRLF breaks jest snapshots + \\n-anchored regex)."

  - id: nextjs-socket-yaml-present
    kind: file_exists
    paths: socket.yaml
    level: info
    message: "socket.yaml is the Socket.dev supply-chain scanner config."

  # ════════════════════════════════════════════════════════════════════
  # 12. HYGIENE — artifacts that must never be tracked
  # ════════════════════════════════════════════════════════════════════

  - id: nextjs-no-tracked-dot-next
    kind: dir_absent
    paths: "**/.next"
    level: error
    message: ".next/ is build output; never commit it."

  - id: nextjs-no-tracked-dot-turbo
    kind: dir_absent
    paths: "**/.turbo"
    level: error
    message: ".turbo/ is turbo's local cache; never commit it."

  - id: nextjs-no-tracked-target-debug
    kind: dir_absent
    paths: "**/target/debug"
    level: error
    message: "Cargo target/ is build output; never tracked (covers nested target/debug too)."

  # ════════════════════════════════════════════════════════════════════
  # 13. CI workflow supply-chain — SHA-pin third-party actions
  #     (restated at warning over the bundled ci/github-actions@v1 default
  #      because next.js carries 37 workflows = large blast radius)
  # ════════════════════════════════════════════════════════════════════

  - id: nextjs-workflow-actions-pinned-by-sha
    kind: yaml_path_matches
    paths: ".github/workflows/*.yml"
    path: "$.jobs.*.steps[?match(@.uses, '^[^/]+/[^/@]+@[a-f0-9]{40}')].uses"
    matches: '^[^/]+/[^/@]+@[a-f0-9]{40}'
    level: warning
    message: "Third-party workflow actions should be pinned to a 40-char commit SHA."

  # ════════════════════════════════════════════════════════════════════
  # 14. PER-LANGUAGE LINT SHELL-OUTS  — command_idempotent (was `command`)
  #     These wrap the existing read-only --check tools so one `alint check`
  #     fires the whole pipeline. Upgraded to command_idempotent + explicit
  #     timeouts (v0.10). PR-scope the heavy ones with scope_filter so the
  #     29k-file tree isn't re-walked on every push (v0.11).
  #
  #     ALL spawning kinds (command_idempotent, generated_file_fresh) are in
  #     alint-dsl SPAWNING_RULE_KINDS — an extends:'d ruleset can't smuggle a
  #     shell-out past `reject_command_rules_in`.
  # ════════════════════════════════════════════════════════════════════

  - id: nextjs-prettier-check
    kind: command_idempotent
    command: ["pnpm", "prettier-check"]
    timeout: 300
    level: error
    scope_filter:
      changed_since: "{{env.ALINT_BASE_REF | default('origin/canary')}}"

  - id: nextjs-eslint-check
    kind: command_idempotent
    command: ["pnpm", "lint-eslint", "."]
    timeout: 600
    level: error
    scope_filter:
      changed_since: "{{env.ALINT_BASE_REF | default('origin/canary')}}"

  - id: nextjs-typescript-check
    kind: command_idempotent
    command: ["pnpm", "lint-typescript"]
    timeout: 900
    level: error

  - id: nextjs-ast-grep-scan
    kind: command_idempotent
    command: ["pnpm", "lint-ast-grep"]
    timeout: 300
    level: warning

  - id: nextjs-alex-language
    kind: command_idempotent
    command: ["pnpm", "lint-language"]
    timeout: 120
    level: info

  - id: nextjs-cargo-fmt-check
    kind: command_idempotent
    command: ["cargo", "fmt", "--check"]
    timeout: 120
    level: error

  - id: nextjs-cargo-clippy
    kind: command_idempotent
    command: ["cargo", "clippy", "--workspace", "--all-targets", "--", "-D", "warnings"]
    timeout: 1800
    level: error

  - id: nextjs-check-examples
    kind: command_idempotent
    command: ["pnpm", "check-examples"]
    timeout: 300
    level: warning

  - id: nextjs-check-unused-turbo-tasks
    kind: command_idempotent
    command: ["pnpm", "check-unused-turbo-tasks"]
    timeout: 300
    level: warning

  # validate-externals-doc.js: kept as a command (the doc-table side is a
  # free-form markdown slice, not cleanly extractable for cross_file_value_equals).
  - id: nextjs-validate-externals-doc
    kind: command_idempotent
    command: ["pnpm", "validate-externals-doc"]
    timeout: 60
    level: warning

# ============================================================================
# GENUINE NON-REPLACEABLES (kept as the authoritative tool / out of scope):
#   - prettier --check        : AST-aware formatter
#   - eslint (both configs)   : TS/JS AST + type-checked semantic analysis
#   - tsc --noEmit            : the TypeScript type-checker itself
#   - ast-grep scan           : Rust/TS AST pattern matching
#   - alex                    : insensitive-language NLP
#   - cargo fmt/clippy        : Rust language-level lints + the compile
#   - check-unused-turbo-tasks.mjs : turbo-tasks AST scan over 50k+ Rust LOC
#   - check-error-codes.js    : MUTATING generator (writes errors.json, rm's
#                               .errors/) — wrapped via command_idempotent, not
#                               generated_file_fresh, until it grows a stdout/
#                               --check mode.
#   - validate-externals-doc.js : doc side is a free-form markdown table slice.
#   - check-pre-compiled.sh   : regenerates webpack runtime bundles + diffs git
#                               status — git-state mutation, not read-only.
#   - check-is-release.js / check-backport-canary-release.js : parse the last
#                               commit message / release branch state — out of
#                               repo-snapshot scope.
#   - jest test execution     : run-jest.sh test matrix (dev/start/deploy x
#                               webpack/rspack/turbo) — test runner, not a lint.
#   - the Rust compile itself : cargo build / turbo-tasks codegen.
#
# NEW-RULE-KIND CANDIDATES surfaced by this re-analysis:
#   A. mutating generated_file_fresh — a `mode: write-then-diff` so MUTATING
#      generators (check-error-codes.js, check-pre-compiled.sh) become true
#      freshness gates instead of command_idempotent wrappers.
#   B. cross_file_value_equals with a markdown-table extractor — would close
#      the validate-externals-doc.js gap (server-external-packages.jsonc vs the
#      external-bundling docs table).
# ============================================================================
