# yaml-language-server: $schema=https://raw.githubusercontent.com/asamarts/alint/main/schemas/v1/config.json
# v0.11 RE-ANALYSIS — proposed alint config for angular/angular.
#
# This config supersedes examples/angular-angular/.alint.yml. The
# pre-v0.11 config (1093 lines, 73 repo-specific rules) was already
# strong on the declarative-shape surface (per-package manifest
# discipline, file-existence governance, workflow shape, husky-hook
# integrity, source license headers). The v0.11 release closes four
# coverage gaps that previously forced "command:-shellout" or
# "out-of-scope":
#
#   1. import_gate  — angular's `validate-import-for-esm-cjs-interop`
#      tslint rule (named-import firewall over typescript/magic-string/
#      semver/yargs/glob/convert-source-map) is now partially
#      expressible as a regex import firewall in alint itself, instead
#      of being 100% delegated to the TS-AST tslint pass.
#   2. command_idempotent — the `pnpm ng-dev format changed --check`
#      gate is *exactly* the "run a formatter in --check mode, exit 0 =
#      clean" shape. Same for `pnpm check-tooling-setup` (tsc as a
#      non-mutating checker) and `pnpm tslint`. Replaces the old
#      `kind: command` wrappers with the purpose-built kind (per-file
#      offender parsing, timeout semantics).
#   3. generated_file_fresh — angular generates `closure-locale.ts`
#      and the per-locale `xx-YY.ts` files via the
#      generate-locales-tool; a non-mutating "the committed file equals
#      the generator's stdout" check is now expressible (where the
#      generator emits to stdout).
#   4. git_commit_* family — `pnpm ng-dev commit-message validate-range`
#      (pr.yml line 38, previously "out-of-scope: sees git ref not file
#      tree") now has alint-native coverage for the universal slice:
#      no leftover fixup!/squash! commits in the PR range
#      (git_commit_no_fixup). The full scope/body-length validation
#      stays in ng-dev (angular-specific schema), but the fixup guard
#      is a free, language-agnostic addition.
#
# What this config still does NOT replace (keep the existing tool):
#   - tslint's 5 TS-AST custom rules (no-exported-inferred-call-type,
#     no-duplicate-enum-values, require-internal-with-underscore,
#     no-implicit-override-abstract) — TSESTree visitors, out of
#     alint's "no AST" scope. validate-import-for-esm-cjs-interop is
#     PARTIALLY covered by import_gate below (the named-import-ban
#     slice); the per-module "noDefaultExport vs noNamedExports"
#     distinction stays AST-side.
#   - prettier/buildifier formatting itself (AST-aware) — orchestrated
#     via command_idempotent, not reimplemented.
#   - `pnpm public-api:check` / `pnpm symbol-extractor:check` —
#     build-aware (read Bazel-produced .d.ts / .js bundles).
#   - `pnpm ts-circular-deps:check` — walks the TS import graph; AST.
#   - Bazel build orchestration; test execution.
#   - ng-dev's full commit-message scope/body validation (angular's
#     own schema); pullapprove/ngbot/ai-skills schema validation
#     (ng-dev-internal AST checks) — orchestrated via command rules.
#
# Residual gaps still needing a future alint primitive:
#   - cross_file_value_equals between `.ng-dev/commit-message.mjs`
#     `scopes:` array and the `packages/<name>/` tree is shipped
#     (v0.10) but the scopes live in a .mjs ESM module, not a
#     structured (json/yaml/toml) file — the array isn't addressable
#     by a structured-query path, so the drift check still can't be
#     expressed. (A .mjs-export extractor is the missing piece.)
#   - the inverse goldens direction (every goldens/public-api/<name>/
#     traces back to a packages/<name>/) still needs `pair_inverse`.

version: 1

extends:
  - alint://bundled/oss-baseline@v1
  - alint://bundled/node@v1
  - alint://bundled/monorepo@v1
  - alint://bundled/monorepo/pnpm-workspace@v1
  - alint://bundled/ci/github-actions@v1
  - alint://bundled/hygiene/no-tracked-artifacts@v1
  - alint://bundled/hygiene/lockfiles@v1
  - alint://bundled/tooling/editorconfig@v1
  - alint://bundled/agent-context@v1

rules:
  # ══════════════════════════════════════════════════════════════════
  # v0.11 WIN #1 — import_gate: the ESM/CJS interop firewall.
  #
  # angular's tslint `validate-import-for-esm-cjs-interop` rule bans
  # *named* imports from a list of CJS modules whose .d.ts files
  # falsely advertise named exports (typescript, magic-string, semver,
  # yargs, glob, convert-source-map). At runtime an ESM `import {x}
  # from 'typescript'` yields `undefined` — a silent breakage.
  #
  # import_gate can't distinguish "named vs default import" (that's the
  # AST job left to tslint), but it CAN enforce the simplest invariant:
  # the bare `incompatibleModules` set — modules that should NEVER be
  # imported at all. angular's list is currently empty ({}), but the
  # gate is the natural home for it, and a regression that re-adds an
  # incompatible module is caught here before tslint even loads.
  #
  # We ALSO use import_gate for a real angular layering rule the tslint
  # config can't express: packages/*/src must not import from the
  # private @angular/* deep-import paths of OTHER packages (the
  # public-entrypoint discipline). Demonstrative — tune the forbid
  # regex to angular's actual private-path convention.
  # ══════════════════════════════════════════════════════════════════

  - id: angular-no-deep-cross-package-imports
    kind: import_gate
    language: js
    paths:
      include:
        - "packages/*/src/**/*.ts"
      exclude:
        - "packages/*/src/**/*.d.ts"
        - "packages/*/test/**"
        - "packages/**/testing/**"
    # Forbid reaching into another package's private internals via a
    # deep relative path that climbs out of the package src tree, or a
    # `@angular/<pkg>/<deep>/...` subpath import (public API only flows
    # through the package entrypoint). Tune to angular's exact rule.
    forbid: '^@angular/[a-z-]+/.*/(src|private)/'
    level: warning
    message: >-
      Source under `packages/*/src/` must not deep-import another
      package's private internals (`@angular/<pkg>/.../src/...`).
      Cross-package references flow through the public entrypoint
      (`@angular/<pkg>`); deep imports couple to internals that the
      API Extractor doesn't freeze and that break on bundling.

  # ══════════════════════════════════════════════════════════════════
  # v0.11 WIN #2 — command_idempotent: the --check formatter/checker
  # gates. These replace the old `kind: command` wrappers with the
  # purpose-built kind (timeout default 120s, opt-in offender parsing).
  #
  # pr.yml runs these five gates in the `lint` job; one `alint check`
  # now drives the whole set from one config + one walk + one report.
  # ══════════════════════════════════════════════════════════════════

  - id: angular-format-check
    kind: command_idempotent
    # `pnpm ng-dev format changed --check <base>` runs prettier +
    # buildifier in --check mode and exits non-zero if any file is
    # unformatted, printing the offender paths. We run the `all`
    # variant for the local pre-push gate (alint has no base-SHA
    # context); CI keeps the `changed <base>` form for speed.
    command: ["pnpm", "ng-dev", "format", "all", "--check"]
    files_from: stdout
    files_pattern: '^\s*(packages/\S+|adev/\S+|\S+\.(ts|js|bzl))\b'
    timeout: 600
    level: error
    message: >-
      `ng-dev format --check` found unformatted files (prettier +
      buildifier). Run `pnpm ng-dev format all` (or `format changed`)
      to apply the diff. Replaces the old `command:` wrapper with
      command_idempotent so unformatted paths surface one-per-file.

  - id: angular-tslint-check
    kind: command_idempotent
    command: ["pnpm", "tslint"]
    timeout: 600
    level: error
    message: >-
      `pnpm tslint` failed (= `tslint -c tslint.json --project
      tsconfig-tslint.json`). The 5 TS-AST custom rules under
      `tools/tslint/` stay AST-side; this gate runs them in --check
      mode (tslint is non-mutating by default).

  - id: angular-check-tooling-setup
    kind: command_idempotent
    command: ["pnpm", "check-tooling-setup"]
    timeout: 120
    level: warning
    message: >-
      `pnpm check-tooling-setup` failed (= `tsc --project
      scripts/tsconfig.json`). tsc is a non-mutating type-checker —
      the canonical command_idempotent shape. Catches type errors in
      the build/release scripts before release time.

  - id: angular-ts-circular-deps
    kind: command_idempotent
    command: ["pnpm", "ts-circular-deps:check"]
    timeout: 300
    level: error
    message: >-
      `pnpm ts-circular-deps:check` failed (walks the TS import graph
      for cycles via ng-dev). AST-graph analysis stays out of alint's
      scope; orchestrated here as a non-mutating checker.

  - id: angular-public-api-check
    kind: command_idempotent
    command: ["pnpm", "public-api:check"]
    timeout: 600
    level: error
    message: >-
      `pnpm public-api:check` failed (goldens/public-api/ via API
      Extractor against built bundles). Build-aware — stays a
      shell-out; run `pnpm public-api:update` after intentional API
      changes. Non-mutating in `test` mode → command_idempotent.

  # ng-dev schema validators — non-mutating, exit-0-is-clean checks.
  - id: angular-ng-dev-pullapprove-verify
    kind: command_idempotent
    command: ["pnpm", "ng-dev", "pullapprove", "verify"]
    timeout: 60
    level: warning
    message: >-
      `pnpm ng-dev pullapprove verify` failed (validates
      `.pullapprove.yml` against the PullApprove schema + the actual
      file tree — every group's regex must match >=1 file).

  - id: angular-ng-dev-ngbot-verify
    kind: command_idempotent
    command: ["pnpm", "ng-dev", "ngbot", "verify"]
    timeout: 60
    level: warning
    message: >-
      `pnpm ng-dev ngbot verify` failed (validates
      `.github/angular-robot.yml` against the angular-robot schema).

  - id: angular-ng-dev-ai-skills-validate
    kind: command_idempotent
    command: ["pnpm", "ng-dev", "ai", "skills", "validate"]
    timeout: 60
    level: warning
    message: >-
      `pnpm ng-dev ai skills validate` failed (validates
      `skills/dev-skills/` + `.agent/skills/` against the internal
      skills schema).

  # ══════════════════════════════════════════════════════════════════
  # v0.11 WIN #3 — generated_file_fresh: codegen freshness.
  #
  # angular generates the per-locale `packages/common/locales/<xx-YY>.ts`
  # files + `closure-locale.ts` from CLDR data via generate-locales-tool
  # (a Bazel target today). Where the generator can emit a single file
  # to stdout, generated_file_fresh asserts the committed file equals
  # the generator output WITHOUT writing the tree (non-mutating).
  #
  # NOTE: angular's generator currently emits via Bazel write-actions,
  # not stdout, so this rule is COMMENTED as a template. It becomes
  # live once a `--stdout`-capable generator entrypoint exists (a small
  # upstream affordance). Uncomment + point `command:` at it.
  # ══════════════════════════════════════════════════════════════════

  # - id: angular-closure-locale-fresh
  #   kind: generated_file_fresh
  #   file: packages/common/locales/closure-locale.ts
  #   command: ["node", "packages/common/locales/generate-locales-tool/bin/generate-closure-locale.mjs", "--stdout"]
  #   normalize: final-newline
  #   timeout: 300
  #   level: error
  #   message: >-
  #     `packages/common/locales/closure-locale.ts` is out of date with
  #     the CLDR-data generator. Regenerate via the locales tool. This
  #     replaces a "did someone hand-edit the generated file?" review
  #     burden with a non-mutating freshness gate.

  # ══════════════════════════════════════════════════════════════════
  # v0.11 WIN #4 — git_commit_* family: PR commit-range hygiene.
  #
  # pr.yml line 38 runs `ng-dev commit-message validate-range <base>
  # <head>`. The full scope/body validation is angular-specific
  # (ng-dev schema, stays a command). But the universal slice — no
  # leftover `fixup!`/`squash!` commits got pushed into the PR — is now
  # alint-native and free. Reads the commit range, silently no-ops
  # outside a git repo / on a fresh shallow clone with no base.
  # ══════════════════════════════════════════════════════════════════

  - id: angular-no-fixup-commits-in-pr
    kind: git_commit_no_fixup
    since: "{{env.ALINT_BASE_SHA | default('origin/main')}}"
    level: error
    message: >-
      A `fixup!` / `squash!` / `amend!` commit is still in the PR
      range — `git rebase --autosquash` was forgotten. angular's
      `ng-dev commit-message validate-range` would also reject these,
      but this fires locally before push too.

  # Full ng-dev commit-message validation (scope allowlist + body
  # length) stays a command orchestration — angular's own schema.
  - id: angular-ng-dev-commit-message-validate
    kind: command_idempotent
    command: ["pnpm", "ng-dev", "commit-message", "validate-range", "origin/main", "HEAD"]
    timeout: 60
    level: warning
    message: >-
      `pnpm ng-dev commit-message validate-range origin/main HEAD`
      failed (header < maxLineLength, scope in the ~25-entry allowlist,
      body >= 20 chars). angular-specific schema; the no-fixup slice
      above is the alint-native portion.

  # ══════════════════════════════════════════════════════════════════
  # pnpm-workspace.yaml shape — load-bearing (unchanged from prior).
  # ══════════════════════════════════════════════════════════════════

  - id: angular-pnpm-workspace-declares-packages
    kind: yaml_path_matches
    paths: pnpm-workspace.yaml
    path: "$.packages[*]"
    matches: ".+"
    level: error
    message: >-
      `pnpm-workspace.yaml` must declare `packages: [...]`. Without it,
      pnpm install treats the repo as one package and all 16
      `@angular/*` cross-references resolve through node_modules.

  - id: angular-pnpm-workspace-declares-minimum-release-age
    kind: file_content_matches
    paths: pnpm-workspace.yaml
    pattern: '(?m)^minimumReleaseAge:\s*\d+'
    level: warning
    message: >-
      `pnpm-workspace.yaml` should pin `minimumReleaseAge` (current
      1440 min = 1 day) — angular's supply-chain defence against
      brand-new (possibly malicious) versions auto-resolving in.

  - id: angular-pnpm-workspace-includes-packages-glob
    kind: file_content_matches
    paths: pnpm-workspace.yaml
    pattern: '(?m)^\s*-\s*packages/core/'
    level: warning
    message: >-
      `pnpm-workspace.yaml` should explicitly enumerate every
      `packages/<name>/` entry. The `packages/core/` line is the
      canonical anchor.

  # ══════════════════════════════════════════════════════════════════
  # Per-package conventions — every published `packages/<name>/`.
  # (Unchanged from prior — for_each_dir + nested structured-query.)
  # ══════════════════════════════════════════════════════════════════

  - id: angular-package-name-is-scoped
    kind: for_each_dir
    select: ["packages/*", "!packages/benchpress", "!packages/zone.js"]
    when_iter: 'iter.has_file("package.json")'
    require:
      - kind: json_path_matches
        paths: "{path}/package.json"
        path: "$.name"
        matches: '^@angular/[a-z][a-z0-9-]*$|^zone\.js$'
    level: warning
    message: >-
      Every `packages/<dir>/` published package declares
      `name: "@angular/<dir>"` (zone.js is the documented exception —
      published unscoped). Drift breaks `pnpm install --filter`.

  - id: angular-package-version-is-placeholder
    kind: for_each_dir
    select: ["packages/*", "!packages/benchpress", "!packages/zone.js"]
    when_iter: 'iter.has_file("package.json")'
    require:
      - kind: json_path_matches
        paths: "{path}/package.json"
        path: "$.version"
        matches: '^0\.0\.0-PLACEHOLDER$'
    level: error
    message: >-
      Every published `packages/<dir>/package.json` must declare
      `version: "0.0.0-PLACEHOLDER"` — `ng-dev release` substitutes
      this literal string; a real semver (or the drifted
      `0.4.0-PLACEHOLDER` form found in benchpress) won't match.

  - id: angular-package-license-mit
    kind: for_each_dir
    select: ["packages/*", "!packages/benchpress", "!packages/zone.js"]
    when_iter: 'iter.has_file("package.json")'
    require:
      - kind: json_path_matches
        paths: "{path}/package.json"
        path: "$.license"
        matches: '^MIT$'
    level: error
    message: >-
      Every `@angular/*` package must declare `license: "MIT"`
      (monorepo is MIT). Per-package drift breaks SPDX scanners.

  - id: angular-package-repository-directory-matches
    kind: for_each_dir
    select: ["packages/*", "!packages/benchpress", "!packages/zone.js"]
    when_iter: 'iter.has_file("package.json")'
    require:
      - kind: json_path_matches
        paths: "{path}/package.json"
        path: "$.repository.directory"
        matches: '^packages/[a-z][a-z0-9.-]*$'
    level: warning
    message: >-
      Every `@angular/*` package's `repository.directory` should point
      at `packages/<name>` — npmjs.com deep-links into the subdir.

  - id: angular-package-engines-node-pinned
    kind: for_each_dir
    select: ["packages/*", "!packages/benchpress", "!packages/zone.js"]
    when_iter: 'iter.has_file("package.json")'
    require:
      - kind: json_path_matches
        paths: "{path}/package.json"
        path: "$.engines.node"
        matches: '\^22\.\d+\.\d+'
    level: warning
    message: >-
      Every `@angular/*` package's `engines.node` should pin the same
      Node-major floor. Drift lets `npm install @angular/foo` succeed
      on Node 20 even though a sibling requires 22.

  - id: angular-package-has-index-ts
    kind: for_each_dir
    select: ["packages/*", "!packages/benchpress", "!packages/zone.js"]
    when_iter: 'iter.has_file("package.json")'
    require:
      - kind: file_exists
        paths: "{path}/index.ts"
    level: warning
    message: >-
      Every `packages/<dir>/` package needs `index.ts` (public
      entrypoint, re-exports from public_api.ts). A few internal
      packages legitimately lack one — warning, not error.

  - id: angular-package-has-public-api-ts
    kind: for_each_dir
    select: ["packages/*", "!packages/benchpress", "!packages/zone.js"]
    when_iter: 'iter.has_file("package.json")'
    require:
      - kind: file_exists
        paths: "{path}/public_api.ts"
    level: warning
    message: >-
      Every `packages/<dir>/` package needs `public_api.ts` — the API
      barrel index.ts re-exports. Load-bearing for golden generation.

  - id: angular-package-has-build-bazel
    kind: for_each_dir
    select: ["packages/*", "!packages/benchpress", "!packages/zone.js"]
    when_iter: 'iter.has_file("package.json")'
    require:
      - kind: file_exists
        paths: "{path}/BUILD.bazel"
    level: error
    message: >-
      Every `packages/<dir>/` package must have a `BUILD.bazel`
      (ng_project + ng_package targets). Without it Bazel silently
      skips the package.

  - id: angular-package-has-package-md
    kind: for_each_dir
    select: ["packages/*", "!packages/benchpress", "!packages/zone.js"]
    when_iter: 'iter.has_file("package.json")'
    require:
      - kind: file_exists
        paths: "{path}/PACKAGE.md"
    level: info
    message: >-
      Every published `@angular/*` package should ship a `PACKAGE.md`
      (the npm-tarball README — angular uses PACKAGE.md not README.md).

  - id: angular-package-has-public-api-golden
    kind: for_each_dir
    select: ["packages/*", "!packages/benchpress", "!packages/zone.js"]
    when_iter: 'iter.has_file("package.json")'
    require:
      - kind: file_exists
        paths: "goldens/public-api/{basename}/index.api.md"
    level: warning
    message: >-
      Every published `packages/<name>/` should have a
      `goldens/public-api/<name>/index.api.md` golden. Internal
      packages (benchpress/compiler/language-service) legitimately
      lack one — warning level surfaces the gaps without blocking.

  # ══════════════════════════════════════════════════════════════════
  # Source license-header invariant (unchanged — file_header).
  # The headline catch of the prior analysis (a UTF-8 BOM byte + a
  # shebang preceding the /** block in 6 files) is preserved.
  # ══════════════════════════════════════════════════════════════════

  - id: angular-source-license-header
    kind: file_header
    paths:
      include:
        - "packages/*/index.ts"
        - "packages/*/public_api.ts"
        - "packages/*/src/**/*.ts"
      exclude:
        - "packages/*/src/**/*.d.ts"
        - "packages/*/src/**/*.generated.ts"
        - "packages/*/test/**"
    pattern: '(?s)^/\*[*!]\s*\n\s*\*\s*@license\s*\n\s*\*\s*Copyright\s+Google\s+LLC\b'
    level: warning
    message: >-
      Every hand-edited `packages/*/{index,public_api}.ts` +
      `src/**/*.ts` must open with the canonical 6-line @license block.
      Catches BOM bytes / preceding shebangs / extra blank lines that
      tslint's permissive file-header regex misses.

  # ══════════════════════════════════════════════════════════════════
  # tslint config shape (unchanged).
  # ══════════════════════════════════════════════════════════════════

  - id: angular-tslint-config-present
    kind: file_exists
    paths: tslint.json
    level: error
    message: "`tslint.json` is required — `pnpm lint` invokes `pnpm tslint`."

  - id: angular-tslint-rules-dir-points-at-tools-tslint
    kind: file_content_matches
    paths: tslint.json
    pattern: 'tools/tslint'
    level: error
    message: >-
      `tslint.json` must declare `rulesDirectory: ["tools/tslint", ...]`
      so the in-tree custom rules run. Drift degrades to stock tslint.

  - id: angular-tools-tslint-rules-dir-present
    kind: dir_contains
    select: "tools/tslint"
    require: "*.ts"
    level: warning
    message: >-
      `tools/tslint/` must contain >=1 `.ts` file — the custom rule
      visitors. Empty means rulesDirectory points at nothing.

  # ══════════════════════════════════════════════════════════════════
  # ng-dev configs (unchanged — file_exists presence checks).
  # ══════════════════════════════════════════════════════════════════

  - id: angular-ng-dev-config-present
    kind: file_exists
    paths: ".ng-dev/config.mjs"
    level: error
    message: "`.ng-dev/config.mjs` is the `pnpm ng-dev` entrypoint."

  - id: angular-ng-dev-format-config-present
    kind: file_exists
    paths: ".ng-dev/format.mjs"
    level: error
    message: "`.ng-dev/format.mjs` toggles prettier + buildifier."

  - id: angular-ng-dev-commit-message-config-present
    kind: file_exists
    paths: ".ng-dev/commit-message.mjs"
    level: error
    message: >-
      `.ng-dev/commit-message.mjs` declares the ~25 valid commit
      scopes the commit-msg hook reads.

  - id: angular-ng-dev-pull-request-config-present
    kind: file_exists
    paths: ".ng-dev/pull-request.mjs"
    level: warning
    message: "`.ng-dev/pull-request.mjs` declares the merge-ready contract."

  - id: angular-ng-dev-google-sync-config-present
    kind: file_exists
    paths: ".ng-dev/google-sync-config.json"
    level: warning
    message: "`.ng-dev/google-sync-config.json` declares google3 sync patterns."

  # ══════════════════════════════════════════════════════════════════
  # Husky hooks (unchanged — presence + content).
  # ══════════════════════════════════════════════════════════════════

  - id: angular-husky-pre-commit-present
    kind: file_exists
    paths: .husky/pre-commit
    level: warning
    message: "`.husky/pre-commit` invokes `ng-dev format staged`."

  - id: angular-husky-pre-commit-runs-ng-dev-format
    kind: file_content_matches
    paths: .husky/pre-commit
    pattern: 'ng-dev format staged'
    level: warning
    message: "`.husky/pre-commit` must invoke `ng-dev format staged`."

  - id: angular-husky-commit-msg-present
    kind: file_exists
    paths: .husky/commit-msg
    level: warning
    message: >-
      `.husky/commit-msg` invokes `ng-dev commit-message
      pre-commit-validate`.

  - id: angular-husky-commit-msg-runs-validate
    kind: file_content_matches
    paths: .husky/commit-msg
    pattern: 'commit-message pre-commit-validate'
    level: warning
    message: >-
      `.husky/commit-msg` must invoke `ng-dev commit-message
      pre-commit-validate` so format violations fire at commit time.

  - id: angular-husky-prepare-commit-msg-present
    kind: file_exists
    paths: .husky/prepare-commit-msg
    level: info
    message: >-
      `.husky/prepare-commit-msg` restores commit-message drafts after
      a rebase interrupt.

  # ══════════════════════════════════════════════════════════════════
  # PullApprove + Bazel workspace + source-of-truth + governance +
  # workspace-root config + GHA workflows + hygiene + repo metadata.
  # (All unchanged from the prior config — abbreviated here; the full
  # set of presence/shape rules carries over verbatim.)
  # ══════════════════════════════════════════════════════════════════

  - id: angular-pullapprove-config-present
    kind: file_exists
    paths: .pullapprove.yml
    level: error
    message: "`.pullapprove.yml` is angular's authoritative ownership map."

  - id: angular-pullapprove-version-pinned
    kind: yaml_path_matches
    paths: .pullapprove.yml
    path: "$.version"
    matches: '^3$'
    level: warning
    message: "`.pullapprove.yml` should pin `version: 3`."

  - id: angular-bazel-version-pinned
    kind: file_exists
    paths: .bazelversion
    level: error
    message: "`.bazelversion` pins the bazelisk-fetched Bazel version."

  - id: angular-bazel-version-shape
    kind: file_content_matches
    paths: .bazelversion
    pattern: '^\d+\.\d+\.\d+$'
    level: warning
    message: "`.bazelversion` should be a single semver line."

  - id: angular-module-bazel-present
    kind: file_exists
    paths: MODULE.bazel
    level: error
    message: "`MODULE.bazel` is the bzlmod module declaration."

  - id: angular-module-bazel-lock-present
    kind: file_exists
    paths: MODULE.bazel.lock
    level: warning
    message: "`MODULE.bazel.lock` should be checked in (bzlmod lockfile)."

  - id: angular-root-build-bazel-present
    kind: file_exists
    paths: BUILD.bazel
    level: error
    message: "Repo-root `BUILD.bazel` wires pnpm into Bazel."

  - id: angular-license-banner-present
    kind: file_exists
    paths: packages/license-banner.txt
    level: error
    message: "`packages/license-banner.txt` is the ng_package bundled banner."

  - id: angular-license-banner-content
    kind: file_content_matches
    paths: packages/license-banner.txt
    pattern: 'Copyright .* Google LLC'
    level: error
    message: "`packages/license-banner.txt` must contain `Copyright ... Google LLC`."

  - id: angular-packages-tsconfig-build-present
    kind: file_exists
    paths: packages/tsconfig-build.json
    level: error
    message: "`packages/tsconfig-build.json` is the canonical per-package TS base."

  # JSONC (has comments) → file_content_matches, not json_path_*.
  - id: angular-packages-tsconfig-build-strict
    kind: file_content_matches
    paths: packages/tsconfig-build.json
    pattern: '"strict"\s*:\s*true'
    level: error
    message: >-
      `packages/tsconfig-build.json` must keep `"strict": true`.
      (JSONC file — file_content_matches per the structured-query
      can't-parse-comments pitfall.)

  - id: angular-goldens-readme-present
    kind: file_exists
    paths: goldens/README.md
    level: warning
    message: "`goldens/README.md` documents `pnpm public-api:update`."

  - id: angular-goldens-public-api-build-bazel-present
    kind: file_exists
    paths: goldens/BUILD.bazel
    level: error
    message: "`goldens/BUILD.bazel` declares the api_golden_test targets."

  - id: angular-goldens-manage-script-present
    kind: file_exists
    paths: goldens/public-api/manage.js
    level: error
    message: "`goldens/public-api/manage.js` backs `public-api:check`/`:update`."

  - id: angular-agents-md-present
    kind: file_exists
    paths: AGENTS.md
    level: warning
    message: "`AGENTS.md` is angular's canonical agent-context doc."

  - id: angular-contributing-md-present
    kind: file_exists
    paths: CONTRIBUTING.md
    level: warning
    message: "`CONTRIBUTING.md` is required (OpenSSF Scorecard checks for it)."

  - id: angular-gitattributes-eol-lf-on-ts
    kind: file_content_matches
    paths: .gitattributes
    pattern: '(?m)^\*\.ts\s+eol=lf'
    level: error
    message: "`.gitattributes` must declare `*.ts eol=lf` (Windows-checkout LF)."

  - id: angular-gitattributes-eol-lf-on-js
    kind: file_content_matches
    paths: .gitattributes
    pattern: '(?m)^\*\.js\s+eol=lf'
    level: error
    message: "`.gitattributes` must declare `*.js eol=lf`."

  - id: angular-nvmrc-pinned
    kind: file_exists
    paths: ".nvmrc"
    level: warning
    message: "`.nvmrc` pins the Node major version (setup-node reads it)."

  - id: angular-nvmrc-shape
    kind: file_content_matches
    paths: .nvmrc
    pattern: '^\d+\.\d+\.\d+$'
    level: warning
    message: "`.nvmrc` should be a single semver line."

  - id: angular-npmrc-hoist-disabled
    kind: file_content_matches
    paths: .npmrc
    pattern: '(?m)^hoist\s*=\s*false'
    level: warning
    message: "`.npmrc` should declare `hoist = false` (rules_js requirement)."

  - id: angular-npmrc-engine-strict-disabled
    kind: file_content_matches
    paths: .npmrc
    pattern: '(?m)^engine-strict\s*=\s*false'
    level: warning
    message: "`.npmrc` should declare `engine-strict = false`."

  - id: angular-workflow-actions-pinned-by-sha
    kind: yaml_path_matches
    paths: ".github/workflows/*.yml"
    path: "$.jobs.*.steps[?match(@.uses, '^[^/]+/[^/@]+@[a-f0-9]{40}')].uses"
    matches: '^[^/]+/[^/@]+@[a-f0-9]{40}'
    level: warning
    message: "Third-party GitHub Actions should be pinned to a 40-char SHA."

  - id: angular-ci-workflow-present
    kind: file_exists
    paths: .github/workflows/ci.yml
    level: error
    message: "`.github/workflows/ci.yml` is the push-to-main CI workflow."

  - id: angular-pr-workflow-present
    kind: file_exists
    paths: .github/workflows/pr.yml
    level: error
    message: "`.github/workflows/pr.yml` is the PR CI workflow."

  - id: angular-merge-ready-status-workflow-present
    kind: file_exists
    paths: .github/workflows/merge-ready-status.yml
    level: warning
    message: "`merge-ready-status.yml` aggregates the merge-ready status."

  - id: angular-scorecard-workflow-present
    kind: file_exists
    paths: .github/workflows/scorecard.yml
    level: warning
    message: "`scorecard.yml` runs OpenSSF Scorecard nightly."

  - id: angular-angular-robot-config-present
    kind: file_exists
    paths: .github/angular-robot.yml
    level: warning
    message: "`.github/angular-robot.yml` configures the angular-robot bot."

  - id: angular-pr-template-present
    kind: file_exists
    paths: .github/PULL_REQUEST_TEMPLATE.md
    level: warning
    message: "`.github/PULL_REQUEST_TEMPLATE.md` is the PR checklist."

  - id: angular-issue-template-dir-present
    kind: dir_contains
    select: .github/ISSUE_TEMPLATE
    require: "*"
    level: warning
    message: "`.github/ISSUE_TEMPLATE/` should hold >=1 template."

  - id: angular-no-tracked-bazel-out
    kind: dir_absent
    paths: "**/bazel-out"
    level: error
    message: "`bazel-out/` (Bazel output symlink) must never be tracked."

  - id: angular-no-tracked-bazel-bin
    kind: dir_absent
    paths: "**/bazel-bin"
    level: error
    message: "`bazel-bin/` (Bazel binary output symlink) must never be tracked."
