# yaml-language-server: $schema=https://raw.githubusercontent.com/asamarts/alint/main/schemas/v1/config.json
# Starter alint config for apache/spark.
#
# apache/spark is the canonical 4-language Apache TLP polyglot
# monorepo: a single tree hosting Scala (the core engine), Java (the
# ASM-level extension points + lower-level libs in `common/utils-java`,
# `common/network-*`, `launcher/`), Python (PySpark, packaged as 3
# distinct PyPI distributions: `pyspark` / `pyspark-client` /
# `pyspark-connect` from `python/packaging/{classic,client,connect}/`),
# and R (SparkR, packaged for CRAN from `R/pkg/`). Glued together by
# a Maven multi-module build (49 pom.xml files, 48 declared
# `<module>` entries in the root parent pom) and a 72-workflow GitHub
# Actions matrix.
#
# Repo state captured: 2026-05-06, sparse-clone of `apache/spark`
# (latest master), heaviest test directories excluded
# (`/sql/catalyst/src/test`, `/sql/core/src/test`, `/core/src/test`,
# `/python/pyspark/sql/tests`).
#
# Concrete count at HEAD:
#
#   - 49 pom.xml files (40 at maxdepth 3; 9 deeper inside
#     `connector/`, `sql/connect/`, `resource-managers/`)
#   - Root pom.xml declares 48 `<module>` entries (some via
#     profile-conditional sections for kinesis / yarn / kubernetes /
#     ganglia-lgpl)
#   - 4 in-tree language implementations:
#       * Scala — the core engine (core/, sql/, mllib/, graphx/,
#         streaming/, repl/, etc.)
#       * Java — lower-level libs (common/utils-java/,
#         common/network-*/, launcher/, examples/)
#       * Python — PySpark (python/), THREE setup.py variants under
#         python/packaging/{classic,client,connect}/ producing the
#         `pyspark` / `pyspark-client` / `pyspark-connect` PyPI
#         distributions
#       * R — SparkR (R/pkg/) packaged for CRAN
#   - 72 GitHub Actions workflows under .github/workflows/
#   - 51 scripts under dev/ (lint orchestration + release tooling)
#   - 6 lint-* scripts: lint-scala, lint-java, lint-python, lint-r,
#     lint-js, plus check-license (the Apache RAT runner)
#   - 9 tool-config files at root + dev/: scalastyle-config.xml
#     (root, 869 lines), dev/.scalafmt.conf, dev/checkstyle.xml
#     (303 lines), dev/checkstyle-suppressions.xml,
#     dev/eslint.js, dev/tox.ini, root pyproject.toml (defines
#     [tool.ruff] + [tool.black]), python/mypy.ini, R/pkg/DESCRIPTION
#   - dev/.rat-excludes = 145 path patterns consumed by Apache RAT
#   - dev/sparktestsupport/modules.py — the Python source-of-truth
#     registry mapping Maven modules to their dependent test modules
#     (drives dev/run-tests.py)
#   - dev/deps/spark-deps-hadoop-3-hive-2.3 — pinned Maven dependency
#     manifest, regenerated by `dev/test-dependencies.sh` and
#     compared in CI
#   - .pre-commit-config.yaml = LIGHT (2 hooks: format-python +
#     ruff). Spark does NOT use pre-commit as the orchestrator
#     (unlike arrow); the lint-* scripts under dev/ are the
#     orchestration layer, fanned out by .github/workflows/build_*.yml
#   - LICENSE-binary + NOTICE-binary + licenses-binary/ — the Apache
#     two-tier license discipline: source LICENSE for the source
#     tarball + LICENSE-binary for the published convenience binary
#     (which transitively bundles ~250 third-party Maven artefacts
#     and must list each in NOTICE-binary)
#
# This config replaces the *structural* gates — Maven multi-module
# integrity, per-language module conventions (Scala/Java co-mingled
# under common/sql/mllib/etc., Python under python/, R under R/pkg/),
# Apache governance (LICENSE / NOTICE / two-tier license discipline /
# .asf.yaml / RAT exclude registry / dev/create-release/), root
# tool-config presence (scalastyle-config.xml, dev/checkstyle.xml,
# dev/.scalafmt.conf, dev/eslint.js, python/mypy.ini), GitHub Actions
# hardening across the 72-workflow matrix — and wraps the existing
# lint-* scripts via `command:` rules.
#
# What this config does NOT replace (keep the existing tool):
#   - scalastyle / scalafmt        (Scala AST + style)
#   - checkstyle                   (Java AST + style)
#   - flake8 / ruff / black / mypy (Python AST + style + types)
#   - lintr                        (R AST + style)
#   - eslint                       (JS AST + style)
#   - apache-rat                   (the official Release Audit Tool —
#                                   runs as a Java jar via
#                                   dev/check-license, cross-references
#                                   dev/.rat-excludes)
#   - mima                         (Scala binary-compatibility check
#                                   against the previous release —
#                                   parses .class file signatures)
#   - dev/check-protos.py          (regenerates Spark Connect protos
#                                   under tmpdir, byte-compares to
#                                   committed outputs — codegen
#                                   freshness, needs the v0.10+
#                                   `generated_file_fresh` primitive
#                                   that arrow + cpython + uv share)
#   - dev/test-dependencies.sh     (regenerates dev/deps/spark-deps-*
#                                   and asserts no diff vs. committed)
#
# Known limitations versus the existing pre-commit + RAT pipeline
# (each requires an alint primitive that doesn't ship today — see
# this directory's README.md for the full gap catalogue):
#   - dev/.rat-excludes path-registry resolution (every glob-pattern
#     in the exclude list must resolve to at least one on-disk file
#     — same shape as the rust-lang/rust + clap + cpython + arrow +
#     next.js `registry_paths_resolve` v0.10+ candidate; spark is
#     the SIXTH source for this primitive)
#   - root pom.xml `<modules>` ↔ on-disk module directories integrity
#     (every `<module>foo</module>` entry must point at a directory
#     containing a pom.xml; conversely, every nested pom.xml should be
#     declared in some parent's `<modules>` — needs a Maven-aware
#     extension of `for_each_dir` or the v0.10+ `registry_paths_resolve`)
#   - dev/deps/spark-deps-* freshness vs. `dev/test-dependencies.sh`
#     output (codegen freshness, same shape as cpython's
#     cases_generator + uv's `cargo dev generate-all`)
#   - LICENSE-binary ↔ licenses-binary/* cross-reference
#     (every third-party library mentioned in NOTICE-binary must have
#     a corresponding licenses-binary/LICENSE-<name>.txt file —
#     unique to Apache TLPs that ship a binary distribution; flag
#     this as a v0.10+ candidate for the proposed
#     `apache/governance@v1` bundled ruleset)
#   - dev/sparktestsupport/modules.py module-list ↔ root pom.xml
#     `<module>` entries cross-reference (the Python file MUST stay
#     in sync with the Maven module set so `dev/run-tests.py`
#     correctly identifies which suites to run; cross-language
#     registry consistency is the headline polyglot-shaped gap, same
#     spirit as arrow's `cross_language_implementation_complete`)

version: 1

extends:
  # OSS hygiene baseline (README, LICENSE presence, no merge markers,
  # no bidi controls, final newline, etc.).
  - alint://bundled/oss-baseline@v1

  # Apache 2.0 compliance bundle is the canonical anchor for any
  # Apache TLP. Enforces LICENSE-text-Apache-2, NOTICE presence, and
  # the canonical Apache source header on every Scala/Java/Python/R
  # source file. Apache Spark uses the longer ASF-preamble form
  # ("Licensed to the Apache Software Foundation (ASF) under one or
  # more contributor license agreements...") on every source file —
  # the same form arrow + airflow + every other TLP uses. The pattern
  # override below in `rules:` widens the regex to accept either form
  # so spark's actual headers validate cleanly.
  - alint://bundled/compliance/apache-2@v1

  # Java tier — Spark is fundamentally a Maven-built JVM project
  # (Scala compiles to JVM bytecode + Java is its own first-class
  # language under common/utils-java/, common/network-*/, launcher/).
  # The bundled java@v1 ruleset:
  #   - asserts pom.xml at root (Spark has both root pom.xml + 48
  #     declared submodules)
  #   - asserts a build wrapper (Spark ships build/mvn + build/sbt;
  #     `mvnw` would be the official Maven Wrapper but Spark uses its
  #     own build/mvn; `info`-level rule, advisory)
  #   - guards `**/target/` and `**/*.class` (build outputs MUST NOT
  #     be tracked) — exactly Spark's discipline
  #   - asserts PascalCase for *.java filenames
  #   - asserts final-newline + no-trailing-whitespace +
  #     no-bidi-controls + no-zero-width on Java sources
  #     (scope-filtered by `has_ancestor: pom.xml`, so it ONLY fires
  #     under directories that are part of the Maven build — exactly
  #     the right shape for a polyglot monorepo)
  - alint://bundled/java@v1

  # Python tier — PySpark under python/. The bundled python@v1
  # ruleset gates via `has_ancestor: pyproject.toml` / `setup.py`
  # so it only fires under python/ (not under, say, dev/ which
  # also has .py scripts but is not a published package). Spark's
  # 3-variant packaging (python/packaging/{classic,client,connect}/)
  # means there are 3 setup.py files; the bundled rules apply to all
  # three uniformly.
  - alint://bundled/python@v1

  # GitHub Actions hardening (workflow permissions, action SHA
  # pinning, top-level `name:`). 72 workflows, supply-chain blast
  # radius is large — every release shells through some workflow.
  - alint://bundled/ci/github-actions@v1

  # Hygiene: tracked artefacts that should never appear (node_modules,
  # __pycache__, target/, dist/, .DS_Store, etc.). The java@v1
  # ruleset already covers `**/target/` + `**/*.class`; this catches
  # the cross-language ones.
  - alint://bundled/hygiene/no-tracked-artifacts@v1

rules:
  # ──────────────────────────────────────────────────────────────────
  # Override bundled apache-2-source-has-license-header to accept
  # spark's longer ASF-preamble header form. Same pattern as the
  # arrow + airflow case studies — every Apache TLP uses the longer
  # form.
  # ──────────────────────────────────────────────────────────────────

  - id: apache-2-source-has-license-header
    kind: file_header
    paths:
      include:
        ["**/*.{scala,java,py,r,R,js,jsx,ts,tsx,sh,xml,proto}"]
      exclude:
        - "**/target/**"
        - "**/build/**"
        - "**/dist/**"
        - "**/node_modules/**"
        - "**/.cargo/**"
        - "**/generated/**"
        - "**/_generated/**"
        - "**/__generated__/**"
        - "**/*.min.js"
        - "**/*.min.css"
        - "python/pyspark/cloudpickle/**"
        - "python/pyspark/sql/connect/proto/**"
        - "python/pyspark/sql/streaming/proto/**"
        - "python/pyspark/loose_version.py"
        - "python/pyspark/join.py"
        - "python/pyspark/tblib.py"
        - "core/src/main/resources/org/apache/spark/ui/static/vis-*"
        - "core/src/main/resources/org/apache/spark/ui/static/dataTables*"
        - "core/src/main/resources/org/apache/spark/ui/static/jquery*"
        - "core/src/main/resources/org/apache/spark/ui/static/bootstrap*"
        - "core/src/main/resources/org/apache/spark/ui/static/d3*"
        - "core/src/main/resources/org/apache/spark/ui/static/dagre*"
        - "core/src/main/resources/org/apache/spark/ui/static/sorttable.js"
        - "core/src/main/resources/org/apache/spark/ui/static/graphlib*"
        - "**/SparkILoop.scala"
        - "**/LimitedInputStream.java"
        - "**/TimSort.java"
        - "mllib-local/src/main/scala/scala/collection/compat/**"
    lines: 30
    pattern: 'Licensed (to the Apache Software Foundation|under the Apache License,?\s*Version 2)'
    level: warning
    message: >-
      Apache-2.0: source files must carry an Apache license header.
      apache/spark uses the longer ASF-preamble form ("Licensed to
      the Apache Software Foundation (ASF) under one or more
      contributor license agreements...") on every file; the canonical
      Apache RAT release-audit tool (run via dev/check-license)
      enforces this at release-vote time. This rule overrides the
      bundled compliance/apache-2 header-pattern default to accept
      either the longer ASF-preamble form or the shorter "Licensed
      under the Apache License" form.
    policy_url: "https://www.apache.org/licenses/LICENSE-2.0#apply"

  # ──────────────────────────────────────────────────────────────────
  # Apache governance + release-tooling shape — the dev/.rat-excludes
  # + dev/check-license + dev/create-release/ + LICENSE-binary +
  # NOTICE-binary + .asf.yaml triad is what makes this an Apache TLP.
  # Most of these would be candidates for a v0.10+
  # `apache/governance@v1` bundled ruleset (proposed in this README's
  # findings — apache/arrow + apache/airflow + apache/spark all share
  # the same shape).
  # ──────────────────────────────────────────────────────────────────

  - id: spark-asf-yaml-present
    kind: file_exists
    paths: .asf.yaml
    level: error
    message: >-
      .asf.yaml is the canonical ASF infrastructure config:
      description, homepage, notification mailing list addresses
      (commits@spark.apache.org, dev@spark.apache.org, reviews@...),
      JIRA-link auto-detection, branch protection. Removing it
      severs the repo from ASF infra.

  - id: spark-asf-declares-homepage
    kind: yaml_path_matches
    paths: .asf.yaml
    path: "$.github.homepage"
    matches: '^https://spark\.apache\.org/?$'
    level: warning
    message: >-
      .asf.yaml `github.homepage` should point at
      https://spark.apache.org/. The ASF-infra bot reads this field
      and propagates it to the GitHub repo "About" sidebar.

  - id: spark-asf-declares-commits-list
    kind: yaml_path_matches
    paths: .asf.yaml
    path: "$.notifications.commits"
    matches: '^commits@spark\.apache\.org$'
    level: warning
    message: >-
      .asf.yaml `notifications.commits` MUST be
      commits@spark.apache.org so every commit broadcasts to the
      Apache-required commit-archive mailing list.

  # The TWO-TIER LICENSE/NOTICE discipline — unique to Apache TLPs
  # that ship a binary distribution (the `spark-X.Y.Z-bin-*.tgz`
  # tarball that includes ~250 transitively-bundled Maven artefacts).
  # The source LICENSE covers the in-tree Scala/Java/Python/R sources;
  # the binary LICENSE-binary lists every transitively-bundled
  # third-party library + its license. Same NOTICE/NOTICE-binary
  # pairing. arrow has the same structure (LICENSE.txt +
  # NOTICE.txt only — but the Java spin-out apache/arrow-java *does*
  # carry LICENSE-binary).

  - id: spark-license-binary-present
    kind: file_exists
    paths: LICENSE-binary
    root_only: true
    level: error
    message: >-
      LICENSE-binary is required at the repo root for every Apache
      TLP that ships a binary distribution. It lists every
      transitively-bundled third-party library + its license; the
      Apache release-vote process REJECTS a release that doesn't
      ship it. spark's binary distribution
      (spark-X.Y.Z-bin-hadoop3.tgz) bundles ~250 Maven artefacts —
      every one needs a LICENSE-binary entry.
    policy_url: "https://infra.apache.org/licensing-howto.html"

  - id: spark-notice-binary-present
    kind: file_exists
    paths: NOTICE-binary
    root_only: true
    level: error
    message: >-
      NOTICE-binary is the binary-distribution counterpart to NOTICE
      — required by Apache release policy for any binary tarball.
      Together with LICENSE-binary it forms the two-tier license
      discipline that distinguishes an Apache TLP binary release from
      an unofficial build.
    policy_url: "https://infra.apache.org/licensing-howto.html"

  - id: spark-licenses-binary-dir-present
    kind: dir_exists
    paths: licenses-binary
    level: error
    message: >-
      licenses-binary/ holds the per-library license files referenced
      by LICENSE-binary (one LICENSE-<name>.txt per bundled
      dependency). Mirror of licenses/ (which holds the per-library
      license files for in-tree vendored code referenced by the
      source LICENSE).

  - id: spark-licenses-dir-present
    kind: dir_exists
    paths: licenses
    level: warning
    message: >-
      licenses/ holds the per-library license files for in-tree
      vendored code (cloudpickle, py4j, sorttable.js, etc. —
      everything listed in dev/.rat-excludes that's third-party-
      sourced). Mirror of licenses-binary/.

  # The Apache RAT (Release Audit Tool) discipline — same as arrow's
  # rat_exclude_files.txt setup, with spark using `dev/.rat-excludes`
  # as the canonical name. dev/check-license is the wrapper script
  # the GitHub Actions workflows shell out to.

  - id: spark-rat-excludes-present
    kind: file_exists
    paths: dev/.rat-excludes
    level: error
    message: >-
      dev/.rat-excludes is the path-pattern allowlist consumed by
      the Apache RAT runner (dev/check-license). 145 patterns at
      HEAD. Without it, every binary fixture, generated file, and
      vendored blob would fail RAT and block the release vote.

  - id: spark-check-license-script-present
    kind: file_exists
    paths: dev/check-license
    level: error
    message: >-
      dev/check-license is the script that downloads
      apache-rat-${RAT_VERSION}.jar, runs RAT against an archive of
      HEAD, and grep-filters the output against dev/.rat-excludes.
      Required for both the local pre-flight (developers run it
      before pushing) and the formal release-candidate verification.

  - id: spark-create-release-dir-present
    kind: dir_exists
    paths: dev/create-release
    level: warning
    message: >-
      dev/create-release/ holds the Apache release dance: do-release.sh,
      do-release-docker.sh, release-build.sh, release-tag.sh,
      generate-contributors.py, vote.tmpl, announce.tmpl. Together
      they implement the entire RC build → vote → announce pipeline
      that every Apache TLP follows.

  - id: spark-merge-script-present
    kind: file_exists
    paths: dev/merge_spark_pr.py
    level: info
    message: >-
      dev/merge_spark_pr.py is the canonical PR-merge script
      (squashes commits, formats the merge message, links the JIRA
      issue at https://issues.apache.org/jira/browse/SPARK-NNNNN if
      present). Same spirit as arrow's dev/merge_arrow_pr.py.

  # ──────────────────────────────────────────────────────────────────
  # Maven multi-module integrity — the structural shape Maven imposes
  # that NO per-language linter sees. The root pom.xml declares 48
  # `<module>` entries; each must point at a directory containing a
  # pom.xml. Conversely, every nested pom.xml inside the tree should
  # appear in some parent's `<modules>` (otherwise it's an orphan
  # that mvn won't build). alint can assert the root pom.xml exists
  # and that the canonical top-level Maven module dirs each have a
  # pom.xml; the deeper "every <module> entry resolves" check needs
  # the v0.10+ `registry_paths_resolve` rule kind.
  # ──────────────────────────────────────────────────────────────────

  - id: spark-root-pom-present
    kind: file_exists
    paths: pom.xml
    root_only: true
    level: error
    message: >-
      pom.xml at the repo root is the parent POM that declares all 48
      Maven submodules + the dependency-management + plugin-management
      blocks they all inherit from. Without it, `mvn package` fails
      immediately and the GitHub Actions Maven matrix workflows
      (build_maven*.yml) all bail out.

  - id: spark-root-pom-declares-apache-parent
    kind: file_content_matches
    paths: pom.xml
    pattern: '(?s)<parent>\s*<groupId>org\.apache</groupId>\s*<artifactId>apache</artifactId>'
    level: error
    message: >-
      The root pom.xml MUST inherit from the Apache parent POM
      (org.apache:apache:NN). This is what propagates the Apache-
      compliant release-deployment plugin set, the source-distribution
      assembly descriptor, and the GPG signing config to every
      submodule. Removing the parent declaration silently disables
      the Apache release machinery.
    policy_url: "https://maven.apache.org/pom/asf/"

  - id: spark-root-pom-declares-spark-groupid
    kind: file_content_matches
    paths: pom.xml
    pattern: '(?s)<groupId>org\.apache\.spark</groupId>'
    level: error
    message: >-
      The root pom.xml `<groupId>` MUST be `org.apache.spark`. Maven
      Central namespace governance assigns this to the Spark PMC;
      drift would block publishing.

  # Top-level Maven module subdirectories — every one of these MUST
  # exist + carry a pom.xml. The list mirrors the canonical
  # `<modules>` section of the root pom.xml at HEAD. NOTE: `sql/`
  # and `common/` are namespacing parent dirs that DO NOT carry
  # their own pom.xml — their sub-modules (sql/api, sql/catalyst,
  # sql/core, sql/hive, sql/connect/*, common/utils, common/network-*,
  # etc.) each have one. The two follow-up rules below cover them.
  - id: spark-maven-top-modules-have-pom
    kind: for_each_dir
    select: "{core,mllib,mllib-local,graphx,streaming,launcher,examples,assembly,repl,tools}"
    require:
      - kind: file_exists
        paths: "{path}/pom.xml"
    level: error
    message: >-
      Every top-level Maven module subdirectory must declare a
      pom.xml. The root pom.xml's `<modules>` section subdir()s into
      each; a missing pom.xml causes the submodule to be silently
      skipped at build time, so the upstream-published spark-* JAR
      vanishes from Maven Central without warning.

  # sql/ holds the SQL stack. Top-level sub-modules: api, catalyst,
  # core, hive, hive-thriftserver, pipelines. Each is an independent
  # Maven module; each MUST have its own pom.xml.
  - id: spark-sql-sublibrary-has-pom
    kind: for_each_dir
    select: "sql/{api,catalyst,core,hive,hive-thriftserver,pipelines}"
    require:
      - kind: file_exists
        paths: "{path}/pom.xml"
    level: error
    message: >-
      Every top-level Maven module under sql/ (api, catalyst, core,
      hive, hive-thriftserver, pipelines) is an independent Maven
      module declared in the root pom.xml's `<modules>` section.

  # sql/connect/ is the second-tier namespace under sql/, holding
  # the Spark Connect modules (server, common, shims, client/jvm,
  # client/jdbc).
  - id: spark-sql-connect-sublibrary-has-pom
    kind: for_each_dir
    select: "sql/connect/{server,common,shims}"
    require:
      - kind: file_exists
        paths: "{path}/pom.xml"
    level: error
    message: >-
      Every Maven module under sql/connect/ (server, common, shims)
      is independently declared in the root pom.xml's `<modules>`
      section. These are the JVM-side Spark Connect implementation;
      removing pom.xml drops Connect from the build.

  # common/ holds 10 sub-libraries (kvstore, network-*, sketch, tags,
  # unsafe, utils, utils-java, variant). Each is an independent Maven
  # module; each MUST have its own pom.xml.
  - id: spark-common-sublibrary-has-pom
    kind: for_each_dir
    select: "common/*"
    require:
      - kind: file_exists
        paths: "{path}/pom.xml"
    when_iter: 'iter.is_dir'
    level: error
    message: >-
      Every sub-library under common/ (kvstore, network-common,
      network-shuffle, network-yarn, sketch, tags, unsafe, utils,
      utils-java, variant) is an independent Maven module and MUST
      declare its own pom.xml. The root pom.xml's `<modules>`
      section depends on each entry resolving.

  # connector/ holds the per-source-system plugins (avro, kafka,
  # protobuf, kinesis, ganglia-lgpl, profiler, etc.). Each is an
  # independent Maven module under a profile.
  - id: spark-connector-sublibrary-has-pom
    kind: for_each_dir
    select: "connector/*"
    require:
      - kind: file_exists
        paths: "{path}/pom.xml"
    when_iter: 'iter.is_dir'
    level: error
    message: >-
      Every sub-library under connector/ (avro, kafka-0-10,
      kafka-0-10-sql, kafka-0-10-token-provider, kafka-0-10-assembly,
      protobuf, kinesis-asl, kinesis-asl-assembly, spark-ganglia-lgpl,
      profiler, docker-integration-tests) is an independent Maven
      module under a profile-conditional `<modules>` block in the
      root pom.xml.

  # ──────────────────────────────────────────────────────────────────
  # Per-language-MODULE conventions — the launch-pitch angle. apache/
  # spark has Scala + Java co-mingled under the Maven modules, Python
  # under python/, R under R/pkg/. No per-language linter sees the
  # cross-language structural shape: scalastyle only sees Scala,
  # checkstyle only sees Java, ruff/black/mypy only see Python,
  # lintr only sees R. alint's per-module conventions catch drift
  # across the whole polyglot tree.
  # ──────────────────────────────────────────────────────────────────

  # Python: PySpark has 3 packaging variants
  # (python/packaging/{classic,client,connect}/) producing 3 distinct
  # PyPI distributions. Each MUST have its own setup.py + setup.cfg.
  - id: spark-python-packaging-variant-shape
    kind: for_each_dir
    select: "python/packaging/{classic,client,connect}"
    require:
      - kind: file_exists
        paths: "{path}/setup.py"
      - kind: file_exists
        paths: "{path}/setup.cfg"
    level: error
    message: >-
      Every PySpark packaging variant under python/packaging/ MUST
      ship setup.py + setup.cfg. The 3 variants
      ({classic,client,connect}) produce 3 distinct PyPI
      distributions: pyspark, pyspark-client, pyspark-connect — each
      published from its own packaging/<variant>/setup.py. A missing
      setup.py would silently drop the variant from the release.

  - id: spark-python-classic-name-pyspark
    kind: file_content_matches
    paths: python/packaging/classic/setup.py
    pattern: '(?m)^\s*name="pyspark",\s*$'
    level: error
    message: >-
      python/packaging/classic/setup.py MUST declare `name="pyspark"`.
      The published PyPI package name is `pyspark`; drift here breaks
      `pip install pyspark` because the wheel name no longer matches.

  - id: spark-python-connect-name-pyspark-connect
    kind: file_content_matches
    paths: python/packaging/connect/setup.py
    pattern: '(?m)^\s*name="pyspark-connect",\s*$'
    level: error
    message: >-
      python/packaging/connect/setup.py MUST declare
      `name="pyspark-connect"`. The published PyPI package name is
      `pyspark-connect`.

  - id: spark-python-client-name-pyspark-client
    kind: file_content_matches
    paths: python/packaging/client/setup.py
    pattern: '(?m)^\s*name="pyspark-client",\s*$'
    level: error
    message: >-
      python/packaging/client/setup.py MUST declare
      `name="pyspark-client"`. The published PyPI package name is
      `pyspark-client`.

  - id: spark-python-classic-license-apache
    kind: file_content_matches
    paths: python/packaging/classic/setup.py
    pattern: '(?m)^\s*license="Apache-2\.0",\s*$'
    level: error
    message: >-
      python/packaging/classic/setup.py MUST declare
      `license="Apache-2.0"` (SPDX form, PEP 639). PyPI metadata
      validation checks this.

  - id: spark-python-pyproject-present
    kind: file_exists
    paths: pyproject.toml
    root_only: true
    level: error
    message: >-
      The root pyproject.toml is where Spark configures
      [tool.ruff] + [tool.black] for PySpark. dev/lint-python
      reads it via ruff's discovery walk. NOTE — Spark's pyproject.toml
      is config-only; the actual package metadata lives in the
      3 setup.py files under python/packaging/.

  - id: spark-python-pyproject-declares-ruff-config
    kind: toml_path_matches
    paths: pyproject.toml
    path: "$.tool.ruff['line-length']"
    matches: '^100$'
    level: warning
    message: >-
      pyproject.toml [tool.ruff] line-length should be 100 (the
      Spark project convention, validated by dev/lint-python --ruff).

  - id: spark-python-mypy-config-present
    kind: file_exists
    paths: python/mypy.ini
    level: warning
    message: >-
      python/mypy.ini is the type-checking config for PySpark. The
      build_python_*.yml workflows shell into python/ and run
      `mypy --config-file mypy.ini`. Without it, mypy reverts to
      upstream defaults and the type-check pass becomes ineffective.

  - id: spark-python-manifest-in-present
    kind: file_exists
    paths: python/MANIFEST.in
    level: error
    message: >-
      python/MANIFEST.in declares which files setuptools should
      include in the source distribution. Required for the
      `python setup.py sdist` step that the release-build pipeline
      runs.

  # R: SparkR is at R/pkg/, packaged for CRAN.
  - id: spark-r-description-present
    kind: file_exists
    paths: R/pkg/DESCRIPTION
    level: error
    message: >-
      R/pkg/DESCRIPTION is the R package manifest (CRAN-required).
      Removing it breaks `R CMD build R/pkg/` and the
      build_sparkr_window.yml workflow, and means the package
      vanishes from CRAN at the next release.

  - id: spark-r-description-package-name
    kind: file_content_matches
    paths: R/pkg/DESCRIPTION
    pattern: '(?m)^Package:\s*SparkR$'
    level: error
    message: >-
      R/pkg/DESCRIPTION `Package:` MUST be `SparkR`. The CRAN package
      name is `SparkR`; drift here breaks `install.packages("SparkR")`.

  - id: spark-r-description-license
    kind: file_content_matches
    paths: R/pkg/DESCRIPTION
    pattern: '(?m)^License:\s*Apache License'
    level: error
    message: >-
      R/pkg/DESCRIPTION `License:` MUST declare the Apache License
      (the canonical form is `Apache License (== 2.0)` for SparkR).

  - id: spark-r-description-namespace-present
    kind: file_exists
    paths: R/pkg/NAMESPACE
    level: error
    message: >-
      R/pkg/NAMESPACE is the CRAN-required exports manifest for
      SparkR. Missing or incomplete NAMESPACE = `R CMD check`
      failure.

  - id: spark-r-cran-comments-present
    kind: file_exists
    paths: R/pkg/cran-comments.md
    level: warning
    message: >-
      R/pkg/cran-comments.md is the CRAN-submission notes file the
      Spark release manager updates before each CRAN upload.

  # ──────────────────────────────────────────────────────────────────
  # Per-language tool config files at the canonical locations the
  # lint-* scripts under dev/ assume.
  # ──────────────────────────────────────────────────────────────────

  - id: spark-scalastyle-config-present
    kind: file_exists
    paths: scalastyle-config.xml
    root_only: true
    level: error
    message: >-
      scalastyle-config.xml is required at the repo root — dev/scalastyle
      and the SBT scalastyle plugin both discover it via parent-walk.
      Without it, scalastyle silently no-ops (passing every file)
      and CI catches Scala style drift only at release-build time.

  - id: spark-scalafmt-config-present
    kind: file_exists
    paths: dev/.scalafmt.conf
    level: error
    message: >-
      dev/.scalafmt.conf pins the scalafmt version + dialect for the
      sql/connect modules (which are actively scalafmt-enforced; the
      rest of Spark uses scalastyle but not scalafmt yet). dev/lint-scala
      runs `mvn scalafmt:format -Dscalafmt.validateOnly=true` against
      sql/connect/*.

  - id: spark-checkstyle-config-present
    kind: file_exists
    paths: dev/checkstyle.xml
    level: error
    message: >-
      dev/checkstyle.xml pins the Java style rules (303 lines).
      dev/lint-java runs `mvn checkstyle:check` against every Java
      module; without checkstyle.xml the goal silently no-ops.

  - id: spark-checkstyle-suppressions-present
    kind: file_exists
    paths: dev/checkstyle-suppressions.xml
    level: warning
    message: >-
      dev/checkstyle-suppressions.xml lists files checkstyle must
      skip (typically generated or vendored). Required by
      dev/lint-java.

  - id: spark-eslint-config-present
    kind: file_exists
    paths: dev/eslint.js
    level: warning
    message: >-
      dev/eslint.js pins the JavaScript style rules for the in-tree
      web UI assets under core/src/main/resources/.../static/ and
      ui-test/. dev/lint-js runs eslint against each.

  - id: spark-tox-ini-present
    kind: file_exists
    paths: dev/tox.ini
    level: warning
    message: >-
      dev/tox.ini configures flake8 (the legacy Python linter Spark
      runs in addition to ruff). dev/lint-python --flake8 reads it.

  - id: spark-rat-excludes-content-format
    kind: file_min_lines
    paths: dev/.rat-excludes
    min_lines: 10
    level: warning
    message: >-
      dev/.rat-excludes is the path-pattern registry consumed by
      Apache RAT. Should contain at minimum the standard set of
      build-output and binary-fixture exclusions. The full
      "every pattern resolves to ≥1 file" check needs the v0.10+
      `registry_paths_resolve` rule kind that arrow + cpython +
      rust-lang/rust also need.

  # ──────────────────────────────────────────────────────────────────
  # The per-language dev/lint-* scripts — the orchestration layer.
  # Spark does NOT use pre-commit as the orchestrator (unlike arrow);
  # the lint-* scripts are stand-alone shell drivers fanned out by
  # the GitHub Actions matrix workflows.
  # ──────────────────────────────────────────────────────────────────

  - id: spark-lint-scala-script-present
    kind: file_exists
    paths: dev/lint-scala
    level: error
    message: >-
      dev/lint-scala is the Scala lint orchestrator (runs scalastyle
      + scalafmt:validateOnly). The build_*.yml workflows call it
      directly.

  - id: spark-lint-java-script-present
    kind: file_exists
    paths: dev/lint-java
    level: error
    message: >-
      dev/lint-java is the Java lint orchestrator (runs `mvn
      checkstyle:check`). The build_*.yml workflows call it directly.

  - id: spark-lint-python-script-present
    kind: file_exists
    paths: dev/lint-python
    level: error
    message: >-
      dev/lint-python is the Python lint orchestrator (runs ruff +
      black + mypy + flake8 + dev/check_pyspark_custom_errors.py).
      The build_python_*.yml workflows call it directly.

  - id: spark-lint-r-script-present
    kind: file_exists
    paths: dev/lint-r
    level: error
    message: >-
      dev/lint-r is the R lint orchestrator (runs lintr via
      dev/lint-r.R). The build_sparkr_window.yml workflow calls it.

  - id: spark-lint-js-script-present
    kind: file_exists
    paths: dev/lint-js
    level: warning
    message: >-
      dev/lint-js is the JavaScript lint orchestrator (runs eslint
      against the web UI static assets).

  - id: spark-test-dependencies-script-present
    kind: file_exists
    paths: dev/test-dependencies.sh
    level: warning
    message: >-
      dev/test-dependencies.sh regenerates dev/deps/spark-deps-* and
      asserts the diff against the committed file is empty. This is
      the Maven-equivalent of cargo's lockfile freshness check —
      rev-bumping a transitive dep without running this script
      bricks the next release.

  - id: spark-deps-manifest-present
    kind: file_exists
    paths: dev/deps/spark-deps-hadoop-3-hive-2.3
    level: error
    message: >-
      dev/deps/spark-deps-hadoop-3-hive-2.3 is the pinned Maven
      dependency manifest (one line per `<groupId>/<artifactId>/
      <version>//<artifactId>-<version>.jar`). dev/test-dependencies.sh
      regenerates it; CI fails if the diff is non-empty. Same shape
      as Cargo.lock for Rust or pnpm-lock.yaml for Node — the
      committed-lockfile discipline.

  # ──────────────────────────────────────────────────────────────────
  # gitattributes: spark uses .gitattributes to enforce per-extension
  # line-ending policy (LF for Java/Scala/Python/R/XML, CRLF for
  # Windows .bat/.cmd files). Same shape as cpython and arrow.
  # ──────────────────────────────────────────────────────────────────

  - id: spark-gitattributes-present
    kind: file_exists
    paths: .gitattributes
    root_only: true
    level: warning
    message: >-
      .gitattributes pins the per-extension line-ending policy
      (LF for *.java/*.scala/*.py/*.R/*.xml; CRLF for *.bat/*.cmd).
      Without it, Windows checkouts produce mixed line endings and
      `git diff` lights up the entire tree.

  # ──────────────────────────────────────────────────────────────────
  # GitHub Actions hardening — re-state the SHA-pinning rule at
  # warning level here because spark has 72 workflows + a huge build
  # matrix; the supply-chain blast radius is correspondingly large.
  # ──────────────────────────────────────────────────────────────────

  - id: spark-workflow-actions-pinned-by-sha
    kind: yaml_path_matches
    paths: ".github/workflows/*.yml"
    path: "$.jobs.*.steps[?match(@.uses, '^[^/]+/[^/@]+@[a-f0-9]{40}')].uses"
    matches: '^[^/]+/[^/@]+@[a-f0-9]{40}'
    level: warning
    message: >-
      Third-party actions in workflow steps should be pinned to a
      40-char commit SHA, not a floating tag. spark has 72 workflows
      under .github/workflows/; supply-chain integrity matters at
      this scale. The OpenSSF Scorecard "Pinned-Dependencies" check
      covers this on a nightly cadence; alint surfaces the same gate
      at PR time.

  # ──────────────────────────────────────────────────────────────────
  # Hygiene: Spark-specific tracked-artefact patterns extending the
  # bundled hygiene/no-tracked-artifacts ruleset.
  # ──────────────────────────────────────────────────────────────────

  - id: spark-no-tracked-derby-log
    kind: file_absent
    paths: "**/derby.log"
    git_tracked_only: true
    level: warning
    message: >-
      derby.log is a runtime artefact emitted by the embedded Derby
      DB used in some Spark integration tests. Should never be
      tracked. dev/.rat-excludes lists it, but committed files
      bypass RAT's scope.

  - id: spark-no-tracked-pyspark-coverage
    kind: dir_absent
    paths: "**/pyspark-coverage-site"
    git_tracked_only: true
    level: warning
    message: >-
      pyspark-coverage-site/ is a generated coverage-report directory
      from `dev/run-tests-with-coverage`. Should never be tracked.

  - id: spark-no-tracked-target-rat-results
    kind: file_absent
    paths: "target/rat-results.txt"
    git_tracked_only: true
    level: warning
    message: >-
      target/rat-results.txt is the runtime output of dev/check-license
      (the RAT runner). Should never be tracked.

  # ──────────────────────────────────────────────────────────────────
  # Per-language lint-script shell-outs — wrap the existing dev/lint-*
  # scripts so a single `alint check` run drives the whole structural
  # pipeline plus the per-language linters. Each is gated by a
  # `paths:` filter pointing at the canonical config-file the script
  # reads (so the rule no-ops if you delete the config).
  # ──────────────────────────────────────────────────────────────────

  - id: spark-lint-scala-run
    kind: command
    paths: scalastyle-config.xml
    command: ["dev/lint-scala"]
    timeout: 600
    level: error

  - id: spark-lint-java-run
    kind: command
    paths: dev/checkstyle.xml
    command: ["dev/lint-java"]
    timeout: 600
    level: error

  - id: spark-lint-python-run
    kind: command
    paths: pyproject.toml
    command: ["dev/lint-python", "--ruff"]
    timeout: 300
    level: error

  - id: spark-lint-r-run
    kind: command
    paths: R/pkg/DESCRIPTION
    command: ["dev/lint-r"]
    timeout: 300
    level: warning

  - id: spark-lint-js-run
    kind: command
    paths: dev/eslint.js
    command: ["dev/lint-js"]
    timeout: 300
    level: warning

  - id: spark-check-license-run
    kind: command
    paths: dev/.rat-excludes
    command: ["dev/check-license"]
    timeout: 300
    level: error

  - id: spark-check-protos-run
    kind: command
    paths: dev/check-protos.py
    command: ["python3", "dev/check-protos.py"]
    timeout: 300
    level: warning

  - id: spark-test-dependencies-run
    kind: command
    paths: dev/deps/spark-deps-hadoop-3-hive-2.3
    command: ["dev/test-dependencies.sh", "--replace-manifest"]
    timeout: 1200
    level: warning
