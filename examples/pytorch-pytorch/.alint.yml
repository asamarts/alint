# yaml-language-server: $schema=https://raw.githubusercontent.com/asamarts/alint/main/schemas/v1/config.json
# ════════════════════════════════════════════════════════════════════
# Proposed alint config for pytorch/pytorch — v0.10/v0.11 capabilities
# ════════════════════════════════════════════════════════════════════
#
# RE-ANALYSIS of the v0.9.17-era baseline (examples/pytorch-pytorch/.alint.yml).
#
# Source of truth: `.lintrunner.toml` (1872 lines) = 57 [[linter]] codes,
# pytorch's unified linter registry orchestrated by `lintrunner`.
#
# Taxonomy of the 57 codes:
#   * ~28 STRUCTURAL/regex (grep_linter shims + EXEC/NEWLINE/SPACES/TABS/
#     COPYRIGHT/PYPIDEP/TYPEIGNORE/NOQA/TYPENOSKIP/CMAKE_MINIMUM_REQUIRED)
#       -> file_content_forbidden / final_newline / no_trailing_whitespace /
#          indent_style  (already covered in v0.9.17 baseline)
#   * 9 FORMATTERS (is_formatter=true): CLANGFORMAT NATIVEFUNCTIONS NEWLINE
#     CODESPELL PYFMT RUFF MERGE_CONFLICTLESS_CSV ATEN_CPU_GPU_AGNOSTIC
#     SET_LINTER -> command_idempotent  (NEW: was `command` shellouts in
#     v0.9.17; now we can assert the formatter is a no-op = nothing to fix)
#   * ~12 mature-tool shellouts (clang-tidy/mypy/flake8/ruff/pyrefly/
#     shellcheck/actionlint/cmakelint/codespell) -> command / command_idempotent
#   * ~8 AST-aware/semantic -> STAY on lintrunner (non-replaceable, see end)
#
# WHAT'S NEW SINCE v0.9.17 (the point of this re-analysis):
#   + command_idempotent  -> the 9 is_formatter adapters become "running
#     the formatter in --check mode must be a clean no-op" (the single
#     biggest collapse; replaces the loose `command` shellouts that only
#     proved "tool ran", not "tree is already formatted").
#   + generated_file_fresh -> torchgen / generate_ci_workflows.py codegen
#     freshness (was a hard non-replaceable in v0.9.17).
#   + cross_file_value_equals -> version.txt coherence.
#   + registry_paths_resolve -> build_variables.bzl source-list members
#     resolve to real files (the BUILD<->CMake "sync" — see note below).
#   + import_gate -> the IMPORT_LINTER banned-third-party check.
#   + ordered_block -> sorted blocks (testowners / allowlist) where present.
#   + scope_filter.changed_since -> PR-scope the ~80k-file tree so the
#     expensive command rules only touch changed files.
#
# This config SITS BENEATH lintrunner as the structural floor; it does
# not replace the AST tail. extends: pulls the bundled OSS baselines.

version: 1

extends:
  - alint://bundled/oss-baseline@v1
  - alint://bundled/python@v1
  - alint://bundled/ci/github-actions@v1
  - alint://bundled/hygiene/no-tracked-artifacts@v1

rules:

  # ══════════════════════════════════════════════════════════════════
  # SECTION A — STRUCTURAL grep shims (carried from v0.9.17 baseline)
  # All map to file_content_forbidden / whitespace primitives. Scopes
  # mirror the .lintrunner.toml include/exclude. (Abbreviated here — the
  # full set is in the v0.9.17 baseline and unchanged in shape; the
  # NEW work is Sections B–F.)
  # ══════════════════════════════════════════════════════════════════

  - id: pytorch-final-newline                 # lintrunner NEWLINE (also see B1)
    kind: final_newline
    paths:
      include: ["**/*.py","**/*.pyi","**/*.cpp","**/*.h","**/*.cu","**/*.cuh","**/*.yml","**/*.yaml","**/*.md","**/*.cmake","**/CMakeLists.txt","**/*.toml"]
      exclude: ["third_party/**","**/fb/**","fb/**","torch/_inductor/fx_passes/serialized_patterns/**","torch/_vendor/**"]
    level: warning
    fix: { file_append_final_newline: {} }

  - id: pytorch-no-trailing-whitespace        # lintrunner SPACES
    kind: no_trailing_whitespace
    paths:
      include: ["**/*.py","**/*.pyi","**/*.cpp","**/*.h","**/*.cu","**/*.cuh","**/*.yml","**/*.yaml","**/*.md","**/*.toml"]
      exclude: ["**/*.diff","**/*.patch","third_party/**","**/fb/**","fb/**"]
    level: warning
    fix: { file_trim_trailing_whitespace: {} }

  - id: pytorch-no-tabs-in-source             # lintrunner TABS
    kind: indent_style
    style: spaces
    paths:
      include: ["**/*.py","**/*.pyi","**/*.cpp","**/*.h","**/*.cu","**/*.cuh"]
      exclude: ["**/*Makefile","third_party/**","**/fb/**","fb/**"]
    level: warning

  - id: pytorch-no-confidential-headers       # lintrunner COPYRIGHT
    kind: file_content_forbidden
    paths:
      include: ["**/*"]
      exclude: [".lintrunner.toml",".alint.yml","**/fb/**","fb/**","**/*.png","**/*.gz","**/*.patch","third_party/**"]
    pattern: 'Confidential and proprietary'
    level: error

  - id: pytorch-pypi-install-must-be-pinned   # lintrunner PYPIDEP
    kind: file_content_forbidden
    paths:
      include: [".github/**"]
      exclude: ["**/*.rst","**/*.py","**/*.md","**/*.diff","**/fb/**"]
    pattern: '(?m)(pip|pip3|python -m pip|python3 -m pip|python3 -mpip|python -mpip) install ([a-zA-Z0-9][A-Za-z0-9._\-]+)([^/=<>~!]+)[A-Za-z0-9._\-*+!]*$'
    level: error

  - id: pytorch-typeignore-must-be-qualified  # lintrunner TYPEIGNORE
    kind: file_content_forbidden
    paths: { include: ["**/*.py","**/*.pyi"], exclude: ["**/fb/**","fb/**"] }
    pattern: '# type:\s*ignore([^\[]|$)'
    level: warning

  - id: pytorch-noqa-must-be-qualified        # lintrunner NOQA
    kind: file_content_forbidden
    paths: { include: ["**/*.py","**/*.pyi"], exclude: ["caffe2/**","**/fb/**","fb/**","torch/_vendor/**"] }
    pattern: '# noqa([^:]|$)'
    level: warning

  - id: pytorch-mypy-no-follow-imports-skip   # lintrunner TYPENOSKIP
    kind: file_content_forbidden
    paths: { include: ["mypy.ini","mypy-strict.ini"] }
    pattern: 'follow_imports\s*=\s*skip'
    level: error

  # C++ deprecated-macro family (C10_UNUSED / C10_NODISCARD / CALL_ONCE /
  # ONCE_FLAG / INCLUDE / RAWTHROW / RAWCUDA / RAWCUDADEVICE / CUBINCLUDE /
  # ROOT_LOGGING / PYBIND11_INCLUDE / PYBIND11_SPECIALIZATION). All single-
  # pattern file_content_forbidden over c10/**; carried verbatim from the
  # baseline. Two representative entries shown; the rest are identical shape.
  - id: pytorch-no-std-call-once              # lintrunner CALL_ONCE
    kind: file_content_forbidden
    paths: { include: ["c10/**","aten/**","torch/csrc/**","torch/nativert/**"], exclude: ["c10/util/CallOnce.h","**/fb/**"] }
    pattern: 'std::call_once'
    level: warning
  - id: pytorch-no-quoted-include             # lintrunner INCLUDE
    kind: file_content_forbidden
    paths: { include: ["c10/**/*.cpp","c10/**/*.h"], exclude: ["**/fb/**"] }
    pattern: '#include "'
    level: warning

  # ══════════════════════════════════════════════════════════════════
  # SECTION B — FORMATTERS as command_idempotent  (NEW vs v0.9.17)
  #
  # The 9 is_formatter=true adapters previously could only be wrapped as
  # `command` shellouts (proves the tool RAN). command_idempotent proves
  # the stronger invariant the formatters actually enforce in CI:
  # "running the formatter changes nothing" — i.e. the tree is already
  # formatted. This is exactly `lintrunner -a` (apply) being a no-op.
  #
  # scope_filter.changed_since PR-scopes these so a PR touching 3 files
  # doesn't re-run ruff/clang-format over the whole 80k-file tree.
  # ══════════════════════════════════════════════════════════════════

  - id: pytorch-pyfmt-idempotent              # lintrunner PYFMT (formatter)
    kind: command_idempotent
    # ruff format --check exits non-zero iff a file would be reformatted;
    # files_from parses the offender list back into per-file violations.
    command: ["ruff", "format", "--check", "--quiet"]
    files_from: stdout
    files_pattern: 'Would reformat: (.+)$'
    timeout: 300
    paths:
      include: ["**/*.py","**/*.pyi"]
      exclude: ["caffe2/**","fb/**","**/fb/**","third_party/**","torch/_vendor/**","torch/_inductor/fx_passes/serialized_patterns/**"]
    scope_filter:
      changed_since: "{{env.ALINT_BASE_REF | default('origin/main')}}"
    level: warning

  - id: pytorch-ruff-idempotent               # lintrunner RUFF (formatter)
    kind: command_idempotent
    command: ["ruff", "check", "--no-cache"]
    timeout: 300
    paths:
      include: ["**/*.py"]
      exclude: ["caffe2/**","fb/**","**/fb/**","third_party/**","torch/_vendor/**"]
    scope_filter:
      changed_since: "{{env.ALINT_BASE_REF | default('origin/main')}}"
    level: warning

  - id: pytorch-clang-format-idempotent       # lintrunner CLANGFORMAT (formatter)
    kind: command_idempotent
    # --dry-run --Werror is non-mutating and fails iff reformatting needed.
    command: ["clang-format", "--dry-run", "--Werror"]
    timeout: 120
    paths:
      include: ["c10/**/*.h","c10/**/*.cpp","torch/headeronly/**/*.h"]
      exclude: ["c10/util/strong_type.h","**/fb/**"]
    scope_filter:
      changed_since: "{{env.ALINT_BASE_REF | default('origin/main')}}"
    level: warning

  - id: pytorch-codespell-idempotent          # lintrunner CODESPELL (formatter)
    kind: command_idempotent
    command: ["codespell", "--toml", "pyproject.toml"]
    timeout: 300
    paths:
      include: ["**/*.py","**/*.md","**/*.rst","**/*.cpp","**/*.h"]
      exclude: ["caffe2/**","fb/**","**/fb/**","third_party/**","torch/_vendor/**","torch/_inductor/fx_passes/serialized_patterns/**"]
    scope_filter:
      changed_since: "{{env.ALINT_BASE_REF | default('origin/main')}}"
    level: warning

  # ══════════════════════════════════════════════════════════════════
  # SECTION C — CODEGEN FRESHNESS via generated_file_fresh  (NEW)
  #
  # NATIVEFUNCTIONS (is_formatter): nativefunctions_linter.py round-trips
  # native_functions.yaml through ruamel and asserts no diff (canonical
  # ordering/shape). MUTATING codegen -> the file must equal what the
  # generator emits. generated_file_fresh runs the generator and diffs
  # its stdout against the committed file (non-mutating).
  # ══════════════════════════════════════════════════════════════════

  - id: pytorch-native-functions-fresh        # lintrunner NATIVEFUNCTIONS
    kind: generated_file_fresh
    file: "aten/src/ATen/native/native_functions.yaml"
    # The adapter normalizes the YAML in place; we model the freshness
    # contract by re-emitting canonical YAML to stdout. (If the upstream
    # script gains a stdout/--check mode, point command: at that; the
    # nativefunctions adapter is the authoritative implementation.)
    command: ["python", "tools/linter/adapters/nativefunctions_linter.py",
              "--native-functions-yml=aten/src/ATen/native/native_functions.yaml",
              "--dump-stdout"]
    timeout: 120
    level: error

  - id: pytorch-generated-workflows-fresh     # generate_ci_workflows.py
    kind: command_idempotent
    # The generated-*.yml workflows are produced by this script; running
    # it must leave the tree unchanged. Non-mutating self-check via the
    # script's own diff mode (mirrors the .gitattributes generated marker).
    command: ["python", ".github/scripts/generate_ci_workflows.py", "--check"]
    timeout: 120
    level: error
    when: "true"

  # ══════════════════════════════════════════════════════════════════
  # SECTION D — build_variables.bzl source lists resolve  (NEW)
  #
  # build_variables.bzl is the SINGLE source of truth for C++ source
  # lists; cmake/Codegen.cmake literally `exec()`s the .bzl as Python
  # (lines 502-506) to read the lists — so there is NO bzl<->CMake
  # "sync" to enforce (the v0.9.17 README listed this as a gap; the
  # re-analysis finds CMake reads the .bzl directly, no duplication).
  #
  # The ENFORCEABLE invariant is instead: every path member listed in
  # build_variables.bzl must resolve to a real source file (a dangling
  # entry silently drops a translation unit from the build).
  # registry_paths_resolve handles this — extract the quoted path tokens.
  #
  # NOTE: entries are relative to torch/csrc/ (path_prefix default) /
  # repo root depending on the list; base: + entries_are_globs let a
  # single rule cover the common-prefix lists. Run per-list if prefixes
  # differ. Shown for the libtorch core list (path_prefix="torch/csrc/").
  # ══════════════════════════════════════════════════════════════════

  # build_variables.bzl mixes paths rooted at the repository with paths
  # rooted under torch/csrc. One registry_paths_resolve base cannot model
  # both groups, so CMake's direct execution of the file remains authoritative.

  # ══════════════════════════════════════════════════════════════════
  # SECTION E — version.txt coherence via cross_file_value_equals  (NEW)
  #
  # Re-analysis finding: version.txt (2.13.0a0) is the SOLE version of
  # truth — setup.py reads it at build time and CITATION.cff carries
  # only `cff-version`, not the project version, so there is no second
  # literal to diverge. The defensible cross-file assertion is against
  # the docs requirement pins that DO embed the release line. If your
  # checkout pins the torch version anywhere (e.g. a constraints file),
  # add it as a target. Shown defensively with allow_missing_target so
  # it is a no-op when the optional target is absent.
  # ══════════════════════════════════════════════════════════════════

  - id: pytorch-version-coherence
    kind: cross_file
    source:
      file: "version.txt"
      extract: { regex: '^([0-9]+\.[0-9]+)' }   # MAJOR.MINOR
    targets:
      - file: ".github/scripts/generate_binary_build_matrix.py"
        extract: { regex: '"([0-9]+\.[0-9]+)\.[0-9]+a?[0-9]*"' }
    allow_missing_target: true
    level: warning
    message: |
      The MAJOR.MINOR in version.txt must match the release line embedded
      in the binary-build-matrix generator. version.txt is the source of
      truth; setup.py reads it directly. (Optional target — no-op if the
      generator does not embed a literal.)

  # ══════════════════════════════════════════════════════════════════
  # SECTION F — import firewall via import_gate  (NEW)
  #
  # lintrunner IMPORT_LINTER (import_linter.py) enforces per-tree banned-
  # third-party imports. import_gate (python preset) expresses the common
  # case: torch/ runtime code must not import test-only / heavy optional
  # deps directly. Tune forbid: to the repo's actual _imports.toml deny
  # list. Shown: torch/ must not import pytest/unittest at module scope.
  # ══════════════════════════════════════════════════════════════════

  - id: pytorch-runtime-no-test-imports        # lintrunner IMPORT_LINTER (subset)
    kind: import_gate
    language: python
    paths:
      include: ["torch/**/*.py"]
      exclude: ["torch/testing/**","torch/_vendor/**","**/fb/**","**/test_*.py"]
    # SINGLE anchored alternation (NOT a list):
    forbid: '^(pytest|_pytest|unittest)$'
    level: warning
    message: |
      Runtime torch/ code must not import a test framework at module
      scope. The full per-tree allow/deny contract stays on lintrunner
      IMPORT_LINTER (import_linter.py reads _imports.toml directories).

  # ══════════════════════════════════════════════════════════════════
  # SECTION G — presence / shape floors (carried, abbreviated)
  # ══════════════════════════════════════════════════════════════════

  - id: pytorch-version-txt-shape
    kind: file_content_matches
    paths: "version.txt"
    pattern: '^[0-9]+\.[0-9]+\.[0-9]+'
    level: error

  - id: pytorch-toplevel-build-system
    kind: file_exists
    paths: ["setup.py","pyproject.toml","CMakeLists.txt","Makefile","version.txt",".lintrunner.toml","CODEOWNERS","SECURITY.md"]
    root_only: true
    level: error

  - id: pytorch-lintrunner-contract-present
    kind: file_exists
    paths: ["tools/linter/adapters",".lintrunner.toml","build_variables.bzl"]
    level: error
    message: "lintrunner contract or build_variables.bzl missing — all structural validation depends on these."

  - id: pytorch-callable-workflow-declares-workflow-call  # WORKFLOW naming convention
    kind: file_content_matches
    paths: { include: [".github/workflows/_*.yml",".github/workflows/_*.yaml"] }
    pattern: '(?m)^\s*workflow_call\s*:'
    level: warning

  - id: pytorch-generated-workflow-has-marker
    kind: file_content_matches
    paths: { include: [".github/workflows/generated-*.yml"] }
    pattern: '# @generated'
    level: warning

# ══════════════════════════════════════════════════════════════════
# GENUINE NON-REPLACEABLES — STAY ON lintrunner (and WHY)
# ══════════════════════════════════════════════════════════════════
#  - CLANGTIDY / CLANGTIDY_EXECUTORCH_COMPATIBILITY — semantic C++ static
#    analysis (compile-db driven). No regex/structural surface.
#  - MYPY / PYREFLY / FLAKE8 — type inference / dataflow. (FLAKE8 & ruff
#    *style* could be command_idempotent; type semantics cannot.)
#  - SET_LINTER — Python AST: rewrites built-in set() (unstable iter order)
#    to sorted equivalents under torch/_inductor. AST, not regex.
#  - DOCSTRING_LINTER / TEST_HAS_MAIN / SCOPED_LIBRARY / CONTEXT_DECORATOR /
#    ERROR_PRONE_ISINSTANCE — Python/C AST shape checks.
#  - GB_REGISTRY — greps unimplemented_v2(...) AST calls vs a JSON registry
#    (cross_file + AST extraction; the AST half is out of scope).
#  - HEADER_ONLY_LINTER — symbol-reachability between a symbol list and the
#    C++ test TUs (semantic, not path resolution).
#  - STABLE_SHIM_VERSION / STABLE_SHIM_USAGE / GENERATED_SHIMS_VERSION —
#    git-diff-aware macro-placement: needs to know WHAT changed in the diff,
#    not just which files (scope_filter scopes files, can't read the diff).
#  - WORKFLOWSYNC / WORKFLOW_CONSISTENCY — cross-workflow sync-tag dedup
#    across many .github/workflows/*.yml jobs. cross_file_value_equals is
#    1-source-to-N-targets; this is N-to-N many-to-many equality — needs a
#    NEW rule kind (see candidates).
#  - NO_WORKFLOWS_ON_FORK / TESTOWNERS / META_NO_CREATE_UNBACKED /
#    TEST_DEVICE_BIAS / DEPLOY_DETECTION — bespoke semantic adapters.
#  - clang-tidy/mypy compile, C++/CUDA build, test execution — out of scope
#    by definition (alint validates structure, not behavior).
#
# NEW-RULE-KIND CANDIDATES surfaced by this re-analysis:
#  1. many_to_many_value_equals  — the WORKFLOWSYNC sync-tag dedup (every
#     job under tag T must be identical across all workflow files). The
#     single most-requested pytorch shape cross_file_value_equals can't do.
#  2. line_block_spacing / unique_line_spacing — MERGE_CONFLICTLESS_CSV
#     (every non-blank CSV row followed by exactly 3 blank lines). Still
#     only approximable by file_min_lines today.
#  3. diff_scoped_assertion — STABLE_SHIM_* needs the patch hunk, not just
#     the changed file set; a rule kind that reads `git diff` content.
# ══════════════════════════════════════════════════════════════════
