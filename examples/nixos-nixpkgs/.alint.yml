# yaml-language-server: $schema=https://raw.githubusercontent.com/asamarts/alint/main/schemas/v1/config.json
# =====================================================================
# alint config for NixOS/nixpkgs — RE-ANALYSIS against v0.10 + v0.11
# capabilities (supersedes the v0.9.17-era examples/.alint.yml).
#
# Repo state: depth-1 clone of NixOS/nixpkgs (2026-05-25),
# 52 592 tracked files at checkout, 756 two-letter shard dirs under
# pkgs/by-name/ (each holding many <pkg>/package.nix subtrees),
# 18 GitHub Actions workflows, 31 054-line maintainer-list.nix,
# 1 681-line licenses.nix, 528-line ci/OWNERS.
#
# nixpkgs's validation surface (catalogued from .github/workflows/
# and ci/):
#
#   WORKFLOWS (.github/workflows/, 18):
#     lint.yml      -> treefmt fmt.check / parse / nixpkgs-vet / commits
#     check.yml     -> commits / manual-file-edits / owners(codeowners)
#     eval.yml      -> Nix eval + rebuild diffing
#     build.yml / test.yml / merge-group.yml -> build matrix / merge queue
#     bot.yml / backport.yml / comment.yml / edited.yml / review.yml /
#     reviewed.yml / teams.yml / periodic-merge*.yml /
#     pull-request-target.yml -> bot orchestration (not structural lint)
#
#   ci/ (the in-tree Nix derivation framework):
#     default.nix          -> treefmt orchestration (formatters below)
#     parse.nix            -> nix-instantiate --parse over all .nix
#     nixpkgs-vet.{sh,nix} -> by-name shape + attribute-set validator
#     codeowners-validator -> ci/OWNERS syntax + dup/file checks
#     pinned.json / update-pinned.sh / supportedVersions.nix
#     github-script/lint-commits.js     -> CONVENTIONAL-COMMIT subject
#     github-script/manual-file-edits.js -> discourage hand-edits of
#                                            generated/teams files
#
#   treefmt formatters (ci/default.nix programs.*):
#     nixfmt, biome (js/json), yamlfmt, keep-sorted, actionlint,
#     zizmor, nixf-diagnose, editorconfig-checker, markdown-code-runner
#
# WHAT CHANGED vs the v0.9.17 baseline (+ newly replaceable):
#   1. for_each_dir package.nix walk -> now ALSO expressible as a
#      registry_paths_resolve over a generated manifest IF one
#      existed; kept as command-backed because no path-manifest file
#      ships (the by-name list is discovered, not declared).
#   2. nixfmt/treefmt collapse: the FOUR separate command rules
#      (treefmt/parse/vet/owners) survive, but the formatting +
#      editorconfig subset now folds into ONE command_idempotent
#      shell-out (nix fmt --check is the idempotency check) +
#      the bundled tooling/editorconfig ruleset.
#   3. keep-sorted blocks in maintainer-list.nix / team-list.nix
#      -> NEW ordered_block rules (v0.10) — alint can now assert the
#      keep-sorted invariant declaratively, no shell-out.
#   4. .gitattributes generated markers -> still file_content_matches
#      (no change; these are presence asserts).
#   5. commit-subject convention (lint-commits.js conventional types)
#      -> STILL NOT REPLACEABLE: no git_commit_subject_matches kind.
#      See NEW-KIND CANDIDATES at bottom.
# =====================================================================

version: 1

extends:
  # README/LICENSE presence, merge markers, bidi controls, final
  # newline, trailing whitespace. nixpkgs ships COPYING + CONTRIBUTING.
  - alint://bundled/oss-baseline@v1

  # GitHub Actions hardening across the 18 workflows: permissions:{}
  # blocks, action SHA-pinning (every uses: is already @<40-hex> # vN
  # in this tree — see lint.yml), workflow name:. nixpkgs runs a
  # merge-bot with elevated perms via pull-request-target, so this is
  # the highest-leverage hardening surface.
  - alint://bundled/ci/github-actions@v1

  # result symlink / outputs/ / node_modules / target/ guardrails.
  - alint://bundled/hygiene/no-tracked-artifacts@v1

  # .editorconfig root=true + sanity. nixpkgs runs editorconfig-checker
  # as a treefmt formatter, so this is the declarative twin of that
  # CI check (presence + correctness of the .editorconfig itself).
  - alint://bundled/tooling/editorconfig@v1

rules:
  # ─────────────────────────────────────────────────────────────────
  # Top-level entry points (unchanged from baseline).
  # ─────────────────────────────────────────────────────────────────
  - id: nixpkgs-flake-nix-present
    kind: file_exists
    paths: flake.nix
    root_only: true
    level: error
    message: flake.nix is the canonical flake entry point.

  - id: nixpkgs-default-nix-present
    kind: file_exists
    paths: default.nix
    root_only: true
    level: error
    message: default.nix is the canonical non-flake entry point.

  - id: nixpkgs-shell-nix-present
    kind: file_exists
    paths: shell.nix
    root_only: true
    level: warning
    message: shell.nix declares the contributor dev-shell.

  # ─────────────────────────────────────────────────────────────────
  # The CI framework + registries (unchanged presence asserts).
  # ─────────────────────────────────────────────────────────────────
  - id: nixpkgs-ci-default-nix-present
    kind: file_exists
    paths: ci/default.nix
    level: error
    message: ci/default.nix is the in-tree CI derivation entry point.

  - id: nixpkgs-ci-pinned-json-present
    kind: file_exists
    paths: ci/pinned.json
    level: error
    message: ci/pinned.json holds the pinned validator revision.

  - id: nixpkgs-ci-parse-nix-present
    kind: file_exists
    paths: ci/parse.nix
    level: error
    message: ci/parse.nix declares the parse-only Nix check.

  - id: nixpkgs-ci-nixpkgs-vet-script-present
    kind: file_exists
    paths: ci/nixpkgs-vet.sh
    level: error
    message: ci/nixpkgs-vet.sh is the local by-name-shape runner.

  - id: nixpkgs-ci-owners-present
    kind: file_exists
    paths: ci/OWNERS
    level: error
    message: ci/OWNERS is the CODEOWNERS-syntax review-routing file.

  - id: nixpkgs-maintainer-list-present
    kind: file_exists
    paths: maintainers/maintainer-list.nix
    level: error
    message: maintainers/maintainer-list.nix is the maintainer registry.

  - id: nixpkgs-maintainer-list-non-trivial
    kind: file_min_lines
    paths: maintainers/maintainer-list.nix
    min_lines: 1000
    level: warning
    message: >-
      maintainer-list.nix is ~31k lines live; a shrink below 1000
      signals an accidental partial revert during merge.

  - id: nixpkgs-licenses-registry-present
    kind: file_exists
    paths: lib/licenses/licenses.nix
    level: error
    message: lib/licenses/licenses.nix is the SPDX registry.

  - id: nixpkgs-team-list-present
    kind: file_exists
    paths: maintainers/team-list.nix
    level: error
    message: maintainers/team-list.nix declares the named review teams.

  # ─────────────────────────────────────────────────────────────────
  # NEW (v0.10) — keep-sorted invariant via ordered_block.
  #
  # ci/default.nix enables `programs.keep-sorted` in treefmt, and
  # maintainer-list.nix / team-list.nix wrap their big alphabetical
  # lists in `# keep-sorted start ... # keep-sorted end` markers.
  # alint can now assert this ordering DECLARATIVELY — previously
  # this was only enforced by shelling out to keep-sorted under
  # treefmt. The block delimiters are keep-sorted's literal markers.
  # ─────────────────────────────────────────────────────────────────
  # keep-sorted's `block=yes` mode groups multi-line Nix attributes before
  # comparing them. `ordered_block` compares individual lines, so the two
  # maintainer lists remain owned by treefmt instead of being approximated
  # here with a rule that either no-ops or reports false findings.

  # ─────────────────────────────────────────────────────────────────
  # pkgs/by-name structural invariant — every package directory has a
  # package.nix. This is the FILE-shape side of nixpkgs-vet; the
  # attribute-set side (basename == attr name, pkgs.<name> resolves)
  # needs Nix eval and stays on nixpkgs-vet.
  #
  # Kept as for_each_dir (NOT registry_paths_resolve): the by-name
  # list is DISCOVERED from the filesystem, not declared in a manifest
  # file, so there is no `source:` for registry_paths_resolve to read.
  # registry_paths_resolve fits the INVERSE case (a manifest of
  # declared paths that must resolve) — see ci/OWNERS note below.
  # ─────────────────────────────────────────────────────────────────
  - id: nixpkgs-by-name-prefix-dirs-have-package
    kind: for_each_dir
    select: "pkgs/by-name/*/*"
    require:
      - kind: file_exists
        paths: "{path}/package.nix"
    level: error
    message: >-
      Every pkgs/by-name/<2-letter>/<pkg>/ directory MUST ship a
      package.nix (file-shape side of the nixpkgs-vet by-name
      invariant). Largest single iteration in this config (~tens of
      thousands of package dirs) — perf-stressed by design.

  # ─────────────────────────────────────────────────────────────────
  # .gitattributes generated-file markers (presence asserts; no
  # new kind applies — these are linguist-generated annotations).
  # ─────────────────────────────────────────────────────────────────
  - id: nixpkgs-gitattributes-marks-haskell-generated
    kind: file_content_matches
    paths: .gitattributes
    pattern: '(?m)^pkgs/development/haskell-modules/hackage-packages\.nix\s+linguist-generated'
    level: warning
    message: hackage-packages.nix must be marked linguist-generated.

  - id: nixpkgs-gitattributes-marks-cargo-lock-generated
    kind: file_content_matches
    paths: .gitattributes
    pattern: '(?m)^\*\*/Cargo\.lock\s+linguist-generated'
    level: warning
    message: '**/Cargo.lock must be marked linguist-generated.'

  - id: nixpkgs-gitattributes-marks-yarn-lock-generated
    kind: file_content_matches
    paths: .gitattributes
    pattern: '(?m)^\*\*/yarn\.lock\s+linguist-generated'
    level: warning
    message: '**/yarn.lock must be marked linguist-generated.'

  # ─────────────────────────────────────────────────────────────────
  # GitHub config presence.
  # ─────────────────────────────────────────────────────────────────
  - id: nixpkgs-dependabot-yml-present
    kind: file_exists
    paths: .github/dependabot.yml
    level: warning
    message: dependabot.yml drives weekly action SHA-pin refresh.

  - id: nixpkgs-dependabot-includes-actions
    kind: yaml_path_matches
    paths: .github/dependabot.yml
    path: "$.updates[?@['package-ecosystem'] == 'github-actions'].directory"
    matches: '^/$'
    level: warning
    message: dependabot must declare a github-actions ecosystem at /.

  - id: nixpkgs-checkout-action-present
    kind: file_exists
    paths: .github/actions/checkout/action.yml
    level: warning
    message: >-
      The composite checkout action enforces the
      merged-as-untrusted trust boundary every workflow shells through.

  - id: nixpkgs-pr-template-present
    kind: file_exists
    paths: .github/PULL_REQUEST_TEMPLATE.md
    level: warning
    message: The PR template is the per-PR contributor checklist.

  # ─────────────────────────────────────────────────────────────────
  # Shell-out to existing tooling. The formatting/editorconfig subset
  # now collapses into ONE command_idempotent rule (v0.10) — `nix fmt`
  # is treefmt, and treefmt is idempotent by construction, so the
  # --check invocation is exactly an idempotency assertion. This
  # replaces the old standalone `treefmt` + `actionlint` + `zizmor`
  # command rules (all run as treefmt formatters under ci/default.nix).
  #
  # Each rule is gated by `paths:` pointing at a file the tool reads,
  # so it no-ops if the canonical config-of-record is deleted.
  # ─────────────────────────────────────────────────────────────────
  - id: nixpkgs-treefmt-idempotent
    kind: command_idempotent
    paths: ci/default.nix
    command: ["nix-build", "ci", "-A", "fmt.check"]
    timeout: 600
    level: error
    message: >-
      treefmt (nixfmt + biome + yamlfmt + keep-sorted + actionlint +
      zizmor + nixf-diagnose + editorconfig-checker) must be a no-op.
      Replaces the v0.9.17 separate treefmt/actionlint/zizmor command
      rules — all three are treefmt formatters in ci/default.nix.

  - id: nixpkgs-parse-check
    kind: command
    paths: ci/parse.nix
    command: ["nix-build", "ci", "-A", "parse", "--keep-going"]
    timeout: 600
    level: error

  - id: nixpkgs-vet-check
    kind: command
    paths: ci/nixpkgs-vet.sh
    command: ["./ci/nixpkgs-vet.sh", "master"]
    timeout: 600
    level: error

  - id: nixpkgs-codeowners-validator-check
    kind: command
    paths: ci/OWNERS
    command: ["nix-build", "ci", "-A", "codeownersValidator"]
    timeout: 300
    level: warning

  # ─────────────────────────────────────────────────────────────────
  # GENUINE NON-REPLACEABLES (keep the existing tool):
  #
  #   - Nix EVALUATION (parse.nix / eval / nixpkgs-vet attribute walk,
  #     lib/tests): alint reads files at rest, it does not
  #     nix-instantiate. The semantic by-name attribute check
  #     (basename == inferred attr name; pkgs.<name> resolves) is
  #     fundamentally an eval task.
  #   - nixfmt/biome/yamlfmt SEMANTIC formatting: alint can assert
  #     idempotency (command_idempotent above) but cannot reproduce
  #     a Nix pretty-printer.
  #   - meta.maintainers / meta.license cross-references: each
  #     package's meta.maintainers handle must resolve to an entry in
  #     maintainer-list.nix, and meta.license to licenses.nix. These
  #     live inside .nix attribute sets reachable only by eval —
  #     cross_file_value_equals / registry_paths_resolve cannot read
  #     a Nix attribute value (no nix extractor; would need a
  #     `nix:` extract that doesn't exist).
  #   - ci/OWNERS pattern resolution: registry_paths_resolve CAN
  #     assert each declared path exists on disk, BUT CODEOWNERS
  #     glob syntax (leading /, trailing /, team tokens after the
  #     pattern) is not a plain lines/json path list — it needs a
  #     CODEOWNERS extractor. codeowners-validator stays.
  #   - manual-file-edits.js (discourage hand-editing
  #     github-teams.json + generated files): this is a PR-review
  #     SUGGESTION posted via the GitHub API keyed on changed paths,
  #     not a pass/fail file check — out of alint's scope.
  #   - Hydra eval + OfBorg build matrix + merge-bot: operational CI.
  #
  # NEW-RULE-KIND CANDIDATES (would raise replaceable coverage):
  #
  #   1. git_commit_subject_matches  (HIGHEST VALUE)
  #      lint-commits.js enforces a conventional-commit subject:
  #      types {build,chore,ci,doc(s),feat(ure),fix,perf,refactor,
  #      style,test} plus the nixpkgs `pkgs/path: oldver -> newver`
  #      package-bump form. v0.11 shipped git_commit_signed_off /
  #      _no_fixup / _author_allowlist / _gpg_signed but NO
  #      subject-regex kind. This is the single biggest gap for
  #      every conventional-commit repo, not just nixpkgs.
  #
  #   2. A nix ecosystem bundle (extends: alint://bundled/nix@v1)
  #      No nix bundle exists. A bundled ruleset asserting flake.nix +
  #      default.nix + shell.nix presence, .gitattributes
  #      linguist-generated markers, and the pkgs/by-name file-shape
  #      would let nixpkgs (and every nixpkgs fork / NUR-style repo)
  #      drop ~10 hand-written rules.
  #
  #   3. A `nix:` extractor for the structured-query / cross-file
  #      family — would unlock meta.maintainers and meta.license
  #      registry resolution declaratively (today eval-only).
  #
  #   4. A CODEOWNERS extractor for registry_paths_resolve — would
  #      let alint assert ci/OWNERS pattern existence (the file-side
  #      subset of codeowners-validator's `files` check).
