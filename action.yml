name: alint - A Repo Linter
description: Lint repository structure, filenames, and file content with alint.
author: asamarts
branding:
  icon: check-square
  color: blue

inputs:
  version:
    description: |
      alint version to install: a release tag like `v0.1.0`, or
      `latest`. Leave unset to install the release matching the tag
      the action itself is pinned to — e.g. `uses: asamarts/alint@v0.12.0`
      installs v0.12.0, so pinning the action pins the binary. Falls
      back to `latest` when the action is pinned to a branch or SHA.
    required: false
    default: ""
  path:
    description: Directory to lint. Defaults to the repository root.
    required: false
    default: "."
  config:
    description: |
      Extra config file path(s), one per line. Leave empty to let alint
      auto-discover `.alint.yml` at the lint root.
    required: false
    default: ""
  format:
    description: |
      Output format: `human`, `json`, `sarif`, `github` (inline PR annotations),
      `github-actions` (alias for `github`), `markdown`, `junit`, `gitlab`,
      `agent`. Defaults to `github`.
    required: false
    default: github
  fail-on-warning:
    description: Treat warnings as errors for exit-code purposes.
    required: false
    default: "false"
  args:
    description: Extra CLI arguments appended verbatim after the subcommand.
    required: false
    default: ""
  working-directory:
    description: Working directory for the run. Defaults to the runner's workspace.
    required: false
    default: ${{ github.workspace }}

outputs:
  sarif-file:
    description: "Absolute path to the SARIF file (only populated when `format: sarif`)."
    value: ${{ steps.run.outputs.sarif-file }}

runs:
  using: composite
  steps:
    - name: Install alint
      shell: bash
      env:
        ALINT_VERSION: ${{ inputs.version }}
        INSTALL_DIR: ${{ runner.temp }}/alint-bin
        # Pin install.sh to whichever ref the consumer pinned the
        # action to (e.g. `asamarts/alint@v0.12.0`). Without this,
        # `main`'s install.sh would be fetched on every run — a
        # change to that script affects every action consumer
        # regardless of the version they pinned.
        #
        # `github.action_ref` is populated for ANY remote `uses:`
        # reference. It is only empty for `uses: ./` (a local
        # checkout-based action), which is what `action-selftest.yml`
        # does inside this repo. For that path, `main` is the
        # intended fallback because we're testing the bundled
        # install.sh at HEAD; for every external consumer the
        # fallback is unreachable.
        #
        # `GITHUB_REPOSITORY` lets us defensively assert this: if
        # someone outside the asamarts/alint repo somehow hits an
        # empty action_ref, we fail loudly rather than silently
        # fetch `main` from the canonical repo.
        ACTION_REF: ${{ github.action_ref }}
        SOURCE_REPO: ${{ github.repository }}
      run: |
        set -euo pipefail
        if [[ -z "${ACTION_REF:-}" ]]; then
          if [[ "${SOURCE_REPO}" != "asamarts/alint" ]]; then
            echo "::error::action_ref is empty but the action is running outside asamarts/alint (${SOURCE_REPO}). Pin the action to a tag, e.g. uses: asamarts/alint@v0.12.0" >&2
            exit 1
          fi
          ref="main"
        else
          ref="$ACTION_REF"
        fi
        # Binary version: an explicit `version:` input always wins.
        # With none, default to the release tag the action itself is
        # pinned to (ACTION_REF like vX.Y.Z) so pinning the action
        # pins the binary, with zero release-time maintenance. Fall
        # back to `latest` only when the action is pinned to a non-
        # release ref (branch / SHA / the in-repo `uses: ./`
        # selftest), where a floating binary is the right match.
        ver="${ALINT_VERSION:-}"
        if [[ -z "$ver" ]]; then
          if [[ "${ACTION_REF:-}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            ver="$ACTION_REF"
          else
            ver="latest"
          fi
        fi
        export ALINT_VERSION="$ver"
        echo "alint action: installing '${ver}' (action_ref='${ACTION_REF:-<local>}', install.sh ref='${ref}')"
        curl -fsSL "https://raw.githubusercontent.com/asamarts/alint/${ref}/install.sh" | bash
        echo "$INSTALL_DIR" >> "$GITHUB_PATH"

    - name: Run alint
      id: run
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        ALINT_BIN: ${{ runner.temp }}/alint-bin/alint
        ALINT_FORMAT: ${{ inputs.format }}
        ALINT_PATH: ${{ inputs.path }}
        ALINT_CONFIG: ${{ inputs.config }}
        ALINT_FAIL_ON_WARNING: ${{ inputs.fail-on-warning }}
        ALINT_EXTRA: ${{ inputs.args }}
      run: |
        set -euo pipefail

        cli_args=(--format "$ALINT_FORMAT")

        if [ -n "$ALINT_CONFIG" ]; then
          while IFS= read -r cfg; do
            [ -z "$cfg" ] && continue
            cli_args+=(--config "$cfg")
          done <<< "$ALINT_CONFIG"
        fi

        if [ "$ALINT_FAIL_ON_WARNING" = "true" ]; then
          cli_args+=(--fail-on-warning)
        fi

        # Intentional word-splitting on user-provided extras.
        # shellcheck disable=SC2206
        extra=($ALINT_EXTRA)

        if [ "$ALINT_FORMAT" = "sarif" ]; then
          out="${RUNNER_TEMP:-/tmp}/alint.sarif"
          # A non-zero `alint check` (violations found) is a NORMAL SARIF
          # outcome: the file is still written, and a SARIF consumer wants the
          # path precisely when there ARE violations (to upload to code
          # scanning). Capture the exit code with `|| rc=$?` so the
          # `sarif-file` output is set REGARDLESS, then propagate the real
          # exit. Without this, `set -e` aborts the step before the output is
          # set whenever the check is non-zero, leaving consumers (and the
          # action self-test's `test -f`) an empty path.
          rc=0
          "$ALINT_BIN" "${cli_args[@]}" check "$ALINT_PATH" ${extra[@]+"${extra[@]}"} > "$out" || rc=$?
          echo "sarif-file=$out" >> "$GITHUB_OUTPUT"
          exit "$rc"
        else
          "$ALINT_BIN" "${cli_args[@]}" check "$ALINT_PATH" ${extra[@]+"${extra[@]}"}
        fi
