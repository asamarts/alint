test_version: 1
name: set_value on an anchored YAML scalar keeps the anchor its aliases name
tags: [fix, yaml_path_equals, set_value, yaml, safety]

# saphyr's scalar span starts at the scalar's anchor, so a set replaced
# `&d 5` whole with `9` and dropped the anchor: the `*d` alias after it then
# named no anchor and the file no longer parsed. The set span starts past the
# anchor, so `&d` survives and the alias reads the new value, which the last
# `check` (no violations) and `expect_tree` show.

given:
  tree:
    app.yaml: |
      defaults: &d 5  # shared
      use: *d
  config: |
    version: 1
    rules:
      - id: defaults-nine
        kind: yaml_path_equals
        paths: "**/*.yaml"
        path: "$['defaults']"
        equals: 9
        level: error
        fix:
          set_value: {}

when: [check, fix, check]

expect:
  - exit: policy_failure
    violations:
      - {rule: defaults-nine, level: error, path: app.yaml}
  - exit: success
    applied: [defaults-nine]
  - exit: success
    violations: []

expect_tree:
  app.yaml: |
    defaults: &d 9  # shared
    use: *d
