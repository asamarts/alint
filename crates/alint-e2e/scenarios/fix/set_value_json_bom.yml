name: set_value fixes a BOM-prefixed JSON file, preserving the BOM
tags: [fix, json_path_equals, set_value, json]

# Regression (JSON audit): a leading UTF-8 BOM made every JSON set_value silently
# decline. The check side strips a leading BOM (`Format::parse`) so the rule fires
# and advertises a fix, but `jsonc-parser` rejects a leading U+FEFF -- so the fix
# resolver used to return None and skip on EVERY BOM file (JSON was the outlier;
# dotenv/INI/properties offset the BOM, TOML restores it). The resolver now strips
# the BOM and shifts the span into original byte coordinates, so the value is
# rewritten in place and the BOM survives. The tree values use a `\uFEFF` escape so
# a real 3-byte BOM lands on disk (no literal BOM byte in this source file).

given:
  tree:
    app.json: "\uFEFF{\"port\": 8080}\n"
  config: |
    version: 1
    rules:
      - id: port
        kind: json_path_equals
        paths: "**/*.json"
        path: "$.port"
        equals: 9090
        level: error
        fix:
          set_value: {}

when: [check, fix, check]

expect:
  - violations:
      - {rule: port, level: error, path: app.json}
  - applied: [port]
  - violations: []

expect_tree:
  app.json: "\uFEFF{\"port\": 9090}\n"
