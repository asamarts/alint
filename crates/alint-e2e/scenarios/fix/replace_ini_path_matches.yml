name: replace on ini_path_matches rewrites the value at the path to satisfy matches (ini)
tags: [fix, ini_path_matches, replace, ini]

# Arc-wide audit coverage gap: `replace` on `*_path_matches` was tested end-to-end
# ONLY for JSON, yet each format has its own value-span resolver + `serialize_scalar`.
# The value must start with `v`; the fix prepends one (decode -> regex-substitute ->
# re-serialize -> splice the value span), and the sibling `name` is untouched.

given:
  tree:
    app.ini: |
      [app]
      version = 1.2.3
      name = app
  config: |
    version: 1
    rules:
      - id: v-prefix
        kind: ini_path_matches
        paths: "**/*.ini"
        path: "$['app']['version']"
        matches: "^v"
        level: error
        fix:
          replace:
            pattern: "^"
            replacement: "v"
            applicability: safe

when: [check, fix, check]

expect:
  - violations:
      - {rule: v-prefix, level: error, path: app.ini}
  - applied: [v-prefix]
  - violations: []

expect_tree:
  app.ini: |
    [app]
    version = v1.2.3
    name = app
