name: remove_value declines an INI key with a multi-line continuation value
tags: [fix, ini_path_absent, remove_value, ini, safety]

# Safety property (the INI-specific over-deletion risk). `deps`'s value spans
# continuation lines (the configparser indentation-continuation convention), so
# the key owns SEVERAL physical lines -- a deletion a single contiguous range
# cannot express without either over-deleting or orphaning continuation lines.
# The resolver DECLINES rather than guess, so the fix is `skipped`, the violation
# stands, and `expect_tree` proves every line is byte-for-byte intact. (A
# single-line key would still be removable.)

given:
  tree:
    tox.ini: |
      [tox]
      deps =
          pytest
          mock
      other = 1
  config: |
    version: 1
    rules:
      - id: no-deps
        kind: ini_path_absent
        paths: "**/*.ini"
        path: "$['tox']['deps']"
        level: error
        fix:
          remove_value: { applicability: safe }

when: [check, fix, check]

expect:
  - violations:
      - {rule: no-deps, level: error, path: tox.ini}
  - skipped: [no-deps]
  - violations:
      - {rule: no-deps, level: error, path: tox.ini}

expect_tree:
  tox.ini: |
    [tox]
    deps =
        pytest
        mock
    other = 1
