test_version: 1
name: git_untrack removes a committed build artifact from the git index
# git_untrack is Unsafe + spawning: the `fix_unsafe` step raises the threshold to
# Unsafe so it applies. A build artifact that was committed (tracked) but should
# not be is untracked by `git rm --cached` and kept on disk;
# file_absent(git_tracked_only) then no longer sees it in the tracked set, so the
# tree converges. A gitignored tracked file works the same way
# (git_untrack_removes_a_force_added_ignored_file.yml).
tags: [fix, file_absent, git_untrack, git_tracked_only, applicability]

capabilities:
  spawn: true

given:
  tree:
    build:
      out.o: "OBJ\n"
  git:
    add: [build/out.o]
    commit: true
  config: |
    version: 1
    rules:
      - id: no-tracked-build
        kind: file_absent
        paths: "build/**"
        git_tracked_only: true
        level: error
        fix:
          git_untrack: {}

when: [check, fix_unsafe, check]

expect:
  - exit: policy_failure
    violations:
      - {rule: no-tracked-build, level: error, path: build/out.o}
  - exit: success
    applied: [no-tracked-build]
  - exit: success
    violations: []
