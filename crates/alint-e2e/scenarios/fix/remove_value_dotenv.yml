name: remove_value deletes a dotenv line (with its inline comment), keeping siblings
tags: [fix, dotenv_path_absent, remove_value, dotenv]

# `remove_value` deletes the whole `SECRET=...` physical line, including its
# trailing inline comment and newline, since a dotenv key owns exactly its one
# line. The sibling `KEEP` / `ALSO` lines are untouched. `remove_value` is Unsafe
# by default; this rule promotes it to `safe` so a bare `fix` applies.

given:
  tree:
    .env: |
      KEEP=1
      SECRET=leak # do not commit
      ALSO=2
  config: |
    version: 1
    rules:
      - id: no-secret
        kind: dotenv_path_absent
        paths: "**/.env"
        path: "$.SECRET"
        level: error
        fix:
          remove_value: { applicability: safe }

when: [check, fix, check]

expect:
  - violations:
      - {rule: no-secret, level: error, path: .env}
  - applied: [no-secret]
  - violations: []

expect_tree:
  .env: |
    KEEP=1
    ALSO=2
