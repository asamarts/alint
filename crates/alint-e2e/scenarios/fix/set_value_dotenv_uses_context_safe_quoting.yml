test_version: 1
name: set_value on a dotenv value chooses context-safe quoting
tags: [fix, dotenv_path_equals, set_value, dotenv]

# adotenv's native edit: a bare `#z` after `B = ` would begin an inline
# comment and parse as an empty value. The editor emits a quoted token while
# preserving the assignment's spacing, comment, and line ending.

given:
  tree:
    .env: "B = y # note\n"
  config: |
    version: 1
    rules:
      - id: b
        kind: dotenv_path_equals
        paths: "**/.env"
        path: "$.B"
        equals: "#z"
        level: error
        fix:
          set_value: {}

when: [check, fix, check]

expect:
  - exit: policy_failure
    violations:
      - {rule: b, level: error, path: .env}
  - exit: success
    applied: [b]
  - exit: success
    violations: []

expect_tree:
  .env: "B = \"#z\" # note\n"
