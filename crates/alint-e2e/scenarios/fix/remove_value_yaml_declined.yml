name: remove_value on YAML is deferred -- declines cleanly, never corrupts the file
tags: [fix, yaml_path_absent, remove_value, yaml, safety]

# YAML `remove_value` is DEFERRED this increment (deleting a mapping entry is
# structural / comment surgery -- the over-deletion risk class). `format_supports_
# removal(Yaml)` is false, so `can_fix` does not advertise it (check reports the
# violation but not as auto-fixable) and `resolve_removal_span(Format::Yaml, ..)`
# always declines: no edit is formed, the fix is `skipped`, the violation
# survives, and `expect_tree` proves the file is byte-for-byte intact. The rule
# promotes to `safe` to show the decline is at resolution, not the tier gate.
# (SET ships this increment; REMOVE is a tracked follow-up.)

given:
  tree:
    app.yaml: |
      server:
        host: localhost
        debug: true
  config: |
    version: 1
    rules:
      - id: no-debug
        kind: yaml_path_absent
        paths: "**/*.yaml"
        path: "$['server']['debug']"
        level: error
        fix:
          remove_value: { applicability: safe }

when: [check, fix, check]

expect:
  - violations:
      - {rule: no-debug, level: error, path: app.yaml}
  - skipped: [no-debug]
  - violations:
      - {rule: no-debug, level: error, path: app.yaml}

expect_tree:
  app.yaml: |
    server:
      host: localhost
      debug: true
