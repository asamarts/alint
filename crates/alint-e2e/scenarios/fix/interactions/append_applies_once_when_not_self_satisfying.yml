name: a non-self-satisfying file_append applies once, not once per fixpoint pass
tags: [fix, interactions, file_content_matches, file_append, fixpoint]

# Phase-1 fixpoint apply-once regression (docs/design/v0.17/fixpoint.md 1, 5).
# The fixpoint re-walks and re-fixes until nothing new applies. A file_append
# whose boilerplate does NOT contain the rule's `pattern:` never resolves its own
# violation: every pass the pattern is still absent. WITHOUT apply-once this
# appends the boilerplate on every pass -- N duplicated copies until the cap, a
# file-corruption regression. Apply-once marks the violation's fingerprint the
# moment its fix is Applied, so the second pass filters it out and the loop
# converges. The gate: exactly ONE appended copy in the final tree (not two, not
# ten). This also pins the design's assumption that the violation fingerprint is
# STABLE across passes (a shifting fingerprint would defeat apply-once and append
# repeatedly), so a regression there fails here loudly.

given:
  tree:
    README.md: "# Project\n"
  config: |
    version: 1
    rules:
      - id: needs-spdx
        kind: file_content_matches
        paths: "README.md"
        pattern: "SPDX-License-Identifier"
        level: warning
        fix:
          file_append:
            content: "\n<!-- license: see COPYING -->\n"

when: [fix, check]

expect:
  # One `fix` fixpoints: pass 1 appends (Applied), pass 2 sees the still-absent
  # pattern but apply-once filters it, so the loop converges after one append.
  - applied: [needs-spdx]
  # The append does not contain the pattern, so the violation legitimately
  # STANDS -- `check` still reports it. That is honest: the config is
  # non-self-satisfying, not silently "fixed".
  - violations:
      - {rule: needs-spdx, level: warning, path: README.md}

expect_tree:
  # Exactly ONE appended copy -- apply-once stopped the per-pass duplication.
  README.md: "# Project\n\n<!-- license: see COPYING -->\n"
