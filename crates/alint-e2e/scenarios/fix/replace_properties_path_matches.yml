name: replace on properties_path_matches rewrites the value at the path to satisfy matches (properties)
tags: [fix, properties_path_matches, replace, properties]

# Arc-wide audit coverage gap: `replace` on `*_path_matches` was tested end-to-end
# ONLY for JSON, yet each format has its own value-span resolver + `serialize_scalar`.
# The value must start with `v`; the fix prepends one (decode -> regex-substitute ->
# re-serialize -> splice the value span), and the sibling `name` is untouched.

given:
  tree:
    app.properties: |
      version=1.2.3
      name=app
  config: |
    version: 1
    rules:
      - id: v-prefix
        kind: properties_path_matches
        paths: "**/*.properties"
        path: "$['version']"
        matches: "^v"
        level: error
        fix:
          replace:
            pattern: "^"
            replacement: "v"
            applicability: safe

when: [check, fix, check]

expect:
  - violations:
      - {rule: v-prefix, level: error, path: app.properties}
  - applied: [v-prefix]
  - violations: []

expect_tree:
  app.properties: |
    version=v1.2.3
    name=app
