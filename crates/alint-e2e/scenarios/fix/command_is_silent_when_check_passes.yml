name: a command fix is silent when the check passes
# Fire/silent pair (auto-fix.md 5.6): the fire half lives in
# command_runs_the_user_fix_command.yml; this is the SILENT half -- when the check
# command passes there is no violation, so the fix command is never invoked (the
# engine only runs a fixer on a violation). Unix-only (/bin/sh).
tags: [fix, command, unix-only]

given:
  tree:
    src:
      ok.js: "FIXED\n"
  config: |
    version: 1
    rules:
      - id: js
        kind: command
        paths: "src/**/*.js"
        command: ["sh", "-c", "grep -q FIXED \"$1\"", "_", "{path}"]
        level: error
        fix:
          command:
            run: ["sh", "-c", "printf CHANGED > \"$1\"", "_", "{path}"]

when: [check, fix_unsafe]

expect:
  - violations: []
  - applied: []
