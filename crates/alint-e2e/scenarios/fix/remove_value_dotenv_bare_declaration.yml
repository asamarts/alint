test_version: 1
name: remove_value removes a dotenv bare declaration
tags: [fix, dotenv_path_absent, remove_value, dotenv]

# adotenv retains a bare declaration distinctly from an empty assignment.
# alint maps it to JSON null, the absent rule still sees the key, and the native
# removal edit removes the complete declaration without touching its sibling.

given:
  tree:
    .env: "A\nB=2\n"
  config: |
    version: 1
    rules:
      - id: no-a
        kind: dotenv_path_absent
        paths: "**/.env"
        path: "$.A"
        level: error
        fix:
          remove_value: { applicability: safe }

when: [check, fix, check]

expect:
  - exit: policy_failure
    violations:
      - {rule: no-a, level: error, path: .env}
  - exit: success
    applied: [no-a]
  - exit: success
    violations: []

expect_tree:
  .env: "B=2\n"
