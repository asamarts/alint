name: replace on xml_path_matches rewrites the value at the path to satisfy matches (xml)
tags: [fix, xml_path_matches, replace, xml]

# Arc-wide audit coverage gap: `replace` on `*_path_matches` was tested end-to-end
# ONLY for JSON, yet each format has its own value-span resolver + `serialize_scalar`.
# The value must start with `v`; the fix prepends one (decode -> regex-substitute ->
# re-serialize -> splice the value span), and the sibling `name` is untouched.

given:
  tree:
    config.xml: |
      <config>
        <version>1.2.3</version>
        <name>app</name>
      </config>
  config: |
    version: 1
    rules:
      - id: v-prefix
        kind: xml_path_matches
        paths: "**/*.xml"
        path: "$.config.version"
        matches: "^v"
        level: error
        fix:
          replace:
            pattern: "^"
            replacement: "v"
            applicability: safe

when: [check, fix, check]

expect:
  - violations:
      - {rule: v-prefix, level: error, path: config.xml}
  - applied: [v-prefix]
  - violations: []

expect_tree:
  config.xml: |
    <config>
      <version>v1.2.3</version>
      <name>app</name>
    </config>
