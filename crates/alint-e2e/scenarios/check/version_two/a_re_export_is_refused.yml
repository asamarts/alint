test_version: 1
name: a qualified name does not reach what the aliased config itself extends
tags: [check, version_two, extends]

# `support/version_two_middle.yaml` reaches `pins` as `base.pins`; a config
# that extends it as `mid` cannot name `mid.pins`: there is no re-export.

given:
  tree: {}
  config: |
    version: 2
    extends:
      - url: ./support/version_two_middle.yaml
        as: mid
    relations:
      deps:
        from: { paths: "**/package.json" }
        entries: { format: json, at: "$.dependencies" }
        fields: { name: entry.key }
      pinned:
        join: { left: deps, right: mid.pins, on: { name: name }, unique: right }
        fields: { name: left.name }
    rules: []

when: [check]

expect:
  - exit: configuration_error
    configuration_error:
      message:
        # The extended configs are shown with the host's path separator.
        regex: '^\.a_re_export_is_refused\.inline\.alint\.yml: `relations\.pinned\.join\.right`: support[/\\]version_two_middle\.yaml \(`mid`\) declares no relation named `pins`; support[/\\]version_two_base\.yaml declares it, which support[/\\]version_two_middle\.yaml extends: a qualified name reaches only the objects the aliased config declares itself \(there is no re-export\), so extend support[/\\]version_two_base\.yaml from this config with an alias of its own and write `<alias>\.pins`$'
