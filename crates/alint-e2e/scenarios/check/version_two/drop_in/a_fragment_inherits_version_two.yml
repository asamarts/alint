test_version: 1
name: an .alint.d fragment without a version is read as its root's version 2
tags: [check, version_two, drop_in]

# `.alint.d/10-docs.yaml` beside this file declares no `version:` and a
# selector: it is read as version 2 because its root is, and adds its rule.

given:
  tree:
    docs:
      guide.md: "# Guide\n"
  config: |
    version: 2
    selectors:
      docs:
        paths: "docs/**"
    rules:
      - id: has-readme
        kind: file_exists
        paths: README.md
        level: error

when: [check]

expect:
  - exit: policy_failure
    violations:
      - {rule: has-readme, level: error}
      - {rule: has-changelog, level: warning}
