test_version: 1
name: conformance set multi-field group_by, all_target_groups, and inline values fire on drift
tags: [check, constraint, cross_file, version_two, conformance, failing]

given:
  tree:
    actual.json: |
      {
        "rows": [
          { "env": "prod", "region": "us", "flag": "auth" },
          { "env": "prod", "region": "us", "flag": "legacy" }
        ]
      }
    expected.json: |
      {
        "rows": [
          { "e": "prod", "r": "us", "f": "auth" },
          { "e": "prod", "r": "eu", "f": "auth" }
        ]
      }
  config: |
    version: 2
    relations:
      actual:
        from: { paths: actual.json }
        records: { format: json, at: "$.rows[*]" }
        fields:
          env: "record: $.env"
          region: "record: $.region"
          flag: "record: $.flag"
      expected:
        from: { paths: expected.json }
        records: { format: json, at: "$.rows[*]" }
        fields:
          e: "record: $.e"
          r: "record: $.r"
          f: "record: $.f"
    rules:
      - id: flags-match-per-group
        kind: constraint
        input: actual
        assert:
          set:
            field: flag
            group_by: [env, region]
            equal_to: { relation: expected, field: f, group_by: [e, r], all_target_groups: true }
        level: error
      - id: flags-subset-of-inline-values
        kind: constraint
        input: actual
        assert:
          set:
            field: flag
            subset_of: { values: [auth, billing] }
        level: error

when: [check]

expect:
  - exit: policy_failure
    violations:
      - rule: flags-match-per-group
        level: error
        path: actual.json
        message:
          regex: '"legacy"'
      - rule: flags-match-per-group
        level: error
        message:
          regex: '"eu"'
      - rule: flags-subset-of-inline-values
        level: error
        path: actual.json
        message:
          regex: '"legacy"'
