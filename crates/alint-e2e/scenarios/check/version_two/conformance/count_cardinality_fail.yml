test_version: 1
name: conformance count cardinality fires on missing required group, over max, and max 0 per row
tags: [check, constraint, cross_file, version_two, conformance, failing]

given:
  tree:
    owners.json: |
      {
        "entries": [
          { "area": "api", "owner": "alice" },
          { "area": "api", "owner": "bob" }
        ]
      }
  config: |
    version: 2
    relations:
      owners:
        from: { paths: owners.json }
        records: { format: json, at: "$.entries[*]" }
        fields:
          area: "record: $.area"
          owner: "record: $.owner"
    rules:
      - id: bounded-per-area
        kind: constraint
        input: owners
        assert:
          count:
            group_by: [area]
            min: 1
            max: 1
            groups: [api, web]
        level: error
      - id: no-bob-entries
        kind: constraint
        input:
          from: { paths: owners.json }
          records: { format: json, at: "$.entries[*]" }
          fields:
            owner: "record: $.owner"
          where:
            owner: { in: ["bob"] }
        assert:
          count: { max: 0 }
        level: error

when: [check]

expect:
  - exit: policy_failure
    violations:
      - rule: bounded-per-area
        level: error
        path: owners.json
        message:
          regex: "has 2 rows"
      - rule: bounded-per-area
        level: error
        message:
          regex: "has 0 rows"
      - rule: no-bob-entries
        level: error
        path: owners.json
        message:
          regex: "expected no rows"
