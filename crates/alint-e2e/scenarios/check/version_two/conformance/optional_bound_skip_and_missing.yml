test_version: 1
name: conformance optional bound fields support skip and missing policies
tags: [check, constraint, cross_file, version_two, conformance, failing]

given:
  tree:
    packages/a/package.json: |
      { "name": "a", "version": "1.0.0", "dependencies": { "react": "^18.0.0" } }
    packages/b/package.json: |
      { "dependencies": { "react": "^18.0.0" } }
  config: |
    version: 2
    relations:
      skipped-bound:
        from: { paths: "packages/*/package.json" }
        entries: { format: json, at: "$.dependencies" }
        fields:
          pkg: { source: "bound: $.name", optional: true, on_missing: skip }
          dep: entry.key
      missing-bound:
        from: { paths: "packages/*/package.json" }
        entries: { format: json, at: "$.dependencies" }
        fields:
          pkg: { source: "bound: $.name", optional: true, on_missing: missing }
          dep: entry.key
    rules:
      - id: skipped-has-one-row
        kind: constraint
        input: skipped-bound
        assert:
          count: { exact: 1 }
        level: error
      - id: missing-keeps-both-and-rejects-missing-reference
        kind: constraint
        input: missing-bound
        assert:
          reference:
            fields: [pkg]
            to: { relation: skipped-bound, fields: [pkg] }
        level: error

when: [check]

expect:
  - exit: policy_failure
    violations:
      - rule: missing-keeps-both-and-rejects-missing-reference
        level: error
        path: packages/b/package.json
        message:
          regex: "missing"
