test_version: 1
name: conformance dependency version consistency (jest-23) fires on mismatched ranges while exempting @types/node
tags: [check, constraint, cross_file, version_two, conformance, failing]

given:
  tree:
    package.json: |
      {
        "name": "jest-root",
        "devDependencies": {
          "@types/node": "^22.0.0"
        }
      }
    packages:
      jest-core:
        package.json: |
          {
            "name": "jest-core",
            "dependencies": {
              "chalk": "^5.3.0"
            },
            "devDependencies": {
              "@types/node": "^20.14.0"
            }
          }
      jest-util:
        package.json: |
          {
            "name": "jest-util",
            "dependencies": {
              "chalk": "^4.1.2"
            }
          }
  config: |
    version: 2
    selectors:
      workspace-manifests:
        paths: ["package.json", "packages/*/package.json"]
    relations:
      dependency-ranges:
        from: workspace-manifests
        entries:
          format: json
          at: ["$.dependencies", "$.devDependencies", "$.optionalDependencies"]
        fields: { field: entry.parent, dependency: entry.key, range: entry.value }
        where:
          dependency: { not_in: ["@types/node"] }
    rules:
      - id: one-range-per-dependency
        kind: constraint
        input: dependency-ranges
        assert: { unique: { key: [dependency], determines: [range] } }
        level: error

when: [check]

expect:
  - exit: policy_failure
    violations:
      - rule: one-range-per-dependency
        level: error
        path: packages/jest-core/package.json
        line: 4
        column: 14
        end_line: 4
        end_column: 22
        message:
          exact: 'rows with `dependency` "chalk" disagree on `range`: "^5.3.0" here; "^4.1.2" in 1 row'
        related:
          - {label: a row with another value, path: packages/jest-util/package.json, line: 4, column: 14, end_line: 4, end_column: 22}
      - rule: one-range-per-dependency
        level: error
        path: packages/jest-util/package.json
        line: 4
        column: 14
        end_line: 4
        end_column: 22
        message:
          exact: 'rows with `dependency` "chalk" disagree on `range`: "^4.1.2" here; "^5.3.0" in 1 row'
        related:
          - {label: a row with another value, path: packages/jest-core/package.json, line: 4, column: 14, end_line: 4, end_column: 22}
