test_version: 1
name: conformance single-root stub locale file survives strip-root and join to anchor missing keys
tags: [check, constraint, cross_file, version_two, conformance, failing]

given:
  tree:
    locales/en.yml: |
      en:
        hello: Hello
    locales/fr.yml: |
      fr: {}
    meta.json: |
      { "en": "English", "fr": "French" }
  config: |
    version: 2
    relations:
      raw-locales:
        from: { paths: "locales/*.yml" }
        entries: { format: yaml, at: "$", leaves: true }
        fields: { locale: entry.root, key: entry.path }
        transform: { key: [strip-root] }
      meta:
        from: { paths: meta.json }
        entries: { format: json, at: "$" }
        fields: { locale: entry.key, label: entry.value }
      enriched:
        join: { left: raw-locales, right: meta, on: { locale: locale }, unique: right }
        fields: { locale: left.locale, key: left.key, label: right.label }
    rules:
      - id: locale-parity-joined
        kind: constraint
        input: enriched
        assert:
          set:
            field: key
            group_by: locale
            equal_to: { group: en }
        level: error

when: [check]

expect:
  - exit: policy_failure
    violations:
      - rule: locale-parity-joined
        level: error
        path: locales/fr.yml
        message:
          regex: '`key` "hello"'
