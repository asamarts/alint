test_version: 1
name: conformance toolchain-pin consistency (signal-desktop-28) fires on drifted and missing package.json pins
tags: [check, constraint, cross_file, version_two, conformance, failing]

given:
  tree:
    .nvmrc: "22.14.0\n"
    package.json: |
      {
        "name": "signal-desktop",
        "engines": { "node": "22.14.0" },
        "devEngines": { "runtime": { "name": "node", "version": "20.19.0" } }
      }
  config: |
    version: 2
    relations:
      node-pins:
        union:
          - { from: { paths: .nvmrc }, read: { regex: "^v?(\\S+)" } }
          - { from: { paths: package.json }, read: { json: "$.engines.node" } }
          - { from: { paths: package.json }, read: { json: "$.devEngines.runtime.version" } }
          - { from: { paths: package.json }, read: { json: "$.volta.node" } }
        fields: { source: path, version: value }
    rules:
      - id: node-pins-agree
        kind: constraint
        input: node-pins
        assert: { equal: { field: version, to: { row: { source: .nvmrc } } } }
        level: error

when: [check]

expect:
  - exit: policy_failure
    violations:
      - rule: node-pins-agree
        level: error
        path: package.json
        line: 4
        column: 59
        end_line: 4
        end_column: 68
        message:
          exact: '`version` is "20.19.0" here, but "22.14.0" in the source row (`source` ".nvmrc", at .nvmrc)'
        related:
          - {label: the source row, path: .nvmrc, line: 1, column: 1, end_line: 1, end_column: 8}
      - rule: node-pins-agree
        level: error
        path: package.json
        message:
          exact: '`version` is missing here (`relations.node-pins.union[3]`, `read.json: $.volta.node`, matched nothing), but "22.14.0" in the source row (`source` ".nvmrc", at .nvmrc)'
        related:
          - {label: the source row, path: .nvmrc, line: 1, column: 1, end_line: 1, end_column: 8}
