test_version: 1
name: conformance dependency version consistency (yarnpkg-berry-01) fires on mismatched ranges while exempting docusaurus and workspace packages
tags: [check, constraint, cross_file, version_two, conformance, failing]

given:
  tree:
    packages:
      yarnpkg-core:
        package.json: |
          {
            "name": "@yarnpkg/core",
            "dependencies": {
              "semver": "^7.6.0"
            }
          }
      plugin-npm:
        package.json: |
          {
            "name": "@yarnpkg/plugin-npm",
            "dependencies": {
              "semver": "^7.6.0"
            },
            "devDependencies": {
              "@yarnpkg/core": "^4.5.0"
            }
          }
      plugin-patch:
        package.json: |
          {
            "name": "@yarnpkg/plugin-patch",
            "dependencies": {
              "semver": "^7.5.4"
            },
            "devDependencies": {
              "@yarnpkg/core": "^4.4.0"
            }
          }
      docusaurus:
        package.json: |
          {
            "name": "@yarnpkg/docusaurus",
            "dependencies": {
              "semver": "^6.3.1"
            }
          }
  config: |
    version: 2
    selectors:
      workspace-manifests:
        paths: ["packages/*/package.json", "!packages/docusaurus/package.json"]
    relations:
      workspace-names:
        from: workspace-manifests
        read: { json: "$.name" }
        fields: { name: value }
      dependency-ranges:
        from: workspace-manifests
        entries:
          format: json
          at: ["$.dependencies", "$.devDependencies", "$.optionalDependencies"]
        fields: { field: entry.parent, dependency: entry.key, range: entry.value }
        where:
          range: { not_matches: "^workspace:" }
          dependency: { not_in: [{ relation: workspace-names, field: name }] }
    rules:
      - id: one-range-per-dependency
        kind: constraint
        input: dependency-ranges
        assert: { unique: { key: [dependency], determines: [range] } }
        level: error

when: [check]

expect:
  - exit: policy_failure
    violations:
      - rule: one-range-per-dependency
        level: error
        path: packages/plugin-npm/package.json
        line: 4
        column: 15
        end_line: 4
        end_column: 23
        message:
          exact: 'rows with `dependency` "semver" disagree on `range`: "^7.6.0" here and in 1 other row; "^7.5.4" in 1 row'
        related:
          - {label: a row with another value, path: packages/plugin-patch/package.json, line: 4, column: 15, end_line: 4, end_column: 23}
          - {label: another row with this value, path: packages/yarnpkg-core/package.json, line: 4, column: 15, end_line: 4, end_column: 23}
      - rule: one-range-per-dependency
        level: error
        path: packages/plugin-patch/package.json
        line: 4
        column: 15
        end_line: 4
        end_column: 23
        message:
          exact: 'rows with `dependency` "semver" disagree on `range`: "^7.5.4" here; "^7.6.0" in 2 rows'
        related:
          - {label: a row with another value, path: packages/plugin-npm/package.json, line: 4, column: 15, end_line: 4, end_column: 23}
