test_version: 1
name: conformance satisfies fires on out-of-range version and rejects pep440 local version loudly
tags: [check, constraint, cross_file, version_two, conformance, failing]

given:
  tree:
    pins.json: |
      {
        "node_ver": "16.20.0",
        "py_ver": "3.12.0+local"
      }
  config: |
    version: 2
    relations:
      pins:
        from: { paths: pins.json }
        records: { format: json, at: "$" }
        fields:
          node_ver: "record: $.node_ver"
          py_ver: "record: $.py_ver"
    rules:
      - id: node-satisfies
        kind: constraint
        input: pins
        assert:
          satisfies: { version: node_ver, range_literal: ">=18.0.0", dialect: node }
        level: error
      - id: pep440-local-rejected
        kind: constraint
        input: pins
        assert:
          satisfies: { version: py_ver, range_literal: ">=3.10,<3.14", dialect: pep440-basic }
        level: error

when: [check]

expect:
  - exit: policy_failure
    violations:
      - rule: node-satisfies
        level: error
        path: pins.json
        message:
          regex: "16.20.0"
    analysis_failures:
      - rule: pep440-local-rejected
        kind: evaluation
        path: pins.json
        message:
          regex: "3\\.12\\.0\\+local"
