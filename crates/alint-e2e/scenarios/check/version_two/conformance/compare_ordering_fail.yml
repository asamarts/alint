test_version: 1
name: conformance compare ordering fails on violated relation and fails loud on null operand
tags: [check, constraint, cross_file, version_two, conformance, failing]

given:
  tree:
    windows.json: |
      {
        "windows": [
          { "min_ver": "2.0.0", "cur_ver": "1.9.0" },
          { "min_ver": "1.0.0", "cur_ver": null }
        ]
      }
  config: |
    version: 2
    relations:
      windows:
        from: { paths: windows.json }
        records: { format: json, at: "$.windows[*]" }
        fields:
          min_ver: "record: $.min_ver"
          cur_ver: "record: $.cur_ver"
    rules:
      - id: semver-order
        kind: constraint
        input: windows
        assert:
          compare: { field: cur_ver, op: ge, to: { field: min_ver }, order: semver }
        level: error

when: [check]

expect:
  - exit: policy_failure
    violations: []
    analysis_failures:
      - rule: semver-order
        kind: evaluation
        path: windows.json
        message:
          regex: "null"
