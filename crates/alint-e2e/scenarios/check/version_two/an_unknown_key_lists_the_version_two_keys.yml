test_version: 1
name: an unknown key in a version 2 config is reported against the version 2 keys
tags: [check, version_two]

given:
  tree: {}
  config: |
    version: 2
    relation:
      deps: {}
    rules: []

when: [check]

expect:
  - exit: configuration_error
    configuration_error:
      message:
        exact: ".an_unknown_key_lists_the_version_two_keys.inline.alint.yml: unknown key `relation` in a version 2 config; expected one of `version`, `requires`, `extends`, `ignore`, `respect_gitignore`, `vars`, `facts`, `templates`, `rules`, `fix_size_limit`, `nested_configs`, `limits`, `allow_out_of_root`, `baseline`, `trusted_extends`, `selectors`, `relations`"
