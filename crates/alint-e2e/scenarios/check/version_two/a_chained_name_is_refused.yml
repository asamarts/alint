test_version: 1
name: a chained name through two aliases is refused
tags: [check, version_two, extends]

given:
  tree: {}
  config: |
    version: 2
    extends:
      - url: ./support/version_two_middle.yaml
        as: mid
    relations:
      deps:
        from: { paths: "**/package.json" }
        entries: { format: json, at: "$.dependencies" }
        fields: { name: entry.key }
      pinned:
        join: { left: deps, right: mid.base.pins, on: { name: name }, unique: right }
        fields: { name: left.name }
    rules: []

when: [check]

expect:
  - exit: configuration_error
    configuration_error:
      message:
        exact: ".a_chained_name_is_refused.inline.alint.yml: `relations.pinned.join.right`: `mid.base.pins` is not a valid reference: write a name, or `alias.name` for an object of a source this config extends with `as: alias`; a name starts with an ASCII letter or `_` and holds only ASCII letters, digits, `_` and `-` (there is no chained name such as `a.b.c`)"
