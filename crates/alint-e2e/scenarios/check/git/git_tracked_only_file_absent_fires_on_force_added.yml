test_version: 1
name: file_absent + git_tracked_only fires on a force-added gitignored .env
tags: [check, file_absent, git_tracked_only, git]

given:
  tree:
    .gitignore: ".env\n"
    README.md: "# demo\n"
    .env: "TOKEN=x\n"
  config: |
    version: 1
    rules:
      - id: env-not-tracked
        kind: file_absent
        paths: ".env"
        git_tracked_only: true
        level: error
  git:
    init: true
    add: [README.md, .gitignore]
    add_force: [.env]
    commit: true

when: [check]

expect:
  - exit: policy_failure
    violations:
      - {rule: env-not-tracked, level: error, path: .env}
