test_version: 1
name: dir_absent + git_tracked_only fires on a force-added file in a gitignored target/
tags: [check, dir_absent, git_tracked_only, git]

# The walker prunes the gitignored target/, but git tracks
# target/debug/build.log (`git add -f`), so the git-tracked index brings
# it back with its directories (#503).

given:
  tree:
    .gitignore: "target/\n"
    README.md: "# demo\n"
    target:
      debug:
        build.log: "log\n"
  config: |
    version: 1
    rules:
      - id: target-not-tracked
        kind: dir_absent
        paths: "**/target"
        git_tracked_only: true
        level: error
        message: "target/ must not be committed"
  git:
    init: true
    add: [README.md, .gitignore]
    add_force: [target/debug/build.log]
    commit: true

when: [check]

expect:
  - exit: policy_failure
    violations:
      - {rule: target-not-tracked, level: error, path: target}
