name: for_each_match is silent when every changelog entry conforms
tags: [check, for_each_match, content, passing]

docs:
  title: Every changelog entry matches the required grammar
  case: pass
  kind: for_each_match

given:
  tree:
    CHANGELOG.md: |
      - Add a feature ([#12](https://github.com/x/pull/12)).
      - Fix a bug ([#34](https://github.com/x/pull/34)).
  config: |
    version: 1
    rules:
      - id: changelog-entries-well-formed
        kind: for_each_match
        paths: ["CHANGELOG.md"]
        select: '^- .*\[#(?P<disp>\d+)\]\([^)]*pull/(?P<url>\d+)\)'
        require:
          matches: ['\)\.$']
          equal: [disp, url]
        level: error

when: [check]

expect:
  - violations: []
