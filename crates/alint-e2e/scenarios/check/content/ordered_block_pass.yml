name: ordered_block is silent when a marked block is sorted
tags: [check, ordered_block, content, passing]

docs:
  title: A keep-sorted block in lexical order
  case: pass
  kind: ordered_block

given:
  tree:
    .gitignore: |
      /target
      # keep-sorted start
      *.log
      *.tmp
      node_modules/
      # keep-sorted end
  config: |
    version: 1
    rules:
      - id: keep-sorted
        kind: ordered_block
        paths: "**/.gitignore"
        start: "# keep-sorted start"
        end: "# keep-sorted end"
        comparator: lexical
        level: warning

when: [check]

expect:
  - violations: []
