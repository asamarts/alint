test_version: 1
name: a nested key_parity infers the format of a templated reference per iteration
tags: [check, key_parity, for_each_file, cross_file, nested, json, yaml]

given:
  tree:
    web:
      en.json: '{"a": 1, "b": 2}'
      fr.json: '{"a": 1}'
    api:
      en.yml: |
        a: 1
        b: 2
      fr.yml: |
        a: 1
  config: |
    version: 1
    rules:
      - id: locale-parity
        kind: for_each_file
        select: "*/en.*"
        level: error
        require:
          - kind: key_parity
            reference: "{path}"
            peers: "{dir}/fr.{ext}"

when: [check]

expect:
  - exit: policy_failure
    violations:
      - {rule: locale-parity, level: error, path: api/fr.yml}
      - {rule: locale-parity, level: error, path: web/fr.json}
    analysis_failures: []
