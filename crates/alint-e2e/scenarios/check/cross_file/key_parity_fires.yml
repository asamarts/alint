test_version: 1
name: key_parity reports a key missing from a peer locale
tags: [check, key_parity, cross_file, failing]

docs:
  title: A locale missing a key from the reference
  case: fail
  kind: key_parity

given:
  tree:
    locales:
      en.json: |
        {"nav": {"home": "Home", "about": "About"}}
      fr.json: |
        {"nav": {"home": "Accueil"}}
  config: |
    version: 1
    rules:
      - id: locales-match-english
        kind: key_parity
        reference: locales/en.json
        peers: "locales/*.json"
        level: error

when: [check]

expect:
  - exit: policy_failure
    violations:
      - {rule: locales-match-english, level: error, path: locales/fr.json, message: {regex: "missing key"}}
