test_version: 1
name: a message nested two levels deep shows a path token spelled in a name once
tags: [check, for_each_file, for_each_dir, file_exists, cross_file, nested]

# The outer rule renders `{path}` in the innermost message as
# `packages/x{stem}/en.json`; the `for_each_dir` between them must not render
# the `{stem}` in that directory name again (the message read
# `packages/xx{stem}/en.json needs a README` before the fix).

given:
  tree:
    packages:
      "x{stem}":
        en.json: '{}'
  config: |
    version: 1
    rules:
      - id: package-readme
        kind: for_each_file
        select: "packages/*/en.json"
        level: error
        require:
          - kind: for_each_dir
            select: "{dir}"
            require:
              - kind: file_exists
                paths: "{dir}/README.md"
                message: "{path} needs a README"

when: [check]

expect:
  - exit: policy_failure
    violations:
      - {rule: package-readme, level: error, path: "packages/x{stem}", message: {exact: "packages/x{stem}/en.json needs a README"}}
    analysis_failures: []
