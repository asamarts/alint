test_version: 1
name: key_parity compares INI keys within their sections
tags: [check, key_parity, cross_file, failing]

given:
  tree:
    conf:
      defaults.ini: |
        [server]
        host = localhost
        port = 8080
        [log]
        level = info
      production.ini: |
        [server]
        host = example.com
        [log]
        level = warn
  config: |
    version: 1
    rules:
      - id: ini-parity
        kind: key_parity
        reference: conf/defaults.ini
        peers: "conf/*.ini"
        level: error

when: [check]

expect:
  - exit: policy_failure
    violations:
      - {rule: ini-parity, level: error, path: conf/production.ini, message: {regex: "missing key `server\\.port`"}}
