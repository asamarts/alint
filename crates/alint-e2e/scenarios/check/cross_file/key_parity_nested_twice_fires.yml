test_version: 1
name: key_parity nested two levels deep, under for_each_dir and for_each_file
tags: [check, key_parity, for_each_dir, for_each_file, cross_file, nested]

given:
  tree:
    packages:
      ui:
        locales:
          en.json: '{"a": 1, "b": 2}'
          fr.json: '{"a": 1}'
  config: |
    version: 1
    rules:
      - id: package-locale-parity
        kind: for_each_dir
        select: "packages/*"
        level: error
        require:
          - kind: for_each_file
            select: "{path}/locales/en.json"
            require:
              - kind: key_parity
                reference: "{path}/locales/en.json"
                peers: "{path}/locales/fr.json"

when: [check]

expect:
  - exit: policy_failure
    violations:
      - {rule: package-locale-parity, level: error, path: packages/ui/locales/fr.json}
    analysis_failures: []
