test_version: 1
name: constraint compares each locale's message keys with the English set
tags: [check, constraint, cross_file, version_two, failing]

given:
  tree:
    messages.json: |
      {
        "en": {"home": "Home", "about": "About"},
        "fr": {"home": "Accueil", "contact": "Contact"},
        "xx": {"home": "[Home]", "about": "[About]"}
      }
  config: |
    version: 2
    relations:
      messages:
        from: { paths: messages.json }
        entries: { format: json, at: ["$.en", "$.fr", "$.xx"] }
        fields: { locale: entry.parent, message: entry.key }
    rules:
      - id: locales-match-english
        kind: constraint
        input: messages
        assert:
          set: { field: message, group_by: locale, equal_to: { group: en } }
        level: error
      - id: locales-within-english
        kind: constraint
        input: messages
        assert:
          set: { field: message, group_by: locale, subset_of: { group: en } }
        level: warning
      - id: pseudo-locale-apart
        kind: constraint
        input: messages
        assert:
          set: { field: message, group_by: locale, disjoint_from: { group: xx } }
        level: info

when: [check]

expect:
  - exit: policy_failure
    violations:
      - rule: locales-match-english
        path: messages.json
        message: {exact: "`locale` \"fr\" lacks `message` \"about\", which `locale` \"en\" holds"}
        related:
          - {label: "the reference group's row with it", path: messages.json, line: 2, column: 26, end_line: 2, end_column: 33}
      - rule: locales-match-english
        path: messages.json
        line: 3
        column: 29
        end_line: 3
        end_column: 38
        message: {exact: "`locale` \"fr\" holds `message` \"contact\", which `locale` \"en\" lacks"}
      - rule: locales-within-english
        level: warning
        path: messages.json
        line: 3
        column: 29
        end_line: 3
        end_column: 38
        message: {exact: "`locale` \"fr\" holds `message` \"contact\", which `locale` \"en\" lacks"}
      - rule: pseudo-locale-apart
        level: info
        path: messages.json
        line: 2
        column: 10
        end_line: 2
        end_column: 16
        message: {exact: "`locale` \"en\" and `locale` \"xx\" both hold `message` \"home\""}
        related:
          - {label: "the reference group's row with it", path: messages.json, line: 4, column: 10, end_line: 4, end_column: 16}
      - rule: pseudo-locale-apart
        level: info
        path: messages.json
        line: 2
        column: 26
        end_line: 2
        end_column: 33
        message: {exact: "`locale` \"en\" and `locale` \"xx\" both hold `message` \"about\""}
        related:
          - {label: "the reference group's row with it", path: messages.json, line: 4, column: 28, end_line: 4, end_column: 35}
      - rule: pseudo-locale-apart
        level: info
        path: messages.json
        line: 3
        column: 10
        end_line: 3
        end_column: 16
        message: {exact: "`locale` \"fr\" and `locale` \"xx\" both hold `message` \"home\""}
        related:
          - {label: "the reference group's row with it", path: messages.json, line: 4, column: 10, end_line: 4, end_column: 16}
