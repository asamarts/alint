test_version: 1
name: key_parity reports an extra .resx key under direction extra
tags: [check, key_parity, cross_file, resx]

given:
  tree:
    Strings.resx: |
      <root>
        <data name="Greeting"><value>Hello</value></data>
      </root>
    Strings.fr.resx: |
      <root>
        <data name="Greeting"><value>Bonjour</value></data>
        <data name="Farewell"><value>Au revoir</value></data>
      </root>
  config: |
    version: 1
    rules:
      - id: resx-strings-match
        kind: key_parity
        reference: Strings.resx
        peers: "Strings.*.resx"
        format: resx
        direction: extra
        level: error

when: [check]

expect:
  - exit: policy_failure
    violations:
      - {rule: resx-strings-match, level: error, path: Strings.fr.resx}
