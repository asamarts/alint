test_version: 1
name: key_parity nested under for_each_dir compares each directory's files
tags: [check, key_parity, for_each_dir, cross_file, nested]

given:
  tree:
    apps:
      web:
        en.json: '{"a": 1, "b": 2}'
        fr.json: '{"a": 1}'
      admin:
        en.json: '{"a": 1}'
        fr.json: '{"a": 1}'
  config: |
    version: 1
    rules:
      - id: app-locale-parity
        kind: for_each_dir
        select: "apps/*"
        level: error
        require:
          - kind: key_parity
            reference: "{path}/en.json"
            peers: "{path}/fr.json"

when: [check]

expect:
  - exit: policy_failure
    violations:
      - {rule: app-locale-parity, level: error, path: apps/web/fr.json}
    analysis_failures: []
