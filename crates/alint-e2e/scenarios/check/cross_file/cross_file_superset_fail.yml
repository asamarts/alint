name: cross_file superset fires when a target value is missing from the source set

docs:
  title: A used value missing from the allow-list
  case: fail
  kind: cross_file

given:
  tree:
    allowed.json: |
      {"allowed": ["a", "b"]}
    used.json: |
      {"used": ["a", "x"]}
  config: |
    version: 1
    rules:
      - id: used-are-allowed
        kind: cross_file
        source:
          file: allowed.json
          extract: { json: "$.allowed[*]" }
        targets:
          files: "used.json"
          extract: { json: "$.used[*]" }
        relation: superset
        level: error

when: [check]

expect:
  - violations:
      - {rule: used-are-allowed, level: error, path: used.json}
