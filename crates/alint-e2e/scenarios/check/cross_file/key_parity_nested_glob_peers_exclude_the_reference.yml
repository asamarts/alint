test_version: 1
name: a nested key_parity leaves its templated reference out of the peers its glob selects
tags: [check, key_parity, for_each_file, cross_file, nested]

# `{path}` and `{dir}` render with `/` on every platform (#579), matching the
# index's normalized paths. key_parity reads the reference as the index spells
# it on every OS, so it is no peer of itself, and a glob that selects only the
# reference is an evaluation failure.

given:
  tree:
    web:
      en.json: '{"a": 1, "b": 2}'
      fr.json: '{"a": 1}'
    solo:
      en.json: '{"a": 1}'
  config: |
    version: 1
    rules:
      - id: locale-parity
        kind: for_each_file
        select: "*/en.json"
        level: error
        require:
          - kind: key_parity
            reference: "{path}"
            peers: "{dir}/*.json"

when: [check]

expect:
  - exit: policy_failure
    violations:
      - {rule: locale-parity, level: error, path: web/fr.json, message: {regex: "missing key `b`"}}
    analysis_failures:
      - {rule: locale-parity, kind: evaluation, path: solo/en.json, message: {exact: 'solo/en.json: `peers` glob "solo/*.json" matched no files other than the reference'}}
