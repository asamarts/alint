test_version: 1
name: constraint grouped by path gives every file a group, an empty one too
tags: [check, constraint, cross_file, version_two, failing]

given:
  tree:
    locales/en.json: |
      {
        "home": "Home",
        "about": "About"
      }
    locales/fr.json: |
      {
        "home": "Accueil"
      }
    locales/de.json: |
      {}
  config: |
    version: 2
    relations:
      keys:
        from: { paths: "locales/*.json" }
        entries: { format: json, at: "$", leaves: true }
        fields: { file: path, key: entry.path }
    rules:
      - id: files-match-english
        kind: constraint
        input: keys
        assert:
          set: { field: key, group_by: file, equal_to: { group: locales/en.json } }
        level: error

when: [check]

expect:
  - exit: policy_failure
    violations:
      - rule: files-match-english
        path: locales/de.json
        message: {exact: "`file` \"locales/de.json\" lacks `key` \"home\", which `file` \"locales/en.json\" holds"}
        related:
          - {label: "the reference group's row with it", path: locales/en.json, line: 2, column: 3, end_line: 2, end_column: 9}
      - rule: files-match-english
        path: locales/de.json
        message: {exact: "`file` \"locales/de.json\" lacks `key` \"about\", which `file` \"locales/en.json\" holds"}
        related:
          - {label: "the reference group's row with it", path: locales/en.json, line: 3, column: 3, end_line: 3, end_column: 10}
      - rule: files-match-english
        path: locales/fr.json
        message: {exact: "`file` \"locales/fr.json\" lacks `key` \"about\", which `file` \"locales/en.json\" holds"}
        related:
          - {label: "the reference group's row with it", path: locales/en.json, line: 3, column: 3, end_line: 3, end_column: 10}
