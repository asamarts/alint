test_version: 1
name: key_parity nested under every_matching_has compares each match's files
tags: [check, key_parity, every_matching_has, cross_file, nested]

given:
  tree:
    packages:
      ui:
        locales:
          en.json: '{"a": 1, "b": 2}'
          de.json: '{"a": 1}'
          fr.json: '{"a": 1, "b": 2}'
  config: |
    version: 1
    rules:
      - id: package-locale-parity
        kind: every_matching_has
        select: "packages/*/locales"
        level: error
        require:
          - kind: key_parity
            reference: "{path}/en.json"
            peers: "{path}/*.json"

when: [check]

expect:
  - exit: policy_failure
    violations:
      - {rule: package-locale-parity, level: error, path: packages/ui/locales/de.json}
    analysis_failures: []
