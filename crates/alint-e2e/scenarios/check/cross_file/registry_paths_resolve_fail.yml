name: registry_paths_resolve fires when a declared workspace member is missing
tags: [check, registry_paths_resolve, cross_file]

docs:
  title: A declared workspace member that does not exist
  case: fail
  kind: registry_paths_resolve

given:
  tree:
    Cargo.toml: |
      [workspace]
      members = ["crates/core", "crates/cli"]
    crates:
      core:
        Cargo.toml: |
          [package]
          name = "core"
  config: |
    version: 1
    rules:
      - id: workspace-members-resolve
        kind: registry_paths_resolve
        source: Cargo.toml
        extract: { toml: "$.workspace.members[*]" }
        expect: dir
        must_contain: Cargo.toml
        level: error

when: [check]

expect:
  - violations:
      - {rule: workspace-members-resolve, level: error, path: Cargo.toml}
