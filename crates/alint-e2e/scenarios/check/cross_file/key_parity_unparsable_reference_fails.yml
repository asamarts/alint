test_version: 1
name: key_parity fails loudly on an unparsable reference
tags: [check, key_parity, cross_file, failing]

given:
  tree:
    locales:
      en.json: |
        {"nav": {"home": "Home"
      fr.json: |
        {"nav": {"home": "Accueil"}}
  config: |
    version: 1
    rules:
      - id: locales-match-english
        kind: key_parity
        reference: locales/en.json
        peers: "locales/*.json"
        level: error

when: [check]

expect:
  - exit: policy_failure
    violations: []
    analysis_failures:
      - {rule: locales-match-english, kind: resource_parse, path: locales/en.json}
