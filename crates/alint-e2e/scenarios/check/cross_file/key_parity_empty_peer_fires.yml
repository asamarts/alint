test_version: 1
name: key_parity reports every reference key missing from an empty peer
tags: [check, key_parity, cross_file, failing]

given:
  tree:
    locales:
      en.json: |
        {"nav": {"home": "Home"}, "title": "Title"}
      fr.json: |
        {}
  config: |
    version: 1
    rules:
      - id: locales-match-english
        kind: key_parity
        reference: locales/en.json
        peers: "locales/*.json"
        level: error

when: [check]

expect:
  - exit: policy_failure
    violations:
      - {rule: locales-match-english, level: error, path: locales/fr.json, message: {regex: "missing key `nav\\.home`"}, related: [{label: reference key, path: locales/en.json}]}
      - {rule: locales-match-english, level: error, path: locales/fr.json, message: {regex: "missing key `title`"}}
