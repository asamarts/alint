test_version: 1
name: constraint compares each package's dependencies and scripts with another relation's field
tags: [check, constraint, cross_file, version_two, failing]

given:
  tree:
    approved.json: |
      {
        "react": "UI",
        "react-dom": "UI",
        "zod": "validation"
      }
    banned.json: |
      {
        "left-pad": "unmaintained"
      }
    template/package.json: |
      {
        "scripts": {
          "build": "tsc",
          "test": "vitest"
        }
      }
    packages/web/package.json: |
      {
        "name": "web",
        "scripts": {
          "build": "vite build",
          "test": "vitest"
        },
        "dependencies": {
          "react": "^18.2.0",
          "left-pad": "^1.3.0"
        }
      }
    packages/api/package.json: |
      {
        "name": "api",
        "scripts": {
          "build": "tsc",
          "start": "node dist"
        },
        "dependencies": {
          "zod": "^3.22.0"
        }
      }
  config: |
    version: 2
    relations:
      deps:
        from: { paths: "packages/*/package.json" }
        entries: { format: json, at: "$.dependencies" }
        fields: { manifest: path, dependency: entry.key }
      approved:
        from: { paths: approved.json }
        entries: { format: json, at: "$" }
        fields: { name: entry.key }
      banned:
        from: { paths: banned.json }
        entries: { format: json, at: "$" }
        fields: { name: entry.key }
      scripts:
        from: { paths: "packages/*/package.json" }
        entries: { format: json, at: "$.scripts" }
        fields: { manifest: path, script: entry.key }
      template:
        from: { paths: template/package.json }
        entries: { format: json, at: "$.scripts" }
        fields: { script: entry.key }
    rules:
      - id: approved-dependencies
        kind: constraint
        input: deps
        assert:
          set: { field: dependency, group_by: manifest, subset_of: { relation: approved, field: name } }
        level: error
      - id: no-banned-dependencies
        kind: constraint
        input: deps
        assert:
          set: { field: dependency, disjoint_from: { relation: banned, field: name } }
        level: error
      - id: scripts-match-the-template
        kind: constraint
        input: scripts
        assert:
          set: { field: script, group_by: manifest, equal_to: { relation: template, field: script } }
        level: warning

when: [check]

expect:
  - exit: policy_failure
    violations:
      - rule: scripts-match-the-template
        level: warning
        path: packages/api/package.json
        message: {exact: "`manifest` \"packages/api/package.json\" lacks `script` \"test\", which `script` of relation `template` holds"}
        related:
          - {label: "the row of relation `template` with it", path: template/package.json, line: 4, column: 5, end_line: 4, end_column: 11}
      - rule: scripts-match-the-template
        level: warning
        path: packages/api/package.json
        line: 5
        column: 5
        end_line: 5
        end_column: 12
        message: {exact: "`manifest` \"packages/api/package.json\" holds `script` \"start\", which `script` of relation `template` lacks"}
      - rule: approved-dependencies
        path: packages/web/package.json
        line: 9
        column: 5
        end_line: 9
        end_column: 15
        message: {exact: "`manifest` \"packages/web/package.json\" holds `dependency` \"left-pad\", which `name` of relation `approved` lacks"}
      - rule: no-banned-dependencies
        path: packages/web/package.json
        line: 9
        column: 5
        end_line: 9
        end_column: 15
        message: {exact: "relation `deps` and `name` of relation `banned` both hold `dependency` \"left-pad\""}
        related:
          - {label: "the row of relation `banned` with it", path: banned.json, line: 2, column: 3, end_line: 2, end_column: 13}
