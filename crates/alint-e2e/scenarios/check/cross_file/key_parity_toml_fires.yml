test_version: 1
name: key_parity reports a missing TOML key
tags: [check, key_parity, cross_file, toml]

given:
  tree:
    locales:
      en.toml: |
        [nav]
        home = "Home"
        about = "About"
      fr.toml: |
        [nav]
        home = "Accueil"
  config: |
    version: 1
    rules:
      - id: locales-match-english
        kind: key_parity
        reference: locales/en.toml
        peers: "locales/*.toml"
        level: error

when: [check]

expect:
  - exit: policy_failure
    violations:
      - {rule: locales-match-english, level: error, path: locales/fr.toml}
