test_version: 1
name: a nested message shows a directory name that spells a message placeholder as it is named
tags: [check, for_each_dir, pair, cross_file, nested]

# The iteration renders `{basename}` in the nested pair's message as the
# directory's name, `x{{ctx.primary}}`. pair renders its message again for each
# finding, filling `{{ctx.primary}}` and `{{ctx.partner}}`; the placeholder
# spelled in the name stays text. Before the fix the message read
# `pk/x{{ctx.primary}}/a.c` in place of the name.

given:
  tree:
    pk:
      "x{{ctx.primary}}":
        a.c: "int a;\n"
  config: |
    version: 1
    rules:
      - id: package-header
        kind: for_each_dir
        select: "pk/*"
        level: error
        require:
          - kind: pair
            primary: "{path}/*.c"
            partner: "{path}/api.h"
            message: "package {basename}: {{ctx.primary}} has no header"

when: [check]

expect:
  - exit: policy_failure
    violations:
      - {rule: package-header, level: error, path: "pk/x{{ctx.primary}}/a.c", message: {regex: '^package x\{\{ctx\.primary\}\}: pk[/\\]x\{\{ctx\.primary\}\}[/\\]a\.c has no header$'}}
    analysis_failures: []
