test_version: 1
name: constraint compares every Node version with the one .nvmrc pins
tags: [check, constraint, cross_file, version_two, failing]

given:
  tree:
    .nvmrc: "20.11.1\n"
    package.json: |
      {"engines": {"node": "20.11.1"}}
    apps:
      site:
        package.json: |
          {"engines": {"node": "18.19.0"}}
  config: |
    version: 2
    relations:
      node-pins:
        union:
          - from: { paths: .nvmrc }
            read: { regex: '^v?(\d+\.\d+\.\d+)' }
          - from: { paths: ["package.json", "apps/*/package.json"] }
            read: { json: "$.engines.node" }
        fields: { source: path, node: value }
    rules:
      - id: node-matches-nvmrc
        kind: constraint
        input: node-pins
        assert:
          equal:
            field: node
            to: { row: { source: .nvmrc } }
        level: error

when: [check]

expect:
  - exit: policy_failure
    violations:
      - rule: node-matches-nvmrc
        path: apps/site/package.json
        message: {exact: "`node` is \"18.19.0\" here, but \"20.11.1\" in the source row (`source` \".nvmrc\", at .nvmrc)"}
        related:
          - {label: the source row, path: .nvmrc}
