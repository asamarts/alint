test_version: 1
name: constraint reports a group that set.groups names and no row holds
tags: [check, constraint, cross_file, version_two, failing]

given:
  tree:
    messages.json: |
      {
        "en": {"home": "Home", "about": "About"},
        "fr": {"home": "Accueil", "about": "À propos"}
      }
  config: |
    version: 2
    relations:
      messages:
        from: { paths: messages.json }
        entries: { format: json, at: ["$.en", "$.fr"] }
        fields: { locale: entry.parent, message: entry.key }
    rules:
      - id: every-locale-ships
        kind: constraint
        input: messages
        assert:
          set: { field: message, group_by: locale, equal_to: { group: en }, groups: [fr, de] }
        level: error

when: [check]

expect:
  - exit: policy_failure
    violations:
      - rule: every-locale-ships
        message: {exact: "`locale` \"de\" lacks `message` \"home\", which `locale` \"en\" holds"}
        related:
          - {label: "the reference group's row with it", path: messages.json, line: 2, column: 10, end_line: 2, end_column: 16}
      - rule: every-locale-ships
        message: {exact: "`locale` \"de\" lacks `message` \"about\", which `locale` \"en\" holds"}
        related:
          - {label: "the reference group's row with it", path: messages.json, line: 2, column: 26, end_line: 2, end_column: 33}
