test_version: 1
name: constraint reports a dependency held at two ranges across workspace manifests
tags: [check, constraint, cross_file, version_two, failing]

docs:
  title: A dependency at two ranges across workspace manifests
  case: fail
  kind: constraint

given:
  tree:
    packages:
      app:
        package.json: |
          {
            "name": "app",
            "dependencies": {
              "react": "^18.2.0",
              "lodash": "^4.17.21"
            }
          }
      web:
        package.json: |
          {
            "name": "web",
            "dependencies": {
              "react": "^18.2.0"
            }
          }
      legacy:
        package.json: |
          {
            "name": "legacy",
            "dependencies": {
              "react": "^17.0.2"
            }
          }
  config: |
    version: 2
    selectors:
      manifests:
        paths: "packages/*/package.json"
    relations:
      dependency-ranges:
        from: manifests
        entries:
          format: json
          at: ["$.dependencies", "$.devDependencies"]
        fields: { dependency: entry.key, range: entry.value }
    rules:
      - id: one-range-per-dependency
        kind: constraint
        input: dependency-ranges
        assert:
          unique: { key: [dependency], determines: [range] }
        level: error

when: [check]

expect:
  - exit: policy_failure
    violations:
      - rule: one-range-per-dependency
        level: error
        path: packages/app/package.json
        line: 4
        column: 14
        end_line: 4
        end_column: 23
        message:
          exact: "rows with `dependency` \"react\" disagree on `range`: \"^18.2.0\" here and in 1 other row; \"^17.0.2\" in 1 row"
        related:
          - {label: a row with another value, path: packages/legacy/package.json, line: 4, column: 14, end_line: 4, end_column: 23}
          - {label: another row with this value, path: packages/web/package.json, line: 4, column: 14, end_line: 4, end_column: 23}
      - rule: one-range-per-dependency
        level: error
        path: packages/legacy/package.json
        line: 4
        column: 14
        end_line: 4
        end_column: 23
        message:
          exact: "rows with `dependency` \"react\" disagree on `range`: \"^17.0.2\" here; \"^18.2.0\" in 2 rows"
        related:
          - {label: a row with another value, path: packages/app/package.json, line: 4, column: 14, end_line: 4, end_column: 23}
