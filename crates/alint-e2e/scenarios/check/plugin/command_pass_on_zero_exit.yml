name: command plugin is silent when the wrapped checker passes every file
# linux-only: the wrapped command is a POSIX `sh` one-liner; the command rule's
# macOS runner behaviour (env-var limits / sandboxing) is tracked separately, so
# the happy path is exercised on Linux and the CLI trycmd tests cover Windows.
tags: [check, command, plugin, linux-only, passing]

docs:
  title: Files the wrapped checker passes
  case: pass
  kind: command

# The same wrapped `grep` checker as the fail case, over a tree with no `TODO`
# markers: every matched file exits 0, so the rule is silent.

given:
  tree:
    src:
      main.rs: "fn main() {}\n"
      lib.rs: "pub fn ok() {}\n"
  config: |
    version: 1
    rules:
      - id: no-todo-markers
        kind: command
        paths: "src/**/*.rs"
        command: ["sh", "-c", "if grep -n TODO \"{path}\"; then exit 1; fi"]
        level: error

when: [check]

expect:
  - violations: []
