name: dotenv_path_absent is silent when .env commits no secret
tags: [check, dotenv_path_absent, structured, passing]

docs:
  title: A .env with no committed secret
  case: pass
  kind: dotenv_path_absent

given:
  tree:
    ".env": |
      NODE_ENV=production
      PORT=8080
  config: |
    version: 1
    rules:
      - id: no-committed-secret
        kind: dotenv_path_absent
        paths: ".env"
        path: "$.AWS_SECRET_ACCESS_KEY"
        level: error

when: [check]

expect:
  - violations: []
