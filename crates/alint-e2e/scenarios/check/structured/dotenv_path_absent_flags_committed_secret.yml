name: dotenv_path_absent flags a committed AWS secret in .env
tags: [check, dotenv_path_absent]

docs:
  title: A .env that commits an AWS secret
  case: fail
  kind: dotenv_path_absent

given:
  tree:
    ".env": |
      NODE_ENV=production
      AWS_SECRET_ACCESS_KEY=wJalrXUtnFEMIexampleKEY
  config: |
    version: 1
    rules:
      - id: no-committed-secret
        kind: dotenv_path_absent
        paths: ".env"
        path: "$.AWS_SECRET_ACCESS_KEY"
        level: error
        message: >-
          A secret is committed in .env; move it to a secrets manager and keep
          .env out of version control.

when: [check]

expect:
  - violations:
      - {rule: no-committed-secret, level: error, path: .env}
