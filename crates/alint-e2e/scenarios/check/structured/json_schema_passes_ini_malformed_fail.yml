name: json_schema_passes flags a malformed .ini with one parse-error violation
tags: [check, json_schema_passes, structured, ini, failing]

# The ini parse-error path (symmetry with the dotenv/properties/xml malformed
# scenarios): an unclosed section header fails to parse and yields exactly ONE
# parse-error violation, not a flood.

given:
  tree:
    schemas:
      any.schema.json: |
        {
          "$schema": "https://json-schema.org/draft/2020-12/schema",
          "type": "object"
        }
    "config.ini": |
      [server
      port = 8080
  config: |
    version: 1
    rules:
      - id: ini-parse
        kind: json_schema_passes
        paths: "config.ini"
        schema_path: "schemas/any.schema.json"
        level: error

when: [check]

expect:
  - violations:
      - {rule: ini-parse, level: error, path: config.ini}
