name: ini_path_equals is silent when the server port is canonical
tags: [check, ini_path_equals, structured, passing]

docs:
  title: An .ini on the canonical port
  case: pass
  kind: ini_path_equals

given:
  tree:
    "config.ini": |
      [server]
      port = 8080
  config: |
    version: 1
    rules:
      - id: canonical-port
        kind: ini_path_equals
        paths: "config.ini"
        path: "$['server']['port']"
        equals: "8080"
        level: error

when: [check]

expect:
  - violations: []
