name: hcl_path_equals is silent when the instance count is canonical
tags: [check, hcl_path_equals, structured, hcl, passing]

docs:
  title: A Terraform instance on the canonical count
  case: pass
  kind: hcl_path_equals

given:
  tree:
    "main.tf": |
      resource "aws_instance" "web" {
        ami   = "ami-123"
        count = 1
      }
  config: |
    version: 1
    rules:
      - id: single-instance
        kind: hcl_path_equals
        paths: "main.tf"
        path: "$.resource.aws_instance.web.count"
        equals: 1
        level: error

when: [check]

expect:
  - violations: []
