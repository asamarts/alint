name: hcl_path_equals flags a .tf whose instance count is wrong
tags: [check, hcl_path_equals]

docs:
  title: A Terraform instance on the wrong count
  case: fail
  kind: hcl_path_equals

given:
  tree:
    "main.tf": |
      resource "aws_instance" "web" {
        ami   = "ami-123"
        count = 2
      }
  config: |
    version: 1
    rules:
      - id: single-instance
        kind: hcl_path_equals
        paths: "main.tf"
        path: "$.resource.aws_instance.web.count"
        equals: 1
        level: error

when: [check]

expect:
  - violations:
      - {rule: single-instance, level: error, path: main.tf}
