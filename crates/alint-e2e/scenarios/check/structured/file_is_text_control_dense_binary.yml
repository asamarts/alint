test_version: 1
name: file_is_text flags NUL-free control-dense binary while accepting UTF-8 text
tags: [check, file_is_text, content, failing]

given:
  tree:
    clean.txt: "Hello, world!\nLine two with tabs\tand punctuation.\n"
    control.bin: "\u0001\u0002\u0003\u0004\u0005\u0006\u0007\u0008\u000E\u000F\u0010\u0011\u0012\u0013\u0014\u0015\u0016\u0017\u0018\u0019\u001A\u001B\u001C\u001D\u001E\u001F"
  config: |
    version: 1
    rules:
      - id: text-only
        kind: file_is_text
        paths: ["clean.txt", "control.bin"]
        level: error

when: [check]

expect:
  - exit: policy_failure
    violations:
      - rule: text-only
        level: error
        path: control.bin
