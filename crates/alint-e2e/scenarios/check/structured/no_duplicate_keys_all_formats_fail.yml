test_version: 1
name: no_duplicate_keys flags duplicates across YAML, JSON, dotenv, properties, INI, and HCL
tags: [check, no_duplicate_keys, structured, failing]

given:
  tree:
    dup.yaml: |
      a: 1
      a: 2
    dup.json: |
      { "k": 1, "k": 2 }
    .env: |
      API_URL=http://a
      API_URL=http://b
    app.properties: |
      app.name = one
      app.name = two
    config.ini: |
      [sec]
      k = 1
      [other]
      k = 9
      [sec]
      k = 2
    main.tf: |
      tags = {
        env = "prod",
        "env" = "staging"
      }
  config: |
    version: 1
    rules:
      - id: no-dups
        kind: no_duplicate_keys
        paths: ["dup.yaml", "dup.json", ".env", "app.properties", "config.ini", "main.tf"]
        level: error

when: [check]

expect:
  - exit: policy_failure
    violations:
      - rule: no-dups
        level: error
        path: .env
        message:
          regex: "API_URL"
      - rule: no-dups
        level: error
        path: app.properties
        message:
          regex: "app\\.name"
      - rule: no-dups
        level: error
        path: config.ini
        message:
          regex: "sec"
      - rule: no-dups
        level: error
        path: dup.json
        message:
          regex: '`k`'
      - rule: no-dups
        level: error
        path: dup.yaml
        message:
          regex: '`a`'
      - rule: no-dups
        level: error
        path: main.tf
        message:
          regex: '`env`'
