test_version: 1
name: no_duplicate_keys flags repeated keys in YAML and JSON files
tags: [check, no_duplicate_keys, structured, failing]

docs:
  title: Workflow YAML and JSON files with duplicate keys
  case: fail
  kind: no_duplicate_keys

given:
  tree:
    .github:
      workflows:
        ci.yml: |
          jobs:
            build:
              runs-on: ubuntu-latest
          jobs:
            test:
              runs-on: ubuntu-latest
    config.json: |
      {
        "port": 8080,
        "port": 9090
      }
  config: |
    version: 1
    rules:
      - id: no-dup-keys
        kind: no_duplicate_keys
        paths: ["**/*.yml", "**/*.json"]
        level: error

when: [check]

expect:
  - exit: policy_failure
    violations:
      - {rule: no-dup-keys, level: error, path: .github/workflows/ci.yml, line: 4, column: 1, end_line: 4, end_column: 5}
      - {rule: no-dup-keys, level: error, path: config.json, line: 3, column: 3, end_line: 3, end_column: 9}
