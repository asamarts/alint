name: json_schema_passes flags a malformed .properties with one parse-error violation
tags: [check, json_schema_passes, structured, properties, failing]

# The properties parse-error path (symmetry with the dotenv/xml malformed
# scenarios): a .properties with an invalid `\uXXXX` escape fails to parse and
# yields exactly ONE parse-error violation, not a flood.

given:
  tree:
    schemas:
      any.schema.json: |
        {
          "$schema": "https://json-schema.org/draft/2020-12/schema",
          "type": "object"
        }
    "application.properties": |
      server.port=8080
      bad=\uZZZZ
  config: |
    version: 1
    rules:
      - id: props-parse
        kind: json_schema_passes
        paths: "application.properties"
        schema_path: "schemas/any.schema.json"
        level: error

when: [check]

expect:
  - violations:
      - {rule: props-parse, level: error, path: application.properties}
