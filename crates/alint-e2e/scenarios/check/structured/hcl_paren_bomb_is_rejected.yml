name: hcl rejects a parenthesis bomb with one parse-error violation, not a crash
tags: [check, hcl_path_absent, structured, hcl, failing]

# SAFETY (adversarial-review regression): the original `{`/`[`-only depth guard was
# BYPASSED by nested parentheses / function calls / unary chains / interpolation --
# hcl-rs recurses on them and stack-overflows (SIGABRT, whole-process abort). The
# hardened guard counts `(` too, so a 600-deep paren bomb is one parse-error
# violation. If the guard regressed, `alint check` would CRASH here instead.

