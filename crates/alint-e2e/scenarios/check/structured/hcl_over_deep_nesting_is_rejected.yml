test_version: 1
name: hcl over-deep nesting is rejected with one parse analysis failure, not a crash
tags: [check, hcl_path_absent, structured, hcl, failing]

# SAFETY: hcl-edit 0.10 enforces a native MAX_NESTING_DEPTH=64 bound directly on
# normal worker stacks (and structured_format/hcl.rs bounds block+label nesting
# and object-key work). An over-deep file must be rejected as ONE parse analysis
# failure through the real binary without crashing. The value is a 300-deep
# nested tuple.

given:
  tree:
    "deep.tf": |
      x = [[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[1]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]
  config: |
    version: 1
    rules:
      - id: probe
        kind: hcl_path_absent
        paths: "deep.tf"
        path: "$.nonexistent"
        level: error

when: [check]

expect:
  - exit: policy_failure
    violations: []
    analysis_failures:
      - {rule: probe, kind: resource_parse, path: deep.tf}
