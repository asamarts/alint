[package]
name = "alint-e2e"
description = "Internal: end-to-end scenario tests for alint. Not a library."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false
autotests = false

# All integration tests build into one binary: tests/main.rs declares each
# file as a module (docs/design/build-dev-loop.md, section 2).
[[test]]
name = "it"
path = "tests/main.rs"

[dependencies]

[dev-dependencies]
alint-core.workspace = true
alint-dsl.workspace = true
alint-output.workspace = true
alint-rules.workspace = true
alint-testkit = { workspace = true, features = ["strategies"] }
dir-test.workspace = true
jsonschema.workspace = true
proptest.workspace = true
roxmltree.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
yaml_serde.workspace = true
tempfile.workspace = true
toml.workspace = true

[lints]
workspace = true
