[package]
name = "alint-bench"
description = "Benchmark harness and deterministic fixture generator for alint"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lib]
bench = false

[features]
default = []
# Filesystem-walking benches are feature-gated because they are inherently
# noisier than the pure-CPU benches — useful for characterizing, not gating.
fs-benches = []
# Adds the 100k tier to the deterministic `det_check` binary bench. Heavy under
# valgrind (~100s/cell), so it's release-time only — the per-PR gate runs 1k/10k.
det-100k = []

[[bench]]
name = "glob_compile"
harness = false

[[bench]]
name = "glob_match"
harness = false

[[bench]]
name = "regex_content"
harness = false

[[bench]]
name = "rule_engine"
harness = false

[[bench]]
name = "walker"
harness = false
required-features = ["fs-benches"]

[[bench]]
name = "single_file_rules"
harness = false
required-features = ["fs-benches"]

[[bench]]
name = "cross_file_rules"
harness = false

[[bench]]
name = "output_formats"
harness = false

[[bench]]
name = "fix_throughput"
harness = false
required-features = ["fs-benches"]

[[bench]]
name = "dsl_extends"
harness = false
required-features = ["fs-benches"]

[[bench]]
name = "structured_query"
harness = false
required-features = ["fs-benches"]

[[bench]]
name = "blame_cache"
harness = false
required-features = ["fs-benches"]

# Deterministic (Valgrind) benches — the load-immune regression gate.
# Run with: cargo bench -p alint-bench --bench det_engine
[[bench]]
name = "det_engine"
harness = false

# End-to-end: needs the release binary first (`cargo build --release -p alint`).
[[bench]]
name = "det_check"
harness = false

[dependencies]
alint-core.workspace = true
alint-dsl.workspace = true
alint-output.workspace = true
alint-rules.workspace = true
rand.workspace = true
rand_chacha.workspace = true
tempfile.workspace = true

[dev-dependencies]
criterion.workspace = true
regex.workspace = true
globset.workspace = true
gungraun = "0.20.0"

[lints]
workspace = true
