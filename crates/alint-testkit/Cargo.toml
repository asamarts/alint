[package]
name = "alint-testkit"
description = "Versioned policy-test models, hermetic runner, and repository fixture tools for alint rulesets."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "README.md"
autotests = false

[features]
default = []
strategies = ["dep:proptest"]

# All integration tests build into one binary: tests/main.rs declares each
# file as a module (docs/design/build-dev-loop.md, section 2).
[[test]]
name = "it"
path = "tests/main.rs"

[dependencies]
alint-core.workspace = true
alint-output.workspace = true
alint-dsl.workspace = true
alint-rules.workspace = true
proptest = { workspace = true, optional = true }
regex.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
ayaml.workspace = true
tempfile.workspace = true
thiserror.workspace = true

[dev-dependencies]
jsonschema.workspace = true

[lints]
workspace = true
