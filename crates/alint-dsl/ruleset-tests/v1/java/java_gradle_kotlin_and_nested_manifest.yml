test_version: 1
name: alint://bundled/java - nested Kotlin Gradle manifest activates java-no-tracked-build
tags: [check, extends, bundled, java, git_tracked_only]

# A nested Kotlin DSL Gradle manifest (`services/api/build.gradle.kts`) activates
# `facts.has_java` and `facts.has_gradle`, flagging committed `build/` outputs
# while still ignoring `**/src/**/build` source packages (#546).

given:
  tree:
    "settings.gradle.kts": "include(\":services:api\")\n"
    "gradlew": "#!/bin/sh\nexec gradle \"$@\"\n"
    "services":
      "api":
        "build.gradle.kts": "plugins { java }\n"
        "src":
          "main":
            "java":
              "com":
                "example":
                  "build":
                    "Helper.java": "package com.example.build;\npublic class Helper {}\n"
        "build":
          "out.txt": "tracked build output\n"
  config: |
    version: 1
    extends:
      - alint://bundled/java@v1
    rules:
      - id: java-manifest-exists
        level: off
  git:
    init: true
    add: [settings.gradle.kts, gradlew, services]
    commit: true

when: [check]

expect:
  - exit: policy_failure
    violations:
      - {rule: java-no-tracked-build, level: error, path: services/api/build}
