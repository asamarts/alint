test_version: 1
name: alint://bundled/java - force-added build outputs fire although .gitignore lists them
tags: [check, extends, bundled, java, git_tracked_only]

# The usual Java .gitignore lists target/, build/ and *.class, so the walk
# prunes them. Files force-added with `git add -f` are still tracked, and
# the git_tracked_only rules see them (#503).

given:
  tree:
    "pom.xml": |
      <?xml version="1.0" encoding="UTF-8"?>
      <project><modelVersion>4.0.0</modelVersion>
        <groupId>com.example</groupId>
        <artifactId>demo</artifactId>
        <version>1.0.0</version></project>
    ".gitignore": "target/\nbuild/\n*.class\n"
    "target":
      "classes":
        "Foo.class": "checked-in bytecode"
    "build":
      "classes":
        "Bar.class": "checked-in bytecode"
  config: |
    version: 1
    extends:
      - alint://bundled/java@v1
    rules:
      - id: java-build-wrapper-committed
        level: off
  git:
    init: true
    add: [pom.xml, .gitignore]
    add_force: [target/classes/Foo.class, build/classes/Bar.class]
    commit: true

when: [check]

expect:
  - exit: policy_failure
    violations:
      - {rule: java-no-tracked-target, level: error, path: target}
      - {rule: java-no-tracked-build, level: error, path: build}
      - {rule: java-no-class-files, level: error, path: target/classes/Foo.class}
      - {rule: java-no-class-files, level: error, path: build/classes/Bar.class}
