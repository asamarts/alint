test_version: 1
name: alint://bundled/java - java-no-tracked-build ignores source packages named build
tags: [check, extends, bundled, java, git_tracked_only]

# Java / Groovy source trees frequently contain packages named `build`
# (e.g. `src/main/java/org/gradle/internal/build`). `java-no-tracked-build`
# excludes `**/src/**/build` while still flagging committed Gradle output
# directories outside `src/` (#546).

given:
  tree:
    "build.gradle": "plugins { id 'java' }\n"
    "gradlew": "#!/bin/sh\nexec gradle \"$@\"\n"
    "src":
      "build":
        "RootBuild.java": "package build;\npublic class RootBuild {}\n"
      "main":
        "java":
          "org":
            "example":
              "build":
                "BuildHelper.java": "package org.example.build;\npublic class BuildHelper {}\n"
      "test":
        "java":
          "org":
            "example":
              "build":
                "BuildTest.java": "package org.example.build;\npublic class BuildTest {}\n"
    "platforms":
      "core":
        "src":
          "build":
            "NestedDirect.java": "package build;\npublic class NestedDirect {}\n"
          "main":
            "groovy":
              "org":
                "example":
                  "build":
                    "Fixture.groovy": "package org.example.build\nclass Fixture {}\n"
    "subproject":
      "build":
        "classes.txt": "nested gradle output\n"
    "buildSrc":
      "build":
        "cache.txt": "buildSrc gradle output\n"
    "build":
      "output.txt": "committed gradle output\n"
  config: |
    version: 1
    extends:
      - alint://bundled/java@v1
  git:
    init: true
    add: [build.gradle, gradlew, src, platforms, subproject, buildSrc, build]
    commit: true

when: [check]

expect:
  - exit: policy_failure
    violations:
      - {rule: java-no-tracked-build, level: error, path: build}
      - {rule: java-no-tracked-build, level: error, path: buildSrc/build}
      - {rule: java-no-tracked-build, level: error, path: subproject/build}
