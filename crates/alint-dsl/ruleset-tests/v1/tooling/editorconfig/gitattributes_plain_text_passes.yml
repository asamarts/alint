test_version: 1
name: tooling/editorconfig accepts * text eol=lf in .gitattributes
tags: [check, extends, bundled, editorconfig]

given:
  tree:
    .editorconfig: "root = true\n"
    .gitattributes: "* text eol=lf\n"
  config: |
    version: 1
    extends:
      - alint://bundled/tooling/editorconfig@v1

when: [check]

expect:
  - exit: success
    violations: []
