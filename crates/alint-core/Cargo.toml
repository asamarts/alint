[package]
name = "alint-core"
description = "Core types and execution engine for the alint language-agnostic repository linter."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage = "https://github.com/asamarts/alint"
readme = "../../README.md"
keywords = ["linter", "policy", "repository", "structure"]
categories = ["development-tools"]
authors.workspace = true

[dependencies]
thiserror.workspace = true
serde.workspace = true
serde_yaml_ng.workspace = true
serde_json.workspace = true
sha2.workspace = true
globset.workspace = true
ignore.workspace = true
rayon.workspace = true
regex.workspace = true
tracing.workspace = true
# Structured-document extract machinery hoisted from alint-rules:
# TOML/XML/JSONPath parsing behind `Format`/`ExtractSpec`, whose
# schemars derives feed `xtask gen-schema`.
schemars.workspace = true
serde_json_path.workspace = true
toml.workspace = true
roxmltree.workspace = true

[dev-dependencies]
tempfile.workspace = true
proptest.workspace = true

[lints]
workspace = true
