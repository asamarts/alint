[package]
name = "alint-core"
description = "Core types and execution engine for the alint language-agnostic repository linter."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"
keywords = ["linter", "policy", "repository", "structure"]
categories = ["development-tools"]
authors.workspace = true
autotests = false

# All integration tests build into one binary: tests/main.rs declares each
# file as a module (docs/design/build-dev-loop.md, section 2).
[[test]]
name = "it"
path = "tests/main.rs"

# The one exception: this test installs a counting global allocator, which in
# `it` would count every other test's allocations. It compares ayaml's heap with
# libyaml's, so it needs the reference parser (ADR-0042).
[[test]]
name = "yaml_memory"
path = "tests/alloc/yaml_memory.rs"
required-features = ["yaml-reference"]

# The same for the relation layer's entry extraction: the heap a deep, wide
# document takes, against a parse of it to a tree.
[[test]]
name = "relation_memory"
path = "tests/alloc/relation_memory.rs"

# And for placing a finding: the heap finding where a value is written takes,
# against the figure placing counts for it.
[[test]]
name = "placing_memory"
path = "tests/alloc/placing_memory.rs"

[dependencies]
thiserror.workspace = true
serde.workspace = true
ayaml.workspace = true
ref-cast.workspace = true
serde_json.workspace = true
sha2.workspace = true
globset.workspace = true
ignore.workspace = true
rayon.workspace = true
parking_lot.workspace = true
regex.workspace = true
regex-syntax.workspace = true
aho-corasick.workspace = true
tracing.workspace = true
# Structured-document extract machinery hoisted from alint-rules:
# TOML/XML/JSONPath parsing behind `Format`/`ExtractSpec`, whose
# schemars derives feed `xtask gen-schema`.
schemars.workspace = true
serde_json_path.workspace = true
toml.workspace = true
toml_edit.workspace = true
jsonc-parser.workspace = true
roxmltree.workspace = true
java-properties.workspace = true
encoding_rs.workspace = true
hcl.workspace = true
saphyr.workspace = true
saphyr-parser.workspace = true
adotenv.workspace = true
# The parser facade's reference backend (ADR-0041), behind the test-only
# `yaml-reference` feature, which no release build enables.
yaml_serde = { workspace = true, optional = true }

[target.'cfg(unix)'.dependencies]
rustix.workspace = true

[features]
# libyaml and saphyr as reference parsers, and `ALINT_YAML_PARSER` to choose
# one or to compare them with ayaml (ADR-0041). For alint's own tests only, and
# not a stable API: a crate that depends on alint-core must not enable it. If
# any crate in a build's dependency graph enables it, `ALINT_YAML_PARSER`
# chooses the parser of every YAML decode in the process, for every crate.
yaml-reference = ["dep:yaml_serde"]

[dev-dependencies]
tempfile.workspace = true
yaml_serde.workspace = true
proptest.workspace = true
syn.workspace = true
proc-macro2.workspace = true
cap.workspace = true

[lints]
workspace = true
