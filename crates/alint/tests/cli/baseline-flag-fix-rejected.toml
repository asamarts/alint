bin.name = "alint"
# W4: `fix` now SUPPORTS `--baseline` (baseline-aware fix). But `--strict-baseline`
# and `--show-baselined` remain check-only for now, and must still be rejected off
# `check` -- never a silent no-op. (Previously this pinned `fix --baseline`'s
# rejection, which W4 lifted.)
args = ["--strict-baseline", "fix"]
status.code = 2
fs.sandbox = true
stderr = "[..]apply only to `check`[..]"
