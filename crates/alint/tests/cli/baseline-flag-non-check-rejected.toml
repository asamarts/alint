bin.name = "alint"
# M12: `--baseline` only affects `check` and `fix` (W4 added `fix`); on other
# subcommands it was silently ignored (breaking "a missing baseline is never a
# silent no-op"). Now rejected loudly before any config load -- no fixtures needed.
args = ["--baseline", "bl.json", "list"]
status.code = 2
fs.sandbox = true
stderr = "[..]applies only to `check` and `fix`[..]"
