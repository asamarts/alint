[package]
name = "alint"
description = "Language-agnostic linter for repository structure, file existence, filename conventions, and file content rules."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage = "https://github.com/asamarts/alint"
readme = "../../README.md"
keywords = ["linter", "policy", "repository", "structure", "cli"]
categories = ["development-tools", "command-line-utilities"]
authors.workspace = true
autotests = false

[[bin]]
name = "alint"
path = "src/main.rs"

# All integration tests build into one binary: tests/main.rs declares each
# file as a module (docs/design/build-dev-loop.md, section 2).
[[test]]
name = "it"
path = "tests/main.rs"

[dependencies]
alint-core.workspace = true
alint-dsl.workspace = true
alint-rules.workspace = true
alint-output.workspace = true
alint-lsp.workspace = true
alint-testkit.workspace = true
anstream.workspace = true
anyhow.workspace = true
clap.workspace = true
miette.workspace = true
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
ayaml.workspace = true
supports-hyperlinks.workspace = true
terminal_size.workspace = true
indicatif.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
jsonschema.workspace = true
tempfile.workspace = true
trycmd.workspace = true

[target.'cfg(unix)'.dev-dependencies]
portable-pty.workspace = true

[lints]
workspace = true
